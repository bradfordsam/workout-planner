<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a12">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="manifest" href="manifest.json">
<title>Workout Planner</title>
<style>
:root{
  /* Base Colors */
  --bg:#0a0a12;--surf:#141420;--surf2:#1e1e2e;--surf3:#2a2a3e;
  --bdr:rgba(255,255,255,.07);--bdr-strong:rgba(255,255,255,.15);
  --acc:#818cf8;--acc2:rgba(129,140,248,.12);--acc-bright:#a5b4fc;
  --txt:#e2e8f0;--txt-dim:#cbd5e1;--mut:#64748b;--mut-light:#94a3b8;
  --ok:#34d399;--ok2:rgba(52,211,153,.12);--warn:#fbbf24;--warn2:rgba(251,191,36,.12);
  --bad:#f87171;--bad2:rgba(248,113,113,.12);

  /* Muscle Group Colors */
  --chest:#f87171;--back:#60a5fa;--shoulders:#a78bfa;
  --biceps:#34d399;--triceps:#fb923c;--legs:#f472b6;--core:#facc15;

  /* Enhanced Design System */
  --glass-bg:rgba(20,20,32,0.8);--glass-border:rgba(255,255,255,0.1);
  --shadow-sm:0 1px 2px 0 rgba(0,0,0,0.05);
  --shadow-md:0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
  --shadow-lg:0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -2px rgba(0,0,0,0.05);
  --shadow-xl:0 20px 25px -5px rgba(0,0,0,0.1), 0 10px 10px -5px rgba(0,0,0,0.04);
  --shadow-glow:0 0 20px rgba(129,140,248,0.3);
  --shadow-glow-sm:0 0 10px rgba(129,140,248,0.2);

  /* Gradients */
  --grad-primary:linear-gradient(135deg, var(--acc) 0%, var(--acc-bright) 100%);
  --grad-surface:linear-gradient(135deg, var(--surf) 0%, var(--surf2) 100%);
  --grad-glass:linear-gradient(135deg, rgba(20,20,32,0.9) 0%, rgba(30,30,46,0.8) 100%);
  --grad-accent:linear-gradient(135deg, #818cf8 0%, #a5b4fc 50%, #c7d2fe 100%);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;-webkit-tap-highlight-color:transparent}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:var(--bg);color:var(--txt);
  max-width:480px;margin:0 auto;overflow-x:hidden;
}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--surf);border-top:1px solid var(--bdr);display:flex;z-index:90;}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px 14px;border:none;background:none;color:var(--mut);font-size:10px;cursor:pointer;}
.nb.on{color:var(--acc)}
.nb svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.view{min-height:100vh;padding:24px 16px 100px}
.setup{min-height:100vh;padding:40px 16px 40px;display:flex;flex-direction:column}
.s-back{display:flex;align-items:center;gap:6px;color:var(--mut);font-size:14px;background:none;border:none;cursor:pointer;margin-bottom:28px;padding:0}
.s-title{font-size:26px;font-weight:800;line-height:1.2;margin-bottom:6px}
.s-sub{color:var(--mut);font-size:14px;margin-bottom:32px;line-height:1.5}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:24px}
.opts.col1{grid-template-columns:1fr}
.opts.col4{grid-template-columns:repeat(4,1fr)}
.opt{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px 12px;background:var(--surf);border:2px solid var(--bdr);border-radius:14px;cursor:pointer;text-align:center;transition:border-color .15s,background .15s;}
.opt.on{border-color:var(--acc);background:var(--acc2)}
.opt-v{font-size:28px;font-weight:800;margin-bottom:2px}
.opt-l{font-size:12px;color:var(--mut)}
.eq-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:24px}
.eq-item{display:flex;align-items:center;gap:8px;background:var(--surf);border:2px solid var(--bdr);border-radius:12px;padding:12px 10px;cursor:pointer;transition:border-color .15s,background .15s;}
.eq-item.on{border-color:var(--acc);background:var(--acc2)}
.eq-ico{font-size:20px;flex-shrink:0}
.eq-name{font-size:13px;font-weight:500;flex:1}
.eq-chk{width:18px;height:18px;border-radius:4px;border:2px solid var(--bdr);flex-shrink:0;display:flex;align-items:center;justify-content:center}
.eq-item.on .eq-chk{background:var(--acc);border-color:var(--acc)}
.dots{display:flex;gap:6px;justify-content:center;margin-top:auto;padding-top:24px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--bdr);transition:background .2s}
.dot.on{background:var(--acc)}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;padding:14px 20px;border-radius:13px;font-size:15px;font-weight:700;border:none;cursor:pointer;width:100%;transition:opacity .15s,transform .1s;}
.btn:active{transform:scale(.97);opacity:.85}
.btn-p{background:var(--acc);color:#0a0a12}
.btn-s{background:var(--acc2);color:var(--acc)}
.btn-g{background:transparent;border:1px solid var(--bdr);color:var(--txt)}
.btn-ok{background:var(--ok);color:#0a0a12}
.btn-sm{padding:10px 16px;font-size:13px;border-radius:10px}
.card{background:var(--surf);border:1px solid var(--bdr);border-radius:14px;padding:16px;margin-bottom:12px}
.card2{background:var(--surf2);border:1px solid var(--bdr);border-radius:10px;padding:12px}
.today{background:linear-gradient(135deg,var(--surf2) 0%,#1a1a30 100%);border:1px solid var(--acc2);border-radius:16px;padding:20px;margin-bottom:14px;}
.t-lbl{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--acc);margin-bottom:4px}
.t-name{font-size:24px;font-weight:800;margin-bottom:2px}
.t-desc{font-size:13px;color:var(--mut);margin-bottom:14px}
.t-exlist{margin-bottom:16px}
.t-ex{font-size:13px;padding:3px 0;display:flex;align-items:center;gap:6px}
.wk-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:20px}
.wk-day{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;border-radius:10px}
.wk-day.today{background:var(--acc2)}
.wk-dn{font-size:10px;color:var(--mut)}
.wk-dot{width:8px;height:8px;border-radius:50%}
.sec-lbl{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--mut);margin-bottom:10px}
.wkt-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.wkt-day{font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--acc)}
.wkt-prog{font-size:13px;color:var(--mut)}
.ex-card{background:var(--surf);border:1px solid var(--bdr);border-radius:16px;padding:20px;margin-bottom:12px}
.ex-name{font-size:22px;font-weight:800;margin-bottom:6px;line-height:1.2}
.m-tag{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px;}
.cue-btn{font-size:13px;color:var(--acc);background:none;border:none;cursor:pointer;padding:0;margin-bottom:10px;display:flex;align-items:center;gap:4px}
.cue-txt{font-size:13px;color:var(--mut);line-height:1.6;background:var(--surf2);padding:12px;border-radius:10px;margin-bottom:12px;display:none}
.cue-txt.open{display:block}
.wu-box{background:rgba(251,191,36,.06);border:1px solid rgba(251,191,36,.2);border-radius:12px;padding:14px;margin-bottom:14px}
.wu-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--warn);margin-bottom:8px}
.wu-row{font-size:13px;margin-bottom:5px;display:flex;gap:8px}
.wu-set{color:var(--mut)}
.wu-val{font-weight:600}
.wu-note{font-size:11px;color:var(--mut);margin-top:6px}
.last-info{font-size:13px;color:var(--mut);margin-bottom:6px}
.prog-hint{font-size:13px;color:var(--ok);background:rgba(52,211,153,.08);border-radius:8px;padding:8px 12px;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.sets-hdr{display:grid;grid-template-columns:28px 50px 1fr 1fr 38px;gap:4px;margin-bottom:6px}
.sh{font-size:11px;color:var(--mut);text-align:center}
.set-row{display:grid;grid-template-columns:28px 50px 1fr 1fr 38px;gap:4px;align-items:center;margin-bottom:6px}
.sn{font-size:13px;color:var(--mut);text-align:center}
.st{font-size:12px;color:var(--mut);text-align:center}
.ni{background:var(--surf2);border:1px solid var(--bdr);border-radius:8px;color:var(--txt);font-size:15px;font-weight:700;text-align:center;padding:8px 2px;width:100%;appearance:textfield;-moz-appearance:textfield;}
.ni::-webkit-outer-spin-button,.ni::-webkit-inner-spin-button{-webkit-appearance:none}
.ni:focus{outline:none;border-color:var(--acc)}
.done-btn{width:36px;height:36px;border-radius:8px;border:none;cursor:pointer;background:var(--surf2);color:var(--mut);font-size:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.set-row.done .sn,.set-row.done .st{color:var(--ok)}
.set-row.done .ni{background:rgba(52,211,153,.08);border-color:rgba(52,211,153,.2);color:var(--ok)}
.set-row.done .done-btn{background:var(--ok);color:#0a0a12}
.ex-nav{display:flex;gap:8px;margin-top:8px}
.ex-nav-btn{flex:1;padding:12px;border-radius:12px;font-size:14px;font-weight:600;border:1px solid var(--bdr);background:var(--surf);color:var(--txt);cursor:pointer}
.abandon{padding:10px;border-radius:10px;font-size:13px;border:1px solid var(--bdr);background:transparent;color:var(--mut);cursor:pointer;width:100%;margin-top:8px}
#rest-ov{display:none;position:fixed;inset:0;background:rgba(10,10,18,.92);backdrop-filter:blur(10px);z-index:999;flex-direction:column;align-items:center;justify-content:center;}
#rest-ov.on{display:flex}
.rest-inner{text-align:center;padding:32px}
.rest-lbl{font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--acc);margin-bottom:20px}
.tcircle{position:relative;width:160px;height:160px;margin:0 auto 16px}
.tcircle svg{position:absolute;inset:0}
#t-ring{fill:none;stroke:var(--acc);stroke-width:6;stroke-linecap:round;stroke-dasharray:339;stroke-dashoffset:0;transform:rotate(-90deg);transform-origin:60px 60px;transition:stroke-dashoffset .25s linear;}
.t-bg{fill:none;stroke:var(--surf2);stroke-width:6}
#t-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:800;}
.skip-rest{background:var(--surf2);color:var(--txt);border:1px solid var(--bdr);padding:12px 32px;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;margin-top:12px;}
.pg-day{background:var(--surf);border:1px solid var(--bdr);border-radius:14px;padding:16px;margin-bottom:10px}
.pg-day.today-day{border-color:var(--acc)}
.pg-dh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.pg-dn{font-size:15px;font-weight:700}
.pg-dd{font-size:12px;color:var(--mut)}
.pg-ex{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:4px}
.pg-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.log-item{background:var(--surf);border:1px solid var(--bdr);border-radius:14px;padding:16px;margin-bottom:10px;cursor:pointer}
.log-hdr{display:flex;align-items:center;justify-content:space-between}
.log-date{font-size:14px;font-weight:600}
.log-day{font-size:13px;color:var(--mut)}
.log-meta{font-size:12px;color:var(--mut);margin-top:4px}
.log-body{margin-top:12px;border-top:1px solid var(--bdr);padding-top:12px;display:none}
.log-body.open{display:block}
.log-ex{font-size:13px;margin-bottom:6px}
.log-sets{font-size:12px;color:var(--mut)}
.empty{text-align:center;padding:60px 16px;color:var(--mut)}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.shake{animation:shake .35s ease;border-color:var(--bad)!important}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mb8{margin-bottom:8px}
.hdg{font-size:20px;font-weight:800;margin-bottom:16px}
.sub{font-size:13px;color:var(--mut);margin-bottom:16px;line-height:1.5}
/* session badges */
.badge{display:inline-block;padding:3px 8px;border-radius:20px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;}
.badge-lunch{background:rgba(251,191,36,.15);color:var(--warn)}
.badge-eve{background:var(--acc2);color:var(--acc)}
/* calorie / cardio */
.cardio-list{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.cardio-row{display:flex;align-items:center;gap:10px;background:var(--surf2);border:1px solid var(--bdr);border-radius:12px;padding:10px 12px}
.cardio-row.cardio-busy{border-color:rgba(251,191,36,.25);background:rgba(251,191,36,.04)}
.cr-icon{font-size:20px;flex-shrink:0;width:26px;text-align:center}
.cr-body{flex:1;min-width:0}
.cr-name{font-size:13px;font-weight:700}
.cr-note{font-size:11px;color:var(--mut);margin-top:1px}
.cr-busy-tag{font-size:10px;color:var(--warn);font-weight:600;margin-left:5px;vertical-align:middle}
.cr-right{text-align:right;flex-shrink:0}
.cr-dur{font-size:16px;font-weight:800;color:var(--acc)}
.cr-dist{font-size:11px;color:var(--mut)}
/* evening time picker */
.eve-mins-picker{margin-bottom:14px}
.eve-mins-opts{display:flex;gap:6px;margin-top:8px}
.eve-mins-opts .opt{flex:1;padding:10px 4px}
.eve-mins-opts .opt-v{font-size:16px}
.bw-input-wrap{display:flex;align-items:center;gap:12px;margin-bottom:24px}
.bw-big{max-width:130px;font-size:28px !important;padding:14px 8px !important}
/* plan screen */
.plan-days{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:8px}
.plan-day{background:var(--surf);border:2px solid rgba(251,191,36,.4);border-radius:12px;padding:10px 4px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s,opacity .15s;user-select:none}
.plan-day.plan-skip{border-color:var(--bdr);opacity:.5}
.plan-day-name{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--txt);margin-bottom:3px}
.plan-day-tmpl{font-size:10px;color:var(--mut);margin-bottom:3px;line-height:1.3}
.plan-day-status{font-size:10px;font-weight:700;color:var(--warn)}
.plan-day.plan-skip .plan-day-status{color:var(--mut)}
.badge-makeup{background:rgba(248,113,113,.15);color:var(--bad)}
.pg-day.pg-skip{opacity:.45;border-style:dashed}
.pg-day.pg-missed{border-color:rgba(248,113,113,.4)}
.pg-day.pg-done{border-color:rgba(74,222,128,.4);background:linear-gradient(135deg,var(--surf) 0%,rgba(74,222,128,.05) 100%)}
/* availability plan rows */
.plan-slot-row{background:var(--surf);border:1px solid var(--bdr);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.plan-slot-day{font-size:13px;font-weight:700;margin-bottom:8px}
.plan-slot-checks{display:flex;gap:8px;flex-wrap:wrap}
.plan-chk{display:flex;align-items:center;gap:8px;background:var(--surf2);border:2px solid var(--bdr);border-radius:10px;padding:8px 10px;cursor:pointer;flex:1;min-width:105px;transition:border-color .15s,background .15s}
.plan-chk.on{border-color:var(--acc);background:var(--acc2)}
.plan-chk-box{width:18px;height:18px;border-radius:4px;border:2px solid var(--bdr);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;color:transparent}
.plan-chk.on .plan-chk-box{background:var(--acc);border-color:var(--acc);color:#0a0a12}
.plan-eve-opts{margin-top:10px;padding-top:10px;border-top:1px solid var(--bdr)}
.wk-day{cursor:pointer}
.wk-day.viewing{background:rgba(129,140,248,.2);border-radius:8px}
/* custom exercise autocomplete dropdown */
.ex-suggest{position:absolute;top:100%;left:0;right:0;z-index:60;background:var(--surf3);border:1px solid var(--bdr-strong);border-radius:10px;margin-top:4px;max-height:230px;overflow-y:auto;display:none;box-shadow:var(--shadow-lg)}
.ex-suggest.on{display:block}
.ex-suggest-item{padding:11px 12px;cursor:pointer;font-size:14px;font-weight:600;border-bottom:1px solid var(--bdr);display:flex;justify-content:space-between;align-items:center;gap:8px}
.ex-suggest-item:last-child{border-bottom:none}
.ex-suggest-item:active,.ex-suggest-item:hover{background:var(--acc2)}
.ex-suggest-item .es-mus{font-size:11px;font-weight:600;color:var(--mut);flex-shrink:0;text-transform:capitalize}
</style>
</head>
<body>
<div id="root"></div>
<div id="modal-root"></div>
<div id="rest-ov">
  <div class="rest-inner">
    <div class="rest-lbl">Rest Period</div>
    <div class="tcircle">
      <svg viewBox="0 0 120 120" width="160" height="160">
        <circle class="t-bg" cx="60" cy="60" r="54"/>
        <circle id="t-ring" cx="60" cy="60" r="54"/>
      </svg>
      <div id="t-num">3:00</div>
    </div>
    <div id="rest-exname" style="font-size:13px;color:var(--mut);margin-bottom:16px"></div>
    <button class="skip-rest" id="skip-rest-btn" data-action="skip-rest">Skip Rest</button>
  </div>
</div>
<script>
// ─────────────────────────────────────────────
// EXERCISE DATABASE
// ─────────────────────────────────────────────
const EX = [
  // ── Horizontal-press family. ORDER IS LOAD-BEARING (see the horizontal-pull
  // block below for the full explanation of why leastUsed() makes the first
  // entry the de-facto default). Floor press leads DELIBERATELY, as of the
  // left-shoulder report (2026-08-03: "the front of that shoulder hurts when I
  // bench", tracing back to something popping on a maximal baseball swing years
  // ago). The floor is a hard mechanical stop that ends the descent with the
  // upper arm roughly level with the torso, so the shoulder never reaches the
  // horizontal-extension end range that provokes it — the same protection a
  // ROM cue asks for, except the floor enforces it when form degrades under
  // fatigue and a cue does not. Barbell bench sits on avoidExercises for the
  // opposite reason: the hands are fixed to one bar, so the arms cannot pick
  // their own path and the bottom position is not negotiable.
  {id:'floor_press',name:'Floor Press',muscle:'chest',type:'compound',eq:['dumbbells','barbell'],rMin:5,rMax:10,rest:180,cue:'Lie flat on the floor, knees bent, feet planted. Press from the chest with elbows tucked to ~45°, forearms vertical. Lower under control until the BACKS OF THE UPPER ARMS touch the floor — that\'s the stop, and it is the whole point: the shoulder never travels past the torso line, so the front of the joint stays out of its end range. Pause a beat on the floor to kill the bounce, then press. Dumbbells let each arm find its own path; a barbell works too.'},
  {id:'bench',name:'Barbell Bench Press',muscle:'chest',type:'compound',eq:['barbell'],rMin:4,rMax:8,rest:180,cue:'Retract shoulder blades, slight arch. Tuck elbows to ~45° from your torso (not flared to 90°) to protect the shoulders and load the chest. Keep forearms vertical through the press so tension stays on the chest, not the triceps. Lower bar to mid-chest with control (2 counts), press through the bar. Push the last working set to 1–2 reps shy of failure — the last rep should look ugly.'},
  {id:'incline_db',name:'Incline DB Press',muscle:'chest',type:'compound',eq:['dumbbells'],rMin:6,rMax:10,rest:180,cue:'30–45° incline (~58–100% grade on a bench that reads in percent). Tuck elbows to ~45° from your torso (don\'t flare to 90°) and keep forearms vertical so the chest does the work, not the triceps. At the top, drive your biceps toward each other rather than clanking the dumbbells together — that maximizes the contraction. Control the descent (2 counts) — push the last set to 1–2 reps shy of failure. SHOULDER STOP: end the descent when the upper arms reach the torso line — do not let the elbows travel behind the body chasing a deeper stretch.'},
  {id:'flat_db_press',name:'Flat Dumbbell Press',muscle:'chest',type:'compound',eq:['dumbbells'],rMin:6,rMax:10,rest:180,cue:'Lie flat on a bench, dumbbells at chest level. Retract the shoulder blades. Tuck elbows to ~45° from the torso (don\'t flare to 90°) and keep forearms vertical so tension stays on the chest, not the triceps. Press up and slightly in, driving the dumbbells toward each other at the top for a harder squeeze without clanking them. Control the descent (2 counts) — push the last set to 1–2 reps shy of failure. SHOULDER STOP: stop when the upper arms reach the torso line, NOT at a full stretch. Chasing depth here is what makes the front of the shoulder hurt; if you can\'t feel the line, use the Floor Press instead and let the floor find it for you.'},
  {id:'machine_press',name:'Machine Chest Press',muscle:'chest',type:'compound',eq:['machine'],rMin:6,rMax:10,rest:150,cue:'Set seat so handles are at mid-chest. Retract shoulder blades before pressing. Tuck elbows to ~45° (not flared) and keep forearms vertical so tension stays on the chest, not the triceps. Control the descent — 2 full counts down. Take the last set to 1–2 reps shy of failure. SHOULDER STOP: set the seat so the handles finish at the torso line, not behind it — most machines have a start-position adjustment for exactly this.'},
  // eq:['own_gear'], NOT 'bodyweight' — the vest is personal kit that doesn't
  // travel to a public gym (2026-08-03). 'own_gear' is carried by the presets
  // where Sam's own equipment is on hand and withheld from ymca/hotel_gym, so
  // the ordinary equipment gate does the filtering everywhere at once: normal
  // pickEx tiers, the Foundation short-circuit, the backfill, and the swap list.
  {id:'pushups_w',name:'Push-ups (+ Weighted Vest)',muscle:'chest',type:'compound',eq:['own_gear'],rMin:6,rMax:10,rest:120,cue:'Hands shoulder-width, body straight. Chest to floor, lock out top. Slow descent. Add vest for progressive overload.'},
  {id:'perfect_pushups',name:'Perfect Pushups',muscle:'chest',type:'compound',eq:['bodyweight'],rMin:8,rMax:15,rest:120,cue:'Rotating-handle push-up grips (or dumbbells). Grip the handles and let them rotate naturally as you lower — this opens up a deeper stretch at the bottom and is easier on the wrists. Hands under shoulders, body in a straight line, brace the core. Lower under control until the chest is below the hands, press back to full lockout. Slow descent every rep. Add a vest to progressively overload.'},
  // Athletic power accents (goal: look like a bodybuilder, MOVE like an athlete).
  // Tagged 'power'/'ballistic' — NOT 'plyometric' — because the hip-caution
  // plyo ban targets lower-body flight/landing impact, which these don't have.
  // Wall throws use the 'medball_wall' key (med ball + a solid wall to throw
  // against) — the apartment gym has med balls but no throwing wall, so it
  // carries 'medball' (floor slams OK) without 'medball_wall'.
  // shoulderRisk (2026-08-03): both of these load the anterior shoulder
  // BALLISTICALLY — a catch/rebound and a landing on straight arms respectively.
  // Velocity is the aggravator with an anterior shoulder that already got hurt
  // by one violent swing, and unlike the strength lifts there is no ROM cue that
  // makes them safe, because the joint is being decelerated by tissue rather
  // than by a stop. Hidden while cfg.shoulderCaution is on; they return the
  // moment it's switched off.
  {id:'med_ball_chest_pass',name:'Med Ball Chest Pass',muscle:'chest',type:'compound',eq:['medball_wall'],rMin:5,rMax:8,rest:120,startW:10,highSweat:true,shoulderRisk:true,tags:['power','ballistic'],cue:'Stand facing a solid wall a few feet away, ball at the chest. Log the ball\'s weight (printed on it) so you can track moving up in balls over time. Explode the ball into the wall like a two-hand pass — maximal intent, full arm extension — catch the rebound (or pick it up) and reset. Throw as HARD as possible every rep; stop the set when velocity visibly drops. Power work: if a heavier ball makes your throws visibly slow, drop back down. Builds the pressing power a barbell can\'t train, because you can\'t let go of a barbell.'},
  {id:'plyo_pushup',name:'Plyo Push-up',muscle:'chest',type:'compound',eq:['bodyweight'],rMin:4,rMax:8,rest:150,noWeight:true,highSweat:true,shoulderRisk:true,tags:['power','ballistic'],cue:'Push-up position, lower under control, then explode up hard enough that your hands leave the floor. Land soft with elbows unlocked, absorb, reset, repeat with full intent. End the set the moment your height drops — this is power work, not a burnout. Regress to hands on a bench; progress to a clap.'},
  {id:'cable_fly',name:'Cable Fly',muscle:'chest',type:'isolation',eq:['cables'],rMin:8,rMax:12,rest:120,cue:'Standing in the middle of the cable crossover station, both pulleys set at shoulder height for a flat, mid-chest line — set them higher (above the head) to bias the lower chest on a high-to-low fly, or lower (near the floor) to bias the upper chest on a low-to-high fly. Slight elbow bend. Reach your chest to the sky as you descend. SHOULDER STOP: hands come back to the torso line and no further — the deep "full stretch" fly position is a direct pull on the front of the shoulder capsule, which is the tissue that\'s already unhappy. Slow eccentric back. Squeeze hard at contraction.'},
  {id:'db_fly',name:'Dumbbell Fly',muscle:'chest',type:'isolation',eq:['dumbbells'],rMin:8,rMax:12,rest:120,cue:'Lower only to shoulder level — that limit is the point, not a compromise, and it matters more than usual with a cranky front shoulder. Reach your chest to the sky as you descend. 2-count descent — slow and controlled. Soft elbows throughout.'},
  {id:'pec_deck',name:'Pec Deck',muscle:'chest',type:'isolation',eq:['machine'],rMin:8,rMax:12,rest:120,cue:'Hard squeeze at contraction. Slow negative — resist the weight on the way back. SHOULDER STOP: set the start position so the handles begin at the torso line rather than stretched behind it; let the stack stop you there on every rep. Great for overload tracking.'},
  {id:'scap_pullups',name:'Scapular Pull-ups',muscle:'back',type:'isolation',eq:['pullup_bar'],rMin:8,rMax:12,rest:90,noWeight:true,cue:'Dead hang, arms straight. Without bending the elbows, shrug down and back to lift your body a few inches — depress and retract the shoulder blades. Pause at the top, slow return. Pure scapular control, no arm pulling.',tags:['vertical','scapular']},
  {id:'pullups',name:'Pull-ups',muscle:'back',type:'compound',eq:['pullup_bar'],rMin:4,rMax:8,rest:180,noWeight:true,cue:'Dead hang start. Drive elbows to hips — think about that, not pulling with hands. 3-count descent every rep, no dropping. Progression ladder: (1) build to 8 strict reps → (2) add 1s pause chin-over-bar each rep → (3) slow negative to 4 counts → (4) L-sit pull-ups (legs parallel) → (5) archer pull-ups. Weight is the last tool, not the first.',tags:['vertical']},
  {id:'chinups',name:'Chin-ups',muscle:'back',type:'compound',eq:['pullup_bar'],rMin:4,rMax:10,rest:180,noWeight:true,cue:'Supinated grip. Full dead hang, drive elbows down and back. 3-count descent. Progression: build reps → 1s top pause → 4-count negative → mixed grip → neutral grip → weighted. Great for both back and biceps.',tags:['vertical']},
  // Foundation Five movement (see FOUNDATION_FIVE). Deliberately NOT tagged
  // 'strength' — that tag drives the weekly heavy-LEG guarantee via
  // STRENGTH_IDS/strengthBefore(), and a logged weighted pull-up would
  // otherwise bank the week's strength slot and stop the heavy squat/hinge
  // mandate from ever firing. startW:10 keeps the cold-start estimate honest:
  // the bodyweight-fraction default would have suggested ~40 lb added.
  {id:'weighted_pullups',name:'Weighted Pull-ups',muscle:'back',type:'compound',eq:['pullup_bar'],rMin:3,rMax:6,rest:180,startW:10,cue:'Vest, or a plate/dumbbell hung from a dip belt. Dead hang, drive the elbows down toward the hips, chin fully clears the bar, 3-count descent — added weight never buys a shorter rep. Start at 10 lb and only add when every set hits the top of the range clean. This is the STRENGTH expression of the pull-up; the Century (100 submaximal reps) is the VOLUME expression. They progress together and neither replaces the other.',tags:['vertical','foundation']},
  {id:'lat_pulldown',name:'Lat Pulldown',muscle:'back',type:'compound',eq:['cables'],rMin:6,rMax:10,rest:150,cue:'Slight lean back. Pull to upper chest, feel lat stretch fully at the top. Don\'t let elbows drift forward.',tags:['vertical']},
  {id:'bumstead_pulldown',name:'Bumstead Lat Pulldown',muscle:'back',type:'compound',eq:['cables'],rMin:8,rMax:12,rest:150,isoHoldSecs:5,cue:'Wide overhand grip. Pull the bar down to the upper chest, but stop and HOLD at the mid-position (elbows roughly level with your ribs) for a full 5 seconds — squeeze the shoulder blades down and together to lock in the lat contraction before finishing the rep. The mid-position pause is the whole point: it kills momentum and forces the lats, not the arms, to do the work. Use the 5s hold timer below at that point each rep.',tags:['vertical']},
  // ── Horizontal-pull family. ORDER IS LOAD-BEARING HERE. ──
  // pickEx's leastUsed() breaks frequency ties by EX array order, and the
  // rolling 7-day frequency window decays to zero between horizontal slots
  // (simulation: only 1–2 land per week, and the Foundation stamp takes most
  // of them for weighted_pullups). So this slot is effectively winner-take-all
  // — whichever horizontal row is listed FIRST is the one that gets programmed,
  // and anything below it only appears in a week that hosts two of them.
  // Adding a row anywhere but the top of this block is adding dead code; that
  // is exactly what the first attempt at inverted_row did (0 picks in 6
  // simulated weeks on BOTH availability profiles).
  //
  // Inverted row leads deliberately:
  //  - It is the only BODYWEIGHT horizontal pull in the pool. Every other
  //    option needs a loaded implement, so hotel/parents'/apartment sessions
  //    previously had at most one way to satisfy the horizontal mandate.
  //  - Lowest lumbar load of the rows: the torso is held in a rigid full-body
  //    plank instead of a loaded hip hinge, which matters given the lower-back
  //    constraint that already bans every standing overhead press.
  //  - It scales by BAR ANGLE, not load — self-scaling in the same way the
  //    Century's fixed 100-rep target is, so the prescription never needs
  //    rewriting as strength changes (see PULLUP_CENTURY).
  // bb_row is NOT displaced, only demoted: it takes the second horizontal slot
  // in any week that has one, so loaded rowing still happens.
  // eq deliberately omits plain 'bodyweight' — this needs a waist-height bar or
  // rings, which the grassy-field preset doesn't have.
  {id:'inverted_row',name:'Inverted Row',muscle:'back',type:'compound',eq:['barbell','cables','machine','pullup_bar'],rMin:8,rMax:10,rest:120,noWeight:true,cue:'Bar in a rack at roughly waist height (or rings/straps). Hang underneath, hands just outside shoulder width, body in ONE straight line from heels to head. Squeeze the glutes hard to drive the pelvis neutral and keep the abs braced the whole set — the plank IS the exercise, and letting it go is the main thing that kills this movement. Squeeze the shoulder blades down and together first to set the shoulders back, then pull, imagining you\'re pulling the BAR DOWN to your chest rather than hauling yourself up. Go as high as you can and stop there — do NOT arch the back to cheat the chest into the bar. No rushing: control both directions. 3 sets of 8–10 with clean form. Scale by angle, not weight: regress by raising the bar toward vertical or bending the knees to shorten the lever; progress by lowering the bar, then feet on a bench, then feet elevated + vest, then one arm.',tags:['horizontal']},
  {id:'bb_row',name:'Barbell Row',muscle:'back',type:'compound',eq:['barbell'],rMin:4,rMax:8,rest:180,cue:'Hip hinge, chest up. Bar to lower sternum. Drive elbows back and up. Control the negative — don\'t drop the bar.',tags:['horizontal']},
  {id:'db_row',name:'Dumbbell Row',muscle:'back',type:'compound',eq:['dumbbells'],rMin:6,rMax:10,rest:150,cue:'Brace hand on bench. Drive elbow to hip — not to the ceiling. Full stretch at bottom, full row.',tags:['horizontal']},
  {id:'cable_row',name:'Seated Cable Row',muscle:'back',type:'compound',eq:['cables'],rMin:6,rMax:10,rest:150,cue:'Sit tall, slight forward lean to stretch. Drive elbows back past your sides. No momentum.',tags:['horizontal']},
  {id:'straight_pull',name:'Straight-arm Pulldown',muscle:'back',type:'isolation',eq:['cables'],rMin:10,rMax:15,rest:120,cue:'Arms straight, slight forward lean. Sweep bar to thighs using lats only. Resist the cable on the way back up.'},
  {id:'db_pullover',name:'Dumbbell Pullover',muscle:'back',type:'isolation',eq:['dumbbells'],rMin:10,rMax:15,rest:120,cue:'Lie perpendicular across a bench with only your shoulders supported, hips low. Hold one dumbbell with both hands above your chest, arms nearly straight with a slight fixed elbow bend. Lower it in an arc behind your head until you feel a deep stretch through the lats and rib cage, then pull it back over your chest using the lats — keep the elbow bend fixed throughout so it stays a lat pull, not a triceps extension.'},
  {id:'face_pulls',name:'Face Pulls',muscle:'back',type:'isolation',eq:['cables'],rMin:12,rMax:15,rest:120,cue:'Rope at nose height. Pull to forehead and externally rotate (thumbs behind ears). Slow return. Non-negotiable for shoulder health.',tags:['rear_delt']},
  {id:'rev_fly',name:'Reverse Flyes',muscle:'back',type:'isolation',eq:['dumbbells'],rMin:12,rMax:15,rest:120,cue:'Bent over 45°, soft elbow. Lift only to parallel — rear delts, not traps. 2-count descent. Light weight, feel the muscle.',tags:['rear_delt']},
  {id:'pec_deck_rev_fly',name:'Machine Reverse Flyes',muscle:'back',type:'isolation',eq:['machine'],rMin:12,rMax:15,rest:120,cue:'Sit facing the pad (reverse of pec-deck position). Grip the handles with a neutral or pronated grip. Drive elbows back and out in a wide arc — stop at shoulder-width or just past, where rear delts peak. 2-count squeeze, slow return. Avoid letting traps take over by keeping shoulders down and depressed throughout.',tags:['rear_delt']},
  {id:'bb_shrug',name:'Barbell Shrugs',muscle:'back',type:'isolation',eq:['barbell'],rMin:10,rMax:15,rest:120,cue:'Hold a loaded barbell at arm\'s length, shoulders relaxed. Shrug straight UP toward your ears — no rolling, which adds nothing and stresses the joint. Pause and squeeze the traps hard at the top, then lower under control to a full stretch. Let the traps do the work; don\'t bounce with the knees.',tags:['trap']},
  {id:'ohp',name:'Overhead Press',muscle:'shoulders',type:'compound',eq:['barbell'],rMin:4,rMax:8,rest:180,cue:'Standing, feet shoulder-width. Bar at clavicle, slightly in front of face. Press straight overhead, lock out. Brace core, no excessive lean.'},
  {id:'seated_db_press',name:'Seated DB Shoulder Press',muscle:'shoulders',type:'compound',eq:['dumbbells'],rMin:6,rMax:10,rest:180,cue:'Start at ear height, press up and slightly in. Full lockout. Control descent back to ear height.'},
  {id:'push_press',name:'Push Press',muscle:'shoulders',type:'compound',eq:['barbell'],rMin:3,rMax:6,rest:180,tags:['power'],cue:'Bar racked at the shoulders, standing tall. Shallow knee dip — a quarter-squat, torso staying vertical — then drive the legs HARD and punch the bar overhead in one motion to lockout. Lower under control back to the shoulders. The leg drive lets you overload the press beyond strict-press weights while training total-body explosiveness — the classic athlete\'s overhead lift.'},
  {id:'db_push_press',name:'DB Push Press',muscle:'shoulders',type:'compound',eq:['dumbbells'],rMin:3,rMax:6,rest:180,tags:['power'],cue:'A dumbbell in each hand at the shoulders, standing tall. Shallow knee dip — a quarter-squat, torso staying vertical — then drive the legs HARD and punch both DBs overhead in one motion to lockout. Each arm stabilizes its own dumbbell independently, so this runs noticeably lighter per hand than half your barbell push press — don\'t chase the same number. Lower under control back to the shoulders.'},
  {id:'arnold_press',name:'Arnold Press',muscle:'shoulders',type:'compound',eq:['dumbbells'],rMin:6,rMax:10,rest:150,cue:'Seated on a bench with back support. Start palms facing you, rotate to facing out as you press. All three delt heads involved. Control the descent.'},
  {id:'db_lateral',name:'DB Lateral Raise',muscle:'shoulders',type:'isolation',eq:['dumbbells'],rMin:12,rMax:20,rest:120,cue:'Standing, slight forward lean, lead with elbows. Imagine "scraping the wall" with your knuckles as you raise — keeps the path in the scapular plane. Pause at top. Slow 2-count negative. Lateral delts respond well to higher reps.'},
  {id:'cable_lateral',name:'Cable Lateral Raise',muscle:'shoulders',type:'isolation',eq:['cables'],rMin:12,rMax:20,rest:120,cue:'Standing, cross-body cable. "Scrape the wall" with your hand on the way up to keep the arm path in the scapular plane. Constant tension throughout ROM. Resist the weight on the way down — don\'t let it snap back.'},
  {id:'lying_cable_lat',name:'Lying Cable Lateral Raise',muscle:'shoulders',type:'isolation',eq:['cables'],rMin:12,rMax:20,rest:120,cue:'Lie sideways, cable from low pulley. Raise arm up. Slow descent. Excellent lateral delt isolation.'},
  {id:'incline_lateral',name:'45° Incline DB Raise',muscle:'shoulders',type:'isolation',eq:['dumbbells'],rMin:12,rMax:20,rest:120,cue:'Set the bench to 45° (~100% grade). Lie on incline bench. Raise arm out from a fully stretched position, "scraping the wall" with your hand to stay in the scapular plane. Control the negative all the way down.'},
  {id:'machine_lateral',name:'Machine Lateral Raise',muscle:'shoulders',type:'isolation',eq:['machine'],rMin:12,rMax:20,rest:120,cue:'Seat set so the pivot sits at shoulder height and the pads rest on the OUTER upper arm — not the forearms. Lead with the elbows, drive out and up to about shoulder height, pause a beat, then resist all the way down. The machine holds tension on the side delt through the whole arc including the bottom, where dumbbells go slack — that plus the fixed path (no swinging, no momentum) is what makes it an S-tier side-delt builder. Go light and strict; this muscle responds to reps, not load.',tags:['side_delt']},
  {id:'y_raise',name:'Y-Raise',muscle:'shoulders',type:'isolation',eq:['dumbbells','bodyweight'],rMin:12,rMax:20,rest:90,cue:'Chest on an incline bench set ~30–45° (or hinged over standing), very light DBs or no weight at all. Raise both arms overhead into a wide Y with the thumbs up, squeezing the shoulder blades DOWN and back — think of reaching long, not lifting heavy. Lower under control. Trains the lower traps and rear delt, which is why it replaces the front raise: the front delt already gets plenty from every press, while this is the piece that actually improves posture and shoulder health. Light weight only — if the neck or upper traps take over, drop the load.',tags:['rear_delt','posture']},
  // On avoidExercises since 2026-08-03 (reported pain, left shoulder). Also
  // carries shoulderRisk so it stays hidden even if the avoid entry is ever
  // removed without the shoulder actually being better: the upright row drives
  // abduction plus internal rotation simultaneously, which is the textbook
  // impingement position and the single most reliably provocative lift in the
  // pool for this complaint. The existing "stop before the elbows climb above
  // the shoulders" cue reduces it but does not remove it.
  {id:'ezbar_upright_row',name:'EZ Bar Upright Rows',muscle:'shoulders',type:'compound',eq:['barbell'],rMin:8,rMax:12,rest:120,shoulderRisk:true,cue:'Grip an EZ bar at about shoulder width on the angled sections. Pull the bar straight up the front of the body, leading with the elbows, to roughly mid-chest — stop before the elbows climb above the shoulders to keep the joint happy. Squeeze the side delts and traps at the top, lower under control. Keep it smooth — no heaving.',tags:['trap']},
  {id:'alt_front_raise',name:'Alternating Front Lateral Raises',muscle:'shoulders',type:'isolation',eq:['dumbbells'],rMin:12,rMax:20,rest:120,cue:'Stand tall with a dumbbell in each hand, palms facing your thighs. Raise one arm straight in front to about shoulder height with a slight elbow bend, pause, then lower under control as you raise the other — alternating each rep. No swinging or leaning back; the front delts do the work. Count per side.'},
  {id:'db_curl',name:'DB Curl',muscle:'biceps',type:'isolation',eq:['dumbbells'],rMin:8,rMax:12,rest:120,cue:'Standing. Full supination at top (palm faces ceiling) — rotate the pinky side of your hand up and in at peak contraction for a harder squeeze. 2-count negative — lower slowly, don\'t drop it. Full ROM at bottom.'},
  {id:'hammer_curl',name:'Hammer Curl',muscle:'biceps',type:'isolation',eq:['dumbbells'],rMin:8,rMax:12,rest:120,cue:'Standing, neutral grip. Trains brachialis and brachioradialis. Resist the descent — 2 counts down.'},
  {id:'cable_curl',name:'Cable Curl',muscle:'biceps',type:'isolation',eq:['cables'],rMin:8,rMax:12,rest:120,cue:'Standing at the low pulley. EZ-bar or straight bar. Constant tension throughout. Control the eccentric — cable should never go slack.'},
  {id:'incline_curl',name:'Incline DB Curl',muscle:'biceps',type:'isolation',eq:['dumbbells'],rMin:8,rMax:12,rest:120,cue:'Set the bench to 45–60° incline (~100–173% grade) so your arms hang straight down from the shoulder. Long head fully stretched at bottom — key for peak development. Full supination at top, rotating the pinky upward at peak for maximum contraction. Slow negative. Very strict form.'},
  {id:'bayesian_curl',name:'Bayesian Cable Curl',muscle:'biceps',type:'isolation',eq:['cables'],rMin:8,rMax:12,rest:120,cue:'Low pulley, single D-handle, and stand a step or two IN FRONT of the stack so the working arm hangs BEHIND your torso at the bottom. That shoulder-extended position puts the biceps at full stretch under load — the cable keeps tension there where a dumbbell has none. Curl without letting the elbow drift forward, squeeze, then lower slowly all the way back into the stretch. Peak tension at long muscle length is the whole point; a deep controlled stretch beats a heavier swing every time. One arm at a time.',tags:['stretch']},
  {id:'pushdown',name:'Tricep Pushdown',muscle:'triceps',type:'isolation',eq:['cables'],rMin:8,rMax:12,rest:120,cue:'Elbows pinned to sides. Full lockout every rep. Resist the stack on the way back up — slow eccentric builds the horseshoe.'},
  {id:'overhead_ext',name:'Cable Overhead Tricep Extension',muscle:'triceps',type:'isolation',eq:['cables'],rMin:8,rMax:12,rest:120,cue:'Standing (or seated on a bench for extra back support), facing away from a low pulley with a rope attachment — hands together behind the head at the bottom. Long head fully stretched overhead — highest growth potential. Keep elbows forward and pointed at the ceiling, don\'t let them flare. 2-count descent, no swinging the cable. Full ROM.'},
  {id:'db_overhead_ext',name:'DB Overhead Tricep Extension',muscle:'triceps',type:'isolation',eq:['dumbbells'],rMin:8,rMax:12,rest:120,cue:'Standing (or seated on a bench for extra back support). Hold a single dumbbell with both hands, cupped under the top plate, arms straight overhead. Lower behind the head under control until you feel a full stretch in the long head of the tricep — keep elbows pointed at the ceiling and close to your ears, don\'t let them flare. Press back to full lockout. 2-count descent, full ROM.'},
  {id:'skull_crushers',name:'DB Skull Crushers',muscle:'triceps',type:'isolation',eq:['dumbbells'],rMin:8,rMax:12,rest:120,cue:'Lower DBs toward forehead with control — 2 counts down. Elbows slightly flared. Press back up. This is not a speed exercise.'},
  {id:'diamond_pu',name:'Diamond Push-ups',muscle:'triceps',type:'isolation',eq:['bodyweight'],rMin:10,rMax:15,rest:120,cue:'Hands close together. Elbows track backward. Full lockout at top, controlled descent. Add vest for progressive overload.'},
  {id:'ezbar_skull',name:'EZ Bar Skull Crushers',muscle:'triceps',type:'isolation',eq:['barbell'],rMin:8,rMax:12,rest:120,cue:'Lie on a bench holding an EZ bar on the angled grips, arms extended over your chest. Keeping the elbows fixed and pointed up, lower the bar toward your forehead (or just behind the head for a bigger long-head stretch) — 2 counts down. Press back to lockout without letting the elbows flare out. Strict and controlled, never a speed exercise.'},
  {id:'tricep_dips',name:'Tricep Dips',muscle:'triceps',type:'compound',eq:['bodyweight'],rMin:8,rMax:15,rest:120,cue:'PARALLEL BARS ONLY — not the bench-edge version. Bench dips pin the hands behind the body and load the shoulder at its extension end range, which is the exact position the front of the left shoulder objects to; parallel bars let the arms hang under the torso instead. NOT flagged shoulderRisk (it\'s the only compound in the triceps pool) — the depth cap is what keeps it safe, so respect it. Keep the torso fairly upright to bias the triceps (leaning forward shifts load to the chest). Lower until the elbows reach about 90° and NO further, keeping them tucked close to the body — don\'t let them flare. Press back to full lockout and squeeze the triceps at the top. Slow descent. Add a vest or plate on the lap to overload.'},
  {id:'squat',name:'Barbell Back Squat',muscle:'legs',type:'compound',eq:['barbell'],rMin:4,rMax:8,rest:180,cue:'Bar on upper traps. Sit back and down, knees track toes. Full depth. Drive the floor away on the way up.',tags:['quad','squat'],hipRisk:true},
  {id:'bulgarian',name:'Bulgarian Split Squat (RFESS)',muscle:'legs',type:'compound',eq:['dumbbells','bodyweight'],rMin:6,rMax:10,rest:180,cue:'Rear foot elevated, front foot well forward. Keep the front shin closer to vertical and torso upright — this caps front-hip flexion well short of a deep bilateral squat, and the staggered stance keeps the working hip neutral-to-externally-rotated. The hip-friendly substitute for deep squats. Drive through front heel. Count reps per leg.',tags:['quad','squat','unilateral']},
  {id:'goblet',name:'Goblet Squat',muscle:'legs',type:'compound',eq:['dumbbells'],rMin:6,rMax:10,rest:150,cue:'Hold DB at chest. Elbows between knees at bottom. Full depth. Controlled descent.',tags:['quad','squat'],hipRisk:true},
  {id:'leg_press',name:'Leg Press',muscle:'legs',type:'compound',eq:['machine'],rMin:6,rMax:10,rest:180,cue:'Feet shoulder-width on platform. Lower until knees reach ~90°, don\'t let lower back round off the pad. Press through full foot, stop just short of lockout.',tags:['quad']},
  {id:'step_ups',name:'Step-ups',muscle:'legs',type:'compound',eq:['dumbbells','bodyweight'],rMin:6,rMax:10,rest:150,cue:'Step onto stable surface, drive through full foot. Keep hips level throughout movement. Control the step down. Count per leg.',tags:['quad','unilateral']},
  {id:'reverse_lunge',name:'Reverse Lunge (DB)',muscle:'legs',type:'compound',eq:['dumbbells','bodyweight'],rMin:6,rMax:10,rest:150,cue:'Step BACK — hip-friendly. Front shin vertical. Drive through front heel to return. Control the descent. Count per leg.',tags:['quad','unilateral']},
  {id:'sumo_squat',name:'Sumo Squat',muscle:'legs',type:'compound',eq:['dumbbells','bodyweight'],rMin:8,rMax:12,rest:150,cue:'Wide stance, toes turned out ~30°. Hold a dumbbell vertically at arm\'s length between your legs (or goblet-style at the chest). Sit straight down and back, keeping the torso tall — the wide stance keeps the shins closer to vertical than a standard squat, reducing knee shear stress while emphasizing the glutes and adductors. Drive through the whole foot to stand.',tags:['quad','squat','glute']},
  {id:'cossack_squat',name:'Cossack Squat',muscle:'legs',type:'compound',eq:['bodyweight','dumbbells'],rMin:6,rMax:10,rest:150,hipRisk:true,cue:'Very wide stance, toes turned slightly out. Shift your weight over one leg and sit deep into that hip — heel down if you can, torso upright — while the opposite leg stays straight, foot flat or up on its heel. Push back to center through the working heel. Builds hip mobility, adductor strength, and single-leg quad/glute strength together. Hold a single DB at the chest to load it once bodyweight is easy. Count per side.',tags:['quad','adductor','unilateral','mobility']},
  // ATG (knees-over-toes style) deep-range work: constant-tension deep positions
  // load the quad tendons and deep hip range at controlled tempo — deliberately
  // NOT flagged hipRisk (unlike heavy bilateral squats) since it's user-requested
  // tendon-building work at self-limited loads.
  {id:'bottom_half_atg',name:'Bottom-Half ATG Squat',muscle:'legs',type:'compound',eq:['bodyweight','dumbbells','barbell'],rMin:8,rMax:12,rest:150,cue:'Squat all the way down — hamstrings to calves — then rise only to about half height and sink back to the bottom. Never locking out keeps constant tension on the quads and knee tendons in their deepest, weakest range. Heels down, torso as upright as you can. Bodyweight first; hold a light DB goblet-style to load.',tags:['quad','squat','tendon']},
  {id:'atg_squat_thrust',name:'ATG Squat + Hip Thrust Finish',muscle:'legs',type:'compound',eq:['bodyweight','dumbbells'],rMin:8,rMax:12,rest:150,cue:'Full-depth squat — hamstrings to calves at the bottom — then stand and finish by driving the hips through, squeezing the glutes hard into a standing hip-thrust lockout with a posterior pelvic tilt. Full knee range on the way down, full hip extension at the top: the whole leg trains in one rep. Slow descent, snap the hips at the finish.',tags:['quad','squat','glute','tendon']},
  {id:'split_squat_pulses',name:'Single-Leg Split Squat Pulses',muscle:'legs',type:'isolation',eq:['bodyweight','dumbbells'],rMin:10,rMax:15,rest:120,cue:'Drop into the bottom of a split squat (rear knee an inch off the floor) and pulse up and down through only the bottom few inches — never standing up between reps. Constant deep-range tension on the front leg\'s quad and tendons. Front heel stays planted. Count pulses per leg; add DBs when bodyweight is easy.',tags:['quad','unilateral','tendon']},
  {id:'bstance_hip_thrust',name:'B-Stance Hip Thrust',muscle:'legs',type:'compound',eq:['dumbbells','bodyweight'],rMin:8,rMax:12,rest:150,cue:'Shoulders on a bench, a dumbbell across the hips if loading. Plant one foot flat and slide the other foot forward, resting lightly on the toe for balance — most of the load stays on the planted "working" leg without going fully single-leg. Drive through the planted heel to full hip extension, squeeze the glute at the top, lower under control. Nearly all the unilateral benefit of a single-leg hip thrust with much better stability. Count per side.',tags:['hinge','glute','unilateral']},
  {id:'rdl',name:'Romanian Deadlift',muscle:'legs',type:'compound',eq:['barbell','dumbbells'],rMin:6,rMax:10,rest:180,cue:'Push hips BACK, feel hamstring stretch. Bar close to legs. Drive hips forward at top. Not a squat.',tags:['hinge','hamstring']},
  {id:'db_rdl',name:'Dumbbell RDL',muscle:'legs',type:'compound',eq:['dumbbells'],rMin:8,rMax:12,rest:150,cue:'Hold a dumbbell in each hand. Push hips BACK — feel the hamstring stretch — keeping the DBs close to your legs. Drive hips forward to stand, squeeze glutes at top. Slow, controlled descent every rep.',tags:['hinge','hamstring']},
  {id:'trap_bar_dl',name:'Trap Bar Deadlift (Restricted Depth)',muscle:'legs',type:'compound',eq:['barbell'],rMin:4,rMax:8,rest:180,cue:'Stand inside the hex bar, neutral spine, chest up. Pull the slack out of the bar, then drive through the floor — hips and shoulders rise together. Set up on a small block/mats if needed so the bar starts a few inches higher, keeping hip flexion shallower than a deep squat. A hip-friendly substitute for deep bilateral squats.',tags:['hinge','quad']},
  {id:'hip_thrust',name:'Hip Thrust',muscle:'legs',type:'compound',eq:['barbell','bodyweight'],rMin:6,rMax:10,rest:150,cue:'Shoulders on bench. Set your feet so the shins are vertical and knees reach ~90° at the top. Keep ribs down and abs braced — don\'t arch the lower back — so the glutes, not the spine, do the work. Fix your eyes on a spot on the wall ahead to keep a neutral spine; don\'t crane your neck up. Drive to full hip extension — squeeze hard at top. Slow controlled descent. Optional: 1s iso hold at top.',tags:['hinge','glute']},
  {id:'single_leg_hip_thrust',name:'Single-Leg Hip Thrust',muscle:'legs',type:'isolation',eq:['bodyweight'],noWeight:true,rMin:8,rMax:12,rest:120,cue:'Shoulders on bench, one foot on floor, other leg extended or held off the ground. Drive through the planted heel to full hip extension — squeeze glute at top. Slow controlled descent. Count per side.',tags:['hinge','glute','unilateral']},
  {id:'single_rdl',name:'Single-leg RDL',muscle:'legs',type:'compound',eq:['dumbbells','bodyweight'],rMin:6,rMax:10,rest:150,cue:'Hinge at hip, hips square throughout. Slow descent — feel the hamstring load. Soft bend in standing knee. Count per leg.',tags:['hinge','hamstring','unilateral']},
  {id:'back_ext',name:'Back Extension',muscle:'legs',type:'isolation',eq:['machine','bodyweight'],rMin:10,rMax:15,rest:120,cue:'Hips hinge over the pad. Lower with control until you feel a hamstring/glute stretch, keep spine neutral — don\'t hyperextend at the top. Squeeze glutes to rise. On a machine with a chest pad, hold a light plate to the chest for added load and build the spinal erectors ("Christmas tree" lower-back development).',tags:['hinge','hamstring','glute']},
  {id:'leg_ext',name:'Leg Extension',muscle:'legs',type:'isolation',eq:['machine'],rMin:10,rMax:15,rest:120,cue:'Full lockout, hold 1s at top. Slow 2-count negative — resist the weight down. Lumbar support against pad.',tags:['quad']},
  // Seated listed before Lying: on a frequency tie, pickEx's leastUsed() keeps
  // the earliest array match, so this ordering makes Seated Leg Curl the
  // default pick — the added hip flexion gives a bigger hamstring stretch
  // (biarticular muscle) than the lying variant, which improves development.
  {id:'seated_leg_curl',name:'Seated Leg Curl',muscle:'legs',type:'isolation',eq:['machine'],rMin:10,rMax:15,rest:120,cue:'Pad just above the heels, thighs locked under the support. Curl down hard and squeeze the hamstrings at end range, hold 1s. Resist the weight back up with a 2-count negative — don\'t let it slam. Keep hips planted. Best isolated-hamstring builder.',tags:['hamstring']},
  {id:'leg_curl',name:'Lying Leg Curl',muscle:'legs',type:'isolation',eq:['machine'],rMin:10,rMax:15,rest:120,cue:'Flex hard at end range. 2-count descent — resist the weight back to start. Hips stay down.',tags:['hamstring']},
  {id:'nordic_curl',name:'Nordic Hamstring Curl',muscle:'legs',type:'compound',eq:['bodyweight'],rMin:4,rMax:8,rest:120,noWeight:true,cue:'Kneel with ankles anchored (partner, bar, or under a couch). Brace and lower your torso toward the floor as SLOWLY as possible, resisting the whole way — catch yourself with your hands at the bottom and push back to kneeling. The eccentric lowering is the entire point: builds hamstring/tendon resilience and is one of the best-evidenced exercises for reducing strain injuries. Start with 3-5s descents.',tags:['hamstring','eccentric']},
  // ─── Heavy strength tier (1–5 reps @ 85–95% 1RM) ───
  // Maximal-strength work through the squat / hinge / single-leg patterns, all
  // hip-friendly variants (capped depth, shallow hip flexion, or staggered
  // stance) so they stay outside the hipRisk ban. 'strength' is in
  // LEG_EMPHASIS_TAGS, and the leg mandate's evening 'strength' slot rotates
  // through this pool via leastUsed. Long rests are deliberate — these don't
  // fit the lunch 90s rest cap, so lunch leg slots keep the 'hinge' mandate.
  {id:'heavy_box_squat',name:'Heavy Box Squat',muscle:'legs',type:'compound',eq:['barbell'],rMin:2,rMax:5,rest:240,cue:'Box set just above parallel to cap depth — hip-friendly. Bar on upper traps, sit BACK to the box under full control, touch without rocking or relaxing, then drive up hard. 85–95% of 1RM, 2–5 reps, full rest between sets. Every rep starts and finishes braced; leave one in the tank — grinding a max with no spotter is not the goal.',tags:['squat','quad','strength']},
  {id:'heavy_trap_bar',name:'Heavy Trap Bar Deadlift',muscle:'legs',type:'compound',eq:['barbell'],rMin:2,rMax:5,rest:240,cue:'Elevate the bar a few inches on mats/blocks if needed to keep hip flexion shallow. Brace hard, pull the slack out, then drive the floor away — hips and shoulders rise together. 85–95% loads, 2–5 crisp reps, full rest. The heavy hinge with the most direct carryover to sprinting and jumping.',tags:['hinge','quad','strength']},
  {id:'heavy_rdl',name:'Heavy Romanian Deadlift',muscle:'legs',type:'compound',eq:['barbell'],rMin:3,rMax:5,rest:240,cue:'Same pattern as the normal RDL — hips back, bar close, neutral spine — loaded to 85–90% for 3–5 reps. The heavy eccentric is the point: lower in a controlled 3 seconds, feel the hamstrings load, then drive the hips through. End the set the moment the back angle starts to drift.',tags:['hinge','hamstring','strength','eccentric']},
  {id:'heavy_split_squat',name:'Heavy Bulgarian Split Squat',muscle:'legs',type:'compound',eq:['dumbbells','barbell'],rMin:3,rMax:5,rest:210,cue:'Same hip-friendly setup as the regular RFESS — front shin near vertical, torso tall, working hip neutral — but loaded heavy for 3–5 reps per leg. Single-leg maximal strength transfers directly to sprinting and cutting, and the stagger keeps the hip out of deep flexion. Control down, drive up with intent. Count per leg.',tags:['squat','unilateral','strength']},
  // ─── Deceleration / multi-directional / heavy-eccentric work ───
  // Handling force is trained by absorbing it: slow heavy eccentrics, stick
  // positions with no flight phase (deliberately NOT tagged 'plyometric', so
  // they stay available under hip caution), and frontal-plane loading at
  // controlled, non-end-range depths. Reached via the leg accent rotation
  // ('eccentric'/'decel') and swaps.
  {id:'ecc_box_squat',name:'Slow-Eccentric Box Squat (5s down)',muscle:'legs',type:'compound',eq:['barbell','dumbbells'],rMin:4,rMax:6,rest:180,cue:'Moderate load (~60–70%). Take a full FIVE seconds to sit back to the box — actively absorbing the whole way, never free-falling — touch soft, then stand up fast. The slow lowering is the work: eccentric strength is what deceleration and cutting run on.',tags:['squat','quad','eccentric','tendon']},
  {id:'ecc_step_down',name:'Slow Eccentric Step-Down',muscle:'legs',type:'compound',eq:['bodyweight','dumbbells'],rMin:5,rMax:8,rest:120,cue:'Stand tall on a knee-height box on one leg. Lower the free foot toward the floor in a 4–5 second single-leg squat — hips level, knee tracking over the toes — barely kiss the heel down, then step back up. All the single-leg braking strength of landing work with zero impact. Hold a DB at the chest to load. Count per side.',tags:['quad','unilateral','eccentric','decel','tendon']},
  {id:'lateral_lunge',name:'Lateral Lunge (Goblet)',muscle:'legs',type:'compound',eq:['dumbbells','bodyweight'],rMin:6,rMax:10,rest:150,cue:'Step wide to one side and sit back into that hip — shin vertical, opposite leg straight — then push hard off the outside foot to return. Keep depth moderate and hips square: you\'re loading the frontal plane, not chasing end-range hip rotation. This is the strength half of every cut and shuffle. Count per side.',tags:['quad','adductor','lateral','eccentric','unilateral','decel']},
  {id:'snap_down',name:'Snap-Down to Stick',muscle:'legs',type:'compound',eq:['bodyweight'],rMin:5,rMax:8,rest:120,noWeight:true,cue:'Reach tall on the toes, then SNAP down into an athletic quarter-squat landing position — feet barely leave the floor, arms rip back — and freeze rock-solid for 2 seconds. Teaches the body to go from moving to stopped instantly: the exact skill of deceleration. Crisp, quiet, stuck positions; progress to snapping down from a small hop once landings are silent.',tags:['decel','eccentric','power']},
  // ─── Explosive (low-impact) + tendon-stiffness leg work ───
  // Power = explosive concentric intent with NO flight/landing (hip-caution safe,
  // never tagged 'plyometric'). Isometric/eccentric + 'tendon' = stiffness & RFD
  // for bounce and acceleration. Builds athletic explosiveness without impact.
  {id:'speed_box_squat',name:'Speed Box Squat (Dynamic Effort)',muscle:'legs',type:'compound',eq:['barbell','dumbbells'],rMin:3,rMax:5,rest:150,cue:'Sub-maximal load (~50–60% of your squat). Sit back to a box that caps depth just above parallel — hip-friendly — pause for a beat to kill the stretch reflex, then explode up as FAST as humanly possible. Bar speed is the whole point, not the weight. Reset every rep. Builds rate of force development for jumping and acceleration.',tags:['quad','squat','power']},
  {id:'speed_trap_bar',name:'Speed Trap-Bar Pull (Dynamic Effort)',muscle:'legs',type:'compound',eq:['barbell'],rMin:3,rMax:5,rest:150,cue:'~50–60% load in the hex bar. Pull the slack out, then drive the floor away as explosively as possible into full triple extension (ankles/knees/hips) — without leaving the ground. Stand tall and fast, control back down, fully reset each rep. The most direct low-impact builder of vertical and acceleration power.',tags:['hinge','quad','power']},
  {id:'speed_hip_thrust',name:'Explosive Hip Thrust',muscle:'legs',type:'compound',eq:['barbell','bodyweight'],rMin:4,rMax:6,rest:150,cue:'Shoulders on bench, ribs down, shins vertical at the top. Drive the hips up as FAST as possible to full lockout — snap the glutes — then lower under control. Moderate load, maximal concentric speed. Trains the hip-extension power that drives sprint acceleration.',tags:['hinge','glute','power']},
  {id:'db_swing',name:'Dumbbell / KB Swing',muscle:'legs',type:'compound',eq:['dumbbells'],rMin:8,rMax:12,rest:120,cue:'Hike the weight back between the legs, then snap the hips forward explosively so it floats to chest height — arms are just ropes. It\'s a ballistic hip hinge, not a squat or a front raise. Crisp hip snap each rep. Low-impact power for the posterior chain.',tags:['hinge','glute','power']},
  {id:'spanish_squat',name:'Spanish Squat (Isometric)',muscle:'legs',type:'isolation',eq:['cables','bodyweight'],rMin:20,rMax:45,rest:120,isTimed:true,cue:'Loop a band behind your knees anchored to a rig (or brace against a fixed post). Sit straight DOWN with vertical shins to about 90°, weight through mid-foot, and HOLD. Builds patellar-tendon stiffness and knee resilience with zero impact — one of the best-evidenced tendon-loading drills for jumpers. Count seconds.',tags:['quad','isometric','tendon']},
  {id:'iso_split_squat',name:'Isometric Split Squat Hold',muscle:'legs',type:'isolation',eq:['bodyweight','dumbbells'],rMin:20,rMax:45,rest:120,isTimed:true,cue:'Split stance, drop to a 90/90 bottom position (front shin vertical, rear knee under hip), brace, and hold dead still. Add DBs to load it. Builds single-leg tendon stiffness and the positional strength that feeds acceleration. Work toward 3×45s per leg. Count seconds per leg.',tags:['quad','isometric','tendon','unilateral']},
  {id:'wall_sit',name:'Wall Sit (Isometric Quad)',muscle:'legs',type:'isolation',eq:['bodyweight'],rMin:30,rMax:60,rest:90,isTimed:true,cue:'Back flat on the wall, thighs parallel to the floor, knees over ankles. Brace and hold — no sliding up. Progress to a single-leg hold once 60s is easy. Low-impact quad-tendon stiffness and isometric strength. Count seconds.',tags:['quad','isometric','tendon']},
  {id:'sl_wall_sit',name:'Single-Leg Wall Sit',muscle:'legs',type:'isolation',eq:['bodyweight'],rMin:20,rMax:45,rest:120,isTimed:true,noWeight:true,cue:'Set up a normal wall sit — back flat, thighs parallel — then extend one leg straight out so the planted leg holds everything. Hips stay level, no sliding down. Twice the tendon stimulus of the two-leg version and closer to the single-leg demands of jumping. Work toward 3×45s per leg. Count seconds per side.',tags:['quad','isometric','tendon','unilateral']},
  {id:'reverse_nordic_iso',name:'Reverse Nordic Iso Hold',muscle:'legs',type:'isolation',eq:['bodyweight'],rMin:20,rMax:40,rest:120,isTimed:true,noWeight:true,cue:'Kneel tall, feet flat behind you, body in a straight line from knees to head. Keeping the hips locked open (no folding), lean the whole line BACK until you feel serious tension down the quads, and hold there. The knees-over-toes staple for quad-tendon length and strength — go only as deep as you can hold without the hips breaking. Count seconds.',tags:['quad','isometric','tendon']},
  {id:'iso_calf',name:'Isometric Calf Hold',muscle:'legs',type:'isolation',eq:['bodyweight','machine'],rMin:20,rMax:45,rest:90,isTimed:true,cue:'Rise to the top of a calf raise (single-leg once able) and HOLD at full plantarflexion, or mid-range for more Achilles load. Stiff, tall ankle — don\'t sink. Directly builds the Achilles/ankle stiffness that returns energy in every bounce and sprint step. Count seconds.',tags:['calf','isometric','tendon']},
  // ── SPEED ISOMETRICS (2026-08-04, asked for by name) ──
  // Two families, and the distinction drives the whole prescription:
  //   YIELDING (holding a position against gravity) — long holds, 20–45s,
  //     builds tendon stiffness and positional strength.
  //   OVERCOMING (pushing/pulling maximally into something that cannot move) —
  //     SHORT max-intent efforts, 3–6s. This is the rate-of-force-development
  //     tool: no eccentric, so it's the least fatiguing way to train maximal
  //     intent, which is why sprinters use it. Progress by pushing HARDER at
  //     the same joint angle, never by holding longer — the app's generic
  //     "hit top time → try +5s" prompt is the wrong advice for these three,
  //     so each cue says so explicitly.
  // All are single-leg or hinge-pattern except the trap bar, matching the
  // sprint-specific positions; tagged isometric/tendon so the leg-emphasis
  // gate (LEG_EMPHASIS_TAGS) lets them fill accent slots.
  {id:'sl_bent_knee_iso',name:'Single-Leg Bent-Knee Hold',muscle:'legs',type:'isolation',eq:['bodyweight'],rMin:20,rMax:45,rest:120,isTimed:true,noWeight:true,cue:'Stand on one leg and bend the knee to about a QUARTER squat — roughly the angle your leg holds at sprint ground contact, far shallower than a wall sit. Hold dead still: knee tracking over the mid-foot, hips level, torso tall. The shallow angle is the point — it loads the quad and patellar tendon in the exact position that has to resist collapse at footstrike. Hold a wall or post with a fingertip for balance only. Count seconds per side.',tags:['quad','isometric','tendon','unilateral']},
  {id:'sl_glute_bridge_iso',name:'Single-Leg Glute Bridge Hold',muscle:'legs',type:'isolation',eq:['bodyweight'],rMin:20,rMax:45,rest:120,isTimed:true,noWeight:true,cue:'Shoulders on the floor (or a bench for more range), one foot planted, the other leg held straight out in line with the torso. Drive to FULL hip extension and hold — glute squeezed hard, ribs down, hips dead level, no sagging on the free-leg side. Isolates single-leg hip extension endurance, the position the stance leg finishes every stride in. If the hamstring cramps, walk the foot slightly closer and drive more through the heel. Count seconds per side.',tags:['hinge','glute','isometric','unilateral']},
  {id:'sl_straight_leg_overcoming',name:'SL Straight-Leg Overcoming Iso',muscle:'legs',type:'isolation',eq:['bodyweight'],rMin:3,rMax:6,rest:180,isTimed:true,noWeight:true,cue:'OVERCOMING iso — you push into something immovable, nothing moves. Lie on your back with one leg straight and the heel pressed into a wall, a loaded barbell, or the underside of a fixed bench. Keep that leg LONG and drive the heel down and back into it as hard as you possibly can, like you\'re trying to pull the floor underneath you. Ramp to max over ~1s, then hold max effort 3–6s. Glute and hamstring at a long lever — the sprint hip-extension position. PROGRESS BY PUSHING HARDER, NOT LONGER: 3–5 efforts per side with full rest; ignore any prompt to extend the hold. Count seconds per side.',tags:['glute','isometric','overcoming','tendon','unilateral']},
  {id:'trapbar_overcoming_iso',name:'Trap Bar Overcoming Iso',muscle:'legs',type:'compound',eq:['barbell'],rMin:3,rMax:6,rest:180,isTimed:true,noWeight:true,cue:'OVERCOMING iso — set the trap bar in a rack against the safety pins at just-below-knee height (or load it far beyond anything you could lift), take your normal deadlift setup, and PULL as hard as physically possible into a bar that cannot move. Chest up, back locked, pull the slack out first, then ramp to absolute max over ~1s and hold 3–6s. Nothing moves, so there is no eccentric and almost no muscle damage — this is the cheapest way to train maximal whole-body force production, and it carries straight into acceleration. PROGRESS BY PUSHING HARDER, NOT LONGER: 3–5 max efforts, full rest between; ignore any prompt to extend the hold. Vary pin height every few weeks to hit different joint angles.',tags:['isometric','overcoming','tendon']},
  {id:'sl_sprint_overcoming_iso',name:'Overcoming SL Sprint Iso',muscle:'legs',type:'compound',eq:['bodyweight'],rMin:3,rMax:6,rest:180,isTimed:true,noWeight:true,cue:'OVERCOMING iso in the acceleration position. Set up in a wall-drive: hands on a wall, body in a straight line leaning forward ~45°, one knee driven up to hip height, the other leg long behind with the ball of the foot planted. Now drive that planted foot into the ground and the wall as hard as you can — try to push the earth backwards — while the front knee simultaneously drives up into a fixed strap or your own hand. Ramp to max over ~1s, hold 3–6s, keeping the whole body rigid and hips square. The single most sprint-specific entry here: it trains max force in the exact shape of the first steps. PROGRESS BY PUSHING HARDER, NOT LONGER: 3–5 efforts per side, full rest; ignore any prompt to extend the hold. Count seconds per side.',tags:['quad','glute','isometric','overcoming','tendon','unilateral']},
  {id:'tempo_calf',name:'Springy Calf Bounces (Stiff Ankle)',muscle:'legs',type:'isolation',eq:['bodyweight','machine'],rMin:10,rMax:20,rest:90,cue:'Fast, short rebounds driven by the ankle — touch the bottom and snap back up with minimal ground-contact time, like a stiff spring. Feet stay grounded (no jumping) so it stays low-impact, but the quick stretch-shorten action trains reactive Achilles stiffness and bounce.',tags:['calf','tendon','power']},
  // rest 60→90s: Singer et al. 2024 Bayesian meta-analysis ("Give it a Rest", Frontiers Sports Act Living) — hypertrophy slightly favors >60s rest, no further benefit beyond ~90s; ≤60s is the only clearly suboptimal zone.
  {id:'calf_raise',name:'Calf Raises',muscle:'legs',type:'isolation',eq:['bodyweight','machine'],rMin:10,rMax:15,rest:90,cue:'Full stretch at bottom (off step edge). Full contraction at top. Slow tempo — calves are resistant to fast reps.',tags:['calf']},
  {id:'tib_raise',name:'Tibialis Raises',muscle:'legs',type:'isolation',eq:['bodyweight'],rMin:15,rMax:25,rest:60,noWeight:true,cue:'Lean your back against a wall, feet a foot or so out in front, legs straight. Lift your toes toward your shins as high as possible, pause, lower under control — don\'t let the toes slap down. The shin muscle (tibialis anterior) absorbs impact on every walking/running step, especially incline work: strengthening it is what relieves chronic shin stiffness, not just stretching. Walk your feet further from the wall to make it harder; progress toward single-leg.',tags:['tibialis','tendon']},
  {id:'backward_drag',name:'Backward Sled Drag / Backward Walk',muscle:'legs',type:'isolation',eq:['bodyweight'],rMin:60,rMax:180,rest:90,isTimed:true,noWeight:true,cue:'Sled: load it light, face it, and walk BACKWARDS pulling the straps with the arms locked out — smooth continuous steps, no jerking. No sled? A treadmill set to a slow speed walked backwards (hold the rails), or just backward walking across any open space, gets most of the benefit. The quad works CONCENTRICALLY with almost no eccentric load, so it strengthens the muscle and tendon around the knee without the soreness or joint stress that squatting adds — which is exactly why it is the first thing to add when knees are cranky, and why it can run 2–3x a week alongside everything else. Knees stay soft, torso tall, land toe-to-heel. Count total seconds of continuous work.',tags:['quad','tendon','knee_health']},
  {id:'single_leg_calf_raise',name:'Single-Leg Calf Raise',muscle:'legs',type:'isolation',eq:['bodyweight','machine'],rMin:10,rMax:15,rest:90,cue:'Balance on one foot (hold something for stability). Full stretch at bottom (off step edge). Full contraction at top. Slow tempo. Count per side.',tags:['calf','unilateral']},
  {id:'hip_abduct',name:'Hip Abduction',muscle:'legs',type:'isolation',eq:['machine'],rMin:15,rMax:20,rest:90,cue:'Slow and controlled. Feel glute med. No momentum or pelvic tilt.',tags:['glute']},
  {id:'glute_bridge_2leg',name:'Glute Bridges',muscle:'legs',type:'isolation',eq:['bodyweight'],noWeight:true,rMin:12,rMax:20,rest:90,cue:'Lie on back, knees bent, feet flat on the floor. Drive through both heels to full hip extension — squeeze glutes hard at the top, avoid arching through the lower back. Slow controlled descent.\n\nProgression: once 20 reps feel easy, move to the Single-leg Glute Bridge below for added difficulty.',tags:['glute']},
  {id:'glute_bridge',name:'Single-leg Glute Bridge',muscle:'legs',type:'isolation',eq:['bodyweight'],rMin:12,rMax:20,rest:90,cue:'Single leg raises difficulty. Drive through heel. Full hip extension. Squeeze hard at top.\n\nProgression without bands: (1) Build reps → (2) Add 2s hold at top each rep → (3) Elevate your foot on a bench (increases ROM and difficulty) → (4) Add a backpack or a heavy book on your hip for resistance → (5) Barbell hip thrust when you reach a gym.',tags:['glute']},
  {id:'pallof',name:'Pallof Press',muscle:'core',type:'rotational',eq:['cables'],rMin:10,rMax:15,rest:90,cue:'Press out fully, hold 2s, return. Resist rotation — your core fights the cable the whole time. Count per side.',tags:['anti-rotation']},
  {id:'med_ball_slam',name:'Med Ball Slam',muscle:'core',type:'rotational',eq:['medball'],rMin:6,rMax:10,rest:90,startW:15,highSweat:true,tags:['power','anti-extension','conditioning'],cue:'Ball overhead at full stretch, up on the toes — then slam it into the floor as violently as you can, folding through the core (not just the arms). Log the ball\'s weight so moving up in balls is tracked. Catch the rebound or pick it up, reset tall, repeat with full intent. Power work: if a heavier ball visibly slows the slam, drop back down. Total-body power expressed through the trunk.'},
  {id:'med_ball_rot_throw',name:'Med Ball Rotational Throw',muscle:'core',type:'rotational',eq:['medball_wall'],rMin:5,rMax:8,rest:90,startW:10,highSweat:true,tags:['power','rotation'],cue:'Stand side-on to a solid wall, ball at the back hip. Log the ball\'s weight so moving up in balls is tracked. Load into the rear hip, then snap the hips through and fire the ball into the wall — the power comes from the ground up through the hips; the arms just deliver it. Catch or collect, reset, repeat. Count per side. Power work: rotational throws reward speed over load — stay with a ball you can throw violently. The purest expression of rotational athletic power.'},
  {id:'suitcase_carry',name:'Suitcase Carry',muscle:'core',type:'rotational',eq:['dumbbells'],rMin:30,rMax:45,rest:90,isTimed:true,tags:['carry','anti-rotation','lateral','unilateral'],cue:'One heavy dumbbell at your side like a suitcase. Walk tall — shoulders and hips level, ribs stacked, zero lean toward or away from the load. The offset weight forces the lateral core and grip to fight the whole time. Count seconds per side. The most athletic "abs" exercise there is.'},
  {id:'woodchop',name:'Cable Woodchop',muscle:'core',type:'rotational',eq:['cables'],rMin:10,rMax:15,rest:90,cue:'Rotate from thoracic spine, diagonal plane. Arms stay relatively straight. Count per side.',tags:['rotation']},
  {id:'half_kneel_press',name:'Half-kneeling Press',muscle:'core',type:'rotational',eq:['dumbbells','cables'],rMin:10,rMax:15,rest:90,cue:'Down knee is the loaded side. Tall posture. Press without leaning — core fights lateral forces. Per side.',tags:['asymmetrical']},
  {id:'sa_cable_row',name:'Single-arm Cable Row',muscle:'core',type:'rotational',eq:['cables'],rMin:10,rMax:12,rest:90,cue:'Core resists rotation as you row. Back AND anti-rotation in one. Count per side.',tags:['unilateral']},
  {id:'sa_db_row',name:'Single-arm DB Row (Standing)',muscle:'core',type:'rotational',eq:['dumbbells'],rMin:8,rMax:12,rest:90,cue:'No bench support. Bent over. Core braces hard against rotation on every rep. Count per side.',tags:['unilateral']},
  {id:'dead_bug',name:'Dead Bug',muscle:'core',type:'rotational',eq:['bodyweight'],rMin:8,rMax:12,rest:60,noWeight:true,cue:'Lower opposite arm and leg simultaneously, back stays flat. Exhale on the way down. Slow and controlled — speed kills the point of this exercise. Count per side.',tags:['anti-rotation']},
  {id:'side_plank_dip',name:'Side Plank Hip Dips',muscle:'core',type:'rotational',eq:['bodyweight'],rMin:10,rMax:15,rest:60,noWeight:true,cue:'Full side plank. Dip hip to floor and drive back up. Resist lateral flexion the whole time. Count per side.',tags:['lateral']},
  {id:'russian_twist',name:'Russian Twists',muscle:'core',type:'rotational',eq:['bodyweight','dumbbells','medball'],rMin:10,rMax:16,rest:60,cue:'Sit back to ~45°, heels light or lifted, chest proud. Rotate the SHOULDERS side to side — the weight follows the turn, don\'t just wave it across a still torso. Slow enough to feel the obliques driving each turn. Hold a DB or med ball to load. Count total touches.',tags:['rotation']},
  {id:'bicycle_crunch',name:'Bicycle Crunch',muscle:'core',type:'rotational',eq:['bodyweight'],rMin:12,rMax:20,rest:60,noWeight:true,cue:'Hands lightly behind the head, legs cycling. Drive one elbow toward the OPPOSITE knee by rotating through the trunk while the other leg extends long and hovers. Slow and deliberate — reach the shoulder across, don\'t flap the elbows. Exhale on each twist. Count total reps.',tags:['rotation','flexion']},
  {id:'plank_outside_climbers',name:'Plank Hold + Outside Climbers',muscle:'core',type:'rotational',eq:['bodyweight'],rMin:8,rMax:12,rest:75,noWeight:true,cue:'Strong high-plank hold — then, keeping the hips dead level, step one foot up OUTSIDE its hand, pause a beat, and return. Alternate sides. The plank fights extension while each leg drive fights rotation, and the outside step doubles as a deep hip-flexor opener. Count per side.',tags:['anti-extension','stability']},
  {id:'db_dead_bug',name:'Dumbbell Dead Bug',muscle:'core',type:'rotational',eq:['dumbbells'],rMin:8,rMax:12,rest:75,cue:'Dead bug with a dumbbell pressed over the chest in both hands (or one DB in the hand opposite the moving leg for a bigger anti-rotation fight). Lower the opposite arm and leg slowly, back FLAT to the floor the whole way — the load makes the abs work overtime to hold it. Exhale down. Count per side.',tags:['anti-rotation']},
  {id:'pallof_hold',name:'Pallof Press Hold',muscle:'core',type:'rotational',eq:['cables'],rMin:20,rMax:40,rest:75,isTimed:true,cue:'Pallof setup — cable at chest height, stand side-on — press the handle out to full arm extension and just HOLD there, dead still, while the cable tries to twist you toward the stack. Ribs down, glutes tight, breathe behind the brace. Count seconds per side.',tags:['anti-rotation','isometric']},
