// Recent fatigue load per muscle, weighting BOTH how much volume was done and
// how recently. Each logged set counts for `1 - daysAgo/LOOKBACK` (≈1 today,
// fading to ~0 a week out), summed per muscle over the lookback window. Using
// volume — not just the single most-recent date — means a "mostly push" day
// correctly marks push (3+ movements) as fatigued rather than letting one stray
// accessory (e.g. a single row) flag the whole pull group as freshly trained.
function muscleRecentLoad(history){
  const load={};
  const today=todayStr();
  const LOOKBACK=7;
  (history||[]).forEach(l=>{
    if(l.isCardio)return;
    const daysAgo=daysBetween(logDay(l.date),today);
    if(daysAgo<0||daysAgo>=LOOKBACK)return; // future or older than the window
    const w=1-(daysAgo/LOOKBACK);
    (l.exercises||[]).forEach(e=>{
      if(!e||!e.muscle)return;
      const sets=Array.isArray(e.sets)?e.sets.filter(s=>s&&s.reps>0).length:(parseInt(e.sets)||1);
      load[e.muscle]=(load[e.muscle]||0)+sets*w;
    });
  });
  return load;
}

// Reorder the week's split so the template whose muscles carry the LEAST recent
// fatigue lands on the earliest day, and the most-fatigued template lands last.
// The binding constraint for a template is its most-fatigued muscle (the one
// most owed rest), so each template scores as the max recent load among its
// non-core muscles, sorted ascending. The lockout matrix (getLockedMuscles)
// still enforces the hard recovery floor; this only improves spacing within
// what's legal. Stable: with no recent history every score is 0 so the
// canonical SPLITS order is preserved unchanged.
function orderSplitByRecovery(split,history){
  const load=muscleRecentLoad(history);
  const score=tk=>{
    const tmpl=TMPLS[tk];
    if(!tmpl)return 0;
    let max=0;
    tmpl.slots.forEach(sl=>{
      if(sl.muscle==='core')return;
      const v=load[sl.muscle]||0;
      if(v>max)max=v;
    });
    return max;
  };
  return split
    .map((tk,i)=>({tk,i,s:score(tk)}))
    .sort((a,b)=>a.s-b.s||a.i-b.i)
    .map(o=>o.tk);
}

// Sets already committed this week by muscle: completed/logged workouts, any
// not-yet-done planned custom workouts on the program, AND the centuries still
// to come. Used to budget remaining sessions so the generator fills toward
// optimal without blowing past MRV max.
//
// ── WHY THE REMAINING CENTURIES ARE COUNTED HERE (2026-08-05) ──
// Sam: "I dont need to kill my back and biceps as much bc im doing century now."
// He was right, and raising the century's price alone would NOT have fixed it —
// the budget only ever saw centuries AFTER they were logged. Generation runs on
// Monday morning with zero centuries in the log, so the whole week's back and
// biceps work was planned as though no pull-ups were coming, and then 300 reps
// landed on top of it. Measured over 6 weeks on the lunch+3-evening schedule:
// back finished at 24 sets against a 12–22 band, every week.
//
// Centuries are the one future session that can be projected without
// circularity: centuryDows() reads AVAILABILITY, never the generated program
// (the same property that lets dayTemplate consult it mid-generation). A missed
// past century is NOT projected, matching the rule getMRVBreakdown uses for
// scheduled sessions — a day that didn't happen shouldn't hold back the rest of
// the week.
function getCommittedVolumes(){
  const vol = getWeeklySetVolumes(); // logged (completed + custom-logged)
  if(S.program?.week){
    S.program.week.forEach(day => {
      // Skip planned days that have since been logged (counted via the logs above)
      if(day && day.plannedCustomWorkout && day.plannedCustomLog && !day.customWorkout){
        day.plannedCustomLog.exercises.forEach(ex => {
          const sets = Array.isArray(ex.sets)
            ? ex.sets.filter(s => s && s.reps > 0).length
            : (parseInt(ex.sets) || 0);
          creditVolume(vol, exFull(ex), sets);
        });
      }
    });
  }
  const proj = centuryWeekVolumes(true);
  Object.keys(proj).forEach(m => { vol[m] = (vol[m] || 0) + proj[m]; });
  return vol;
}
// What share of this week's volume comes from pull-up centuries — logged so far
// plus the ones still scheduled. Two callers want different halves of it:
// getCommittedVolumes adds the PROJECTED half to the budget (the logged half is
// already in getWeeklySetVolumes), and dayTemplate subtracts the WHOLE thing when
// deciding whether back still needs a slot (see the pattern-coverage note there).
// ─── DAILY PUSH-UP HABIT ───
// Reps done every morning, outside any session. They are real chest/triceps
// volume and have to be booked, or the generator keeps prescribing a full
// week of pressing ON TOP of them — but booking them at face value would be
// just as wrong. One set of 30 done fresh, several reps shy of failure, is
// not the same cost as a hard working set, which is exactly the reasoning
// behind the Century's discount. So they are REP-priced through the same
// century anchor every other rep-based session uses (pyramidMrvSets), which
// puts 30/day at ~0.5 sets and a 7-day week at ~3.4 chest sets — about a
// sixth of the chest ceiling, plus secondary triceps and shoulders.
//
// Credited for days ELAPSED this week (Monday through today), because that is
// what a declared daily habit means — there is no per-day tick, deliberately:
// a morning habit shouldn't need a checkbox. Set cfg.dailyPushups to 0 when
// it stops being a habit.
const DAILY_PUSHUP_DEF={id:'bw_pushups',name:'Push-ups',muscle:'chest',type:'compound',rMin:12,rMax:25};
// Sums the mornings actually TICKED this week, not days elapsed. An assumed
// habit over-credits every morning you miss, and the whole point of booking
// this against MRV is that the number be honest.
function dailyPushupWeekReps(){
  const mon=thisMonday(),end=addDays(mon,7);
  return Object.entries(S.pushupLog||{})
    .filter(([d])=>d>=mon&&d<end)
    .reduce((a,[,n])=>a+(n>0?n:0),0);
}
function dailyPushupWeekVolumes(){
  const vol={};
  const reps=dailyPushupWeekReps();
  if(reps<=0)return vol;
  creditVolume(vol,DAILY_PUSHUP_DEF,pyramidMrvSets(DAILY_PUSHUP_DEF,reps));
  return vol;
}
function centuryWeekVolumes(projectedOnly){
  const vol={};
  const anchor=EX.find(e=>e.id==='pullups');
  if(!anchor)return vol;
  const mon=thisMonday(),end=addDays(mon,7),today=todayStr();
  const doneDays=new Set();
  centuryLogs().filter(l=>logDay(l.date)>=mon&&logDay(l.date)<end).forEach(l=>{
    doneDays.add(logDay(l.date));
    if(!projectedOnly)creditVolume(vol,anchor,centuryMrvSets(centuryRepsOf(l)));
  });
  centuryDows().forEach(dow=>{
    const dayISO=addDays(mon,dow===0?6:dow-1);
    if(dayISO<today||doneDays.has(dayISO))return;
    creditVolume(vol,anchor,centuryMrvSets(PULLUP_CENTURY.target));
  });
  return vol;
}

// ─── MRV VOLUME ATTRIBUTION ───
// Per-muscle breakdown of exactly which exercises, on which days, drive the
// weekly MRV totals. Mirrors getCommittedVolumes for the counted ("committed")
// numbers — logged sessions + planned custom workouts — and additionally lists
// upcoming scheduled program sessions as "projected" (NOT counted in the MRV
// widget totals, shown for transparency into the rest of the week).
function getMRVBreakdown(){
  const mondayStr=thisMonday();
  const nextMondayStr=addDays(mondayStr,7);
  const breakdown={};
  const add=(muscle,entry)=>{
    if(!muscle||!entry.sets)return;
    if(!breakdown[muscle])breakdown[muscle]={committed:0,projected:0,entries:[]};
    breakdown[muscle].entries.push(entry);
    if(entry.source==='scheduled')breakdown[muscle].projected+=entry.sets;
    else breakdown[muscle].committed+=entry.sets;
  };
  // Book an exercise everywhere it counts: its own muscle at face value, plus
  // any secondary muscles at their evidence-derived fraction (see
  // SECONDARY_CREDIT_RULES). Every add() site goes through this so the
  // breakdown can never drift from getWeeklySetVolumes' totals — the two are
  // shown side by side in the MRV widget and a mismatch reads as a bug.
  // `indirect` lets the UI label the row rather than showing a bare "1.5 sets
  // of Pull-ups" under Biceps, which looks like a data error.
  const addWithSecondary=(ex,sets,entry)=>{
    const full=exFull(ex);
    add(full.muscle,{...entry,name:ex.name,sets});
    const sec=secondaryCredit(full);
    if(sec)Object.keys(sec).forEach(m=>{
      add(m,{...entry,name:ex.name,sets:Math.round(sets*sec[m]*10)/10,indirect:true});
    });
  };

  // 1) Logged sessions this calendar week (regular + custom) — completed sets only
  const completedDows=new Set();
  (S.logs||[]).filter(l=>logDay(l.date)>=mondayStr&&logDay(l.date)<nextMondayStr).forEach(l=>{
    const dow=new Date(l.date).getDay();
    if(!l.isCardio)completedDows.add(dow);
    (l.exercises||[]).forEach(ex=>{
      const raw=ex.sets?.filter(s=>s&&s.reps>0).length||0;
      // The same rep-priced century and pyramid costs getWeeklySetVolumes
      // charges, so the breakdown always reconciles with the widget totals.
      const sets=l.century?centuryMrvSets(centuryRepsOf(l))
        :(l.pyramid||l.cindy)?pyramidMrvSets(exFull(ex),pyramidRepsOf(ex))
        :raw;
      addWithSecondary(ex,sets,{dow,dayLabel:DOW[dow],source:l.isCustom?'custom':'logged',sessionName:l.dayName});
    });
  });

  // 1b) The declared morning push-up habit
  {
    const mon2=thisMonday(),end2=addDays(mon2,7);
    const ticked=Object.entries(S.pushupLog||{}).filter(([d,n])=>d>=mon2&&d<end2&&n>0);
    const reps=ticked.reduce((a,[,n])=>a+n,0);
    if(reps>0){
      addWithSecondary(DAILY_PUSHUP_DEF,pyramidMrvSets(DAILY_PUSHUP_DEF,reps),
        {dow:null,dayLabel:'Daily',source:'logged',sessionName:`Morning push-ups · ${reps} reps over ${ticked.length} day${ticked.length>1?'s':''}`});
    }
  }

  // 2) Planned custom workouts not yet logged (counted in MRV widget)
  if(S.program?.week){
    S.program.week.forEach(day=>{
      if(day&&day.plannedCustomWorkout&&day.plannedCustomLog&&!day.customWorkout){
        day.plannedCustomLog.exercises.forEach(ex=>{
          const sets=Array.isArray(ex.sets)?ex.sets.filter(s=>s&&s.reps>0).length:(parseInt(ex.sets)||0);
          addWithSecondary(ex,sets,{dow:day.dow,dayLabel:DOW[day.dow],source:'planned',sessionName:'Planned Custom Workout'});
        });
      }
    });

    // 3) Upcoming scheduled program sessions — projected, not yet counted
    const todayISO=todayStr();
    S.program.week.forEach(day=>{
      if(!day||day.rest||day.customWorkout||day.plannedCustomWorkout)return;
      if(completedDows.has(day.dow))return;
      const dayISO=addDays(mondayStr,day.dow===0?6:day.dow-1);
      if(dayISO<todayISO)return; // missed past days don't project volume
      const collect=(sess)=>{(sess?.exercises||[]).forEach(e=>{
        addWithSecondary(e,e.sets||3,{dow:day.dow,dayLabel:DOW[day.dow],source:'scheduled',sessionName:sess.name});
      });};
      collect(day);
      if(day.eveningSession)collect(day.eveningSession);
    });
  }

  // Stable ordering: entries sorted Mon→Sun within each muscle (Sun last)
  Object.values(breakdown).forEach(b=>b.entries.sort((a,c)=>(a.dow===0?7:a.dow)-(c.dow===0?7:c.dow)));
  return breakdown;
}

function getMRVStatus(){
  // Logged sets ONLY (completed + custom-logged) — the dashboard bars reflect
  // what's actually been done this week, starting yellow every Monday and
  // filling toward green. The generator budgets separately via
  // getCommittedVolumes (which also counts planned custom workouts).
  const volumes = getWeeklySetVolumes();
  const limits = getMRVLimits();

  const status = {};
  Object.keys(limits).forEach(muscle => {
    const current = volumes[muscle] || 0;
    const {min, max} = limits[muscle];
    let level = 'low';
    if (current >= min && current <= max) level = 'optimal';
    else if (current > max) level = 'high';

    status[muscle] = {current, min, max, level};
  });

  return status;
}

function renderMRVWidget(){
  const mrvStatus = getMRVStatus();
  const overworkedMuscles = getOverworkedMuscles();

  // Every muscle shows every week — bars start yellow (under range) on Monday
  // and fill toward green. Color is strictly range-based: yellow under min,
  // green within min–max, red over max. ⚠️ still flags recent external work
  // but no longer overrides the range color.
  const rows = Object.entries(mrvStatus)
    .map(([muscle, status], rowIdx) => {
      const {current, min, max, level} = status;
      const isOverworked = overworkedMuscles.has(muscle);
      const color = level === 'high' ? 'var(--bad)' : level === 'optimal' ? 'var(--ok)' : 'var(--warn)';
      const pct = Math.min(100, (current / max) * 100);
      const minPct = Math.min(100, (min / max) * 100); // tick where green starts

      // The bar's length is carried as --w rather than as an inline width, so
      // the reveal can hold it at 0 and hand it back on scroll-in; an inline
      // width would win over both and the bar would simply never animate.
      return `<div class='mrv-row' style='--i:${rowIdx}'>
        <div class='mrv-name'>${MNAME[muscle]}${isOverworked ? '<span style="font-size:10px;color:var(--warn)">⚠️</span>' : ''}</div>
        <div class='mrv-track'>
          <div class='mrv-fill' style='background:${color};--w:${pct}%'></div>
          <div class='mrv-tick' style='left:${minPct}%'></div>
        </div>
        <div class='mrv-val' style='color:${color}'>${current}/${max}</div>
      </div>`;
    }).join('');

  const fatigued=[...getFatiguedMuscles()].filter(m=>MNAME[m]);
  const fatigueNote=fatigued.length?`<div style='font-size:11px;color:var(--warn);margin-top:8px'>🔋 Recovering: ${fatigued.map(m=>MNAME[m]).join(', ')} — volume ceiling reduced 15% for 72h after your hard session</div>`:'';
  return `<div class='card reveal' data-action='view-mrv-breakdown' style='cursor:pointer'>
    <div style='font-size:14px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:6px'>
      📊 Weekly Set Volume (MRV)
      <span style='font-size:10px;color:var(--mut);font-weight:400'>🟡 under · 🟢 optimal · 🔴 over · ⚠️ recent external</span>
      <span style='margin-left:auto;color:var(--acc);font-size:12px;font-weight:600'>Breakdown ›</span>
    </div>
    ${rows}
    ${fatigueNote}
  </div>`;
}

function getMissedDays(){
  const plan=getWeekPlan();
  if(!plan||!S.program)return[];
  const today=todayDow();
  const planStart=plan.weekOf;
  const weekEnd=addDays(planStart,14); // allow up to 2 weeks
  const weekLogs=S.logs.filter(l=>!l.isCardio&&logDay(l.date)>=planStart&&logDay(l.date)<weekEnd);
  const completedDates=new Set(weekLogs.map(l=>logDay(l.date)));
  // Find non-rest days in the past (from planStart onward) with no log
  return S.program.week.filter(d=>{
    if(d.rest||d.dow===0||d.dow>=today)return false;
    const dayDate=addDays(planStart,daysBetween(planStart,todayStr())-(today-d.dow));
    // simpler: check if this DOW's date this week has a log
    const thisMon=thisMonday();
    const dayDateThisWeek=addDays(thisMon,d.dow-1);
    if(dayDateThisWeek<planStart)return false; // before plan started
    return!completedDates.has(dayDateThisWeek);
  }).map(d=>d.dow);
}

// Program-week dows (non-rest) that have a completed session logged on their
// calendar date this week — a regular finished workout or a custom-logged one.
// Used to mark planned days as "completed" in the dashboard and program views.
// Driven ENTIRELY by S.logs — not by S.program.week's current shape — so a day
// stays marked completed even after a full regeneration reassigns that dow to
// a different template or to rest (the new split just doesn't place a lifting
// session there; the log itself is untouched and remains the source of truth).
function getCompletedDows(){
  const set=new Set();
  const thisMon=thisMonday();
  const dateFor=(dow)=>dow===0?addDays(thisMon,6):dow===6?addDays(thisMon,5):addDays(thisMon,dow-1);
  const loggedDates=new Set(S.logs.filter(l=>!l.isCardio).map(l=>logDay(l.date)));
  for(let dow=0;dow<7;dow++){
    if(loggedDates.has(dateFor(dow)))set.add(dow);
  }
  return set;
}

// The actual logged (non-cardio) session for a program-week dow's calendar date
// this week, if any. A completed day should display what was REALLY trained —
// the planned template can differ (e.g. the week was regenerated after the
// session was logged), so completed cards/rows read from the log, not the plan.
function getLoggedSessionForDow(dow){
  if(!S.program)return null;
  const thisMon=thisMonday();
  const dateFor=(dw)=>dw===0?addDays(thisMon,6):dw===6?addDays(thisMon,5):addDays(thisMon,dw-1);
  const target=dateFor(dow);
  return (S.logs||[]).find(l=>!l.isCardio&&logDay(l.date)===target)||null;
}

// Read-only exercise rows for a logged session (name + muscle dot + what was
// actually done), self-contained so it renders in both the dashboard and the
// program page.
function loggedExRows(log){
  return (log.exercises||[]).map(e=>{
    const done=(e.sets||[]).filter(s=>s&&s.reps>0);
    const last=done[done.length-1];
    const summ=done.length?`${done.length}×${last.reps}${last.weight?' @ '+last.weight+' lb':''}`:'logged';
    return`<div style='display:flex;align-items:center;gap:6px;font-size:13px;padding:3px 0'><span style='width:8px;height:8px;border-radius:50%;background:${MCOL[e.muscle]||'var(--mut)'};flex-shrink:0;display:inline-block'></span>${e.name}<span style='font-size:11px;color:var(--mut);margin-left:auto'>${summ}</span></div>`;
  }).join('');
}

function getEveningMins(){

function pickEveningExercises(day,sessionMins){

function lastLog(exId){

    const e=S.logs[i].exercises?.find(x=>x.id===exId);
    if(e?.sets?.length)return e;

// ─── PROGRESSIVE OVERLOAD — set-by-set inter-set scaling ───
// Background logic only (no UI explanation modules). Evaluates the last
// session's full set-history array instead of assuming one uniform weight:
//   1. BASIS: most recent log for this exercise (lastLog), falling back to a
//      manually entered lastWeights value.
//   2. BASELINE: the HIGHEST weight at which any set reached the rep ceiling
//      (rMax). A mid-session manual increase counts — 10×10 / 15×10 / 15×8
//      sets the next session's baseline to 15 lb, never back to 10.
//      If no set reached the ceiling, baseline = heaviest weight attempted.
//   3. TRIGGER: every completed set was performed at (>=) the baseline weight
//      AND reached rMax — the full rep schema is complete at that intensity.
//   4. SUGGESTION when triggered: baseline × 1.04 rounded to nearest 5 lb,
//      with a minimum +5 lb step so light loads (e.g. 15 lb DBs) still
//      progress. Otherwise: suggest the baseline (fill the schema there).
//   5. NOT factored: RPE/RIR (not tracked). Post-session fatigue ratings
//      regulate weekly volume ceilings via getMRVLimits, never load.
function progression(exId,rMax){
  let sets=null,lastDate=null;
  // Most recent log for this exact exercise — track the workout's DATE too,
  // so a long layoff can decay the suggestion (see below).
  for(let i=S.logs.length-1;i>=0;i--){
    const e=S.logs[i].exercises?.find(x=>x.id===exId);
    if(e?.sets?.length){
      const done=e.sets.filter(s=>s.reps>0);
      if(done.length){sets=done;lastDate=S.logs[i].date;}
      break;
    }
  }
  // Fall back to manually entered lastWeights when no log exists
  if(!sets&&S.lastWeights?.[exId]){
    sets=[{weight:S.lastWeights[exId].weight,reps:S.lastWeights[exId].reps}];
    lastDate=S.lastWeights[exId].date||null;
  }
  if(!sets)return null;
  const minR=Math.min(...sets.map(s=>s.reps));
  const maxR=Math.max(...sets.map(s=>s.reps));
  const allExP=[...EX,...(S.customExercises||[])];
  const scaleDef=exScale(allExP.find(e=>e.id===exId));
  const wMin=Math.min(...sets.map(s=>s.weight||0));
  const wMax=Math.max(...sets.map(s=>s.weight||0));
  // Position-scaled movements: the HARDEST set is the LOWEST number, so the
  // "top set" and the ready-to-progress test both flip direction.
  if(scaleDef&&scaleDef.lowerIsHarder){
    const vals=sets.map(s=>s.weight||0).filter(v=>v>0);
    if(!vals.length)return null;
    const ceil=sets.filter(s=>s.reps>=rMax&&s.weight>0);
    const hardest=ceil.length?Math.min(...ceil.map(s=>s.weight)):null;
    let base=hardest!=null?hardest:Math.min(...vals);
    let rdy=hardest!=null&&sets.filter(s=>s.weight>0&&s.weight<=hardest).every(s=>s.reps>=rMax);
    let sug=rdy?Math.max(scaleDef.min||1,base-1):base;
    // A layoff makes you WEAKER, which on this scale means going back UP a
    // notch or two — the opposite direction from a percentage cut.
    let lw=0;
    if(lastDate){
      const days=Math.floor((Date.now()-new Date(lastDate).getTime())/86400000);
      const up=days>=56?2:days>=28?1:0;
      if(up){lw=Math.floor(days/7);base=Math.min(scaleDef.max||99,base+up);sug=base;rdy=false;}
    }
    const lbl=`${scaleDef.label.toLowerCase()} ${wMin===wMax?wMax:wMax+'→'+wMin}`;
    return{weight:base,minR,maxR,suggest:sug,ready:rdy,layoffWeeks:lw,scale:scaleDef,
      summary:`${lbl} × ${minR===maxR?minR:minR+'–'+maxR}`,isDb:false};
  }
  // Highest weight at which the rep ceiling was actually hit this session
  const ceilSets=sets.filter(s=>s.reps>=rMax);
  const topW=ceilSets.length?Math.max(...ceilSets.map(s=>s.weight||0)):null;
  let baseline,ready;
  if(topW!=null){
    baseline=topW;
    // Ready to progress when the TOP-weight set(s) hit the rep ceiling. Back-off
    // sets are intentionally lighter (see back-off model), so only sets at or
    // above the top weight gate progression — otherwise the lighter back-off
    // sets would make `ready` permanently false. For uniform (non-back-off)
    // sessions every set is at the top weight, so this is unchanged.
    ready=sets.filter(s=>(s.weight||0)>=topW).every(s=>s.reps>=rMax);
  }else{
    baseline=wMax;
    ready=false;
  }
  let suggest=ready?Math.max(r5(baseline*1.04),baseline+5):baseline;
  // Layoff decay: "repeat last time's weight" assumes last time was recent.
  // After a real layoff detraining sets in, so the suggestion backs off —
  // ≥4 weeks since this movement → 90%, ≥8 weeks → 80% — and the +4%
  // progression bump never fires on top of stale numbers. Undated entries
  // (legacy lastWeights) skip decay rather than guess.
  let layoffWeeks=0;
  if(lastDate){
    const days=Math.floor((Date.now()-new Date(lastDate).getTime())/86400000);
    const f=days>=56?0.8:days>=28?0.9:1;
    if(f<1){
      layoffWeeks=Math.floor(days/7);
      baseline=Math.max(5,r5(baseline*f));
      suggest=baseline;
      ready=false;
    }
  }
  const allEx2=[...EX,...(S.customExercises||[])];
  const exDef2=allEx2.find(e=>e.id===exId);
  const isDb=!!(exDef2&&exDef2.eq.includes('dumbbells')&&!exDef2.eq.includes('barbell'));
  const wSuffix=isDb?' lb ea':' lb';
  const wLabel=wMin===wMax?`${wMax}${wSuffix}`:`${wMin}→${wMax}${wSuffix}`;
  return{weight:baseline,minR,maxR,suggest,ready,layoffWeeks,summary:`${wLabel} × ${minR===maxR?minR:minR+'–'+maxR}`,isDb};
}
function recalcLastWeights(){
  const w={};
  // Sort by workout DATE, not record id: retroactively injected sessions carry
  // a fresh id but a historic date, and progression baselines must follow the
  // true chronological order.
  [...S.logs].sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0).forEach(log=>{
    log.exercises?.forEach(ex=>{
      const sets=ex.sets?.filter(s=>s?.reps>0);
      if(sets?.length){const l=sets[sets.length-1];w[ex.id]={weight:l.weight,reps:l.reps,date:log.date};}
    });
  });
  // MERGE, never replace: S.logs is capped at LOG_KEEP entries on save,
  // so a full rebuild silently dropped the remembered weight for any exercise
  // not trained inside that window — and the suggestion engine then fell back
  // to anchor/muscle-group estimates for movements the user HAS done, which
  // must always prefer the user's own history. Ids outside the log window keep
  // their previous entry; anything present in the recent logs wins.
  S.lastWeights=Object.assign({},S.lastWeights||{},w);
}

// ── COMPARABILITY, for step 3b of the estimation engine (2026-08-29) ──
// Sam: "it needs to scale to the most comparable movement for muscular load, not
// just barbell row."
//
// Step 3b used to take the BEST estimated 1RM anywhere in the target's primary
// muscle and open at 60% of it. Two things were wrong, and the second is the
// serious one:
//   1. It picked the HEAVIEST logged lift, not the most similar one.
//   2. `muscle` is far too coarse to stand in for "loads the same tissue the same
//      way". 'legs' is quads, hamstrings, glutes AND calves; 'back' is vertical
//      pulling, horizontal pulling, rear delts and traps.
// Measured over the whole pool with a realistic history: 55 of 106 loadable
// movements resolved through that step, and because the anchor was always the same
// in-group maximum, EVERY movement in a muscle group opened at the SAME number —
// Calf Raises, Leg Extension and Bulgarian Split Squats all at 290 lb off a leg
// press; Reverse Flyes at 120 lb EACH off a cable row; DB Flyes at 130 lb each.
//
// The rewrite ranks candidates by how comparable the LOAD is and refuses to answer
// when nothing is close. A movement with no comparable history falls through to
// step 4, whose bodyweight x muscle x type x equipment table already knows a rear
// delt fly is not a row — a far better answer than a confident wrong one.
//
// THREE GATES, each measured into existence rather than assumed. Every one of them
// was added because the sweep over all 106 loadable movements produced a number no
// one would attempt:
//   REGION   — a leg press cannot tell you what you calf raise. Different tissue,
//              and no coefficient bridges it.
//   TYPE     — compound vs isolation is the biggest single load gap there is, and
//              there is no defensible generic ratio for it. Without this gate a
//              360 lb leg press prescribed a 360 lb LEG EXTENSION, and a 170 lb
//              machine press prescribed a 170 lb CABLE FLY.
//   LOADING  — a bodyweight movement's weight box means ADDED load; a stack's means
//              total load. They are different quantities and must never cross.
//              Without this gate a 170 lb machine press prescribed a 170 lb
//              WEIGHTED VEST for push-ups.
//
// NOT solved by writing 175 more MOVEMENT_CLASS rows. That table is hand-authored
// for pairs whose ratio is actually known and stays the higher-precedence answer
// (steps 2/3). This is the generic fallback beneath it, and it has to work for
// movements nobody has written a coefficient for — including Sam's own custom
// exercises, which is exactly when it gets used.

// Sub-muscle regions, read off the tags EX already carries.
const LOAD_REGION_TAGS=['quad','hamstring','glute','calf','soleus','adductor','tibialis','hip_flexor',
  'vertical','horizontal','rear_delt','trap','scapular','side_delt'];
const loadRegions=(e)=>(e.tags||[]).filter(t=>LOAD_REGION_TAGS.includes(t));
// Movement PATTERN, which is a different axis from region and has to be scored
// separately — 'squat' and 'hinge' are not in LOAD_REGION_TAGS, and leaving them out
// of the score was measured as a real misfire: a Bulgarian split squat scored the
// back squat (shared region quad, shared pattern squat) BELOW a leg press (shared
// region only) purely because the leg press's rep range sat closer, and took a
// 360 lb leg press as its reference instead of the 225 lb squat. Pattern is worth
// more than rep proximity, which is the weakest signal here.
const LOAD_PATTERN_TAGS=['squat','hinge','lateral','carry','isometric','power','eccentric'];
const loadPatterns=(e)=>(e.tags||[]).filter(t=>LOAD_PATTERN_TAGS.includes(t));
// Per-hand loading (dumbbells with no barbell alternative) vs one total number. The
// estimator, the weight inputs and the "lb ea" unit all key off this same test.
const perHandLoaded=(e)=>!!((e.eq||[]).includes('dumbbells')&&!(e.eq||[]).includes('barbell'));
const isUnilateral=(e)=>(e.tags||[]).includes('unilateral');
const repMid=(e)=>((e.rMin||8)+(e.rMax||12))/2;
// What the number in the weight box physically MEANS. coldStartWeight computes the
// same five buckets and now calls this, because two functions answering this
// question separately is precisely how they drift apart.
//
// BODYWEIGHT IMPLEMENTS ARE TESTED FIRST, which the older inline version did not do,
// and it matters: `eq` lists what can HOST a movement, not how it is loaded. An
// Inverted Row reads eq=[barbell,cables,machine,pullup_bar] and was therefore classed
// as a barbell lift — so it inherited a barbell row's 155 lb, for a movement whose
// weight box means ADDED load on top of your own body. Bottom-Half ATG Squat and the
// weighted pull-ups had the same shape of error. A bar you hang from supplies no
// resistance, so pullup_bar belongs on this side of the line with bodyweight and
// own_gear (the vest).
function loadClass(e){
  const eq=e.eq||[];
  // Bodyweight-class means NO external-resistance implement at all. Testing for the
  // PRESENCE of 'bodyweight' instead is wrong and was measured as such: most leg
  // lifts list it to mean 'can be done unloaded', so that test threw away every good
  // anchor they had and dropped the whole leg pool onto the cold-start default.
  // Explicit per-exercise override, in the spirit of startW. Swept the whole pool:
  // exactly ONE movement lists a non-resistance host alongside a resistance implement
  // and is really bodyweight — the Inverted Row, whose barbell/cables/machine entries
  // are all things to hang UNDER. Everything else that pairs 'bodyweight' with an
  // implement (Bulgarians, hip thrusts, calf raises) is genuinely loaded by it.
  if(e.bwBase)return 'bw';
  const RESISTANCE=['barbell','dumbbells','cables','machine','medball','medball_wall','kettlebell'];
  if(!eq.some(q=>RESISTANCE.includes(q)))return 'bw';
  return eq.includes('barbell')?'bb':eq.includes('machine')?'mach':eq.includes('cables')?'cable'
    :eq.includes('dumbbells')?'db':'bw';
}

// Free weight vs supported vs bodyweight — the stabilisation axis, coarser than the
// implement itself and used to break ties when the implements differ.
const loadFamily=(e)=>{const c=loadClass(e);return c==='bb'||c==='db'?'free':c==='bw'?'bw':'supported';};

// How well does `cand` stand in for `target` as a load reference? null = cannot,
// otherwise a score (higher = more comparable). The gates are hard; the score only
// chooses among candidates that already passed them.
function loadComparability(target,cand){
  if(cand.muscle!==target.muscle)return null;
  if(cand.type!==target.type)return null;                     // TYPE gate
  const tbw=loadClass(target)==='bw',cbw=loadClass(cand)==='bw';
  if(tbw!==cbw)return null;                                   // LOADING gate
  const tr=loadRegions(target),cr=loadRegions(cand);
  if(tr.length&&cr.length&&!tr.some(t=>cr.includes(t)))return null;  // REGION gate
  let score=0;
  score+=tr.filter(t=>cr.includes(t)).length*4;      // shared region — the main signal
  const tp=loadPatterns(target),cp=loadPatterns(cand);
  score+=tp.filter(t=>cp.includes(t)).length*3;      // shared pattern — how the load is carried
  if(loadClass(target)===loadClass(cand))score+=3;   // same implement, so same leverage
  // Failing an exact implement match, still prefer the same FAMILY: a machine or
  // cable stabilises you and a free weight does not, and that gap moves real load.
  // Without this, standing unilateral work (step-ups, reverse and lateral lunges)
  // anchored to the LEG PRESS — a supported machine at 360 lb — and opened at
  // 100 lb per hand, because the leg press's rep range happened to sit closer than
  // the back squat's.
  if(loadFamily(target)===loadFamily(cand))score+=2;
  if(perHandLoaded(target)===perHandLoaded(cand))score+=2;
  if(isUnilateral(target)===isUnilateral(cand))score+=2;
  // Rep-range proximity: movements trained in the same range are loaded alike.
  score+=Math.max(0,3-Math.abs(repMid(target)-repMid(cand))/3);
  return score;
}

// Convert the anchor's load into the target's terms. ONLY conversions with a stated
// basis are applied — a coefficient invented to paper over a mismatch is how 290 lb
// calf raises happen, and anything that needs one is refused by a gate instead.
//   per-hand <-> total: one hand carries about half the total. Same bridge the
//     hand-authored table uses (db_row from bb_row is coef 0.5, the inverse 1.9).
//   bilateral -> unilateral: MOVEMENT_CLASS's own note records that RFESS TOTAL load
//     reads ~55% of a back squat; that number is reused here rather than a new one,
//     and the inverse rounds to 1.8.
// Leverage across implements (a leg press moves ~1.8x a back squat) is deliberately
// NOT bridged: the ratio swings from 1.8 for that pair to 0.95 for machine-press vs
// bench, so no single constant is honest. It is handled by PREFERRING a same-
// implement anchor in the score above — pick a better reference rather than invent
// a conversion.
function loadBridge(target,cand){
  let c=1;
  if(perHandLoaded(target)&&!perHandLoaded(cand))c*=0.5;
  else if(!perHandLoaded(target)&&perHandLoaded(cand))c*=1.9;
  if(isUnilateral(target)&&!isUnilateral(cand))c*=0.55;
  else if(!isUnilateral(target)&&isUnilateral(cand))c*=1.8;
  return c;
}

// ─────────────────────────────────────────────
// INTENSITY ESTIMATION ENGINE — starting weight for unperformed movements
// ─────────────────────────────────────────────
// CONTRACT: estimateStartingWeight() ALWAYS returns a numeric weight plus a
// confidence tag (high/medium/low) for any exercise — it never returns null,
// undefined, or a blank. No loaded movement in a generated workout may render
// without a starting estimate.
//
// Strict fallback order — stop at the FIRST step that produces a value, but
// never exit early without one; the chain always terminates at step 4:
//   1. HISTORY (high):   logged sets for THIS exact exercise → most recent
//      working weight.
//   2/3. RELATED (medium): related movements via the anchor matrix — same
//      muscle-group-focus accessories AND primary compounds — scaled by
//      movement-ratio coefficients that bridge relative strength AND loading
//      convention (barbell total vs. per-hand dumbbell vs. machine stack).
//   3b. GROUP FLOOR (low): best estimated 1RM among any logged lift in the
//      same primary muscle group, taken at a conservative 60% working floor.
//   4. DEFAULT (low):    no reference data at all → a conservative default
//      derived from bodyweight × an experience multiplier × the movement's
//      loading convention. This step can ALWAYS produce a number.
// Coefficients/defaults are deliberately rough: the goal is a safe, in-the-
// ballpark opener the user adjusts on set one, not a precise prediction.

// Derived movement id → ranked anchor list. coef = derived load ÷ anchor load,
// so per-hand dumbbell anchors/targets carry sub-1 or >1 factors accordingly.
// Below this, "comparable" is doing no work and step 4's bodyweight-derived
// default is the more honest answer. Type, region and loading class are GATES, so
// everything reaching the score already shares them; what the score separates is
// how alike the implement, laterality and rep range are. A full match reaches 14,
// a same-region pair differing on implement and laterality lands near 7, and a pair
// agreeing on nothing but the gates scores ~0-3 — which is the case this cuts.
const COMPARABILITY_MIN=5;

const MOVEMENT_CLASS = {

  heavy_box_squat:  [{from:'squat',pct:0.85},{from:'heavy_trap_bar',pct:0.85,coef:0.95},{from:'trap_bar_dl',pct:0.85,coef:0.95},{from:'leg_press',pct:0.85,coef:0.55},{from:'goblet',pct:0.85,coef:2.8}],

  heavy_split_squat:[{from:'bulgarian',pct:0.9,coef:2.0},{from:'squat',pct:0.9,coef:0.55},{from:'goblet',pct:0.9,coef:2.2}],

  ecc_box_squat:    [{from:'heavy_box_squat',pct:0.65},{from:'squat',pct:0.65},{from:'leg_press',pct:0.65,coef:0.55},{from:'goblet',pct:0.65,coef:2.8}],

  leg_curl:      [{from:'seated_leg_curl',coef:1.0}],

// Epley 1RM estimate from a single working set.
function epley1RM(weight,reps){
  if(!weight||!reps)return 0;
  return weight*(1+reps/30);
}

// Most representative logged working weight for an exercise: the heaviest set
// of its most recent logged session, falling back to a manually entered
// lastWeights value. Returns {weight,reps} or null. Loaded sets only.
function loggedBaseline(exId,logs){
  for(let i=logs.length-1;i>=0;i--){
    const e=logs[i].exercises?.find(x=>x.id===exId);
    const sets=e?.sets?.filter(s=>s?.weight>0&&s?.reps>0);
    if(sets?.length){
      const top=sets.reduce((a,s)=>s.weight>a.weight?s:a,sets[0]);
      return{weight:top.weight,reps:top.reps};
    }
  }
  const lw=S.lastWeights?.[exId];
  if(lw&&lw.weight>0)return{weight:lw.weight,reps:lw.reps||EX.find(e=>e.id===exId)?.rMax||8};
  return null;
}

// Experience proxy for the step-4 default. Honors an explicit cfg.experience
// if ever set; otherwise infers from how many sessions the user has logged.
// (history is capped at LOG_KEEP entries on save; the n>=6 threshold saturates at 'intermediate' — a
// deliberately conservative ceiling for a no-data cold-start guess.)
function experienceLevel(){
  if(S.cfg?.experience)return S.cfg.experience;
  const n=(S.logs||[]).filter(l=>!l.isCardio).length;
  return n>=6?'intermediate':'beginner';
}

// Timed movements that still REQUIRE an external load (e.g. Suitcase Carry's
// dumbbell) get a weight input alongside the seconds field; bodyweight holds
// (wall sits, planks, L-sits, holds where load is optional) don't.
function timedLoaded(ex){return !!ex&&ex.isTimed===true&&!ex.noWeight&&(ex.eq||[]).length>0&&!ex.eq.includes('bodyweight');}

// Step 4 terminal default: a conservative working weight derived from
// bodyweight × experience multiplier × the movement's loading convention.
// ALWAYS returns a positive number — this is the floor that guarantees the
// engine never comes up empty.
function coldStartWeight(def,bodyLbs,exp){
  const load=loadClass(def); // shared with the comparability gate — see loadClass
  // Beginner working-set load as a fraction of bodyweight. DB = per hand.
  const COMPOUND={
    legs:     {bb:0.75,mach:1.10,cable:0.50,db:0.30,bw:0.30},
    chest:    {bb:0.50,mach:0.55,cable:0.30,db:0.22,bw:0.20},
    back:     {bb:0.45,mach:0.55,cable:0.45,db:0.22,bw:0.20},
    shoulders:{bb:0.30,mach:0.35,cable:0.20,db:0.13,bw:0.15},
    core:     {bb:0.30,mach:0.35,cable:0.25,db:0.15,bw:0.15},
  };
  const ISO={
    legs:     {mach:0.45,cable:0.25,db:0.15,bb:0.30,bw:0.15},
    chest:    {mach:0.25,cable:0.15,db:0.10,bb:0.20,bw:0.10},
    back:     {mach:0.30,cable:0.20,db:0.10,bb:0.20,bw:0.10},
    shoulders:{mach:0.15,cable:0.07,db:0.05,bb:0.10,bw:0.05},
    biceps:   {mach:0.20,cable:0.18,db:0.10,bb:0.15,bw:0.10},
    triceps:  {mach:0.20,cable:0.18,db:0.10,bb:0.15,bw:0.10},
    core:     {mach:0.20,cable:0.15,db:0.08,bb:0.10,bw:0.08},
  };
  const table=def.type==='compound'?COMPOUND:ISO;
  const fallbackRow=def.type==='compound'?{bb:0.4,mach:0.5,cable:0.3,db:0.2,bw:0.2}:{mach:0.2,cable:0.15,db:0.1,bb:0.15,bw:0.1};
  const row=table[def.muscle]||fallbackRow;
  const frac=row[load]!=null?row[load]:(def.type==='compound'?0.3:0.1);
  const mult=exp==='advanced'?1.6:exp==='intermediate'?1.3:1.0;
  const floor=load==='db'?5:10;
  return Math.max(r5(bodyLbs*frac*mult),floor);
}

// Core engine — see CONTRACT above. ALWAYS returns {weight,source,confidence}
// (with optional `from`), never null. confidence ∈ high|medium|low.
//   source: 'history' | 'anchor' | 'group' | 'default' | 'bodyweight'
function estimateStartingWeight(exId, historicalPerformanceLogs, movementClassMatrix){
  const logs=historicalPerformanceLogs||[];
  const matrix=movementClassMatrix||MOVEMENT_CLASS;
  // Custom exercises are looked up too — they used to miss here, so every
  // hand-added movement fell straight through to the step-4 cold-start default
  // even when its own history or an in-group anchor was sitting right there.
  const def=exById(exId);
  const bodyLbs=S.cfg?.bodyLbs||175;
  const exp=experienceLevel();
  if(!def)return{weight:coldStartWeight({eq:[],type:'isolation',muscle:''},bodyLbs,exp),source:'default',confidence:'low'};

  // Bodyweight / timed movements carry no external load — the "starting weight"
  // is bodyweight itself (the UI still renders reps/seconds, not a weight box).
  // Exception: loaded timed movements (Suitcase Carry) go through the engine.
  if(def.noWeight||(def.isTimed&&!timedLoaded(def)))return{weight:bodyLbs,source:'bodyweight',confidence:'high'};

  // Step 1 — logged history for THIS exact exercise → most recent working weight.
  const own=loggedBaseline(exId,logs);
  if(own&&own.weight>0)return{weight:own.weight,source:'history',from:exId,confidence:'high'};

  // Steps 2/3 — related movements via the anchor matrix, scaled by ratio.
  // Two independent bridges compose per anchor: `coef` bridges the LOADING
  // CONVENTION (barbell total vs per-hand DB vs machine stack) off the
  // anchor's working weight, while `pct` bridges INTENSITY — it runs the
  // anchor's baseline through Epley to an estimated 1RM first, then takes
  // pct of it. pct is what lets the heavy 1–5 @ 85–95% tier be estimated
  // from moderate-rep history: a 185×8 RDL and a 205×5 RDL imply the same
  // ~235 e1RM, so both produce the same ~85% opener, where a flat working-
  // weight coefficient would not.
  for(const a of (matrix[exId]||[])){
    const base=loggedBaseline(a.from,logs);
    if(base&&base.weight>0){
      const raw=a.pct?epley1RM(base.weight,base.reps)*a.pct:base.weight;
      const w=r5(raw*(a.coef!=null?a.coef:1));
      if(w>0)return{weight:w,source:'anchor',from:a.from,confidence:'medium'};
    }
  }

  // Step 3a — explicit per-exercise preset (startW): equipment-constrained
  // loads like a medicine ball, where a strength-scaled estimate from other
  // lifts would be meaningless (nobody chest-passes 60% of their bench 1RM).
  if(def.startW)return{weight:def.startW,source:'preset',confidence:'medium'};

  // Step 3b — the MOST COMPARABLE logged movement, converted into this movement's
  // terms. See loadComparability above for why this is not "the heaviest lift in
  // the same muscle group": that answer opened every leg movement Sam owns at the
  // same 290 lb, calf raises included.
  //
  // Two conversions, in this order:
  //   INTENSITY — the anchor's working set runs through Epley to an e1RM and back
  //     down at the TARGET's own rMax. Same trick the heavy 1-5 tier's `pct` anchors
  //     use, and it self-scales with no per-movement constant: a 12-rep isolation
  //     opens lighter than a 5-rep compound off identical history. Applied ALWAYS,
  //     including when the ranges match — Epley in and out then cancels exactly, so
  //     the branch that used to skip it bought nothing and got the edge case wrong
  //     (ranges touching at a single rep counted as "overlapping", which handed a
  //     deep 8-12 ATG squat the full 4-8 back-squat working weight).
  //   LOADING — loadBridge converts per-hand vs total and bilateral vs unilateral.
  let bestScore=-1,bestFrom=null,bestW=0;
  [...EX,...(S.customExercises||[])].forEach(e=>{
    if(e.noWeight||e.isTimed||e.id===exId)return;
    const score=loadComparability(def,e);
    if(score===null||score<COMPARABILITY_MIN)return;
    const base=loggedBaseline(e.id,logs);
    if(!base||!(base.weight>0))return;
    const raw=epley1RM(base.weight,base.reps)/(1+(def.rMax||12)/30);
    const w=r5(raw*loadBridge(def,e));
    if(!(w>0))return;
    // Ties break toward the closer rep range, then by EX order — deterministic,
    // the same rule pickEx's leastUsed uses, so the answer never depends on which
    // session happened to be logged most recently.
    if(score>bestScore){bestScore=score;bestFrom=e.id;bestW=w;}
  });
  if(bestW>0)return{weight:bestW,source:'comparable',from:bestFrom,confidence:'low'};

  // Step 4 — no reference data anywhere: conservative bodyweight-based default.
  // This branch can always produce a number, so the engine never returns null.
  return{weight:coldStartWeight(def,bodyLbs,exp),source:'default',confidence:'low'};
}

// Human-readable basis for an estimate, for the workout UI hints.
function estBasisLabel(est){
  if(!est)return'';
  if(est.source==='history')return'your last session';
  if(est.source==='anchor')return`scaled from your ${exById(est.from)?.name||'related lift'}`;
  if(est.source==='preset')return'typical starting load for this movement';
  if(est.source==='comparable')return`scaled from your ${exById(est.from)?.name||'closest comparable lift'} — the closest match you've logged for this kind of load`;
  if(est.source==='default')return`${experienceLevel()}-level default from your bodyweight`;
  return'estimate';
}
function fmtDate(iso){
  const d=new Date(iso);
  return d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
}
function fmtDur(mins){return mins<60?`${mins}m`:`${Math.floor(mins/60)}h ${mins%60}m`;}

// A session's timer runs until Finish is tapped, so a workout that was finished
// but never submitted banks the whole gap until the app is next opened (a lunch
// session left open logged as a 17 h workout the following morning). Past this
// threshold the number is measuring the clock, not the training.
const MAX_SESSION_MINS=240;
// Manual edits are explicit user intent, so they clamp far looser than the auto
// sanity check — a logged hike or long ride legitimately runs past MAX_SESSION_MINS.
const MAX_LOGGED_MINS=1440;
// Fallback estimate from the work actually recorded: ~3 min per set covers the
// set plus its rest.
function estimateSessionMins(exData){
  const sets=(exData||[]).reduce((n,e)=>n+((e.sets||[]).length),0);
  return Math.max(15,Math.min(MAX_SESSION_MINS,Math.round(sets*3)));
}
// <input type='datetime-local'> speaks local wall-clock with no zone attached;
// log.date is a full ISO/UTC timestamp. Convert both ways through Date rather
// than slicing the ISO string, which would shift the shown time by the UTC offset.
function toLocalInputValue(iso){
  const d=new Date(iso);if(isNaN(d))return'';
  return`${localDateStr(d)}T${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function fromLocalInputValue(v){
  const d=new Date(v);return isNaN(d)?null:d.toISOString();
}
// A log stores its FINISH timestamp plus a duration, so the start is derived
// rather than remembered — and it is exact, because the timer starts when the
// session does. A session submitted hours late therefore still knows when it
// really began: only the finish end is wrong, which is the one worth editing.
function logStartIso(log){
  return new Date(new Date(log.date).getTime()-(log.duration||0)*60000).toISOString();
}
function minsBetween(startIso,finishIso){
  return Math.round((new Date(finishIso).getTime()-new Date(startIso).getTime())/60000);
}

// ─────────────────────────────────────────────
// CALORIE / CARDIO MATH
// ─────────────────────────────────────────────
function estimateStrengthCals(mins,bodyLbs){
  return Math.round(bodyLbs*0.033*mins);
}

// ─── CARDIO ACTIVITY LOGGING ───
// Loggable activities for the "Log Cardio Activity" flow (distinct from the
// pre-workout cardioOptions() suggestion card above/below — this computes
// calories FROM a duration you already did, rather than a duration to hit a
// target). Incline Walking and Weighted Vest Walking are pinned to exactly 2x
// the flat-walk rate per instruction, rather than the more granular ACSM-grade
// formula cardioOptions uses for its own incline-treadmill suggestion.
const CARDIO_ACTIVITIES=[
  {id:'walk',name:'Walk (flat)',icon:'🚶'},
  {id:'incline_walk',name:'Incline Walking',icon:'⛰️',multiplier:2},
  {id:'weighted_vest_walk',name:'Weighted Vest Walking',icon:'🎒',multiplier:2},
  {id:'stair_stepper',name:'Stair Stepper',icon:'🪜'},
  {id:'elliptical',name:'Elliptical',icon:'⚡'},
  {id:'run',name:'Run',icon:'🏃‍♂️'},
];
function cardioCalPerMin(activityId,bodyLbs){
  const walkCpm=bodyLbs*0.0245; // 3 mph flat walk baseline, MET ~3.5
  switch(activityId){
    case 'incline_walk': return walkCpm*2;
    case 'weighted_vest_walk': return walkCpm*2;
    case 'stair_stepper': return bodyLbs*0.063;
    case 'elliptical': return bodyLbs*0.038;
    case 'run': return bodyLbs*0.070;
    case 'walk': default: return walkCpm;
  }
}

function cardioOptions(cals,bodyLbs){
  if(cals<=0)return[];
  const m=(cpm)=>Math.round(cals/cpm);
  const mi=(mph,min)=>((mph*min)/60).toFixed(1);
  // 3 mph walk: MET ~3.5, cals = MET * bodyKg * hrs
  const walkCpm=bodyLbs*0.0245; // 3 mph
  // Stair stepper: MET ~9, resistance level 8-12 typical YMCA
  const stairCpm=bodyLbs*0.063;
  // Elliptical: MET ~5.5, resistance 10-14 typical
  const ellCpm=bodyLbs*0.038;
  // Run 9-10 min/mile = ~6-6.7 mph, use 6.3 mph midpoint: MET ~10
  const runCpm=bodyLbs*0.070;
  // LISS incline treadmill (3.0 mph @ 6% grade): ACSM walking equation —
  // VO2 = 0.1*speed(m/min) + 1.8*speed*grade + 3.5 = ~20.2 ml/kg/min,
  // kcal/min = VO2 * bodyKg / 200. Grade roughly doubles the calorie cost of
  // flat walking while staying low-impact — good for fasted/pre-sleep fat
  // oxidation without the joint stress of running.
  const inclineCpm=bodyLbs*0.0459; // 3.0 mph @ 6% incline
  const wm=m(walkCpm),sm=m(stairCpm),em=m(ellCpm),rm=m(runCpm),im=m(inclineCpm);
  // Stair stepper resistance: rough scale based on calorie target/body weight
  const stairRes=Math.min(20,Math.max(8,Math.round(8+(bodyLbs-150)/25)));
  // Elliptical resistance: similar scale
  const ellRes=Math.min(20,Math.max(10,Math.round(10+(bodyLbs-150)/20)));
  return[
    {name:'Walk Outside',icon:'🚶',min:wm,dist:`${mi(3,wm)} mi`,note:'3 mph · flat ground',busy:false},
    {name:'Stair Stepper',icon:'🪜',min:sm,dist:'—',note:`Resistance level ${stairRes}`,busy:true},
    {name:'Elliptical',icon:'⚡',min:em,dist:'—',note:`Resistance level ${ellRes} · moderate stride`,busy:false},
    {name:'Incline Treadmill (LISS)',icon:'🏃',min:im,dist:`${mi(3,im)} mi`,note:'3.0 mph · 6% incline · fasted AM or pre-sleep for fat oxidation',busy:false},
    {name:'Run Outside',icon:'🏃‍♂️',min:rm,dist:`${mi(6.3,rm)} mi`,note:'9–10 min/mile pace',busy:false},
  ];
}

function calcWeekCardio(){
  const entry=getCalEntry();
  if(!entry||!S.program)return null;
  const plan=getWeekPlan();
  if(!plan)return null;
  const bodyLbs=S.cfg.bodyLbs||175;
  const today=todayStr();
  const rangeStart=today>entry.startDate?today:entry.startDate;
  const daysLeft=Math.max(1,daysBetween(rangeStart,entry.endDate)+1);
  const mondayDate=plan.weekOf;
  const strengthCals=S.program.week.filter(d=>{
    if(d.rest)return false;
    const dayDate=d.dow===0?addDays(mondayDate,6):addDays(mondayDate,d.dow-1);
    return dayDate>=rangeStart&&dayDate<=entry.endDate;
  }).reduce((sum,d)=>{
    const primary=estimateStrengthCals(d.sessionMins||45,bodyLbs);
    const eve=d.eveningSession?estimateStrengthCals(d.eveningSession.mins||60,bodyLbs):0;
    return sum+primary+eve;
  },0);
  // The calorie goal is a pure cardio target: prescribe cardio that adds up to
  // the full goal. Lifting burns extra calories on top and is NOT subtracted —
  // strengthCals is kept for display context only. (Subtracting it caused the
  // goal to be fully "covered" by lifting on normal training weeks, which
  // silently hid the cardio prescriptions.)
  const cardioCalsNeeded=Math.max(0,entry.cals);
  const calsPerDay=Math.round(cardioCalsNeeded/daysLeft);
  return{strengthCals,cardioCalsNeeded,calsPerDay,daysLeft,options:cardioOptions(calsPerDay,bodyLbs)};
}

// ─────────────────────────────────────────────
// REST TIMER
// ─────────────────────────────────────────────
// Intensity-based rest: heavy compounds need ≥2-3 min for full performance on
// the next set (Schoenfeld 2016 — longer inter-set rest beats 1 min for both
// strength and hypertrophy on compounds). Isolation floor raised 60→90s per
// Singer et al. 2024 Bayesian meta-analysis ("Give it a Rest", Frontiers
// Sports Act Living): ≤60s is the only clearly suboptimal zone for
// hypertrophy; no further benefit beyond ~90s, so 90s is the isolation minimum.
function smartRest(ex){
  if(ex.isTimed||ex.noWeight)return ex.rest||60;
  if(ex.type==='compound')return ex.rMax<=8?180:(ex.rMax<=12?150:120);
  return 90;
}
function smartRestLabel(ex){
  const s=smartRest(ex);
  const t=s>=60?(s%60===0?`${s/60} min`:`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`):`${s}s`;
  const why=ex.type==='compound'?(ex.rMax<=8?'heavy compound':'compound'):'isolation';
  return`${t} rest between sets (${why})`;
}
function startRest(secs,exName){
  if(timerIv)clearInterval(timerIv);
  S.active.restEndsAt=Date.now()+secs*1000;
  S.active.restTotal=secs;
  const ov=document.getElementById('rest-ov');
  document.getElementById('rest-exname').textContent=exName||'';
  ov.classList.add('on');
  const ring=document.getElementById('t-ring');
  const num=document.getElementById('t-num');
  const C=339;
  timerIv=setInterval(()=>{
    const rem=Math.ceil((S.active.restEndsAt-Date.now())/1000);
    if(rem<=0){stopRest(true);return;}
    const m=Math.floor(rem/60),ss=rem%60;
    num.textContent=`${m}:${String(ss).padStart(2,'0')}`;
    const pct=(S.active.restTotal-rem)/S.active.restTotal;
    ring.style.strokeDashoffset=(C*pct).toFixed(1);
  },250);
}
function playAlarm(){
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    [[880,0],[880,0.3],[1100,0.6]].forEach(([f,t])=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.connect(g);g.connect(ctx.destination);
      o.type='sine';o.frequency.value=f;
      g.gain.setValueAtTime(0.35,ctx.currentTime+t);
      g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+t+0.22);
      o.start(ctx.currentTime+t);o.stop(ctx.currentTime+t+0.25);
    });
  }catch(e){}
}
function stopRest(alarm){
  if(timerIv){clearInterval(timerIv);timerIv=null;}
  if(alarm)playAlarm();
  S.active&&(delete S.active.restEndsAt)&&(delete S.active.restTotal);
  document.getElementById('rest-ov').classList.remove('on');
  document.getElementById('t-ring').style.strokeDashoffset='0';
}

// ─────────────────────────────────────────────
// ACTIVE WORKOUT LOGIC
// ─────────────────────────────────────────────
// ─── DAILY SESSION CONSTRAINTS (user's local calendar day) ───
// Count of lifting sessions logged on a given local day. The app allows at
// most TWO per day (lunch + evening); a third is always refused.
function liftingSessionsOn(dayStr){
  // Cardio/VO2 logs don't occupy a lifting slot
  return (S.logs||[]).filter(l=>!l.isCardio&&logDay(l.date)===dayStr).length;
}

// Execution-time auto-regulation for the SECOND session of a day, ported from
// the backend design's 60% rule. Daily per-muscle budget = 50% of the weekly
// MRV max (which already reflects fatigue reductions). Reading today's logged
// session at start time:
//   ≤60% of a muscle's daily budget used → session 2 untouched for that muscle
//   >60% used → session 2's sets for it capped at (budget − used) × 0.85
//   ≥95% used → the muscle is blocked for session 2 (exercises dropped)
function applyDailyAutoReg(exs){
  const prior=(S.logs||[]).filter(l=>logDay(l.date)===todayStr());
  if(!prior.length)return{exs,notes:[]};
  const limits=getMRVLimits();
  const used={};
  prior.forEach(l=>(l.exercises||[]).forEach(e=>{
    const n=e.sets?.filter(s=>s&&s.reps>0).length||0;
    if(e.muscle&&n)used[e.muscle]=(used[e.muscle]||0)+n;
  }));
  const capFor=m=>Math.max(3,Math.round((limits[m]?.max??16)*0.5));
  const remaining={},state={},notes=[];
  Object.keys(used).forEach(m=>{
    const cap=capFor(m),u=used[m];
    if(u>=cap*0.95){
      state[m]='blocked';
      notes.push(`${MNAME[m]||m}: blocked — ${u}/${cap} daily sets already done`);
    }else if(u>cap*0.6){
      remaining[m]=Math.max(0,Math.floor((cap-u)*0.85));
      state[m]='reduced';
      notes.push(`${MNAME[m]||m}: capped at ${remaining[m]} set${remaining[m]===1?'':'s'} — session 1 used ${Math.round(u/cap*100)}% of today's budget`);
    }
  });
  const out=[];
  exs.forEach(e=>{
    const st=state[e.muscle];
    if(st==='blocked')return;
    if(st==='reduced'){
      const take=Math.min(e.sets||3,remaining[e.muscle]);
      if(take<=0)return;
      remaining[e.muscle]-=take;
      out.push({...e,sets:take,autoReg:true});
    }else out.push(e);
  });
  return{exs:out,notes};
}

function startWorkout(day,sessionType){
  // Two-per-day cap, judged on the LOCAL calendar day
  const sessionsToday=liftingSessionsOn(todayStr());
  if(sessionsToday>=2){
    alert('Daily session limit: two lifting sessions are already logged today. Recovery beats more volume — go again tomorrow.');
    return;
  }
  const isEve=sessionType==='eve'&&day.eveningSession;
  const src=isEve?day.eveningSession:day;
  // Use every exercise the program built for this session — it's already sized
  // at generation time (lunch=3, longer sessions=EX_LIMIT[mins]). Re-slicing
  // here with a hardcoded 3 for non-evening sessions hid exercises on 60/90-min
  // primary days; this keeps the started workout in sync with the Program tab.
  let rawExs=src.exercises.slice();
  // Makeup logic only for primary (lunch) sessions
  if(!isEve){
    const missed=getMissedDays();
    if(missed.length>0){
      const todayMuscles=new Set(rawExs.map(e=>e.muscle));
      missed.forEach(missedDow=>{
        const md=S.program.week[missedDow];
        if(!md||md.rest)return;
        const mu=md.exercises.find(e=>!todayMuscles.has(e.muscle));
        if(mu){rawExs=[...rawExs,{...mu,sets:2,isMakeup:true,makeupFrom:md.name}];todayMuscles.add(mu.muscle);}
      });
    }
  }
  // Lunch time-box clamp: mirrors the generation-time rule (lead lift 3 sets,
  // 2 for the rest) so sessions generated or preserved BEFORE the 2026-07-14
  // calibration also fit the 35–40 min box the moment they're started.
  if(src.isLunch)rawExs=rawExs.map((e,i)=>i>0&&e.sets>2?{...e,sets:2}:e);
  // Second session of the day → apply the 60% execution-time rule against
  // what was actually logged earlier today (not what was planned)
  let autoRegNotes=[];
  if(sessionsToday===1){
    const reg=applyDailyAutoReg(rawExs);
    rawExs=reg.exs;autoRegNotes=reg.notes;
    if(!rawExs.length){
      alert("Today's earlier session already used the volume budget for every muscle in this workout. Session blocked — recover and hit it tomorrow.");
      return;
    }
  }
  S.active={
    // Classify from the session's OWN flag, not from isEve. isEve is only true
    // when the day has a separate sibling eveningSession, which exists only on
    // days that ALSO have a lunch. An after-work session on a lunch-less day is
    // the day's PRIMARY session (eveningSession=null), so keying lunch off isEve
    // misread it as a 40-min lunch → 90s rest cap + wrong duration. src.isLunch
    // is set correctly at generation time for both the primary and the sibling.
    dayName:src.name,dow:day.dow,startTime:Date.now(),isLunch:!!src.isLunch,
    sessionMins:src.mins||src.sessionMins||40,loc:src.loc||'ymca',equipmentKey:src.equipmentKey||'ymca',restCap:src.isLunch?90:null,exIdx:0,
    autoRegNotes,
    // Initialization attaches an estimatedStartingWeight to any movement the
    // user has never logged, derived from related lifts via the intensity
    // estimation engine. null for movements with their own history.
    exercises:rawExs.map(e=>({...e,done:[],estW:estimateStartingWeight(e.id,S.logs,MOVEMENT_CLASS)})),
  };
  S.view='workout';save();render();
}

function completeSet(exIdx,setIdx){
  const ex=S.active.exercises[exIdx];
  const wEl=document.getElementById(`w-${exIdx}-${setIdx}`);
  const rEl=document.getElementById(`r-${exIdx}-${setIdx}`);
  const w=(ex?.noWeight||(ex?.isTimed&&!timedLoaded(ex)))?0:(parseFloat(wEl?.value)||0);
  const reps=parseInt(rEl?.value)||0;
  if(!reps){if(rEl)rEl.focus();return;}
  ex.done[setIdx]={weight:w,reps};
  const row=document.getElementById(`sr-${exIdx}-${setIdx}`);
  if(row){
    row.classList.add('done');
    const db=row.querySelector('.done-btn');
    if(db){db.innerHTML='↩';db.dataset.action='undo-set';}
    row.querySelectorAll('.ni').forEach(inp=>{if(inp.id!==`w-${exIdx}-${setIdx}`||wEl)inp.disabled=true;});
  }
  // The Next button belongs to the STATION, so a paired exercise only reveals it
  // once its partner is done too — and it always lives on the pair's LEADER, which
  // is the index the card was rendered under.
  const pIdxDone=pairPartnerIdx(exIdx);
  const partnerDone=pIdxDone<0?null:S.active.exercises[pIdxDone];
  const doneAll=(e)=>e.done.filter(Boolean).length>=e.sets;
  const allDone=doneAll(ex)&&(!partnerDone||doneAll(partnerDone));
  const btnIdx=(ex.pairId&&ex.pairPos===2&&pIdxDone>=0)?pIdxDone:exIdx;
  if(allDone){const nb=document.getElementById(`next-btn-${btnIdx}`);if(nb)nb.style.display='flex';}
  save();
  // Lunch sessions keep the 90s cap (hard 40-min time box); evenings get the
  // full intensity-based rest.
  // Paired sets: after A1 you get the short transition and go straight to A2;
  // the real rest lands after A2. Guarded on the partner actually still owing
  // this round — once A2 is finished for the session, A1 goes back to full rest
  // rather than sending you to a movement you're done with.
  // EMOM runs on the minute, so the rest timer is not the instrument — the top of
  // the next minute is. Starting a 150s rest inside a 60s minute would actively
  // mislead, so an EMOM session gets no timer at all.
  if(S.active.emom){save();return;}
  const pIdx=pairPartnerIdx(exIdx);
  const partner=pIdx>=0?S.active.exercises[pIdx]:null;
  const partnerOwesRound=partner&&!partner.done[setIdx]&&setIdx<partner.sets;
  if(ex.pairId&&ex.pairPos===1&&partnerOwesRound){
    startRest(PAIR_TRANSITION_SECS,`→ ${partner.name}`);
  }else{
    const restSecs=S.active.restCap?Math.min(smartRest(ex),S.active.restCap):smartRest(ex);
    startRest(restSecs,ex.name);
  }
}

function updateWarmup(exIdx,weight){
  const w=parseFloat(weight);if(!w||w<=0)return;
  const set=(id,val)=>{const el=document.getElementById(id);if(el)el.textContent=`${r5(w*val)} lb`;};
  set(`wu1-${exIdx}`,0.5);set(`wu2-${exIdx}`,0.75);set(`wu3-${exIdx}`,0.9);
}

function goToEx(idx){S.active.exIdx=idx;save();render();}

function finishWorkout(fatigue){
  const exData=S.active.exercises.map(e=>({id:e.id,name:e.name,muscle:e.muscle,sets:e.done.filter(Boolean)}));
  // Update lastWeights — only last set's weight per exercise, that's all we need
  exData.forEach(e=>{
    const working=e.sets.filter(s=>s&&s.reps>0&&!e.isMakeup);
    if(working.length){const last=working[working.length-1];S.lastWeights[e.id]={weight:last.weight,reps:last.reps,date:new Date().toISOString()};}
  });
  // Wall-clock elapsed is only correct if Finish was tapped when the work ended.
  let mins=Math.round((Date.now()-S.active.startTime)/60000);
  // `measured` records whether `duration` is a real clock reading or a recovered
  // guess. lunchExMins() calibrates the lunch time-box off these durations, and
  // an estimate derived FROM the set count must never feed back into the budget
  // that decides the set count — the same circularity the century's separate
  // timedMins field exists to prevent.
  let measured=true;
  if(mins>MAX_SESSION_MINS){
    const est=estimateSessionMins(exData);
    const ans=prompt(`This session's timer has been running ${fmtDur(mins)} — looks like it wasn't submitted when you finished.\n\nHow many minutes did the workout actually take?`,String(est));
    const parsed=parseInt(ans);
    // A number he typed IS a measurement — he read it off a clock. Only the
    // fallback estimate is disqualified.
    measured=!(ans===null||isNaN(parsed));
    mins=(ans===null||isNaN(parsed))?est:Math.max(1,Math.min(MAX_LOGGED_MINS,parsed));
  }
  // Stamp the finish at start+duration rather than "now": a session submitted the
  // next morning belongs to the day it was TRAINED, and every week-grid, recovery
  // and MRV lookup keys off logDay(log.date). Normally this lands within a minute
  // of now; the min() keeps a rounded-up duration from stamping the future.
  const finishedAt=new Date(Math.min(Date.now(),S.active.startTime+mins*60000)).toISOString();
  const log={id:Date.now().toString(),date:finishedAt,dayName:S.active.dayName,isLunch:S.active.isLunch,duration:mins,measured,exercises:exData,fatigue:fatigue||null};
  S.logs.push(log);S.active=null;S.view='dash';
  // Re-plan the rest of the week around what was just trained: recovery ordering
  // + the lockout windows push the just-worked muscle groups to later days (e.g.
  // a pull session today moves the next pull off of Wednesday in favor of a
  // rested split slot), while completed days stay locked to their logs.
  replanCurrentWeek();
  stopRest();save();render();
}

function abandonWorkout(){
  if(!confirm('Abandon this workout? Progress will be lost.'))return;
  S.active=null;S.view='dash';stopRest();save();render();
}

// ─────────────────────────────────────────────
// CONDITIONING FINISHER
// ─────────────────────────────────────────────
// Has an EVENING (non-lunch) lifting session already been logged this calendar
// week? This is the jump-durability guarantee's coverage test, and it is
// log-based for the same reason foundationCoveredThisWeek is: a guarantee keyed
// to a fixed CALENDAR DAY evaporates when that day gets skipped. Pinned to "the
// first evening on the schedule" it sat on Tuesday, so a missed Tuesday cost the
// whole week's jump work at any gym whose rotation doesn't happen to surface it
// again. Keyed to what was actually trained, it simply moves to Thursday.
//
// It converges rather than nagging: before the week's first evening every
// remaining evening offers it (they are all still the next opportunity), and the
// moment one is logged the rotation takes over again.
function eveningTrainedThisWeek(){
  const mon=thisMonday(),end=addDays(mon,7);
  return (S.logs||[]).some(l=>l&&!l.isCardio&&!l.isLunch
    &&logDay(l.date)>=mon&&logDay(l.date)<end);
}
function getFinisher(dow,isLunch,equipmentKey){
  // JUMP DURABILITY GETS THE WEEK'S FIRST EVENING SESSION (2026-08-17).
  // Sam: "i get gassed and cant jump that high in volleyball right now" — repeat
  // block-jump capacity is the direct answer, and it is CONDITIONING, not a
  // lifting slot: 6 sets of continuous submaximal jumps is a finisher-shaped
  // dose, and trying to carve it a leg slot instead was measured at 20% of weeks
  // (legs only get ~2 slots and both are mandated).
  //
  // The plain rotation below is `pool[dow%pool.length]` — pure dow arithmetic,
  // which surfaced this on Saturdays at the YMCA and NEVER at Westminster, where
  // the sprint entries make the pool longer. A block he is actively trying to
  // start can't depend on which index a location's pool lands on.
  //
  // Keyed to the first evening actually TRAINED, not to a fixed dow. Sam asked
  // "the jumps can be done on the evenings not just saturdays, right?", and the
  // fixed-day version answered that badly: it pinned the guarantee to Tuesday,
  // so a skipped Tuesday cost the whole week's jump work at any gym whose
  // rotation doesn't happen to surface it again. Any evening will do, and the
  // guarantee follows him to whichever one he takes.
  //
  // Lunch is excluded on purpose and not by accident of `lunchOK`: this is a
  // sweaty set and lunches have no shower. A lunch-only week therefore gets no
  // jump work at all — the same structural gap bear_crawl has, and honest.
  // Hip caution drops jump-based finishers, mirroring the pickEx plyometric ban.
  // Lunch sessions only draw from the lunchOK (low-sweat) subset — sprints and
  // hard intervals live on evenings/weekends so the lunch time-box stays dry.
  const hasRunway=SPRINT_LOCATIONS.has(equipmentKey);
  // needsEquip: a finisher that names specific gear is dropped where that gear
  // isn't. Unknown location => treat as unequipped, same conservative default
  // as the runway check.
  const equip=new Set(EQUIPMENT_PRESETS[equipmentKey]?.equipment||[]);
  const pool=CONDITIONING_FINISHERS.filter(f=>!(f.plyo&&S.cfg.hipCaution)&&(!isLunch||f.lunchOK)&&!(f.needsRunway&&!hasRunway)&&!(f.needsEquip&&!equip.has(f.needsEquip)));
  if(!isLunch&&jumpDurabilityOn()&&!eveningTrainedThisWeek()){
    const jd=pool.find(f=>f.jumpDurability);
    if(jd)return jd;
  }
  return pool[dow%pool.length];
}
function finisherHTML(dow,compact,isLunch,equipmentKey){
  // At lunch the finisher has to be AFFORDABLE, not just low-sweat. Its minutes
  // are now charged against the box like everything else (see LUNCH_LEDGER), so
  // if the ledger didn't leave room, no card is rendered — showing one anyway is
  // how a 40-minute lunch became a 43-minute one.
  if(isLunch&&!lunchBudget(dow).finisher)return'';
  const f=getFinisher(dow,isLunch,equipmentKey);
  const primer=f.sprint?`<div style='margin-top:10px;padding:10px 12px;background:rgba(96,165,250,.06);border:1px solid rgba(96,165,250,.25);border-radius:10px'>
      <div style='font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--acc);margin-bottom:4px'>🔑 ${SPRINT_PRIMER.title}</div>
      ${SPRINT_PRIMER.items.map(it=>`<div style='font-size:12px;color:var(--mut);line-height:1.7'>• ${it}</div>`).join('')}

      <div style='font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--warn);margin-bottom:4px'>🔥 Conditioning Finisher</div>
      <div style='font-size:14px;font-weight:700'>${f.icon} ${f.name}</div>

      ${f.sprint?`<div style='font-size:11px;color:var(--acc);margin-top:4px'>🔑 Prime first — leg swings, A-skips, and 3 build-ups before rep one.</div>`:''}
    </div>`;
  }
  return`<div style='margin-top:14px;padding:16px;background:rgba(251,191,36,.06);border:1px solid rgba(251,191,36,.2);border-radius:14px'>
    <div style='font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--warn);margin-bottom:8px'>🔥 Conditioning Finisher · Do this after your last set</div>
    <div style='font-size:18px;font-weight:800;margin-bottom:4px'>${f.icon} ${f.name}</div>
    <div style='font-size:13px;color:var(--mut);line-height:1.55'>${f.desc}</div>

// ─────────────────────────────────────────────
// DAILY SPINE MINIMUMS
// ─────────────────────────────────────────────
// Four FIXED daily poses (~5 min total) surfaced every single day, rest or
// training — unlike the rotating pools, these never rotate out. Doses are
// deliberate daily minimums: 60s child's pose (lumbar decompression + stress
// downshift), 2 min cobra (counters desk flexion, lower-back tension,
// posture), 60s plank (core stiffness protects the spine), 60s down dog
// (whole back line + circulation). Child's pose is cued KNEES WIDE — the
// knees-together version is deep hip flexion, the classic FAI impingement
// position (hipCaution).
const DAILY_SPINE_MINIMUMS=[
  {n:"Child's Pose",d:'60 sec · knees WIDE so the hips never pinch, sit toward the heels, arms long, slow nasal breathing — decompresses the spine and downshifts stress',hold:60},
  {n:'Cobra Pose',d:'2 min total, split into 3–4 holds · hips stay down, press the chest up only to a comfortable height — reverses desk flexion and eases lower-back tension',hold:120},
  {n:'Plank',d:'60 sec, split as needed · elbows under shoulders, glutes squeezed, ribs down — core stiffness is what protects the spine and holds posture',hold:60},
  {n:'Downward Dog',d:'60 sec · hips high, heels reaching, soft knees are fine — stretches the whole back line and gets blood moving',hold:60},
];
// ─────────────────────────────────────────────
// McGILL BIG 3
// ─────────────────────────────────────────────
// Stuart McGill's spine-sparing core protocol (2026-08-03, Sam asked for it by
// name). It is the standard-of-care answer for a lower back that's symptomatic
// but not injured — which is exactly this back: standing overhead pressing hurts,
// nothing else does. DAILY_SPINE_MINIMUMS is the mobility/decompression side of
// that; this is the STABILITY side, and the two are complements rather than
// alternatives. The shared principle: endurance, not strength. Holds are ~10s
// and reps descend, because trunk-muscle ENDURANCE is what correlates with
// spared backs, and high-rep or high-load trunk work is what aggravates them.
//
// Two McGill rules built into the cues rather than left to be looked up:
//  1) The lumbar spine does NOT move. Every one of the three is a braced hold
//     with movement happening somewhere else. If the low back is moving, the
//     exercise has become the thing it's meant to replace.
//  2) Not in the first hour after waking. Discs are at peak hydration overnight,
//     so loaded spine flexion right out of bed carries the most risk of the day.
//
// NOT ADDED TO DAILY_SPINE_MINIMUMS, and deliberately NOT charged to
// LUNCH_LEDGER.spineMins — this is a floor protocol that needs no gym, and the
// lunch arithmetic makes the cost of pretending otherwise concrete: adding 6 min
// of floor work to a box that already pays for the spine minimums and the prep
// block costs another lift outright. Paying that for work he can do on a rug at
// home would be a bad trade, so the card says morning or evening instead. If it
// ever DOES move into the lunch box, spineMins must move with it.
//
// Also deliberately NOT in EX, following the plank's precedent in FOUNDATION_FIVE:
// a fixed daily dose is a stronger guarantee than a weekly slot, and adding these
// to the core pool would double-program the same movements.
const MCGILL_BIG3=[
  {n:'Modified Curl-up',d:'Hands stacked under the low back, ONE knee bent and one leg straight. Tuck the chin slightly and lift the head, neck and shoulders as a single unit only an inch or two — the low back stays pressed on your hands and does not flatten or arch. Hold 10s, breathe. 6 reps, then 4, then 2, swapping which knee is bent between sets.',hold:10},
  {n:'Side Bridge',d:'On your side, elbow under the shoulder, knees bent (or legs straight to progress). Lift the hips into a straight line from knee to shoulder and brace — no sagging, no rolling forward. Hold 10s per side. 6 reps, then 4, then 2, each side.',hold:10},
  {n:'Bird Dog',d:'Quadruped, spine neutral and ribs down. Extend the opposite arm and leg to horizontal without letting the low back arch or the hips tip — a broomstick on your back shouldn\'t roll off. Hold 10s, then sweep the hand and knee along the floor to reset rather than standing down. 6 reps, then 4, then 2, each side.',hold:10},
];

// ─────────────────────────────────────────────
// PRE-LIFT PREP
// ─────────────────────────────────────────────
// Everything that happens between opening the workout and the first working
// set: hip decompression, the PT hip program, mobility, the desk reversal.
// It used to live inline in the workout renderer with hardcoded item counts
// (4 hip + 3 lower + 2 upper + 2 desk), which had two consequences Sam hit on
// the same day:
//
//   1) IT WAS FREE. The lunch ledger charged for the spine minimums, the
//      century and the lifts, and nothing at all for the block that sits in
//      front of exercise 1 — so the app kept promising 3 lifts and a century
//      inside 40 minutes while ~7 minutes of the box was already spent. His
//      report: "the duration for the first exercise is going to be way longer
//      every time bc the mobility movements and stretches are grouped into it.
//      Probably the main reason I wasnt able to finish my century today."
//   2) IT WAS THE SAME EVERY DAY. Sam's rule (2026-08-05): non-leg days should
//      be hip-and-spine specific because he arrives straight from a desk, and
//      leg days should add hamstring / Achilles / adductor prep.
//
// So prep is now a BUDGETED PLAN rather than a fixed list, computed here at
// module scope so lunchBudget() can charge for it, and assembled per session:
// blocks are filled round-robin (every block gets its first item before any
// gets a second, so no block can be starved) until the clock runs out.
//
// The clock is READ OFF THE PRESCRIPTION, not invented per item: every pool
// entry already states its own dose in its description ("30 sec/side",
// "8 reps/side", "15 swings"), so prepItemSecs parses that. Add a pool entry
// and it prices itself — the same self-maintaining property the rest of the
// file's derived numbers have.
const PREP_REP_SECS=3;        // the 3-count tempo these are all cued at — same anchor centurySetPlan uses
const PREP_TRANSITION_SECS=10;// getting into and out of position. The one estimated constant here.
function prepItemSecs(it){
  if(!it)return 0;
  const d=String(it.d||'');
  // "30 sec/side" is twice the work of "30 sec". "2 min total" is not.
  let perSide=/\/\s*(side|leg)\b|each side|per side|per leg|each way/i.test(d)&&!/total/i.test(d);
  let secs=0;
  const tm=d.match(/(\d+)\s*(?:[–\-]\s*(\d+)\s*)?(sec|min)/i);
  if(tm){
    const lo=+tm[1],hi=tm[2]?+tm[2]:+tm[1];
    secs=((lo+hi)/2)*(/min/i.test(tm[3])?60:1);
  }else{
    const rm=d.match(/(\d+)\s*(?:[–\-]\s*(\d+)\s*)?(?:\w+\s+)?(reps?|circles?|swings?|cycles?|steps?|walks?)/i);
    if(rm){
      const lo=+rm[1],hi=rm[2]?+rm[2]:+rm[1];
      secs=((lo+hi)/2)*PREP_REP_SECS;
    }
  }
  if(perSide)secs*=2;

// The prep pools have grown well past what fits before a session, so each
// workout shows a date-rotated subset instead of every item: the offset advances
// daily, the picks keep their pool order (mobilize → activate), and the full
// pool cycles across consecutive training days.
function stretchRot(pool,n){
  if(!pool||!pool.length)return[];
  const off=Math.floor(Date.now()/864e5)%pool.length;
  return Array.from({length:Math.min(n,pool.length)},(_,i)=>(off+i)%pool.length).sort((a,b)=>a-b).map(i=>pool[i]);
}

// How many minutes prep is ALLOWED. Lunch is a hard 40-minute box with a
// century and up to three lifts also drawing on it, so prep there is a tight
// 6 minutes; an evening can afford twice that. These are caps, not estimates —
// prepPlan fills up to them and stops, which is what makes the figure safe for
// lunchBudget to reserve without knowing which rotation lands on a given day.
// centuryLunch is the abbreviated cap for a lunch whose whole session is the
// hundred: at a measured ~30 min century there is no 40-minute box left to buy
// the ordinary 6 minutes AND the spine holds AND a lift, so the prep is cut to
// the fixed decompression/desk-reversal blocks plus about a minute of rotation.
// It is deliberately not zero — 100 pull-ups on a cold shoulder is the one thing
// in this app worth spending scarce minutes on.
const PREP_BUDGET_MINS={lunch:6,evening:12,centuryLunch:4};
