<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a12">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="manifest" href="manifest.json">
<title>Workout Planner</title>
<style>
:root{
  /* Base Colors */
  --bg:#0a0a12;--surf:#141420;--surf2:#1e1e2e;--surf3:#2a2a3e;
  --bdr:rgba(255,255,255,.07);--bdr-strong:rgba(255,255,255,.15);
  --acc:#818cf8;--acc2:rgba(129,140,248,.12);--acc-bright:#a5b4fc;
  --txt:#e2e8f0;--txt-dim:#cbd5e1;--mut:#64748b;--mut-light:#94a3b8;
  --ok:#34d399;--ok2:rgba(52,211,153,.12);--warn:#fbbf24;--warn2:rgba(251,191,36,.12);
  --bad:#f87171;--bad2:rgba(248,113,113,.12);

  /* Muscle Group Colors */
  --chest:#f87171;--back:#60a5fa;--shoulders:#a78bfa;
  --biceps:#34d399;--triceps:#fb923c;--legs:#f472b6;--core:#facc15;

  /* Enhanced Design System */
  --glass-bg:rgba(20,20,32,0.8);--glass-border:rgba(255,255,255,0.1);
  --shadow-sm:0 1px 2px 0 rgba(0,0,0,0.05);
  --shadow-md:0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
  --shadow-lg:0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -2px rgba(0,0,0,0.05);
  --shadow-xl:0 20px 25px -5px rgba(0,0,0,0.1), 0 10px 10px -5px rgba(0,0,0,0.04);
  --shadow-glow:0 0 20px rgba(129,140,248,0.3);
  --shadow-glow-sm:0 0 10px rgba(129,140,248,0.2);

  /* Gradients */
  --grad-primary:linear-gradient(135deg, var(--acc) 0%, var(--acc-bright) 100%);
  --grad-surface:linear-gradient(135deg, var(--surf) 0%, var(--surf2) 100%);
  --grad-glass:linear-gradient(135deg, rgba(20,20,32,0.9) 0%, rgba(30,30,46,0.8) 100%);
  --grad-accent:linear-gradient(135deg, #818cf8 0%, #a5b4fc 50%, #c7d2fe 100%);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;-webkit-tap-highlight-color:transparent}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:var(--bg);color:var(--txt);
  max-width:480px;margin:0 auto;overflow-x:hidden;
}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--surf);border-top:1px solid var(--bdr);display:flex;z-index:90;}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px 14px;border:none;background:none;color:var(--mut);font-size:10px;cursor:pointer;}
.nb.on{color:var(--acc)}
.nb svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.view{min-height:100vh;padding:24px 16px 100px}
.setup{min-height:100vh;padding:40px 16px 40px;display:flex;flex-direction:column}
.s-back{display:flex;align-items:center;gap:6px;color:var(--mut);font-size:14px;background:none;border:none;cursor:pointer;margin-bottom:28px;padding:0}
.s-title{font-size:26px;font-weight:800;line-height:1.2;margin-bottom:6px}
.s-sub{color:var(--mut);font-size:14px;margin-bottom:32px;line-height:1.5}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:24px}
.opts.col1{grid-template-columns:1fr}
.opts.col4{grid-template-columns:repeat(4,1fr)}
.opt{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px 12px;background:var(--surf);border:2px solid var(--bdr);border-radius:14px;cursor:pointer;text-align:center;transition:border-color .15s,background .15s;}
.opt.on{border-color:var(--acc);background:var(--acc2)}
.opt-v{font-size:28px;font-weight:800;margin-bottom:2px}
.opt-l{font-size:12px;color:var(--mut)}
.eq-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:24px}
.eq-item{display:flex;align-items:center;gap:8px;background:var(--surf);border:2px solid var(--bdr);border-radius:12px;padding:12px 10px;cursor:pointer;transition:border-color .15s,background .15s;}
.eq-item.on{border-color:var(--acc);background:var(--acc2)}
.eq-ico{font-size:20px;flex-shrink:0}
.eq-name{font-size:13px;font-weight:500;flex:1}
.eq-chk{width:18px;height:18px;border-radius:4px;border:2px solid var(--bdr);flex-shrink:0;display:flex;align-items:center;justify-content:center}
.eq-item.on .eq-chk{background:var(--acc);border-color:var(--acc)}
.dots{display:flex;gap:6px;justify-content:center;margin-top:auto;padding-top:24px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--bdr);transition:background .2s}
.dot.on{background:var(--acc)}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;padding:14px 20px;border-radius:13px;font-size:15px;font-weight:700;border:none;cursor:pointer;width:100%;transition:opacity .15s,transform .1s;}
.btn:active{transform:scale(.97);opacity:.85}
.btn-p{background:var(--acc);color:#0a0a12}
.btn-s{background:var(--acc2);color:var(--acc)}
.btn-g{background:transparent;border:1px solid var(--bdr);color:var(--txt)}
.btn-ok{background:var(--ok);color:#0a0a12}
.btn-sm{padding:10px 16px;font-size:13px;border-radius:10px}
.card{background:var(--surf);border:1px solid var(--bdr);border-radius:14px;padding:16px;margin-bottom:12px}
.card2{background:var(--surf2);border:1px solid var(--bdr);border-radius:10px;padding:12px}
.today{background:linear-gradient(135deg,var(--surf2) 0%,#1a1a30 100%);border:1px solid var(--acc2);border-radius:16px;padding:20px;margin-bottom:14px;}
.t-lbl{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--acc);margin-bottom:4px}
.t-name{font-size:24px;font-weight:800;margin-bottom:2px}
.t-desc{font-size:13px;color:var(--mut);margin-bottom:14px}
.t-exlist{margin-bottom:16px}
.t-ex{font-size:13px;padding:3px 0;display:flex;align-items:center;gap:6px}
.wk-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:20px}
.wk-day{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;border-radius:10px}
.wk-day.today{background:var(--acc2)}
.wk-dn{font-size:10px;color:var(--mut)}
.wk-dot{width:8px;height:8px;border-radius:50%}
.sec-lbl{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--mut);margin-bottom:10px}
.wkt-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.wkt-day{font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--acc)}
.wkt-prog{font-size:13px;color:var(--mut)}
.ex-card{background:var(--surf);border:1px solid var(--bdr);border-radius:16px;padding:20px;margin-bottom:12px}
.ex-name{font-size:22px;font-weight:800;margin-bottom:6px;line-height:1.2}
.m-tag{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px;}
.cue-btn{font-size:13px;color:var(--acc);background:none;border:none;cursor:pointer;padding:0;margin-bottom:10px;display:flex;align-items:center;gap:4px}
.cue-txt{font-size:13px;color:var(--mut);line-height:1.6;background:var(--surf2);padding:12px;border-radius:10px;margin-bottom:12px;display:none}
.cue-txt.open{display:block}
.wu-box{background:rgba(251,191,36,.06);border:1px solid rgba(251,191,36,.2);border-radius:12px;padding:14px;margin-bottom:14px}
.wu-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--warn);margin-bottom:8px}
.wu-row{font-size:13px;margin-bottom:5px;display:flex;gap:8px}
.wu-set{color:var(--mut)}
.wu-val{font-weight:600}
.wu-note{font-size:11px;color:var(--mut);margin-top:6px}
.last-info{font-size:13px;color:var(--mut);margin-bottom:6px}
.prog-hint{font-size:13px;color:var(--ok);background:rgba(52,211,153,.08);border-radius:8px;padding:8px 12px;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.sets-hdr{display:grid;grid-template-columns:28px 50px 1fr 1fr 38px;gap:4px;margin-bottom:6px}
.sh{font-size:11px;color:var(--mut);text-align:center}
.set-row{display:grid;grid-template-columns:28px 50px 1fr 1fr 38px;gap:4px;align-items:center;margin-bottom:6px}
.sn{font-size:13px;color:var(--mut);text-align:center}
.st{font-size:12px;color:var(--mut);text-align:center}
.ni{background:var(--surf2);border:1px solid var(--bdr);border-radius:8px;color:var(--txt);font-size:15px;font-weight:700;text-align:center;padding:8px 2px;width:100%;appearance:textfield;-moz-appearance:textfield;}
.ni::-webkit-outer-spin-button,.ni::-webkit-inner-spin-button{-webkit-appearance:none}
.ni:focus{outline:none;border-color:var(--acc)}
.done-btn{width:36px;height:36px;border-radius:8px;border:none;cursor:pointer;background:var(--surf2);color:var(--mut);font-size:16px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.set-row.done .sn,.set-row.done .st{color:var(--ok)}
.set-row.done .ni{background:rgba(52,211,153,.08);border-color:rgba(52,211,153,.2);color:var(--ok)}
.set-row.done .done-btn{background:var(--ok);color:#0a0a12}
.ex-nav{display:flex;gap:8px;margin-top:8px}
.ex-nav-btn{flex:1;padding:12px;border-radius:12px;font-size:14px;font-weight:600;border:1px solid var(--bdr);background:var(--surf);color:var(--txt);cursor:pointer}
.abandon{padding:10px;border-radius:10px;font-size:13px;border:1px solid var(--bdr);background:transparent;color:var(--mut);cursor:pointer;width:100%;margin-top:8px}
#rest-ov{display:none;position:fixed;inset:0;background:rgba(10,10,18,.92);backdrop-filter:blur(10px);z-index:999;flex-direction:column;align-items:center;justify-content:center;}
#rest-ov.on{display:flex}
.rest-inner{text-align:center;padding:32px}
.rest-lbl{font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--acc);margin-bottom:20px}
.tcircle{position:relative;width:160px;height:160px;margin:0 auto 16px}
.tcircle svg{position:absolute;inset:0}
#t-ring{fill:none;stroke:var(--acc);stroke-width:6;stroke-linecap:round;stroke-dasharray:339;stroke-dashoffset:0;transform:rotate(-90deg);transform-origin:60px 60px;transition:stroke-dashoffset .25s linear;}
.t-bg{fill:none;stroke:var(--surf2);stroke-width:6}
#t-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:800;}
.skip-rest{background:var(--surf2);color:var(--txt);border:1px solid var(--bdr);padding:12px 32px;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;margin-top:12px;}
.pg-day{background:var(--surf);border:1px solid var(--bdr);border-radius:14px;padding:16px;margin-bottom:10px}
.pg-day.today-day{border-color:var(--acc)}
.pg-dh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.pg-dn{font-size:15px;font-weight:700}
.pg-dd{font-size:12px;color:var(--mut)}
.pg-ex{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:4px}
.pg-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.log-item{background:var(--surf);border:1px solid var(--bdr);border-radius:14px;padding:16px;margin-bottom:10px;cursor:pointer}
.log-hdr{display:flex;align-items:center;justify-content:space-between}
.log-date{font-size:14px;font-weight:600}
.log-day{font-size:13px;color:var(--mut)}
.log-meta{font-size:12px;color:var(--mut);margin-top:4px}
.log-body{margin-top:12px;border-top:1px solid var(--bdr);padding-top:12px;display:none}
.log-body.open{display:block}
.log-ex{font-size:13px;margin-bottom:6px}
.log-sets{font-size:12px;color:var(--mut)}
.empty{text-align:center;padding:60px 16px;color:var(--mut)}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.shake{animation:shake .35s ease;border-color:var(--bad)!important}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mb8{margin-bottom:8px}
.hdg{font-size:20px;font-weight:800;margin-bottom:16px}
.sub{font-size:13px;color:var(--mut);margin-bottom:16px;line-height:1.5}
/* session badges */
.badge{display:inline-block;padding:3px 8px;border-radius:20px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;}
.badge-lunch{background:rgba(251,191,36,.15);color:var(--warn)}
.badge-eve{background:var(--acc2);color:var(--acc)}
/* calorie / cardio */
.cardio-list{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.cardio-row{display:flex;align-items:center;gap:10px;background:var(--surf2);border:1px solid var(--bdr);border-radius:12px;padding:10px 12px}
.cardio-row.cardio-busy{border-color:rgba(251,191,36,.25);background:rgba(251,191,36,.04)}
.cr-icon{font-size:20px;flex-shrink:0;width:26px;text-align:center}
.cr-body{flex:1;min-width:0}
.cr-name{font-size:13px;font-weight:700}
.cr-note{font-size:11px;color:var(--mut);margin-top:1px}
.cr-busy-tag{font-size:10px;color:var(--warn);font-weight:600;margin-left:5px;vertical-align:middle}
.cr-right{text-align:right;flex-shrink:0}
.cr-dur{font-size:16px;font-weight:800;color:var(--acc)}
.cr-dist{font-size:11px;color:var(--mut)}
/* evening time picker */
.eve-mins-picker{margin-bottom:14px}
.eve-mins-opts{display:flex;gap:6px;margin-top:8px}
.eve-mins-opts .opt{flex:1;padding:10px 4px}
.eve-mins-opts .opt-v{font-size:16px}
.bw-input-wrap{display:flex;align-items:center;gap:12px;margin-bottom:24px}
.bw-big{max-width:130px;font-size:28px !important;padding:14px 8px !important}
/* plan screen */
.plan-days{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:8px}
.plan-day{background:var(--surf);border:2px solid rgba(251,191,36,.4);border-radius:12px;padding:10px 4px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s,opacity .15s;user-select:none}
.plan-day.plan-skip{border-color:var(--bdr);opacity:.5}
.plan-day-name{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--txt);margin-bottom:3px}
.plan-day-tmpl{font-size:10px;color:var(--mut);margin-bottom:3px;line-height:1.3}
.plan-day-status{font-size:10px;font-weight:700;color:var(--warn)}
.plan-day.plan-skip .plan-day-status{color:var(--mut)}
.badge-makeup{background:rgba(248,113,113,.15);color:var(--bad)}
.pg-day.pg-skip{opacity:.45;border-style:dashed}
.pg-day.pg-missed{border-color:rgba(248,113,113,.4)}
/* availability plan rows */
.plan-slot-row{background:var(--surf);border:1px solid var(--bdr);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.plan-slot-day{font-size:13px;font-weight:700;margin-bottom:8px}
.plan-slot-checks{display:flex;gap:8px;flex-wrap:wrap}
.plan-chk{display:flex;align-items:center;gap:8px;background:var(--surf2);border:2px solid var(--bdr);border-radius:10px;padding:8px 10px;cursor:pointer;flex:1;min-width:105px;transition:border-color .15s,background .15s}
.plan-chk.on{border-color:var(--acc);background:var(--acc2)}
.plan-chk-box{width:18px;height:18px;border-radius:4px;border:2px solid var(--bdr);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;color:transparent}
.plan-chk.on .plan-chk-box{background:var(--acc);border-color:var(--acc);color:#0a0a12}
.plan-eve-opts{margin-top:10px;padding-top:10px;border-top:1px solid var(--bdr)}
.wk-day{cursor:pointer}
.wk-day.viewing{background:rgba(129,140,248,.2);border-radius:8px}
/* chat */
.chat-btn{position:fixed;bottom:76px;right:16px;width:50px;height:50px;border-radius:50%;background:var(--acc);color:#0a0a12;border:none;cursor:pointer;font-size:22px;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 14px rgba(0,0,0,.4);z-index:89;transition:transform .15s}
.chat-btn:active{transform:scale(.92)}
.chat-sheet{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;height:72vh;background:var(--surf);border-top:1px solid var(--bdr);border-radius:16px 16px 0 0;z-index:98;display:flex;flex-direction:column;box-shadow:0 -4px 24px rgba(0,0,0,.4)}
.chat-hdr{padding:14px 16px 12px;border-bottom:1px solid var(--bdr);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.chat-msgs{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.chat-bubble{max-width:88%;padding:10px 13px;border-radius:14px;font-size:13px;line-height:1.55;word-break:break-word}
.cb-user{background:var(--acc);color:#0a0a12;align-self:flex-end;border-bottom-right-radius:4px}
.cb-ai{background:var(--surf2);color:var(--txt);align-self:flex-start;border-bottom-left-radius:4px}
.chat-foot{padding:10px 12px;border-top:1px solid var(--bdr);display:flex;gap:8px;flex-shrink:0}
/* custom exercise autocomplete dropdown */
.ex-suggest{position:absolute;top:100%;left:0;right:0;z-index:60;background:var(--surf3);border:1px solid var(--bdr-strong);border-radius:10px;margin-top:4px;max-height:230px;overflow-y:auto;display:none;box-shadow:var(--shadow-lg)}
.ex-suggest.on{display:block}
.ex-suggest-item{padding:11px 12px;cursor:pointer;font-size:14px;font-weight:600;border-bottom:1px solid var(--bdr);display:flex;justify-content:space-between;align-items:center;gap:8px}
.ex-suggest-item:last-child{border-bottom:none}
.ex-suggest-item:active,.ex-suggest-item:hover{background:var(--acc2)}
.ex-suggest-item .es-mus{font-size:11px;font-weight:600;color:var(--mut);flex-shrink:0;text-transform:capitalize}
</style>
</head>
<body>
<div id="root"></div>
<button class="chat-btn" id="chat-btn" onclick="toggleChat()" title="Ask about exercises">💬</button>
<div id="chat-float"></div>
<div id="rest-ov">
  <div class="rest-inner">
    <div class="rest-lbl">Rest Period</div>
    <div class="tcircle">
      <svg viewBox="0 0 120 120" width="160" height="160">
        <circle class="t-bg" cx="60" cy="60" r="54"/>
        <circle id="t-ring" cx="60" cy="60" r="54"/>
      </svg>
      <div id="t-num">3:00</div>
    </div>
    <div id="rest-exname" style="font-size:13px;color:var(--mut);margin-bottom:16px"></div>
    <button class="skip-rest" id="skip-rest-btn" data-action="skip-rest">Skip Rest</button>
  </div>
</div>
<script>
// ─────────────────────────────────────────────
// EXERCISE DATABASE
// ─────────────────────────────────────────────
const EX = [
  {id:'bench',name:'Barbell Bench Press',muscle:'chest',type:'compound',eq:['barbell'],rMin:4,rMax:8,rest:180,cue:'Retract shoulder blades, slight arch. Lower bar to mid-chest with control (2 counts). Press through the bar. Last rep should look ugly.'},
  {id:'incline_db',name:'Incline DB Press',muscle:'chest',type:'compound',eq:['dumbbells'],rMin:6,rMax:10,rest:180,cue:'30–45° incline. Lower DBs to chest with elbows ~75° from torso. Squeeze at top. Control the descent — that\'s where the growth is.'},
  {id:'machine_press',name:'Machine Chest Press',muscle:'chest',type:'compound',eq:['machine'],rMin:6,rMax:10,rest:150,cue:'Set seat so handles are at mid-chest. Retract shoulder blades before pressing. Control the descent — 2 full counts down.'},
  {id:'pushups_w',name:'Push-ups (+ Weighted Vest)',muscle:'chest',type:'compound',eq:['bodyweight'],rMin:6,rMax:10,rest:120,cue:'Hands shoulder-width, body straight. Chest to floor, lock out top. Slow descent. Add vest for progressive overload.'},
  {id:'cable_fly',name:'Cable Fly',muscle:'chest',type:'isolation',eq:['cables'],rMin:8,rMax:12,rest:120,cue:'Slight elbow bend. Full stretch at bottom — feel it. Slow eccentric back. Squeeze hard at contraction.'},
  {id:'db_fly',name:'Dumbbell Fly',muscle:'chest',type:'isolation',eq:['dumbbells'],rMin:8,rMax:12,rest:120,cue:'Lower only to shoulder level. 2-count descent — slow and controlled. Soft elbows throughout.'},
  {id:'pec_deck',name:'Pec Deck',muscle:'chest',type:'isolation',eq:['machine'],rMin:8,rMax:12,rest:120,cue:'Full ROM, hard squeeze at contraction. Slow negative — resist the weight on the way back. Great for overload tracking.'},
  {id:'pullups',name:'Pull-ups',muscle:'back',type:'compound',eq:['pullup_bar'],rMin:4,rMax:8,rest:180,noWeight:true,cue:'Dead hang start. Drive elbows to hips — think about that, not pulling with hands. 3-count descent every rep, no dropping. Progression ladder: (1) build to 8 strict reps → (2) add 1s pause chin-over-bar each rep → (3) slow negative to 4 counts → (4) L-sit pull-ups (legs parallel) → (5) archer pull-ups. Weight is the last tool, not the first.',tags:['vertical']},
  {id:'chinups',name:'Chin-ups',muscle:'back',type:'compound',eq:['pullup_bar'],rMin:4,rMax:10,rest:180,noWeight:true,cue:'Supinated grip. Full dead hang, drive elbows down and back. 3-count descent. Progression: build reps → 1s top pause → 4-count negative → mixed grip → neutral grip → weighted. Great for both back and biceps.',tags:['vertical']},
  {id:'lat_pulldown',name:'Lat Pulldown',muscle:'back',type:'compound',eq:['cables'],rMin:6,rMax:10,rest:150,cue:'Slight lean back. Pull to upper chest, feel lat stretch fully at the top. Don\'t let elbows drift forward.',tags:['vertical']},
  {id:'bb_row',name:'Barbell Row',muscle:'back',type:'compound',eq:['barbell'],rMin:4,rMax:8,rest:180,cue:'Hip hinge, chest up. Bar to lower sternum. Drive elbows back and up. Control the negative — don\'t drop the bar.',tags:['horizontal']},
  {id:'db_row',name:'Dumbbell Row',muscle:'back',type:'compound',eq:['dumbbells'],rMin:6,rMax:10,rest:150,cue:'Brace hand on bench. Drive elbow to hip — not to the ceiling. Full stretch at bottom, full row.',tags:['horizontal']},
  {id:'cable_row',name:'Seated Cable Row',muscle:'back',type:'compound',eq:['cables'],rMin:6,rMax:10,rest:150,cue:'Sit tall, slight forward lean to stretch. Drive elbows back past your sides. No momentum.',tags:['horizontal']},
  {id:'straight_pull',name:'Straight-arm Pulldown',muscle:'back',type:'isolation',eq:['cables'],rMin:10,rMax:15,rest:120,cue:'Arms straight, slight forward lean. Sweep bar to thighs using lats only. Resist the cable on the way back up.'},
  {id:'face_pulls',name:'Face Pulls',muscle:'back',type:'isolation',eq:['cables'],rMin:12,rMax:15,rest:120,cue:'Rope at nose height. Pull to forehead and externally rotate (thumbs behind ears). Slow return. Non-negotiable for shoulder health.',tags:['rear_delt']},
  {id:'rev_fly',name:'Reverse Flyes',muscle:'back',type:'isolation',eq:['dumbbells'],rMin:12,rMax:15,rest:120,cue:'Bent over 45°, soft elbow. Lift only to parallel — rear delts, not traps. 2-count descent. Light weight, feel the muscle.',tags:['rear_delt']},
  {id:'ohp',name:'Overhead Press',muscle:'shoulders',type:'compound',eq:['barbell'],rMin:4,rMax:8,rest:180,cue:'Bar at clavicle, slightly in front of face. Press straight overhead, lock out. Brace core, no excessive lean.'},
  {id:'seated_db_press',name:'Seated DB Shoulder Press',muscle:'shoulders',type:'compound',eq:['dumbbells'],rMin:6,rMax:10,rest:180,cue:'Start at ear height, press up and slightly in. Full lockout. Control descent back to ear height.'},
  {id:'arnold_press',name:'Arnold Press',muscle:'shoulders',type:'compound',eq:['dumbbells'],rMin:6,rMax:10,rest:150,cue:'Start palms facing you, rotate to facing out as you press. All three delt heads involved. Control the descent.'},
  {id:'db_lateral',name:'DB Lateral Raise',muscle:'shoulders',type:'isolation',eq:['dumbbells'],rMin:12,rMax:20,rest:120,cue:'Slight forward lean, lead with elbows. Pause at top. Slow 2-count negative. Lateral delts respond well to higher reps.'},
  {id:'cable_lateral',name:'Cable Lateral Raise',muscle:'shoulders',type:'isolation',eq:['cables'],rMin:12,rMax:20,rest:120,cue:'Cross-body cable. Constant tension throughout ROM. Resist the weight on the way down — don\'t let it snap back.'},
  {id:'lying_cable_lat',name:'Lying Cable Lateral Raise',muscle:'shoulders',type:'isolation',eq:['cables'],rMin:12,rMax:20,rest:120,cue:'Lie sideways, cable from low pulley. Raise arm up. Slow descent. Excellent lateral delt isolation.'},
  {id:'incline_lateral',name:'45° Incline DB Raise',muscle:'shoulders',type:'isolation',eq:['dumbbells'],rMin:12,rMax:20,rest:120,cue:'Lie on incline bench. Raise arm out from a fully stretched position. Control the negative all the way down.'},
  {id:'db_curl',name:'DB Curl',muscle:'biceps',type:'isolation',eq:['dumbbells'],rMin:8,rMax:12,rest:120,cue:'Full supination at top (palm faces ceiling). 2-count negative — lower slowly, don\'t drop it. Full ROM at bottom.'},
  {id:'hammer_curl',name:'Hammer Curl',muscle:'biceps',type:'isolation',eq:['dumbbells'],rMin:8,rMax:12,rest:120,cue:'Neutral grip. Trains brachialis and brachioradialis. Resist the descent — 2 counts down.'},
  {id:'cable_curl',name:'Cable Curl',muscle:'biceps',type:'isolation',eq:['cables'],rMin:8,rMax:12,rest:120,cue:'EZ-bar or straight bar. Constant tension throughout. Control the eccentric — cable should never go slack.'},
  {id:'incline_curl',name:'Incline DB Curl',muscle:'biceps',type:'isolation',eq:['dumbbells'],rMin:8,rMax:12,rest:120,cue:'Long head fully stretched at bottom — key for peak development. Full supination at top. Slow negative. Very strict form.'},
  {id:'pushdown',name:'Tricep Pushdown',muscle:'triceps',type:'isolation',eq:['cables'],rMin:8,rMax:12,rest:120,cue:'Elbows pinned to sides. Full lockout every rep. Resist the stack on the way back up — slow eccentric builds the horseshoe.'},
  {id:'overhead_ext',name:'Overhead Tricep Extension',muscle:'triceps',type:'isolation',eq:['cables','dumbbells'],rMin:8,rMax:12,rest:120,cue:'Long head fully stretched overhead — highest growth potential. Keep elbows forward. 2-count descent. Full ROM.'},
  {id:'skull_crushers',name:'DB Skull Crushers',muscle:'triceps',type:'isolation',eq:['dumbbells'],rMin:8,rMax:12,rest:120,cue:'Lower DBs toward forehead with control — 2 counts down. Elbows slightly flared. Press back up. This is not a speed exercise.'},
  {id:'diamond_pu',name:'Diamond Push-ups',muscle:'triceps',type:'isolation',eq:['bodyweight'],rMin:10,rMax:15,rest:120,cue:'Hands close together. Elbows track backward. Full lockout at top, controlled descent. Add vest for progressive overload.'},
  {id:'squat',name:'Barbell Back Squat',muscle:'legs',type:'compound',eq:['barbell'],rMin:4,rMax:8,rest:180,cue:'Bar on upper traps. Sit back and down, knees track toes. Full depth. Drive the floor away on the way up.',tags:['quad','squat'],hipRisk:true},
  {id:'bulgarian',name:'Bulgarian Split Squat',muscle:'legs',type:'compound',eq:['dumbbells','bodyweight'],rMin:6,rMax:10,rest:180,cue:'Rear foot elevated. Front foot well forward. Upright torso. Drive through front heel. Count reps per leg.',tags:['quad','squat','unilateral'],hipRisk:true},
  {id:'goblet',name:'Goblet Squat',muscle:'legs',type:'compound',eq:['dumbbells'],rMin:6,rMax:10,rest:150,cue:'Hold DB at chest. Elbows between knees at bottom. Full depth. Controlled descent.',tags:['quad','squat'],hipRisk:true},
  {id:'step_ups',name:'Step-ups',muscle:'legs',type:'compound',eq:['dumbbells','bodyweight'],rMin:6,rMax:10,rest:150,cue:'Step onto stable surface, drive through full foot. Keep hips level throughout movement. Control the step down. Count per leg.',tags:['quad','unilateral']},
  {id:'reverse_lunge',name:'Reverse Lunge (DB)',muscle:'legs',type:'compound',eq:['dumbbells','bodyweight'],rMin:6,rMax:10,rest:150,cue:'Step BACK — hip-friendly. Front shin vertical. Drive through front heel to return. Control the descent. Count per leg.',tags:['quad','unilateral']},
  {id:'rdl',name:'Romanian Deadlift',muscle:'legs',type:'compound',eq:['barbell','dumbbells'],rMin:6,rMax:10,rest:180,cue:'Push hips BACK, feel hamstring stretch. Bar close to legs. Drive hips forward at top. Not a squat.',tags:['hinge','hamstring']},
  {id:'hip_thrust',name:'Hip Thrust',muscle:'legs',type:'compound',eq:['barbell','bodyweight'],rMin:6,rMax:10,rest:150,cue:'Shoulders on bench. Drive to full hip extension — squeeze at top. Slow controlled descent. Optional: 1s iso hold at top.',tags:['hinge','glute']},
  {id:'single_rdl',name:'Single-leg RDL',muscle:'legs',type:'compound',eq:['dumbbells','bodyweight'],rMin:6,rMax:10,rest:150,cue:'Hinge at hip, hips square throughout. Slow descent — feel the hamstring load. Soft bend in standing knee. Count per leg.',tags:['hinge','hamstring','unilateral']},
  {id:'leg_ext',name:'Leg Extension',muscle:'legs',type:'isolation',eq:['machine'],rMin:10,rMax:15,rest:120,cue:'Full lockout, hold 1s at top. Slow 2-count negative — resist the weight down. Lumbar support against pad.',tags:['quad']},
  {id:'leg_curl',name:'Lying Leg Curl',muscle:'legs',type:'isolation',eq:['machine'],rMin:10,rMax:15,rest:120,cue:'Flex hard at end range. 2-count descent — resist the weight back to start. Hips stay down.',tags:['hamstring']},
  {id:'db_leg_curl',name:'DB Leg Curl',muscle:'legs',type:'isolation',eq:['dumbbells'],rMin:10,rMax:15,rest:120,cue:'Lie face down, hold DB between feet. Curl to 90°. Slow 2-count negative back down.',tags:['hamstring']},
  // rest 60→90s: Singer et al. 2024 Bayesian meta-analysis ("Give it a Rest", Frontiers Sports Act Living) — hypertrophy slightly favors >60s rest, no further benefit beyond ~90s; ≤60s is the only clearly suboptimal zone.
  {id:'calf_raise',name:'Calf Raises',muscle:'legs',type:'isolation',eq:['bodyweight','machine'],rMin:10,rMax:15,rest:90,cue:'Full stretch at bottom (off step edge). Full contraction at top. Slow tempo — calves are resistant to fast reps.',tags:['calf']},
  {id:'hip_abduct',name:'Hip Abduction',muscle:'legs',type:'isolation',eq:['machine'],rMin:15,rMax:20,rest:90,cue:'Slow and controlled. Feel glute med. No momentum or pelvic tilt.',tags:['glute']},
  {id:'glute_bridge',name:'Single-leg Glute Bridge',muscle:'legs',type:'isolation',eq:['bodyweight'],rMin:12,rMax:20,rest:90,cue:'Single leg raises difficulty. Drive through heel. Full hip extension. Squeeze hard at top.\n\nProgression without bands: (1) Build reps → (2) Add 2s hold at top each rep → (3) Elevate your foot on a bench (increases ROM and difficulty) → (4) Add a backpack or a heavy book on your hip for resistance → (5) Barbell hip thrust when you reach a gym.',tags:['glute']},
  {id:'pallof',name:'Pallof Press',muscle:'core',type:'rotational',eq:['cables'],rMin:10,rMax:15,rest:90,cue:'Press out fully, hold 2s, return. Resist rotation — your core fights the cable the whole time. Count per side.',tags:['anti-rotation']},
  {id:'woodchop',name:'Cable Woodchop',muscle:'core',type:'rotational',eq:['cables'],rMin:10,rMax:15,rest:90,cue:'Rotate from thoracic spine, diagonal plane. Arms stay relatively straight. Count per side.',tags:['rotation']},
  {id:'half_kneel_press',name:'Half-kneeling Press',muscle:'core',type:'rotational',eq:['dumbbells','cables'],rMin:10,rMax:15,rest:90,cue:'Down knee is the loaded side. Tall posture. Press without leaning — core fights lateral forces. Per side.',tags:['asymmetrical']},
  {id:'sa_cable_row',name:'Single-arm Cable Row',muscle:'core',type:'rotational',eq:['cables'],rMin:10,rMax:12,rest:90,cue:'Core resists rotation as you row. Back AND anti-rotation in one. Count per side.',tags:['unilateral']},
  {id:'sa_db_row',name:'Single-arm DB Row (Standing)',muscle:'core',type:'rotational',eq:['dumbbells'],rMin:8,rMax:12,rest:90,cue:'No bench support. Bent over. Core braces hard against rotation on every rep. Count per side.',tags:['unilateral']},
  {id:'dead_bug',name:'Dead Bug',muscle:'core',type:'rotational',eq:['bodyweight'],rMin:8,rMax:12,rest:60,cue:'Lower opposite arm and leg simultaneously, back stays flat. Exhale on the way down. Slow and controlled — speed kills the point of this exercise. Count per side.',tags:['anti-rotation']},
  {id:'side_plank_dip',name:'Side Plank Hip Dips',muscle:'core',type:'rotational',eq:['bodyweight'],rMin:10,rMax:15,rest:60,cue:'Full side plank. Dip hip to floor and drive back up. Resist lateral flexion the whole time. Count per side.',tags:['lateral']},
  // ─── Hip Health (stability & mobility) ───
  {id:'clamshell',name:'Clamshell',muscle:'hips',type:'stability',eq:['bodyweight'],rMin:15,rMax:20,rest:60,noWeight:true,cue:'Side-lying, knees bent ~45°. Rotate top knee up like a clamshell lid. Keep hips stacked — they WILL want to roll back. Squeeze hard at top, slow negative. This is pure glute med. Count per side.\n\nProgression without bands: (1) Build to 20 strict reps per side → (2) Add a 2s pause at the top of each rep → (3) Slow the negative to 3 counts → (4) Move to straight-leg side-lying abduction (harder leverage) → (5) Ankle weights when available. No band needed to keep progressing for a long time.',tags:['glute_med']},
  {id:'fire_hydrant',name:'Fire Hydrant',muscle:'hips',type:'stability',eq:['bodyweight'],rMin:12,rMax:15,rest:60,noWeight:true,cue:'Hands and knees (quadruped). Lift one knee out to the side — drive from the hip, not by rotating your torso. Keep hips level and core braced. Slow and controlled. Count per side.\n\nProgression without bands: (1) Build reps → (2) Add a 2s pause at peak → (3) Slow negative to 3 counts → (4) Add small circles at the top → (5) Progress to a higher, fuller ROM → (6) Ankle weights when you have them.',tags:['glute_med']},
  {id:'side_lying_abduct',name:'Side-lying Hip Abduction',muscle:'hips',type:'stability',eq:['bodyweight'],rMin:15,rMax:20,rest:60,noWeight:true,cue:'Straight leg lift to ~45°. Foot slightly flexed, toes angled slightly downward (internal rotation targets glute med better). Slow negative — do not drop. Keep lower back out of it. Count per side.\n\nProgression without bands: (1) Build reps with 2s pause at top → (2) Slow negative to 3 counts → (3) Add small leg circles at peak height → (4) Elevate slightly (lying on bed edge, leg off the side) for more ROM → (5) Ankle weights are the final step.',tags:['glute_med']},
  {id:'copenhagen_plank',name:'Copenhagen Plank',muscle:'hips',type:'stability',eq:['bodyweight'],rMin:20,rMax:40,rest:60,noWeight:true,isTimed:true,cue:'Side plank with top foot on a bench, bottom leg hanging. Hold for time — count seconds. Targets adductors and lateral hip, muscles often neglected with impingement.\n\nProgression: (1) Start with knee (not foot) on the bench for an easier version → (2) Foot on bench, bottom leg on floor → (3) Foot on bench, bottom leg raised off floor (hardest bodyweight version) → (4) Add a small hip dip at the bottom of each rep → (5) Elevate the bench higher.',tags:['adductor','lateral']},
  {id:'hip_90_90',name:'90/90 Hip Stretch',muscle:'hips',type:'mobility',eq:['bodyweight'],rMin:30,rMax:60,rest:30,noWeight:true,isTimed:true,cue:'Sit with both knees at 90°. Front leg externally rotated, back leg internally rotated. Tall spine. Lean forward over your front shin — feel the hip open. Breathe into the stretch, do not force it. This targets hip internal rotation, which is often restricted with impingement. Count seconds per side.',tags:['mobility','internal_rotation']},
  {id:'hip_flexor_half_kneel',name:'Half-Kneeling Hip Flexor Stretch',muscle:'hips',type:'mobility',eq:['bodyweight'],rMin:30,rMax:60,rest:30,noWeight:true,isTimed:true,cue:'Down knee on pad, front foot forward. FIRST: posteriorly tilt your pelvis (tuck tailbone). THEN drive hips forward. That pelvic tilt is the key — without it you compress the hip instead of stretching the flexor. Hold, breathe. Count seconds per side.',tags:['mobility','hip_flexor']},
  {id:'hip_cars',name:'Hip CARs',muscle:'hips',type:'mobility',eq:['bodyweight'],rMin:5,rMax:8,rest:30,cue:'Stand near wall for balance. Lift one knee high, then rotate it OUT and sweep the full circle (Controlled Articular Rotation). Goal is to find and explore your full active range. Go slow — speed defeats the purpose. Squeeze glute at the back. Count full circles per side.',tags:['mobility','rotation']},

  // Athletic/Performance focused exercises
  {id:'burpees',name:'Burpees',muscle:'core',type:'compound',eq:['bodyweight'],rMin:8,rMax:15,rest:120,cue:'Drop to push-up, jump feet back in, explosive jump up with hands overhead. Full-body power endurance. Focus on smooth transitions and explosive jump.',tags:['plyometric','conditioning'],highSweat:true},
  {id:'mountain_climbers',name:'Mountain Climbers',muscle:'core',type:'compound',eq:['bodyweight'],rMin:20,rMax:40,rest:90,cue:'High plank position, drive knees to chest alternating rapidly. Keep hips level, core tight. Think sprinting in plank position. Count total reps (both legs).',tags:['conditioning','anti-extension'],highSweat:true},
  {id:'jump_squats',name:'Jump Squats',muscle:'legs',type:'compound',eq:['bodyweight'],rMin:8,rMax:12,rest:120,cue:'Squat down, then explode up into a jump. Land softly, immediately into next rep. Focus on rate of force development. Each rep should be max effort.',tags:['plyometric','quad','power'],highSweat:true},
  {id:'lateral_bounds',name:'Lateral Bounds',muscle:'legs',type:'compound',eq:['bodyweight'],rMin:6,rMax:10,rest:120,cue:'Single-leg lateral jump, stick the landing on one foot, then bound back to other side. Focus on distance and landing control. Athletic power in frontal plane. Count per side.',tags:['plyometric','unilateral','lateral'],highSweat:true},
  {id:'single_leg_bounds',name:'Single-Leg Forward Bounds',muscle:'legs',type:'compound',eq:['bodyweight'],rMin:6,rMax:8,rest:150,cue:'Single-leg hop forward for distance, stick the landing, repeat on same leg. Focus on distance and landing mechanics. Builds unilateral power and stability. Count per leg.',tags:['plyometric','unilateral','power'],highSweat:true},
  {id:'bear_crawl',name:'Bear Crawl',muscle:'core',type:'compound',eq:['bodyweight'],rMin:20,rMax:40,rest:90,cue:'Hands and toes, knees hovering. Crawl forward moving opposite hand/foot together. Keep hips level, core tight. Great for shoulder stability and core strength. Count steps.',tags:['crawling','stability'],highSweat:true},
  {id:'turkish_getup_bw',name:'Turkish Get-up (Bodyweight)',muscle:'core',type:'compound',eq:['bodyweight'],rMin:3,rMax:6,rest:150,cue:'Complex movement from lying to standing. Focus on smooth transitions and stability at each position. Master the movement before adding weight. Ultimate full-body coordination exercise. Count per side.',tags:['complex','stability','coordination'],highSweat:true},
  {id:'archer_pushup',name:'Archer Push-ups',muscle:'chest',type:'compound',eq:['bodyweight'],rMin:4,rMax:8,rest:180,cue:'Wide hand position, shift weight to one arm during the push-up. Builds unilateral strength toward one-arm push-up. Control the eccentric phase. Count per side.',tags:['unilateral','advanced']},
  {id:'pistol_squat',name:'Pistol Squat',muscle:'legs',type:'compound',eq:['bodyweight'],rMin:3,rMax:6,rest:180,cue:'Single-leg squat to full depth, free leg extended forward. Builds unilateral strength, mobility, and balance. Use assistance if needed. Ultimate bodyweight squat progression. Count per leg.',tags:['unilateral','advanced','squat']},
  {id:'handstand_pushup',name:'Handstand Push-up',muscle:'shoulders',type:'compound',eq:['bodyweight'],rMin:3,rMax:8,rest:180,cue:'Inverted push-up against wall. Lower head to floor, press back up. Builds shoulder and core strength. Progress from pike push-ups. Advanced bodyweight movement. Count reps.',tags:['inverted','advanced']},
  {id:'l_sits',name:'L-Sit',muscle:'core',type:'isolation',eq:['bodyweight'],rMin:10,rMax:30,rest:120,isTimed:true,cue:'Sit with legs extended, hands flat, lift entire body off ground. Hold position with straight legs parallel to floor. Incredible core and shoulder strength builder. Count seconds.',tags:['isometric','advanced']},
  {id:'broad_jump',name:'Broad Jump',muscle:'legs',type:'compound',eq:['bodyweight'],rMin:5,rMax:8,rest:150,cue:'Two-foot takeoff, jump forward for maximum distance, land softly on both feet. Focus on explosive hip extension and soft landing mechanics. Reset between reps. Count jumps.',tags:['plyometric','power','bilateral']},

  // Circuit Training Exercises
  {id:'burpee_to_jump',name:'Burpee to Jump Squat',muscle:'legs',type:'compound',eq:['bodyweight'],rMin:8,rMax:12,rest:60,cue:'Burpee down, jump feet in, explosive jump squat up with arms overhead. Land softly, immediately into next rep. High-intensity circuit finisher.',tags:['circuit','plyometric','conditioning'],highSweat:true,circuit:true},
  {id:'kb_swings_circuit',name:'KB/DB Swings',muscle:'legs',type:'compound',eq:['dumbbells'],rMin:15,rMax:20,rest:60,cue:'Hip hinge power movement. Drive hips forward explosively, weight rises to chest height. High-rep circuit style with continuous movement.',tags:['circuit','power','conditioning'],highSweat:true,circuit:true},
  {id:'thrusters',name:'DB Thrusters',muscle:'shoulders',type:'compound',eq:['dumbbells'],rMin:10,rMax:15,rest:60,cue:'Front squat into overhead press in one fluid motion. Shoulders, legs, and cardio all in one. Keep moving between reps.',tags:['circuit','conditioning','full-body'],highSweat:true,circuit:true},
  {id:'man_makers',name:'Man Makers',muscle:'chest',type:'compound',eq:['dumbbells'],rMin:6,rMax:10,rest:60,cue:'Push-up with DBs, row each arm, jump feet in, thruster up. Full-body circuit exercise. Rest briefly between reps but keep moving.',tags:['circuit','conditioning','full-body'],highSweat:true,circuit:true},
  {id:'battle_ropes',name:'Battle Ropes (Alternating)',muscle:'core',type:'compound',eq:['bodyweight'],rMin:30,rMax:60,rest:60,isTimed:true,cue:'Alternating arm waves. Keep core tight, generate power from shoulders. High-intensity interval exercise. Count seconds.',tags:['circuit','conditioning','cardio'],highSweat:true,circuit:true},
];

function pickEx(slot,equip,used,isLunch,budget){
  const eq=new Set([...equip,'bodyweight']);
  const overworkedMuscles = getOverworkedMuscles();
  const isCircuitStyle = S.weekPlan?.cardioStyle === 'circuits';

  // Combine built-in exercises with custom exercises
  const allExercises = [...EX, ...(S.customExercises||[])];

  // MRV headroom: would adding this exercise push the muscle past its weekly max?
  const perEx = (budget && budget.perExercise) || 3;
  const fitsMRV = (e) => {
    if(!budget || !budget.limits || !budget.limits[e.muscle]) return true;
    return (budget.vol[e.muscle] || 0) + perEx <= budget.limits[e.muscle].max;
  };

  // Shared slot constraints (muscle/type/tag/equipment/hip-caution/lunch sweat).
  const base = (e) =>
    e.muscle===slot.muscle && e.type===slot.type &&
    (!slot.tag || ((e.tags||[]).includes(slot.tag))) &&
    !used.includes(e.id) &&
    e.eq.some(q=>eq.has(q)) &&
    !(S.cfg.hipCaution && e.hipRisk) &&
    !(isLunch && e.highSweat);

  // For circuit training, prefer circuit-tagged exercises (still within MRV)
  if(isCircuitStyle && !isLunch) {
    const circuitEx = allExercises.find(e => base(e) && !overworkedMuscles.has(e.muscle) && fitsMRV(e) && e.circuit);
    if(circuitEx) return circuitEx;
  }

  // 1) Best: avoid overworked muscles AND stay within MRV max
  let exercise = allExercises.find(e => base(e) && !overworkedMuscles.has(e.muscle) && fitsMRV(e));
  // 2) Next: stay within MRV max (allow a recently-worked muscle if needed)
  if(!exercise) exercise = allExercises.find(e => base(e) && fitsMRV(e));
  // If the muscle has hit its weekly MRV max, intentionally return null so this
  // slot is dropped (fewer sets) rather than exceeding the recoverable volume.
  return exercise||null;
}

function genProgram(cfg,av){
  av=av||(S.weekPlan?.availability)||defaultAvailability();

  // Collect lunch slots and available evening slots separately
  const lunchSlots=[];const eveSlots=[];
  [1,2,3,4,5].forEach(dow=>{
    const d=av[dow]||{};
    if(d.lunch!==false)lunchSlots.push({dow,isLunch:true,mins:40,loc:'ymca',key:`${dow}-lunch`,equipmentKey:d.lunchEquipment||'ymca'});
    if(d.eve?.on)eveSlots.push({dow,isLunch:false,mins:d.eve.mins||60,loc:d.eve.loc||'ymca',key:`${dow}-eve`,equipmentKey:d.eve.equipment||'ymca'});
  });
  [6,0].forEach(dow=>{
    const d=av[dow]||{};
    if(d.on)eveSlots.push({dow,isLunch:false,mins:d.mins||60,loc:d.loc||'ymca',key:`${dow}-wknd`,equipmentKey:d.equipment||'ymca'});
  });
  if(!lunchSlots.length&&!eveSlots.length){
    const ps=S.cfg?.planStartDow??1;
    [1,2,3,4,5].filter(d=>ps!==0&&d>=ps).forEach(dow=>lunchSlots.push({dow,isLunch:true,mins:40,loc:'ymca',key:`${dow}-lunch`,equipmentKey:'ymca'}));
  }

  // Split size: lunches fill first, evenings on non-lunch days fill remaining gaps (max 5)
  const lunchDows=new Set(lunchSlots.map(s=>s.dow));
  const eveNonLunch=eveSlots.filter(s=>!lunchDows.has(s.dow));
  const count=Math.max(2,Math.min(lunchSlots.length+eveNonLunch.length,5));
  const split=SPLITS[count]||SPLITS[5];

  // Completed sessions this calendar week — preserve their templates
  const mon=thisMonday();
  const weekEnd=addDays(mon,7);
  const completedDows=new Set(
    (S.logs||[]).filter(l=>l.date.slice(0,10)>=mon&&l.date.slice(0,10)<weekEnd)
      .map(l=>new Date(l.date+'T12:00:00').getDay())
  );
  const oldWeek=S.program?.week;

  // MRV budget: start from sets already committed this week (logged + planned
  // custom workouts) and consume headroom as we assign sessions, so the week
  // fills toward optimal without exceeding each muscle's recoverable max.
  const budget = { vol: getCommittedVolumes(), limits: getMRVLimits(), perExercise: 3 };

  function buildSession(slot,tk,oldData){
    // Use per-session equipment from availability
    const equipmentKey=slot.equipmentKey||'ymca';
    const selectedPreset=EQUIPMENT_PRESETS[equipmentKey]||EQUIPMENT_PRESETS.ymca;
    const equip=selectedPreset.equipment;
    if(oldData===undefined)oldData=oldWeek?.[slot.dow];
    // Preserve existing exercises if: (a) already completed this week, OR (b) same template + same location
    if(oldData&&!oldData.rest&&(completedDows.has(slot.dow)||(oldData.tk===tk&&oldData.loc===slot.loc))){
      const od=oldData;
      // Count a preserved upcoming session toward the budget (completed days and
      // custom/planned days are already counted via getCommittedVolumes).
      if(!completedDows.has(slot.dow) && !od.customWorkout && !od.plannedCustomWorkout){
        (od.exercises||[]).forEach(e=>{ if(e&&e.muscle) budget.vol[e.muscle]=(budget.vol[e.muscle]||0)+(e.sets||3); });
      }
      return{tk:od.tk,name:od.name,desc:od.desc,isLunch:slot.isLunch,exercises:od.exercises,mins:slot.mins,loc:slot.loc,preserved:true};
    }
    const tmpl=slot.isLunch?(LUNCH_TMPLS[tk]||TMPLS[tk]):TMPLS[tk];
    const limit=slot.isLunch?3:(EX_LIMIT[slot.mins]||5);
    const used=[];
    const isCircuitStyle = S.weekPlan?.cardioStyle === 'circuits';
    const exs=tmpl.slots.slice(0,limit).map(sl=>{
      const e=pickEx(sl,equip,used,slot.isLunch,budget);
      if(!e) return null;
      used.push(e.id);

      // Modify exercise for circuit training
      let modifiedEx = {...e, sets:3, sessionMins:slot.mins};
      if(isCircuitStyle && !slot.isLunch) { // Apply circuit modifications to evening sessions only
        modifiedEx.rest = Math.max(60, e.rest ? e.rest / 2 : 60); // Shorter rest periods
        modifiedEx.sets = e.circuit ? 4 : 3; // Extra set for circuit exercises
        if(e.circuit) modifiedEx.circuitStyle = true;
      }

      // Consume MRV headroom for this muscle
      budget.vol[e.muscle] = (budget.vol[e.muscle] || 0) + modifiedEx.sets;

      return modifiedEx;
    }).filter(Boolean);

    let fc=false;exs.forEach(e=>{if(e.type==='compound'&&!fc){e.isFirst=true;fc=true;}});

    // Adjust session name for circuit training
    const sessionName = isCircuitStyle && !slot.isLunch ? tmpl.name.replace('Day', 'Circuit') : tmpl.name;
    return{tk,name:sessionName,desc:tmpl.desc,isLunch:slot.isLunch,exercises:exs,mins:slot.mins,loc:slot.loc};
  }
  function assignSlot(slot,idx){
    return buildSession(slot,split[idx%split.length]);
  }

  const slotMap={};let splitIdx=0;
  // Pass 1: lunches always get lifting
  lunchSlots.forEach(slot=>{slotMap[slot.key]=assignSlot(slot,splitIdx);splitIdx++;});
  // Pass 2: evenings — only lift if split not complete AND no lunch that same day
  eveSlots.forEach(slot=>{
    if(lunchDows.has(slot.dow))return; // lifted at lunch today → evening = cardio
    if(splitIdx>=count)return;         // split fully covered → cardio
    slotMap[slot.key]=assignSlot(slot,splitIdx);splitIdx++;
  });

  // Pass 3: double-lifting days — if a day has both lunch + evening lifting
  // available and the split is otherwise complete, give the evening slot a
  // full bonus session using a DIFFERENT template than lunch. Research favors
  // hitting an under-volumed muscle group on a separate day/session over
  // stacking extra same-muscle sets onto one workout, so pick whichever
  // template targets the muscle furthest below its weekly volume target.
  const BONUS_TMPLS=['legs','lower_a','lower_b','push','pull','upper_push','upper_pull'];
  const VOL_TARGET_BUFFER=4; // a muscle "needs more volume" if it's this far below its weekly MRV max
  eveSlots.forEach(slot=>{
    if(!lunchDows.has(slot.dow))return;   // only relevant for lunch+evening days
    if(slotMap[slot.key])return;          // already assigned
    const lunchSession=slotMap[`${slot.dow}-lunch`];
    if(!lunchSession?.exercises?.length)return;

    // Which muscles get compound work on each planned day, so the bonus
    // session can avoid hitting a muscle on back-to-back days.
    const muscleDows={};
    Object.entries(slotMap).forEach(([key,sess])=>{
      const sdow=parseInt(key);
      (sess.exercises||[]).forEach(e=>{
        if(e.type==='compound')(muscleDows[e.muscle]=muscleDows[e.muscle]||new Set()).add(sdow);
      });
    });

    let best=null,bestScore=0;
    BONUS_TMPLS.forEach(tk=>{
      if(tk===lunchSession.tk)return; // must be a different split than lunch
      const muscles=new Set(TMPLS[tk].slots.filter(s=>s.type==='compound').map(s=>s.muscle));
      // Rank by the single most under-volumed muscle the template trains (the
      // muscle that most needs a second weekly session), using total deficit
      // only as a tie-breaker — otherwise multi-muscle upper days always beat
      // a legs day on summed deficit.
      let maxDef=0,sumDef=0,maxDefMuscle=null;
      muscles.forEach(m=>{
        const max=budget.limits[m]?.max??20;
        const def=Math.max(0,max-VOL_TARGET_BUFFER-(budget.vol[m]||0));
        if(def>maxDef){maxDef=def;maxDefMuscle=m;}
        sumDef+=def;
      });
      let score=maxDef*100+sumDef;
      // Soft penalty if the target muscle is already trained on an adjacent
      // day — same-muscle sessions <24h apart compromise recovery.
      const dows=maxDefMuscle?muscleDows[maxDefMuscle]:null;
      if(dows&&(dows.has(slot.dow-1)||dows.has(slot.dow+1)))score*=0.25;
      if(maxDef>0&&score>bestScore){bestScore=score;best=tk;}
    });
    if(!best)return; // nothing meaningfully under-volumed → evening stays cardio

    slotMap[slot.key]=buildSession(slot,best,oldWeek?.[slot.dow]?.eveningSession);
  });

  // Build week array
  const week=Array.from({length:7},(_,dow)=>{
    const lunch=slotMap[`${dow}-lunch`];
    const eve=slotMap[`${dow}-eve`]||slotMap[`${dow}-wknd`];
    if(!lunch&&!eve)return{dow,rest:true};
    const primary=lunch||eve;
    return{dow,rest:false,name:primary.name,desc:primary.desc,tk:primary.tk,
      isLunch:!!lunch,exercises:primary.exercises,sessionMins:primary.mins,loc:primary.loc||'ymca',
      eveningSession:lunch&&eve?{name:eve.name,desc:eve.desc,tk:eve.tk,isLunch:false,exercises:eve.exercises,mins:eve.mins,loc:eve.loc||'ymca'}:null};
  });
  return{at:Date.now(),week};
}

function r5(n){return Math.round(n/5)*5;}
function todayDow(){return new Date().getDay();}

function todayStr(){return new Date().toISOString().slice(0,10);}
function addDays(iso,n){const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);}
function daysBetween(a,b){return Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/86400000);}

function thisMonday(){
  const d=new Date();const dow=d.getDay();
  const m=new Date(d);m.setDate(d.getDate()-(dow===0?6:dow-1));
  return m.toISOString().slice(0,10);
}
function planMonday(){return todayDow()===0?addDays(todayStr(),1):thisMonday();}
function nextSunday(){const dow=todayDow();return addDays(todayStr(),dow===0?7:7-dow);}

// ─── Recent Workouts Analysis ───
function parseRecentWorkouts(text){
  if(!text || !text.trim()) return new Set();

  const recentMuscles = new Set();
  const normalizedText = text.toLowerCase();

  // Muscle group keyword mapping
  const muscleKeywords = {
    chest: ['chest', 'pecs', 'bench', 'pushup', 'push-up', 'flies', 'flyes'],
    back: ['back', 'lats', 'pullup', 'pull-up', 'row', 'pulldown', 'deadlift'],
    shoulders: ['shoulder', 'delts', 'deltoid', 'press', 'raises', 'lateral'],
    legs: ['legs', 'quad', 'hamstring', 'squat', 'lunge', 'thigh', 'glutes', 'glute'],
    biceps: ['biceps', 'bicep', 'curls', 'curl'],
    triceps: ['triceps', 'tricep', 'pushdown', 'extension', 'dips'],
    core: ['core', 'abs', 'abdominal', 'plank', 'crunch']
  };

  // Check for muscle group mentions
  Object.entries(muscleKeywords).forEach(([muscle, keywords]) => {
    if(keywords.some(keyword => normalizedText.includes(keyword))){
      recentMuscles.add(muscle);
    }
  });

  return recentMuscles;
}

function getOverworkedMuscles(){
  const recentWorkouts = S.weekPlan?.recentWorkouts || '';
  const recentOverworked = parseRecentWorkouts(recentWorkouts);

  // Also check for upcoming custom workouts this week
  const upcomingOverworked = getUpcomingCustomWorkoutMuscles();

  // Combine both sets
  return new Set([...recentOverworked, ...upcomingOverworked]);
}

function getUpcomingCustomWorkoutMuscles(){
  const upcomingMuscles = new Set();

  if(!S.program || !S.program.week) return upcomingMuscles;

  const today = todayDow();

  // Check for custom workouts throughout the entire week for better planning
  S.program.week.forEach((day, dow) => {
    if(day && (day.customWorkout || day.plannedCustomWorkout)) {
      const customLog = day.customLog || day.plannedCustomLog;
      if(customLog) {
        // Consider all custom workouts in the week, with different weights based on timing
        const dayDiff = dow === 0 ? (7 - today) : (dow - today);

        // For planning purposes, consider the entire week but with different impact
        if(dayDiff >= -1 && dayDiff <= 6) { // Yesterday to end of week
          customLog.exercises.forEach(ex => {
            upcomingMuscles.add(ex.muscle);
          });
        }
      }
    }
  });

  return upcomingMuscles;
}

// ─── MRV (Maximum Recoverable Volume) Tracking ───
function getWeeklySetVolumes(){
  // Calculate set volumes by muscle group for the current week
  const mondayStr = thisMonday();
  const nextMondayStr = addDays(mondayStr, 7);

  const weekLogs = S.logs.filter(l =>
    l.date.slice(0,10) >= mondayStr && l.date.slice(0,10) < nextMondayStr
  );

  const volumes = {};

  weekLogs.forEach(log => {
    log.exercises?.forEach(ex => {
      const muscle = ex.muscle;
      const completedSets = ex.sets?.filter(s => s && s.reps > 0).length || 0;
      volumes[muscle] = (volumes[muscle] || 0) + completedSets;
    });
  });

  return volumes;
}

// Weekly MRV (Maximum Recoverable Volume) ranges per muscle, in working sets.
// Evidence check 2026-06-11: consistent with Pelland et al. 2025 dose-response
// meta-regression (67 studies, n=2058) — hypertrophy rises with volume with
// diminishing returns and ≥10 weekly sets/muscle outperforms <10; strength
// plateaus far earlier. No numeric change warranted; ranges retained.
function getMRVLimits(){
  const limits = {
    chest: {min: 10, max: 20},
    back: {min: 12, max: 22},
    shoulders: {min: 8, max: 18},
    biceps: {min: 6, max: 16},
    triceps: {min: 6, max: 16},
    legs: {min: 14, max: 24},
    core: {min: 8, max: 18},
    hips: {min: 6, max: 16}
  };
  // Recovery auto-regulation: muscles trained in a high-fatigue session
  // (rating ≥4) within the last 72h get a temporarily reduced ceiling, so
  // the generator backs off volume until they've recovered. 72h window is
  // consistent with time-course studies showing mechanical function depressed
  // 24-72h after training to failure / high-fatigue sessions (e.g., 2025
  // Frontiers Physiology DOMS-intervention RCT; velocity-loss time-course work).
  getFatiguedMuscles().forEach(m=>{
    if(limits[m])limits[m]={min:limits[m].min,max:Math.max(limits[m].min,Math.round(limits[m].max*0.85))};
  });
  return limits;
}

// Muscles trained in a session the user rated 4-5 ("Hard"/"Maxed out")
// within the last 72 hours.
function getFatiguedMuscles(){
  const cutoff=Date.now()-72*3600*1000;
  const fatigued=new Set();
  (S.logs||[]).forEach(l=>{
    if((l.fatigue||0)>=4&&new Date(l.date).getTime()>=cutoff){
      (l.exercises||[]).forEach(e=>{if(e.muscle)fatigued.add(e.muscle);});
    }
  });
  return fatigued;
}

// Sets already committed this week by muscle: completed/logged workouts PLUS any
// not-yet-done planned custom workouts on the program. Used to budget remaining
// sessions so the generator fills toward optimal without blowing past MRV max.
function getCommittedVolumes(){
  const vol = getWeeklySetVolumes(); // logged (completed + custom-logged)
  if(S.program?.week){
    S.program.week.forEach(day => {
      // Skip planned days that have since been logged (counted via the logs above)
      if(day && day.plannedCustomWorkout && day.plannedCustomLog && !day.customWorkout){
        day.plannedCustomLog.exercises.forEach(ex => {
          const sets = Array.isArray(ex.sets)
            ? ex.sets.filter(s => s && s.reps > 0).length
            : (parseInt(ex.sets) || 0);
          if(ex.muscle) vol[ex.muscle] = (vol[ex.muscle] || 0) + sets;
        });
      }
    });
  }
  return vol;
}

function getMRVStatus(){
  // Include logged workouts (regular + custom) AND planned custom workouts so the
  // dashboard reflects every committed set, matching how the generator budgets.
  const volumes = getCommittedVolumes();
  const limits = getMRVLimits();

  const status = {};
  Object.keys(limits).forEach(muscle => {
    const current = volumes[muscle] || 0;
    const {min, max} = limits[muscle];
    let level = 'low';
    if (current >= min && current <= max) level = 'optimal';
    else if (current > max) level = 'high';

    status[muscle] = {current, min, max, level};
  });

  return status;
}

function renderMRVWidget(){
  const mrvStatus = getMRVStatus();
  const overworkedMuscles = getOverworkedMuscles();
  const hasData = Object.values(mrvStatus).some(m => m.current > 0) || overworkedMuscles.size > 0;

  if (!hasData) return '';

  const rows = Object.entries(mrvStatus)
    .filter(([muscle, status]) => status.current > 0 || overworkedMuscles.has(muscle))
    .map(([muscle, status]) => {
      const {current, min, max, level} = status;
      const isOverworked = overworkedMuscles.has(muscle);
      const color = isOverworked ? 'var(--warn)' : level === 'high' ? 'var(--bad)' : level === 'optimal' ? 'var(--ok)' : 'var(--warn)';
      const pct = Math.min(100, (current / max) * 100);

      return `<div style='display:flex;align-items:center;gap:8px;margin-bottom:4px'>
        <div style='font-size:12px;font-weight:600;width:60px;text-transform:capitalize;display:flex;align-items:center;gap:4px'>
          ${MNAME[muscle]}
          ${isOverworked ? '<span style="font-size:10px;color:var(--warn)">⚠️</span>' : ''}
        </div>
        <div style='flex:1;background:var(--surf2);border-radius:4px;height:12px;position:relative'>
          <div style='background:${color};height:100%;width:${pct}%;border-radius:4px'></div>
        </div>
        <div style='font-size:11px;color:${color};min-width:40px;text-align:right'>
          ${isOverworked && current === 0 ? 'Recent' : `${current}/${max}`}
        </div>
      </div>`;
    }).join('');

  const fatigued=[...getFatiguedMuscles()].filter(m=>MNAME[m]);
  const fatigueNote=fatigued.length?`<div style='font-size:11px;color:var(--warn);margin-top:8px'>🔋 Recovering: ${fatigued.map(m=>MNAME[m]).join(', ')} — volume ceiling reduced 15% for 72h after your hard session</div>`:'';
  return `<div class='card'>
    <div style='font-size:14px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:6px'>
      📊 Weekly Set Volume (MRV)
      <span style='font-size:10px;color:var(--mut);font-weight:400'>10-20+ sets optimal · ⚠️ = recent external</span>
    </div>
    ${rows}
    ${fatigueNote}
  </div>`;
}
function getMissedDays(){
  const plan=getWeekPlan();
  if(!plan||!S.program)return[];
  const today=todayDow();
  const planStart=plan.weekOf;
  const weekEnd=addDays(planStart,14); // allow up to 2 weeks
  const weekLogs=S.logs.filter(l=>l.date.slice(0,10)>=planStart&&l.date.slice(0,10)<weekEnd);
  const completedDates=new Set(weekLogs.map(l=>l.date.slice(0,10)));
  // Find non-rest days in the past (from planStart onward) with no log
  return S.program.week.filter(d=>{
    if(d.rest||d.dow===0||d.dow>=today)return false;
    const dayDate=addDays(planStart,daysBetween(planStart,todayStr())-(today-d.dow));
    // simpler: check if this DOW's date this week has a log
    const thisMon=thisMonday();
    const dayDateThisWeek=addDays(thisMon,d.dow-1);
    if(dayDateThisWeek<planStart)return false; // before plan started
    return!completedDates.has(dayDateThisWeek);
  }).map(d=>d.dow);
}

function getEveningMins(){
  if(S.eveningMins&&S.eveningMins.date===todayStr())return S.eveningMins.mins;
  return S.cfg.mins;
}

function getEveningLocation(){
  if(S.eveningLocation&&S.eveningLocation.date===todayStr())return S.eveningLocation.loc;
  return 'home'; // default conservative — less equipment
}

function pickEveningExercises(day,sessionMins){
  const limit=EX_LIMIT[sessionMins]||5;
  // Use session's equipment - for evening sessions, get it from availability
  const today=todayDow();
  const av=S.weekPlan?.availability||{};
  const todayAv=av[today]||{};
  const eveEquipment=todayAv.eve?.equipment||'ymca';
  const selectedPreset=EQUIPMENT_PRESETS[eveEquipment]||EQUIPMENT_PRESETS.ymca;
  const equip=selectedPreset.equipment;
  const tmpl=TMPLS[day.tk];
  if(!tmpl)return day.exercises.slice(0,limit);
  const used=[];
  const budget={ vol:getCommittedVolumes(), limits:getMRVLimits(), perExercise:3 };
  const exs=tmpl.slots.slice(0,limit).map(sl=>{
    const e=pickEx(sl,equip,used,false,budget); // Evening sessions allow high-sweat exercises
    if(!e) return null;
    used.push(e.id);
    budget.vol[e.muscle]=(budget.vol[e.muscle]||0)+3;
    return {...e,sets:3,sessionMins};
  }).filter(Boolean);
  let fc=false;exs.forEach(e=>{if(e.type==='compound'&&!fc){e.isFirst=true;fc=true;}});
  return exs;
}

function lastLog(exId){
  for(let i=S.logs.length-1;i>=0;i--){
    const e=S.logs[i].exercises?.find(x=>x.id===exId);
    if(e?.sets?.length)return e;
  }return null;
}
function progression(exId,rMax){
  let w=null,minR=null,maxR=null;
  const l=lastLog(exId);
  if(l){
    const done=l.sets.filter(s=>s.reps>0);
    if(done.length){
      w=done[0].weight;
      minR=Math.min(...done.map(s=>s.reps));
      maxR=Math.max(...done.map(s=>s.reps));
    }
  }
  // Fall back to manually entered lastWeights when no log exists
  if(w==null&&S.lastWeights?.[exId]){
    w=S.lastWeights[exId].weight;
    minR=maxR=S.lastWeights[exId].reps;
  }
  if(w==null)return null;
  const ready=minR>=rMax;
  return{weight:w,minR,maxR,suggest:ready?r5(w*1.04):w,ready,summary:`${w} lb × ${minR===maxR?minR:minR+'–'+maxR}`};
}
function recalcLastWeights(){
  const w={};
  [...S.logs].sort((a,b)=>a.id>b.id?1:-1).forEach(log=>{
    log.exercises?.forEach(ex=>{
      const sets=ex.sets?.filter(s=>s?.reps>0);
      if(sets?.length){const l=sets[sets.length-1];w[ex.id]={weight:l.weight,reps:l.reps};}
    });
  });
  S.lastWeights=w;
}
function fmtDate(iso){
  const d=new Date(iso);
  return d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
}
function fmtDur(mins){return mins<60?`${mins}m`:`${Math.floor(mins/60)}h ${mins%60}m`;}

// ─────────────────────────────────────────────
// CALORIE / CARDIO MATH
// ─────────────────────────────────────────────
function estimateStrengthCals(mins,bodyLbs){
  return Math.round(bodyLbs*0.033*mins);
}

function cardioOptions(cals,bodyLbs){
  if(cals<=0)return[];
  const m=(cpm)=>Math.round(cals/cpm);
  const mi=(mph,min)=>((mph*min)/60).toFixed(1);
  // 3 mph walk: MET ~3.5, cals = MET * bodyKg * hrs
  const walkCpm=bodyLbs*0.0245; // 3 mph
  // Stair stepper: MET ~9, resistance level 8-12 typical YMCA
  const stairCpm=bodyLbs*0.063;
  // Elliptical: MET ~5.5, resistance 10-14 typical
  const ellCpm=bodyLbs*0.038;
  // Run 9-10 min/mile = ~6-6.7 mph, use 6.3 mph midpoint: MET ~10
  const runCpm=bodyLbs*0.070;
  const wm=m(walkCpm),sm=m(stairCpm),em=m(ellCpm),rm=m(runCpm);
  // Stair stepper resistance: rough scale based on calorie target/body weight
  const stairRes=Math.min(20,Math.max(8,Math.round(8+(bodyLbs-150)/25)));
  // Elliptical resistance: similar scale
  const ellRes=Math.min(20,Math.max(10,Math.round(10+(bodyLbs-150)/20)));
  return[
    {name:'Walk Outside',icon:'🚶',min:wm,dist:`${mi(3,wm)} mi`,note:'3 mph · flat ground',busy:false},
    {name:'Stair Stepper',icon:'🪜',min:sm,dist:'—',note:`Resistance level ${stairRes}`,busy:true},
    {name:'Elliptical',icon:'⚡',min:em,dist:'—',note:`Resistance level ${ellRes} · moderate stride`,busy:false},
    {name:'Treadmill Walk',icon:'🏃',min:wm,dist:`${mi(3,wm)} mi`,note:'3 mph · 0% incline',busy:false},
    {name:'Run Outside',icon:'🏃‍♂️',min:rm,dist:`${mi(6.3,rm)} mi`,note:'9–10 min/mile pace',busy:false},
  ];
}

function calcWeekCardio(){
  const entry=getCalEntry();
  if(!entry||!S.program)return null;
  const plan=getWeekPlan();
  if(!plan)return null;
  const bodyLbs=S.cfg.bodyLbs||175;
  const today=todayStr();
  const rangeStart=today>entry.startDate?today:entry.startDate;
  const daysLeft=Math.max(1,daysBetween(rangeStart,entry.endDate)+1);
  const mondayDate=plan.weekOf;
  const strengthCals=S.program.week.filter(d=>{
    if(d.rest)return false;
    const dayDate=d.dow===0?addDays(mondayDate,6):addDays(mondayDate,d.dow-1);
    return dayDate>=rangeStart&&dayDate<=entry.endDate;
  }).reduce((sum,d)=>{
    const primary=estimateStrengthCals(d.sessionMins||45,bodyLbs);
    const eve=d.eveningSession?estimateStrengthCals(d.eveningSession.mins||60,bodyLbs):0;
    return sum+primary+eve;
  },0);
  const cardioCalsNeeded=Math.max(0,entry.cals-strengthCals);
  const calsPerDay=Math.round(cardioCalsNeeded/daysLeft);
  return{strengthCals,cardioCalsNeeded,calsPerDay,daysLeft,options:cardioOptions(calsPerDay,bodyLbs)};
}

// ─────────────────────────────────────────────
// REST TIMER
// ─────────────────────────────────────────────
// Intensity-based rest: heavy compounds need ≥2-3 min for full performance on
// the next set (Schoenfeld 2016 — longer inter-set rest beats 1 min for both
// strength and hypertrophy on compounds). Isolation floor raised 60→90s per
// Singer et al. 2024 Bayesian meta-analysis ("Give it a Rest", Frontiers
// Sports Act Living): ≤60s is the only clearly suboptimal zone for
// hypertrophy; no further benefit beyond ~90s, so 90s is the isolation minimum.
function smartRest(ex){
  if(ex.isTimed||ex.noWeight)return ex.rest||60;
  if(ex.type==='compound')return ex.rMax<=8?180:(ex.rMax<=12?150:120);
  return 90;
}
function smartRestLabel(ex){
  const s=smartRest(ex);
  const t=s>=60?(s%60===0?`${s/60} min`:`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`):`${s}s`;
  const why=ex.type==='compound'?(ex.rMax<=8?'heavy compound':'compound'):'isolation';
  return`${t} rest between sets (${why})`;
}
function startRest(secs,exName){
  if(timerIv)clearInterval(timerIv);
  S.active.restEndsAt=Date.now()+secs*1000;
  S.active.restTotal=secs;
  const ov=document.getElementById('rest-ov');
  document.getElementById('rest-exname').textContent=exName||'';
  ov.classList.add('on');
  const ring=document.getElementById('t-ring');
  const num=document.getElementById('t-num');
  const C=339;
  timerIv=setInterval(()=>{
    const rem=Math.ceil((S.active.restEndsAt-Date.now())/1000);
    if(rem<=0){stopRest(true);return;}
    const m=Math.floor(rem/60),ss=rem%60;
    num.textContent=`${m}:${String(ss).padStart(2,'0')}`;
    const pct=(S.active.restTotal-rem)/S.active.restTotal;
    ring.style.strokeDashoffset=(C*pct).toFixed(1);
  },250);
}
function playAlarm(){
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    [[880,0],[880,0.3],[1100,0.6]].forEach(([f,t])=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.connect(g);g.connect(ctx.destination);
      o.type='sine';o.frequency.value=f;
      g.gain.setValueAtTime(0.35,ctx.currentTime+t);
      g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+t+0.22);
      o.start(ctx.currentTime+t);o.stop(ctx.currentTime+t+0.25);
    });
  }catch(e){}
}
function stopRest(alarm){
  if(timerIv){clearInterval(timerIv);timerIv=null;}
  if(alarm)playAlarm();
  S.active&&(delete S.active.restEndsAt)&&(delete S.active.restTotal);
  document.getElementById('rest-ov').classList.remove('on');
  document.getElementById('t-ring').style.strokeDashoffset='0';
}

// ─────────────────────────────────────────────
// ACTIVE WORKOUT LOGIC
// ─────────────────────────────────────────────
function startWorkout(day,sessionType){
  const isEve=sessionType==='eve'&&day.eveningSession;
  const src=isEve?day.eveningSession:day;
  const limit=isEve?(EX_LIMIT[src.mins]||5):3;
  let rawExs=src.exercises.slice(0,limit);
  // Makeup logic only for primary (lunch) sessions
  if(!isEve){
    const missed=getMissedDays();
    if(missed.length>0){
      const todayMuscles=new Set(rawExs.map(e=>e.muscle));
      missed.forEach(missedDow=>{
        const md=S.program.week[missedDow];
        if(!md||md.rest)return;
        const mu=md.exercises.find(e=>!todayMuscles.has(e.muscle));
        if(mu){rawExs=[...rawExs,{...mu,sets:2,isMakeup:true,makeupFrom:md.name}];todayMuscles.add(mu.muscle);}
      });
    }
  }
  S.active={
    dayName:src.name,dow:day.dow,startTime:Date.now(),isLunch:!isEve,
    sessionMins:src.mins||40,loc:src.loc||'ymca',restCap:(!isEve)?90:null,exIdx:0,
    exercises:rawExs.map(e=>({...e,done:[]})),
  };
  S.view='workout';save();render();
}

function completeSet(exIdx,setIdx){
  const ex=S.active.exercises[exIdx];
  const wEl=document.getElementById(`w-${exIdx}-${setIdx}`);
  const rEl=document.getElementById(`r-${exIdx}-${setIdx}`);
  const w=(ex?.noWeight||ex?.isTimed)?0:(parseFloat(wEl?.value)||0);
  const reps=parseInt(rEl?.value)||0;
  if(!reps){if(rEl)rEl.focus();return;}
  ex.done[setIdx]={weight:w,reps};
  const row=document.getElementById(`sr-${exIdx}-${setIdx}`);
  if(row){
    row.classList.add('done');
    const db=row.querySelector('.done-btn');
    if(db){db.innerHTML='↩';db.dataset.action='undo-set';}
    row.querySelectorAll('.ni').forEach(inp=>{if(inp.id!==`w-${exIdx}-${setIdx}`||wEl)inp.disabled=true;});
  }
  const allDone=ex.done.filter(Boolean).length>=ex.sets;
  if(allDone){const nb=document.getElementById(`next-btn-${exIdx}`);if(nb)nb.style.display='flex';}
  save();
  // Lunch sessions keep the 90s cap (hard 40-min time box); evenings get the
  // full intensity-based rest.
  const restSecs=S.active.restCap?Math.min(smartRest(ex),S.active.restCap):smartRest(ex);
  startRest(restSecs,ex.name);
}

function updateWarmup(exIdx,weight){
  const w=parseFloat(weight);if(!w||w<=0)return;
  const set=(id,val)=>{const el=document.getElementById(id);if(el)el.textContent=`${r5(w*val)} lb`;};
  set(`wu1-${exIdx}`,0.5);set(`wu2-${exIdx}`,0.75);set(`wu3-${exIdx}`,0.9);
}

function goToEx(idx){S.active.exIdx=idx;save();render();}

function finishWorkout(fatigue){
  const exData=S.active.exercises.map(e=>({id:e.id,name:e.name,muscle:e.muscle,sets:e.done.filter(Boolean)}));
  // Update lastWeights — only last set's weight per exercise, that's all we need
  exData.forEach(e=>{
    const working=e.sets.filter(s=>s&&s.reps>0&&!e.isMakeup);
    if(working.length){const last=working[working.length-1];S.lastWeights[e.id]={weight:last.weight,reps:last.reps};}
  });
  const log={id:Date.now().toString(),date:new Date().toISOString(),dayName:S.active.dayName,isLunch:S.active.isLunch,duration:Math.round((Date.now()-S.active.startTime)/60000),exercises:exData,fatigue:fatigue||null};
  S.logs.push(log);S.active=null;S.view='dash';
  stopRest();save();render();
}

function abandonWorkout(){
  if(!confirm('Abandon this workout? Progress will be lost.'))return;
  S.active=null;S.view='dash';stopRest();save();render();
}

    <div style='font-size:11px;color:var(--mut);margin-top:6px'>Gentle movement improves blood flow and movement quality — keep effort easy, this should feel good.</div>
  </div>`;
}

function renderAvailGrid(av,inSetup){

    const lunchOn=d.lunch!==false;
    const eveOn=!!d.eve?.on;
    const eveCardio=!!d.eve?.cardioOnly;
    const eveMins=d.eve?.mins||60;
    const planStart=S.cfg?.planStartDow??1;
    const isPastSetup=inSetup&&(planStart===0||dow<planStart);
    const isPast=!inSetup&&dow>0&&dow<today;
    const lunchEquipment=d.lunchEquipment||'ymca';
    const eveEquipment=d.eve?.equipment||'ymca';
    const lunchEquipName=EQUIPMENT_PRESETS[lunchEquipment]?.name||'🏋️ YMCA';
    const eveEquipName=EQUIPMENT_PRESETS[eveEquipment]?.name||'🏋️ YMCA';

    return`<div class='plan-slot-row${isPast?' pg-skip':''}'>
      <div class='plan-slot-day'>${dn}${isPast?` <span style='font-size:10px;color:var(--mut)'>(past)</span>`:''}</div>
      <div class='plan-slot-checks'>
        <div class='plan-chk${lunchOn?' on':''}' data-action='toggle-avail-lunch' data-dow='${dow}'>

        </div>
        <div class='plan-chk${eveOn?' on':''}' data-action='toggle-avail-eve' data-dow='${dow}'>
          <div class='plan-chk-box'>${eveOn?'✓':''}</div>
          <div><div style='font-size:12px;font-weight:700'>After Work</div><div style='font-size:11px;color:var(--mut)'>${eveOn?(eveCardio?'Cardio only':eveMins+' min · '+eveEquipName):'Off'}</div></div>
        </div>
      </div>
      ${eveOn?`<div class='plan-eve-opts'>
        <div style='font-size:12px;color:var(--txt);font-weight:600;margin-bottom:8px'>Equipment &amp; Session Length:</div>
        <div style='display:flex;gap:4px;margin-bottom:8px;flex-wrap:wrap'>
          ${Object.entries(EQUIPMENT_PRESETS).map(([key,preset])=>`<button class='btn btn-sm ${eveEquipment===key?'btn-p':'btn-g'}' data-action='set-eve-equipment' data-dow='${dow}' data-val='${key}' style='flex:1;min-width:120px;font-size:11px'>${preset.name}</button>`).join('')}
        </div>
        <div style='display:flex;gap:6px'>${[45,60,75,90].map(m=>`<div class='opt${eveMins===m?' on':''}' data-action='set-avail-eve-mins' data-dow='${dow}' data-val='${m}' style='padding:8px 4px;flex:1'><div class='opt-v' style='font-size:15px'>${m}</div><div class='opt-l'>min</div></div>`).join('')}</div>
      </div>`:''}
    </div>`;
  };
  const wkndRow=(dow,dn)=>{
    const d=av[dow]||{};
    const on=!!d.on;const mins=d.mins||60;const equipment=d.equipment||'ymca';
    const equipmentName=EQUIPMENT_PRESETS[equipment]?.name||'🏋️ YMCA';
    return`<div class='plan-slot-row'>
      <div class='plan-slot-day'>${dn}</div>
      <div class='plan-slot-checks'>
        <div class='plan-chk${on?' on':''}' data-action='toggle-avail-weekend' data-dow='${dow}'>
          <div class='plan-chk-box'>${on?'✓':''}</div>
          <div><div style='font-size:12px;font-weight:700'>${on?equipmentName:'Rest'}</div><div style='font-size:11px;color:var(--mut)'>${on?'App decides lifting vs cardio':'tap to add session'}</div></div>
        </div>
      </div>
      ${on?`<div class='plan-eve-opts'>
        <div style='font-size:12px;color:var(--txt);font-weight:600;margin-bottom:8px'>Equipment &amp; Session Length:</div>
        <div style='display:flex;gap:4px;margin-bottom:8px;flex-wrap:wrap'>
          ${Object.entries(EQUIPMENT_PRESETS).map(([key,preset])=>`<button class='btn btn-sm ${equipment===key?'btn-p':'btn-g'}' data-action='set-weekend-equipment' data-dow='${dow}' data-val='${key}' style='flex:1;min-width:120px;font-size:11px'>${preset.name}</button>`).join('')}
        </div>
        <div style='display:flex;gap:6px'>${[45,60,75,90].map(m=>`<div class='opt${mins===m?' on':''}' data-action='set-avail-weekend-mins' data-dow='${dow}' data-val='${m}' style='padding:8px 4px;flex:1'><div class='opt-v' style='font-size:15px'>${m}</div><div class='opt-l'>min</div></div>`).join('')}</div>
      </div>`:''}

    ${wkdayRow(1,'Monday')}${wkdayRow(2,'Tuesday')}${wkdayRow(3,'Wednesday')}${wkdayRow(4,'Thursday')}${wkdayRow(5,'Friday')}

     <div class='sec-lbl' style='margin-top:20px'>Conditioning</div>
     <div class='plan-chk${cfg.conditioning?' on':''}' data-action='toggle-conditioning' style='margin-bottom:0'>
       <div class='plan-chk-box'>${cfg.conditioning?'✓':''}</div>
       <div>
         <div style='font-size:13px;font-weight:700'>Add conditioning finishers</div>
         <div style='font-size:12px;color:var(--mut);margin-top:2px;line-height:1.4'>8–15 min of sprint intervals, circuits, or HIIT after each strength session — good for athleticism and cardio capacity.</div>
       </div>
     </div>`,
    `<div class='s-title'>Your body weight?</div>
     <div class='s-sub'>Used to estimate calorie burn from workouts and cardio prescriptions.</div>
     <div class='bw-input-wrap'>
       <input type='number' class='ni bw-big' id='bw-input' value='${cfg.bodyLbs||175}' min='80' max='400' step='5' inputmode='decimal'>
       <span style='font-size:20px;font-weight:600;color:var(--mut)'>lbs</span>
     </div>
     <div style='margin-top:20px'>
       <div class='sec-lbl'>Recent External Workouts (Optional)</div>
