function renderDash(){
  const today=todayDay();const dow=todayDow();const isSunday=dow===0;
  const missed=getMissedDays();
  const completedDows=getCompletedDows();
  const wkGrid=S.program.week.map((d,i)=>{
    const isToday=i===dow;
    const isViewing=S.viewDay===i;
    const isMissed=missed.includes(i);
    const isCompleted=completedDows.has(i);
    // isCompleted checked FIRST — a regenerated week can mark this day rest
    // even though it was actually trained; the log (behind isCompleted) is
    // the source of truth and always wins over the plan's current shape.
    let dot;
    if(isCompleted)dot='background:var(--ok)';
    else if(d.rest)dot='background:var(--bdr)';
    else if(isMissed)dot='background:var(--bad)';
    else if(isToday)dot='background:var(--ok)';
    else dot='background:var(--warn)';
    return`<div class='wk-day${isToday?' today':''}${isViewing?' viewing':''}' data-action='view-day' data-dow='${i}'>
      <div class='wk-dn'${isCompleted?" style='color:var(--ok)'":''}>${isCompleted?'✓':DOW[i].slice(0,1)}</div>
      <div class='wk-dot' style='${dot}'></div>
    </div>`;
  }).join('');

  // Determine which day to show (viewDay or today)
  const showDow=S.viewDay!=null?S.viewDay:dow;
  const showDay=S.program.week[showDow];
  const isViewingOther=S.viewDay!=null&&S.viewDay!==dow;

  function dayCard(d,displayDow,isActualToday){
    // Handle custom workout days
    if(d && d.customWorkout && d.customLog) {
      const log = d.customLog;
      const exList = log.exercises.slice(0,3).map(ex =>
        `<div class='t-ex'><span style='color:var(--acc)'>•</span> ${ex.name} ${ex.sets?.length || 1}×${ex.sets?.[0]?.reps || ex.reps}</div>`
      ).join('');
      const moreText = log.exercises.length > 3 ? `<div class='t-ex' style='color:var(--mut)'>+${log.exercises.length-3} more exercises</div>` : '';

      return `<div class='today' style='border-color:var(--acc);background:linear-gradient(135deg,var(--surf2) 0%,rgba(129,140,248,.04) 100%)'>
        <div class='t-lbl' style='color:var(--acc)'>${isActualToday?'Today · ':''}Custom Workout</div>
        <div class='t-name'>${log.dayName}</div>
        <div class='t-desc'>Logged custom workout · Week adapted for recovery</div>
        <div class='t-exlist' style='margin-bottom:12px'>${exList}${moreText}</div>
        ${isActualToday?`<button class='btn btn-g btn-sm' data-action='log-custom-workout' data-dow='${displayDow}' style='width:100%'>📝 Log Another Workout</button>`:''}
      </div>`;
    }

    // Handle planned custom workout days
    if(d && d.plannedCustomWorkout && d.plannedCustomLog) {
      const log = d.plannedCustomLog;
      const exList = log.exercises.slice(0,3).map(ex =>
        `<div class='t-ex'><span style='color:var(--warn)'>📅</span> ${ex.name} ${ex.sets?.length || 1}×${ex.sets?.[0]?.reps || ex.reps}</div>`
      ).join('');
      const moreText = log.exercises.length > 3 ? `<div class='t-ex' style='color:var(--mut)'>+${log.exercises.length-3} more exercises</div>` : '';

      return `<div class='today' style='border-color:var(--warn);background:linear-gradient(135deg,var(--surf2) 0%,rgba(251,191,36,.04) 100%)'>
        <div class='t-lbl' style='color:var(--warn)'>${isActualToday?'Today · ':''}Planned Workout</div>
        <div class='t-name'>${log.dayName}</div>
        <div class='t-desc'>Week adapted around planned workout</div>
        <div class='t-exlist' style='margin-bottom:12px'>${exList}${moreText}</div>
        <div style='display:flex;gap:8px'>
          ${isActualToday?`<button class='btn btn-p btn-sm' data-action='log-custom-workout' data-dow='${displayDow}' style='flex:1'>📝 Complete Workout</button>`:`<button class='btn btn-g btn-sm' data-action='log-custom-workout' data-dow='${displayDow}' style='flex:1'>📝 Log Workout</button>`}
          <button class='btn btn-g btn-sm' data-action='cancel-planned-workout' data-dow='${displayDow}' style='flex:1'>❌ Cancel</button>
        </div>
      </div>`;
    }

    const isCompleted=completedDows.has(displayDow);
    // Loaded BEFORE the rest-day check — a full regeneration can mark this
    // dow as rest even though it was actually trained; the log is unaffected
    // by that and remains the source of truth for whether/what was done.
    const loggedSess=isCompleted?getLoggedSessionForDow(displayDow):null;

    if((!d||d.rest)&&!loggedSess){
      const label=isActualToday?(isSunday?'Sunday · Plan Your Week':'Rest Day 😴'):(DOW[displayDow]+' · Rest');
      return isActualToday&&isSunday
        ?`<div class='today' style='border-color:rgba(251,191,36,.35);background:linear-gradient(135deg,var(--surf2) 0%,rgba(251,191,36,.04) 100%)'>
            <div class='t-lbl' style='color:var(--warn)'>Sunday · Plan Your Week</div>
            <div class='t-name'>Set Up This Week</div>
            <div class='t-desc'>Tap "Edit" on the Weekly Goal card below to schedule sessions and set your calorie goal.</div>
            ${centuryHTML()}
            ${recoveryHTML(displayDow)}
          </div>`
        :`<div class='today'><div class='t-lbl'>${isActualToday?'Today':DOW[displayDow]}</div><div class='t-name'>${label}</div><div class='t-desc'>${isActualToday?'Recovery is where the growth happens.':''}</div>${isActualToday?centuryHTML():''}${isActualToday?recoveryHTML(displayDow):''}</div>`;
    }
    // The plan's own view of this dow — null when the (possibly regenerated)
    // program disagrees with what was actually logged (marks it rest, or is
    // simply absent). All fields below fall back to the log in that case.
    const dd=(d&&!d.rest)?d:null;
    const exRow=e=>{
      const exp=S.viewExDetail===e.id;
      const lw=S.lastWeights?.[e.id];
      const prog=progression(e.id,e.rMax);
      const estP=(!prog&&!e.noWeight&&(!e.isTimed||timedLoaded(e)))?estimateStartingWeight(e.id,S.logs,MOVEMENT_CLASS):null;
      const detail=exp?`<div style='margin:4px 0 4px 0;padding:8px;background:var(--surf2);border-radius:8px;font-size:12px'>
        ${(()=>{const isDbEd=e.eq?.includes('dumbbells')&&!e.eq?.includes('barbell');const wUnitEd=isDbEd?'lb ea':'lb';return prog?`<div style='margin-bottom:8px'>Last: <strong>${prog.summary}</strong> &nbsp;→&nbsp; <span style='color:var(--acc)'>Goal: ${prog.suggest} ${wUnitEd}</span></div>`:estP?`<div style='margin-bottom:8px'>No history yet — <span style='color:var(--acc)'>estimated start ~${estP.weight} ${wUnitEd}</span> · ${estP.confidence} confidence (${estBasisLabel(estP)}). Adjust if needed:</div>`:`<div style='color:var(--mut);margin-bottom:8px'>No history on this device — enter your last session:</div>`;})()}
        <div style='display:flex;gap:6px;align-items:center;margin-bottom:${e.cue?'8px':'0'}'>
          <input type='number' id='ew-${e.id}' placeholder='${e.eq?.includes('dumbbells')&&!e.eq?.includes('barbell')?'lb ea':'lb'}' value='${lw?.weight||''}' class='ni' step='5' min='0' inputmode='decimal' style='width:72px'>
          <input type='number' id='er-${e.id}' placeholder='reps' value='${lw?.reps||''}' class='ni' min='1' max='50' inputmode='numeric' style='width:60px'>
          <button class='btn btn-s btn-sm' data-action='save-ex-weight' data-exid='${e.id}' style='flex:1'>Save</button>
        </div>
        ${e.cue?`<div style='color:var(--mut);line-height:1.6;padding-top:8px;border-top:1px solid var(--bdr)'>${e.cue}</div>`:''}
        ${feelFor(e)?`<div style='color:var(--acc);line-height:1.6;padding-top:8px'>🎯 <strong>Feel it:</strong> ${feelFor(e)}</div>`:''}
      </div>`:'';
      // Only the NAME ROW is the click target — detail panel sits outside it so inputs don't collapse the panel
      return`<div class='t-ex' style='flex-direction:column;align-items:flex-start'>
        <div data-action='view-ex-detail' data-exid='${e.id}' style='display:flex;align-items:center;gap:6px;width:100%;cursor:pointer'>
          <span style='width:8px;height:8px;border-radius:50%;background:${MCOL[e.muscle]};flex-shrink:0;display:inline-block'></span>${e.name}<span style='font-size:11px;color:var(--mut);margin-left:auto'>${lw?lw.weight+' lb':'tap'}</span>
        </div>
        ${detail}
      </div>`;
    };
    // A completed day shows what was actually logged, not the (possibly since-
    // regenerated) planned template.
    const dispName=loggedSess?loggedSess.dayName:dd.name;
    const dispDesc=loggedSess?`Completed · ${loggedSess.exercises.length} exercise${loggedSess.exercises.length!==1?'s':''} logged`:dd.desc;
    const exList=loggedSess?loggedExRows(loggedSess):dd.exercises.slice(0,3).map(exRow).join('');
    const makeupNote=isActualToday&&missed.length>0?`<div style='font-size:12px;color:var(--bad);margin-bottom:10px'>⚡ +${missed.length} make-up exercise${missed.length>1?'s':''} added (${missed.map(m=>DOW[m]).join(', ')} missed)</div>`:'';
    const completedBanner=isCompleted?`<div style='display:flex;align-items:center;gap:8px;margin-bottom:10px;padding:10px 12px;background:rgba(74,222,128,.08);border:1px solid rgba(74,222,128,.3);border-radius:10px'><span style='font-size:16px'>✅</span><span style='font-size:13px;font-weight:700;color:var(--ok)'>Completed${isActualToday?' today':''} — nice work!</span></div>`:'';
    const lunchBadge=dd?.isLunch?`<span class='badge badge-lunch' style='margin-left:8px'>YMCA · 35–40 min</span>`:`<span class='badge badge-eve' style='margin-left:8px'>${dd?.sessionMins||60} min</span>`;
    // Evening session block
    let eveBlock='';
    if(dd?.eveningSession){
      const eveExs=dd.eveningSession.exercises.slice(0,3).map(exRow).join('');
      // On a prescribed-Pyramid night, say so HERE — this is the button he'd
      // otherwise tap, and a prescription further down the card is one he can
      // scroll past. The lifting session stays fully available underneath.
      const rxNote=isActualToday&&pyramidPrescription()
        ?`<div style='margin-top:8px;padding:8px 10px;background:rgba(249,115,22,.1);border:1px solid rgba(249,115,22,.35);border-radius:8px;font-size:11px;color:var(--mut);line-height:1.6'>⭐ <strong style='color:#f97316'>The Pyramid is tonight's call</strong> — no barbell here and ${getEveningMins()} min to work with. See the card below; this lifting session is the alternative, not both.</div>`
        :'';
      eveBlock=`<div style='margin-top:12px;padding-top:12px;border-top:1px solid var(--bdr)'>
        <div style='font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--acc);margin-bottom:6px'>After Work · ${dd.eveningSession.mins} min</div>
        <div style='font-size:14px;font-weight:700;margin-bottom:4px'>${dd.eveningSession.name}</div>
        <div class='t-exlist'>${eveExs}</div>
        ${rxNote}
        ${isActualToday?`<button class='btn ${pyramidPrescription()?'btn-g':'btn-s'}' data-action='start-workout' data-session='eve' style='margin-top:8px'>Start Evening Workout →</button>`:''}
      </div>`;
    }
    return`<div class='today'${isCompleted?" style='border-color:rgba(74,222,128,.4)'":''}>
      <div class='t-lbl' style='display:flex;align-items:center;flex-wrap:wrap;gap:4px'>${isActualToday?'Today':''}${isActualToday?' · ':''}${DOW[displayDow]}${lunchBadge}${isCompleted?`<span class='badge' style='margin-left:8px;background:rgba(74,222,128,.15);color:var(--ok)'>✓ Completed</span>`:''}</div>
      <div class='t-name'>${dispName}</div>
      <div class='t-desc'>${dispDesc}</div>
      <div class='t-exlist'>${exList}</div>
      ${completedBanner}
      ${makeupNote}
      ${isActualToday&&!isCompleted?`<button class='btn btn-p' data-action='start-workout' data-session='lunch'>Start${dd?.eveningSession?' Lunch':''} Workout →</button>`:''}
      ${isActualToday&&isCompleted?`<button class='btn btn-g btn-sm' data-action='start-workout' data-session='lunch' style='width:100%'>↻ Repeat Workout</button>`:''}
      ${displayDow > todayDow() || (displayDow === 0 && todayDow() < 6) ?
        `<button class='btn btn-g btn-sm' data-action='plan-custom-workout' data-dow='${displayDow}' style='margin-top:8px;width:100%'>📅 Plan Custom Workout</button>` :
        `<button class='btn btn-g btn-sm' data-action='log-custom-workout' data-dow='${displayDow}' style='margin-top:8px;width:100%'>📝 ${isActualToday?'Log Custom Workout Instead':'Log Custom Workout'}</button>`
      }
      ${eveBlock}
      ${isActualToday&&dd?.isLunch?lunchBudgetHTML(displayDow):''}
      ${isActualToday&&S.cfg.conditioning?finisherHTML(displayDow,true,!!dd?.isLunch&&!dd?.eveningSession,dd?.eveningSession?.equipmentKey||dd?.equipmentKey):''}
      ${isActualToday?centuryHTML():''}
      ${isActualToday?pyramidHTML(dd):''}
      ${isActualToday?dailySpineHTML():''}
    </div>`;
  }

  let todayHTML=dayCard(showDay,showDow,!isViewingOther);
  if(isViewingOther){
    todayHTML=`<div style='display:flex;align-items:center;gap:8px;margin-bottom:8px'>
      <button class='btn btn-g btn-sm' data-action='view-day' data-dow='${S.viewDay}' style='width:auto'>← Back to Today</button>
      <span style='font-size:13px;color:var(--mut)'>Viewing ${DOW[showDow]}</span>
    </div>${todayHTML}`;
  }

  const entry=getCalEntry();
  const cardio=calcWeekCardio();
  let cardioHTML='';
  if(cardio){
    if(cardio.cardioCalsNeeded<=0){
      cardioHTML=`<div class='prog-hint' style='margin-top:10px'>✅ Strength covers your goal!</div>`;
    } else {
      const rows=cardio.options.map(o=>`<div class='cardio-row${o.busy?' cardio-busy':''}'>
        <div class='cr-icon'>${o.icon}</div>
        <div class='cr-body'><div class='cr-name'>${o.name}${o.busy?`<span class='cr-busy-tag'>often busy</span>`:''}</div><div class='cr-note'>${o.note}</div></div>
        <div class='cr-right'><div class='cr-dur'>${o.min} min</div><div class='cr-dist'>${o.dist}</div></div>
      </div>`).join('');
      cardioHTML=`<div style='margin-top:10px;padding-top:10px;border-top:1px solid var(--bdr)'>
        <div class='sec-lbl' style='margin-bottom:6px'>Daily Cardio · ${cardio.calsPerDay} cal/day</div>
        <div class='cardio-list'>${rows}</div>
        <div style='font-size:11px;color:var(--mut);margin-top:8px'>${cardio.cardioCalsNeeded} cardio cal target · ${cardio.daysLeft} days left · lifting burns ~${cardio.strengthCals} cal on top</div>
      </div>`;
    }
  }

  // VO2 max protocol — offered on days whose evening is NOT a lifting session
  // (rest days, weekends, cardio evenings). Aerobic only: never touches MRV.
  // Viewing a PAST day of this week retargets the card to THAT day, so a
  // forgotten session (Friday's Norwegian 4×4 remembered on Saturday) is
  // saved with Friday's date — recovery and history logic key off log dates.
  let vo2HTML='';
  {
    const viewDow2=S.viewDay!=null?S.viewDay:dow;
    const isBackdate=viewDow2!==dow;
    const isPastDay=viewDow2<dow; // week grid covers the current Sun–Sat only
    if(!isBackdate||isPastDay){
      const todayD=todayDay();
      const eveningFree=!todayD||todayD.rest||!todayD.eveningSession;
      // Backdating skips the evening-free gate: it records what actually
      // happened, even on a day that also had a lifting session.
      if(isBackdate||eveningFree){
        const proto=currentVO2Protocol();
        const targetDateStr=isBackdate?addDays(todayStr(),viewDow2-dow):todayStr();
        const tomorrow=S.program?.week[(dow+1)%7];
        const legsTomorrow=!isBackdate&&!!(tomorrow&&!tomorrow.rest&&(tomorrow.exercises||[]).some(e=>e.muscle==='legs'&&e.type==='compound'));
        const doneThatDay=vo2History().some(l=>logDay(l.date)===targetDateStr);
        vo2HTML=`<div style='margin-top:10px;padding-top:10px;border-top:1px solid var(--bdr)'>
        <div class='sec-lbl' style='margin-bottom:6px'>Aerobic Engine · ${isBackdate?`Log for ${DOW[viewDow2]}`:'Evening Protocol'}${proto.lvl?` · Session ${proto.lvl+1}`:''}</div>
        <div class='cardio-row'>
          <div class='cr-icon'>${proto.icon}</div>
          <div class='cr-body'><div class='cr-name'>${proto.name}</div><div class='cr-note'>${proto.desc}</div></div>
          <div class='cr-right'><div class='cr-dur'>${proto.mins} min</div><div class='cr-dist'>aerobic</div></div>
        </div>
        ${legsTomorrow?`<div style='font-size:11px;color:var(--warn);margin-top:6px'>${proto.benchmark?`⚠️ Legs are programmed tomorrow — the max row test hits like a heavy session. Shift the test to another evening.`:`⚠️ Legs are programmed tomorrow — keep the easy portions truly easy, or shift this to another evening.`}</div>`:''}
        ${doneThatDay
          ?`<div class='prog-hint' style='margin-top:8px'>✅ VO2 session logged ${isBackdate?DOW[viewDow2]:'today'}</div>`
          :`<button class='btn btn-s btn-sm' data-action='log-vo2-session' data-date='${targetDateStr}' style='margin-top:8px;width:100%'>🫀 Log Engine Session Done${isBackdate?` — for ${DOW[viewDow2]}`:''}</button>`}
        <div style='font-size:11px;color:var(--mut);margin-top:6px'>${isBackdate?`Saves to ${DOW[viewDow2]} ${targetDateStr} — tap "Back to Today" when done. `:''}${proto.benchmark?`Benchmark session — every 8th engine session is the 20-min max row; progression is beating your last distance.`:`+1 interval every 4 sessions, protocols alternate. Doesn't count against lifting MRV or the two-session daily cap.`}</div>
      </div>`;
      }
    }
  }
  const planCard=`<div class='card' style='margin-bottom:14px'>
    <div style='display:flex;justify-content:space-between;align-items:center;margin-bottom:8px'>
      <div class='sec-lbl' style='margin-bottom:0'>Weekly Goal</div>
      <button class='btn btn-p btn-sm' data-action='go-plan' style='width:auto'>${isSunday?'Plan Week →':'Edit →'}</button>
    </div>
    ${entry
      ?`<div style='font-size:13px;color:var(--mut)'>Burn <strong style='color:var(--txt)'>${entry.cals.toLocaleString()}</strong> cal &nbsp;·&nbsp; ${entry.startDate} → ${entry.endDate}</div>`
      :`<div style='font-size:13px;color:var(--mut)'>No goal set — tap ${isSunday?'"Plan Week"':'"Edit"'} to configure.</div>`}
    ${cardioHTML}
    ${vo2HTML}
  </div>`;

  const recentLogs=S.logs.slice(-3).reverse().map(l=>`
    <div class='card2 mb8' style='display:flex;align-items:center;gap:10px'>
      <div data-action='edit-log' data-id='${l.id}' style='cursor:pointer;flex:1;min-width:0'>
        <div style='display:flex;justify-content:space-between;align-items:center;gap:8px'>
          <span style='font-size:13px;font-weight:600'>${l.dayName}</span>
          <span style='font-size:12px;color:var(--mut);flex-shrink:0'>${fmtDate(l.date)}</span>
        </div>
        <div style='font-size:12px;color:var(--mut);margin-top:2px'>${l.exercises.length} exercises · ${fmtDur(l.duration)} · <span style='color:var(--acc)'>tap to view/edit</span></div>
      </div>
      <button class='done-btn' data-action='delete-log' data-id='${l.id}' title='Delete workout' style='background:var(--bad2);color:var(--bad);flex-shrink:0'>🗑️</button>
    </div>`).join('');

  return`<div class='view'>
    <div class='hdg'>My Program</div>
    <div class='sec-lbl'>This Week</div>
    <div class='wk-grid'>${wkGrid}</div>
    ${renderSleepCard()}
    <button class='btn btn-g btn-sm' data-action='open-log-cardio' style='width:100%;margin-bottom:14px'>🏃 Log Cardio Activity</button>
    ${renderRecoveryBanner()}
    ${todayHTML}
    ${dailyHabitsHTML()}
    ${planCard}
    ${renderMRVWidget()}
    ${recentLogs?`<div class='sec-lbl mt16'>Recent</div>${recentLogs}`:''}
    ${renderCloudCard()}
  </div>${renderNav('dash')}`;
}

function renderSwapSearchResults(query,exIdx){
  const q=(query||'').toLowerCase().trim();
  if(!q)return`<div style='font-size:13px;color:var(--mut)'>Type to search all ${EX.length+(S.customExercises||[]).length} exercises…</div>`;
  const ex=S.active?.exercises?.[exIdx];
  const allEx=[...EX,...(S.customExercises||[])];
  const matches=allEx.filter(e=>
    e.id!==(ex?.id) &&
    !S.active.exercises.some(ae=>ae.id===e.id) &&
    !(S.cfg.hipCaution&&e.hipRisk) &&
    !plyoHidden(e) &&
    !kneeCautionBlocks(e) &&
    !userAvoids(e) &&
    (e.name.toLowerCase().includes(q)||e.muscle.toLowerCase().includes(q)||e.type.toLowerCase().includes(q)||(e.tags||[]).some(t=>t.toLowerCase().includes(q)))
  ).slice(0,15);
  if(!matches.length)return`<div style='font-size:13px;color:var(--mut)'>No matches for "${query.replace(/</g,'&lt;')}"</div>`;
  // Dragon Flag tiers still surface when locked (rather than vanish silently),
  // shown disabled with what's needed to unlock — so the progression is
  // discoverable, not a dead end you'd only find by luck once qualified.
  return matches.map(a=>{
    if(!dragonFlagUnlocked(a.id)){
      const idx=DRAGON_FLAG_TRACK.indexOf(a.id);
      const prereqName=allEx.find(e=>e.id===DRAGON_FLAG_TRACK[idx-1])?.name||'the prior tier';
      return`<div class='btn btn-g btn-sm' style='margin-bottom:6px;justify-content:flex-start;text-align:left;width:100%;opacity:.5;cursor:default'><span>🔒 ${a.name}</span><span style='color:var(--mut);font-size:11px;margin-left:6px'>log 10 reps of ${prereqName} to unlock</span></div>`;
    }
    return`<button class='btn btn-g btn-sm' style='margin-bottom:6px;justify-content:flex-start;text-align:left;width:100%' data-action='swap-ex' data-idx='${exIdx}' data-id='${a.id}'><span>${a.name}</span><span style='color:var(--mut);font-size:11px;margin-left:6px'>${a.muscle} · ${a.type}</span></button>`;
  }).join('');
}

function renderWorkout(){
  if(!S.active){
    const today=todayDay();
    const canStart=today&&!today.rest;
    return`<div class='view'>
      <div class='hdg'>Workout</div>
      <div class='empty'>
        <span style='font-size:48px;display:block;margin-bottom:16px'>${canStart?'⏱️':'😴'}</span>
        ${canStart
          ?`<div style='margin-bottom:20px'>No workout in progress.<br><span style='font-size:13px'>Start today's session to track your sets.</span></div>
             <button class='btn btn-p' data-action='start-workout' style='max-width:240px;margin:0 auto'>Start Today's Session →</button>`
          :`Rest day.<br><span style='font-size:13px'>Recovery is where the growth happens.</span>`}
      </div>
    </div>${renderNav('workout')}`;
  }
  if(S.active.ratePending){
    const opts=[
      {v:1,icon:'😌',label:'Easy',sub:'Could do it again right now'},
      {v:2,icon:'🙂',label:'Comfortable',sub:'Solid work, plenty left'},
      {v:3,icon:'😤',label:'Worked',sub:'Good session, properly tired'},
      {v:4,icon:'🥵',label:'Hard',sub:'Close to my limit'},
      {v:5,icon:'💀',label:'Maxed out',sub:'Totally drained'},
    ].map(o=>`<div class='opt col1' data-action='rate-fatigue' data-val='${o.v}' style='display:flex;align-items:center;gap:12px;text-align:left'>
      <span style='font-size:26px'>${o.icon}</span>
      <div><div class='opt-v' style='font-size:16px'>${o.label}</div><div class='opt-l'>${o.sub}</div></div>
    </div>`).join('');
    return`<div class='view'>
      <div class='hdg'>How hard was that?</div>
      <div style='font-size:13px;color:var(--mut);margin-bottom:16px'>Your rating auto-regulates the plan — muscles trained in very hard sessions get a lower volume ceiling for the next 72 hours so you recover instead of overtraining.</div>
      <div class='opts col1'>${opts}</div>
      <button class='btn btn-g btn-sm' data-action='rate-fatigue' data-val='' style='margin-top:12px'>Skip</button>
    </div>${renderNav('workout')}`;
  }
  const{exercises,exIdx,dayName,isLunch}=S.active;
  const ex=exercises[exIdx];
  const total=exercises.length;
  let prog=progression(ex.id,ex.rMax);
  // No history for this loaded movement → fall back to the intensity estimation
  // engine for a conservative opener (uses the value attached at startWorkout,
  // recomputing defensively for sessions started before this field existed).
  // For loaded timed movements, older logs may predate the weight box (weight
  // 0) — the progression record exists but has no usable load, so the estimate
  // still applies.
  const progHasW=!!prog&&prog.weight>0;
  let est=(!ex.noWeight&&(!ex.isTimed||timedLoaded(ex))&&(!prog||(timedLoaded(ex)&&!progHasW)))?(ex.estW||estimateStartingWeight(ex.id,S.logs,MOVEMENT_CLASS)):null;
  const estLbl=estBasisLabel(est);

  // Per-equipment dumbbell rack (e.g. apartment gym: 5/10/15/20/25/40/45/50 —
  // a gap at 30/35). Snap the suggested/estimated load DOWN to a pair actually
  // on hand so we never prescribe a weight that doesn't exist here — once
  // capped by the gap or the max, progress via reps and tempo, not more load.
  const activePreset=EQUIPMENT_PRESETS[S.active.equipmentKey];
  const dbWeights=activePreset?.dumbbellWeights;
  const dbCap=activePreset?.dumbbellMax;
  const capDb=!!(dbWeights||dbCap) && ex.eq?.includes('dumbbells') && !ex.eq?.includes('barbell');
  let dbCapped=false;
  if(capDb){
    if(prog){
      const snapped=dbWeights?roundToAvailable(prog.suggest,dbWeights):Math.min(prog.suggest,dbCap);
      if(snapped!==prog.suggest){prog={...prog,suggest:snapped};dbCapped=true;}
    }
    if(est){
      const snapped=dbWeights?roundToAvailable(est.weight,dbWeights):Math.min(est.weight,dbCap);
      if(snapped!==est.weight){est={...est,weight:snapped};dbCapped=true;}
    }
  }
  const dbCapNote=capDb&&dbCapped?`<div style='font-size:12px;color:var(--warn);margin-bottom:10px'>🏢 Rounded to ${prog?prog.suggest:est.weight} lb ea — nearest pair on hand${dbCap?` (max ${dbCap} lb)`:''}. Progress by adding reps or slowing the tempo once you're maxed out.</div>`:'';
  const mcolor=MCOL[ex.muscle]||'var(--acc)';

  const locLabel=S.active.loc==='home'?'🏢 Apartment Gym':'🏋️ YMCA';
  const sessionTag=ex.isMakeup
    ?`<span class='badge badge-makeup' style='margin-bottom:12px;display:inline-block'>⚡ Make-up · ${ex.makeupFrom}</span>`
    :S.active.isLunch
      ?`<span class='badge badge-lunch' style='margin-bottom:12px;display:inline-block'>YMCA Lunch · 35–40 min</span>`
      :`<span class='badge badge-eve' style='margin-bottom:12px;display:inline-block'>${locLabel} · ${S.active.sessionMins} min</span>`;

  // The caution stretch pools have grown past what fits before a session, so
  // each workout shows a date-rotated subset instead of every item: the offset
  // advances daily, the picks keep their pool order (mobilize → activate), and
  // the full pool cycles across consecutive training days.
  const stretchRot=(pool,n)=>{
    const off=Math.floor(Date.now()/864e5)%pool.length;
    return Array.from({length:Math.min(n,pool.length)},(_,i)=>(off+i)%pool.length).sort((a,b)=>a-b).map(i=>pool[i]);
  };
  const wuRow=(it,i)=>`<div class='wu-row'><span class='wu-set' style='width:20px;font-size:11px'>${i+1}</span><span class='wu-val'>${it.n}</span><span style='color:var(--mut);font-size:12px'> · ${it.d}</span>${it.hold?`<button data-action='start-hold' data-secs='${it.hold}' style='margin-left:auto;font-size:11px;font-weight:600;color:var(--acc);background:var(--acc2);border:none;border-radius:6px;padding:3px 8px;cursor:pointer'>${it.hold}s</button>`:''}</div>`;
  const rotNote=`<div class='wu-note'>Rotates daily — a different subset each session so the warm-up stays short; the full list cycles across the week.</div>`;

  // Mobilize -> Stabilize pool for the office-bound baseline: ankle/thoracic
  // mobility first (counters a desk block), then hip mobility, then hip
  // stability/activation work, all before the first working set.
  const HIP_POOL=[
    {n:'Ankle Rocks',d:'10 reps/side · Achilles/calf mobility'},
    {n:'Cat-Cow',d:'8 slow reps · thoracic extension'},
    {n:'90/90 Hip Stretch',d:'30 sec/side · breathe into it'},
    {n:'Half-Kneeling Hip Flexor Stretch',d:'30 sec/side · tuck pelvis first'},
    {n:'Figure 4 Stretch',d:'30 sec/side · on your back, ankle crossed over the opposite knee, pull that thigh toward your chest — deep glute/piriformis stretch'},
    {n:'Hip CARs',d:'5 circles/side · slow, full range'},
    // Sits next to Hip CARs on purpose — same active-rotation idea, one leg and
    // loaded by bodyweight. Pool order is mobilize → activate and this is the
    // activation end of rotation work, so it comes after the passive stretches.
    {n:'Hip Airplanes',d:'5 cycles/side · hand on a wall, hinge until torso and free leg are one horizontal line, then rotate the pelvis over the stance hip — open UP toward the ceiling, pause, slowly back under. Torso stays still; only the stance hip moves. Slow enough to stop anywhere. Left hip: open up further than you rotate under, and back off at any pinch in the front'},
    {n:'Clamshells',d:'15 reps/side · hips stacked'},
    {n:'Butterfly Stretch',d:'30–45 sec · seated, soles of the feet together, knees dropped out to the sides — hands on ankles, tall spine, gently press the knees toward the floor with your elbows — deep inner-thigh/adductor stretch'},
    {n:'Supine Knee-to-Chest Stretch',d:'30 sec/side · on your back, pull one knee to your chest with both hands, other leg long and flat on the floor — deepens hip flexion range and stretches the glute/lower back'},
    {n:'Knee-to-Chest Lie',d:'45 sec · on your back, hug BOTH knees to your chest, gently rocking side to side if it feels good — decompresses the lower back and opens the hips'},
    {n:'Kneeling Diamond Sit',d:'45 sec · kneel with the knees wide and big toes touching behind you, sit back onto the heels with a tall spine — hips, inner thighs, and ankles together (hip-friendly, like wide-knee child\'s pose)'},
    {n:'Z-Sit',d:'30 sec/side · sit with the front shin folded across in front and the other shin folded to the side behind you (a settled 90/90), tall spine, weight even on both sit bones — releases the hips; switch sides, and ease out if the left groin complains'},
    // Pretzel Stretch removed 2026-07-15: cramps the user's left groin when
    // that leg is bent — the seated cross-leg position drives deep hip flexion
    // + rotation under pressure, exactly the pattern the FAI constraints ban.
    // Figure 4 and 90/90 (both in this pool) cover the same glute/external-
    // rotation territory from safer supine/seated positions.
  ];
  // Left-hip anterior impingement (2026-07-16): flexion + rotation jams the
  // femoral head into the front of the socket (Standing Hip Rotations, Open
  // Gate — both capped below the pinch). Stretching the CAPSULE doesn't fix
  // that; the joint needs DECOMPRESSING first — gently pulling the femoral
  // head away from the rim before working range.
  // Condensed 2026-07-18 (user: no band right now + the 3-drill banded block
  // ate too much UI) from three banded distraction drills to one compact
  // BANDLESS self-traction rockback. Self-traction pulls straight down the
  // bone rather than truly lateral, so it clears the rim less completely than
  // a banded lateral distraction did — but it's the best bandless option and
  // still meaningfully unloads the joint before range work. Restore the
  // banded versions (git history) if a loop band comes back.
  const HIP_DECOMPRESSION=[
    {n:'Hip Flexor Rockback (self-traction)',d:'30–45 sec/side, left first · half-kneeling, both hands wrapped high around the FRONT thigh just under the hip crease. Gently pull the thigh bone down and away from the hip to unload the joint, and — holding that traction — rock the hips back into flexion through the range that normally pinches. No band needed; your hands do the distracting. Ease off the instant you feel the left-hip pinch — that\'s the joint\'s bony limit, not a stretch to push through.',hold:45},
  ];
  const hipDecompHTML=S.cfg.hipCaution?`<div style='margin-bottom:10px'>
    ${HIP_DECOMPRESSION.map(wuRow).join('')}
    <div class='wu-note'>Decompress first, then mobilize into the pool below. Left hip: back off at the pinch.</div>
  </div>`:'';
  const hipPrehabHTML=S.cfg.hipCaution&&exIdx===0?`<div class='wu-box' style='border-color:rgba(192,132,252,.3);background:rgba(192,132,252,.04);margin-bottom:14px'>
    <div class='wu-title' style='color:#c084fc'>🦋 Decompress &amp; Mobilize (do these before lifting)</div>
    ${hipDecompHTML}
    ${stretchRot(HIP_POOL,4).map(wuRow).join('')}
    ${rotNote}
  </div>`:'';

  // "Achy Shoulder" protocol: replaces the generic warm-up mindset with a
  // decompression + posture-correction pool when the user has flagged
  // shoulder discomfort or poor posture, shown before the first exercise.
  const SHOULDER_POOL=[
    {n:'Dead Hang',d:'30–60 sec · shoulder decompression'},
    {n:'Face Pulls',d:'15 reps · rear-delt/rotator-cuff stability'},
    // Band Pull-aparts removed 2026-07-15: user has no band. Face Pulls above
    // and the thoracic rotations below cover the same rear-delt/upper-back
    // posture territory bandless. Re-add if a band comes back.
    {n:'Doorway Stretch',d:'30 sec/side · pec/anterior shoulder mobility'},
    {n:'Kneeling Thoracic Rotation',d:'10 reps/side · tall-kneeling, hand behind head, rotate the elbow down and across then up toward the ceiling — hips stay square, the upper back does the rotating'},
    {n:'Standing Thoracic Rotation',d:'10 reps/side · feet planted hip-width, arms crossed at the chest, rotate the upper body side to side while the hips stay facing forward'},
    {n:'Behind-the-Back Shoulder Stretch',d:"30 sec · clasp your hands behind your back (hold a towel if they don't meet), straighten the arms, and gently lift them away from your body — opens the front of the shoulder through end-range extension"},
    {n:'Overhead Reach Stretch',d:'30 sec · reach both arms straight overhead, interlace fingers, palms up, and reach tall — deepens overhead shoulder flexion range and stretches the lats'},
    {n:'Crab Reach',d:'8 reps/side · seated crab position (hands planted behind you, feet flat), press the hips up and reach one arm up and over across the body — opens the front of the shoulders and extends the upper back'},
  ];
  const achyShoulderHTML=S.cfg.shoulderCaution&&exIdx===0?`<div class='wu-box' style='border-color:rgba(96,165,250,.3);background:rgba(96,165,250,.04);margin-bottom:14px'>
    <div class='wu-title' style='color:var(--acc)'>🩹 Achy Shoulder Warm-up (do this instead of a generic warm-up)</div>
    ${stretchRot(SHOULDER_POOL,3).map(wuRow).join('')}
    ${rotNote}
  </div>`:'';

  // Daily Mobility: general lower + upper body movement prep, shown EVERY
  // session regardless of the hip/shoulder caution toggles above (those stay
  // scoped to actual flagged issues). Rotates a fixed 2 lower + both upper

    const setRep=isBackoffSet?`${backoffRepLo}–${backoffRepHi}`:repRange;

    const setTag=(isNoWeight||isTimed||!useBackoff)?'':`<div style='font-size:9px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-top:2px'>${isBackoffSet?'back-off':'top set'}</div>`;
    // Last working set only (see lastSetTechnique) — and only once every
    // earlier set is logged, so it appears as the cue for the set being done
    // rather than as clutter from the moment the card opens.
    const techNote=(i===ex.sets-1&&!done&&ex.done.filter(Boolean).length>=ex.sets-1&&lastSetTechnique(ex))
      ?`<div style='grid-column:1/-1;font-size:11.5px;color:var(--txt-dim);line-height:1.45;margin-top:6px;padding:6px 8px;background:rgba(251,191,36,.07);border-left:3px solid rgba(251,191,36,.5);border-radius:0 6px 6px 0'>🔥 ${lastSetTechnique(ex)}</div>`:'';
    return`<div class='set-row${done?' done':''}' id='sr-${exIdx}-${i}' style='${rowGrid}'>
      <div class='sn'>${i+1}</div>
      <div class='st'>${setRep}${setTag}</div>
      ${hideWeight?'':`<input class='ni' type='number' id='w-${exIdx}-${i}' placeholder='${isDumbbellEx?'each':'lb'}' value='${done?done.weight:sugW||''}' min='0' step='5' inputmode='decimal' ${done?'disabled':''} data-warmup-src='${(ex.isFirst||isGroupFirst)&&i===0?exIdx:''}'>`}
      <input class='ni' type='number' id='r-${exIdx}-${i}' placeholder='${isTimed?'sec':'reps'}' value='${done?done.reps:sugR}' min='0' max='${isTimed?300:50}' inputmode='numeric' ${done?'disabled':''}>
      <button class='done-btn' id='db-${exIdx}-${i}' data-action='${done?'undo-set':'done-set'}' data-ex='${exIdx}' data-set='${i}'>${done?'↩':'→'}</button>
      ${techNote}
    </div>`;
  }).join('');

  const allDone=ex.done.filter(Boolean).length>=ex.sets;
  const isLast=exIdx===total-1;
  const condBlock=isLast&&S.cfg.conditioning&&allDone?finisherHTML(S.active.dow,false,!!S.active.isLunch,S.active.equipmentKey):'';
  // Post-session cool-down (~5 min, evening/weekend sessions only — lunch is
  // hard time-boxed): static relief for the desk-stiff areas (neck, lower
  // back) plus tibialis work for incline-walking shin stiffness. The tib
  // raises come FIRST and are strengthening, not stretching — a stronger
  // tibialis is what stops the shins tightening up on every incline walk.
  // Tibialis Raises always lead (strengthening, not stretching); the static
  // stretches rotate 3-per-session from the pool below, same daily-offset
  // scheme as the pre-lift caution pools, so the cool-down stays ~5 min.
  const COOLDOWN_POOL=[
    {n:'Kneeling Shin Stretch',d:'45 sec · sit back on your heels, tops of the feet flat on the floor',hold:45},
    {n:'Upper Trap Stretch',d:'30 sec/side · ear toward shoulder, opposite hand reaching at the floor',hold:30},
    // Child's Pose moved OUT of the rotation — it's now a fixed item in
    // DAILY_SPINE_MINIMUMS below, so keeping it here would double it up.
    {n:'Supine Twist',d:'30 sec/side · on your back, knees dropped to one side, shoulders flat',hold:30},
    {n:'Figure 4 Stretch',d:'45 sec/side · on your back, ankle crossed over the opposite knee, pull that thigh toward your chest — deep glute/piriformis stretch',hold:45},
    {n:'Knee-to-Wall Ankle Stretch',d:'45 sec/side · half-kneeling facing a wall, front toes ~4 in away, drive the knee past the toes toward the wall with the heel GLUED down — ankle dorsiflexion is what caps squat depth; inch the foot back as range grows',hold:45},
    {n:'Pigeon Pose',d:'45 sec/side · front shin across the body, back leg long behind, fold the chest over the front leg and breathe — deep glute/piriformis',hold:45},
    {n:'Bridge Pose',d:'30 sec · on your back, feet planted, press the hips up and interlace the hands underneath — opens the hip flexors and the front of the spine after a day of sitting',hold:30},
    {n:'Plow Pose',d:'30 sec · from your back, sweep the legs up and over until the toes reach the floor behind your head (knees bent is fine) — full posterior-chain and spine stretch; skip if the neck complains',hold:30},
    {n:'Toe Stretch',d:'30 sec · kneel with the toes tucked under and sit back onto the heels — plantar fascia and toe flexors; brutal at first, eases fast with practice',hold:30},
    {n:'Straddle Stretch',d:'60 sec · seated, legs wide, walk the chest forward between them with a flat back — adductors and hamstrings together; a real ROM builder at this dose',hold:60},
    {n:'Butterfly Stretch',d:'45 sec · seated, soles of the feet together, knees dropped out to the sides — hands on ankles, tall spine, gently press the knees toward the floor with your elbows — deep inner-thigh/adductor stretch',hold:45},
    {n:'Supine Knee-to-Chest Stretch',d:'30 sec/side · on your back, pull one knee to your chest with both hands, other leg long and flat on the floor — deepens hip flexion range and stretches the glute/lower back',hold:30},
    {n:'Z-Sit',d:'30 sec/side · sit with the front shin folded across in front and the other shin folded to the side behind you (a settled 90/90), tall spine, weight even on both sit bones — releases the hips; switch sides, and ease out if the left groin complains',hold:30},
    // Pretzel Stretch removed 2026-07-15 — cramps the left groin (see HIP_POOL note).
    {n:'Behind-the-Back Shoulder Stretch',d:"30 sec · clasp your hands behind your back (hold a towel if they don't meet), straighten the arms, and gently lift them away from your body — opens the front of the shoulder through end-range extension",hold:30},
    {n:'Overhead Reach Stretch',d:'30 sec · reach both arms straight overhead, interlace fingers, palms up, and reach tall — deepens overhead shoulder flexion range and stretches the lats',hold:30},
    // Upper-back (thoracic) additions — chronically stiff area, so the pool
    // carries three so the rotation surfaces one most days.
    {n:'Thread the Needle',d:'30 sec/side · from all fours, slide one arm under the body until the shoulder rests on the floor — upper-back rotation, breathe into the stretch',hold:30},
    {n:'Open Book',d:'30 sec/side · side-lying, knees stacked at 90°, sweep the top arm open following the hand with your eyes — pure thoracic rotation, hips stay put',hold:30},
    {n:'Prayer Stretch',d:'45 sec · kneel with forearms on a bench, sink the chest toward the floor — lats and mid-back lengthen together, the stiff-upper-back opener',hold:45},
    {n:'Knee-to-Chest Lie',d:'45 sec · on your back, hug BOTH knees to your chest, gently rocking side to side if it feels good — decompresses the lower back and opens the hips',hold:45},
    {n:'Kneeling Diamond Sit',d:'45 sec · kneel with the knees wide and big toes touching behind you, sit back onto the heels with a tall spine — hips, inner thighs, and ankles together (hip-friendly, like wide-knee child\'s pose)',hold:45},
  ];
  const cooldownHTML=isLast&&allDone&&!S.active.isLunch?`<div class='wu-box' style='border-color:rgba(96,165,250,.3);background:rgba(96,165,250,.04);margin-top:14px'>
    <div class='wu-title' style='color:var(--acc)'>🧊 Cool-down · ~5 min</div>
    ${[{n:'Tibialis Raises',d:'20 reps · back on a wall, lift toes to shins — strengthens away incline-walk shin stiffness'},...stretchRot(COOLDOWN_POOL,3)].map(wuRow).join('')}
    <div class='wu-note'>Static holds live HERE, after training — pre-lift work stays dynamic on purpose. These are range-of-motion doses, not just relief: sink to a 6/10 "productive discomfort" (never pain) and go a little deeper on each exhale — done consistently, this is what lengthens range over weeks. Stretches rotate daily; the full pool cycles across the week. Do this before tapping Finish.</div>
    <div class='wu-title' style='color:#c084fc;margin-top:14px'>🧘 Daily Spine Minimums · ~5 min · these never rotate</div>
    ${DAILY_SPINE_MINIMUMS.map(wuRow).join('')}
    <div class='wu-note'>Fixed daily doses, every day: 60s child's pose (knees wide — hip-friendly), 2 min of cobra split into a few holds, 60s plank, 60s down dog. Knocking them out here checks off today's minimums, so there's nothing left to do at home.</div>
    <div class='wu-title' style='color:var(--acc);margin-top:14px'>🦴 McGill Big 3 · ~6 min · the stability half</div>
    ${MCGILL_BIG3.map(wuRow).join('')}
    <div class='wu-note'>Braced holds, ~10s each, reps descending 6 → 4 → 2. Endurance is the target, not strength, so none of these go near failure. In all three the LOW BACK DOESN'T MOVE — if it's moving, the exercise has turned into the thing it exists to replace. Doing them here means they're done for the day.</div>
  </div>`:'';
  const nextBtn=allDone
    ?`<button class='btn ${isLast?'btn-ok':'btn-p'}' id='next-btn-${exIdx}' data-action='${isLast?'finish-workout':'next-ex'}' style='margin-top:10px'>${isLast?'🏁 Finish Workout':'Next Exercise →'}</button>`
    :`<button class='btn btn-p' id='next-btn-${exIdx}' data-action='${isLast?'finish-workout':'next-ex'}' style='margin-top:10px;display:none'>${isLast?'🏁 Finish Workout':'Next Exercise →'}</button>`;
  // Visible only while sets remain unfinished — the primary Next/Finish button
  // above already covers "move on" once every set is logged. This is the
  // explicit "I can't/won't finish every set of THIS exercise" escape hatch.
  const skipBtn=!allDone?`<button class='cue-btn' data-action='skip-ex' style='margin-top:8px;color:var(--mut)'>⏭ Skip this exercise${isLast?' & finish workout':''}</button>`:'';

  const prevBtn=exIdx>0?`<button class='ex-nav-btn' data-action='prev-ex'>← Previous</button>`:'';

  return`<div class='view'>
    <div class='wkt-hdr'>
      <div>
        <div class='wkt-day'>${dayName}</div>
        <div class='wkt-prog'>Exercise ${exIdx+1} of ${total}</div>
      </div>
      <div style='display:flex;gap:6px'>
        <button class='abandon' style='width:auto;padding:8px 12px;border-radius:10px' data-action='end-now'>🏁 End Now</button>

      </div>
    </div>
    ${S.active.autoRegNotes?.length?`<div class='wu-box' style='margin-bottom:14px'>
      <div class='wu-title'>⚖️ Auto-Regulation · 2nd Session Today</div>
      ${S.active.autoRegNotes.map(n=>`<div class='wu-row'>${n}</div>`).join('')}
      <div class='wu-note'>Volume adjusted from what you actually logged earlier today (60% rule).</div>
    </div>`:''}
    ${hipPrehabHTML}
    ${achyShoulderHTML}
    ${dailyMobilityHTML}
    ${machineModeHTML}
    ${efficiencyModeHTML}
    ${deskReversalHTML}
    <div class='ex-card'>
      ${sessionTag}
      <div class='ex-name'>${ex.name}</div>
      <span class='m-tag' style='background:${mcolor}22;color:${mcolor}'>${MNAME[ex.muscle]||ex.muscle} · ${ex.type}</span>
      ${feelFor(ex)?`<div style='font-size:12.5px;color:var(--txt-dim);line-height:1.5;margin:8px 0 10px;padding:8px 10px;background:${mcolor}0d;border-left:3px solid ${mcolor}66;border-radius:0 8px 8px 0'>🎯 <strong style='color:${mcolor}'>Feel it:</strong> ${feelFor(ex)}</div>`:''}
      ${SETUP_ROW(ex)}
      ${handleFor(ex)&&(EQUIPMENT_PRESETS[S.active.equipmentKey||'ymca']?.equipment||[]).includes('cables')?`<div style='font-size:12px;color:var(--txt-dim);line-height:1.5;margin:0 0 10px;padding:6px 10px;background:rgba(96,165,250,.06);border:1px solid rgba(96,165,250,.2);border-radius:8px'>🔗 <strong style='color:var(--acc)'>Attachment:</strong> ${handleFor(ex)}</div>`:''}
      <div style='display:flex;gap:8px;align-items:center;margin-bottom:10px'>
        <button class='cue-btn' data-action='toggle-cue' data-id='cue-${exIdx}' style='margin-bottom:0'>💡 Technique tip</button>
        <button class='cue-btn' data-action='toggle-swap' style='margin-bottom:0;margin-left:auto;color:var(--mut)'>↕ Swap</button>
      </div>
      <div class='cue-txt' id='cue-${exIdx}'>${ex.cue||''}</div>
      ${ex.isoHoldSecs?`<button class='btn btn-g btn-sm' data-action='start-iso-hold' data-secs='${ex.isoHoldSecs}' style='margin-bottom:10px;width:100%'>⏱ Start ${ex.isoHoldSecs}s mid-position hold</button>`:''}
      ${swapPanel}
      ${warmupHTML}
      ${progHTML}
      ${dbCapNote}
      <div class='sets-hdr' style='${rowGrid}'>
        <div class='sh'>Set</div><div class='sh'>Target</div>
        ${hideWeight?'':`<div class='sh'>Weight</div>`}<div class='sh'>${isTimed?'Sec':'Reps'}</div><div class='sh'></div>
      </div>
      ${setsRows}
      ${condBlock}
      ${cooldownHTML}
      ${nextBtn}
      ${skipBtn}
    </div>
    ${(exIdx<total-1)?`<div class='card2' style='margin-top:12px'>
      <div style='font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--mut);margin-bottom:8px;display:flex;align-items:center;gap:4px'>
        <svg width='12' height='12' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='9 18 15 12 9 6'/></svg>Next Up
      </div>
      <div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'>
        <span style='width:6px;height:6px;border-radius:50%;background:${MCOL[exercises[exIdx+1].muscle]||'var(--acc)'};flex-shrink:0;display:inline-block'></span>
        <strong style='font-size:14px'>${exercises[exIdx+1].name}</strong>
        <span style='font-size:11px;color:var(--mut);margin-left:auto'>${exercises[exIdx+1].sets} × ${exercises[exIdx+1].rMin}–${exercises[exIdx+1].rMax}${exercises[exIdx+1].isTimed?'s':''}</span>
      </div>
      <button class='cue-btn' data-action='toggle-cue' data-id='next-cue-${exIdx+1}' style='margin-bottom:6px'>💡 Preview technique tip</button>
      <div class='cue-txt' id='next-cue-${exIdx+1}' style='font-size:12px;margin-bottom:0'>${exercises[exIdx+1].cue||'No technique notes available.'}</div>
    </div>`:''}
    ${prevBtn?`<div class='ex-nav'>${prevBtn}</div>`:''}
    <div style='font-size:12px;color:var(--mut);text-align:center;margin-top:8px'>${S.active.restCap?S.active.restCap+'s rest between sets (lunch time-box)':smartRestLabel(ex)} · slow eccentric</div>
  </div>`;
}

// ─────────────────────────────────────────────
// RENDER – REVIEW WORKOUT
// ─────────────────────────────────────────────
function renderReviewWorkout(){
  if(!S.reviewWorkout){S.view='dash';render();return;}

  const {day, sessionType} = S.reviewWorkout;
  const isEve = sessionType === 'eve' && day.eveningSession;
  const src = isEve ? day.eveningSession : day;
  // Show every exercise the program built for this session — matches the
  // Program tab (which renders src.exercises in full) and the started workout.
  // The array is already sized at generation time (lunch=3, longer sessions=
  // EX_LIMIT[mins]), so a true 40-min lunch still shows 3.
  let rawExs = src.exercises.slice();

  // Show makeup exercises logic (same as startWorkout)
  if(!isEve){
    const missed = getMissedDays();
    if(missed.length > 0){
      const todayMuscles = new Set(rawExs.map(e => e.muscle));
      missed.forEach(missedDow => {
        const md = S.program.week[missedDow];
        if(!md || md.rest) return;
        const mu = md.exercises.find(e => !todayMuscles.has(e.muscle));
        if(mu){
          rawExs = [...rawExs, {...mu, sets: 2, isMakeup: true, makeupFrom: md.name}];
          todayMuscles.add(mu.muscle);
        }
      });
    }
  }

  const sessionLabel = src.isLunch ? `${src.name} · Lunch` : `${src.name} · ${src.mins||src.sessionMins||60} min`;

  const exerciseCards = rawExs.map((ex, idx) => {
    const mcolor = MCOL[ex.muscle] || 'var(--acc)';
    const makeupBadge = ex.isMakeup ? `<span class='badge badge-makeup' style='margin-bottom:8px;display:inline-block'>⚡ Make-up · ${ex.makeupFrom}</span>` : '';

    return `<div class='ex-card' style='position:relative'>
      ${makeupBadge}
      <div style='display:flex;align-items:center;justify-content:space-between;margin-bottom:8px'>
        <div class='m-tag' style='background:${mcolor}22;color:${mcolor};border:1px solid ${mcolor}44'>${MNAME[ex.muscle]}</div>
        <button class='btn btn-g btn-sm' data-action='swap-exercise' data-idx='${idx}' style='font-size:11px;padding:6px 10px'>⟲ Swap</button>
      </div>
      <div class='ex-name'>${ex.name}</div>
      <div style='font-size:13px;color:var(--mut);margin-bottom:8px'>${ex.sets} sets × ${ex.rMin}–${ex.rMax} ${ex.isTimed?'seconds':'reps'}</div>
      <button class='cue-btn' data-action='toggle-cue' data-id='review-cue-${idx}'>💡 Technique tip</button>
      <div class='cue-txt' id='review-cue-${idx}'>${ex.cue || 'No technique notes available.'}${setupFor(ex)?`<div style='color:var(--acc);margin-top:8px'>🏗️ <strong>Set up on:</strong> ${setupFor(ex)}</div>`:''}${handleFor(ex)?`<div style='color:var(--acc);margin-top:8px'>🔗 <strong>Attachment:</strong> ${handleFor(ex)}</div>`:''}${feelFor(ex)?`<div style='color:var(--acc);margin-top:8px'>🎯 <strong>Feel it:</strong> ${feelFor(ex)}</div>`:''}</div>
    </div>`;
  }).join('');

  return `<div class='view'>
    <button class='s-back' data-action='back-to-dash' style='margin-bottom:20px;margin-top:0'>
      <svg width='20' height='20' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='15 18 9 12 15 6'/></svg> Back
    </button>
    <div class='hdg'>Review Workout</div>
    <div style='font-size:14px;font-weight:700;margin-bottom:4px'>${sessionLabel}</div>
    <div style='font-size:13px;color:var(--mut);margin-bottom:20px'>Review exercises below. Tap "Swap" to replace any exercise with alternatives.</div>

    ${exerciseCards}

    <div style='margin-top:20px;display:flex;gap:8px'>
      <button class='btn btn-g' data-action='back-to-dash' style='flex:1'>Cancel</button>
      <button class='btn btn-p' data-action='confirm-start-workout' style='flex:2'>🚀 Start Workout</button>
    </div>
  </div>`;
}

    </button>

    <div style='font-size:14px;font-weight:700;margin-bottom:4px'>${S.customWorkoutLog.isBackdate ? 'Retroactive Entry' : DOW[dow]+' - Custom Session'}</div>
    <div style='font-size:13px;color:var(--mut);margin-bottom:20px'>${S.customWorkoutLog.isBackdate ? 'Pick when you did this workout. It joins your history in order — weekly volume, recovery, and weight progression all recalculate from it.' : S.customWorkoutLog.isPlanning ? 'Plan the exercises you will do. Your week will be adjusted immediately to avoid overworking muscle groups.' : 'Enter the exercises you completed. The rest of your week will adapt to account for muscle group fatigue and volume.'}</div>

    ${exercises.length > 0 ? exerciseRows : '<div style="text-align:center;color:var(--mut);padding:20px">No exercises added yet</div>'}

// RENDER – PROGRAM
// ─────────────────────────────────────────────
function renderProgram(){
  const dow=todayDow();
  const cardio=calcWeekCardio();
  const missed=getMissedDays();
  const completedDows=getCompletedDows();
  const cardioBlurb=cardio&&cardio.calsPerDay>0
    ?cardio.options.slice(0,3).map(o=>`${o.icon} ${o.name}: ${o.min} min${o.dist&&o.dist!=='—'?' · '+o.dist:''}`).join(' · ')
    :'';

  const exRow=e=>`<div class='pg-ex'><div class='pg-dot' style='background:${MCOL[e.muscle]}'></div>${e.name} <span style='color:var(--mut);font-size:12px'>· ${e.sets}×${e.rMin}–${e.rMax}${e.isTimed?'s':''}</span></div>`;

  const days=S.program.week.map(d=>{
    const isToday=d.dow===dow;
    const isCompleted=completedDows.has(d.dow);
    // Loaded BEFORE the rest/skip check — a full regeneration can mark this
    // dow as rest even though it was actually trained; the log is unaffected
    // by that and remains the source of truth for whether/what was done.
    const loggedSess=isCompleted?getLoggedSessionForDow(d.dow):null;
    const isSkipped=!d.rest&&!isCompleted&&isDaySkipped(d.dow);
    const isMissed=!d.rest&&!isSkipped&&!isCompleted&&missed.includes(d.dow);
    if((d.rest||isSkipped)&&!loggedSess){
      if(d.dow===0||d.dow===6)return''; // skip weekend rest rows
      let cn='';
      if(cardio&&cardio.calsPerDay>0&&!isSkipped){
        cn=`<div style='margin-top:8px;padding-top:8px;border-top:1px solid var(--bdr)'>
          <div style='font-size:11px;color:var(--warn);font-weight:700;margin-bottom:4px'>+ Daily Cardio · ${cardio.calsPerDay} cal</div>
          <div style='font-size:11px;color:var(--mut)'>${cardioBlurb}</div>
        </div>`;
      }
      return`<div class='pg-day${isToday?' today-day':''}${isSkipped?' pg-skip':''}'>
        <div class='pg-dh'><div class='pg-dn' style='color:var(--mut)'>${DOW[d.dow]}</div><span style='font-size:12px;color:var(--mut)'>${isSkipped?'Skipped this week':'Rest'}${!isSkipped&&cardio&&cardio.calsPerDay>0?' + Cardio':''}</span></div>
        ${cn}
      </div>`;
    }
    // The plan's own view of this dow — null when the (possibly regenerated)
    // program disagrees with what was actually logged (marks it rest). All
    // fields below fall back to the log in that case.
    const dd=(d&&!d.rest)?d:null;
    const badge=dd?.isLunch?`<span class='badge badge-lunch'>YMCA · 35–40 min</span>`:`<span class='badge badge-eve'>${dd?.sessionMins||60} min</span>`;
    const missedTag=isMissed?`<span style='font-size:11px;color:var(--bad);font-weight:700;margin-left:6px'>⚠️ missed</span>`:'';
    const completedTag=isCompleted?`<span style='font-size:11px;color:var(--ok);font-weight:700;margin-left:6px'>✓ completed</span>`:'';
    // Completed days display the actual logged session, not the planned template.
    const exList=loggedSess?loggedExRows(loggedSess):(dd?.exercises||[]).map(exRow).join('');
    let eveBlock='';
    if(dd?.eveningSession){
      const eveList=dd.eveningSession.exercises.map(exRow).join('');
      eveBlock=`<div style='margin-top:12px;padding-top:12px;border-top:1px solid var(--bdr)'>
        <div style='font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--acc);margin-bottom:6px'>After Work · ${dd.eveningSession.name} · ${dd.eveningSession.mins} min</div>
        ${eveList}
      </div>`;
    }
    let cn='';
    if(cardio&&cardio.calsPerDay>0){
      cn=`<div style='margin-top:8px;padding-top:8px;border-top:1px solid var(--bdr)'>
        <div style='font-size:11px;color:var(--warn);font-weight:700;margin-bottom:4px'>+ Daily Cardio · ${cardio.calsPerDay} cal</div>
        <div style='font-size:11px;color:var(--mut)'>${cardioBlurb}</div>
      </div>`;
    }
    return`<div class='pg-day${isToday?' today-day':''}${isMissed?' pg-missed':''}${isCompleted?' pg-done':''}'>
      <div class='pg-dh'>
        <div><div class='pg-dn' style='display:flex;align-items:center;gap:4px;flex-wrap:wrap'>${loggedSess?loggedSess.dayName:(dd?.name||DOW[d.dow])}${completedTag}${missedTag} ${badge}</div><div class='pg-dd'>${DOW[d.dow]}</div></div>
        ${isToday?`<span style='font-size:11px;font-weight:700;color:var(--acc);background:var(--acc2);padding:3px 8px;border-radius:20px'>TODAY</span>`:''}
      </div>
      <div>${exList}</div>
      ${eveBlock}
      ${cn}
    </div>`;
  }).join('');

  const calSummary=cardio?`<div class='card' style='margin-bottom:16px'>
    <div class='sec-lbl'>Calorie Plan</div>
    ${cardio.cardioCalsNeeded<=0
      ?`<div class='prog-hint'>✅ Strength covers your goal</div>`
      :`<div style='font-size:13px;color:var(--mut)'>Strength ~${cardio.strengthCals} cal · Need ${cardio.cardioCalsNeeded} more from cardio · ${cardio.calsPerDay} cal/day · ${cardio.daysLeft} days left</div>`}
  </div>`:'';

  return`<div class='view'>
    <div class='hdg'>Weekly Program</div>
    <div class='sub'>Every movement for the week. Combo days show both the lunch and after-work sessions. Skipped days show as rest. Missed days shown in red. Set your goal and plan from the Home tab.</div>
    ${calSummary}
    ${days}
    <div class='mt16'>
      <button class='btn btn-g btn-sm' data-action='reset-program' style='width:auto'>↺ Reset &amp; reconfigure</button>
    </div>
  </div>${renderNav('program')}`;
}

// Pull whatever is currently typed in the Edit Workout inputs back into the
// draft. Must run before ANY re-render of the log-edit view (add/remove
// exercise), not just on save — render() rebuilds the inputs from the draft,
// so unsynced typing would silently reset to the draft's stored values.
function syncLogEditInputs(){
  const log=S.editLogDraft;if(!log)return;
  // Timing: adopt the start/finish pair only when it's coherent. An impossible
  // pair (finish before start, a mistyped year) leaves the draft on its previous
  // values rather than being clamped into a garbage duration — the live readout
  // flags it, and save-log-edit refuses to save until it's fixed.
  const s=fromLocalInputValue(document.getElementById('el-start')?.value||'');
  const f=fromLocalInputValue(document.getElementById('el-finish')?.value||'');
  if(s&&f){
    const m=minsBetween(s,f);
    if(m>=1&&m<=MAX_LOGGED_MINS){log.date=f;log.duration=m;}
  }
  log.exercises.forEach((ex,ei)=>{
    const isNW=ex.noWeight||EX.find(e=>e.id===ex.id)?.noWeight;
    (ex.sets||[]).forEach((s,si)=>{
      if(!isNW){const wEl=document.getElementById(`el-w-${ei}-${si}`);if(wEl)s.weight=parseFloat(wEl.value)||0;}
      const rEl=document.getElementById(`el-r-${ei}-${si}`);if(rEl)s.reps=parseInt(rEl.value)||0;
    });
  });
}

// Live duration readout under the start/finish pair — duration is no longer typed,
// so this is the only feedback that the two ends actually make sense together.
function updateLogEditDur(){
  const out=document.getElementById('el-dur-out');if(!out)return;
  const err=logEditTimingError();
  if(err){out.textContent='⚠️ '+err;out.style.color='var(--bad)';return;}
  const m=minsBetween(fromLocalInputValue(document.getElementById('el-start').value),
                      fromLocalInputValue(document.getElementById('el-finish').value));
  out.textContent='Duration: '+fmtDur(m);out.style.color='var(--ok)';
}
// Returns a human-readable problem with the timing inputs, or null when they're
// usable. Shared by the live readout and the save gate so they can't disagree.
function logEditTimingError(){
  const sEl=document.getElementById('el-start'),fEl=document.getElementById('el-finish');
  if(!sEl||!fEl)return null;// timing card not mounted (e.g. called before render)
  const s=fromLocalInputValue(sEl.value),f=fromLocalInputValue(fEl.value);
  if(!s||!f)return'Enter both a start and a finish time.';
  const m=minsBetween(s,f);
  if(m<1)return'The finish time is at or before the start time.';
  if(m>MAX_LOGGED_MINS)return'That works out to over 24 hours — check the dates.';
  return null;
}

function onNewLogExInput(value){
  S.newLogExName=value;

function renderNewLogExSuggest(value){
  const box=document.getElementById('new-log-ex-suggest');
  if(!box)return;
  const list=exSuggestList(value);
  if(!list.length){box.classList.remove('on');box.innerHTML='';return;}
  box.innerHTML=list.map(e=>
    `<div class='ex-suggest-item' data-name="${e.name.replace(/"/g,'&quot;')}" onpointerdown='pickNewLogExSuggest(this.dataset.name)'>
       <span>${e.name}</span><span class='es-mus'>${MNAME[e.muscle]||''}</span>
     </div>`
  ).join('');
  box.classList.add('on');
}
function hideNewLogExSuggest(){
  setTimeout(()=>{const box=document.getElementById('new-log-ex-suggest');if(box)box.classList.remove('on');},200);
}
function pickNewLogExSuggest(name){
  S.newLogExName=name;
  const inp=document.getElementById('new-log-ex-name');
  if(inp)inp.value=name;
  const box=document.getElementById('new-log-ex-suggest');
  if(box){box.classList.remove('on');box.innerHTML='';}
}

function renderHistory(){

      const exDef=EX.find(ex=>ex.id===e.id);

// ─────────────────────────────────────────────
// CUSTOM WORKOUT HELPERS
// ─────────────────────────────────────────────
function updateCustomExercise(idx, field, value) {
  if (!S.customWorkoutLog || !S.customWorkoutLog.exercises[idx]) return;
  S.customWorkoutLog.exercises[idx][field] = value;
  // Don't save yet, just update state
}

// Find an exact database (or custom) exercise match for a typed name.
function exMatch(name) {
  if (!name || !name.trim()) return null;
  const allEx = [...EX, ...(S.customExercises||[])];
  return allEx.find(e => e.name.toLowerCase() === name.toLowerCase().trim()) || null;
}

// Common abbreviations / synonyms expanded so "BB Bench" → "barbell bench" etc.
const EX_ABBR = {
  bb:'barbell', db:'dumbbell', kb:'kettlebell', ohp:'overhead press',
  rdl:'romanian deadlift', sldl:'romanian deadlift', bw:'bodyweight',
  ext:'extension', lat:'lateral', pull:'pullup', chin:'chinup',
  sa:'single arm', sl:'single leg'
};

// Normalize an exercise name into a list of comparable tokens.
function exTokens(s) {
  if (!s) return [];
  let t = s.toLowerCase().trim().replace(/[^a-z0-9\s]/g, ' ');
  // Canonicalize "X up" compounds so "situps", "sit ups" and "sit-ups" all
  // converge to one token — same for push/pull/chin/step/lay/leg up(s).
  t = t.replace(/\b(push|pull|sit|chin|step|lay|leg|hand|knee)\s+ups?\b/g, '$1up');
  let tokens = t.split(/\s+/).filter(Boolean).map(w => EX_ABBR[w] || w);
  tokens = tokens.join(' ').split(/\s+/).filter(Boolean);
  // crude singularize so "curls"/"squats"/"press" compare consistently
  tokens = tokens.map(w => (w.length > 3 && w.endsWith('s')) ? w.slice(0, -1) : w);
  return tokens;
}

// Fuzzy-match a typed name to the closest database exercise. Returns the best
// candidate only when it's a clear winner, to avoid linking ambiguous names.
function fuzzyMatchEx(name) {
  const inputTokens = exTokens(name);
  if (!inputTokens.length) return null;
  const inputSet = new Set(inputTokens);
  const allEx = [...EX, ...(S.customExercises||[])];
  const scored = [];
  allEx.forEach(e => {
    const exSet = new Set(exTokens(e.name));
    let overlap = 0;
    inputSet.forEach(tk => { if (exSet.has(tk)) overlap++; });
    if (!overlap) return;
    const dice = (2 * overlap) / (inputSet.size + exSet.size);
    const coverage = overlap / inputSet.size; // how much of what they typed is covered
    if (coverage >= 0.6) scored.push({ e, score: dice });
  });
  if (!scored.length) return null;
  scored.sort((a, b) => b.score - a.score);
  const top = scored[0];
  const second = scored[1];
  // Require a decent score and a clear winner (not a near-tie / ambiguous)
  if (top.score >= 0.5 && (!second || top.score - second.score >= 0.15)) return top.e;
  return null;
}

// Resolve a typed name to a database exercise: exact first, then fuzzy.
function resolveEx(name) {
  const exact = exMatch(name);
  if (exact) return { match: exact, exact: true };
  const fuzzy = fuzzyMatchEx(name);
  if (fuzzy) return { match: fuzzy, exact: false };
  return { match: null, exact: false };
}

// Identify the muscle group for an exercise name: matched exercise first,
// then keyword-based estimation as a fallback.
function detectMuscle(name) {
  if (!name || !name.trim()) return 'legs';
  const { match } = resolveEx(name);
  if (match) return match.muscle;
  return estimateMuscleGroup(name);
}

// Read-only line showing the auto-detected muscle group for the typed exercise.
function muscleDispHtml(name) {
  if (!name || !name.trim()) return `<span style="color:var(--mut)">Muscle group auto-detects from the exercise</span>`;
  const m = detectMuscle(name);
  const color = MCOL[m] || 'var(--acc)';
  return `<span style="color:var(--mut)">Targets <strong style="color:${color}">${MNAME[m]||m}</strong> · auto-detected</span>`;
}

// Message shown under the name field: confirms whether this entry is linked to a
// known exercise (so its weights feed the 4% progression history) or is brand new.
function matchInfoHtml(name) {
  const { match, exact } = resolveEx(name);
  if (match && exact) return `<span style="color:var(--ok)">✓ Linked to <strong>${match.name}</strong> — weights feed your 4% progression</span>`;
  if (match) return `<span style="color:var(--ok)">✓ Matched to <strong>${match.name}</strong> — weights feed your 4% progression</span>`;
  if (name && name.trim()) return `<span style="color:var(--mut)">New exercise — tracked on its own</span>`;
  return '';
}

// Live handler as the user types an exercise name — keeps the muscle dropdown in
// sync (unless they've manually overridden it) without re-rendering / losing focus.
function onCustomNameInput(idx, value) {
  if (!S.customWorkoutLog || !S.customWorkoutLog.exercises[idx]) return;
  const ex = S.customWorkoutLog.exercises[idx];
  ex.name = value;
  ex.muscle = detectMuscle(value); // always auto-detect from the exercise
  // Live-update the muscle-group line and the database-link indicator
  const dEl = document.getElementById('cust-musc-disp-' + idx);
  if (dEl) dEl.innerHTML = muscleDispHtml(value);
  const mEl = document.getElementById('cust-match-' + idx);
  if (mEl) mEl.innerHTML = matchInfoHtml(value);
  // Refresh the suggestions dropdown
  renderExSuggest(idx, value);
}

// Build the ranked list of exercise suggestions for what the user has typed.
function exSuggestList(value) {
  const all = [...EX, ...(S.customExercises||[])];
  const q = (value || '').toLowerCase().trim();
  if (!q) return all.slice(0, 8); // show a starter list when empty
  const qTokens = exTokens(value);
  const scored = all.map(e => {
    const name = e.name.toLowerCase();
    const exT = new Set(exTokens(e.name));
    let score = 0;
    if (name.includes(q)) score += 2;
    if (name.startsWith(q)) score += 1;
    qTokens.forEach(t => { if (exT.has(t)) score += 1; });
    return { e, score };
  }).filter(x => x.score > 0);
  scored.sort((a, b) => b.score - a.score);
  return scored.slice(0, 8).map(x => x.e);
}

// Render the dropdown of exercise suggestions under a row's name field.
function renderExSuggest(idx, value) {
  const box = document.getElementById('ex-suggest-' + idx);
  if (!box) return;
  const list = exSuggestList(value);
  if (!list.length) { box.classList.remove('on'); box.innerHTML = ''; return; }
  box.innerHTML = list.map(e =>
    `<div class='ex-suggest-item' data-name="${e.name.replace(/"/g,'&quot;')}" onpointerdown='pickExSuggest(${idx}, this.dataset.name)'>
       <span>${e.name}</span><span class='es-mus'>${MNAME[e.muscle]||''}</span>
     </div>`
  ).join('');
  box.classList.add('on');
}

// User tapped a suggestion — fill the field, sync muscle + link indicator.
function pickExSuggest(idx, name) {
  if (!S.customWorkoutLog || !S.customWorkoutLog.exercises[idx]) return;
  const ex = S.customWorkoutLog.exercises[idx];
  ex.name = name;
  ex.muscle = detectMuscle(name); // always auto-detect from the exercise
  const inp = document.getElementById('cust-name-' + idx);
  if (inp) inp.value = name;
  const dEl = document.getElementById('cust-musc-disp-' + idx);
  if (dEl) dEl.innerHTML = muscleDispHtml(name);
  const mEl = document.getElementById('cust-match-' + idx);
  if (mEl) mEl.innerHTML = matchInfoHtml(name);
  const box = document.getElementById('ex-suggest-' + idx);
  if (box) { box.classList.remove('on'); box.innerHTML = ''; }
}

// Hide the dropdown on blur (delayed so a tap on a suggestion registers first).
function hideExSuggest(idx) {
  setTimeout(() => {
    const box = document.getElementById('ex-suggest-' + idx);
    if (box) box.classList.remove('on');
  }, 200);
}

// Pull the live DOM values into state before any re-render. The inputs also
// commit per keystroke (oninput), but this guards the case where a render is
// triggered before an input event lands (e.g. tapping "+ Add Exercise" with
// the keyboard still open) — previously that wiped unsaved weights/reps.
function harvestCustomInputs() {
  if (!S.customWorkoutLog || !S.customWorkoutLog.exercises) return;
  S.customWorkoutLog.exercises.forEach((ex, idx) => {
    const g = id => document.getElementById(id);
    const n = g('cust-name-' + idx);   if (n && n.value !== '') ex.name = n.value;
    const s = g('cust-sets-' + idx);   if (s && s.value !== '') ex.sets = parseInt(s.value) || ex.sets;
    const r = g('cust-reps-' + idx);   if (r && r.value !== '') ex.reps = parseInt(r.value) || ex.reps;
    const w = g('cust-weight-' + idx); if (w && w.value !== '') ex.weight = parseFloat(w.value) || 0;
  });
}

function removeCustomExercise(idx) {
  if (!S.customWorkoutLog || !S.customWorkoutLog.exercises) return;
  harvestCustomInputs();
  S.customWorkoutLog.exercises.splice(idx, 1);
  render();
}

function addCustomExerciseRow() {
