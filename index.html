function renderDash(){
  const today=todayDay();const dow=todayDow();const isSunday=dow===0;
  const missed=getMissedDays();
  const wkGrid=S.program.week.map((d,i)=>{
    const isToday=i===dow;
    const isViewing=S.viewDay===i;
    const isMissed=missed.includes(i);
    let dot;
    if(d.rest)dot='background:var(--bdr)';
    else if(isMissed)dot='background:var(--bad)';
    else if(isToday)dot='background:var(--ok)';
    else dot='background:var(--warn)';
    return`<div class='wk-day${isToday?' today':''}${isViewing?' viewing':''}' data-action='view-day' data-dow='${i}'>
      <div class='wk-dn'>${DOW[i].slice(0,1)}</div>
      <div class='wk-dot' style='${dot}'></div>
    </div>`;
  }).join('');

  // Determine which day to show (viewDay or today)
  const showDow=S.viewDay!=null?S.viewDay:dow;
  const showDay=S.program.week[showDow];
  const isViewingOther=S.viewDay!=null&&S.viewDay!==dow;

  function dayCard(d,displayDow,isActualToday){
    // Handle custom workout days
    if(d && d.customWorkout && d.customLog) {
      const log = d.customLog;
      const exList = log.exercises.slice(0,3).map(ex =>
        `<div class='t-ex'><span style='color:var(--acc)'>•</span> ${ex.name} ${ex.sets?.length || 1}×${ex.sets?.[0]?.reps || ex.reps}</div>`
      ).join('');
      const moreText = log.exercises.length > 3 ? `<div class='t-ex' style='color:var(--mut)'>+${log.exercises.length-3} more exercises</div>` : '';

      return `<div class='today' style='border-color:var(--acc);background:linear-gradient(135deg,var(--surf2) 0%,rgba(129,140,248,.04) 100%)'>
        <div class='t-lbl' style='color:var(--acc)'>${isActualToday?'Today · ':''}Custom Workout</div>
        <div class='t-name'>${log.dayName}</div>
        <div class='t-desc'>Logged custom workout · Week adapted for recovery</div>
        <div class='t-exlist' style='margin-bottom:12px'>${exList}${moreText}</div>
        ${isActualToday?`<button class='btn btn-g btn-sm' data-action='log-custom-workout' data-dow='${displayDow}' style='width:100%'>📝 Log Another Workout</button>`:''}
      </div>`;
    }

    // Handle planned custom workout days
    if(d && d.plannedCustomWorkout && d.plannedCustomLog) {
      const log = d.plannedCustomLog;
      const exList = log.exercises.slice(0,3).map(ex =>
        `<div class='t-ex'><span style='color:var(--warn)'>📅</span> ${ex.name} ${ex.sets?.length || 1}×${ex.sets?.[0]?.reps || ex.reps}</div>`
      ).join('');
      const moreText = log.exercises.length > 3 ? `<div class='t-ex' style='color:var(--mut)'>+${log.exercises.length-3} more exercises</div>` : '';

      return `<div class='today' style='border-color:var(--warn);background:linear-gradient(135deg,var(--surf2) 0%,rgba(251,191,36,.04) 100%)'>
        <div class='t-lbl' style='color:var(--warn)'>${isActualToday?'Today · ':''}Planned Workout</div>
        <div class='t-name'>${log.dayName}</div>
        <div class='t-desc'>Week adapted around planned workout</div>
        <div class='t-exlist' style='margin-bottom:12px'>${exList}${moreText}</div>
        <div style='display:flex;gap:8px'>
          ${isActualToday?`<button class='btn btn-p btn-sm' data-action='log-custom-workout' data-dow='${displayDow}' style='flex:1'>📝 Complete Workout</button>`:`<button class='btn btn-g btn-sm' data-action='log-custom-workout' data-dow='${displayDow}' style='flex:1'>📝 Log Workout</button>`}
          <button class='btn btn-g btn-sm' data-action='cancel-planned-workout' data-dow='${displayDow}' style='flex:1'>❌ Cancel</button>
        </div>
      </div>`;
    }

    if(!d||d.rest){
      const label=isActualToday?(isSunday?'Sunday · Plan Your Week':'Rest Day 😴'):(DOW[displayDow]+' · Rest');
      return isActualToday&&isSunday
        ?`<div class='today' style='border-color:rgba(251,191,36,.35);background:linear-gradient(135deg,var(--surf2) 0%,rgba(251,191,36,.04) 100%)'>
            <div class='t-lbl' style='color:var(--warn)'>Sunday · Plan Your Week</div>
            <div class='t-name'>Set Up This Week</div>
            <div class='t-desc'>Tap "Edit" on the Weekly Goal card below to schedule sessions and set your calorie goal.</div>
            ${recoveryHTML(displayDow)}
          </div>`
        :`<div class='today'><div class='t-lbl'>${isActualToday?'Today':DOW[displayDow]}</div><div class='t-name'>${label}</div><div class='t-desc'>${isActualToday?'Recovery is where the growth happens.':''}</div>${isActualToday?recoveryHTML(displayDow):''}</div>`;
    }
    const exRow=e=>{
      const exp=S.viewExDetail===e.id;
      const lw=S.lastWeights?.[e.id];
      const prog=progression(e.id,e.rMax);
      const detail=exp?`<div style='margin:4px 0 4px 0;padding:8px;background:var(--surf2);border-radius:8px;font-size:12px'>
        ${prog?`<div style='margin-bottom:8px'>Last: <strong>${prog.summary}</strong> &nbsp;→&nbsp; <span style='color:var(--acc)'>Goal: ${prog.suggest} lb</span></div>`
              :`<div style='color:var(--mut);margin-bottom:8px'>No history on this device — enter your last session:</div>`}
        <div style='display:flex;gap:6px;align-items:center;margin-bottom:${e.cue?'8px':'0'}'>
          <input type='number' id='ew-${e.id}' placeholder='lb' value='${lw?.weight||''}' class='ni' step='5' min='0' inputmode='decimal' style='width:72px'>
          <input type='number' id='er-${e.id}' placeholder='reps' value='${lw?.reps||''}' class='ni' min='1' max='50' inputmode='numeric' style='width:60px'>
          <button class='btn btn-s btn-sm' data-action='save-ex-weight' data-exid='${e.id}' style='flex:1'>Save</button>
        </div>
        ${e.cue?`<div style='color:var(--mut);line-height:1.6;padding-top:8px;border-top:1px solid var(--bdr)'>${e.cue}</div>`:''}
      </div>`:'';
      // Only the NAME ROW is the click target — detail panel sits outside it so inputs don't collapse the panel
      return`<div class='t-ex' style='flex-direction:column;align-items:flex-start'>
        <div data-action='view-ex-detail' data-exid='${e.id}' style='display:flex;align-items:center;gap:6px;width:100%;cursor:pointer'>
          <span style='width:8px;height:8px;border-radius:50%;background:${MCOL[e.muscle]};flex-shrink:0;display:inline-block'></span>${e.name}<span style='font-size:11px;color:var(--mut);margin-left:auto'>${lw?lw.weight+' lb':'tap'}</span>
        </div>
        ${detail}
      </div>`;
    };
    const exList=d.exercises.slice(0,3).map(exRow).join('');
    const makeupNote=isActualToday&&missed.length>0?`<div style='font-size:12px;color:var(--bad);margin-bottom:10px'>⚡ +${missed.length} make-up exercise${missed.length>1?'s':''} added (${missed.map(m=>DOW[m]).join(', ')} missed)</div>`:'';
    const lunchBadge=d.isLunch?`<span class='badge badge-lunch' style='margin-left:8px'>YMCA · 35–40 min</span>`:`<span class='badge badge-eve' style='margin-left:8px'>${d.sessionMins||60} min</span>`;
    // Evening session block
    let eveBlock='';
    if(d.eveningSession){
      const eveExs=d.eveningSession.exercises.slice(0,3).map(exRow).join('');
      eveBlock=`<div style='margin-top:12px;padding-top:12px;border-top:1px solid var(--bdr)'>
        <div style='font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--acc);margin-bottom:6px'>After Work · ${d.eveningSession.mins} min</div>
        <div style='font-size:14px;font-weight:700;margin-bottom:4px'>${d.eveningSession.name}</div>
        <div class='t-exlist'>${eveExs}</div>
        ${isActualToday?`<button class='btn btn-s' data-action='start-workout' data-session='eve' style='margin-top:8px'>Start Evening Workout →</button>`:''}
      </div>`;
    }
    return`<div class='today'>
      <div class='t-lbl' style='display:flex;align-items:center;flex-wrap:wrap;gap:4px'>${isActualToday?'Today':''}${isActualToday?' · ':''}${DOW[displayDow]}${lunchBadge}</div>
      <div class='t-name'>${d.name}</div>
      <div class='t-desc'>${d.desc}</div>
      <div class='t-exlist'>${exList}</div>
      ${makeupNote}
      ${isActualToday?`<button class='btn btn-p' data-action='start-workout' data-session='lunch'>Start${d.eveningSession?' Lunch':''} Workout →</button>`:''}
      ${displayDow > todayDow() || (displayDow === 0 && todayDow() < 6) ?
        `<button class='btn btn-g btn-sm' data-action='plan-custom-workout' data-dow='${displayDow}' style='margin-top:8px;width:100%'>📅 Plan Custom Workout</button>` :
        `<button class='btn btn-g btn-sm' data-action='log-custom-workout' data-dow='${displayDow}' style='margin-top:8px;width:100%'>📝 ${isActualToday?'Log Custom Workout Instead':'Log Custom Workout'}</button>`
      }
      ${eveBlock}
      ${isActualToday&&S.cfg.conditioning?finisherHTML(displayDow,true):''}
    </div>`;
  }

  let todayHTML=dayCard(showDay,showDow,!isViewingOther);
  if(isViewingOther){
    todayHTML=`<div style='display:flex;align-items:center;gap:8px;margin-bottom:8px'>
      <button class='btn btn-g btn-sm' data-action='view-day' data-dow='${S.viewDay}' style='width:auto'>← Back to Today</button>
      <span style='font-size:13px;color:var(--mut)'>Viewing ${DOW[showDow]}</span>
    </div>${todayHTML}`;
  }

  const entry=getCalEntry();
  const cardio=calcWeekCardio();
  let cardioHTML='';
  if(cardio){
    if(cardio.cardioCalsNeeded<=0){
      cardioHTML=`<div class='prog-hint' style='margin-top:10px'>✅ Strength covers your goal!</div>`;
    } else {
      const rows=cardio.options.map(o=>`<div class='cardio-row${o.busy?' cardio-busy':''}'>
        <div class='cr-icon'>${o.icon}</div>
        <div class='cr-body'><div class='cr-name'>${o.name}${o.busy?`<span class='cr-busy-tag'>often busy</span>`:''}</div><div class='cr-note'>${o.note}</div></div>
        <div class='cr-right'><div class='cr-dur'>${o.min} min</div><div class='cr-dist'>${o.dist}</div></div>
      </div>`).join('');
      cardioHTML=`<div style='margin-top:10px;padding-top:10px;border-top:1px solid var(--bdr)'>
        <div class='sec-lbl' style='margin-bottom:6px'>Daily Cardio · ${cardio.calsPerDay} cal/day</div>
        <div class='cardio-list'>${rows}</div>
        <div style='font-size:11px;color:var(--mut);margin-top:8px'>${cardio.cardioCalsNeeded} cardio cal needed · ${cardio.daysLeft} days left · strength ~${cardio.strengthCals} cal</div>
      </div>`;
    }
  }
  const planCard=`<div class='card' style='margin-bottom:14px'>
    <div style='display:flex;justify-content:space-between;align-items:center;margin-bottom:8px'>
      <div class='sec-lbl' style='margin-bottom:0'>Weekly Goal</div>
      <button class='btn btn-p btn-sm' data-action='go-plan' style='width:auto'>${isSunday?'Plan Week →':'Edit →'}</button>
    </div>
    ${entry
      ?`<div style='font-size:13px;color:var(--mut)'>Burn <strong style='color:var(--txt)'>${entry.cals.toLocaleString()}</strong> cal &nbsp;·&nbsp; ${entry.startDate} → ${entry.endDate}</div>`
      :`<div style='font-size:13px;color:var(--mut)'>No goal set — tap ${isSunday?'"Plan Week"':'"Edit"'} to configure.</div>`}
    ${cardioHTML}
  </div>`;

  const recentLogs=S.logs.slice(-3).reverse().map(l=>`
    <div class='card2 mb8' style='display:flex;align-items:center;gap:10px'>
      <div data-action='edit-log' data-id='${l.id}' style='cursor:pointer;flex:1;min-width:0'>
        <div style='display:flex;justify-content:space-between;align-items:center;gap:8px'>
          <span style='font-size:13px;font-weight:600'>${l.dayName}</span>
          <span style='font-size:12px;color:var(--mut);flex-shrink:0'>${fmtDate(l.date)}</span>
        </div>
        <div style='font-size:12px;color:var(--mut);margin-top:2px'>${l.exercises.length} exercises · ${fmtDur(l.duration)} · <span style='color:var(--acc)'>tap to view/edit</span></div>
      </div>
      <button class='done-btn' data-action='delete-log' data-id='${l.id}' title='Delete workout' style='background:var(--bad2);color:var(--bad);flex-shrink:0'>🗑️</button>
    </div>`).join('');

  return`<div class='view'>
    <div class='hdg'>My Program</div>
    <div class='sec-lbl'>This Week</div>
    <div class='wk-grid'>${wkGrid}</div>
    ${todayHTML}
    ${planCard}
    ${renderMRVWidget()}
    ${recentLogs?`<div class='sec-lbl mt16'>Recent</div>${recentLogs}`:''}
    ${renderCloudCard()}
  </div>${renderNav('dash')}`;
}

// RENDER – WORKOUT
// ─────────────────────────────────────────────
function renderWorkout(){
  if(!S.active){
    const today=todayDay();
    const canStart=today&&!today.rest;
    return`<div class='view'>
      <div class='hdg'>Workout</div>
      <div class='empty'>
        <span style='font-size:48px;display:block;margin-bottom:16px'>${canStart?'⏱️':'😴'}</span>
        ${canStart
          ?`<div style='margin-bottom:20px'>No workout in progress.<br><span style='font-size:13px'>Start today's session to track your sets.</span></div>
             <button class='btn btn-p' data-action='start-workout' style='max-width:240px;margin:0 auto'>Start Today's Session →</button>`
          :`Rest day.<br><span style='font-size:13px'>Recovery is where the growth happens.</span>`}
      </div>
    </div>${renderNav('workout')}`;
  }
  if(S.active.ratePending){
    const opts=[
      {v:1,icon:'😌',label:'Easy',sub:'Could do it again right now'},
      {v:2,icon:'🙂',label:'Comfortable',sub:'Solid work, plenty left'},
      {v:3,icon:'😤',label:'Worked',sub:'Good session, properly tired'},
      {v:4,icon:'🥵',label:'Hard',sub:'Close to my limit'},
      {v:5,icon:'💀',label:'Maxed out',sub:'Totally drained'},
    ].map(o=>`<div class='opt col1' data-action='rate-fatigue' data-val='${o.v}' style='display:flex;align-items:center;gap:12px;text-align:left'>
      <span style='font-size:26px'>${o.icon}</span>
      <div><div class='opt-v' style='font-size:16px'>${o.label}</div><div class='opt-l'>${o.sub}</div></div>
    </div>`).join('');
    return`<div class='view'>
      <div class='hdg'>How hard was that?</div>
      <div style='font-size:13px;color:var(--mut);margin-bottom:16px'>Your rating auto-regulates the plan — muscles trained in very hard sessions get a lower volume ceiling for the next 72 hours so you recover instead of overtraining.</div>
      <div class='opts col1'>${opts}</div>
      <button class='btn btn-g btn-sm' data-action='rate-fatigue' data-val='' style='margin-top:12px'>Skip</button>
    </div>${renderNav('workout')}`;
  }
  const{exercises,exIdx,dayName,isLunch}=S.active;
  const ex=exercises[exIdx];
  const total=exercises.length;
  const prog=progression(ex.id,ex.rMax);
  const mcolor=MCOL[ex.muscle]||'var(--acc)';

  const locLabel=S.active.loc==='home'?'🏠 Home · Pull-up Bar':'🏋️ YMCA';
  const sessionTag=ex.isMakeup
    ?`<span class='badge badge-makeup' style='margin-bottom:12px;display:inline-block'>⚡ Make-up · ${ex.makeupFrom}</span>`
    :S.active.isLunch
      ?`<span class='badge badge-lunch' style='margin-bottom:12px;display:inline-block'>YMCA Lunch · 35–40 min</span>`
      :`<span class='badge badge-eve' style='margin-bottom:12px;display:inline-block'>${locLabel} · ${S.active.sessionMins} min</span>`;

  const hipPrehabHTML=S.cfg.hipCaution&&exIdx===0?`<div class='wu-box' style='border-color:rgba(192,132,252,.3);background:rgba(192,132,252,.04);margin-bottom:14px'>
    <div class='wu-title' style='color:#c084fc'>🦋 Hip Activation (do these before lifting)</div>
    <div class='wu-row'><span class='wu-set' style='width:20px;font-size:11px'>1</span><span class='wu-val'>Hip CARs</span><span style='color:var(--mut);font-size:12px'> · 5 circles/side · slow, full range</span></div>
    <div class='wu-row'><span class='wu-set' style='width:20px;font-size:11px'>2</span><span class='wu-val'>Clamshells</span><span style='color:var(--mut);font-size:12px'> · 15 reps/side · hips stacked</span></div>
    <div class='wu-row'><span class='wu-set' style='width:20px;font-size:11px'>3</span><span class='wu-val'>90/90 Hip Stretch</span><span style='color:var(--mut);font-size:12px'> · 30 sec/side · breathe into it</span></div>
    <div class='wu-row'><span class='wu-set' style='width:20px;font-size:11px'>4</span><span class='wu-val'>Half-Kneeling Hip Flexor Stretch</span><span style='color:var(--mut);font-size:12px'> · 30 sec/side · tuck pelvis first</span></div>
  </div>`:'';

  const sugW0=prog?prog.suggest:null;
  const wu1Lbl=sugW0?`${r5(sugW0*0.5)} lb`:'~50%';
  const wu2Lbl=sugW0?`${r5(sugW0*0.75)} lb`:'~75%';
  const wu3Lbl=sugW0?`${r5(sugW0*0.9)} lb`:'~90%';
  const warmupHTML=ex.isFirst?`<div class='wu-box'>
    <div class='wu-title'>⚡ Warm-up Sets — Weight Acclimation (do these first)</div>
    <div class='wu-row'><span class='wu-set'>WU1</span><span class='wu-val' id='wu1-${exIdx}'>${wu1Lbl}</span><span style='color:var(--mut);font-size:13px'> × 8 reps — groove the pattern</span><button data-action='start-wu-rest' data-secs='60' style='margin-left:auto;font-size:11px;font-weight:600;color:var(--acc);background:var(--acc2);border:none;border-radius:6px;padding:3px 8px;cursor:pointer'>60s rest</button></div>
    <div class='wu-row'><span class='wu-set'>WU2</span><span class='wu-val' id='wu2-${exIdx}'>${wu2Lbl}</span><span style='color:var(--mut);font-size:13px'> × 3 reps — sharpen bar path</span><button data-action='start-wu-rest' data-secs='90' style='margin-left:auto;font-size:11px;font-weight:600;color:var(--acc);background:var(--acc2);border:none;border-radius:6px;padding:3px 8px;cursor:pointer'>90s rest</button></div>
    <div class='wu-row'><span class='wu-set'>WU3</span><span class='wu-val' id='wu3-${exIdx}'>${wu3Lbl}</span><span style='color:var(--mut);font-size:13px'> × 1 rep — prime the CNS</span><button data-action='start-wu-rest' data-secs='120' style='margin-left:auto;font-size:11px;font-weight:600;color:var(--acc);background:var(--acc2);border:none;border-radius:6px;padding:3px 8px;cursor:pointer'>2 min rest</button></div>
    <div class='wu-note'>No cardio, static stretching, or ab work before this.${sugW0?' Warm-up weights calculated from your target — update if you adjust the working weight below.':' Enter working weight below → warm-up loads update automatically.'}</div>
  </div>`:'';

  const isNoWeight=ex.noWeight===true;
  const isTimed=ex.isTimed===true;
  let progHTML;
  if(isTimed){
    if(prog){
      const secStr=prog.minR===prog.maxR?`${prog.minR}s`:`${prog.minR}–${prog.maxR}s`;
      const tip=prog.ready
        ?`<div class='prog-hint'>🔼 Hit top time — next: try ${prog.maxR+5}s per side</div>`
        :`<div style='font-size:13px;color:var(--mut);margin-bottom:10px'>Build to ${ex.rMax}s — same hold</div>`;
      progHTML=`<div class='last-info'>Last: <strong>${secStr} per side</strong></div>${tip}`;
    } else {
      progHTML=`<div style="font-size:13px;color:var(--mut);margin-bottom:10px">First time — start conservatively, focus on form over duration.</div>`;
    }
  } else if(isNoWeight){
    if(prog){
      const repStr=prog.minR===prog.maxR?`${prog.minR} reps`:`${prog.minR}–${prog.maxR} reps`;
      const tip=prog.ready
        ?`<div class='prog-hint'>🔼 Hit top range — next: add a 1s pause at the top each rep, or slow your descent to 4 counts</div>`
        :`<div style='font-size:13px;color:var(--mut);margin-bottom:10px'>Build to ${ex.rMax} strict reps — same bodyweight</div>`;
      progHTML=`<div class='last-info'>Last: <strong>${repStr}</strong></div>${tip}`;
    } else {
      progHTML=`<div style="font-size:13px;color:var(--mut);margin-bottom:10px">First time — strict form, full dead hang, 3-count descent on every rep.</div>`;
    }
  } else {
    progHTML=prog?`<div class='last-info'>Last session: <strong>${prog.summary}</strong></div>
      ${prog.ready?`<div class='prog-hint'>🔼 Ready to progress! Try ${prog.suggest} lb today</div>`:`<div style='font-size:13px;color:var(--mut);margin-bottom:10px'>Same weight — hit those reps first</div>`}`
      :'<div style="font-size:13px;color:var(--mut);margin-bottom:10px">First time — start conservative, leave 1–2 reps in the tank.</div>';
  }

  const swapOpen=S.active.swapMode===exIdx;
  // Use current session's equipment for exercise swaps
  const today=todayDow();
  const av=S.weekPlan?.availability||{};
  const todayAv=av[today]||{};
  const sessionEquipment=S.active.isLunch?(todayAv.lunchEquipment||'ymca'):(todayAv.eve?.equipment||'ymca');
  const selectedPreset=EQUIPMENT_PRESETS[sessionEquipment]||EQUIPMENT_PRESETS.ymca;
  const alts=swapOpen?EX.filter(e=>e.muscle===ex.muscle&&e.id!==ex.id&&!S.active.exercises.some(ae=>ae.id===e.id)&&!(S.cfg.hipCaution&&e.hipRisk)&&e.eq.some(q=>selectedPreset.equipment.includes(q))).slice(0,5):[];
  const swapPanel=swapOpen?`<div class='card2' style='margin-bottom:12px'>
    <div class='sec-lbl' style='margin-bottom:8px'>Swap to (same muscle):</div>
    ${alts.map(a=>`<button class='btn btn-g btn-sm' style='margin-bottom:6px;justify-content:flex-start;text-align:left' data-action='swap-ex' data-idx='${exIdx}' data-id='${a.id}'><span>${a.name}</span><span style='color:var(--mut);font-size:11px;margin-left:6px'>${a.type}</span></button>`).join('')}
    ${!alts.length?`<div style='font-size:13px;color:var(--mut)'>No alternatives found for this slot.</div>`:''}
    <button class='btn btn-g btn-sm' style='margin-top:4px' data-action='toggle-swap'>Cancel</button>
  </div>`:'';

  const repRange=isTimed?`${ex.rMin}–${ex.rMax}s`:`${ex.rMin}–${ex.rMax}`;
  const rowGrid=(isNoWeight||isTimed)?'grid-template-columns:36px 64px 1fr 42px':'';
  const setsRows=Array.from({length:ex.sets},(_,i)=>{
    const done=ex.done[i];
    const sugW=prog?prog.suggest:(done?.weight||'');
    const sugR=done?.reps||ex.rMax;
    return`<div class='set-row${done?' done':''}' id='sr-${exIdx}-${i}' style='${rowGrid}'>
      <div class='sn'>${i+1}</div>
      <div class='st'>${repRange}</div>
      ${(isNoWeight||isTimed)?'':`<input class='ni' type='number' id='w-${exIdx}-${i}' placeholder='lb' value='${done?done.weight:sugW||''}' min='0' step='5' inputmode='decimal' ${done?'disabled':''} data-warmup-src='${ex.isFirst&&i===0?exIdx:''}'>`}
      <input class='ni' type='number' id='r-${exIdx}-${i}' placeholder='${isTimed?'sec':'reps'}' value='${done?done.reps:sugR}' min='0' max='${isTimed?300:50}' inputmode='numeric' ${done?'disabled':''}>
      <button class='done-btn' id='db-${exIdx}-${i}' data-action='${done?'undo-set':'done-set'}' data-ex='${exIdx}' data-set='${i}'>${done?'↩':'→'}</button>
    </div>`;
  }).join('');

  const allDone=ex.done.filter(Boolean).length>=ex.sets;
  const isLast=exIdx===total-1;
  const condBlock=isLast&&S.cfg.conditioning&&allDone?finisherHTML(S.active.dow,false):'';
  const nextBtn=allDone
    ?`<button class='btn ${isLast?'btn-ok':'btn-p'}' id='next-btn-${exIdx}' data-action='${isLast?'finish-workout':'next-ex'}' style='margin-top:10px'>${isLast?'🏁 Finish Workout':'Next Exercise →'}</button>`
    :`<button class='btn btn-p' id='next-btn-${exIdx}' data-action='${isLast?'finish-workout':'next-ex'}' style='margin-top:10px;display:none'>${isLast?'🏁 Finish Workout':'Next Exercise →'}</button>`;

  const prevBtn=exIdx>0?`<button class='ex-nav-btn' data-action='prev-ex'>← Previous</button>`:'';

  return`<div class='view'>
    <div class='wkt-hdr'>
      <div>
        <div class='wkt-day'>${dayName}</div>
        <div class='wkt-prog'>Exercise ${exIdx+1} of ${total}</div>
      </div>
      <button class='abandon' style='width:auto;padding:8px 12px;border-radius:10px' data-action='abandon'>✕ Quit</button>
    </div>
    ${hipPrehabHTML}
    <div class='ex-card'>
      ${sessionTag}
      <div class='ex-name'>${ex.name}</div>
      <span class='m-tag' style='background:${mcolor}22;color:${mcolor}'>${MNAME[ex.muscle]||ex.muscle} · ${ex.type}</span>
      <div style='display:flex;gap:8px;align-items:center;margin-bottom:10px'>
        <button class='cue-btn' data-action='toggle-cue' data-id='cue-${exIdx}' style='margin-bottom:0'>💡 Technique tip</button>
        <button class='cue-btn' data-action='toggle-swap' style='margin-bottom:0;margin-left:auto;color:var(--mut)'>↕ Swap</button>
      </div>
      <div class='cue-txt' id='cue-${exIdx}'>${ex.cue||''}</div>
      ${swapPanel}
      ${warmupHTML}
      ${progHTML}
      <div class='sets-hdr' style='${rowGrid}'>
        <div class='sh'>Set</div><div class='sh'>Target</div>
        ${(isNoWeight||isTimed)?'':`<div class='sh'>Weight</div>`}<div class='sh'>${isTimed?'Sec':'Reps'}</div><div class='sh'></div>
      </div>
      ${setsRows}
      ${condBlock}
      ${nextBtn}
    </div>
    ${(exIdx<total-1)?`<div class='card2' style='margin-top:12px'>
      <div style='font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--mut);margin-bottom:8px;display:flex;align-items:center;gap:4px'>
        <svg width='12' height='12' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='9 18 15 12 9 6'/></svg>Next Up
      </div>
      <div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'>
        <span style='width:6px;height:6px;border-radius:50%;background:${MCOL[exercises[exIdx+1].muscle]||'var(--acc)'};flex-shrink:0;display:inline-block'></span>
        <strong style='font-size:14px'>${exercises[exIdx+1].name}</strong>
        <span style='font-size:11px;color:var(--mut);margin-left:auto'>${exercises[exIdx+1].sets} × ${exercises[exIdx+1].rMin}–${exercises[exIdx+1].rMax}</span>
      </div>
      <button class='cue-btn' data-action='toggle-cue' data-id='next-cue-${exIdx+1}' style='margin-bottom:6px'>💡 Preview technique tip</button>
      <div class='cue-txt' id='next-cue-${exIdx+1}' style='font-size:12px;margin-bottom:0'>${exercises[exIdx+1].cue||'No technique notes available.'}</div>
    </div>`:''}
    ${prevBtn?`<div class='ex-nav'>${prevBtn}</div>`:''}
    <div style='font-size:12px;color:var(--mut);text-align:center;margin-top:8px'>${S.active.restCap?S.active.restCap+'s rest between sets (lunch time-box)':smartRestLabel(ex)} · slow eccentric</div>
  </div>`;
}

// RENDER – REVIEW WORKOUT
// ─────────────────────────────────────────────
function renderReviewWorkout(){
  if(!S.reviewWorkout){S.view='dash';render();return;}

  const {day, sessionType} = S.reviewWorkout;
  const isEve = sessionType === 'eve' && day.eveningSession;
  const src = isEve ? day.eveningSession : day;
  const limit = isEve ? (EX_LIMIT[src.mins] || 5) : 3;
  let rawExs = src.exercises.slice(0, limit);

  // Show makeup exercises logic (same as startWorkout)
  if(!isEve){
    const missed = getMissedDays();
    if(missed.length > 0){
      const todayMuscles = new Set(rawExs.map(e => e.muscle));
      missed.forEach(missedDow => {
        const md = S.program.week[missedDow];
        if(!md || md.rest) return;
        const mu = md.exercises.find(e => !todayMuscles.has(e.muscle));
        if(mu){
          rawExs = [...rawExs, {...mu, sets: 2, isMakeup: true, makeupFrom: md.name}];
          todayMuscles.add(mu.muscle);
        }
      });
    }
  }

  const sessionLabel = isEve ? `${src.name} · ${src.mins} min` : `${src.name} · Lunch`;

  const exerciseCards = rawExs.map((ex, idx) => {
    const mcolor = MCOL[ex.muscle] || 'var(--acc)';
    const makeupBadge = ex.isMakeup ? `<span class='badge badge-makeup' style='margin-bottom:8px;display:inline-block'>⚡ Make-up · ${ex.makeupFrom}</span>` : '';

    return `<div class='ex-card' style='position:relative'>
      ${makeupBadge}
      <div style='display:flex;align-items:center;justify-content:space-between;margin-bottom:8px'>
        <div class='m-tag' style='background:${mcolor}22;color:${mcolor};border:1px solid ${mcolor}44'>${MNAME[ex.muscle]}</div>
        <button class='btn btn-g btn-sm' data-action='swap-exercise' data-idx='${idx}' style='font-size:11px;padding:6px 10px'>⟲ Swap</button>
      </div>
      <div class='ex-name'>${ex.name}</div>
      <div style='font-size:13px;color:var(--mut);margin-bottom:8px'>${ex.sets} sets × ${ex.rMin}–${ex.rMax} reps</div>
      <button class='cue-btn' data-action='toggle-cue' data-id='review-cue-${idx}'>💡 Technique tip</button>
      <div class='cue-txt' id='review-cue-${idx}'>${ex.cue || 'No technique notes available.'}</div>
    </div>`;
  }).join('');

  return `<div class='view'>
    <button class='s-back' data-action='back-to-dash' style='margin-bottom:20px;margin-top:0'>
      <svg width='20' height='20' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='15 18 9 12 15 6'/></svg> Back

function renderProgram(){
  const dow=todayDow();
  const cardio=calcWeekCardio();
  const missed=getMissedDays();
  const cardioBlurb=cardio&&cardio.calsPerDay>0
    ?cardio.options.slice(0,3).map(o=>`${o.icon} ${o.name}: ${o.min} min${o.dist&&o.dist!=='—'?' · '+o.dist:''}`).join(' · ')
    :'';

  const exRow=e=>`<div class='pg-ex'><div class='pg-dot' style='background:${MCOL[e.muscle]}'></div>${e.name} <span style='color:var(--mut);font-size:12px'>· ${e.sets}×${e.rMin}–${e.rMax}</span></div>`;

  const days=S.program.week.map(d=>{
    const isToday=d.dow===dow;
    const isSkipped=!d.rest&&isDaySkipped(d.dow);
    const isMissed=!d.rest&&!isSkipped&&missed.includes(d.dow);
    if(d.rest||isSkipped){
      if(d.dow===0||d.dow===6)return''; // skip weekend rest rows
      let cn='';
      if(cardio&&cardio.calsPerDay>0&&!isSkipped){
        cn=`<div style='margin-top:8px;padding-top:8px;border-top:1px solid var(--bdr)'>
          <div style='font-size:11px;color:var(--warn);font-weight:700;margin-bottom:4px'>+ Daily Cardio · ${cardio.calsPerDay} cal</div>
          <div style='font-size:11px;color:var(--mut)'>${cardioBlurb}</div>
        </div>`;
      }
      return`<div class='pg-day${isToday?' today-day':''}${isSkipped?' pg-skip':''}'>
        <div class='pg-dh'><div class='pg-dn' style='color:var(--mut)'>${DOW[d.dow]}</div><span style='font-size:12px;color:var(--mut)'>${isSkipped?'Skipped this week':'Rest'}${!isSkipped&&cardio&&cardio.calsPerDay>0?' + Cardio':''}</span></div>
        ${cn}
      </div>`;
    }
    const badge=d.isLunch?`<span class='badge badge-lunch'>YMCA · 35–40 min</span>`:`<span class='badge badge-eve'>${d.sessionMins||60} min</span>`;
    const missedTag=isMissed?`<span style='font-size:11px;color:var(--bad);font-weight:700;margin-left:6px'>⚠️ missed</span>`:'';
    const exList=d.exercises.map(exRow).join('');
    let eveBlock='';
    if(d.eveningSession){
      const eveList=d.eveningSession.exercises.map(exRow).join('');
      eveBlock=`<div style='margin-top:12px;padding-top:12px;border-top:1px solid var(--bdr)'>
        <div style='font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--acc);margin-bottom:6px'>After Work · ${d.eveningSession.name} · ${d.eveningSession.mins} min</div>
        ${eveList}
      </div>`;
    }
    let cn='';
    if(cardio&&cardio.calsPerDay>0){
      cn=`<div style='margin-top:8px;padding-top:8px;border-top:1px solid var(--bdr)'>
        <div style='font-size:11px;color:var(--warn);font-weight:700;margin-bottom:4px'>+ Daily Cardio · ${cardio.calsPerDay} cal</div>
        <div style='font-size:11px;color:var(--mut)'>${cardioBlurb}</div>
      </div>`;
    }
    return`<div class='pg-day${isToday?' today-day':''}${isMissed?' pg-missed':''}'>
      <div class='pg-dh'>
        <div><div class='pg-dn' style='display:flex;align-items:center;gap:4px;flex-wrap:wrap'>${d.name}${missedTag} ${badge}</div><div class='pg-dd'>${DOW[d.dow]}</div></div>
        ${isToday?`<span style='font-size:11px;font-weight:700;color:var(--acc);background:var(--acc2);padding:3px 8px;border-radius:20px'>TODAY</span>`:''}
      </div>
      <div>${exList}</div>
      ${eveBlock}
      ${cn}
    </div>`;
  }).join('');

  const calSummary=cardio?`<div class='card' style='margin-bottom:16px'>
    <div class='sec-lbl'>Calorie Plan</div>
    ${cardio.cardioCalsNeeded<=0
      ?`<div class='prog-hint'>✅ Strength covers your goal</div>`
      :`<div style='font-size:13px;color:var(--mut)'>Strength ~${cardio.strengthCals} cal · Need ${cardio.cardioCalsNeeded} more from cardio · ${cardio.calsPerDay} cal/day · ${cardio.daysLeft} days left</div>`}
  </div>`:'';

  return`<div class='view'>
    <div class='hdg'>Weekly Program</div>
    <div class='sub'>Every movement for the week. Combo days show both the lunch and after-work sessions. Skipped days show as rest. Missed days shown in red. Set your goal and plan from the Home tab.</div>
    ${calSummary}

// ─────────────────────────────────────────────
// CUSTOM WORKOUT HELPERS
// ─────────────────────────────────────────────
function updateCustomExercise(idx, field, value) {
  if (!S.customWorkoutLog || !S.customWorkoutLog.exercises[idx]) return;
  S.customWorkoutLog.exercises[idx][field] = value;
  // Don't save yet, just update state
}

// Find an exact database (or custom) exercise match for a typed name.
function exMatch(name) {
  if (!name || !name.trim()) return null;
  const allEx = [...EX, ...(S.customExercises||[])];
  return allEx.find(e => e.name.toLowerCase() === name.toLowerCase().trim()) || null;
}

// Common abbreviations / synonyms expanded so "BB Bench" → "barbell bench" etc.
const EX_ABBR = {
  bb:'barbell', db:'dumbbell', kb:'kettlebell', ohp:'overhead press',
  rdl:'romanian deadlift', sldl:'romanian deadlift', bw:'bodyweight',
  ext:'extension', lat:'lateral', pull:'pullup', chin:'chinup',
  sa:'single arm', sl:'single leg'
};

// Normalize an exercise name into a list of comparable tokens.
function exTokens(s) {
  if (!s) return [];
  let t = s.toLowerCase().trim().replace(/[^a-z0-9\s]/g, ' ');
  let tokens = t.split(/\s+/).filter(Boolean).map(w => EX_ABBR[w] || w);
  tokens = tokens.join(' ').split(/\s+/).filter(Boolean);
  // crude singularize so "curls"/"squats"/"press" compare consistently
  tokens = tokens.map(w => (w.length > 3 && w.endsWith('s')) ? w.slice(0, -1) : w);
  return tokens;
}

// Fuzzy-match a typed name to the closest database exercise. Returns the best
// candidate only when it's a clear winner, to avoid linking ambiguous names.
function fuzzyMatchEx(name) {
  const inputTokens = exTokens(name);
  if (!inputTokens.length) return null;
  const inputSet = new Set(inputTokens);
  const allEx = [...EX, ...(S.customExercises||[])];
  const scored = [];
  allEx.forEach(e => {
    const exSet = new Set(exTokens(e.name));
    let overlap = 0;
    inputSet.forEach(tk => { if (exSet.has(tk)) overlap++; });
    if (!overlap) return;
    const dice = (2 * overlap) / (inputSet.size + exSet.size);
    const coverage = overlap / inputSet.size; // how much of what they typed is covered
    if (coverage >= 0.6) scored.push({ e, score: dice });
  });
  if (!scored.length) return null;
  scored.sort((a, b) => b.score - a.score);
  const top = scored[0];
  const second = scored[1];
  // Require a decent score and a clear winner (not a near-tie / ambiguous)
  if (top.score >= 0.5 && (!second || top.score - second.score >= 0.15)) return top.e;
  return null;
}

// Resolve a typed name to a database exercise: exact first, then fuzzy.
function resolveEx(name) {
  const exact = exMatch(name);
  if (exact) return { match: exact, exact: true };
  const fuzzy = fuzzyMatchEx(name);
  if (fuzzy) return { match: fuzzy, exact: false };
  return { match: null, exact: false };
}

// Identify the muscle group for an exercise name: matched exercise first,
// then keyword-based estimation as a fallback.
function detectMuscle(name) {
  if (!name || !name.trim()) return 'legs';
  const { match } = resolveEx(name);
  if (match) return match.muscle;
  return estimateMuscleGroup(name);
}

// Read-only line showing the auto-detected muscle group for the typed exercise.
function muscleDispHtml(name) {
  if (!name || !name.trim()) return `<span style="color:var(--mut)">Muscle group auto-detects from the exercise</span>`;
  const m = detectMuscle(name);
  const color = MCOL[m] || 'var(--acc)';
  return `<span style="color:var(--mut)">Targets <strong style="color:${color}">${MNAME[m]||m}</strong> · auto-detected</span>`;
}

// Message shown under the name field: confirms whether this entry is linked to a
// known exercise (so its weights feed the 4% progression history) or is brand new.
function matchInfoHtml(name) {
  const { match, exact } = resolveEx(name);
  if (match && exact) return `<span style="color:var(--ok)">✓ Linked to <strong>${match.name}</strong> — weights feed your 4% progression</span>`;
  if (match) return `<span style="color:var(--ok)">✓ Matched to <strong>${match.name}</strong> — weights feed your 4% progression</span>`;
  if (name && name.trim()) return `<span style="color:var(--mut)">New exercise — tracked on its own</span>`;
  return '';
}

// Live handler as the user types an exercise name — keeps the muscle dropdown in
// sync (unless they've manually overridden it) without re-rendering / losing focus.
function onCustomNameInput(idx, value) {
  if (!S.customWorkoutLog || !S.customWorkoutLog.exercises[idx]) return;
  const ex = S.customWorkoutLog.exercises[idx];
  ex.name = value;
  ex.muscle = detectMuscle(value); // always auto-detect from the exercise
  // Live-update the muscle-group line and the database-link indicator
  const dEl = document.getElementById('cust-musc-disp-' + idx);
  if (dEl) dEl.innerHTML = muscleDispHtml(value);
  const mEl = document.getElementById('cust-match-' + idx);
  if (mEl) mEl.innerHTML = matchInfoHtml(value);
  // Refresh the suggestions dropdown
  renderExSuggest(idx, value);
}

// Build the ranked list of exercise suggestions for what the user has typed.
function exSuggestList(value) {
  const all = [...EX, ...(S.customExercises||[])];
  const q = (value || '').toLowerCase().trim();
  if (!q) return all.slice(0, 8); // show a starter list when empty
  const qTokens = exTokens(value);
  const scored = all.map(e => {
    const name = e.name.toLowerCase();
    const exT = new Set(exTokens(e.name));
    let score = 0;
    if (name.includes(q)) score += 2;
    if (name.startsWith(q)) score += 1;
    qTokens.forEach(t => { if (exT.has(t)) score += 1; });
    return { e, score };
  }).filter(x => x.score > 0);
  scored.sort((a, b) => b.score - a.score);
  return scored.slice(0, 8).map(x => x.e);
}

// Render the dropdown of exercise suggestions under a row's name field.
function renderExSuggest(idx, value) {
  const box = document.getElementById('ex-suggest-' + idx);
  if (!box) return;
  const list = exSuggestList(value);
  if (!list.length) { box.classList.remove('on'); box.innerHTML = ''; return; }
  box.innerHTML = list.map(e =>
    `<div class='ex-suggest-item' data-name="${e.name.replace(/"/g,'&quot;')}" onpointerdown='pickExSuggest(${idx}, this.dataset.name)'>
       <span>${e.name}</span><span class='es-mus'>${MNAME[e.muscle]||''}</span>
     </div>`
  ).join('');
  box.classList.add('on');
}

function estimateMuscleGroup(exerciseName) {
  const name = exerciseName.toLowerCase();

  // Chest keywords
  if (name.includes('push') || name.includes('bench') || name.includes('chest') || name.includes('fly')) {
    return 'chest';
  }
  // Back keywords
  if (name.includes('pull') || name.includes('row') || name.includes('lat') || name.includes('back')) {
    return 'back';
  }
  // Shoulders
  if (name.includes('shoulder') || name.includes('press') || name.includes('raise') || name.includes('overhead')) {
    return 'shoulders';
  }
  // Legs
  if (name.includes('squat') || name.includes('lunge') || name.includes('leg') || name.includes('quad') || name.includes('glute')) {
    return 'legs';
  }
  // Arms
  if (name.includes('curl') || name.includes('bicep')) {
    return 'biceps';
  }
  if (name.includes('tricep') || name.includes('dip') || name.includes('extension')) {
    return 'triceps';
  }
  // Core/full body
  if (name.includes('burpee') || name.includes('plank') || name.includes('core') || name.includes('run')) {
    return 'core';
  }

  // Default to legs for compound movements
  return 'legs';
}

function adaptWeekForCustomWorkout(customLog, customDow) {
  if (!S.program || !S.program.week || !S.weekPlan?.availability) return;

  // Calculate muscle group volumes from custom workout
  const customVolumes = {};
  customLog.exercises.forEach(ex => {
    const muscle = ex.muscle;
    const sets = ex.sets?.filter(s => s && s.reps > 0).length || 0;
    customVolumes[muscle] = (customVolumes[muscle] || 0) + sets;
  });

  // Store all existing custom workouts to preserve them
  const existingCustomWorkouts = {};
  S.program.week.forEach((day, dow) => {
    if (day && day.customWorkout && day.customLog) {
      existingCustomWorkouts[dow] = {
        customWorkout: true,
        customLog: day.customLog,
        name: day.name,
        desc: day.desc
      };
    }
  });

  // Update recent workouts to include ALL custom workout muscles for better adaptation
  const allCustomMuscles = new Set();
  Object.values(existingCustomWorkouts).forEach(cw => {
    cw.customLog.exercises.forEach(ex => allCustomMuscles.add(ex.muscle));
  });
  Object.keys(customVolumes).forEach(muscle => allCustomMuscles.add(muscle));

  const customMuscleList = Array.from(allCustomMuscles).map(m => MNAME[m]).join(', ');
  S.weekPlan.recentWorkouts = `Custom workouts this week: ${customMuscleList}`;

  // Completely regenerate the week program to adapt around ALL custom workouts
  S.program = genProgram(S.cfg, S.weekPlan.availability);

  // Restore ALL custom workout days (including the new one)
  existingCustomWorkouts[customDow] = {
    customWorkout: true,
    customLog: customLog,
    name: 'Custom Workout',
    desc: `${customLog.exercises.length} exercises logged`
  };

  // Apply all custom workouts back to the regenerated program
  Object.entries(existingCustomWorkouts).forEach(([dow, customData]) => {
    const dayIndex = parseInt(dow);
    if (S.program.week[dayIndex]) {
      S.program.week[dayIndex] = {
        ...S.program.week[dayIndex],
        ...customData
      };
    }
  });
}

function planCustomWorkout(customLog, customDow) {
  if (!S.program || !S.program.week || !S.weekPlan?.availability) return;

  // Store all existing custom workouts and planned workouts to preserve them
  const existingWorkouts = {};
  S.program.week.forEach((day, dow) => {
    if (day && day.customWorkout && day.customLog) {
      existingWorkouts[dow] = {
        customWorkout: true,
        customLog: day.customLog,
        name: day.name,
        desc: day.desc
      };
    } else if (day && day.plannedCustomWorkout && day.plannedCustomLog) {
      existingWorkouts[dow] = {
        plannedCustomWorkout: true,
        plannedCustomLog: day.plannedCustomLog,
        name: day.name,
        desc: day.desc
      };
    }
  });

  // Add the new planned workout
  existingWorkouts[customDow] = {
    plannedCustomWorkout: true,
    plannedCustomLog: customLog,
    name: 'Planned Custom Workout',
    desc: `${customLog.exercises.length} exercises planned`
  };

  // Update recent workouts to include ALL custom/planned workout muscles for better adaptation
  const allCustomMuscles = new Set();
  Object.values(existingWorkouts).forEach(cw => {
    const log = cw.customLog || cw.plannedCustomLog;
    if (log) {
      log.exercises.forEach(ex => allCustomMuscles.add(ex.muscle));
    }
  });

  const customMuscleList = Array.from(allCustomMuscles).map(m => MNAME[m]).join(', ');
  S.weekPlan.recentWorkouts = `Custom/planned workouts this week: ${customMuscleList}`;

  // Completely regenerate the week program to adapt around ALL custom workouts
  S.program = genProgram(S.cfg, S.weekPlan.availability);

  // Apply all custom/planned workouts back to the regenerated program
  Object.entries(existingWorkouts).forEach(([dow, workoutData]) => {
    const dayIndex = parseInt(dow);
    if (S.program.week[dayIndex]) {
      S.program.week[dayIndex] = {
        ...S.program.week[dayIndex],
        ...workoutData
      };
    }
  });
}

function rebalanceCustomWorkouts() {
  if (!S.program || !S.program.week || !S.weekPlan?.availability) return;

  // Collect all remaining custom and planned workouts to preserve them
  const existingWorkouts = {};
  S.program.week.forEach((day, dow) => {
    if (day && day.customWorkout && day.customLog) {
      existingWorkouts[dow] = {
        customWorkout: true,
        customLog: day.customLog,
        name: day.name,
        desc: day.desc
      };
    } else if (day && day.plannedCustomWorkout && day.plannedCustomLog) {
      existingWorkouts[dow] = {
        plannedCustomWorkout: true,
        plannedCustomLog: day.plannedCustomLog,
        name: day.name,
        desc: day.desc
      };
    }
  });

  // Rebuild recentWorkouts note from remaining workouts
  const allCustomMuscles = new Set();
  Object.values(existingWorkouts).forEach(cw => {
    const log = cw.customLog || cw.plannedCustomLog;
    if (log) log.exercises.forEach(ex => allCustomMuscles.add(ex.muscle));
  });
  if (allCustomMuscles.size > 0) {
    const customMuscleList = Array.from(allCustomMuscles).map(m => MNAME[m]).join(', ');
    S.weekPlan.recentWorkouts = `Custom/planned workouts this week: ${customMuscleList}`;
  } else {
    S.weekPlan.recentWorkouts = '';
  }

  // Regenerate the week and re-apply remaining custom/planned workouts
  S.program = genProgram(S.cfg, S.weekPlan.availability);
  Object.entries(existingWorkouts).forEach(([dow, workoutData]) => {
    const dayIndex = parseInt(dow);
    if (S.program.week[dayIndex]) {
      S.program.week[dayIndex] = {
        ...S.program.week[dayIndex],
        ...workoutData
      };
    }
  });
}

document.addEventListener('click',e=>{
  const btn=e.target.closest('[data-action]');if(!btn)return;
  const a=btn.dataset.action;

  if(a==='nav'){
    const v=btn.dataset.view;
    if(v==='workout'){S.active?S.view='workout':S.view='dash';}
    else S.view=v;
    S.viewDay=null;
    render();return;
  }
  if(a==='setup-next'){S.step=Math.min(3,S.step+1);render();return;}
  if(a==='setup-back'){S.step=Math.max(1,S.step-1);render();return;}
  if(a==='set-days'){S.cfg.days=parseInt(btn.dataset.val);render();return;}
  if(a==='set-goal'){S.cfg.goal=btn.dataset.val;render();return;}
  if(a==='toggle-conditioning'){S.cfg.conditioning=!S.cfg.conditioning;save();render();return;}
  if(a==='generate'){
    const bwEl=document.getElementById('bw-input');
    const recentEl=document.getElementById('setup-recent-workouts');
    if(bwEl){const v=parseInt(bwEl.value);if(v>=80&&v<=400)S.cfg.bodyLbs=v;}
    if(!S.weekPlan)S.weekPlan={weekOf:todayStr(),availability:defaultAvailability(),calGoal:null};
    S.weekPlan.weekOf=todayStr();
    if(recentEl)S.weekPlan.recentWorkouts=recentEl.value||'';
    S.program=genProgram(S.cfg,S.weekPlan.availability);
    delete S.cfg.planStartDow; // clear so next week starts fresh
    S.view='dash';save();render();return;
  }
  if(a==='go-cloud-setup'){S.view='cloud';render();return;}
  if(a==='send-sign-in-link'){
    if(!fbReady||!fbAuth){alert('Firebase not ready — check your config.');return;}
    const emailEl=document.getElementById('signin-email');
    const email=emailEl?.value?.trim();
    if(!email){emailEl?.classList.add('shake');setTimeout(()=>emailEl?.classList.remove('shake'),400);return;}
    btn.textContent='Sending…';btn.disabled=true;
    fbAuth.sendSignInLinkToEmail(email,{url:location.href,handleCodeInApp:true})
      .then(()=>{localStorage.setItem('emailForSignIn',email);alert('Link sent to '+email+'! Check your inbox and tap the link to sign in.');btn.textContent='Send Link';btn.disabled=false;})
      .catch(e=>{alert('Error: '+e.message);btn.textContent='Send Link';btn.disabled=false;});
    return;
  }
  if(a==='cloud-sign-out'){
    if(fbAuth)fbAuth.signOut().then(()=>{fbUser=null;render();});
    return;
  }
  if(a==='save-fb-config'){
    const raw=document.getElementById('fb-config-input')?.value?.trim();
    try{
      const cfg=JSON.parse(raw);
      if(!cfg.apiKey||!cfg.projectId)throw new Error('Missing apiKey or projectId');
      localStorage.setItem('fbConfig',JSON.stringify(cfg));
      initFirebase(cfg).then(()=>{S.view='dash';render();});
    }catch(e){alert('Invalid config JSON: '+e.message);}
    return;
  }
  if(a==='save-anthropic-key'){
    const k=document.getElementById('anthropic-key-input')?.value?.trim();
    if(k)localStorage.setItem('anthropicKey',k);
    else localStorage.removeItem('anthropicKey');
    alert(k?'API key saved.':'API key removed.');
    return;
  }
  if(a==='clear-fb-config'){
    localStorage.removeItem('fbConfig');
    fbReady=false;fbUser=null;fbAuth=null;fbDb=null;
    if(fbAuth)fbAuth.signOut().catch(()=>{});
    S.view='dash';render();return;
  }
  if(a==='go-plan'){S.view='plan';render();return;}
  if(a==='plan-back'){S.view='dash';render();return;}
  if(a==='toggle-avail-lunch'){
    const dv=parseInt(btn.dataset.dow);ensureAv(dv);
    S.weekPlan.availability[dv].lunch=!S.weekPlan.availability[dv].lunch;
    save();render();return;
  }
  if(a==='toggle-avail-eve'){
    const dv=parseInt(btn.dataset.dow);ensureAv(dv);
    S.weekPlan.availability[dv].eve.on=!S.weekPlan.availability[dv].eve.on;
    save();render();return;
  }
  if(a==='set-avail-eve-mins'){
    const dv=parseInt(btn.dataset.dow);ensureAv(dv);
    S.weekPlan.availability[dv].eve.mins=parseInt(btn.dataset.val);
    save();render();return;
  }
  if(a==='set-avail-eve-loc'){
    const dv=parseInt(btn.dataset.dow);ensureAv(dv);
    S.weekPlan.availability[dv].eve.loc=btn.dataset.val;
    save();render();return;
  }
  if(a==='set-lunch-equipment'){
    const dv=parseInt(btn.dataset.dow);ensureAv(dv);
    S.weekPlan.availability[dv].lunchEquipment=btn.dataset.val;
    save();render();return;
  }
  if(a==='set-eve-equipment'){
    const dv=parseInt(btn.dataset.dow);ensureAv(dv);
    S.weekPlan.availability[dv].eve.equipment=btn.dataset.val;
    save();render();return;
  }
  if(a==='set-avail-weekend-loc'){
    const dv=parseInt(btn.dataset.dow);ensureAv(dv);
    S.weekPlan.availability[dv].loc=btn.dataset.val;
    save();render();return;
  }
  if(a==='toggle-avail-weekend'){
    const dv=parseInt(btn.dataset.dow);ensureAv(dv);
    S.weekPlan.availability[dv].on=!S.weekPlan.availability[dv].on;
    save();render();return;
  }
  if(a==='set-avail-weekend-mins'){
    const dv=parseInt(btn.dataset.dow);ensureAv(dv);
    S.weekPlan.availability[dv].mins=parseInt(btn.dataset.val);
    save();render();return;
  }
  if(a==='set-weekend-equipment'){
    const dv=parseInt(btn.dataset.dow);ensureAv(dv);
    S.weekPlan.availability[dv].equipment=btn.dataset.val;
    save();render();return;
  }
  if(a==='save-plan'){
    const calEl=document.getElementById('plan-cal');
    const startEl=document.getElementById('plan-start');
    const endEl=document.getElementById('plan-end');
    const recentEl=document.getElementById('recent-workouts');
    const cals=parseInt(calEl?.value)||0;
    const startDate=startEl?.value||todayStr();
    const endDate=endEl?.value||nextSunday();
    const recentWorkouts=recentEl?.value||'';
    if(!S.weekPlan)S.weekPlan={weekOf:todayStr(),availability:defaultAvailability()};
    S.weekPlan.weekOf=todayStr();
    S.weekPlan.calGoal=cals>0?{cals,startDate,endDate}:null;
    S.weekPlan.recentWorkouts=recentWorkouts;
    // Keep existing cardio style if not set
    if(!S.weekPlan.cardioStyle) S.weekPlan.cardioStyle='separate';
    // Regenerate program with new availability and cardio style consideration
    S.program=genProgram(S.cfg,S.weekPlan.availability);
    save();S.view='dash';render();return;
  }
  if(a==='clear-plan-goal'){
    if(S.weekPlan)S.weekPlan.calGoal=null;
    save();render();return;
  }
  if(a==='reset-program'){
    if(!confirm('Reset and reconfigure from today through Sunday?'))return;
    const todayDOW = todayDow();
    const calGoal = S.weekPlan?.calGoal || null; // calorie goal survives a reset

    // Monday → full reset: re-plan the whole week
    if(todayDOW === 1) {
      S.program=null;S.active=null;
      S.weekPlan={weekOf:todayStr(),availability:defaultAvailability(),calGoal};
      delete S.cfg.planStartDow;
      S.view='setup';S.step=1;save();render();return;
    }

    // Mid-week: only re-plan today through Sunday, keep past days untouched.
    // planStartDow marks where the new plan begins (0 = Sunday only).
    S.cfg.planStartDow = todayDOW;
    if(S.program && S.program.week){
      S.program.week = S.program.week.map((day, dow) => {
        // Sunday is the last day of the Mon-based week: on Sunday keep Mon-Sat
        const isPast = todayDOW===0 ? dow>0 : (dow>0 && dow<todayDOW);
        if(isPast) return day;
        return {dow, rest: true};
      });
    }

    // Drop past days from availability so the new plan only covers remaining days
    if(S.weekPlan?.availability){
      const av=S.weekPlan.availability;
      [1,2,3,4,5].forEach(dw=>{
        const isPast = todayDOW===0 || dw<todayDOW;
        if(isPast && av[dw]){av[dw].lunch=false;if(av[dw].eve)av[dw].eve.on=false;}
      });
      if(todayDOW===0 && av[6]) av[6].on=false;
    }

    // Clear any active workout
    S.active = null;

    // Go to setup to reconfigure from today forward
    S.view='setup';S.step=1;save();render();return;
  }
  if(a==='start-workout'){
    const d=todayDay();if(d&&!d.rest){
      // Show review screen instead of starting directly
      S.reviewWorkout = {
        day: d,
        sessionType: btn.dataset.session || 'lunch'
      };
      S.view = 'review-workout';
      render();
    }
    return;
  }
  if(a==='confirm-start-workout'){
    const d=S.reviewWorkout?.day;
    const sessionType=S.reviewWorkout?.sessionType;
    if(d&&!d.rest){
      startWorkout(d,sessionType);
    }
    return;
  }
  if(a==='back-to-dash'){
    S.reviewWorkout=null;S.view='dash';render();return;
  }
  if(a==='swap-exercise'){
    const idx=parseInt(btn.dataset.idx);
    if(!S.reviewWorkout)return;

    // Get current exercise to replace
    const {day, sessionType} = S.reviewWorkout;
    const isEve = sessionType === 'eve' && day.eveningSession;
    const src = isEve ? day.eveningSession : day;
    const currentEx = src.exercises[idx];

    // Find alternative exercises for the same muscle group and type
    const alternatives = EX.filter(e =>
      e.muscle === currentEx.muscle &&
      e.type === currentEx.type &&
      e.id !== currentEx.id &&
      e.eq.some(eq => src.exercises.some(srcEx => srcEx.eq?.includes(eq))) // Has compatible equipment
    ).slice(0, 5); // Limit to 5 alternatives

    if(alternatives.length === 0){
      alert('No alternative exercises available for this muscle group and type.');
      return;
    }

    // Show selection modal (simple confirm for now, can be enhanced later)
    const altNames = alternatives.map((e, i) => `${i+1}. ${e.name}`).join('\n');
    const choice = prompt(`Choose replacement for ${currentEx.name}:\n\n${altNames}\n\nEnter number (1-${alternatives.length}):`);
    const choiceIdx = parseInt(choice) - 1;

    if(choiceIdx >= 0 && choiceIdx < alternatives.length){
      // Replace the exercise
      src.exercises[idx] = {...alternatives[choiceIdx], sets: currentEx.sets};
      render();
    }
    return;
  }
  if(a==='add-custom-exercise'){
    // Create custom exercise form
    const name = prompt('Exercise name:');
    if(!name) return;

    const muscles = ['chest', 'back', 'shoulders', 'biceps', 'triceps', 'legs', 'core', 'hips'];
    const muscleChoice = prompt(`Muscle group:\n${muscles.map((m,i) => `${i+1}. ${MNAME[m]}`).join('\n')}\n\nEnter number (1-${muscles.length}):`);
    const muscleIdx = parseInt(muscleChoice) - 1;
    if(muscleIdx < 0 || muscleIdx >= muscles.length) return;

    const types = ['compound', 'isolation'];
    const typeChoice = prompt(`Exercise type:\n1. Compound (multi-joint)\n2. Isolation (single-joint)\n\nEnter number (1-2):`);
    const typeIdx = parseInt(typeChoice) - 1;
    if(typeIdx < 0 || typeIdx >= types.length) return;

    const equipment = ['barbell', 'dumbbells', 'cables', 'machine', 'bodyweight', 'pullup_bar'];
    const equipChoice = prompt(`Equipment needed:\n${equipment.map((e,i) => `${i+1}. ${e}`).join('\n')}\n\nEnter number (1-${equipment.length}):`);
    const equipIdx = parseInt(equipChoice) - 1;
    if(equipIdx < 0 || equipIdx >= equipment.length) return;

    const rMin = parseInt(prompt('Minimum reps (e.g., 6):')) || 6;
    const rMax = parseInt(prompt('Maximum reps (e.g., 12):')) || 12;
    const rest = parseInt(prompt('Rest time in seconds (e.g., 120):')) || 120;
    const cue = prompt('Technique tip (optional):') || '';

    const customEx = {
      id: `custom_${Date.now()}`,
      name: name,
      muscle: muscles[muscleIdx],
      type: types[typeIdx],
      eq: [equipment[equipIdx]],
      rMin: rMin,
      rMax: rMax,
      rest: rest,
      cue: cue,
      custom: true
    };

    S.customExercises = S.customExercises || [];
    S.customExercises.push(customEx);
    save();render();
    return;
  }
  if(a==='delete-custom-exercise'){
    const idx = parseInt(btn.dataset.idx);
    if(confirm('Delete this custom exercise?')){
      S.customExercises.splice(idx, 1);
      save();render();
    }
    return;
  }
  if(a==='set-cardio-style'){
    if(!S.weekPlan)S.weekPlan={weekOf:todayStr(),availability:defaultAvailability(),calGoal:null};
    S.weekPlan.cardioStyle=btn.dataset.val;
    render();return;
  }
  if(a==='log-custom-workout'){
    const dow = parseInt(btn.dataset.dow);
    S.customWorkoutLog = {
      dow: dow,
      exercises: [],
      isPlanning: false
    };
    S.view = 'custom-workout-log';
    render();return;
  }
  if(a==='plan-custom-workout'){
    const dow = parseInt(btn.dataset.dow);
    S.customWorkoutLog = {
      dow: dow,
      exercises: [],
      isPlanning: true
    };
    S.view = 'custom-workout-log';
    render();return;
  }
  if(a==='cancel-planned-workout'){
    const dow = parseInt(btn.dataset.dow);
    if(confirm('Cancel this planned workout? Your week will be regenerated.')) {
      cancelPlannedWorkout(dow);
    }
    return;
  }
  if(a==='cancel-custom-workout'){
    S.customWorkoutLog = null;
    S.view = 'dash';
    render();return;
  }
  if(a==='add-custom-exercise-row'){
    addCustomExerciseRow();
    return;
  }
  if(a==='load-murph-template'){
    loadWorkoutTemplate('murph');
    return;
  }
  if(a==='load-bodyweight-template'){
    loadWorkoutTemplate('bodyweight');
    return;
  }
  if(a==='load-strength-template'){
    loadWorkoutTemplate('strength');
    return;
  }
  if(a==='save-custom-workout'){
    if(!S.customWorkoutLog || !S.customWorkoutLog.exercises.length) {
      alert('Please add at least one exercise');
      return;
    }

    // Create a workout entry
    const customData = {
      id: Date.now().toString(),
      date: new Date().toISOString(),
      dayName: S.customWorkoutLog.isPlanning ? 'Planned Custom Workout' : 'Custom Workout',
      isCustom: true,
      isPlanned: S.customWorkoutLog.isPlanning,
      duration: 60, // default estimate
      exercises: S.customWorkoutLog.exercises.map(ex => {
        // Link to a known exercise when the name matches (exact or fuzzy), so the
        // logged weights feed the same 4% progression history as regular workouts;
        // otherwise create a stable slug id tracked on its own.
        const { match } = resolveEx(ex.name);
        return {
          id: match ? match.id : (ex.name||'').toLowerCase().replace(/[^a-z0-9]/g, '_'),
          name: match ? match.name : ex.name,
          muscle: ex.muscle || (match ? match.muscle : estimateMuscleGroup(ex.name)),
          sets: [{weight: ex.weight, reps: ex.reps}].concat(
            Array(ex.sets - 1).fill().map(() => ({weight: ex.weight, reps: ex.reps}))
          )
        };
      })
    };

    if(S.customWorkoutLog.isPlanning) {
      // PLANNING: Don't add to logs, mark as planned
      if(S.program && S.program.week[S.customWorkoutLog.dow]) {
        S.program.week[S.customWorkoutLog.dow].plannedCustomWorkout = true;
        S.program.week[S.customWorkoutLog.dow].plannedCustomLog = customData;
      }

      // Immediately regenerate entire week to adapt around planned workout
      planCustomWorkout(customData, S.customWorkoutLog.dow);
    } else {
      // LOGGING: Add to logs, mark as completed
      S.logs.push(customData);

      if(S.program && S.program.week[S.customWorkoutLog.dow]) {
        const day = S.program.week[S.customWorkoutLog.dow];
        day.customWorkout = true;
        day.customLog = customData;
        // If this day was previously planned, clear the planned markers so its
        // sets aren't counted twice in MRV / budgeting.
        delete day.plannedCustomWorkout;
        delete day.plannedCustomLog;
      }

      // Refresh last-used weights so the 4% progression picks up these entries
      recalcLastWeights();

      // Regenerate rest of week to adapt
      adaptWeekForCustomWorkout(customData, S.customWorkoutLog.dow);
    }

    S.customWorkoutLog = null;
    S.view = 'dash';
    save();
    render();
    return;
  }
  if(a==='view-day'){
    const dv=parseInt(btn.dataset.dow);
    S.viewDay=(S.viewDay===dv)?null:dv;
    S.viewExDetail=null;
    render();return;
  }
  if(a==='view-ex-detail'){
    if(e.target.tagName==='INPUT')return;
    const id=btn.dataset.exid;
    S.viewExDetail=(S.viewExDetail===id)?null:id;
    render();return;
  }
  if(a==='save-ex-weight'){
    const id=btn.dataset.exid;
    const w=parseFloat(document.getElementById(`ew-${id}`)?.value)||0;
    const r=parseInt(document.getElementById(`er-${id}`)?.value)||0;
    if(w>0&&r>0){S.lastWeights[id]={weight:w,reps:r};S.viewExDetail=null;save();render();}
    return;
  }
  if(a==='done-set'){
    completeSet(parseInt(btn.dataset.ex),parseInt(btn.dataset.set));return;
  }
  if(a==='next-ex'){
    const next=S.active.exIdx+1;
    if(next<S.active.exercises.length)goToEx(next);
    return;
  }
  if(a==='prev-ex'){goToEx(S.active.exIdx-1);return;}
  if(a==='finish-workout'){S.active.ratePending=true;save();render();return;}
  if(a==='rate-fatigue'){finishWorkout(parseInt(btn.dataset.val)||null);return;}
  if(a==='abandon'){abandonWorkout();return;}
  if(a==='undo-set'){
    const ei=parseInt(btn.dataset.ex),si=parseInt(btn.dataset.set);
    if(S.active?.exercises[ei]){S.active.exercises[ei].done[si]=null;save();render();}
    return;
  }
  if(a==='start-wu-rest'){startRest(parseInt(btn.dataset.secs),'Warm-up rest');return;}
  if(a==='toggle-swap'){
    S.active.swapMode=S.active.swapMode===S.active.exIdx?null:S.active.exIdx;
    render();return;
  }
  if(a==='swap-ex'){
    const idx=parseInt(btn.dataset.idx),newId=btn.dataset.id;
    const newEx=EX.find(e=>e.id===newId);
    if(newEx&&S.active.exercises[idx]){
      const old=S.active.exercises[idx];
      S.active.exercises[idx]={...newEx,sets:old.sets,sessionMins:old.sessionMins,done:[],isFirst:old.isFirst};
      S.active.swapMode=null;save();render();
    }
    return;
  }
  if(a==='toggle-cue'){
    const el=document.getElementById(btn.dataset.id);
    if(el)el.classList.toggle('open');return;
  }
  if(a==='toggle-log'){
    const id=btn.dataset.id;
    S.openLogs[id]=!S.openLogs[id];render();return;
  }
  if(a==='edit-log'){
    const log=S.logs.find(l=>l.id===btn.dataset.id);
    if(log){S.editLogDraft=JSON.parse(JSON.stringify(log));S.view='log-edit';render();}
    return;
  }
  if(a==='save-log-edit'){
    const log=S.editLogDraft;
    if(log){
      log.exercises.forEach((ex,ei)=>{
        const isNW=EX.find(e=>e.id===ex.id)?.noWeight;
        ex.sets.forEach((s,si)=>{
          if(!isNW){const wEl=document.getElementById(`el-w-${ei}-${si}`);if(wEl)s.weight=parseFloat(wEl.value)||0;}
          const rEl=document.getElementById(`el-r-${ei}-${si}`);if(rEl)s.reps=parseInt(rEl.value)||0;
        });
      });
      const idx=S.logs.findIndex(l=>l.id===log.id);
      if(idx!==-1)S.logs[idx]=log;
      recalcLastWeights();
      S.editLogDraft=null;S.view='history';
      save();render();
    }
    return;
  }
  if(a==='cancel-log-edit'){S.editLogDraft=null;S.view='history';render();return;}
  if(a==='delete-log'){
    const id=btn.dataset.id;
    const log=S.logs.find(l=>l.id===id);
    if(!log)return;
    const isCustom=log.isCustom;
    const msg=isCustom
      ?'Delete this custom workout? The rest of your week will rebalance to account for the removed workout.'
      :'Delete this workout from your history? This cannot be undone.';
    if(!confirm(msg))return;

    // Remove from logs
    S.logs=S.logs.filter(l=>l.id!==id);

    // Clear any custom-workout flags on the program week that referenced this log
    let wasOnWeek=false;
    if(S.program?.week){
      S.program.week.forEach(day=>{
        if(day&&day.customWorkout&&day.customLog?.id===id){
          delete day.customWorkout;delete day.customLog;wasOnWeek=true;
        }
      });
    }

    recalcLastWeights();

    // If it was a custom workout tied to the week, rebalance the remaining week
    if(isCustom&&wasOnWeek&&S.weekPlan?.availability){
      rebalanceCustomWorkouts();
    }

    S.editLogDraft=null;
    S.view='history';
    save();render();
    return;
  }
  if(a==='skip-rest'||btn.id==='skip-rest-btn'){stopRest();return;}
});

let chatOpen=false,chatLoading=false,chatMsgs=[];

function localAnswer(q){
  const ql=q.toLowerCase();
  // Find mentioned exercise
  const ex=EX.find(e=>ql.includes(e.name.toLowerCase())||ql.includes(e.id.replace(/_/g,' ')));
  if(ex){
    if(/how|technique|form|cue|tip|perform|do i|do the/.test(ql))
      return`<strong>${ex.name}</strong><br><br>${ex.cue}`;
    if(/equipment|need|require|use/.test(ql))
      return`<strong>${ex.name}</strong> uses: ${ex.eq.join(', ')}`;
    if(/alternative|substitute|instead|replace|swap/.test(ql)){
      const alts=EX.filter(e=>e.muscle===ex.muscle&&e.id!==ex.id&&!(S.cfg.hipCaution&&e.hipRisk)).slice(0,5);
      return`Alternatives for <strong>${ex.name}</strong> (${ex.muscle}):<br><br>${alts.map(a=>`• ${a.name}`).join('<br>')}`;
    }
    return`<strong>${ex.name}</strong> — ${ex.muscle}, ${ex.type}<br>Equipment: ${ex.eq.join(', ')}<br><br>${ex.cue}`;
  }
  // Muscle group
  const muscle=['chest','back','shoulders','biceps','triceps','legs','core','hips'].find(m=>ql.includes(m));
  if(muscle){
    const list=EX.filter(e=>e.muscle===muscle&&!(S.cfg.hipCaution&&e.hipRisk));
    return`<strong>${muscle.charAt(0).toUpperCase()+muscle.slice(1)} exercises:</strong><br><br>${list.map(e=>`• ${e.name} (${e.type})`).join('<br>')}`;
  }
  return null;
}

async function askAssistant(q){
  const key=localStorage.getItem('anthropicKey');
  if(!key){
    const local=localAnswer(q);
    return local||`No AI key configured — but I can answer questions about specific exercises or muscle groups by name. Add your Anthropic API key in the Cloud Sync settings for full AI responses.`;
  }
  try{
    const hipNote=S.cfg.hipCaution?'User has hip impingement (FAI) — avoid deep squat patterns.':'';
    const prog=S.program?`Current split: ${S.program.week.filter(d=>!d.rest).map(d=>DOW[d.dow]+': '+d.name).join(', ')}.`:'';
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-client-side-allowlist-v1':'true'},
      body:JSON.stringify({
        model:'claude-haiku-4-5-20251001',max_tokens:600,
        system:`You are a concise personal trainer in a workout app. ${hipNote} ${prog} Keep answers short, practical, and use line breaks. No markdown headers.`,
        messages:[{role:'user',content:q}]
      })
    });
    if(!res.ok)throw new Error('API '+res.status);
    const data=await res.json();
    return data.content[0].text.replace(/\n/g,'<br>');
  }catch(e){
    const local=localAnswer(q);
    return local||`Couldn't reach AI (${e.message}). Check your API key in Cloud Sync settings.`;
  }
}

function renderChatHTML(){
  if(!chatOpen)return'';
  const bubbles=chatMsgs.map(m=>`<div class='chat-bubble ${m.role==='user'?'cb-user':'cb-ai'}'>${m.text}</div>`).join('');
  const hasKey=!!localStorage.getItem('anthropicKey');
  return`<div class='chat-sheet'>
    <div class='chat-hdr'>
      <div><div style='font-size:14px;font-weight:700'>💬 Exercise Assistant</div>
        <div style='font-size:11px;color:var(--mut)'>${hasKey?'AI powered · Claude Haiku':'Local DB answers · add API key for AI'}</div></div>
      <button style='background:none;border:none;color:var(--mut);font-size:24px;cursor:pointer;padding:0 4px' onclick='toggleChat()'>×</button>
    </div>
    <div class='chat-msgs' id='chat-msgs'>
      ${!chatMsgs.length?`<div style='text-align:center;color:var(--mut);padding:24px 16px;font-size:13px;line-height:1.7'>Ask me anything about exercises.<br><span style='font-size:12px'>Technique · Equipment · Alternatives · Programming</span></div>`:''}
      ${bubbles}
      ${chatLoading?`<div class='chat-bubble cb-ai' style='color:var(--mut)'>Thinking…</div>`:''}
    </div>
    <div class='chat-foot'>
      <input type='text' id='chat-input' class='ni' placeholder='e.g. How do I do a proper RDL?' style='flex:1;text-align:left;padding:10px 12px' onkeydown='if(event.key==="Enter")sendChat()'>
      <button class='btn btn-p btn-sm' onclick='sendChat()' style='width:auto'>Send</button>
    </div>
  </div>`;
}

function updateChatUI(){
  const el=document.getElementById('chat-float');
  if(el)el.innerHTML=renderChatHTML();
  // Scroll to bottom
  setTimeout(()=>{const m=document.getElementById('chat-msgs');if(m)m.scrollTop=m.scrollHeight;},50);
}

function toggleChat(){chatOpen=!chatOpen;updateChatUI();}

async function sendChat(){
  const input=document.getElementById('chat-input');
  const text=input?.value?.trim();
  if(!text||chatLoading)return;
  input.value='';
  chatMsgs.push({role:'user',text});
  chatLoading=true;updateChatUI();
  const answer=await askAssistant(text);
  chatMsgs.push({role:'assistant',text:answer});
  chatLoading=false;updateChatUI();
}

let fbAuth=null,fbDb=null,fbUser=null,fbReady=false;

function getStoredFbConfig(){
  try{return JSON.parse(localStorage.getItem('fbConfig')||'null');}catch(e){return null;}
}

async function loadFbScript(src){
  return new Promise((res,rej)=>{
    if(document.querySelector(`script[src="${src}"]`)){res();return;}
    const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s);
  });
}

async function initFirebase(cfg){
  try{
    await loadFbScript('https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js');
    await loadFbScript('https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js');
    await loadFbScript('https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js');
    if(!firebase.apps.length)firebase.initializeApp(cfg);
    fbAuth=firebase.auth();
    fbDb=firebase.firestore();
    fbReady=true;
    render(); // update UI now that Firebase is ready
    fbAuth.onAuthStateChanged(user=>{
      fbUser=user;
      if(user)loadFromCloud();
      else render();
    });
    // Handle email link sign-in when returning from inbox link
    if(fbAuth.isSignInWithEmailLink(location.href)){
      let email=localStorage.getItem('emailForSignIn');
      if(!email)email=prompt('Please confirm your email address:');
      if(email){
        fbAuth.signInWithEmailLink(email,location.href)
          .then(()=>localStorage.removeItem('emailForSignIn'))
          .catch(e=>alert('Sign-in error: '+e.message));
      }
    }
  }catch(e){console.error('Firebase init failed',e);fbReady=false;}
}

async function saveToCloud(){
  if(!fbReady||!fbUser||!fbDb)return;
  try{
    const data={cfg:S.cfg,program:S.program,logs:S.logs.slice(-10),weekPlan:S.weekPlan,lastWeights:S.lastWeights,updatedAt:new Date().toISOString()};
    await fbDb.collection('users').doc(fbUser.uid).set(data);
  }catch(e){console.error('Cloud save failed',e);}
}

async function loadFromCloud(){
  if(!fbReady||!fbUser||!fbDb)return;
  try{
    const doc=await fbDb.collection('users').doc(fbUser.uid).get();
    if(doc.exists){
      const cloud=doc.data();
      // Merge logs by ID union — preserves this week's local sessions
      const localLogs=S.logs||[];
      const cloudLogs=cloud.logs||[];
      const merged=[...cloudLogs];
      localLogs.forEach(l=>{if(!merged.find(c=>c.id===l.id))merged.push(l);});
      merged.sort((a,b)=>a.id>b.id?1:-1);
      // Merge lastWeights: local takes precedence (most recent device)
      const weights={...(cloud.lastWeights||{}),...(S.lastWeights||{})};
      Object.assign(S,{cfg:cloud.cfg||S.cfg,program:cloud.program||S.program,weekPlan:cloud.weekPlan||S.weekPlan,logs:merged.slice(-10),lastWeights:weights});
      save();
      await saveToCloud();// upload merged data back
    }else{
      await saveToCloud();// first login — push local data up
    }
    render();
  }catch(e){console.error('Cloud load failed',e);render();}
}

      <button class='btn btn-s btn-sm' data-action='save-anthropic-key' style='width:auto'>Save</button>
    </div>
  </div>`;
