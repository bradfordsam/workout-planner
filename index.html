// so a later block can't be starved by an earlier one eating the whole budget,
// and the leg block jumps the queue on a leg day — which is the entire point of
// the split Sam asked for.
function prepPlan(o){
  o=o||{};
  const isLunch=!!o.isLunch, isLegDay=!!o.isLegDay;
  const cap=(o.capMins||(isLunch?PREP_BUDGET_MINS.lunch:PREP_BUDGET_MINS.evening))*60;
  const want=(evening,lunch)=>isLunch?lunch:evening;
  const legPool=[...HIP_POOL,...LOWER_MOBILITY_POOL].filter(prepIsLeg);
  const deskPool=[...HIP_POOL,...LOWER_MOBILITY_POOL].filter(prepIsDesk);
  // Decompression and the desk reversal are FIXED — they are the two things that
  // answer "my hip pinches" and "I came straight from a chair", so they are not
  // subject to the rotation or the budget.
  const fixed=[];
  if(o.hipCaution)fixed.push({key:'decompress',title:'🦋 Decompress first',color:'#c084fc',items:HIP_DECOMPRESSION,note:'Unload the joint before you mobilise it. Left hip: back off at the pinch.'});
  fixed.push({key:'desk',title:'🖥️ Desk Reversal',color:'var(--ok)',items:DESK_REVERSAL,note:'Fixed every session — the two most literal undo buttons for a day in a chair.'});
  const rotating=[
    isLegDay?{key:'legprep',title:'🦵 Leg Prep · hamstrings, Achilles, adductors',color:'var(--warn)',pool:legPool,n:want(4,2)}:null,
    {key:'deskreset',title:'🧍 Hip &amp; Spine Reset',color:'var(--ok)',pool:deskPool,n:want(isLegDay?2:4,isLegDay?1:3)},
    {key:'pthip',title:'🩺 PT Hip Program',color:'#c084fc',pool:PT_HIP_POOL,n:want(3,2)},
    o.shoulderCaution?{key:'shoulder',title:'🩹 Achy Shoulder',color:'var(--acc)',pool:SHOULDER_POOL,n:want(2,1)}:null,
    {key:'upper',title:'🔄 Upper Body',color:'var(--acc)',pool:UPPER_MOBILITY_POOL,n:want(2,1)},
  ].filter(Boolean);
  // Blocks are dealt round-robin, so at the abbreviated cap only the first round
  // or two lands and ORDER decides what he actually gets. A century is 100
  // pull-ups and nothing else, so the shoulder and upper-back blocks go first.
  if(o.upperFirst){
    const isUpper=(b)=>b.key==='shoulder'||b.key==='upper';
    rotating.sort((a,b)=>(isUpper(b)?1:0)-(isUpper(a)?1:0));
  }
  let secs=fixed.reduce((a,b)=>a+b.items.reduce((x,it)=>x+prepItemSecs(it),0),0);
  // Pre-roll each pool's rotation, then deal one item at a time across the
  // blocks until the budget is gone.
  const queues=rotating.map(b=>({...b,queue:stretchRot(b.pool,b.n),items:[]}));
  for(let round=0;round<Math.max(...queues.map(q=>q.n),0);round++){
    for(const q of queues){
      const it=q.queue[round];
      if(!it)continue;
      const c=prepItemSecs(it);
      if(secs+c>cap)continue;
      q.items.push(it);secs+=c;
    }
  }
  const blocks=[...fixed,...queues.filter(q=>q.items.length).map(q=>({key:q.key,title:q.title,color:q.color,items:q.items,rotates:true}))];
  return{blocks,secs,mins:Math.max(1,Math.round(secs/60)),cap:Math.round(cap/60),isLegDay};
}

// ─────────────────────────────────────────────
// PULL-UP CENTURY — TRACKER
// ─────────────────────────────────────────────
// Rendered on the dashboard on Century days (see centuryDows) and on any day a
// century is already underway or finished. The tally is the whole interface:
// add a set, watch the bar fill, log it when you get to 100 — the number of
// sets it took is recorded as a side effect rather than being something to
// plan in advance.
// ── FIXING A CENTURY'S RECORDED TIME (2026-08-05) ──
// Sam: "I forgot to stop my century today can you make it so I can go back and
// edit that time." The card sits on the dashboard all day, so the gap between
// the last rep and remembering to tap Log is unbounded. The finish handler now
// measures to the last SET rather than to the tap, which prevents the next one —
// but a century already logged with a wrong number still needs fixing, and the
// number matters: centuryMins() takes the median of the last 5 timed sessions
// and that is what reserves minutes out of the 40-minute lunch. One bad reading
// visibly moves how much lifting a lunch gets.
//
// Lives right on the Done card rather than only in History because that is where
// he'll be standing when he notices. The same edit is available from Edit
// Workout for older centuries (see renderLogEdit).
//
// Setting it to 0 is a real, useful answer — "I genuinely don't know" — because
// centuryMins() filters on timedMins>0, so an untimed session is skipped rather
// than poisoning the median with a guess. That is the whole point of keeping
// timedMins separate from duration.
function centuryTimeEditHTML(log){
  if(!log)return'';
  if(S.editCenturyTime!==log.id){
    return`<button class='cue-btn' data-action='century-time-edit' data-id='${log.id}' style='margin-top:8px;margin-bottom:0'>⏱ ${log.timedMins?'Fix the time':'Add the time'}</button>`;
  }
  return`<div style='margin-top:10px;padding:10px 12px;background:var(--surf2);border:1px solid var(--bdr);border-radius:10px'>
    <div style='font-size:11px;color:var(--mut);margin-bottom:6px'>How many minutes did it actually take, first set to last?</div>
    <div style='display:flex;gap:6px;align-items:center'>
      <input type='number' id='century-time-input' class='ni' value='${log.timedMins||''}' placeholder='min' min='0' max='${MAX_LOGGED_MINS}' inputmode='numeric' style='width:84px'>
      <button class='btn btn-s btn-sm' data-action='century-time-save' data-id='${log.id}' style='flex:1'>Save</button>
      <button class='btn btn-g btn-sm' data-action='century-time-cancel' style='width:auto'>Cancel</button>
    </div>
    <div style='font-size:11px;color:var(--mut);margin-top:6px;line-height:1.6'>This is the number that reserves time for a century out of your 40-minute lunch — a wrong one costs you lifting on century days. Don't count the time between finishing and tapping Log. <strong style='color:var(--txt)'>Leave it blank or enter 0</strong> if you genuinely don't know; an untimed session is skipped rather than guessed at.</div>
  </div>`;
}
function centuryHTML(){

  const draft=centuryDraft();
  const doneToday=centuryLogs().find(l=>logDay(l.date)===todayStr());
  // A full Pyramid is 100 pull-ups arriving in a different shape (see
  // pyramidCoversCentury). Asking for a second hundred on the same day would be

  const pyr=pyramidDoneToday();
  if(pyr&&pyramidCoversCentury(pyr)&&!draft.sets.length&&!doneToday){

  // Damon over 3 months: sets-to-100 and best unbroken set.
  // Clock line: the measured minutes are what buy the lunch time-box its budget
  // (centuryMins → buildSession), so show what's actually being used.
  // WHERE those minutes are reserved from matters now that it can be either
  // session (see centuryHostSession) — and the honest number for today is the

  const hostLbl=host==='eve'?'tonight’s session':host==='lunch'?'your 40-min lunch':'the day';
  const remain=centuryBudgetToday();
  const clock=st.timedCount
    ?`<div style='font-size:11px;color:var(--mut);margin-top:4px'>⏱ Typically <strong style='color:var(--txt)'>${centuryMins()} min</strong> (median of ${st.timedCount} timed session${st.timedCount!==1?'s':''}${st.lastMins?` · last ${st.lastMins} min`:''}, incomplete ones scaled to a full hundred) — reserved out of ${hostLbl}${remain<centuryMins()?`, and down to <strong style='color:var(--txt)'>${remain} min</strong> today with what you've already banked`:''}.</div>`
    :`<div style='font-size:11px;color:var(--mut);margin-top:4px'>⏱ Timing starts on your first set. Until there's data, ${hostLbl} budgets ${centuryDefaultMins()} min for this — the pacing above is where that number comes from.</div>`;
  const trend=st.total>1&&st.firstSets&&st.lastSets
    ?`<div style='font-size:11px;color:var(--mut);margin-top:6px'>${st.total} centuries logged · first took <strong style='color:var(--txt)'>${st.firstSets} sets</strong>, last took <strong style='color:var(--ok)'>${st.lastSets}</strong>${st.best?` · best single set <strong style='color:var(--txt)'>${st.bestEver}</strong>`:''}</div>`
    :st.total===1?`<div style='font-size:11px;color:var(--mut);margin-top:6px'>First century logged — ${st.lastSets} sets${st.bestEver?`, best single set ${st.bestEver}`:''}. That set count is the number that comes down.</div>`
    :`<div style='font-size:11px;color:var(--mut);margin-top:6px'>First one is the ugly one — 10+ sets is completely normal. The target never changes; the set count is what drops.</div>`;
  if(doneToday){
    const sets=(doneToday.exercises?.[0]?.sets||[]).filter(s=>s&&s.reps>0);
    const total=sets.reduce((a,s)=>a+s.reps,0);
    return`<div style='margin-top:12px;padding:14px;background:rgba(74,222,128,.06);border:1px solid rgba(74,222,128,.25);border-radius:12px;text-align:left'>
      <div style='font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--ok);margin-bottom:4px'>🎯 Pull-up Century · Done</div>
      <div style='font-size:14px;font-weight:700'>✅ ${total} reps${doneToday.estimated?'':` in ${sets.length} set${sets.length!==1?'s':''}`}${doneToday.timedMins?` · ${doneToday.timedMins} min`:''}</div>
      <div style='font-size:12px;color:var(--mut);margin-top:2px'>${doneToday.estimated?'Logged as already done — the set breakdown is an even split, so it is left out of your best-set record. Nothing is reserved out of today for it.':sets.map(s=>s.reps).join(' · ')}</div>
      ${clock}

      <button class='cue-btn' data-action='delete-log' data-id='${doneToday.id}' style='margin-top:4px;margin-bottom:0;color:var(--bad)'>🗑️ Undo — log it wrong? Delete it</button>
      ${trend}
    </div>`;
  }
  const total=draft.sets.reduce((a,n)=>a+n,0);
  const plan=centurySetPlan();
  const pct=Math.min(100,Math.round(total/T*100));
  const bestToday=draft.sets.length?Math.max(...draft.sets):0;
  const setChips=draft.sets.length
    ?`<div style='font-size:12px;color:var(--mut);margin-top:8px'>Sets: ${draft.sets.join(' · ')}</div>`:'';
  const remaining=Math.max(0,T-total);
  return`<div style='margin-top:12px;padding:14px;background:rgba(129,140,248,.06);border:1px solid rgba(129,140,248,.3);border-radius:12px;text-align:left'>
    <div style='font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--acc);margin-bottom:4px'>🎯 Pull-up Century · ${DOW[todayDow()]}</div>

    <div style='display:flex;align-items:baseline;gap:8px;margin-top:8px'>
      <div style='font-size:24px;font-weight:800;color:${total>=T?'var(--ok)':'var(--txt)'}'>${total}</div>

    </div>
    <div style='height:8px;background:var(--surf2);border-radius:99px;overflow:hidden;margin:6px 0 10px'>

      <input type='number' id='century-reps' class='ni' placeholder='reps' min='1' max='60' inputmode='numeric' style='width:72px'>
      <button class='btn btn-s btn-sm' data-action='century-add-set' style='flex:1'>+ Add Set</button>
      ${draft.sets.length?`<button class='btn btn-g btn-sm' data-action='century-undo-set' style='width:auto'>↩</button>`:''}

    ${setChips}

    ${!draft.sets.length?`<button class='cue-btn' data-action='century-already-done' style='margin-top:8px;margin-bottom:0'>✓ Already did it today — log it and free the time</button>`:''}
    ${!draft.sets.length?`<button class='cue-btn' data-action='century-no-bar-today' style='margin-top:4px;margin-bottom:0;color:var(--mut)'>🚫 No pull-up bar today — skip it and use the time</button>`:''}
    <div style='margin-top:10px;padding:10px 12px;background:rgba(129,140,248,.08);border:1px solid rgba(129,140,248,.25);border-radius:10px'>
      <div style='font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--acc);margin-bottom:4px'>⏱ Pacing${plan.test?' · Test day':''}</div>
      ${plan.test?`<div style='font-size:13px;font-weight:700'>Set 1 to failure · rest ${plan.testRestSecs/60} min · then sets of ${plan.setSize}</div>
      <div style='font-size:11px;color:var(--mut);margin-top:4px;line-height:1.6'>Every ${CENTURY_TEST_EVERY}th century opens with <strong style='color:var(--txt)'>one honest max set</strong> — the only set in this whole protocol that goes near failure. That number is what re-sizes every set for the next three sessions and sets the Pyramid's top rung, so it's worth the full ${plan.testRestSecs/60} minutes of rest afterwards (near-failure sets genuinely do need it). Then back to normal: sets of ${plan.setSize}, ${plan.restSecs}s, ${plan.sets} sets total, ~<strong style='color:var(--txt)'>${plan.mins} min</strong>.</div>`
      :`<div style='font-size:13px;font-weight:700'>Sets of ${plan.setSize} · rest ${plan.restSecs}s</div>
      <div style='font-size:11px;color:var(--mut);margin-top:4px;line-height:1.6'>${plan.sets} sets at that size gets you to ${T} in about <strong style='color:var(--txt)'>${plan.mins} min</strong>${st.best?` — sized at half your best set of ${st.best}, so every set starts ~${Math.max(1,st.best-plan.setSize)} reps clear of failure`:''}. Half-max sets don't need long rests; the 2–3 min figure comes from research on sets taken NEAR failure, which this deliberately isn't. If you're resting much past ${plan.restSecs}s, cut the set size rather than the rest — that's what keeps this inside a lunch.</div>`}
    </div>
    <div style='font-size:11px;color:var(--mut);margin-top:8px;line-height:1.6'>${plan.test?'After the opener, end':'End'} every set <strong style='color:var(--txt)'>2+ reps short of failure</strong>, and keep them the SAME SIZE — a set count that falls away as you go means set one was too close to failure. Reps don't creep up within a session; they step up on test day. That's what lets 100 reps run three times a week for months instead of frying your elbows. Grip fails before the lats do; switch grips freely (overhand, neutral, chin-up) and any of them count. Can't hit the number strict? Bands, feet on a box, or slow negatives all count too.</div>
    <div style='font-size:11px;color:var(--mut);margin-top:8px;line-height:1.6'>📊 <strong style='color:var(--txt)'>This is booked against your week.</strong> A full century bills ${CENTURY_MRV_SETS} back sets and ${(CENTURY_MRV_SETS*0.5).toFixed(1)} biceps against weekly MRV (a partial bills its share), so the generator plans less rowing and fewer curls on the days around it — you don't have to hold back on purpose.</div>
    ${trend}
  </div>`;
}

// A day whose whole lunch is the hundred. At a MEASURED ~30 min century the
// 40-minute box affords no lifts at all, so genProgram builds no session and the
// day reaches the dashboard looking exactly like a rest day. It isn't one, so
// it says what it actually is.
// Read off the built program rather than re-deriving the ledger, so a session
// that was preserved or hand-edited into that day still counts as lifting.
function centuryOnlyDow(dow){
  if(centuryHostSession(dow)!=='lunch')return false;
  const d=S.program?.week?.[dow];
  return !d||d.rest||!((d.exercises||[]).length||d.eveningSession?.exercises?.length);
}
// The warm-up for a session that is nothing but pull-ups. Same pools and same
// budgeting as the pre-lift prep, at PREP_BUDGET_MINS.centuryLunch and with the
// shoulder/upper blocks dealt first — this is 100 reps of one overhead pull, so
// that is what needs to be warm. Rendered on the century card because on this
// kind of day there is no workout screen to put it on.
function centuryPrepHTML(){
  const p=prepPlan({isLunch:true,capMins:PREP_BUDGET_MINS.centuryLunch,upperFirst:true,
    hipCaution:!!S.cfg?.hipCaution,shoulderCaution:!!S.cfg?.shoulderCaution});
  return`<div style='margin-top:10px;padding:10px 12px;background:rgba(192,132,252,.08);border:1px solid rgba(192,132,252,.25);border-radius:10px'>
    <div style='font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#c084fc;margin-bottom:4px'>🔥 Before rep one · ~${p.mins} min</div>
    ${p.blocks.map(b=>`<div style='margin-bottom:4px'>

      ${b.items.map(it=>`<div style='font-size:12px;color:var(--mut);line-height:1.6'>• <strong style='color:var(--txt)'>${it.n}</strong> — ${it.d}</div>`).join('')}
    </div>`).join('')}
    <div style='font-size:11px;color:var(--mut);margin-top:4px;line-height:1.6'>Abbreviated on purpose — the hundred takes ~${centuryMins()} min of a 40-minute lunch, so this is the short version rather than the usual ${PREP_BUDGET_MINS.lunch}. Spine holds and the Big 3 move to this morning or tonight; they need no gym.</div>
  </div>`;
}

// The Pyramid card. Collapsed to a single line until tapped, because this is an
// ALTERNATIVE to the day's session and nagging about it every day is exactly how
// "it just clearly works" turns into another thing to ignore.
// ─────────────────────────────────────────────
// EMOM 20 · FULL BODY (2026-08-30)
// ─────────────────────────────────────────────
// From the card Sam brought in: *"Four movements covering everything, a squat, a
// press, a pull, and a hinge. The basics work every time."* Twenty minutes, one
// movement at the top of each, five rounds of the four.
//
// Built on the CINDY pattern rather than the Pyramid's, because it is the same
// SHAPE of thing: a fixed named session with a round counter, a spacing rule, and
// a card that only prescribes itself when it can be run honestly. Like Cindy and
// unlike the Century it is logged as a REAL session — 20 minutes of squats,
// push-ups, pull-ups and hinges IS the day's training, so it marks the day
// completed, feeds recovery and books MRV.
//
// NEVER SCHEDULED BY THE GENERATOR, same rule as the Pyramid and Cindy:
// dayTemplate knows nothing about it. A generated session that could be silently
// swapped would make the recovery bookkeeping a lie.
const EMOM_MINS=20;
const EMOM_EVERY_DAYS=14;
// A squat, a press, a pull, a hinge — the four the source card names, in the order
// it lists them. `reps` is the per-minute dose; the pull is lower because it is the
// one that gates the whole thing, and it is the movement the cluster protocol
// exists for (see CLUSTER SETS — clusterPlan applies here too).
const EMOM_ROUND=[
  {id:'heels_elev_front_squat',name:'Heels Elevated Front Rack Squat',muscle:'legs',type:'compound',rMin:8,rMax:12,reps:10},
  {id:'feet_elev_pushup',name:'Feet Elevated Push-ups',muscle:'chest',type:'compound',rMin:8,rMax:15,reps:10},
  {id:'parallel_pullup',name:'Parallel (Neutral-Grip) Pull-up',muscle:'back',type:'compound',rMin:4,rMax:10,reps:6},
  {id:'db_rdl',name:'Dumbbell RDL',muscle:'legs',type:'compound',rMin:8,rMax:12,reps:10},
];
const EMOM_ROUNDS_TOTAL=Math.floor(EMOM_MINS/EMOM_ROUND.length);

function emomLogs(){return (S.logs||[]).filter(l=>l&&l.emom);}
function emomDraft(){
  if(!S.emom||S.emom.date!==todayStr())return{date:todayStr(),rounds:0,startedAt:null,touchedAt:null};
  return S.emom;
}
function emomDoneToday(){return emomLogs().find(l=>logDay(l.date)===todayStr())||null;}
function emomStats(){
  const logs=emomLogs();
  return{count:logs.length,best:logs.reduce((a,l)=>Math.max(a,l.emomRounds||0),0),last:logs[logs.length-1]||null};
}
function emomDaysSince(){
  const l=emomLogs();
  return l.length?daysBetween(logDay(l[l.length-1].date),todayStr()):Infinity;
}
function emomDue(){return emomDaysSince()>=EMOM_EVERY_DAYS;}

// Which of the four can actually be done here. The pull needs a bar; the squat and
// hinge need dumbbells. A round missing a movement is still a session — you just
// cycle the ones you have — but it is not PRESCRIBED, the same rule the Pyramid
// uses for a ladder missing a rung.
function emomMovements(equipmentKey){
  const eq=new Set([...(EQUIPMENT_PRESETS[equipmentKey]?.equipment||[]),'bodyweight']);
  return EMOM_ROUND.map(mv=>{
    const def=exById(mv.id);
    const ok=def?(def.eq||[]).some(q=>eq.has(q))&&!userAvoids(def):true;
    return{...mv,available:ok,def};
  });
}

// PRESCRIBED only when it can be run honestly: every movement available, the
// evening has room for it, it is actually due, and nothing else already owns the
// night. Deliberately never on a Century day — the pull-up minutes and 100
// submaximal reps are the same tissue — and never alongside the Pyramid or Cindy,
// since one big benchmark per evening is the entire point.
function emomPrescription(){
  const dow=todayDow();
  const d=S.program?.week?.[dow];
  const dd=(d&&!d.rest)?d:null;
  const sess=dd?.eveningSession||((dd&&!dd.isLunch)?dd:null);
  if(!sess)return null;
  if(!emomDue()||emomDoneToday())return null;
  if(centuryDows(S.weekPlan?.availability).includes(dow))return null;
  if(typeof pyramidPrescription==='function'&&pyramidPrescription())return null;
  if(typeof cindyPrescription==='function'&&cindyPrescription())return null;
  const key=sess.equipmentKey||'ymca';
  const moves=emomMovements(key);
  if(moves.some(m=>!m.available))return null;
  const needed=EMOM_MINS+PREP_BUDGET_MINS.evening+LUNCH_LEDGER.spineMins;
  if((sess.mins||60)<needed)return null;
  return{gymName:EQUIPMENT_PRESETS[key]?.name||'this gym',needed,moves,key};
}

function emomHTML(dd){
  const done=emomDoneToday();
  const draft=emomDraft();
  const started=!!draft.startedAt;
  const rx=emomPrescription();
  const st=emomStats();
  const key=dd?.eveningSession?.equipmentKey||dd?.equipmentKey||S.eveningLocation||'ymca';
  const moves=emomMovements(key);
  const missing=moves.filter(m=>!m.available);
  if(done){
    return`<div style='margin-top:10px;padding:12px 14px;background:var(--surf2);border:1px solid rgba(74,222,128,.3);border-radius:12px;text-align:left'>
      <div style='font-size:13px;font-weight:700;color:var(--ok)'>&#9989; EMOM 20 logged — ${done.emomRounds||0} of ${EMOM_ROUNDS_TOTAL} rounds</div>
    </div>`;

function pyramidHTML(dd){
  const done=pyramidDoneToday();

  if(!plan.moves.length)return'';
  const totalRungs=plan.sizes.length;
  if(done){
    const mv=(done.exercises||[]).map(e=>`${pyramidRepsOf(e)} ${e.name.toLowerCase()}`).join(' · ');
    const reps=(done.exercises||[]).reduce((a,e)=>a+pyramidRepsOf(e),0);
    return`<div style='margin-top:12px;padding:14px;background:rgba(74,222,128,.06);border:1px solid rgba(74,222,128,.25);border-radius:12px;text-align:left'>

      <div style='font-size:14px;font-weight:700'>✅ ${reps} reps${done.pyramidComplete?'':` · stopped at rung ${done.pyramidRungs} of ${done.pyramidTotalRungs}`}${done.timedMins?` · ${done.timedMins} min`:''}</div>
      <div style='font-size:12px;color:var(--mut);margin-top:4px;line-height:1.6'>${mv}</div>
    </div>`;
  }
  const rx=pyramidPrescription();
  // Collapsed: one line, one button. Skipped entirely when the ladder is tonight's
  // prescription — a prescription you have to go find and expand isn't one.
  if(!S.pyramidOpen&&!started&&!rx){
    return`<div style='margin-top:12px;padding:12px 14px;background:var(--surf2);border:1px solid var(--bdr);border-radius:12px;text-align:left'>
      <div style='display:flex;align-items:center;gap:8px'>
        <span style='font-size:16px'>🔺</span>
        <div style='flex:1;min-width:0'>
          <div style='font-size:13px;font-weight:700'>The Pyramid — ${plan.totalReps} reps, ~${plan.mins} min</div>

      </div>
    </div>`;
  }
  const rungsDone=draft.rung;
  const repsDone=plan.moves.reduce((a,m)=>a+pyramidRepsAfter(plan.sizes,rungsDone,m.mult),0);
  const pct=plan.totalReps?Math.min(100,Math.round(repsDone/plan.totalReps*100)):0;
  const cur=rungsDone<totalRungs?plan.sizes[rungsDone]:null;
  const climbing=rungsDone<plan.peak;
  // The prescription for the rung you're actually on — the only thing worth
  // reading mid-session.
  const curRows=cur===null?'':plan.moves.map(m=>
    `<div style='display:flex;justify-content:space-between;gap:8px;padding:3px 0'>

      <strong style='color:var(--txt)'>${cur*m.mult}</strong>
    </div>`).join('');
  // Rest guidance for the rung you're on. The time estimate uses a flat
  // PYRAMID_REST_SECS average, but that is a MODELLING convenience and a bad
  // prescription: rung 2 is 2 pull-ups and 10 squats, rung 10 is 10 and 50. So
  // the advice scales with the rung instead — walk through the small ones, take
  // real rest at the top, and compress again on the way down as they shrink.
  // The pull-up is the limiter (it's the x1 movement but by far the hardest),
  // so its quality is the signal to rest on rather than a clock.
  const restNote=cur===null?'':(()=>{
    const frac=plan.peak?cur/plan.peak:0;
    const advice=frac<=0.4
      ?'Little or none — flow straight into the next rung. These small rungs are the ramp-up.'
      :frac<0.85
        ?'~30–60s, or just long enough that the pull-ups stay unbroken.'
        :'~60–90s. This is the expensive part of the ladder; earn the top rungs rather than surviving them.';
    return`<div style='font-size:11px;color:var(--mut);margin-top:6px;line-height:1.6'><strong style='color:var(--txt)'>Rest after this rung:</strong> ${advice}${climbing?'':' Coming down, shorten it again as the rungs shrink.'}</div>
      <div style='font-size:11px;color:var(--mut);margin-top:2px;line-height:1.6'>Rest on the PULL-UPS, not the clock — the moment they start breaking into singles you waited too long to rest, not too little.</div>`;
  })();
  // Whole-ladder view, so the shape is visible and you can see what's left.
  const ladder=plan.sizes.map((n,i)=>{
    const state=i<rungsDone?'done':i===rungsDone?'now':'todo';
    const bg=state==='done'?'var(--ok)':state==='now'?'var(--acc)':'var(--surf2)';
    const col=state==='todo'?'var(--mut)':'#0b1020';

  const movesLine=plan.moves.map(m=>`${m.reps} ${m.name.toLowerCase()}`).join(' · ');
  const missing=PYRAMID_LADDER.length-plan.moves.length;
  const missingNote=missing>0?`<div style='font-size:11px;color:var(--mut);margin-top:6px'>${missing} rung${missing>1?'s':''} dropped — nothing available today passes the equipment and avoid-list gates.</div>`:'';
  // Prescribed nights get a brighter border and say WHY, so the reasoning is

  const rxBanner=rx&&!started?`<div style='padding:10px 12px;background:rgba(249,115,22,.12);border:1px solid rgba(249,115,22,.4);border-radius:10px;margin-bottom:10px'>

      <div style='font-size:11px;color:var(--mut);margin-top:4px;line-height:1.6'>${rx.gymName} tonight with ${rx.mins} min — no barbell needed and plenty of time, which is exactly what this is for. It needs ~${rx.needed} min including the spine work, so it fits. Run this instead of the planned lifting; the planned session is still below if you'd rather.</div>
    </div>`:'';
  return`<div style='margin-top:12px;padding:14px;background:rgba(249,115,22,.06);border:1px solid rgba(249,115,22,${rx?'.55':'.28'});border-radius:12px;text-align:left'>
    <div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'>
      <div style='font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#f97316;flex:1'>🔺 The Pyramid · peak ${plan.peak}</div>
      ${!started&&!rx?`<button class='btn btn-g btn-sm' data-action='pyramid-toggle' style='width:auto'>Close</button>`:''}
    </div>
    ${rxBanner}
    <div style='font-size:15px;font-weight:700'>${repsDone} / ${plan.totalReps} reps</div>
    <div style='font-size:12px;color:var(--mut);margin-top:2px'>${movesLine}</div>
    <div style='height:8px;background:var(--surf2);border-radius:99px;overflow:hidden;margin:8px 0 10px'>
      <div style='height:100%;width:${pct}%;background:${pct>=100?'var(--ok)':'#f97316'};border-radius:99px'></div>
    </div>
    <div style='display:flex;flex-wrap:wrap;gap:4px;margin-bottom:10px'>${ladder}</div>
    ${cur!==null?`<div style='padding:10px 12px;background:rgba(249,115,22,.08);border:1px solid rgba(249,115,22,.25);border-radius:10px'>
      <div style='font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:#f97316;margin-bottom:4px'>Rung ${rungsDone+1} of ${totalRungs} · ${climbing?'climbing':'descending'}</div>
      ${curRows}${restNote}
    </div>
    <div style='display:flex;gap:6px;align-items:center;margin-top:8px'>
      <button class='btn btn-s btn-sm' data-action='pyramid-complete-rung' style='flex:1'>✓ Rung of ${cur} done</button>
      ${rungsDone?`<button class='btn btn-g btn-sm' data-action='pyramid-undo-rung' style='width:auto'>↩</button>`:''}
    </div>`
    :`<div style='padding:10px 12px;background:rgba(74,222,128,.08);border:1px solid rgba(74,222,128,.3);border-radius:10px;font-size:13px;font-weight:700;color:var(--ok)'>🔺 Ladder complete — all ${totalRungs} rungs.</div>`}
    ${started?`<button class='btn ${cur===null?'btn-ok':'btn-g'} btn-sm' data-action='pyramid-finish' style='width:100%;margin-top:8px'>${cur===null?`✓ Log Pyramid — ${repsDone} reps`:`Log ${repsDone} reps & stop here (rung ${rungsDone} of ${totalRungs})`}</button>`:''}
    ${lunchWarn}
    ${missingNote}
    <div style='font-size:11px;color:var(--mut);margin-top:8px;line-height:1.6'>Up 1→${plan.peak}, then back down to 1. Every rung is <strong style='color:var(--txt)'>${plan.moves.map(m=>'×'+m.mult).join(' / ')}</strong> of the movements above, so the whole session is one number: ${plan.peak}² × ${plan.moves.reduce((a,m)=>a+m.mult,0)} = ${plan.totalReps} reps.</div>
    <div style='font-size:11px;color:var(--mut);margin-top:6px;line-height:1.6'>⏱ <strong style='color:var(--txt)'>~${plan.mins} min</strong> for the whole ladder — <strong style='color:var(--txt)'>~${plan.upMins} min</strong> just to get to the top, since the climb is more than half the work. ${plan.measured?`Calibrated from ${plan.paceCount} timed session${plan.paceCount>1?'s':''} of your own, finished or not${plan.pace>1.05?` — you run about ${Math.round((plan.pace-1)*100)}% slower than the model, and this already allows for it`:''}.`:`Estimate covers the reps, the changeover between the five movements every rung, and rest between rungs. It recalibrates the first time you log a timed one — a session you stop partway through counts too.`}</div>
    <div style='font-size:11px;color:var(--mut);margin-top:6px;line-height:1.6'>Peak is set to <strong style='color:var(--txt)'>${plan.peak}</strong>${(()=>{

      if(cap!==null&&(strength===null||cap<=strength))return ` by your last ladder — what you actually finished is what sizes the next one. Complete this and it goes up a rung; stop short and it comes back down to one you will finish`;
      if(strength!==null)return ` — ${PYRAMID_PEAK_HEADROOM} clear of your best unbroken set of ${best}, so even the top rung isn't a grinder`;
      return ` until there's a Century on record to size it from`;

// Which session pays for a century on a day that has BOTH a lunch and an evening.

  const av=S.weekPlan?.availability||defaultAvailability();
  const both=centuryDows(av).some(dow=>dow>=1&&dow<=5&&(av[dow]||{}).lunch!==false&&!!(av[dow]||{}).eve?.on);
  if(!both)return'';
  const when=S.cfg?.centuryWhen==='lunch'?'lunch':'eve';

function renderPlan(){
  if(!S.weekPlan)S.weekPlan={weekOf:todayStr(),availability:defaultAvailability(),calGoal:null};

  const av=S.weekPlan.availability;
  const calGoal=S.weekPlan.calGoal||{};
  const todayDate=todayStr();

  // Capacity vs minimums warning (F-03): the MRV bands are physiological
  // targets and stay untouched, but a light schedule (e.g. lunch-only ≈ 35
  // sets/wk vs ~64 of summed minimums) can never reach them — say so here,
  // where the schedule is being decided, instead of leaving the dashboard
  // permanently yellow with no explanation. Efficiency mode (exactly 3 days)
  // has its own banner and lowered bands, so it's exempt.
  let capacityWarnHTML='';
  if(!isEfficiencyMode(av)){
    const capacity=weeklySetCapacity(av);
    const needed=Object.values(getMRVLimits()).reduce((s,l)=>s+l.min,0);
    if(capacity<needed){
      capacityWarnHTML=`<div class='wu-box' style='border-color:rgba(251,191,36,.35);background:rgba(251,191,36,.05);margin-bottom:16px'>
        <div style='font-size:12px;font-weight:700;color:var(--warn);margin-bottom:4px'>⚖️ Schedule below weekly volume minimums</div>
        <div style='font-size:12px;color:var(--mut);line-height:1.6'>This schedule fits ~<strong style='color:var(--txt)'>${capacity} sets/week</strong>, but reaching every muscle's minimum takes ~<strong style='color:var(--txt)'>${needed}</strong>. Volume bars will stay yellow for most muscles — that's the schedule, not the plan. Add evening or weekend sessions to close the gap, or train 3 days/week to switch into Efficiency Mode's lower-volume targets.</div>
      </div>`;
    }
  }

  const startVal=calGoal.startDate||todayDate;
  const endVal=calGoal.endDate||nextSunday();
  const calVal=calGoal.cals||'';

  return`<div class='view rag v-plan'>
    <button class='s-back' data-action='plan-back' style='margin-bottom:20px;margin-top:0'>
      <svg width='20' height='20' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='15 18 9 12 15 6'/></svg> Back

    <div style='font-size:13px;color:var(--mut);margin-bottom:20px'>Schedule applies from <strong style='color:var(--txt)'>${todayDate}</strong> forward. Changes take effect when you tap Save.</div>

    ${capacityWarnHTML}
    ${renderAvailGrid(av,false)}

    ${pairedSetsPlanHTML()}
    ${jumpDurabilityPlanHTML()}
    ${centuryWhenPlanHTML()}

    ${renderCustomExercises()}

    ${(()=>{
      // The Body Score card was removed from the dashboard (2026-08-03, not
      // wanted there) — but the scan is still the SOURCE of the protein target
      // and of cfg.bodyLbs. Deleting the card took away the
      // only button that opened renderScanModal, which would have quietly frozen
      // a measured input forever, so the trigger moved here instead of vanishing.
      // One line, on the screen where settings already live.
      const b=S.cfg?.bodyScore;
      return`<div class='sec-lbl' style='margin-top:16px'>Body Scan</div>
      <div class='card' style='margin-bottom:16px;display:flex;align-items:center;gap:10px'>
        <div style='flex:1;min-width:0;font-size:12px;color:var(--mut);line-height:1.5'>${b
          ?`${b.weight} lb → <strong style='color:var(--txt)'>${b.target} lb</strong> target${b.testDate?` · scanned ${b.testDate}`:''}. Protein <strong style='color:var(--txt)'>~${Math.round(b.target||S.cfg?.bodyLbs||175)} g/day</strong> (1 g per lb of target weight).`
          :'No scan on record — it sets the daily protein target.'}</div>
        <button class='btn btn-g btn-sm' data-action='edit-body-score' style='width:auto;flex-shrink:0'>Update</button>
      </div>`;
    })()}

    ${(()=>{
      // Daily push-up habit. Reps done outside sessions still cost recovery, so
      // they're booked against MRV at the rep-priced rate (see
      // dailyPushupWeekVolumes) — declared once here rather than ticked daily.
      const reps=S.cfg?.dailyPushups||0;
      const wk=reps>0?pyramidMrvSets(DAILY_PUSHUP_DEF,reps*7):0;
      return`<div class='sec-lbl' style='margin-top:16px'>Daily Push-up Habit</div>
      <div class='card' style='margin-bottom:16px'>
        <div style='font-size:12px;color:var(--mut);line-height:1.5;margin-bottom:8px'>${reps>0
          ?`Target <strong style='color:var(--txt)'>${reps} every morning</strong> — tick it off on the dashboard each day. A full 7-day week books <strong style='color:var(--txt)'>${wk}</strong> chest sets plus secondary triceps and shoulders; only the mornings you actually tick are counted. Discounted because a fresh submaximal set doesn't cost what a hard working set costs.`
          :'Off. Set this if you do push-ups outside your sessions — otherwise the program keeps prescribing a full week of pressing on top of them.'}</div>
        <div style='display:flex;gap:6px;flex-wrap:wrap'>
          ${[0,20,30,40,50].map(n=>`<button class='btn btn-sm ${reps===n?'btn-p':'btn-g'}' data-action='set-daily-pushups' data-val='${n}' style='flex:1;min-width:54px'>${n===0?'Off':n}</button>`).join('')}

          <div class='opt-l'>Mixed with resistance</div>
        </div>
      </div>
      <div style='font-size:12px;color:var(--mut);margin-top:8px'>
        ${(S.weekPlan?.cardioStyle||'separate')==='separate'
          ?'Cardio and resistance training in separate sessions for focused training.'

    </div>

    <div class='sec-lbl' style='margin-top:16px'>Calorie Goal</div>
    <div class='card' style='margin-bottom:16px'>
      <div style='display:flex;align-items:center;gap:8px;margin-bottom:12px'>

        <span style='font-size:13px;color:var(--mut);white-space:nowrap'>calories</span>

      <div style='display:grid;grid-template-columns:1fr 1fr;gap:8px'>

        <div><div class='sec-lbl' style='margin-bottom:4px'>Through</div>

    ${calGoal.cals?`<button class='btn btn-g btn-sm' data-action='clear-plan-goal' style='margin-top:8px'>Clear calorie goal</button>`:''}

}

    <div class='mt16'>
      <button class='btn ${isLast?'btn-ok':'btn-p'}' data-action='${isLast?'generate':'setup-next'}'>
        ${isLast?'🚀 Generate My Program →':'Continue →'}
      </button>
    </div>
    <div class='dots'>${dots}</div>
  </div>`;
}

// ─────────────────────────────────────────────
// RENDER – DASHBOARD
// ─────────────────────────────────────────────
function renderDash(){
  // Bento hero (OR-11): the two habit cards and the cardio action are laid
  // out as one asymmetric grid instead of three stacked full-width cards.
  // A cell whose card returns '' (the push-up habit set to 0/day) is dropped
  // and the grid re-flows to two cells — an empty tile would read as a bug.
  const _sleepHTML=renderSleepCard();
  const _pushHTML=renderPushupCard();
  const bentoHTML=`<div class='bento${_pushHTML?'':' bento-2'}'>
      <div class='bento-cell bento-sleep'>${_sleepHTML}</div>
      ${_pushHTML?`<div class='bento-cell bento-push'>${_pushHTML}</div>`:''}
      <div class='bento-cell bento-act'>
        <button class='btn bento-cardio' data-action='open-log-cardio'>
          <span class='bc-ico'>🏃</span><span class='bc-txt'>Log Cardio</span>
        </button>
      </div>
    </div>`;
  const today=todayDay();const dow=todayDow();const isSunday=dow===0;
  const missed=getMissedDays();
  const completedDows=getCompletedDows();
  const wkGrid=S.program.week.map((d,i)=>{
    const isToday=i===dow;
    const isViewing=S.viewDay===i;
    const isMissed=missed.includes(i);
    const isCompleted=completedDows.has(i);
    // isCompleted checked FIRST — a regenerated week can mark this day rest
    // even though it was actually trained; the log (behind isCompleted) is
    // the source of truth and always wins over the plan's current shape.
    let dot;
    if(isCompleted)dot='background:var(--ok)';
    else if(d.rest)dot='background:var(--bdr)';
    else if(isMissed)dot='background:var(--bad)';
    else if(isToday)dot='background:var(--ok)';
    else dot='background:var(--warn)';
    return`<div class='wk-day${isToday?' today':''}${isViewing?' viewing':''}' data-action='view-day' data-dow='${i}'>
      <div class='wk-dn'${isCompleted?" style='color:var(--ok)'":''}>${isCompleted?'✓':DOW[i].slice(0,1)}</div>
      <div class='wk-dot' style='${dot}'></div>
    </div>`;
  }).join('');

  // Determine which day to show (viewDay or today)
  const showDow=S.viewDay!=null?S.viewDay:dow;
  const showDay=S.program.week[showDow];
  const isViewingOther=S.viewDay!=null&&S.viewDay!==dow;

  function dayCard(d,displayDow,isActualToday){
    // Handle custom workout days
    if(d && d.customWorkout && d.customLog) {
      const log = d.customLog;
      const exList = log.exercises.slice(0,3).map(ex =>
        `<div class='t-ex'><span style='color:var(--acc)'>•</span> ${ex.name} ${ex.sets?.length || 1}×${ex.sets?.[0]?.reps || ex.reps}</div>`
      ).join('');
      const moreText = log.exercises.length > 3 ? `<div class='t-ex' style='color:var(--mut)'>+${log.exercises.length-3} more exercises</div>` : '';

      return `<div class='today' style='border-color:var(--acc);background:linear-gradient(135deg,var(--surf2) 0%,rgba(129,140,248,.04) 100%)'>
        <div class='t-lbl' style='color:var(--acc)'>${isActualToday?'Today · ':''}Custom Workout</div>
        <div class='t-name'>${log.dayName}</div>
        <div class='t-desc'>Logged custom workout · Week adapted for recovery</div>
        <div class='t-exlist' style='margin-bottom:12px'>${exList}${moreText}</div>
        ${isActualToday?`<button class='btn btn-g btn-sm' data-action='log-custom-workout' data-dow='${displayDow}' style='width:100%'>📝 Log Another Workout</button>`:''}
      </div>`;
    }

    // Handle planned custom workout days
    if(d && d.plannedCustomWorkout && d.plannedCustomLog) {
      const log = d.plannedCustomLog;
      const exList = log.exercises.slice(0,3).map(ex =>
        `<div class='t-ex'><span style='color:var(--warn)'>📅</span> ${ex.name} ${ex.sets?.length || 1}×${ex.sets?.[0]?.reps || ex.reps}</div>`
      ).join('');
      const moreText = log.exercises.length > 3 ? `<div class='t-ex' style='color:var(--mut)'>+${log.exercises.length-3} more exercises</div>` : '';

      return `<div class='today' style='border-color:var(--warn);background:linear-gradient(135deg,var(--surf2) 0%,rgba(251,191,36,.04) 100%)'>
        <div class='t-lbl' style='color:var(--warn)'>${isActualToday?'Today · ':''}Planned Workout</div>
        <div class='t-name'>${log.dayName}</div>
        <div class='t-desc'>Week adapted around planned workout</div>
        <div class='t-exlist' style='margin-bottom:12px'>${exList}${moreText}</div>
        <div style='display:flex;gap:8px'>
          ${isActualToday?`<button class='btn btn-p btn-sm' data-action='log-custom-workout' data-dow='${displayDow}' style='flex:1'>📝 Complete Workout</button>`:`<button class='btn btn-g btn-sm' data-action='log-custom-workout' data-dow='${displayDow}' style='flex:1'>📝 Log Workout</button>`}
          <button class='btn btn-g btn-sm' data-action='cancel-planned-workout' data-dow='${displayDow}' style='flex:1'>❌ Cancel</button>
        </div>
      </div>`;
    }

    const isCompleted=completedDows.has(displayDow);
    // Loaded BEFORE the rest-day check — a full regeneration can mark this
    // dow as rest even though it was actually trained; the log is unaffected
    // by that and remains the source of truth for whether/what was done.
    const loggedSess=isCompleted?getLoggedSessionForDow(displayDow):null;

    if((!d||d.rest)&&!loggedSess){
      // A century-only lunch has no lifting session by design, so it arrives
      // here looking exactly like a rest day. Say what it actually is.
      const centuryOnly=centuryOnlyDow(displayDow);
      const label=centuryOnly?'🎯 Century Day'
        :isActualToday?(isSunday?'Sunday · Plan Your Week':'Rest Day 😴'):(DOW[displayDow]+' · Rest');
      return isActualToday&&isSunday
        ?`<div class='today' style='border-color:rgba(251,191,36,.35);background:linear-gradient(135deg,var(--surf2) 0%,rgba(251,191,36,.04) 100%)'>
            <div class='t-lbl' style='color:var(--warn)'>Sunday · Plan Your Week</div>
            <div class='t-name'>Set Up This Week</div>
            <div class='t-desc'>Tap "Edit" on the Weekly Goal card below to schedule sessions and set your calorie goal.</div>
            ${centuryHTML()}
            ${recoveryHTML(displayDow)}
          </div>`
        :`<div class='today'><div class='t-lbl'>${isActualToday?'Today':DOW[displayDow]}</div><div class='t-name'>${label}</div><div class='t-desc'>${centuryOnly?'No lifting programmed — 100 pull-ups fills the 40-minute lunch on its own.':(isActualToday?'Recovery is where the growth happens.':'')}</div>${isActualToday?`<button class='btn btn-g btn-sm' data-action='build-custom-session' style='margin-top:8px;width:100%'>&#128296; Build My Own Workout</button>`:''}${isActualToday?centuryHTML():''}${isActualToday?recoveryHTML(displayDow):''}</div>`;
    }
    // The plan's own view of this dow — null when the (possibly regenerated)
    // program disagrees with what was actually logged (marks it rest, or is
    // simply absent). All fields below fall back to the log in that case.
    const dd=(d&&!d.rest)?d:null;
    const exRow=e=>{
      const exp=S.viewExDetail===e.id;
      const lw=S.lastWeights?.[e.id];
      const prog=progression(e.id,e.rMax);
      const estP=(!prog&&!e.noWeight&&(!e.isTimed||timedLoaded(e)))?estimateStartingWeight(e.id,S.logs,MOVEMENT_CLASS):null;
      const detail=exp?`<div style='margin:4px 0 4px 0;padding:8px;background:var(--surf2);border-radius:8px;font-size:12px'>
        ${(()=>{const isDbEd=e.eq?.includes('dumbbells')&&!e.eq?.includes('barbell');const wUnitEd=isDbEd?'lb ea':'lb';return prog?`<div style='margin-bottom:8px'>Last: <strong>${prog.summary}</strong> &nbsp;→&nbsp; <span style='color:var(--acc)'>Goal: ${prog.suggest} ${wUnitEd}</span></div>`:estP?`<div style='margin-bottom:8px'>No history yet — <span style='color:var(--acc)'>estimated start ~${estP.weight} ${wUnitEd}</span> · ${estP.confidence} confidence (${estBasisLabel(estP)}). Adjust if needed:</div>`:`<div style='color:var(--mut);margin-bottom:8px'>No history on this device — enter your last session:</div>`;})()}
        <div style='display:flex;gap:6px;align-items:center;margin-bottom:${e.cue?'8px':'0'}'>
          <input type='number' id='ew-${e.id}' placeholder='${e.eq?.includes('dumbbells')&&!e.eq?.includes('barbell')?'lb ea':'lb'}' value='${lw?.weight||''}' class='ni' step='5' min='0' inputmode='decimal' style='width:72px'>
          <input type='number' id='er-${e.id}' placeholder='reps' value='${lw?.reps||''}' class='ni' min='1' max='50' inputmode='numeric' style='width:60px'>
          <button class='btn btn-s btn-sm' data-action='save-ex-weight' data-exid='${e.id}' style='flex:1'>Save</button>
        </div>
        ${e.cue?`<div style='color:var(--mut);line-height:1.6;padding-top:8px;border-top:1px solid var(--bdr)'>${e.cue}</div>`:''}
        ${feelFor(e)?`<div style='color:var(--acc);line-height:1.6;padding-top:8px'>🎯 <strong>Feel it:</strong> ${feelFor(e)}</div>`:''}
      </div>`:'';
      // Only the NAME ROW is the click target — detail panel sits outside it so inputs don't collapse the panel
      return`<div class='t-ex' style='flex-direction:column;align-items:flex-start'>
        <div data-action='view-ex-detail' data-exid='${e.id}' style='display:flex;align-items:center;gap:6px;width:100%;cursor:pointer'>
          <span style='width:8px;height:8px;border-radius:50%;background:${MCOL[e.muscle]};flex-shrink:0;display:inline-block'></span>${e.name}<span style='font-size:11px;color:var(--mut);margin-left:auto'>${lw?lw.weight+' lb':'tap'}</span>
        </div>
        ${detail}
      </div>`;
    };
    // A completed day shows what was actually logged, not the (possibly since-
    // regenerated) planned template.
    const dispName=loggedSess?loggedSess.dayName:dd.name;
    const dispDesc=loggedSess?`Completed · ${loggedSess.exercises.length} exercise${loggedSess.exercises.length!==1?'s':''} logged`:dd.desc;
    const exList=loggedSess?loggedExRows(loggedSess):dd.exercises.slice(0,3).map(exRow).join('');
    const makeupNote=isActualToday&&missed.length>0?`<div style='font-size:12px;color:var(--bad);margin-bottom:10px'>⚡ +${missed.length} make-up exercise${missed.length>1?'s':''} added (${missed.map(m=>DOW[m]).join(', ')} missed)</div>`:'';
    const completedBanner=isCompleted?`<div style='display:flex;align-items:center;gap:8px;margin-bottom:10px;padding:10px 12px;background:rgba(74,222,128,.08);border:1px solid rgba(74,222,128,.3);border-radius:10px'><span style='font-size:16px'>✅</span><span style='font-size:13px;font-weight:700;color:var(--ok)'>Completed${isActualToday?' today':''} — nice work!</span></div>`:'';
    const lunchBadge=dd?.isLunch?`<span class='badge badge-lunch' style='margin-left:8px'>YMCA · 35–40 min</span>`:`<span class='badge badge-eve' style='margin-left:8px'>${dd?.sessionMins||60} min</span>`;
    // Evening session block
    let eveBlock='';
    if(dd?.eveningSession){
      const eveExs=dd.eveningSession.exercises.slice(0,3).map(exRow).join('');
      // On a prescribed-Pyramid night, say so HERE — this is the button he'd
      // otherwise tap, and a prescription further down the card is one he can
      // scroll past. The lifting session stays fully available underneath.
      const rxNote=isActualToday&&pyramidPrescription()
        ?`<div style='margin-top:8px;padding:8px 10px;background:rgba(249,115,22,.1);border:1px solid rgba(249,115,22,.35);border-radius:8px;font-size:11px;color:var(--mut);line-height:1.6'>⭐ <strong style='color:#f97316'>The Pyramid is tonight's call</strong> — no barbell here and ${getEveningMins()} min to work with. See the card below; this lifting session is the alternative, not both.</div>`
        :'';
      // An evening hosting the century isn't charged an exercise for it (see
      // centuryChargeFor — it absorbs the minutes by running long instead), so
      // say out loud that tonight is longer than the number on the label.
      const centuryNote=isActualToday&&centuryHostSession(displayDow)==='eve'&&centuryBudgetToday()>0
        ?`<div style='font-size:11px;color:var(--mut);margin-top:6px'>🎯 The century is booked into tonight — allow about <strong style='color:var(--txt)'>${centuryBudgetToday()} min</strong> on top of the ${dd.eveningSession.mins}. Your lunch keeps its full lift count because of it.</div>`
        :'';
      eveBlock=`<div style='margin-top:12px;padding-top:12px;border-top:1px solid var(--bdr)'>
        <div style='font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--acc);margin-bottom:6px'>After Work · ${dd.eveningSession.mins} min</div>
        ${centuryNote}
        <div style='font-size:14px;font-weight:700;margin-bottom:4px'>${dd.eveningSession.name}</div>
        <div class='t-exlist'>${eveExs}</div>
        ${rxNote}
        ${isActualToday?`<button class='btn ${pyramidPrescription()?'btn-g':'btn-s'}' data-action='start-workout' data-session='eve' style='margin-top:8px'>Start Evening Workout →</button>`:''}
      </div>`;
    }
    return`<div class='today'${isCompleted?" style='border-color:rgba(74,222,128,.4)'":''}>
      <div class='t-lbl' style='display:flex;align-items:center;flex-wrap:wrap;gap:4px'>${isActualToday?'Today':''}${isActualToday?' · ':''}${DOW[displayDow]}${lunchBadge}${isCompleted?`<span class='badge' style='margin-left:8px;background:rgba(74,222,128,.15);color:var(--ok)'>✓ Completed</span>`:''}</div>
      <div class='t-name'>${dispName}</div>
      <div class='t-desc'>${dispDesc}</div>
      <div class='t-exlist'>${exList}</div>
      ${completedBanner}
      ${makeupNote}
      ${isActualToday&&!isCompleted?`<button class='btn btn-p' data-action='start-workout' data-session='lunch'>Start${dd?.eveningSession?' Lunch':''} Workout →</button>`:''}
      ${isActualToday&&isCompleted?`<button class='btn btn-g btn-sm' data-action='start-workout' data-session='lunch' style='width:100%'>↻ Repeat Workout</button>`:''}
      ${isActualToday?`<button class='btn btn-g btn-sm' data-action='build-custom-session' style='margin-top:8px;width:100%'>&#128296; Build My Own Workout</button>`:''}
      ${displayDow > todayDow() || (displayDow === 0 && todayDow() < 6) ?
        `<button class='btn btn-g btn-sm' data-action='plan-custom-workout' data-dow='${displayDow}' style='margin-top:8px;width:100%'>📅 Plan Custom Workout</button>` :
        `<button class='btn btn-g btn-sm' data-action='log-custom-workout' data-dow='${displayDow}' style='margin-top:8px;width:100%'>📝 ${isActualToday?'Log Custom Workout Instead':'Log Custom Workout'}</button>`
      }
      ${eveBlock}
      ${isActualToday&&dd?.isLunch?lunchBudgetHTML(displayDow):''}
      ${isActualToday&&S.cfg.conditioning?finisherHTML(displayDow,true,!!dd?.isLunch&&!dd?.eveningSession,dd?.eveningSession?.equipmentKey||dd?.equipmentKey):''}
      ${isActualToday?centuryHTML():''}
      ${isActualToday?pyramidHTML(dd):''}
      ${isActualToday?cindyHTML(dd):''}
      ${isActualToday?emomHTML(dd):''}
      ${isActualToday?dailySpineHTML():''}
    </div>`;
  }

  let todayHTML=dayCard(showDay,showDow,!isViewingOther);
  if(isViewingOther){
    todayHTML=`<div style='display:flex;align-items:center;gap:8px;margin-bottom:8px'>
      <button class='btn btn-g btn-sm' data-action='view-day' data-dow='${S.viewDay}' style='width:auto'>← Back to Today</button>
      <span style='font-size:13px;color:var(--mut)'>Viewing ${DOW[showDow]}</span>
    </div>${todayHTML}`;
  }

  const entry=getCalEntry();
  const cardio=calcWeekCardio();
  let cardioHTML='';
  if(cardio){
    if(cardio.cardioCalsNeeded<=0){
      cardioHTML=`<div class='prog-hint' style='margin-top:10px'>✅ Strength covers your goal!</div>`;
    } else {
      const rows=cardio.options.map(o=>`<div class='cardio-row${o.busy?' cardio-busy':''}'>
        <div class='cr-icon'>${o.icon}</div>
        <div class='cr-body'><div class='cr-name'>${o.name}${o.busy?`<span class='cr-busy-tag'>often busy</span>`:''}</div><div class='cr-note'>${o.note}</div></div>
        <div class='cr-right'><div class='cr-dur'>${o.min} min</div><div class='cr-dist'>${o.dist}</div></div>
      </div>`).join('');
      cardioHTML=`<div style='margin-top:10px;padding-top:10px;border-top:1px solid var(--bdr)'>
        <div class='sec-lbl' style='margin-bottom:6px'>Daily Cardio · ${cardio.calsPerDay} cal/day</div>
        <div class='cardio-list'>${rows}</div>
        <div style='font-size:11px;color:var(--mut);margin-top:8px'>${cardio.cardioCalsNeeded} cardio cal target · ${cardio.daysLeft} days left · lifting burns ~${cardio.strengthCals} cal on top</div>
      </div>`;
    }
  }

  // VO2 max protocol — offered on days whose evening is NOT a lifting session
  // (rest days, weekends, cardio evenings). Aerobic only: never touches MRV.
  // Viewing a PAST day of this week retargets the card to THAT day, so a
  // forgotten session (Friday's Norwegian 4×4 remembered on Saturday) is
  // saved with Friday's date — recovery and history logic key off log dates.
  let vo2HTML='';
  {
    const viewDow2=S.viewDay!=null?S.viewDay:dow;
    const isBackdate=viewDow2!==dow;
    const isPastDay=viewDow2<dow; // week grid covers the current Sun–Sat only
    if(!isBackdate||isPastDay){
      const todayD=todayDay();
      const eveningFree=!todayD||todayD.rest||!todayD.eveningSession;
      // Backdating skips the evening-free gate: it records what actually
      // happened, even on a day that also had a lifting session.
      if(isBackdate||eveningFree){
        const proto=currentVO2Protocol();
        const targetDateStr=isBackdate?addDays(todayStr(),viewDow2-dow):todayStr();
        const tomorrow=S.program?.week[(dow+1)%7];
        const legsTomorrow=!isBackdate&&!!(tomorrow&&!tomorrow.rest&&(tomorrow.exercises||[]).some(e=>e.muscle==='legs'&&e.type==='compound'));
        const doneThatDay=vo2History().some(l=>logDay(l.date)===targetDateStr);
        vo2HTML=`<div style='margin-top:10px;padding-top:10px;border-top:1px solid var(--bdr)'>
        <div class='sec-lbl' style='margin-bottom:6px'>Aerobic Engine · ${isBackdate?`Log for ${DOW[viewDow2]}`:'Evening Protocol'}${proto.lvl?` · Session ${proto.lvl+1}`:''}</div>
        <div class='cardio-row'>
          <div class='cr-icon'>${proto.icon}</div>
          <div class='cr-body'><div class='cr-name'>${proto.name}</div><div class='cr-note'>${proto.desc}</div></div>
          <div class='cr-right'><div class='cr-dur'>${proto.mins} min</div><div class='cr-dist'>aerobic</div></div>
        </div>
        ${legsTomorrow?`<div style='font-size:11px;color:var(--warn);margin-top:6px'>${proto.benchmark?`⚠️ Legs are programmed tomorrow — the max row test hits like a heavy session. Shift the test to another evening.`:`⚠️ Legs are programmed tomorrow — keep the easy portions truly easy, or shift this to another evening.`}</div>`:''}
        ${doneThatDay
          ?`<div class='prog-hint' style='margin-top:8px'>✅ VO2 session logged ${isBackdate?DOW[viewDow2]:'today'}</div>`
          :`<button class='btn btn-s btn-sm' data-action='log-vo2-session' data-date='${targetDateStr}' style='margin-top:8px;width:100%'>🫀 Log Engine Session Done${isBackdate?` — for ${DOW[viewDow2]}`:''}</button>`}
        <div style='font-size:11px;color:var(--mut);margin-top:6px'>${isBackdate?`Saves to ${DOW[viewDow2]} ${targetDateStr} — tap "Back to Today" when done. `:''}${proto.benchmark?`Benchmark session — every 8th engine session is the 20-min max row; progression is beating your last distance.`:`+1 interval every 4 sessions, protocols alternate. Doesn't count against lifting MRV or the two-session daily cap.`}</div>
      </div>`;
      }
    }
  }
  const planCard=`<div class='card' style='margin-bottom:14px'>
    <div style='display:flex;justify-content:space-between;align-items:center;margin-bottom:8px'>
      <div class='sec-lbl' style='margin-bottom:0'>Weekly Goal</div>
      <button class='btn btn-p btn-sm' data-action='go-plan' style='width:auto'>${isSunday?'Plan Week →':'Edit →'}</button>
    </div>
    ${entry
      ?`<div style='font-size:13px;color:var(--mut)'>Burn <strong style='color:var(--txt)'>${entry.cals.toLocaleString()}</strong> cal &nbsp;·&nbsp; ${entry.startDate} → ${entry.endDate}</div>`
      :`<div style='font-size:13px;color:var(--mut)'>No goal set — tap ${isSunday?'"Plan Week"':'"Edit"'} to configure.</div>`}
    ${cardioHTML}
    ${vo2HTML}
  </div>`;

  const recentLogs=S.logs.slice(-3).reverse().map(l=>`
    <div class='card2 mb8' style='display:flex;align-items:center;gap:10px'>
      <div data-action='edit-log' data-id='${l.id}' style='cursor:pointer;flex:1;min-width:0'>
        <div style='display:flex;justify-content:space-between;align-items:center;gap:8px'>
          <span style='font-size:13px;font-weight:600'>${l.dayName}</span>
          <span style='font-size:12px;color:var(--mut);flex-shrink:0'>${fmtDate(l.date)}</span>
        </div>
        <div style='font-size:12px;color:var(--mut);margin-top:2px'>${l.exercises.length} exercises · ${fmtDur(l.duration)} · <span style='color:var(--acc)'>tap to view/edit</span></div>
      </div>
      <button class='done-btn' data-action='delete-log' data-id='${l.id}' title='Delete workout' style='background:var(--bad2);color:var(--bad);flex-shrink:0'>🗑️</button>
    </div>`).join('');

  return`<div class='view rag v-dash'>
    <div class='masthead'>
      <div class='mh-title'><span class='mh-l1'>My</span><span class='mh-l2'>Program</span></div>
      <span class='mh-side'>This Week</span>
    </div>
    <div class='wk-grid'>${wkGrid}</div>
    ${bentoHTML}
    ${renderRecoveryBanner()}
    ${todayHTML}
    ${planCard}
    ${renderMRVWidget()}
    ${recentLogs?`<div class='sec-lbl mt16'>Recent</div>${recentLogs}`:''}
    ${renderCloudCard()}
  </div>${renderNav('dash')}`;
}

function renderSwapSearchResults(query,exIdx){
  const q=(query||'').toLowerCase().trim();
  if(!q)return`<div style='font-size:13px;color:var(--mut)'>Type to search all ${EX.length+(S.customExercises||[]).length} exercises…</div>`;
  const ex=S.active?.exercises?.[exIdx];
  const allEx=[...EX,...(S.customExercises||[])];
  const matches=allEx.filter(e=>
    e.id!==(ex?.id) &&
    !S.active.exercises.some(ae=>ae.id===e.id) &&
    !(S.cfg.hipCaution&&e.hipRisk) &&
    !plyoHidden(e) &&
    !kneeCautionBlocks(e) &&
    !userAvoids(e) &&
    (e.name.toLowerCase().includes(q)||e.muscle.toLowerCase().includes(q)||e.type.toLowerCase().includes(q)||(e.tags||[]).some(t=>t.toLowerCase().includes(q)))
  ).slice(0,15);
  if(!matches.length)return`<div style='font-size:13px;color:var(--mut)'>No matches for "${query.replace(/</g,'&lt;')}"</div>`;
  // Dragon Flag tiers still surface when locked (rather than vanish silently),
  // shown disabled with what's needed to unlock — so the progression is
  // discoverable, not a dead end you'd only find by luck once qualified.
  return matches.map(a=>{
    if(!dragonFlagUnlocked(a.id)){
      const idx=DRAGON_FLAG_TRACK.indexOf(a.id);
      const prereqName=allEx.find(e=>e.id===DRAGON_FLAG_TRACK[idx-1])?.name||'the prior tier';
      return`<div class='btn btn-g btn-sm' style='margin-bottom:6px;justify-content:flex-start;text-align:left;width:100%;opacity:.5;cursor:default'><span>🔒 ${a.name}</span><span style='color:var(--mut);font-size:11px;margin-left:6px'>log 10 reps of ${prereqName} to unlock</span></div>`;
    }
    return`<button class='btn btn-g btn-sm' style='margin-bottom:6px;justify-content:flex-start;text-align:left;width:100%' data-action='swap-ex' data-idx='${exIdx}' data-id='${a.id}'><span>${a.name}</span><span style='color:var(--mut);font-size:11px;margin-left:6px'>${a.muscle} · ${a.type}</span></button>`;
  }).join('');
}

// ─────────────────────────────────────────────
// CLUSTER SETS (2026-08-30)
// ─────────────────────────────────────────────
// From the paired-set workouts Sam brought in: *"Do Cluster Sets if you can't do 3
// sets of 5 reps. Perform 1 rep, rest 15-30 sec then repeat 2-4 more times."*
//
// The condition is the interesting half, because the app can actually EVALUATE it
// rather than leaving Sam to judge mid-set — and it is the same self-scaling shape
// the Century runs on: the TARGET never moves, the prescription underneath it does,
// and it retires itself the moment the logs say it is no longer needed.
//
// EVIDENCE, in the same spirit as loggedBaseline: the best UNBROKEN set actually
// recorded for this exact movement. Grip and added load change the number
// completely, so weighted pull-ups, chin-ups and neutral-grip pull-ups each carry
// their own history rather than sharing one. The one alias is the Century, whose
// sets are logged under 'pullup_century' and ARE sets of pull-ups — the same
// EX_ID_ALIASES entry that already exists so secondary credit works.
//
// Consequence worth knowing up front: because Sam does Centuries, bodyweight
// pull-ups will essentially never trigger this — his best unbroken set is far past
// 5. That is correct, not a dud feature. Where it will fire is WEIGHTED pull-ups
// (rMin 3 / rMax 6 by design) and any bar variation he hasn't built up yet.
const CLUSTER_TRIGGER_REPS=5;   // "3 sets of 5" — the bar named in the protocol
const CLUSTER_TARGET_SETS=3;
const CLUSTER_REST_LO=15, CLUSTER_REST_HI=30;
const CLUSTER_MIN_REPEATS=2, CLUSTER_MAX_REPEATS=4;

// Vertical pulling only. Keyed on the tag rather than an id list, so a movement
// added to that family later is covered without editing this — the same rule
// SECONDARY_CREDIT_RULES follows and for the same reason.
function clusterEligible(ex){
  return !!(ex&&ex.type==='compound'&&(ex.tags||[]).includes('vertical'));
}

// Best unbroken set ever logged for this movement. Deliberately ALL history, not a
// rolling window: this decides whether a rep target has been PROVEN, and proof
// doesn't expire the way current form does (which is what CENTURY_BEST_WINDOW is
// for). Undoing that would put a lifter back on clusters after a quiet fortnight.
function bestUnbrokenReps(exId){
  let best=0;
  (S.logs||[]).forEach(l=>{
    (l.exercises||[]).forEach(e=>{
      if((EX_ID_ALIASES[e.id]||e.id)!==exId)return;
      (e.sets||[]).forEach(s=>{if(s&&s.reps>best)best=s.reps;});
    });
  });
  return best;
}

// null when clusters don't apply. Otherwise the prescription plus the number that
// triggered it, so the workout screen never silently changes what it's asking for.
function clusterPlan(ex){
  if(!clusterEligible(ex))return null;
  const best=bestUnbrokenReps(ex.id);
  // No history at all is NOT a trigger. An unknown is not a weakness, and guessing
  // "you probably can't" would open every new bar variation on a remedial protocol.
  if(best<=0||best>=CLUSTER_TRIGGER_REPS)return null;
  const total=Math.max(CLUSTER_TRIGGER_REPS,ex.rMax||CLUSTER_TRIGGER_REPS);
  return{best,total,
    repeats:Math.min(CLUSTER_MAX_REPEATS,Math.max(CLUSTER_MIN_REPEATS,total-1)),
    restLo:CLUSTER_REST_LO,restHi:CLUSTER_REST_HI};
}

function clusterHTML(ex){
  const c=clusterPlan(ex);
  if(!c)return'';
  return`<div class='wu-box' style='border-color:rgba(129,140,248,.35);background:rgba(129,140,248,.05);margin-bottom:14px'>
    <div class='wu-title' style='color:var(--acc)'>🔗 Cluster this one — best unbroken set on record is ${c.best}</div>
    <div class='wu-note' style='margin-top:0'>Under ${CLUSTER_TRIGGER_REPS} clean reps, ${CLUSTER_TARGET_SETS}×${CLUSTER_TRIGGER_REPS} straight sets turns into a grind and the last reps stop being pull-ups. Do <strong style='color:var(--txt)'>1 rep, rest ${c.restLo}–${c.restHi} sec, repeat ${c.repeats > CLUSTER_MIN_REPEATS ? `${CLUSTER_MIN_REPEATS}–${c.repeats}` : c.repeats} more times</strong> — same total reps, every one of them crisp. Log the cluster as one set of ${c.total}.</div>
    <div class='wu-note'>This retires itself: the moment you log a clean unbroken set of ${CLUSTER_TRIGGER_REPS}, the card stops appearing and you go back to straight sets.</div>
  </div>`;
}

// ── The partner half of a pair, rendered inside the leader's card ──
// Deliberately NOT a second full exercise card. The pair is one station, so what
// the partner needs is what you read between rounds: its name, its prescription,
// its cue, and its own set rows. The heavy furniture (prep, warm-up ramp, swap
// panel, progression hints) belongs to the station and is already above.
//
// The set-row element ids are the SAME convention the leader's rows use —
// sr-/w-/r-/db- keyed on the partner's real index in S.active.exercises — which is
// the whole reason this needs no change to completeSet. The rows log to the right
// exercise because their ids say which one they are.
function pairPartnerHTML(pIdx){
  const exs=S.active?.exercises||[];
  const ex=exs[pIdx];
  if(!ex)return'';
  const mcolor=MCOL[ex.muscle]||'var(--acc)';
  const scaleDef=exScale(ex);
  const isNoWeight=ex.noWeight===true,isTimed=ex.isTimed===true;
  const isLoadedTimed=timedLoaded(ex);
  const hideWeight=(isNoWeight&&!scaleDef)||(isTimed&&!isLoadedTimed);
  const prog=progression(ex.id,ex.rMax);
  const progHasW=!!prog&&prog.weight>0;
  const est=(!isNoWeight&&!scaleDef&&(!isTimed||isLoadedTimed)&&(!prog||(isLoadedTimed&&!progHasW)))
    ?(ex.estW||estimateStartingWeight(ex.id,S.logs,MOVEMENT_CLASS)):null;
  const isDb=!!(ex.eq?.includes('dumbbells')&&!ex.eq?.includes('barbell'));
  const wUnit=scaleDef?scaleDef.unit:isDb?'lb ea':'lb';
  const baseW=prog?prog.suggest:(est?est.weight:null);
  const repRange=isTimed?`${ex.rMin}–${ex.rMax}s`:`${ex.rMin}–${ex.rMax}`;
  const rowGrid=hideWeight?'grid-template-columns:36px 64px 1fr 42px':'';
  const target=hideWeight
    ?`${repRange}${isTimed?'':' reps'}`
    :`${baseW!=null?baseW+' '+wUnit:'pick a weight'} × ${repRange}`;
  const basis=prog?`last time ${prog.summary}`:(est?`${est.confidence} confidence · ${estBasisLabel(est)}`:'first time — start conservative');
  const rows=Array.from({length:ex.sets},(_,i)=>{
    const done=ex.done[i];
    return`<div class='set-row${done?' done':''}' id='sr-${pIdx}-${i}' style='${rowGrid}'>
      <div class='sn'>${i+1}</div>
      <div class='st'>${repRange}</div>
      ${hideWeight?'':`<input class='ni' type='number' id='w-${pIdx}-${i}' placeholder='${scaleDef?scaleDef.unit:isDb?'each':'lb'}' value='${done?done.weight:(baseW!=null?baseW:'')}' min='0' step='5' inputmode='decimal' ${done?'disabled':''}>`}
      <input class='ni' type='number' id='r-${pIdx}-${i}' placeholder='${isTimed?'sec':'reps'}' value='${done?done.reps:ex.rMax}' min='0' max='${isTimed?300:50}' inputmode='numeric' ${done?'disabled':''}>
      <button class='done-btn' id='db-${pIdx}-${i}' data-action='${done?'undo-set':'done-set'}' data-ex='${pIdx}' data-set='${i}'>${done?'↩':'→'}</button>
    </div>`;
  }).join('');
  return`<div style='margin-top:16px;padding-top:14px;border-top:2px solid ${mcolor}55'>
    <div style='display:flex;align-items:center;gap:8px;margin-bottom:2px'>
      <span style='font-size:12px;font-weight:800;letter-spacing:1px;color:${mcolor}'>${ex.pairId}2</span>
      <span style='font-size:17px;font-weight:800'>${ex.name}</span>
    </div>
    <div style='font-size:12px;color:var(--mut);margin-bottom:8px'>${MNAME[ex.muscle]||ex.muscle} · ${target} · ${basis}</div>
    ${cueBlockHTML(ex,mcolor)}
    <div class='sets-hdr' style='${rowGrid};margin-top:10px'>
      <div>Set</div><div>Target</div>${hideWeight?'':'<div>Weight</div>'}<div>${isTimed?'Sec':'Reps'}</div><div></div>
    </div>
    ${rows}
  </div>`;
}

// "Station 2 of 3" once pairing is on, "Exercise 2 of 4" otherwise. A pair counts
// once — it is one stop on the way through the session, and counting its halves
// separately makes the progress line skip numbers as you advance.
function stationLabel(exs,idx){
  const isSecond=(e)=>e&&e.pairId&&e.pairPos===2;
  const stations=exs.filter(e=>!isSecond(e)).length;
  const at=exs.slice(0,idx+1).filter(e=>!isSecond(e)).length;
  const paired=exs.some(e=>e&&e.pairId);
  return `${paired?'Station':'Exercise'} ${at} of ${stations}`;
}

// EMOM banner for a custom session run on the minute. The clock replaces the rest
// timer entirely (see completeSet), so this has to say what the instrument is.
function emomBannerHTML(){

  const mins=S.active.emomMins||0;

    <div class='wu-note' style='margin-top:0'>One set at the top of every minute, cycling through your movements. Whatever is left of the minute is the rest &mdash; so there is no rest timer here, the clock is the timer. If a set runs past about 40 seconds, drop a rep rather than borrowing the next minute.</div>
  </div>`;
}

// The banner that explains the station, above everything else in the card.
function pairBannerHTML(ex,partner){
