// RENDER – PROGRAM
// ─────────────────────────────────────────────
function renderProgram(){
  const dow=todayDow();
  const cardio=calcWeekCardio();
  const missed=getMissedDays();
  const completedDows=getCompletedDows();
  const cardioBlurb=cardio&&cardio.calsPerDay>0
    ?cardio.options.slice(0,3).map(o=>`${o.icon} ${o.name}: ${o.min} min${o.dist&&o.dist!=='—'?' · '+o.dist:''}`).join(' · ')
    :'';

  const exRow=e=>`<div class='pg-ex'><div class='pg-dot' style='background:${MCOL[e.muscle]}'></div>${e.name} <span style='color:var(--mut);font-size:12px'>· ${e.sets}×${e.rMin}–${e.rMax}${e.isTimed?'s':''}</span></div>`;

  const days=S.program.week.map(d=>{
    const isToday=d.dow===dow;
    const isCompleted=completedDows.has(d.dow);
    // Loaded BEFORE the rest/skip check — a full regeneration can mark this
    // dow as rest even though it was actually trained; the log is unaffected
    // by that and remains the source of truth for whether/what was done.
    const loggedSess=isCompleted?getLoggedSessionForDow(d.dow):null;
    const isSkipped=!d.rest&&!isCompleted&&isDaySkipped(d.dow);
    const isMissed=!d.rest&&!isSkipped&&!isCompleted&&missed.includes(d.dow);
    if((d.rest||isSkipped)&&!loggedSess){
      if(d.dow===0||d.dow===6)return''; // skip weekend rest rows
      let cn='';
      if(cardio&&cardio.calsPerDay>0&&!isSkipped){
        cn=`<div style='margin-top:8px;padding-top:8px;border-top:1px solid var(--bdr)'>
          <div style='font-size:11px;color:var(--warn);font-weight:700;margin-bottom:4px'>+ Daily Cardio · ${cardio.calsPerDay} cal</div>
          <div style='font-size:11px;color:var(--mut)'>${cardioBlurb}</div>
        </div>`;
      }
      return`<div class='pg-day${isToday?' today-day':''}${isSkipped?' pg-skip':''}'>
        <div class='pg-dh'><div class='pg-dn' style='color:var(--mut)'>${DOW[d.dow]}</div><span style='font-size:12px;color:var(--mut)'>${isSkipped?'Skipped this week':'Rest'}${!isSkipped&&cardio&&cardio.calsPerDay>0?' + Cardio':''}</span></div>
        ${cn}
      </div>`;
    }
    // The plan's own view of this dow — null when the (possibly regenerated)
    // program disagrees with what was actually logged (marks it rest). All
    // fields below fall back to the log in that case.
    const dd=(d&&!d.rest)?d:null;
    const badge=dd?.isLunch?`<span class='badge badge-lunch'>YMCA · 35–40 min</span>`:`<span class='badge badge-eve'>${dd?.sessionMins||60} min</span>`;
    const missedTag=isMissed?`<span style='font-size:11px;color:var(--bad);font-weight:700;margin-left:6px'>⚠️ missed</span>`:'';
    const completedTag=isCompleted?`<span style='font-size:11px;color:var(--ok);font-weight:700;margin-left:6px'>✓ completed</span>`:'';
    // Completed days display the actual logged session, not the planned template.
    const exList=loggedSess?loggedExRows(loggedSess):(dd?.exercises||[]).map(exRow).join('');
    let eveBlock='';
    if(dd?.eveningSession){
      const eveList=dd.eveningSession.exercises.map(exRow).join('');
      eveBlock=`<div style='margin-top:12px;padding-top:12px;border-top:1px solid var(--bdr)'>
        <div style='font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--acc);margin-bottom:6px'>After Work · ${dd.eveningSession.name} · ${dd.eveningSession.mins} min</div>
        ${eveList}
      </div>`;
    }
    let cn='';
    if(cardio&&cardio.calsPerDay>0){
      cn=`<div style='margin-top:8px;padding-top:8px;border-top:1px solid var(--bdr)'>
        <div style='font-size:11px;color:var(--warn);font-weight:700;margin-bottom:4px'>+ Daily Cardio · ${cardio.calsPerDay} cal</div>
        <div style='font-size:11px;color:var(--mut)'>${cardioBlurb}</div>
      </div>`;
    }
    return`<div class='pg-day${isToday?' today-day':''}${isMissed?' pg-missed':''}${isCompleted?' pg-done':''}'>
      <div class='pg-dh'>
        <div><div class='pg-dn' style='display:flex;align-items:center;gap:4px;flex-wrap:wrap'>${loggedSess?loggedSess.dayName:(dd?.name||DOW[d.dow])}${completedTag}${missedTag} ${badge}</div><div class='pg-dd'>${DOW[d.dow]}</div></div>
        ${isToday?`<span style='font-size:11px;font-weight:700;color:var(--acc);background:var(--acc2);padding:3px 8px;border-radius:20px'>TODAY</span>`:''}
      </div>
      <div>${exList}</div>
      ${eveBlock}
      ${cn}
    </div>`;
  }).join('');

  const calSummary=cardio?`<div class='card' style='margin-bottom:16px'>
    <div class='sec-lbl'>Calorie Plan</div>
    ${cardio.cardioCalsNeeded<=0
      ?`<div class='prog-hint'>✅ Strength covers your goal</div>`
      :`<div style='font-size:13px;color:var(--mut)'>Strength ~${cardio.strengthCals} cal · Need ${cardio.cardioCalsNeeded} more from cardio · ${cardio.calsPerDay} cal/day · ${cardio.daysLeft} days left</div>`}
  </div>`:'';

  return`<div class='view'>
    <div class='hdg'>Weekly Program</div>
    <div class='sub'>Every movement for the week. Combo days show both the lunch and after-work sessions. Skipped days show as rest. Missed days shown in red. Set your goal and plan from the Home tab.</div>
    ${calSummary}
    ${days}
    <div class='mt16'>
      <button class='btn btn-g btn-sm' data-action='reset-program' style='width:auto'>↺ Reset &amp; reconfigure</button>
    </div>
  </div>${renderNav('program')}`;
}

    <div class='card' style='margin-bottom:16px'>
      <div style='font-size:11px;color:var(--mut);margin-bottom:4px'>Add a forgotten exercise</div>

      </div>

        <div style='flex:1'>

// Pull whatever is currently typed in the Edit Workout inputs back into the
// draft. Must run before ANY re-render of the log-edit view (add/remove
// exercise), not just on save — render() rebuilds the inputs from the draft,
// so unsynced typing would silently reset to the draft's stored values.
function syncLogEditInputs(){
  const log=S.editLogDraft;if(!log)return;
  log.exercises.forEach((ex,ei)=>{
    const isNW=ex.noWeight||EX.find(e=>e.id===ex.id)?.noWeight;
    (ex.sets||[]).forEach((s,si)=>{
      if(!isNW){const wEl=document.getElementById(`el-w-${ei}-${si}`);if(wEl)s.weight=parseFloat(wEl.value)||0;}
      const rEl=document.getElementById(`el-r-${ei}-${si}`);if(rEl)s.reps=parseInt(rEl.value)||0;
    });
  });
}

// ─── Add-exercise autocomplete for the Edit Workout view ───
function onNewLogExInput(value){
  S.newLogExName=value;
  renderNewLogExSuggest(value);
}
function renderNewLogExSuggest(value){
  const box=document.getElementById('new-log-ex-suggest');
  if(!box)return;
  const list=exSuggestList(value);
  if(!list.length){box.classList.remove('on');box.innerHTML='';return;}
  box.innerHTML=list.map(e=>
    `<div class='ex-suggest-item' data-name="${e.name.replace(/"/g,'&quot;')}" onpointerdown='pickNewLogExSuggest(this.dataset.name)'>
       <span>${e.name}</span><span class='es-mus'>${MNAME[e.muscle]||''}</span>
     </div>`
  ).join('');
  box.classList.add('on');
}
function hideNewLogExSuggest(){
  setTimeout(()=>{const box=document.getElementById('new-log-ex-suggest');if(box)box.classList.remove('on');},200);
}
function pickNewLogExSuggest(name){
  S.newLogExName=name;
  const inp=document.getElementById('new-log-ex-name');
  if(inp)inp.value=name;
  const box=document.getElementById('new-log-ex-suggest');
  if(box){box.classList.remove('on');box.innerHTML='';}
}

function renderDeletedSection(){
  const ds=S.deletedSessions||[];
  if(!ds.length)return'';
  const rows=[...ds].reverse().map(d=>`
    <div style='display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--bdr)'>
      <div style='flex:1;min-width:0'>

      </div>
      <button class='btn btn-s btn-sm' data-action='restore-log' data-id='${d.log.id}' style='width:auto;padding:7px 12px'>↩ Restore</button>
    </div>`).join('');
  return`<div class='card' style='margin-top:16px'>
    <div class='sec-lbl' style='margin-bottom:6px'>🗑️ Recently Deleted</div>

function renderHistory(){
  const pastBtn=`<button class='btn btn-s btn-sm' data-action='log-past-workout' style='margin-bottom:14px'>📅 Log a Past Workout</button>`;
  if(!S.logs.length)return`<div class='view'>
    <div class='hdg'>History</div>
    ${pastBtn}
    <div class='empty'><span style='font-size:48px;display:block;margin-bottom:12px'>📋</span>No workouts logged yet.<br>Complete your first session to start tracking progress.</div>
    ${renderDeletedSection()}
  </div>${renderNav('history')}`;

  const items=[...S.logs].reverse().map(l=>{
    const id=`log-${l.id}`;const open=S.openLogs[l.id];
    const exSummary=l.exercises.map(e=>{
      const exDef=EX.find(ex=>ex.id===e.id);
      const isNW=exDef?.noWeight;const isTm=exDef?.isTimed;
      const isDbH=!!(exDef&&exDef.eq?.includes('dumbbells')&&!exDef.eq?.includes('barbell'));
      const setStr=e.sets.map(s=>isTm?`${s.weight>0?s.weight+'lb × ':''}${s.reps}s`:isNW?`${s.reps} reps`:isDbH?`${s.weight}lb ea×${s.reps}`:`${s.weight}lb×${s.reps}`).join(' · ');
      return`<div class='log-ex'><strong>${e.name}</strong><div class='log-sets'>${setStr||'—'}</div></div>`;
    }).join('');
    const badge=l.isLunch?`<span class='badge badge-lunch' style='margin-left:6px'>Lunch</span>`:'';
    return`<div class='log-item' data-action='toggle-log' data-id='${l.id}'>
      <div class='log-hdr'><div class='log-date'>${l.dayName}${badge}</div><div style='color:var(--mut);font-size:18px'>${open?'▲':'▼'}</div></div>
      <div class='log-meta'>${fmtDate(l.date)} · ${fmtDur(l.duration)}${l.cals?` · ${l.cals} cal`:` · ${l.exercises.length} exercises`}</div>
      <div class='log-body${open?' open':''}' id='${id}'>
        ${exSummary}
        <div style='display:flex;gap:8px;margin-top:10px'>
          <button class='btn btn-s btn-sm' data-action='edit-log' data-id='${l.id}' style='flex:1'>✏️ Edit</button>
          <button class='btn btn-sm' data-action='delete-log' data-id='${l.id}' style='flex:1;background:var(--bad2);color:var(--bad)'>🗑️ Delete</button>
        </div>
      </div>
    </div>`;
  }).join('');

  return`<div class='view'>
    <div class='hdg'>Workout History</div>
    ${pastBtn}
    ${items}
    ${renderDeletedSection()}
  </div>${renderNav('history')}`;
}

function renderUndoBanner(){

// ─────────────────────────────────────────────
// CUSTOM WORKOUT HELPERS
// ─────────────────────────────────────────────
function updateCustomExercise(idx, field, value) {
  if (!S.customWorkoutLog || !S.customWorkoutLog.exercises[idx]) return;
  S.customWorkoutLog.exercises[idx][field] = value;
  // Don't save yet, just update state
}

// Find an exact database (or custom) exercise match for a typed name.
function exMatch(name) {
  if (!name || !name.trim()) return null;
  const allEx = [...EX, ...(S.customExercises||[])];
  return allEx.find(e => e.name.toLowerCase() === name.toLowerCase().trim()) || null;
}

// Common abbreviations / synonyms expanded so "BB Bench" → "barbell bench" etc.
const EX_ABBR = {
  bb:'barbell', db:'dumbbell', kb:'kettlebell', ohp:'overhead press',
  rdl:'romanian deadlift', sldl:'romanian deadlift', bw:'bodyweight',
  ext:'extension', lat:'lateral', pull:'pullup', chin:'chinup',
  sa:'single arm', sl:'single leg'
};

// Normalize an exercise name into a list of comparable tokens.
function exTokens(s) {
  if (!s) return [];
  let t = s.toLowerCase().trim().replace(/[^a-z0-9\s]/g, ' ');
  // Canonicalize "X up" compounds so "situps", "sit ups" and "sit-ups" all
  // converge to one token — same for push/pull/chin/step/lay/leg up(s).
  t = t.replace(/\b(push|pull|sit|chin|step|lay|leg|hand|knee)\s+ups?\b/g, '$1up');
  let tokens = t.split(/\s+/).filter(Boolean).map(w => EX_ABBR[w] || w);
  tokens = tokens.join(' ').split(/\s+/).filter(Boolean);
  // crude singularize so "curls"/"squats"/"press" compare consistently
  tokens = tokens.map(w => (w.length > 3 && w.endsWith('s')) ? w.slice(0, -1) : w);
  return tokens;
}

// Fuzzy-match a typed name to the closest database exercise. Returns the best
// candidate only when it's a clear winner, to avoid linking ambiguous names.
function fuzzyMatchEx(name) {
  const inputTokens = exTokens(name);
  if (!inputTokens.length) return null;
  const inputSet = new Set(inputTokens);
  const allEx = [...EX, ...(S.customExercises||[])];
  const scored = [];
  allEx.forEach(e => {
    const exSet = new Set(exTokens(e.name));
    let overlap = 0;
    inputSet.forEach(tk => { if (exSet.has(tk)) overlap++; });
    if (!overlap) return;
    const dice = (2 * overlap) / (inputSet.size + exSet.size);
    const coverage = overlap / inputSet.size; // how much of what they typed is covered
    if (coverage >= 0.6) scored.push({ e, score: dice });
  });
  if (!scored.length) return null;
  scored.sort((a, b) => b.score - a.score);
  const top = scored[0];
  const second = scored[1];
  // Require a decent score and a clear winner (not a near-tie / ambiguous)
  if (top.score >= 0.5 && (!second || top.score - second.score >= 0.15)) return top.e;
  return null;
}

// Resolve a typed name to a database exercise: exact first, then fuzzy.
function resolveEx(name) {
  const exact = exMatch(name);
  if (exact) return { match: exact, exact: true };
  const fuzzy = fuzzyMatchEx(name);
  if (fuzzy) return { match: fuzzy, exact: false };
  return { match: null, exact: false };
}

// Identify the muscle group for an exercise name: matched exercise first,
// then keyword-based estimation as a fallback.
function detectMuscle(name) {
  if (!name || !name.trim()) return 'legs';
  const { match } = resolveEx(name);
  if (match) return match.muscle;
  return estimateMuscleGroup(name);
}

// Read-only line showing the auto-detected muscle group for the typed exercise.
function muscleDispHtml(name) {
  if (!name || !name.trim()) return `<span style="color:var(--mut)">Muscle group auto-detects from the exercise</span>`;
  const m = detectMuscle(name);
  const color = MCOL[m] || 'var(--acc)';
  return `<span style="color:var(--mut)">Targets <strong style="color:${color}">${MNAME[m]||m}</strong> · auto-detected</span>`;
}

// Message shown under the name field: confirms whether this entry is linked to a
// known exercise (so its weights feed the 4% progression history) or is brand new.
function matchInfoHtml(name) {
  const { match, exact } = resolveEx(name);
  if (match && exact) return `<span style="color:var(--ok)">✓ Linked to <strong>${match.name}</strong> — weights feed your 4% progression</span>`;
  if (match) return `<span style="color:var(--ok)">✓ Matched to <strong>${match.name}</strong> — weights feed your 4% progression</span>`;
  if (name && name.trim()) return `<span style="color:var(--mut)">New exercise — tracked on its own</span>`;
  return '';
}

// Live handler as the user types an exercise name — keeps the muscle dropdown in
// sync (unless they've manually overridden it) without re-rendering / losing focus.
function onCustomNameInput(idx, value) {
  if (!S.customWorkoutLog || !S.customWorkoutLog.exercises[idx]) return;
  const ex = S.customWorkoutLog.exercises[idx];
  ex.name = value;
  ex.muscle = detectMuscle(value); // always auto-detect from the exercise
  // Live-update the muscle-group line and the database-link indicator
  const dEl = document.getElementById('cust-musc-disp-' + idx);
  if (dEl) dEl.innerHTML = muscleDispHtml(value);
  const mEl = document.getElementById('cust-match-' + idx);
  if (mEl) mEl.innerHTML = matchInfoHtml(value);
  // Refresh the suggestions dropdown
  renderExSuggest(idx, value);
}

// Build the ranked list of exercise suggestions for what the user has typed.
function exSuggestList(value) {
  const all = [...EX, ...(S.customExercises||[])];
  const q = (value || '').toLowerCase().trim();
  if (!q) return all.slice(0, 8); // show a starter list when empty
  const qTokens = exTokens(value);
  const scored = all.map(e => {
    const name = e.name.toLowerCase();
    const exT = new Set(exTokens(e.name));
    let score = 0;
    if (name.includes(q)) score += 2;
    if (name.startsWith(q)) score += 1;
    qTokens.forEach(t => { if (exT.has(t)) score += 1; });
    return { e, score };
  }).filter(x => x.score > 0);
  scored.sort((a, b) => b.score - a.score);
  return scored.slice(0, 8).map(x => x.e);
}

// Render the dropdown of exercise suggestions under a row's name field.
function renderExSuggest(idx, value) {
  const box = document.getElementById('ex-suggest-' + idx);
  if (!box) return;
  const list = exSuggestList(value);
  if (!list.length) { box.classList.remove('on'); box.innerHTML = ''; return; }
  box.innerHTML = list.map(e =>
    `<div class='ex-suggest-item' data-name="${e.name.replace(/"/g,'&quot;')}" onpointerdown='pickExSuggest(${idx}, this.dataset.name)'>
       <span>${e.name}</span><span class='es-mus'>${MNAME[e.muscle]||''}</span>
     </div>`
  ).join('');
  box.classList.add('on');
}

// User tapped a suggestion — fill the field, sync muscle + link indicator.
function pickExSuggest(idx, name) {
  if (!S.customWorkoutLog || !S.customWorkoutLog.exercises[idx]) return;
  const ex = S.customWorkoutLog.exercises[idx];
  ex.name = name;
  ex.muscle = detectMuscle(name); // always auto-detect from the exercise
  const inp = document.getElementById('cust-name-' + idx);
  if (inp) inp.value = name;
  const dEl = document.getElementById('cust-musc-disp-' + idx);
  if (dEl) dEl.innerHTML = muscleDispHtml(name);
  const mEl = document.getElementById('cust-match-' + idx);
  if (mEl) mEl.innerHTML = matchInfoHtml(name);
  const box = document.getElementById('ex-suggest-' + idx);
  if (box) { box.classList.remove('on'); box.innerHTML = ''; }
}

// Hide the dropdown on blur (delayed so a tap on a suggestion registers first).
function hideExSuggest(idx) {
  setTimeout(() => {
    const box = document.getElementById('ex-suggest-' + idx);
    if (box) box.classList.remove('on');
  }, 200);
}

// Pull the live DOM values into state before any re-render. The inputs also
// commit per keystroke (oninput), but this guards the case where a render is
// triggered before an input event lands (e.g. tapping "+ Add Exercise" with
// the keyboard still open) — previously that wiped unsaved weights/reps.
function harvestCustomInputs() {
  if (!S.customWorkoutLog || !S.customWorkoutLog.exercises) return;
  S.customWorkoutLog.exercises.forEach((ex, idx) => {
    const g = id => document.getElementById(id);
    const n = g('cust-name-' + idx);   if (n && n.value !== '') ex.name = n.value;
    const s = g('cust-sets-' + idx);   if (s && s.value !== '') ex.sets = parseInt(s.value) || ex.sets;
    const r = g('cust-reps-' + idx);   if (r && r.value !== '') ex.reps = parseInt(r.value) || ex.reps;
    const w = g('cust-weight-' + idx); if (w && w.value !== '') ex.weight = parseFloat(w.value) || 0;
  });
}

function removeCustomExercise(idx) {
  if (!S.customWorkoutLog || !S.customWorkoutLog.exercises) return;
  harvestCustomInputs();
  S.customWorkoutLog.exercises.splice(idx, 1);
  render();
}

function addCustomExerciseRow() {
  if (!S.customWorkoutLog) return;
  if (!S.customWorkoutLog.exercises) S.customWorkoutLog.exercises = [];
  harvestCustomInputs();
  S.customWorkoutLog.exercises.push({name: '', sets: 3, reps: 10, weight: 0});

}

function loadWorkoutTemplate(template) {

    ];

function estimateMuscleGroup(exerciseName) {
  const name = exerciseName.toLowerCase();

  // Chest keywords
  if (name.includes('push') || name.includes('bench') || name.includes('chest') || name.includes('fly')) {
    return 'chest';
  }
  // Back keywords
  if (name.includes('pull') || name.includes('row') || name.includes('lat') || name.includes('back')) {
    return 'back';
  }
  // Shoulders
  if (name.includes('shoulder') || name.includes('press') || name.includes('raise') || name.includes('overhead')) {
    return 'shoulders';
  }
  // Legs
  if (name.includes('squat') || name.includes('lunge') || name.includes('leg') || name.includes('quad') || name.includes('glute')) {
    return 'legs';
  }
  // Arms
  if (name.includes('curl') || name.includes('bicep')) {
    return 'biceps';
  }
  if (name.includes('tricep') || name.includes('dip') || name.includes('extension')) {
    return 'triceps';
  }
  // Core/full body
  if (name.includes('burpee') || name.includes('plank') || name.includes('core') || name.includes('run')) {
    return 'core';
  }

  // Default to legs for compound movements
  return 'legs';
}

function adaptWeekForCustomWorkout(customLog, customDow) {
  if (!S.program || !S.program.week || !S.weekPlan?.availability) return;

  // Calculate muscle group volumes from custom workout
  const customVolumes = {};
  customLog.exercises.forEach(ex => {
    const muscle = ex.muscle;
    const sets = ex.sets?.filter(s => s && s.reps > 0).length || 0;
    customVolumes[muscle] = (customVolumes[muscle] || 0) + sets;
  });

  // Store all existing custom workouts to preserve them
  const existingCustomWorkouts = {};
  S.program.week.forEach((day, dow) => {
    if (day && day.customWorkout && day.customLog) {
      existingCustomWorkouts[dow] = {
        customWorkout: true,
        customLog: day.customLog,
        name: day.name,
        desc: day.desc
      };
    }
  });

  // Update recent workouts to include ALL custom workout muscles for better adaptation
  const allCustomMuscles = new Set();
  Object.values(existingCustomWorkouts).forEach(cw => {
    cw.customLog.exercises.forEach(ex => allCustomMuscles.add(ex.muscle));
  });
  Object.keys(customVolumes).forEach(muscle => allCustomMuscles.add(muscle));

  const customMuscleList = Array.from(allCustomMuscles).map(m => MNAME[m]).join(', ');
  S.weekPlan.recentWorkouts = `Custom workouts this week: ${customMuscleList}`;

  // Completely regenerate the week program to adapt around ALL custom workouts
  S.program = genProgram(S.cfg, S.weekPlan.availability, S.logs);

  // Restore ALL custom workout days (including the new one)
  existingCustomWorkouts[customDow] = {
    customWorkout: true,
    customLog: customLog,
    name: 'Custom Workout',
    desc: `${customLog.exercises.length} exercises logged`
  };

  // Apply all custom workouts back to the regenerated program
  Object.entries(existingCustomWorkouts).forEach(([dow, customData]) => {
    const dayIndex = parseInt(dow);
    if (S.program.week[dayIndex]) {
      S.program.week[dayIndex] = {
        ...S.program.week[dayIndex],
        ...customData
      };
    }
  });
}

// Regenerate THIS week's program from full history without injecting a new day.
// Used when a session from the last few days is logged that fell in the PRIOR
// calendar week: it can't be placed on a current-week day, but it should still
// reshuffle the split order (via orderSplitByRecovery's recent-load weighting)
// so the freshest muscle groups lead the week. Preserves any custom / planned
// custom workout days already placed this week.
function replanCurrentWeek(){
  if(!S.program||!S.program.week||!S.weekPlan?.availability)return;
  const preserved={};
  S.program.week.forEach((day,dow)=>{
    if(day&&day.customWorkout&&day.customLog){
      preserved[dow]={customWorkout:true,customLog:day.customLog,name:day.name,desc:day.desc};
    }else if(day&&day.plannedCustomWorkout&&day.plannedCustomLog){
      preserved[dow]={plannedCustomWorkout:true,plannedCustomLog:day.plannedCustomLog,name:day.name,desc:day.desc};
    }
  });
  S.program=genProgram(S.cfg,S.weekPlan.availability,S.logs);
  Object.entries(preserved).forEach(([dow,data])=>{
    const i=parseInt(dow);
    if(S.program.week[i])S.program.week[i]={...S.program.week[i],...data};
  });
}

function planCustomWorkout(customLog, customDow) {
  if (!S.program || !S.program.week || !S.weekPlan?.availability) return;

  // Store all existing custom workouts and planned workouts to preserve them
  const existingWorkouts = {};
  S.program.week.forEach((day, dow) => {
    if (day && day.customWorkout && day.customLog) {
      existingWorkouts[dow] = {
        customWorkout: true,
        customLog: day.customLog,
        name: day.name,
        desc: day.desc
      };
    } else if (day && day.plannedCustomWorkout && day.plannedCustomLog) {
      existingWorkouts[dow] = {
        plannedCustomWorkout: true,
        plannedCustomLog: day.plannedCustomLog,
        name: day.name,
        desc: day.desc
      };
    }
  });

  // Add the new planned workout
  existingWorkouts[customDow] = {
    plannedCustomWorkout: true,
    plannedCustomLog: customLog,
    name: 'Planned Custom Workout',
    desc: `${customLog.exercises.length} exercises planned`
  };

  // Update recent workouts to include ALL custom/planned workout muscles for better adaptation
  const allCustomMuscles = new Set();
  Object.values(existingWorkouts).forEach(cw => {
    const log = cw.customLog || cw.plannedCustomLog;
    if (log) {
      log.exercises.forEach(ex => allCustomMuscles.add(ex.muscle));
    }
  });

  const customMuscleList = Array.from(allCustomMuscles).map(m => MNAME[m]).join(', ');
  S.weekPlan.recentWorkouts = `Custom/planned workouts this week: ${customMuscleList}`;

  // Completely regenerate the week program to adapt around ALL custom workouts
  S.program = genProgram(S.cfg, S.weekPlan.availability, S.logs);

  // Apply all custom/planned workouts back to the regenerated program
  Object.entries(existingWorkouts).forEach(([dow, workoutData]) => {
    const dayIndex = parseInt(dow);
    if (S.program.week[dayIndex]) {
      S.program.week[dayIndex] = {
        ...S.program.week[dayIndex],
        ...workoutData
      };
    }
  });
}

function rebalanceCustomWorkouts() {
  if (!S.program || !S.program.week || !S.weekPlan?.availability) return;

  // Collect all remaining custom and planned workouts to preserve them
  const existingWorkouts = {};
  S.program.week.forEach((day, dow) => {
    if (day && day.customWorkout && day.customLog) {
      existingWorkouts[dow] = {
        customWorkout: true,
        customLog: day.customLog,
        name: day.name,
        desc: day.desc
      };
    } else if (day && day.plannedCustomWorkout && day.plannedCustomLog) {
      existingWorkouts[dow] = {
        plannedCustomWorkout: true,
        plannedCustomLog: day.plannedCustomLog,
        name: day.name,
        desc: day.desc
      };
    }
  });

  // Rebuild recentWorkouts note from remaining workouts
  const allCustomMuscles = new Set();
  Object.values(existingWorkouts).forEach(cw => {
    const log = cw.customLog || cw.plannedCustomLog;
    if (log) log.exercises.forEach(ex => allCustomMuscles.add(ex.muscle));
  });
  if (allCustomMuscles.size > 0) {
    const customMuscleList = Array.from(allCustomMuscles).map(m => MNAME[m]).join(', ');
    S.weekPlan.recentWorkouts = `Custom/planned workouts this week: ${customMuscleList}`;
  } else {
    S.weekPlan.recentWorkouts = '';
  }

  // Regenerate the week and re-apply remaining custom/planned workouts
  S.program = genProgram(S.cfg, S.weekPlan.availability, S.logs);
  Object.entries(existingWorkouts).forEach(([dow, workoutData]) => {
    const dayIndex = parseInt(dow);
    if (S.program.week[dayIndex]) {
      S.program.week[dayIndex] = {
        ...S.program.week[dayIndex],
        ...workoutData
      };
    }
  });
}

function cancelPlannedWorkout(cancelDow) {
  if (!S.program || !S.program.week) return;

  // Remove the planned workout from the day
  if(S.program.week[cancelDow]) {
    delete S.program.week[cancelDow].plannedCustomWorkout;
    delete S.program.week[cancelDow].plannedCustomLog;
  }

  // Store all remaining custom workouts to preserve them
  const existingWorkouts = {};
  S.program.week.forEach((day, dow) => {
    if (day && day.customWorkout && day.customLog) {
      existingWorkouts[dow] = {
        customWorkout: true,
        customLog: day.customLog,
        name: day.name,
        desc: day.desc
      };
    } else if (day && day.plannedCustomWorkout && day.plannedCustomLog) {
      existingWorkouts[dow] = {
        plannedCustomWorkout: true,
        plannedCustomLog: day.plannedCustomLog,
        name: day.name,
        desc: day.desc
      };
    }
  });

  // Update recent workouts
  const allCustomMuscles = new Set();
  Object.values(existingWorkouts).forEach(cw => {
    const log = cw.customLog || cw.plannedCustomLog;
    if (log) {
      log.exercises.forEach(ex => allCustomMuscles.add(ex.muscle));
    }
  });

  if(allCustomMuscles.size > 0) {
    const customMuscleList = Array.from(allCustomMuscles).map(m => MNAME[m]).join(', ');
    S.weekPlan.recentWorkouts = `Custom/planned workouts this week: ${customMuscleList}`;
  } else {
    S.weekPlan.recentWorkouts = '';
  }

  // Regenerate the week program
  S.program = genProgram(S.cfg, S.weekPlan.availability, S.logs);

  // Restore remaining custom workouts
  Object.entries(existingWorkouts).forEach(([dow, workoutData]) => {
    const dayIndex = parseInt(dow);
    if (S.program.week[dayIndex]) {
      S.program.week[dayIndex] = {
        ...S.program.week[dayIndex],
        ...workoutData
      };
    }
  });

  save();
  render();
}

document.addEventListener('click',e=>{

    save();render();return;}
  if(a==='toggle-conditioning'){S.cfg.conditioning=!S.cfg.conditioning;save();render();return;}

  if(a==='reset-program'){
    if(!confirm('Reset and reconfigure from today through Sunday?'))return;
    const todayDOW = todayDow();
    const calGoal = S.weekPlan?.calGoal || null; // calorie goal survives a reset

    // Monday → full reset: re-plan the whole week
    if(todayDOW === 1) {
      S.program=null;S.active=null;
      S.weekPlan={weekOf:todayStr(),availability:defaultAvailability(),calGoal};
      delete S.cfg.planStartDow;
      S.view='setup';S.step=1;save();render();return;
    }

    // Mid-week: only re-plan today through Sunday, keep past days untouched.
    // planStartDow marks where the new plan begins (0 = Sunday only).
    S.cfg.planStartDow = todayDOW;
    if(S.program && S.program.week){
      S.program.week = S.program.week.map((day, dow) => {
        // Sunday is the last day of the Mon-based week: on Sunday keep Mon-Sat
        const isPast = todayDOW===0 ? dow>0 : (dow>0 && dow<todayDOW);
        if(isPast) return day;
        return {dow, rest: true};
      });
    }

    // Drop past days from availability so the new plan only covers remaining days
    if(S.weekPlan?.availability){
      const av=S.weekPlan.availability;
      [1,2,3,4,5].forEach(dw=>{
        const isPast = todayDOW===0 || dw<todayDOW;
        if(isPast && av[dw]){av[dw].lunch=false;if(av[dw].eve)av[dw].eve.on=false;}
      });
      if(todayDOW===0 && av[6]) av[6].on=false;

    const isEve = sessionType === 'eve' && day.eveningSession;
    const src = isEve ? day.eveningSession : day;
    const currentEx = src.exercises[idx];

    // Find alternative exercises for the same muscle group and type
    const alternatives = EX.filter(e =>
      e.muscle === currentEx.muscle &&
      e.type === currentEx.type &&
      e.id !== currentEx.id &&
      e.eq.some(eq => src.exercises.some(srcEx => srcEx.eq?.includes(eq))) // Has compatible equipment
    ).slice(0, 5); // Limit to 5 alternatives

    if(alternatives.length === 0){
      alert('No alternative exercises available for this muscle group and type.');
      return;

    // Show selection modal (simple confirm for now, can be enhanced later)
    const altNames = alternatives.map((e, i) => `${i+1}. ${e.name}`).join('\n');

    const muscleChoice = prompt(`Muscle group:\n${muscles.map((m,i) => `${i+1}. ${MNAME[m]}`).join('\n')}\n\nEnter number (1-${muscles.length}):`);
    const muscleIdx = parseInt(muscleChoice) - 1;

    const types = ['compound', 'isolation'];
    const typeChoice = prompt(`Exercise type:\n1. Compound (multi-joint)\n2. Isolation (single-joint)\n\nEnter number (1-2):`);

  if(a==='delete-custom-exercise'){

  if(a==='log-custom-workout'){

    };

  }
  if(a==='log-vo2-session'){
    const p=currentVO2Protocol();
    // Backdate support: the dashboard card carries data-date for the day being
    // viewed. A past day saves at 18:00 local of THAT date (a plausible evening
    // slot), so recovery/history logic attributes the session to the right day.
    const targetDate=btn.dataset.date;
    const iso=(targetDate&&targetDate!==todayStr())?new Date(targetDate+'T18:00:00').toISOString():new Date().toISOString();
    // isCardio + empty exercises → invisible to MRV set volumes, the lifting
    // two-per-day cap, completed-day detection, and progression
    S.logs.push({id:Date.now().toString(),date:iso,dayName:`Engine · ${p.name}`,isCardio:true,vo2:true,duration:p.mins,exercises:[]});
    S.logs.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
    save();render();return;

  if(a==='log-past-workout'){

    S.customWorkoutLog = {
      dow: null,

    };

    render();return;

    addCustomExerciseRow();

  }
  if(a==='load-bodyweight-template'){
    loadWorkoutTemplate('bodyweight');
    return;
  }
  if(a==='load-strength-template'){
    loadWorkoutTemplate('strength');
    return;
  }
  if(a==='save-custom-workout'){
    if(!S.customWorkoutLog || !S.customWorkoutLog.exercises.length) {
      alert('Please add at least one exercise');
      return;
    }
    harvestCustomInputs(); // capture any not-yet-committed input values

    // Backdated entries: resolve the chosen historic date/time and derive the
    // day-of-week from it; reject future timestamps.
    let entryDate = new Date();
    if (S.customWorkoutLog.isBackdate) {
      const dStr = document.getElementById('backdate-date')?.value;
      const tStr = document.getElementById('backdate-time')?.value || '17:00';
      if (!dStr) { alert('Pick the date you did this workout'); return; }
      entryDate = new Date(`${dStr}T${tStr}:00`);
      if (isNaN(entryDate.getTime()) || entryDate.getTime() > Date.now()) {
        alert('That timestamp is in the future — pick a past date/time');
        return;
      }
      S.customWorkoutLog.dow = entryDate.getDay();
    }
    // A backdated workout only ties into the program week if it falls inside
    // it — judged on the user's LOCAL calendar day
    const inCurrentWeek = localDateStr(entryDate) >= thisMonday();

    // Two-per-day cap applies to logged entries on any local calendar day
    if(!S.customWorkoutLog.isPlanning && liftingSessionsOn(localDateStr(entryDate)) >= 2){
      alert(`Daily limit: ${localDateStr(entryDate)} already has two lifting sessions logged (max two per calendar day).`);
      return;
    }

    // Create a workout entry
    const customData = {
      id: Date.now().toString(),
      date: entryDate.toISOString(),
      dayName: S.customWorkoutLog.isPlanning ? 'Planned Custom Workout' : 'Custom Workout',
      isCustom: true,
      isPlanned: S.customWorkoutLog.isPlanning,
      duration: 60, // default estimate
      exercises: S.customWorkoutLog.exercises.map(ex => {
        // Link to a known exercise when the name matches (exact or fuzzy), so the
        // logged weights feed the same 4% progression history as regular workouts;
        // otherwise create a stable slug id tracked on its own.
        const { match } = resolveEx(ex.name);
        // Guard against NaN/0 from in-progress numeric edits
        const nSets = Math.max(1, parseInt(ex.sets) || 1);
        const nReps = Math.max(1, parseInt(ex.reps) || 1);
        const nWeight = parseFloat(ex.weight) || 0;
        return {
          id: match ? match.id : (ex.name||'').toLowerCase().replace(/[^a-z0-9]/g, '_'),
          name: match ? match.name : ex.name,
          muscle: ex.muscle || (match ? match.muscle : estimateMuscleGroup(ex.name)),
          sets: [{weight: nWeight, reps: nReps}].concat(
            Array(nSets - 1).fill().map(() => ({weight: nWeight, reps: nReps}))
          )
        };
      })
    };

    if(S.customWorkoutLog.isPlanning) {
      // PLANNING: Don't add to logs, mark as planned
      if(S.program && S.program.week[S.customWorkoutLog.dow]) {
        S.program.week[S.customWorkoutLog.dow].plannedCustomWorkout = true;
        S.program.week[S.customWorkoutLog.dow].plannedCustomLog = customData;
      }

      // Immediately regenerate entire week to adapt around planned workout
      planCustomWorkout(customData, S.customWorkoutLog.dow);
    } else {
      // LOGGING: Add to logs in chronological position (matters for backdated
      // entries — progression must read the true latest session per exercise)
      S.logs.push(customData);
      S.logs.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);

      // Only tie into the current program week when the date falls inside it
      if(inCurrentWeek && S.program && S.program.week[S.customWorkoutLog.dow]) {
        const day = S.program.week[S.customWorkoutLog.dow];
        day.customWorkout = true;
        day.customLog = customData;
        // If this day was previously planned, clear the planned markers so its
        // sets aren't counted twice in MRV / budgeting.
        delete day.plannedCustomWorkout;
        delete day.plannedCustomLog;
      }

      // Background recalculation: last-used weights for the +4% progression
      // baseline; weekly MRV volume recalculates automatically since it is
      // derived from log dates (getWeeklySetVolumes / getCommittedVolumes).
      recalcLastWeights();

      // Regenerate rest of week to adapt. Current-week entries tie into a
      // specific day; a session from the last few days that fell in the prior
      // calendar week can't be placed on a day, but it still reshuffles this
      // week's split order so the freshest muscle groups lead off.
      if(inCurrentWeek){
        adaptWeekForCustomWorkout(customData, S.customWorkoutLog.dow);
      } else {
        const sinceDays=daysBetween(localDateStr(entryDate),todayStr());
        if(sinceDays>=0&&sinceDays<=6) replanCurrentWeek();
      }
    }

    S.customWorkoutLog = null;
    S.view = 'dash';
    save();
    render();
    return;
  }
  if(a==='view-day'){
    const dv=parseInt(btn.dataset.dow);
    S.viewDay=(S.viewDay===dv)?null:dv;
    S.viewExDetail=null;
    render();return;
  }
  if(a==='view-ex-detail'){
    if(e.target.tagName==='INPUT')return;
    const id=btn.dataset.exid;
    S.viewExDetail=(S.viewExDetail===id)?null:id;
    render();return;
  }
  if(a==='save-ex-weight'){
    const id=btn.dataset.exid;
    const w=parseFloat(document.getElementById(`ew-${id}`)?.value)||0;
    const r=parseInt(document.getElementById(`er-${id}`)?.value)||0;
    if(w>0&&r>0){S.lastWeights[id]={weight:w,reps:r,date:new Date().toISOString()};S.viewExDetail=null;save();render();}
    return;
  }
  if(a==='done-set'){
    completeSet(parseInt(btn.dataset.ex),parseInt(btn.dataset.set));return;
  }
  if(a==='next-ex'){
    const next=S.active.exIdx+1;
    if(next<S.active.exercises.length)goToEx(next);
    return;
  }
  if(a==='prev-ex'){goToEx(S.active.exIdx-1);return;}
  if(a==='finish-workout'){S.active.ratePending=true;save();render();return;}
  if(a==='rate-fatigue'){finishWorkout(parseInt(btn.dataset.val)||null);return;}
  if(a==='abandon'){abandonWorkout();return;}
  // Skip the CURRENT exercise (leave its unfinished sets as-is) and move on —
  // for when a set can't be completed as prescribed, without losing progress
  // already logged on other exercises. On the last exercise, this finishes
  // the workout instead, same as tapping "Finish Workout" early.
  if(a==='skip-ex'){
    const next=S.active.exIdx+1;
    if(next<S.active.exercises.length){goToEx(next);}
    else{S.active.ratePending=true;save();render();}
    return;
  }
  // End the workout right now, saving whatever sets are already completed —
  // for finishing early or cutting a session short. With zero sets logged
  // there's nothing to save, so it falls back to the discard (abandon) flow.
  if(a==='end-now'){
    const hasProgress=S.active.exercises.some(e=>e.done.some(Boolean));
    if(!hasProgress){abandonWorkout();return;}
    if(!confirm('End workout now? Sets you\'ve completed will be saved to your log; remaining exercises will be skipped.'))return;
    S.active.ratePending=true;save();render();
    return;
  }
  if(a==='undo-set'){
    const ei=parseInt(btn.dataset.ex),si=parseInt(btn.dataset.set);
    if(S.active?.exercises[ei]){S.active.exercises[ei].done[si]=null;save();render();}
    return;
  }
  if(a==='start-wu-rest'){startRest(parseInt(btn.dataset.secs),'Warm-up rest');return;}
  if(a==='start-iso-hold'){startRest(parseInt(btn.dataset.secs),'Mid-position hold');return;}
  if(a==='start-hold'){startRest(parseInt(btn.dataset.secs),'Stretch hold');return;}
  if(a==='toggle-swap'){
    S.active.swapMode=S.active.swapMode===S.active.exIdx?null:S.active.exIdx;
    S.active.swapSearch=false;S.active.swapQuery='';
    render();return;
  }
  if(a==='swap-more'){
    S.active.swapSearch=true;S.active.swapQuery='';
    render();
    setTimeout(()=>{const el=document.getElementById('swap-search-input');if(el)el.focus();},50);
    return;
  }
  if(a==='swap-ex'){
    const idx=parseInt(btn.dataset.idx),newId=btn.dataset.id;
    const allEx=[...EX,...(S.customExercises||[])];
    const newEx=allEx.find(e=>e.id===newId);
    if(newEx&&S.active.exercises[idx]){
      const old=S.active.exercises[idx];
      S.active.exercises[idx]={...newEx,sets:old.sets,sessionMins:old.sessionMins,done:[],isFirst:old.isFirst};
      S.active.swapMode=null;S.active.swapSearch=false;S.active.swapQuery='';save();render();
    }
    return;
  }
  if(a==='toggle-cue'){
    const el=document.getElementById(btn.dataset.id);
    if(el)el.classList.toggle('open');return;
  }
  if(a==='toggle-log'){
    const id=btn.dataset.id;
    S.openLogs[id]=!S.openLogs[id];render();return;
  }
  if(a==='edit-log'){
    const log=S.logs.find(l=>l.id===btn.dataset.id);
    if(log){S.editLogDraft=JSON.parse(JSON.stringify(log));S.newLogExName='';S.newLogExSets=3;S.view='log-edit';render();}
    return;
  }
  if(a==='add-log-exercise'){
    const log=S.editLogDraft;if(!log)return;
    syncLogEditInputs();
    const nameEl=document.getElementById('new-log-ex-name');
    const setsEl=document.getElementById('new-log-ex-sets');
    const name=(nameEl?.value||'').trim();
    if(!name)return;
    const setsCount=Math.max(1,Math.min(10,parseInt(setsEl?.value)||3));
    const{match}=resolveEx(name);
    log.exercises.push({
      id:match?match.id:'custom_'+Date.now(),
      name:match?match.name:name,
      muscle:match?match.muscle:estimateMuscleGroup(name),
      sets:Array.from({length:setsCount},()=>({weight:0,reps:0}))
    });
    S.newLogExName='';S.newLogExSets=3;
    render();
    return;
  }
  if(a==='remove-log-exercise'){
    const log=S.editLogDraft;if(!log)return;
    // Sync BEFORE the splice — the input ids still match the pre-removal
    // exercise indices at this point.
    syncLogEditInputs();
    const idx=parseInt(btn.dataset.idx);
    log.exercises.splice(idx,1);
    render();
    return;
  }
  if(a==='save-log-edit'){
    const log=S.editLogDraft;
    if(log){
      syncLogEditInputs();
      const idx=S.logs.findIndex(l=>l.id===log.id);
      if(idx!==-1)S.logs[idx]=log;
      recalcLastWeights();
      S.editLogDraft=null;S.view='history';
      save();render();
    }
    return;
  }
  if(a==='cancel-log-edit'){S.editLogDraft=null;S.view='history';render();return;}
  if(a==='delete-log'){
    // Soft-delete pipeline step 1: never delete immediately — open the
    // full-workload preview modal for confirmation.
    S.confirmDelete=btn.dataset.id;
    updateModals();
    return;
  }
  if(a==='cancel-delete-log'){
    S.confirmDelete=null;
    updateModals();
    return;
  }
  if(a==='confirm-delete-log'){
    const id=btn.dataset.id;
    const log=S.logs.find(l=>l.id===id);
    S.confirmDelete=null;
    if(!log){updateModals();return;}

    // Soft delete: move to the recovery cache instead of purging
    S.deletedSessions=S.deletedSessions||[];
    S.deletedSessions.push({deletedAt:Date.now(),wasOnDow:null,log});
    if(S.deletedSessions.length>20)S.deletedSessions=S.deletedSessions.slice(-20);
    S.logs=S.logs.filter(l=>l.id!==id);

    // Clear any custom-workout flags on the program week that referenced this log
    if(S.program?.week){
      S.program.week.forEach(day=>{
        if(day&&day.customWorkout&&day.customLog?.id===id){
          delete day.customWorkout;delete day.customLog;
          S.deletedSessions[S.deletedSessions.length-1].wasOnDow=day.dow;
        }
      });
    }

    recalcLastWeights();
    if(log.isCustom&&S.deletedSessions[S.deletedSessions.length-1].wasOnDow!=null&&S.weekPlan?.availability){
      rebalanceCustomWorkouts();
    }

    // Ephemeral undo banner (auto-dismisses; session stays recoverable in
    // History → Recently Deleted regardless)
    S.undoBanner={id,name:log.dayName};
    setTimeout(()=>{if(S.undoBanner&&S.undoBanner.id===id){S.undoBanner=null;updateModals();}},8000);

    S.editLogDraft=null;
    if(S.view==='log-edit')S.view='history';
    save();render();
    return;
  }
  if(a==='restore-log'){
    const id=btn.dataset.id;
    const idx=(S.deletedSessions||[]).findIndex(d=>d.log.id===id);
    if(idx===-1)return;
    const entry=S.deletedSessions.splice(idx,1)[0];
    S.logs.push(entry.log);
    // Keep history chronological so progression reads the true latest session
    S.logs.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);

    // Re-attach custom workouts to their program day when still applicable
    if(entry.log.isCustom&&entry.wasOnDow!=null&&S.program?.week?.[entry.wasOnDow]
       &&logDay(entry.log.date)>=thisMonday()&&!S.program.week[entry.wasOnDow].customWorkout){
      S.program.week[entry.wasOnDow].customWorkout=true;
      S.program.week[entry.wasOnDow].customLog=entry.log;
      if(S.weekPlan?.availability)rebalanceCustomWorkouts();
    }

    recalcLastWeights();
    S.undoBanner=null;
    save();render();
    return;
  }
  if(a==='skip-rest'||btn.id==='skip-rest-btn'){stopRest();return;}
});

// ─────────────────────────────────────────────
// CLOUD SYNC (Firebase)
// ─────────────────────────────────────────────
let fbAuth=null,fbDb=null,fbUser=null,fbReady=false;

function getStoredFbConfig(){
  try{return JSON.parse(localStorage.getItem('fbConfig')||'null');}catch(e){return null;}
}

async function loadFbScript(src){
  return new Promise((res,rej)=>{
    if(document.querySelector(`script[src="${src}"]`)){res();return;}
    const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s);
  });
}

async function initFirebase(cfg){
  try{
    await loadFbScript('https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js');
    await loadFbScript('https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js');
    await loadFbScript('https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js');
    if(!firebase.apps.length)firebase.initializeApp(cfg);
    fbAuth=firebase.auth();
    fbDb=firebase.firestore();
    fbReady=true;
    render(); // update UI now that Firebase is ready
    fbAuth.onAuthStateChanged(user=>{
      fbUser=user;
      if(user)loadFromCloud();
      else render();
    });
    // Handle email link sign-in when returning from inbox link
    if(fbAuth.isSignInWithEmailLink(location.href)){
      let email=localStorage.getItem('emailForSignIn');
      if(!email)email=prompt('Please confirm your email address:');
      if(email){
        fbAuth.signInWithEmailLink(email,location.href)
          .then(()=>localStorage.removeItem('emailForSignIn'))
          .catch(e=>alert('Sign-in error: '+e.message));
      }
    }
  }catch(e){console.error('Firebase init failed',e);fbReady=false;}
}

// Logs whose id appears in the deletedSessions tombstones must not survive a
// union merge — without this filter, device B's stale copy of a log deleted
// on device A resurrects it on every sync.
function filterTombstoned(logs){
  const delIds=new Set((S.deletedSessions||[]).map(d=>d.log?.id).filter(Boolean));
  return (logs||[]).filter(l=>!delIds.has(l.id));
}

let lastCloudMergeRead=0;
async function saveToCloud(){
  if(!fbReady||!fbUser||!fbDb)return;
  try{
    const ref=fbDb.collection('users').doc(fbUser.uid);
    // Read-merge-write. A blind set() replaced the ENTIRE cloud doc with this
    // device's state — so a phone that hadn't pulled since another device
    // logged a workout would erase that workout from the cloud on its next
    // save (e.g. an iPhone's lunch session vanishing when the evening phone
    // edited the week). Union the additive collections with the live cloud
    // copy before every write. The read is throttled: rapid-fire saves during
    // a workout (every completed set) reuse the merge from <60s ago — within
    // that window this device's state is already a superset of what it read,
    // and the next pull/merge unions anything that landed in between.
    if(Date.now()-lastCloudMergeRead>60000){
      const doc=await ref.get();
      if(doc.exists){
        const cloud=doc.data();
        const merged=unionById(S.logs,cloud.logs);
        merged.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
        S.deletedSessions=unionById(S.deletedSessions,cloud.deletedSessions,d=>d.log?.id).slice(-20);
        S.logs=filterTombstoned(merged).slice(-10);
        S.customExercises=unionById(S.customExercises,cloud.customExercises);
        S.lastWeights={...(cloud.lastWeights||{}),...(S.lastWeights||{})};
        S.sleepLog={...(cloud.sleepLog||{}),...(S.sleepLog||{})};
      }
      lastCloudMergeRead=Date.now();
    }
    const data={cfg:S.cfg,program:S.program,logs:S.logs.slice(-10),weekPlan:S.weekPlan,lastWeights:S.lastWeights,sleepLog:S.sleepLog||{},eveningMins:S.eveningMins||null,eveningLocation:S.eveningLocation||null,customExercises:S.customExercises||[],deletedSessions:(S.deletedSessions||[]).slice(-20),updatedAt:S.updatedAt||new Date().toISOString(),fieldUpdated:S.fieldUpdated||{}};
    await ref.set(data);
  }catch(e){console.error('Cloud save failed',e);}
}

// Generic union-by-id: every row created on any device survives the merge.
// Additive collections (logs, custom exercises, deleted sessions) must NEVER
// be last-writer-wins — that's how one device's entries were getting dropped.
function unionById(localArr,cloudArr,idOf){
  idOf=idOf||(x=>x.id);
  const out=[...(cloudArr||[])];
  (localArr||[]).forEach(l=>{if(!out.find(c=>idOf(c)===idOf(l)))out.push(l);});
  return out;
}

// Post-merge consistency: another device may have logged a planned workout
// (program here still carries planned flags → MRV would count the muscle
// volume TWICE), or deleted a session this program still references.
function reconcileProgramWithLogs(){
  if(!S.program?.week)return;
  const mon=thisMonday();
  S.program.week.forEach(day=>{
    if(!day)return;
    if(day.plannedCustomWorkout){
      const hit=(S.logs||[]).find(l=>!l.isCardio&&logDay(l.date)>=mon&&new Date(l.date).getDay()===day.dow);
      if(hit){
        delete day.plannedCustomWorkout;delete day.plannedCustomLog;
        if(hit.isCustom){day.customWorkout=true;day.customLog=hit;}
      }
    }
    if(day.customWorkout&&day.customLog&&!(S.logs||[]).find(l=>l.id===day.customLog.id)){
      delete day.customWorkout;delete day.customLog; // deleted on another device
    }
  });
}

async function loadFromCloud(){
  if(!fbReady||!fbUser||!fbDb)return;
  try{
    const doc=await fbDb.collection('users').doc(fbUser.uid).get();
    if(doc.exists){
      const cloud=doc.data();
      // Additive collections: union by id on EVERY sync, regardless of which
      // side is newer. Logs stay sorted by workout DATE (not record id) so
      // backdated entries keep progression chronology intact.
      const merged=unionById(S.logs,cloud.logs);
      merged.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
      const customEx=unionById(S.customExercises,cloud.customExercises);
      const deleted=unionById(S.deletedSessions,cloud.deletedSessions,d=>d.log?.id);
      // Merge lastWeights: local takes precedence (most recent device)
      const weights={...(cloud.lastWeights||{}),...(S.lastWeights||{})};
      // Merge sleepLog the same way: additive per-date map, local wins on conflict
      const sleep={...(cloud.sleepLog||{}),...(S.sleepLog||{})};
      // Singleton state (cfg/program/weekPlan/...) adopted PER FIELD, by each
      // field's own change stamp. The old comparison used one global
      // updatedAt, so any unrelated save on this device (a sleep log, a
      // completed set) made it look "newer" and blocked adopting the other
      // phone's week edit — then pushed the stale program back up over it.
      // Legacy fallback: a cloud doc written by an old client has no
      // fieldUpdated map, so fields fall back to the global updatedAt race.
      {
        const cloudGlobalNewer=cloud.updatedAt&&(!S.updatedAt||cloud.updatedAt>S.updatedAt);
        const cf=cloud.fieldUpdated||{},lf=S.fieldUpdated||{};
        const adopt=(k)=>{
          const cloudFieldNewer=(cf[k]||lf[k])?(cf[k]&&(!lf[k]||cf[k]>lf[k])):cloudGlobalNewer;
          if(cloudFieldNewer&&cloud[k]!=null){
            S[k]=cloud[k];
            // Re-baseline the snapshot so the next save() doesn't read the
            // adopted content as a fresh local edit and re-bump its stamp.
            if(cf[k])S.fieldUpdated={...(S.fieldUpdated||{}),[k]:cf[k]};
            _singletonSnaps[k]=JSON.stringify(S[k]??null);
          }
        };
        SINGLETON_FIELDS.forEach(adopt);
        // Keep the per-key max of both maps so a later pull can't regress.
        const fu={...lf};Object.keys(cf).forEach(k=>{if(!fu[k]||cf[k]>fu[k])fu[k]=cf[k];});
        S.fieldUpdated=fu;
      }
      Object.assign(S,{deletedSessions:deleted.slice(-20),lastWeights:weights,sleepLog:sleep,customExercises:customEx});
      // Tombstone filter AFTER deletedSessions merge: a log deleted on another
      // device must not ride back in through this device's stale copy.
      S.logs=filterTombstoned(merged).slice(-10);
      reconcileProgramWithLogs();
      recalcLastWeights();
      lastCloudMergeRead=Date.now();// this WAS a full merge — saveToCloud can skip its read
      save();// persists merged state and uploads it back to the cloud
    }else{
      await saveToCloud();// first login — push local data up
    }
    render();
  }catch(e){console.error('Cloud load failed',e);render();}
}

// Pull whenever the app comes back to the foreground. onAuthStateChanged only
// fires on a cold start — a PWA resumed from the background never re-pulled,
// so a workout logged on another device at lunch stayed invisible all evening
// (and a blind save here could then clobber it in the cloud; see saveToCloud).
let lastCloudPull=0;
function pullFromCloudThrottled(){
  if(!fbReady||!fbUser)return;
  if(Date.now()-lastCloudPull<30000)return;
  lastCloudPull=Date.now();
  loadFromCloud();
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')pullFromCloudThrottled();});
window.addEventListener('focus',pullFromCloudThrottled);
// Two phones OPEN at the same time never fire focus/visibility events, so a
// week edit on one wouldn't appear on the other until a re-open. Poll gently
// while visible — skipped mid-workout and while typing, because loadFromCloud
// ends in render() and a rebuild would wipe input focus and unsaved values.
setInterval(()=>{
  if(document.visibilityState!=='visible')return;
  if(S.active)return;
  const ae=document.activeElement;
  if(ae&&(ae.tagName==='INPUT'||ae.tagName==='TEXTAREA'))return;
  pullFromCloudThrottled();
},60000);

function cloudSignOut(){
  if(!fbAuth)return;
  fbAuth.signOut().then(()=>{fbUser=null;render();});
}

        <button class='btn btn-p btn-sm' data-action='send-sign-in-link' style='width:auto'>Send Link</button>
      </div>
      <div style='font-size:11px;color:var(--mut);margin-top:8px'>Check your inbox and tap the link — opens the app and signs you in instantly.</div>
    </div>`;
  }
  return`<div class='card' style='margin-bottom:14px'>
    <div style='display:flex;align-items:center;justify-content:space-between'>
      <div><div class='sec-lbl' style='margin-bottom:2px'>☁️ Cloud Sync</div>
        <div style='font-size:12px;color:var(--ok)'>✓ Synced · ${fbUser.displayName||fbUser.email}</div></div>
      <button class='btn btn-g btn-sm' data-action='cloud-sign-out' style='width:auto'>Sign out</button>
    </div>
    <button class='btn btn-g btn-sm' data-action='go-cloud-setup' style='margin-top:10px'>🔑 View / copy config (to sync a new device) →</button>
  </div>`;
}

function renderCloudSetup(){
  const existing=getStoredFbConfig();
  const val=existing?JSON.stringify(existing,null,2):'';
  return`<div class='view'>
    <button class='s-back' data-action='plan-back' style='margin-bottom:20px;margin-top:0'>
      <svg width='20' height='20' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='15 18 9 12 15 6'/></svg> Back
    </button>
    <div class='hdg'>Cloud Sync Setup</div>
    <div class='sub'>Follow these steps to sync your data across devices. Takes about 5 minutes. Free — no credit card.</div>
    <div class='card' style='margin-bottom:16px'>
      <div style='font-size:13px;line-height:1.9'>
        <div><strong>1.</strong> Go to <strong>console.firebase.google.com</strong></div>
        <div><strong>2.</strong> Create a new project (any name)</div>
        <div><strong>3.</strong> In the project: <em>Authentication → Sign-in method → Email/Password → Enable both toggles (the second one says "Email link / passwordless sign-in")</em></div>
        <div><strong>4.</strong> In the project: <em>Firestore Database → Create database → Start in production mode → choose a region</em></div>
        <div><strong>5.</strong> In Firestore: <em>Rules</em> tab → replace with:<br>
          <code style='font-size:11px;color:var(--acc);display:block;margin:6px 0;background:var(--surf2);padding:8px;border-radius:6px;line-height:1.6'>rules_version = '2';<br>service cloud.firestore {'{'}  match /databases/{'{'}database{'}'}/documents {'{'}    match /users/{'{'}userId{'}'} {'{'}      allow read, write: if request.auth.uid == userId;    {'}'}  {'}'}{'}'}</code>
          → Publish</div>
        <div><strong>6.</strong> Go to <em>Project Settings → Your apps → Add app → Web</em> → register an app</div>
        <div><strong>7.</strong> Copy the <strong>firebaseConfig</strong> object JSON and paste it below</div>
      </div>
    </div>
    <div class='sec-lbl' style='margin-bottom:6px'>Paste your firebaseConfig JSON here:</div>
    <textarea id='fb-config-input' class='ni' style='width:100%;height:160px;font-size:11px;font-family:monospace;padding:10px;text-align:left;line-height:1.5;resize:vertical' placeholder='{"apiKey":"...","authDomain":"...","projectId":"...","storageBucket":"...","messagingSenderId":"...","appId":"..."}'>${val}</textarea>
    ${existing?`<button class='btn btn-ok' data-action='copy-fb-config' style='margin-top:12px'>📋 Copy config (for a new device)</button>
    <div style='font-size:11px;color:var(--mut);margin-top:6px'>On the new device, open Cloud Sync, paste this config, tap Connect, then sign in with the same email to pull your data.</div>`:''}
    <button class='btn ${existing?'btn-g btn-sm':'btn-ok'}' data-action='save-fb-config' style='margin-top:${existing?'8':'12'}px'>${existing?'Re-connect with edited config':'Connect →'}</button>
    ${existing?`<button class='btn btn-g btn-sm' data-action='clear-fb-config' style='margin-top:8px'>Remove config &amp; disconnect</button>`:''}
  </div>`;
}

// ─────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────
load();
const _fbCfg=getStoredFbConfig();
if(_fbCfg)initFirebase(_fbCfg);
render();

// Register service worker for PWA functionality
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('./sw.js')
      .then(function(registration) {
        console.log('ServiceWorker registration successful');
      })
      .catch(function(err) {
        console.log('ServiceWorker registration failed: ', err);
      });
  });
}
</script>
</body>
