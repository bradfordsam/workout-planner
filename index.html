function pickEveningExercises(day,sessionMins){
  const limit=EX_LIMIT[sessionMins]||5;
  // Use session's equipment - for evening sessions, get it from availability
  const today=todayDow();
  const av=S.weekPlan?.availability||{};
  const todayAv=av[today]||{};
  const eveEquipment=todayAv.eve?.equipment||'ymca';
  const selectedPreset=EQUIPMENT_PRESETS[eveEquipment]||EQUIPMENT_PRESETS.ymca;
  const equip=selectedPreset.equipment;
  const tmpl=TMPLS[day.tk];
  if(!tmpl)return day.exercises.slice(0,limit);
  const used=[];
  const budget={ vol:getCommittedVolumes(), limits:getMRVLimits(), perExercise:3 };
  const exs=tmpl.slots.slice(0,limit).map(sl=>{
    const e=pickEx(sl,equip,used,false,budget); // Evening sessions allow high-sweat exercises
    if(!e) return null;
    used.push(e.id);
    budget.vol[e.muscle]=(budget.vol[e.muscle]||0)+3;
    return {...e,sets:3,sessionMins};
  }).filter(Boolean);
  flagFirstWorkingSet(exs); // compounds first; warm-up flag on first loaded lift
  return exs;
}

function lastLog(exId){
  for(let i=S.logs.length-1;i>=0;i--){
    const e=S.logs[i].exercises?.find(x=>x.id===exId);
    if(e?.sets?.length)return e;
  }return null;
}
// ─── PROGRESSIVE OVERLOAD — set-by-set inter-set scaling ───
// Background logic only (no UI explanation modules). Evaluates the last
// session's full set-history array instead of assuming one uniform weight:
//   1. BASIS: most recent log for this exercise (lastLog), falling back to a
//      manually entered lastWeights value.
//   2. BASELINE: the HIGHEST weight at which any set reached the rep ceiling
//      (rMax). A mid-session manual increase counts — 10×10 / 15×10 / 15×8
//      sets the next session's baseline to 15 lb, never back to 10.
//      If no set reached the ceiling, baseline = heaviest weight attempted.
//   3. TRIGGER: every completed set was performed at (>=) the baseline weight
//      AND reached rMax — the full rep schema is complete at that intensity.
//   4. SUGGESTION when triggered: baseline × 1.04 rounded to nearest 5 lb,
//      with a minimum +5 lb step so light loads (e.g. 15 lb DBs) still
//      progress. Otherwise: suggest the baseline (fill the schema there).
//   5. NOT factored: RPE/RIR (not tracked). Post-session fatigue ratings
//      regulate weekly volume ceilings via getMRVLimits, never load.
function progression(exId,rMax){
  let sets=null,lastDate=null;
  // Most recent log for this exact exercise — track the workout's DATE too,
  // so a long layoff can decay the suggestion (see below).
  for(let i=S.logs.length-1;i>=0;i--){
    const e=S.logs[i].exercises?.find(x=>x.id===exId);
    if(e?.sets?.length){
      const done=e.sets.filter(s=>s.reps>0);
      if(done.length){sets=done;lastDate=S.logs[i].date;}
      break;
    }
  }
  // Fall back to manually entered lastWeights when no log exists
  if(!sets&&S.lastWeights?.[exId]){
    sets=[{weight:S.lastWeights[exId].weight,reps:S.lastWeights[exId].reps}];
    lastDate=S.lastWeights[exId].date||null;
  }
  if(!sets)return null;
  const minR=Math.min(...sets.map(s=>s.reps));
  const maxR=Math.max(...sets.map(s=>s.reps));
  const wMin=Math.min(...sets.map(s=>s.weight||0));
  const wMax=Math.max(...sets.map(s=>s.weight||0));
  // Highest weight at which the rep ceiling was actually hit this session
  const ceilSets=sets.filter(s=>s.reps>=rMax);
  const topW=ceilSets.length?Math.max(...ceilSets.map(s=>s.weight||0)):null;
  let baseline,ready;
  if(topW!=null){
    baseline=topW;
    // Ready to progress when the TOP-weight set(s) hit the rep ceiling. Back-off
    // sets are intentionally lighter (see back-off model), so only sets at or
    // above the top weight gate progression — otherwise the lighter back-off
    // sets would make `ready` permanently false. For uniform (non-back-off)
    // sessions every set is at the top weight, so this is unchanged.
    ready=sets.filter(s=>(s.weight||0)>=topW).every(s=>s.reps>=rMax);
  }else{
    baseline=wMax;
    ready=false;
  }
  let suggest=ready?Math.max(r5(baseline*1.04),baseline+5):baseline;
  // Layoff decay: "repeat last time's weight" assumes last time was recent.
  // After a real layoff detraining sets in, so the suggestion backs off —
  // ≥4 weeks since this movement → 90%, ≥8 weeks → 80% — and the +4%
  // progression bump never fires on top of stale numbers. Undated entries
  // (legacy lastWeights) skip decay rather than guess.
  let layoffWeeks=0;
  if(lastDate){
    const days=Math.floor((Date.now()-new Date(lastDate).getTime())/86400000);
    const f=days>=56?0.8:days>=28?0.9:1;
    if(f<1){
      layoffWeeks=Math.floor(days/7);
      baseline=Math.max(5,r5(baseline*f));
      suggest=baseline;
      ready=false;
    }
  }
  const allEx2=[...EX,...(S.customExercises||[])];
  const exDef2=allEx2.find(e=>e.id===exId);
  const isDb=!!(exDef2&&exDef2.eq.includes('dumbbells')&&!exDef2.eq.includes('barbell'));
  const wSuffix=isDb?' lb ea':' lb';
  const wLabel=wMin===wMax?`${wMax}${wSuffix}`:`${wMin}→${wMax}${wSuffix}`;
  return{weight:baseline,minR,maxR,suggest,ready,layoffWeeks,summary:`${wLabel} × ${minR===maxR?minR:minR+'–'+maxR}`,isDb};
}
function recalcLastWeights(){
  const w={};
  // Sort by workout DATE, not record id: retroactively injected sessions carry
  // a fresh id but a historic date, and progression baselines must follow the
  // true chronological order.
  [...S.logs].sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0).forEach(log=>{
    log.exercises?.forEach(ex=>{
      const sets=ex.sets?.filter(s=>s?.reps>0);
      if(sets?.length){const l=sets[sets.length-1];w[ex.id]={weight:l.weight,reps:l.reps,date:log.date};}
    });
  });
  // MERGE, never replace: S.logs is capped at the last ~10 workouts on save,
  // so a full rebuild silently dropped the remembered weight for any exercise
  // not trained inside that window — and the suggestion engine then fell back
  // to anchor/muscle-group estimates for movements the user HAS done, which
  // must always prefer the user's own history. Ids outside the log window keep
  // their previous entry; anything present in the recent logs wins.
  S.lastWeights=Object.assign({},S.lastWeights||{},w);
}

// ─────────────────────────────────────────────
// INTENSITY ESTIMATION ENGINE — starting weight for unperformed movements
// ─────────────────────────────────────────────
// CONTRACT: estimateStartingWeight() ALWAYS returns a numeric weight plus a
// confidence tag (high/medium/low) for any exercise — it never returns null,
// undefined, or a blank. No loaded movement in a generated workout may render
// without a starting estimate.
//
// Strict fallback order — stop at the FIRST step that produces a value, but
// never exit early without one; the chain always terminates at step 4:
//   1. HISTORY (high):   logged sets for THIS exact exercise → most recent
//      working weight.
//   2/3. RELATED (medium): related movements via the anchor matrix — same
//      muscle-group-focus accessories AND primary compounds — scaled by
//      movement-ratio coefficients that bridge relative strength AND loading
//      convention (barbell total vs. per-hand dumbbell vs. machine stack).
//   3b. GROUP FLOOR (low): best estimated 1RM among any logged lift in the
//      same primary muscle group, taken at a conservative 60% working floor.
//   4. DEFAULT (low):    no reference data at all → a conservative default
//      derived from bodyweight × an experience multiplier × the movement's
//      loading convention. This step can ALWAYS produce a number.
// Coefficients/defaults are deliberately rough: the goal is a safe, in-the-
// ballpark opener the user adjusts on set one, not a precise prediction.

// Derived movement id → ranked anchor list. coef = derived load ÷ anchor load,
// so per-hand dumbbell anchors/targets carry sub-1 or >1 factors accordingly.
const MOVEMENT_CLASS = {

  // ─ Shoulders: overhead press + lateral raise ─
  seated_db_press:[{from:'ohp',coef:0.38},{from:'arnold_press',coef:1.0}], // per-DB
  arnold_press:  [{from:'seated_db_press',coef:1.0},{from:'ohp',coef:0.38}],
  ohp:           [{from:'seated_db_press',coef:2.4}],

  hammer_curl:   [{from:'db_curl',coef:1.0}],

  db_overhead_ext:[{from:'overhead_ext',coef:0.35},{from:'pushdown',coef:0.3}], // per-DB vs cable stack — DB reads well under half the cable number
  // ─ Legs: squat / hinge / machine ─
  goblet:        [{from:'squat',coef:0.35},{from:'leg_press',coef:0.25}], // single DB
  leg_press:     [{from:'squat',coef:1.8}],
  squat:         [{from:'leg_press',coef:0.55},{from:'goblet',coef:2.8}],
  rdl:           [{from:'squat',coef:0.8},{from:'trap_bar_dl',coef:0.85}],
  trap_bar_dl:   [{from:'rdl',coef:1.15},{from:'squat',coef:0.95}],
  // ─ Heavy 1–5 strength tier: pct routes through the anchor's e1RM (see the
  // anchor loop), deliberately opening a touch under true 85–95% — the cue
  // says leave a rep in the tank, and set one calibrates the rest. ─
  heavy_box_squat:  [{from:'squat',pct:0.85},{from:'heavy_trap_bar',pct:0.85,coef:0.95},{from:'trap_bar_dl',pct:0.85,coef:0.95},{from:'leg_press',pct:0.85,coef:0.55},{from:'goblet',pct:0.85,coef:2.8}],

  heavy_rdl:        [{from:'rdl',pct:0.87},{from:'heavy_trap_bar',pct:0.87,coef:0.85},{from:'trap_bar_dl',pct:0.87,coef:0.85},{from:'squat',pct:0.87,coef:0.8}],
  // RFESS total load reads ~55% of a back squat; Bulgarian history is per-DB
  // (×2 for total), goblet is a single DB (~×2.2 bridges to two hands/bar).
  heavy_split_squat:[{from:'bulgarian',pct:0.9,coef:2.0},{from:'squat',pct:0.9,coef:0.55},{from:'goblet',pct:0.9,coef:2.2}],

  ecc_box_squat:    [{from:'heavy_box_squat',pct:0.65},{from:'squat',pct:0.65},{from:'leg_press',pct:0.65,coef:0.55},{from:'goblet',pct:0.65,coef:2.8}],

};

// Epley 1RM estimate from a single working set.
function epley1RM(weight,reps){
  if(!weight||!reps)return 0;
  return weight*(1+reps/30);
}

// Most representative logged working weight for an exercise: the heaviest set
// of its most recent logged session, falling back to a manually entered
// lastWeights value. Returns {weight,reps} or null. Loaded sets only.
function loggedBaseline(exId,logs){
  for(let i=logs.length-1;i>=0;i--){
    const e=logs[i].exercises?.find(x=>x.id===exId);
    const sets=e?.sets?.filter(s=>s?.weight>0&&s?.reps>0);
    if(sets?.length){
      const top=sets.reduce((a,s)=>s.weight>a.weight?s:a,sets[0]);
      return{weight:top.weight,reps:top.reps};
    }
  }
  const lw=S.lastWeights?.[exId];
  if(lw&&lw.weight>0)return{weight:lw.weight,reps:lw.reps||EX.find(e=>e.id===exId)?.rMax||8};
  return null;
}

// Experience proxy for the step-4 default. Honors an explicit cfg.experience
// if ever set; otherwise infers from how many sessions the user has logged.
// (logs are capped at ~10 on save, so this saturates at 'intermediate' — a
// deliberately conservative ceiling for a no-data cold-start guess.)
function experienceLevel(){
  if(S.cfg?.experience)return S.cfg.experience;
  const n=(S.logs||[]).filter(l=>!l.isCardio).length;
  return n>=6?'intermediate':'beginner';
}

// Timed movements that still REQUIRE an external load (e.g. Suitcase Carry's
// dumbbell) get a weight input alongside the seconds field; bodyweight holds
// (wall sits, planks, L-sits, holds where load is optional) don't.
function timedLoaded(ex){return !!ex&&ex.isTimed===true&&!ex.noWeight&&(ex.eq||[]).length>0&&!ex.eq.includes('bodyweight');}

// Step 4 terminal default: a conservative working weight derived from
// bodyweight × experience multiplier × the movement's loading convention.
// ALWAYS returns a positive number — this is the floor that guarantees the
// engine never comes up empty.
function coldStartWeight(def,bodyLbs,exp){
  const eq=def.eq||[];
  const load=eq.includes('barbell')?'bb':eq.includes('machine')?'mach':eq.includes('cables')?'cable':eq.includes('dumbbells')?'db':'bw';
  // Beginner working-set load as a fraction of bodyweight. DB = per hand.
  const COMPOUND={
    legs:     {bb:0.75,mach:1.10,cable:0.50,db:0.30,bw:0.30},
    chest:    {bb:0.50,mach:0.55,cable:0.30,db:0.22,bw:0.20},
    back:     {bb:0.45,mach:0.55,cable:0.45,db:0.22,bw:0.20},
    shoulders:{bb:0.30,mach:0.35,cable:0.20,db:0.13,bw:0.15},
    core:     {bb:0.30,mach:0.35,cable:0.25,db:0.15,bw:0.15},
  };
  const ISO={
    legs:     {mach:0.45,cable:0.25,db:0.15,bb:0.30,bw:0.15},
    chest:    {mach:0.25,cable:0.15,db:0.10,bb:0.20,bw:0.10},
    back:     {mach:0.30,cable:0.20,db:0.10,bb:0.20,bw:0.10},
    shoulders:{mach:0.15,cable:0.07,db:0.05,bb:0.10,bw:0.05},
    biceps:   {mach:0.20,cable:0.18,db:0.10,bb:0.15,bw:0.10},
    triceps:  {mach:0.20,cable:0.18,db:0.10,bb:0.15,bw:0.10},
    core:     {mach:0.20,cable:0.15,db:0.08,bb:0.10,bw:0.08},
  };
  const table=def.type==='compound'?COMPOUND:ISO;
  const fallbackRow=def.type==='compound'?{bb:0.4,mach:0.5,cable:0.3,db:0.2,bw:0.2}:{mach:0.2,cable:0.15,db:0.1,bb:0.15,bw:0.1};
  const row=table[def.muscle]||fallbackRow;
  const frac=row[load]!=null?row[load]:(def.type==='compound'?0.3:0.1);
  const mult=exp==='advanced'?1.6:exp==='intermediate'?1.3:1.0;
  const floor=load==='db'?5:10;
  return Math.max(r5(bodyLbs*frac*mult),floor);
}

// Core engine — see CONTRACT above. ALWAYS returns {weight,source,confidence}
// (with optional `from`), never null. confidence ∈ high|medium|low.
//   source: 'history' | 'anchor' | 'group' | 'default' | 'bodyweight'
function estimateStartingWeight(exId, historicalPerformanceLogs, movementClassMatrix){
  const logs=historicalPerformanceLogs||[];
  const matrix=movementClassMatrix||MOVEMENT_CLASS;
  const def=EX.find(e=>e.id===exId);
  const bodyLbs=S.cfg?.bodyLbs||175;
  const exp=experienceLevel();
  if(!def)return{weight:coldStartWeight({eq:[],type:'isolation',muscle:''},bodyLbs,exp),source:'default',confidence:'low'};

  // Bodyweight / timed movements carry no external load — the "starting weight"
  // is bodyweight itself (the UI still renders reps/seconds, not a weight box).
  // Exception: loaded timed movements (Suitcase Carry) go through the engine.
  if(def.noWeight||(def.isTimed&&!timedLoaded(def)))return{weight:bodyLbs,source:'bodyweight',confidence:'high'};

  // Step 1 — logged history for THIS exact exercise → most recent working weight.
  const own=loggedBaseline(exId,logs);
  if(own&&own.weight>0)return{weight:own.weight,source:'history',from:exId,confidence:'high'};

  // Steps 2/3 — related movements via the anchor matrix, scaled by ratio.
  // Two independent bridges compose per anchor: `coef` bridges the LOADING
  // CONVENTION (barbell total vs per-hand DB vs machine stack) off the
  // anchor's working weight, while `pct` bridges INTENSITY — it runs the
  // anchor's baseline through Epley to an estimated 1RM first, then takes
  // pct of it. pct is what lets the heavy 1–5 @ 85–95% tier be estimated
  // from moderate-rep history: a 185×8 RDL and a 205×5 RDL imply the same
  // ~235 e1RM, so both produce the same ~85% opener, where a flat working-
  // weight coefficient would not.
  for(const a of (matrix[exId]||[])){
    const base=loggedBaseline(a.from,logs);
    if(base&&base.weight>0){
      const raw=a.pct?epley1RM(base.weight,base.reps)*a.pct:base.weight;
      const w=r5(raw*(a.coef!=null?a.coef:1));
      if(w>0)return{weight:w,source:'anchor',from:a.from,confidence:'medium'};
    }
  }

  // Step 3a — explicit per-exercise preset (startW): equipment-constrained
  // loads like a medicine ball, where a strength-scaled estimate from other
  // lifts would be meaningless (nobody chest-passes 60% of their bench 1RM).
  if(def.startW)return{weight:def.startW,source:'preset',confidence:'medium'};

  // Step 3b — best estimated 1RM in the same primary muscle, at a 60% floor.
  let best1RM=0,bestFrom=null;
  EX.forEach(e=>{
    if(e.muscle!==def.muscle||e.noWeight||e.isTimed||e.id===exId)return;
    const base=loggedBaseline(e.id,logs);
    if(base&&base.weight>0){const o=epley1RM(base.weight,base.reps);if(o>best1RM){best1RM=o;bestFrom=e.id;}}
  });
  if(best1RM>0){
    const w=r5(best1RM*0.6);
    if(w>0)return{weight:w,source:'group',from:bestFrom,confidence:'low'};
  }

  // Step 4 — no reference data anywhere: conservative bodyweight-based default.
  // This branch can always produce a number, so the engine never returns null.
  return{weight:coldStartWeight(def,bodyLbs,exp),source:'default',confidence:'low'};
}

// Human-readable basis for an estimate, for the workout UI hints.
function estBasisLabel(est){
  if(!est)return'';
  if(est.source==='history')return'your last session';
  if(est.source==='anchor')return`scaled from your ${EX.find(e=>e.id===est.from)?.name||'related lift'}`;
  if(est.source==='preset')return'typical starting load for this movement';
  if(est.source==='group')return`60% floor from your ${EX.find(e=>e.id===est.from)?.name||'best in-group lift'}`;
  if(est.source==='default')return`${experienceLevel()}-level default from your bodyweight`;
  return'estimate';
}
function fmtDate(iso){
  const d=new Date(iso);
  return d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
}
function fmtDur(mins){return mins<60?`${mins}m`:`${Math.floor(mins/60)}h ${mins%60}m`;}

// ─────────────────────────────────────────────
// CALORIE / CARDIO MATH
// ─────────────────────────────────────────────
function estimateStrengthCals(mins,bodyLbs){
  return Math.round(bodyLbs*0.033*mins);
}

// ─── CARDIO ACTIVITY LOGGING ───
// Loggable activities for the "Log Cardio Activity" flow (distinct from the
// pre-workout cardioOptions() suggestion card above/below — this computes
// calories FROM a duration you already did, rather than a duration to hit a
// target). Incline Walking and Weighted Vest Walking are pinned to exactly 2x
// the flat-walk rate per instruction, rather than the more granular ACSM-grade
// formula cardioOptions uses for its own incline-treadmill suggestion.
const CARDIO_ACTIVITIES=[
  {id:'walk',name:'Walk (flat)',icon:'🚶'},
  {id:'incline_walk',name:'Incline Walking',icon:'⛰️',multiplier:2},
  {id:'weighted_vest_walk',name:'Weighted Vest Walking',icon:'🎒',multiplier:2},
  {id:'stair_stepper',name:'Stair Stepper',icon:'🪜'},
  {id:'elliptical',name:'Elliptical',icon:'⚡'},
  {id:'run',name:'Run',icon:'🏃‍♂️'},
];
function cardioCalPerMin(activityId,bodyLbs){
  const walkCpm=bodyLbs*0.0245; // 3 mph flat walk baseline, MET ~3.5
  switch(activityId){
    case 'incline_walk': return walkCpm*2;
    case 'weighted_vest_walk': return walkCpm*2;
    case 'stair_stepper': return bodyLbs*0.063;
    case 'elliptical': return bodyLbs*0.038;
    case 'run': return bodyLbs*0.070;
    case 'walk': default: return walkCpm;
  }
}

function cardioOptions(cals,bodyLbs){
  if(cals<=0)return[];
  const m=(cpm)=>Math.round(cals/cpm);
  const mi=(mph,min)=>((mph*min)/60).toFixed(1);
  // 3 mph walk: MET ~3.5, cals = MET * bodyKg * hrs
  const walkCpm=bodyLbs*0.0245; // 3 mph
  // Stair stepper: MET ~9, resistance level 8-12 typical YMCA
  const stairCpm=bodyLbs*0.063;
  // Elliptical: MET ~5.5, resistance 10-14 typical
  const ellCpm=bodyLbs*0.038;
  // Run 9-10 min/mile = ~6-6.7 mph, use 6.3 mph midpoint: MET ~10
  const runCpm=bodyLbs*0.070;
  // LISS incline treadmill (3.0 mph @ 6% grade): ACSM walking equation —
  // VO2 = 0.1*speed(m/min) + 1.8*speed*grade + 3.5 = ~20.2 ml/kg/min,
  // kcal/min = VO2 * bodyKg / 200. Grade roughly doubles the calorie cost of
  // flat walking while staying low-impact — good for fasted/pre-sleep fat
  // oxidation without the joint stress of running.
  const inclineCpm=bodyLbs*0.0459; // 3.0 mph @ 6% incline
  const wm=m(walkCpm),sm=m(stairCpm),em=m(ellCpm),rm=m(runCpm),im=m(inclineCpm);
  // Stair stepper resistance: rough scale based on calorie target/body weight
  const stairRes=Math.min(20,Math.max(8,Math.round(8+(bodyLbs-150)/25)));
  // Elliptical resistance: similar scale
  const ellRes=Math.min(20,Math.max(10,Math.round(10+(bodyLbs-150)/20)));
  return[
    {name:'Walk Outside',icon:'🚶',min:wm,dist:`${mi(3,wm)} mi`,note:'3 mph · flat ground',busy:false},
    {name:'Stair Stepper',icon:'🪜',min:sm,dist:'—',note:`Resistance level ${stairRes}`,busy:true},
    {name:'Elliptical',icon:'⚡',min:em,dist:'—',note:`Resistance level ${ellRes} · moderate stride`,busy:false},
    {name:'Incline Treadmill (LISS)',icon:'🏃',min:im,dist:`${mi(3,im)} mi`,note:'3.0 mph · 6% incline · fasted AM or pre-sleep for fat oxidation',busy:false},
    {name:'Run Outside',icon:'🏃‍♂️',min:rm,dist:`${mi(6.3,rm)} mi`,note:'9–10 min/mile pace',busy:false},
  ];
}

function calcWeekCardio(){
  const entry=getCalEntry();
  if(!entry||!S.program)return null;
  const plan=getWeekPlan();
  if(!plan)return null;
  const bodyLbs=S.cfg.bodyLbs||175;
  const today=todayStr();
  const rangeStart=today>entry.startDate?today:entry.startDate;
  const daysLeft=Math.max(1,daysBetween(rangeStart,entry.endDate)+1);
  const mondayDate=plan.weekOf;
  const strengthCals=S.program.week.filter(d=>{
    if(d.rest)return false;
    const dayDate=d.dow===0?addDays(mondayDate,6):addDays(mondayDate,d.dow-1);
    return dayDate>=rangeStart&&dayDate<=entry.endDate;
  }).reduce((sum,d)=>{
    const primary=estimateStrengthCals(d.sessionMins||45,bodyLbs);
    const eve=d.eveningSession?estimateStrengthCals(d.eveningSession.mins||60,bodyLbs):0;
    return sum+primary+eve;
  },0);
  // The calorie goal is a pure cardio target: prescribe cardio that adds up to
  // the full goal. Lifting burns extra calories on top and is NOT subtracted —
  // strengthCals is kept for display context only. (Subtracting it caused the
  // goal to be fully "covered" by lifting on normal training weeks, which
  // silently hid the cardio prescriptions.)
  const cardioCalsNeeded=Math.max(0,entry.cals);
  const calsPerDay=Math.round(cardioCalsNeeded/daysLeft);
  return{strengthCals,cardioCalsNeeded,calsPerDay,daysLeft,options:cardioOptions(calsPerDay,bodyLbs)};
}

// ─────────────────────────────────────────────
// REST TIMER
// ─────────────────────────────────────────────
// Intensity-based rest: heavy compounds need ≥2-3 min for full performance on
// the next set (Schoenfeld 2016 — longer inter-set rest beats 1 min for both
// strength and hypertrophy on compounds). Isolation floor raised 60→90s per
// Singer et al. 2024 Bayesian meta-analysis ("Give it a Rest", Frontiers
// Sports Act Living): ≤60s is the only clearly suboptimal zone for
// hypertrophy; no further benefit beyond ~90s, so 90s is the isolation minimum.
function smartRest(ex){
  if(ex.isTimed||ex.noWeight)return ex.rest||60;
  if(ex.type==='compound')return ex.rMax<=8?180:(ex.rMax<=12?150:120);
  return 90;
}
function smartRestLabel(ex){
  const s=smartRest(ex);
  const t=s>=60?(s%60===0?`${s/60} min`:`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`):`${s}s`;
  const why=ex.type==='compound'?(ex.rMax<=8?'heavy compound':'compound'):'isolation';
  return`${t} rest between sets (${why})`;
}
function startRest(secs,exName){
  if(timerIv)clearInterval(timerIv);
  S.active.restEndsAt=Date.now()+secs*1000;
  S.active.restTotal=secs;
  const ov=document.getElementById('rest-ov');
  document.getElementById('rest-exname').textContent=exName||'';
  ov.classList.add('on');
  const ring=document.getElementById('t-ring');
  const num=document.getElementById('t-num');
  const C=339;
  timerIv=setInterval(()=>{
    const rem=Math.ceil((S.active.restEndsAt-Date.now())/1000);
    if(rem<=0){stopRest(true);return;}
    const m=Math.floor(rem/60),ss=rem%60;
    num.textContent=`${m}:${String(ss).padStart(2,'0')}`;
    const pct=(S.active.restTotal-rem)/S.active.restTotal;
    ring.style.strokeDashoffset=(C*pct).toFixed(1);
  },250);
}
function playAlarm(){
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    [[880,0],[880,0.3],[1100,0.6]].forEach(([f,t])=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.connect(g);g.connect(ctx.destination);
      o.type='sine';o.frequency.value=f;
      g.gain.setValueAtTime(0.35,ctx.currentTime+t);
      g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+t+0.22);
      o.start(ctx.currentTime+t);o.stop(ctx.currentTime+t+0.25);
    });
  }catch(e){}
}
function stopRest(alarm){
  if(timerIv){clearInterval(timerIv);timerIv=null;}
  if(alarm)playAlarm();
  S.active&&(delete S.active.restEndsAt)&&(delete S.active.restTotal);
  document.getElementById('rest-ov').classList.remove('on');
  document.getElementById('t-ring').style.strokeDashoffset='0';
}

// ─────────────────────────────────────────────
// ACTIVE WORKOUT LOGIC
// ─────────────────────────────────────────────
// ─── DAILY SESSION CONSTRAINTS (user's local calendar day) ───
// Count of lifting sessions logged on a given local day. The app allows at
// most TWO per day (lunch + evening); a third is always refused.
function liftingSessionsOn(dayStr){
  // Cardio/VO2 logs don't occupy a lifting slot
  return (S.logs||[]).filter(l=>!l.isCardio&&logDay(l.date)===dayStr).length;
}

// Execution-time auto-regulation for the SECOND session of a day, ported from
// the backend design's 60% rule. Daily per-muscle budget = 50% of the weekly
// MRV max (which already reflects fatigue reductions). Reading today's logged
// session at start time:
//   ≤60% of a muscle's daily budget used → session 2 untouched for that muscle
//   >60% used → session 2's sets for it capped at (budget − used) × 0.85
//   ≥95% used → the muscle is blocked for session 2 (exercises dropped)
function applyDailyAutoReg(exs){
  const prior=(S.logs||[]).filter(l=>logDay(l.date)===todayStr());
  if(!prior.length)return{exs,notes:[]};
  const limits=getMRVLimits();
  const used={};
  prior.forEach(l=>(l.exercises||[]).forEach(e=>{
    const n=e.sets?.filter(s=>s&&s.reps>0).length||0;
    if(e.muscle&&n)used[e.muscle]=(used[e.muscle]||0)+n;
  }));
  const capFor=m=>Math.max(3,Math.round((limits[m]?.max??16)*0.5));
  const remaining={},state={},notes=[];
  Object.keys(used).forEach(m=>{
    const cap=capFor(m),u=used[m];
    if(u>=cap*0.95){
      state[m]='blocked';
      notes.push(`${MNAME[m]||m}: blocked — ${u}/${cap} daily sets already done`);
    }else if(u>cap*0.6){
      remaining[m]=Math.max(0,Math.floor((cap-u)*0.85));
      state[m]='reduced';
      notes.push(`${MNAME[m]||m}: capped at ${remaining[m]} set${remaining[m]===1?'':'s'} — session 1 used ${Math.round(u/cap*100)}% of today's budget`);
    }
  });
  const out=[];
  exs.forEach(e=>{
    const st=state[e.muscle];
    if(st==='blocked')return;
    if(st==='reduced'){
      const take=Math.min(e.sets||3,remaining[e.muscle]);
      if(take<=0)return;
      remaining[e.muscle]-=take;
      out.push({...e,sets:take,autoReg:true});
    }else out.push(e);
  });
  return{exs:out,notes};
}

function startWorkout(day,sessionType){
  // Two-per-day cap, judged on the LOCAL calendar day
  const sessionsToday=liftingSessionsOn(todayStr());
  if(sessionsToday>=2){
    alert('Daily session limit: two lifting sessions are already logged today. Recovery beats more volume — go again tomorrow.');
    return;
  }
  const isEve=sessionType==='eve'&&day.eveningSession;
  const src=isEve?day.eveningSession:day;
  // Use every exercise the program built for this session — it's already sized
  // at generation time (lunch=3, longer sessions=EX_LIMIT[mins]). Re-slicing
  // here with a hardcoded 3 for non-evening sessions hid exercises on 60/90-min
  // primary days; this keeps the started workout in sync with the Program tab.
  let rawExs=src.exercises.slice();
  // Makeup logic only for primary (lunch) sessions
  if(!isEve){
    const missed=getMissedDays();
    if(missed.length>0){
      const todayMuscles=new Set(rawExs.map(e=>e.muscle));
      missed.forEach(missedDow=>{
        const md=S.program.week[missedDow];
        if(!md||md.rest)return;
        const mu=md.exercises.find(e=>!todayMuscles.has(e.muscle));
        if(mu){rawExs=[...rawExs,{...mu,sets:2,isMakeup:true,makeupFrom:md.name}];todayMuscles.add(mu.muscle);}
      });
    }
  }
  // Lunch time-box clamp: mirrors the generation-time rule (lead lift 3 sets,
  // 2 for the rest) so sessions generated or preserved BEFORE the 2026-07-14
  // calibration also fit the 35–40 min box the moment they're started.
  if(src.isLunch)rawExs=rawExs.map((e,i)=>i>0&&e.sets>2?{...e,sets:2}:e);
  // Second session of the day → apply the 60% execution-time rule against
  // what was actually logged earlier today (not what was planned)
  let autoRegNotes=[];
  if(sessionsToday===1){
    const reg=applyDailyAutoReg(rawExs);
    rawExs=reg.exs;autoRegNotes=reg.notes;
    if(!rawExs.length){
      alert("Today's earlier session already used the volume budget for every muscle in this workout. Session blocked — recover and hit it tomorrow.");
      return;
    }
  }
  S.active={
    // Classify from the session's OWN flag, not from isEve. isEve is only true
    // when the day has a separate sibling eveningSession, which exists only on
    // days that ALSO have a lunch. An after-work session on a lunch-less day is
    // the day's PRIMARY session (eveningSession=null), so keying lunch off isEve
    // misread it as a 40-min lunch → 90s rest cap + wrong duration. src.isLunch
    // is set correctly at generation time for both the primary and the sibling.
    dayName:src.name,dow:day.dow,startTime:Date.now(),isLunch:!!src.isLunch,
    sessionMins:src.mins||src.sessionMins||40,loc:src.loc||'ymca',equipmentKey:src.equipmentKey||'ymca',restCap:src.isLunch?90:null,exIdx:0,
    autoRegNotes,
    // Initialization attaches an estimatedStartingWeight to any movement the
    // user has never logged, derived from related lifts via the intensity
    // estimation engine. null for movements with their own history.
    exercises:rawExs.map(e=>({...e,done:[],estW:estimateStartingWeight(e.id,S.logs,MOVEMENT_CLASS)})),
  };
  S.view='workout';save();render();
}

function completeSet(exIdx,setIdx){
  const ex=S.active.exercises[exIdx];
  const wEl=document.getElementById(`w-${exIdx}-${setIdx}`);
  const rEl=document.getElementById(`r-${exIdx}-${setIdx}`);
  const w=(ex?.noWeight||(ex?.isTimed&&!timedLoaded(ex)))?0:(parseFloat(wEl?.value)||0);
  const reps=parseInt(rEl?.value)||0;
  if(!reps){if(rEl)rEl.focus();return;}
  ex.done[setIdx]={weight:w,reps};
  const row=document.getElementById(`sr-${exIdx}-${setIdx}`);
  if(row){
    row.classList.add('done');
    const db=row.querySelector('.done-btn');
    if(db){db.innerHTML='↩';db.dataset.action='undo-set';}
    row.querySelectorAll('.ni').forEach(inp=>{if(inp.id!==`w-${exIdx}-${setIdx}`||wEl)inp.disabled=true;});
  }
  const allDone=ex.done.filter(Boolean).length>=ex.sets;
  if(allDone){const nb=document.getElementById(`next-btn-${exIdx}`);if(nb)nb.style.display='flex';}
  save();
  // Lunch sessions keep the 90s cap (hard 40-min time box); evenings get the
  // full intensity-based rest.
  const restSecs=S.active.restCap?Math.min(smartRest(ex),S.active.restCap):smartRest(ex);
  startRest(restSecs,ex.name);
}

function updateWarmup(exIdx,weight){
  const w=parseFloat(weight);if(!w||w<=0)return;
  const set=(id,val)=>{const el=document.getElementById(id);if(el)el.textContent=`${r5(w*val)} lb`;};
  set(`wu1-${exIdx}`,0.5);set(`wu2-${exIdx}`,0.75);set(`wu3-${exIdx}`,0.9);
}

function goToEx(idx){S.active.exIdx=idx;save();render();}

function finishWorkout(fatigue){
  const exData=S.active.exercises.map(e=>({id:e.id,name:e.name,muscle:e.muscle,sets:e.done.filter(Boolean)}));
  // Update lastWeights — only last set's weight per exercise, that's all we need
  exData.forEach(e=>{
    const working=e.sets.filter(s=>s&&s.reps>0&&!e.isMakeup);
    if(working.length){const last=working[working.length-1];S.lastWeights[e.id]={weight:last.weight,reps:last.reps,date:new Date().toISOString()};}
  });
  const log={id:Date.now().toString(),date:new Date().toISOString(),dayName:S.active.dayName,isLunch:S.active.isLunch,duration:Math.round((Date.now()-S.active.startTime)/60000),exercises:exData,fatigue:fatigue||null};
  S.logs.push(log);S.active=null;S.view='dash';
  // Re-plan the rest of the week around what was just trained: recovery ordering
  // + the lockout windows push the just-worked muscle groups to later days (e.g.
  // a pull session today moves the next pull off of Wednesday in favor of a
  // rested split slot), while completed days stay locked to their logs.
  replanCurrentWeek();
  stopRest();save();render();
}

function abandonWorkout(){
  if(!confirm('Abandon this workout? Progress will be lost.'))return;
  S.active=null;S.view='dash';stopRest();save();render();
}

function getFinisher(dow,isLunch){
  // Hip caution drops jump-based finishers, mirroring the pickEx plyometric ban.
  // Lunch sessions only draw from the lunchOK (low-sweat) subset — sprints and
  // hard intervals live on evenings/weekends so the lunch time-box stays dry.
  const pool=CONDITIONING_FINISHERS.filter(f=>!(f.plyo&&S.cfg.hipCaution)&&(!isLunch||f.lunchOK));
  return pool[dow%pool.length];
}

function renderDash(){
  const today=todayDay();const dow=todayDow();const isSunday=dow===0;
  const missed=getMissedDays();
  const completedDows=getCompletedDows();
  const wkGrid=S.program.week.map((d,i)=>{
    const isToday=i===dow;
    const isViewing=S.viewDay===i;
    const isMissed=missed.includes(i);
    const isCompleted=completedDows.has(i);
    // isCompleted checked FIRST — a regenerated week can mark this day rest
    // even though it was actually trained; the log (behind isCompleted) is
    // the source of truth and always wins over the plan's current shape.
    let dot;
    if(isCompleted)dot='background:var(--ok)';
    else if(d.rest)dot='background:var(--bdr)';
    else if(isMissed)dot='background:var(--bad)';
    else if(isToday)dot='background:var(--ok)';
    else dot='background:var(--warn)';
    return`<div class='wk-day${isToday?' today':''}${isViewing?' viewing':''}' data-action='view-day' data-dow='${i}'>
      <div class='wk-dn'${isCompleted?" style='color:var(--ok)'":''}>${isCompleted?'✓':DOW[i].slice(0,1)}</div>
      <div class='wk-dot' style='${dot}'></div>
    </div>`;
  }).join('');

  // Determine which day to show (viewDay or today)
  const showDow=S.viewDay!=null?S.viewDay:dow;
  const showDay=S.program.week[showDow];
  const isViewingOther=S.viewDay!=null&&S.viewDay!==dow;

  function dayCard(d,displayDow,isActualToday){
    // Handle custom workout days
    if(d && d.customWorkout && d.customLog) {
      const log = d.customLog;
      const exList = log.exercises.slice(0,3).map(ex =>
        `<div class='t-ex'><span style='color:var(--acc)'>•</span> ${ex.name} ${ex.sets?.length || 1}×${ex.sets?.[0]?.reps || ex.reps}</div>`
      ).join('');
      const moreText = log.exercises.length > 3 ? `<div class='t-ex' style='color:var(--mut)'>+${log.exercises.length-3} more exercises</div>` : '';

      return `<div class='today' style='border-color:var(--acc);background:linear-gradient(135deg,var(--surf2) 0%,rgba(129,140,248,.04) 100%)'>
        <div class='t-lbl' style='color:var(--acc)'>${isActualToday?'Today · ':''}Custom Workout</div>
        <div class='t-name'>${log.dayName}</div>
        <div class='t-desc'>Logged custom workout · Week adapted for recovery</div>
        <div class='t-exlist' style='margin-bottom:12px'>${exList}${moreText}</div>
        ${isActualToday?`<button class='btn btn-g btn-sm' data-action='log-custom-workout' data-dow='${displayDow}' style='width:100%'>📝 Log Another Workout</button>`:''}
      </div>`;
    }

    // Handle planned custom workout days
    if(d && d.plannedCustomWorkout && d.plannedCustomLog) {
      const log = d.plannedCustomLog;
      const exList = log.exercises.slice(0,3).map(ex =>
        `<div class='t-ex'><span style='color:var(--warn)'>📅</span> ${ex.name} ${ex.sets?.length || 1}×${ex.sets?.[0]?.reps || ex.reps}</div>`
      ).join('');
      const moreText = log.exercises.length > 3 ? `<div class='t-ex' style='color:var(--mut)'>+${log.exercises.length-3} more exercises</div>` : '';

      return `<div class='today' style='border-color:var(--warn);background:linear-gradient(135deg,var(--surf2) 0%,rgba(251,191,36,.04) 100%)'>
        <div class='t-lbl' style='color:var(--warn)'>${isActualToday?'Today · ':''}Planned Workout</div>
        <div class='t-name'>${log.dayName}</div>
        <div class='t-desc'>Week adapted around planned workout</div>
        <div class='t-exlist' style='margin-bottom:12px'>${exList}${moreText}</div>
        <div style='display:flex;gap:8px'>
          ${isActualToday?`<button class='btn btn-p btn-sm' data-action='log-custom-workout' data-dow='${displayDow}' style='flex:1'>📝 Complete Workout</button>`:`<button class='btn btn-g btn-sm' data-action='log-custom-workout' data-dow='${displayDow}' style='flex:1'>📝 Log Workout</button>`}
          <button class='btn btn-g btn-sm' data-action='cancel-planned-workout' data-dow='${displayDow}' style='flex:1'>❌ Cancel</button>
        </div>
      </div>`;
    }

    const isCompleted=completedDows.has(displayDow);
    // Loaded BEFORE the rest-day check — a full regeneration can mark this
    // dow as rest even though it was actually trained; the log is unaffected
    // by that and remains the source of truth for whether/what was done.
    const loggedSess=isCompleted?getLoggedSessionForDow(displayDow):null;

    if((!d||d.rest)&&!loggedSess){
      const label=isActualToday?(isSunday?'Sunday · Plan Your Week':'Rest Day 😴'):(DOW[displayDow]+' · Rest');
      return isActualToday&&isSunday
        ?`<div class='today' style='border-color:rgba(251,191,36,.35);background:linear-gradient(135deg,var(--surf2) 0%,rgba(251,191,36,.04) 100%)'>
            <div class='t-lbl' style='color:var(--warn)'>Sunday · Plan Your Week</div>
            <div class='t-name'>Set Up This Week</div>
            <div class='t-desc'>Tap "Edit" on the Weekly Goal card below to schedule sessions and set your calorie goal.</div>
            ${recoveryHTML(displayDow)}
          </div>`
        :`<div class='today'><div class='t-lbl'>${isActualToday?'Today':DOW[displayDow]}</div><div class='t-name'>${label}</div><div class='t-desc'>${isActualToday?'Recovery is where the growth happens.':''}</div>${isActualToday?recoveryHTML(displayDow):''}</div>`;
    }
    // The plan's own view of this dow — null when the (possibly regenerated)
    // program disagrees with what was actually logged (marks it rest, or is
    // simply absent). All fields below fall back to the log in that case.
    const dd=(d&&!d.rest)?d:null;
    const exRow=e=>{
      const exp=S.viewExDetail===e.id;
      const lw=S.lastWeights?.[e.id];
      const prog=progression(e.id,e.rMax);
      const estP=(!prog&&!e.noWeight&&(!e.isTimed||timedLoaded(e)))?estimateStartingWeight(e.id,S.logs,MOVEMENT_CLASS):null;
      const detail=exp?`<div style='margin:4px 0 4px 0;padding:8px;background:var(--surf2);border-radius:8px;font-size:12px'>
        ${(()=>{const isDbEd=e.eq?.includes('dumbbells')&&!e.eq?.includes('barbell');const wUnitEd=isDbEd?'lb ea':'lb';return prog?`<div style='margin-bottom:8px'>Last: <strong>${prog.summary}</strong> &nbsp;→&nbsp; <span style='color:var(--acc)'>Goal: ${prog.suggest} ${wUnitEd}</span></div>`:estP?`<div style='margin-bottom:8px'>No history yet — <span style='color:var(--acc)'>estimated start ~${estP.weight} ${wUnitEd}</span> · ${estP.confidence} confidence (${estBasisLabel(estP)}). Adjust if needed:</div>`:`<div style='color:var(--mut);margin-bottom:8px'>No history on this device — enter your last session:</div>`;})()}
        <div style='display:flex;gap:6px;align-items:center;margin-bottom:${e.cue?'8px':'0'}'>
          <input type='number' id='ew-${e.id}' placeholder='${e.eq?.includes('dumbbells')&&!e.eq?.includes('barbell')?'lb ea':'lb'}' value='${lw?.weight||''}' class='ni' step='5' min='0' inputmode='decimal' style='width:72px'>
          <input type='number' id='er-${e.id}' placeholder='reps' value='${lw?.reps||''}' class='ni' min='1' max='50' inputmode='numeric' style='width:60px'>
          <button class='btn btn-s btn-sm' data-action='save-ex-weight' data-exid='${e.id}' style='flex:1'>Save</button>
        </div>
        ${e.cue?`<div style='color:var(--mut);line-height:1.6;padding-top:8px;border-top:1px solid var(--bdr)'>${e.cue}</div>`:''}
        ${feelFor(e)?`<div style='color:var(--acc);line-height:1.6;padding-top:8px'>🎯 <strong>Feel it:</strong> ${feelFor(e)}</div>`:''}
      </div>`:'';
      // Only the NAME ROW is the click target — detail panel sits outside it so inputs don't collapse the panel
      return`<div class='t-ex' style='flex-direction:column;align-items:flex-start'>
        <div data-action='view-ex-detail' data-exid='${e.id}' style='display:flex;align-items:center;gap:6px;width:100%;cursor:pointer'>
          <span style='width:8px;height:8px;border-radius:50%;background:${MCOL[e.muscle]};flex-shrink:0;display:inline-block'></span>${e.name}<span style='font-size:11px;color:var(--mut);margin-left:auto'>${lw?lw.weight+' lb':'tap'}</span>
        </div>
        ${detail}
      </div>`;
    };
    // A completed day shows what was actually logged, not the (possibly since-
    // regenerated) planned template.
    const dispName=loggedSess?loggedSess.dayName:dd.name;
    const dispDesc=loggedSess?`Completed · ${loggedSess.exercises.length} exercise${loggedSess.exercises.length!==1?'s':''} logged`:dd.desc;
    const exList=loggedSess?loggedExRows(loggedSess):dd.exercises.slice(0,3).map(exRow).join('');
    const makeupNote=isActualToday&&missed.length>0?`<div style='font-size:12px;color:var(--bad);margin-bottom:10px'>⚡ +${missed.length} make-up exercise${missed.length>1?'s':''} added (${missed.map(m=>DOW[m]).join(', ')} missed)</div>`:'';
    const completedBanner=isCompleted?`<div style='display:flex;align-items:center;gap:8px;margin-bottom:10px;padding:10px 12px;background:rgba(74,222,128,.08);border:1px solid rgba(74,222,128,.3);border-radius:10px'><span style='font-size:16px'>✅</span><span style='font-size:13px;font-weight:700;color:var(--ok)'>Completed${isActualToday?' today':''} — nice work!</span></div>`:'';
    const lunchBadge=dd?.isLunch?`<span class='badge badge-lunch' style='margin-left:8px'>YMCA · 35–40 min</span>`:`<span class='badge badge-eve' style='margin-left:8px'>${dd?.sessionMins||60} min</span>`;
    // Evening session block
    let eveBlock='';
    if(dd?.eveningSession){
      const eveExs=dd.eveningSession.exercises.slice(0,3).map(exRow).join('');
      eveBlock=`<div style='margin-top:12px;padding-top:12px;border-top:1px solid var(--bdr)'>
        <div style='font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--acc);margin-bottom:6px'>After Work · ${dd.eveningSession.mins} min</div>
        <div style='font-size:14px;font-weight:700;margin-bottom:4px'>${dd.eveningSession.name}</div>
        <div class='t-exlist'>${eveExs}</div>
        ${isActualToday?`<button class='btn btn-s' data-action='start-workout' data-session='eve' style='margin-top:8px'>Start Evening Workout →</button>`:''}
      </div>`;
    }
    return`<div class='today'${isCompleted?" style='border-color:rgba(74,222,128,.4)'":''}>
      <div class='t-lbl' style='display:flex;align-items:center;flex-wrap:wrap;gap:4px'>${isActualToday?'Today':''}${isActualToday?' · ':''}${DOW[displayDow]}${lunchBadge}${isCompleted?`<span class='badge' style='margin-left:8px;background:rgba(74,222,128,.15);color:var(--ok)'>✓ Completed</span>`:''}</div>
      <div class='t-name'>${dispName}</div>
      <div class='t-desc'>${dispDesc}</div>
      <div class='t-exlist'>${exList}</div>
      ${completedBanner}
      ${makeupNote}
      ${isActualToday&&!isCompleted?`<button class='btn btn-p' data-action='start-workout' data-session='lunch'>Start${dd?.eveningSession?' Lunch':''} Workout →</button>`:''}
      ${isActualToday&&isCompleted?`<button class='btn btn-g btn-sm' data-action='start-workout' data-session='lunch' style='width:100%'>↻ Repeat Workout</button>`:''}
      ${displayDow > todayDow() || (displayDow === 0 && todayDow() < 6) ?
        `<button class='btn btn-g btn-sm' data-action='plan-custom-workout' data-dow='${displayDow}' style='margin-top:8px;width:100%'>📅 Plan Custom Workout</button>` :
        `<button class='btn btn-g btn-sm' data-action='log-custom-workout' data-dow='${displayDow}' style='margin-top:8px;width:100%'>📝 ${isActualToday?'Log Custom Workout Instead':'Log Custom Workout'}</button>`
      }
      ${eveBlock}
      ${isActualToday&&S.cfg.conditioning?finisherHTML(displayDow,true,!!dd?.isLunch&&!dd?.eveningSession):''}
    </div>`;
  }

  let todayHTML=dayCard(showDay,showDow,!isViewingOther);
  if(isViewingOther){
    todayHTML=`<div style='display:flex;align-items:center;gap:8px;margin-bottom:8px'>
      <button class='btn btn-g btn-sm' data-action='view-day' data-dow='${S.viewDay}' style='width:auto'>← Back to Today</button>
      <span style='font-size:13px;color:var(--mut)'>Viewing ${DOW[showDow]}</span>
    </div>${todayHTML}`;
  }

  const entry=getCalEntry();
  const cardio=calcWeekCardio();
  let cardioHTML='';
  if(cardio){
    if(cardio.cardioCalsNeeded<=0){
      cardioHTML=`<div class='prog-hint' style='margin-top:10px'>✅ Strength covers your goal!</div>`;
    } else {
      const rows=cardio.options.map(o=>`<div class='cardio-row${o.busy?' cardio-busy':''}'>
        <div class='cr-icon'>${o.icon}</div>
        <div class='cr-body'><div class='cr-name'>${o.name}${o.busy?`<span class='cr-busy-tag'>often busy</span>`:''}</div><div class='cr-note'>${o.note}</div></div>
        <div class='cr-right'><div class='cr-dur'>${o.min} min</div><div class='cr-dist'>${o.dist}</div></div>
      </div>`).join('');
      cardioHTML=`<div style='margin-top:10px;padding-top:10px;border-top:1px solid var(--bdr)'>
        <div class='sec-lbl' style='margin-bottom:6px'>Daily Cardio · ${cardio.calsPerDay} cal/day</div>
        <div class='cardio-list'>${rows}</div>
        <div style='font-size:11px;color:var(--mut);margin-top:8px'>${cardio.cardioCalsNeeded} cardio cal target · ${cardio.daysLeft} days left · lifting burns ~${cardio.strengthCals} cal on top</div>
      </div>`;
    }
  }

  // VO2 max protocol — offered on days whose evening is NOT a lifting session
  // (rest days, weekends, cardio evenings). Aerobic only: never touches MRV.
  // Viewing a PAST day of this week retargets the card to THAT day, so a
  // forgotten session (Friday's Norwegian 4×4 remembered on Saturday) is
  // saved with Friday's date — recovery and history logic key off log dates.
  let vo2HTML='';
  {
    const viewDow2=S.viewDay!=null?S.viewDay:dow;
    const isBackdate=viewDow2!==dow;
    const isPastDay=viewDow2<dow; // week grid covers the current Sun–Sat only
    if(!isBackdate||isPastDay){
      const todayD=todayDay();
      const eveningFree=!todayD||todayD.rest||!todayD.eveningSession;
      // Backdating skips the evening-free gate: it records what actually
      // happened, even on a day that also had a lifting session.
      if(isBackdate||eveningFree){
        const proto=currentVO2Protocol();
        const targetDateStr=isBackdate?addDays(todayStr(),viewDow2-dow):todayStr();
        const tomorrow=S.program?.week[(dow+1)%7];
        const legsTomorrow=!isBackdate&&!!(tomorrow&&!tomorrow.rest&&(tomorrow.exercises||[]).some(e=>e.muscle==='legs'&&e.type==='compound'));
        const doneThatDay=vo2History().some(l=>logDay(l.date)===targetDateStr);
        vo2HTML=`<div style='margin-top:10px;padding-top:10px;border-top:1px solid var(--bdr)'>
        <div class='sec-lbl' style='margin-bottom:6px'>Aerobic Engine · ${isBackdate?`Log for ${DOW[viewDow2]}`:'Evening Protocol'}${proto.lvl?` · Session ${proto.lvl+1}`:''}</div>
        <div class='cardio-row'>
          <div class='cr-icon'>${proto.icon}</div>
          <div class='cr-body'><div class='cr-name'>${proto.name}</div><div class='cr-note'>${proto.desc}</div></div>
          <div class='cr-right'><div class='cr-dur'>${proto.mins} min</div><div class='cr-dist'>aerobic</div></div>
        </div>
        ${legsTomorrow?`<div style='font-size:11px;color:var(--warn);margin-top:6px'>⚠️ Legs are programmed tomorrow — keep the easy portions truly easy, or shift this to another evening.</div>`:''}
        ${doneThatDay
          ?`<div class='prog-hint' style='margin-top:8px'>✅ VO2 session logged ${isBackdate?DOW[viewDow2]:'today'}</div>`
          :`<button class='btn btn-s btn-sm' data-action='log-vo2-session' data-date='${targetDateStr}' style='margin-top:8px;width:100%'>🫀 Log Engine Session Done${isBackdate?` — for ${DOW[viewDow2]}`:''}</button>`}
        <div style='font-size:11px;color:var(--mut);margin-top:6px'>${isBackdate?`Saves to ${DOW[viewDow2]} ${targetDateStr} — tap "Back to Today" when done. `:''}+1 interval every 4 sessions, protocols alternate. Doesn't count against lifting MRV or the two-session daily cap.</div>
      </div>`;
      }
    }
  }
  const planCard=`<div class='card' style='margin-bottom:14px'>
    <div style='display:flex;justify-content:space-between;align-items:center;margin-bottom:8px'>
      <div class='sec-lbl' style='margin-bottom:0'>Weekly Goal</div>
      <button class='btn btn-p btn-sm' data-action='go-plan' style='width:auto'>${isSunday?'Plan Week →':'Edit →'}</button>
    </div>
    ${entry
      ?`<div style='font-size:13px;color:var(--mut)'>Burn <strong style='color:var(--txt)'>${entry.cals.toLocaleString()}</strong> cal &nbsp;·&nbsp; ${entry.startDate} → ${entry.endDate}</div>`
      :`<div style='font-size:13px;color:var(--mut)'>No goal set — tap ${isSunday?'"Plan Week"':'"Edit"'} to configure.</div>`}
    ${cardioHTML}
    ${vo2HTML}
  </div>`;

  const recentLogs=S.logs.slice(-3).reverse().map(l=>`
    <div class='card2 mb8' style='display:flex;align-items:center;gap:10px'>
      <div data-action='edit-log' data-id='${l.id}' style='cursor:pointer;flex:1;min-width:0'>
        <div style='display:flex;justify-content:space-between;align-items:center;gap:8px'>
          <span style='font-size:13px;font-weight:600'>${l.dayName}</span>
          <span style='font-size:12px;color:var(--mut);flex-shrink:0'>${fmtDate(l.date)}</span>
        </div>
        <div style='font-size:12px;color:var(--mut);margin-top:2px'>${l.exercises.length} exercises · ${fmtDur(l.duration)} · <span style='color:var(--acc)'>tap to view/edit</span></div>
      </div>
      <button class='done-btn' data-action='delete-log' data-id='${l.id}' title='Delete workout' style='background:var(--bad2);color:var(--bad);flex-shrink:0'>🗑️</button>
    </div>`).join('');

  return`<div class='view'>
    <div class='hdg'>My Program</div>
    ${renderBodyScoreCard()}
    <div class='sec-lbl'>This Week</div>
    <div class='wk-grid'>${wkGrid}</div>
    ${renderSleepCard()}
    <button class='btn btn-g btn-sm' data-action='open-log-cardio' style='width:100%;margin-bottom:14px'>🏃 Log Cardio Activity</button>
    ${renderRecoveryBanner()}
    ${todayHTML}
    ${planCard}
    ${renderMRVWidget()}
    ${recentLogs?`<div class='sec-lbl mt16'>Recent</div>${recentLogs}`:''}
    ${renderCloudCard()}
  </div>${renderNav('dash')}`;
}

function renderSwapSearchResults(query,exIdx){
  const q=(query||'').toLowerCase().trim();
  if(!q)return`<div style='font-size:13px;color:var(--mut)'>Type to search all ${EX.length+(S.customExercises||[]).length} exercises…</div>`;
  const ex=S.active?.exercises?.[exIdx];
  const allEx=[...EX,...(S.customExercises||[])];
  const matches=allEx.filter(e=>
    e.id!==(ex?.id) &&
    !S.active.exercises.some(ae=>ae.id===e.id) &&
    !(S.cfg.hipCaution&&e.hipRisk) &&
    !(S.cfg.hipCaution&&(e.tags||[]).includes('plyometric')) &&
    !kneeCautionBlocks(e) &&
    !userAvoids(e) &&
    (e.name.toLowerCase().includes(q)||e.muscle.toLowerCase().includes(q)||e.type.toLowerCase().includes(q)||(e.tags||[]).some(t=>t.toLowerCase().includes(q)))
  ).slice(0,15);
  if(!matches.length)return`<div style='font-size:13px;color:var(--mut)'>No matches for "${query.replace(/</g,'&lt;')}"</div>`;
  // Dragon Flag tiers still surface when locked (rather than vanish silently),
  // shown disabled with what's needed to unlock — so the progression is
  // discoverable, not a dead end you'd only find by luck once qualified.
  return matches.map(a=>{
    if(!dragonFlagUnlocked(a.id)){
      const idx=DRAGON_FLAG_TRACK.indexOf(a.id);
      const prereqName=allEx.find(e=>e.id===DRAGON_FLAG_TRACK[idx-1])?.name||'the prior tier';
      return`<div class='btn btn-g btn-sm' style='margin-bottom:6px;justify-content:flex-start;text-align:left;width:100%;opacity:.5;cursor:default'><span>🔒 ${a.name}</span><span style='color:var(--mut);font-size:11px;margin-left:6px'>log 10 reps of ${prereqName} to unlock</span></div>`;
    }
    return`<button class='btn btn-g btn-sm' style='margin-bottom:6px;justify-content:flex-start;text-align:left;width:100%' data-action='swap-ex' data-idx='${exIdx}' data-id='${a.id}'><span>${a.name}</span><span style='color:var(--mut);font-size:11px;margin-left:6px'>${a.muscle} · ${a.type}</span></button>`;
  }).join('');
}

function renderWorkout(){
  if(!S.active){
    const today=todayDay();
    const canStart=today&&!today.rest;
    return`<div class='view'>
      <div class='hdg'>Workout</div>
      <div class='empty'>
        <span style='font-size:48px;display:block;margin-bottom:16px'>${canStart?'⏱️':'😴'}</span>
        ${canStart
          ?`<div style='margin-bottom:20px'>No workout in progress.<br><span style='font-size:13px'>Start today's session to track your sets.</span></div>
             <button class='btn btn-p' data-action='start-workout' style='max-width:240px;margin:0 auto'>Start Today's Session →</button>`
          :`Rest day.<br><span style='font-size:13px'>Recovery is where the growth happens.</span>`}
      </div>
    </div>${renderNav('workout')}`;
  }
  if(S.active.ratePending){
    const opts=[
      {v:1,icon:'😌',label:'Easy',sub:'Could do it again right now'},
      {v:2,icon:'🙂',label:'Comfortable',sub:'Solid work, plenty left'},
      {v:3,icon:'😤',label:'Worked',sub:'Good session, properly tired'},
      {v:4,icon:'🥵',label:'Hard',sub:'Close to my limit'},
      {v:5,icon:'💀',label:'Maxed out',sub:'Totally drained'},
    ].map(o=>`<div class='opt col1' data-action='rate-fatigue' data-val='${o.v}' style='display:flex;align-items:center;gap:12px;text-align:left'>
      <span style='font-size:26px'>${o.icon}</span>
      <div><div class='opt-v' style='font-size:16px'>${o.label}</div><div class='opt-l'>${o.sub}</div></div>
    </div>`).join('');
    return`<div class='view'>
      <div class='hdg'>How hard was that?</div>
      <div style='font-size:13px;color:var(--mut);margin-bottom:16px'>Your rating auto-regulates the plan — muscles trained in very hard sessions get a lower volume ceiling for the next 72 hours so you recover instead of overtraining.</div>
      <div class='opts col1'>${opts}</div>
      <button class='btn btn-g btn-sm' data-action='rate-fatigue' data-val='' style='margin-top:12px'>Skip</button>
    </div>${renderNav('workout')}`;
  }
  const{exercises,exIdx,dayName,isLunch}=S.active;
  const ex=exercises[exIdx];
  const total=exercises.length;
  let prog=progression(ex.id,ex.rMax);
  // No history for this loaded movement → fall back to the intensity estimation
  // engine for a conservative opener (uses the value attached at startWorkout,
  // recomputing defensively for sessions started before this field existed).
  // For loaded timed movements, older logs may predate the weight box (weight
  // 0) — the progression record exists but has no usable load, so the estimate
  // still applies.
  const progHasW=!!prog&&prog.weight>0;
  let est=(!ex.noWeight&&(!ex.isTimed||timedLoaded(ex))&&(!prog||(timedLoaded(ex)&&!progHasW)))?(ex.estW||estimateStartingWeight(ex.id,S.logs,MOVEMENT_CLASS)):null;
  const estLbl=estBasisLabel(est);

  // Per-equipment dumbbell rack (e.g. apartment gym: 5/10/15/20/25/40/45/50 —
  // a gap at 30/35). Snap the suggested/estimated load DOWN to a pair actually
  // on hand so we never prescribe a weight that doesn't exist here — once
  // capped by the gap or the max, progress via reps and tempo, not more load.
  const activePreset=EQUIPMENT_PRESETS[S.active.equipmentKey];
  const dbWeights=activePreset?.dumbbellWeights;
  const dbCap=activePreset?.dumbbellMax;
  const capDb=!!(dbWeights||dbCap) && ex.eq?.includes('dumbbells') && !ex.eq?.includes('barbell');
  let dbCapped=false;
  if(capDb){
    if(prog){

    } else {
      progHTML=`<div style="font-size:13px;color:var(--mut);margin-bottom:10px">${isPowerEx?'First time — max intent on every rep, land soft, and end the set the moment output drops.':'First time — strict form, full range of motion, 3-count descent on every rep.'}</div>`;
    }
  } else {
    const topTarget=isPowerEx
      ?`${prog?prog.suggest:est?est.weight:''} ${wUnit} × ${ex.rMin}–${ex.rMax} explosive reps — max intent, stop the set when speed visibly drops`
      :`${prog?prog.suggest:est?est.weight:''} ${wUnit} × ${ex.rMin}–${ex.rMax} to 1–2 reps shy of failure`;
    const backoffTarget=useBackoff&&(backoffW||(est&&r5(est.weight*0.85)))?` · then back-off ${backoffW||r5(est.weight*0.85)} ${wUnit} × ${backoffRepLo}–${backoffRepHi}`:'';
    progHTML=prog?`<div class='last-info'>Last session: <strong>${prog.summary}</strong></div>
      ${prog.layoffWeeks?`<div class='prog-hint' style='color:var(--warn)'>⏸ ~${prog.layoffWeeks} weeks since you last did this — suggesting ${prog.layoffWeeks>=8?'80%':'90%'} of your old weight to ramp back in safely.</div>`:''}
      ${prog.ready?`<div class='prog-hint'>🔼 Ready to progress! ${isPowerEx?'Sets':'Top set'}: ${topTarget}${backoffTarget}</div>`:`<div style='font-size:13px;color:var(--mut);margin-bottom:10px'>${isPowerEx?'Sets':'Top set'}: ${topTarget}${backoffTarget}</div>`}`
      :est?`<div class='prog-hint'>🧮 Estimated start ~${est.weight} ${wUnit} · ${est.confidence} confidence (${estLbl}). ${isPowerEx?'Sets':'Top set'}: ${topTarget}${backoffTarget} — adjust from there.</div>`
      :`<div style="font-size:13px;color:var(--mut);margin-bottom:10px">${isPowerEx?`First time — start light. ${ex.rMin}–${ex.rMax} explosive reps per set, judged by speed, not fatigue.`:`First time — start conservative. Top set ${ex.rMin}–${ex.rMax} to 1–2 reps shy${useBackoff?`, then a back-off set ~15% lighter for ${backoffRepLo}–${backoffRepHi}`:''}.`}</div>`;
  }

  const swapOpen=S.active.swapMode===exIdx;
  // Use current session's equipment for exercise swaps
  const today=todayDow();
  const av=S.weekPlan?.availability||{};
  const todayAv=av[today]||{};
  const sessionEquipment=S.active.isLunch?(todayAv.lunchEquipment||'ymca'):(todayAv.eve?.equipment||'ymca');
  const selectedPreset=EQUIPMENT_PRESETS[sessionEquipment]||EQUIPMENT_PRESETS.ymca;
  const alts=swapOpen?EX.filter(e=>e.muscle===ex.muscle&&e.id!==ex.id&&!S.active.exercises.some(ae=>ae.id===e.id)&&!(S.cfg.hipCaution&&e.hipRisk)&&!(S.cfg.hipCaution&&(e.tags||[]).includes('plyometric'))&&!kneeCautionBlocks(e)&&!userAvoids(e)&&dragonFlagUnlocked(e.id)&&e.eq.some(q=>selectedPreset.equipment.includes(q))).slice(0,5):[];
  const swapSearchOpen=swapOpen&&S.active.swapSearch;
  const swapPanel=swapOpen?`<div class='card2' style='margin-bottom:12px'>
    <div class='sec-lbl' style='margin-bottom:8px'>Swap to (same muscle):</div>
    ${alts.map(a=>`<button class='btn btn-g btn-sm' style='margin-bottom:6px;justify-content:flex-start;text-align:left' data-action='swap-ex' data-idx='${exIdx}' data-id='${a.id}'><span>${a.name}</span><span style='color:var(--mut);font-size:11px;margin-left:6px'>${a.type}</span></button>`).join('')}
    ${!alts.length?`<div style='font-size:13px;color:var(--mut);margin-bottom:6px'>No equipment-matched alternatives found.</div>`:''}
    ${swapSearchOpen?`
    <div style='margin-top:10px;border-top:1px solid var(--brd);padding-top:10px'>
      <div class='sec-lbl' style='margin-bottom:6px'>Search all exercises:</div>
      <input id='swap-search-input' type='text' class='ni' placeholder='Name, muscle, or type…' value='${(S.active.swapQuery||'').replace(/'/g,"&#39;")}' style='width:100%;margin-bottom:8px' autocomplete='off' autocorrect='off' spellcheck='false'>
      <div id='swap-search-results'>${renderSwapSearchResults(S.active.swapQuery||'',exIdx)}</div>
    </div>`:`<button class='btn btn-g btn-sm' style='margin-top:2px' data-action='swap-more' data-idx='${exIdx}'>+ More options</button>`}
    <button class='btn btn-g btn-sm' style='margin-top:6px' data-action='toggle-swap'>Cancel</button>
  </div>`:'';

  const repRange=isTimed?`${ex.rMin}–${ex.rMax}s`:`${ex.rMin}–${ex.rMax}`;
  const rowGrid=hideWeight?'grid-template-columns:36px 64px 1fr 42px':'';
  const baseW=prog?((isLoadedTimed&&!progHasW&&est)?est.weight:prog.suggest):(est?est.weight:null);
  const setsRows=Array.from({length:ex.sets},(_,i)=>{
    const done=ex.done[i];
    const isBackoffSet=useBackoff&&i>0;
    const sugW=isBackoffSet?(backoffW||(baseW!=null?r5(baseW*0.85):'')):(baseW!=null?baseW:(done?.weight||''));
    const setRep=isBackoffSet?`${backoffRepLo}–${backoffRepHi}`:repRange;
    const sugR=done?.reps||(isBackoffSet?backoffRepLo:ex.rMax);
    const setTag=(isNoWeight||isTimed||!useBackoff)?'':`<div style='font-size:9px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-top:2px'>${isBackoffSet?'back-off':'top set'}</div>`;
    return`<div class='set-row${done?' done':''}' id='sr-${exIdx}-${i}' style='${rowGrid}'>
      <div class='sn'>${i+1}</div>
      <div class='st'>${setRep}${setTag}</div>
      ${hideWeight?'':`<input class='ni' type='number' id='w-${exIdx}-${i}' placeholder='${isDumbbellEx?'each':'lb'}' value='${done?done.weight:sugW||''}' min='0' step='5' inputmode='decimal' ${done?'disabled':''} data-warmup-src='${(ex.isFirst||isGroupFirst)&&i===0?exIdx:''}'>`}
      <input class='ni' type='number' id='r-${exIdx}-${i}' placeholder='${isTimed?'sec':'reps'}' value='${done?done.reps:sugR}' min='0' max='${isTimed?300:50}' inputmode='numeric' ${done?'disabled':''}>
      <button class='done-btn' id='db-${exIdx}-${i}' data-action='${done?'undo-set':'done-set'}' data-ex='${exIdx}' data-set='${i}'>${done?'↩':'→'}</button>
    </div>`;
  }).join('');

  const allDone=ex.done.filter(Boolean).length>=ex.sets;
  const isLast=exIdx===total-1;
  const condBlock=isLast&&S.cfg.conditioning&&allDone?finisherHTML(S.active.dow,false,!!S.active.isLunch):'';
  // Post-session cool-down (~5 min, evening/weekend sessions only — lunch is
  // hard time-boxed): static relief for the desk-stiff areas (neck, lower
  // back) plus tibialis work for incline-walking shin stiffness. The tib
  // raises come FIRST and are strengthening, not stretching — a stronger
  // tibialis is what stops the shins tightening up on every incline walk.
  // Tibialis Raises always lead (strengthening, not stretching); the static
  // stretches rotate 3-per-session from the pool below, same daily-offset
  // scheme as the pre-lift caution pools, so the cool-down stays ~5 min.
  const COOLDOWN_POOL=[
    {n:'Kneeling Shin Stretch',d:'45 sec · sit back on your heels, tops of the feet flat on the floor',hold:45},
    {n:'Upper Trap Stretch',d:'30 sec/side · ear toward shoulder, opposite hand reaching at the floor',hold:30},
    {n:"Child's Pose",d:'60 sec · arms long, sit toward the heels, slow nasal breathing — lumbar decompression',hold:60},
    {n:'Supine Twist',d:'30 sec/side · on your back, knees dropped to one side, shoulders flat',hold:30},
    {n:'Figure 4 Stretch',d:'45 sec/side · on your back, ankle crossed over the opposite knee, pull that thigh toward your chest — deep glute/piriformis stretch',hold:45},
    {n:'Knee-to-Wall Ankle Stretch',d:'45 sec/side · half-kneeling facing a wall, front toes ~4 in away, drive the knee past the toes toward the wall with the heel GLUED down — ankle dorsiflexion is what caps squat depth; inch the foot back as range grows',hold:45},
    {n:'Pigeon Pose',d:'45 sec/side · front shin across the body, back leg long behind, fold the chest over the front leg and breathe — deep glute/piriformis',hold:45},
    {n:'Bridge Pose',d:'30 sec · on your back, feet planted, press the hips up and interlace the hands underneath — opens the hip flexors and the front of the spine after a day of sitting',hold:30},
    {n:'Plow Pose',d:'30 sec · from your back, sweep the legs up and over until the toes reach the floor behind your head (knees bent is fine) — full posterior-chain and spine stretch; skip if the neck complains',hold:30},
    {n:'Toe Stretch',d:'30 sec · kneel with the toes tucked under and sit back onto the heels — plantar fascia and toe flexors; brutal at first, eases fast with practice',hold:30},
    {n:'Straddle Stretch',d:'60 sec · seated, legs wide, walk the chest forward between them with a flat back — adductors and hamstrings together; a real ROM builder at this dose',hold:60},
    {n:'Butterfly Stretch',d:'45 sec · seated, soles of the feet together, knees dropped out to the sides — hands on ankles, tall spine, gently press the knees toward the floor with your elbows — deep inner-thigh/adductor stretch',hold:45},
    {n:'Supine Knee-to-Chest Stretch',d:'30 sec/side · on your back, pull one knee to your chest with both hands, other leg long and flat on the floor — deepens hip flexion range and stretches the glute/lower back',hold:30},
    {n:'Pretzel Stretch',d:'30 sec/side · seated, one leg crossed over the other knee, opposite elbow braced against the crossed knee, gently rotate the torso away — hip external rotation and glute',hold:30},
    {n:'Behind-the-Back Shoulder Stretch',d:"30 sec · clasp your hands behind your back (hold a towel if they don't meet), straighten the arms, and gently lift them away from your body — opens the front of the shoulder through end-range extension",hold:30},
    {n:'Overhead Reach Stretch',d:'30 sec · reach both arms straight overhead, interlace fingers, palms up, and reach tall — deepens overhead shoulder flexion range and stretches the lats',hold:30},
    // Upper-back (thoracic) additions — chronically stiff area, so the pool
    // carries three so the rotation surfaces one most days.
    {n:'Thread the Needle',d:'30 sec/side · from all fours, slide one arm under the body until the shoulder rests on the floor — upper-back rotation, breathe into the stretch',hold:30},
    {n:'Open Book',d:'30 sec/side · side-lying, knees stacked at 90°, sweep the top arm open following the hand with your eyes — pure thoracic rotation, hips stay put',hold:30},
    {n:'Prayer Stretch',d:'45 sec · kneel with forearms on a bench, sink the chest toward the floor — lats and mid-back lengthen together, the stiff-upper-back opener',hold:45},
  ];
  const cooldownHTML=isLast&&allDone&&!S.active.isLunch?`<div class='wu-box' style='border-color:rgba(96,165,250,.3);background:rgba(96,165,250,.04);margin-top:14px'>
    <div class='wu-title' style='color:var(--acc)'>🧊 Cool-down · ~5 min</div>
    ${[{n:'Tibialis Raises',d:'20 reps · back on a wall, lift toes to shins — strengthens away incline-walk shin stiffness'},...stretchRot(COOLDOWN_POOL,3)].map(wuRow).join('')}
    <div class='wu-note'>Static holds live HERE, after training — pre-lift work stays dynamic on purpose. These are range-of-motion doses, not just relief: sink to a 6/10 "productive discomfort" (never pain) and go a little deeper on each exhale — done consistently, this is what lengthens range over weeks. Stretches rotate daily; the full pool cycles across the week. Do this before tapping Finish.</div>
  </div>`:'';
  const nextBtn=allDone
    ?`<button class='btn ${isLast?'btn-ok':'btn-p'}' id='next-btn-${exIdx}' data-action='${isLast?'finish-workout':'next-ex'}' style='margin-top:10px'>${isLast?'🏁 Finish Workout':'Next Exercise →'}</button>`
    :`<button class='btn btn-p' id='next-btn-${exIdx}' data-action='${isLast?'finish-workout':'next-ex'}' style='margin-top:10px;display:none'>${isLast?'🏁 Finish Workout':'Next Exercise →'}</button>`;
  // Visible only while sets remain unfinished — the primary Next/Finish button
  // above already covers "move on" once every set is logged. This is the
  // explicit "I can't/won't finish every set of THIS exercise" escape hatch.
  const skipBtn=!allDone?`<button class='cue-btn' data-action='skip-ex' style='margin-top:8px;color:var(--mut)'>⏭ Skip this exercise${isLast?' & finish workout':''}</button>`:'';

  const prevBtn=exIdx>0?`<button class='ex-nav-btn' data-action='prev-ex'>← Previous</button>`:'';

  return`<div class='view'>
    <div class='wkt-hdr'>
      <div>
        <div class='wkt-day'>${dayName}</div>
        <div class='wkt-prog'>Exercise ${exIdx+1} of ${total}</div>
      </div>
      <div style='display:flex;gap:6px'>
        <button class='abandon' style='width:auto;padding:8px 12px;border-radius:10px' data-action='end-now'>🏁 End Now</button>
        <button class='abandon' style='width:auto;padding:8px 12px;border-radius:10px' data-action='abandon'>✕ Quit</button>
      </div>
    </div>
    ${S.active.autoRegNotes?.length?`<div class='wu-box' style='margin-bottom:14px'>
      <div class='wu-title'>⚖️ Auto-Regulation · 2nd Session Today</div>
      ${S.active.autoRegNotes.map(n=>`<div class='wu-row'>${n}</div>`).join('')}
      <div class='wu-note'>Volume adjusted from what you actually logged earlier today (60% rule).</div>
    </div>`:''}
    ${hipPrehabHTML}
    ${achyShoulderHTML}
    ${dailyMobilityHTML}
    ${machineModeHTML}
    ${efficiencyModeHTML}
    ${deskReversalHTML}
    <div class='ex-card'>
      ${sessionTag}
      <div class='ex-name'>${ex.name}</div>
      <span class='m-tag' style='background:${mcolor}22;color:${mcolor}'>${MNAME[ex.muscle]||ex.muscle} · ${ex.type}</span>
      ${feelFor(ex)?`<div style='font-size:12.5px;color:var(--txt-dim);line-height:1.5;margin:8px 0 10px;padding:8px 10px;background:${mcolor}0d;border-left:3px solid ${mcolor}66;border-radius:0 8px 8px 0'>🎯 <strong style='color:${mcolor}'>Feel it:</strong> ${feelFor(ex)}</div>`:''}
      <div style='display:flex;gap:8px;align-items:center;margin-bottom:10px'>
        <button class='cue-btn' data-action='toggle-cue' data-id='cue-${exIdx}' style='margin-bottom:0'>💡 Technique tip</button>
        <button class='cue-btn' data-action='toggle-swap' style='margin-bottom:0;margin-left:auto;color:var(--mut)'>↕ Swap</button>
      </div>
      <div class='cue-txt' id='cue-${exIdx}'>${ex.cue||''}</div>
      ${ex.isoHoldSecs?`<button class='btn btn-g btn-sm' data-action='start-iso-hold' data-secs='${ex.isoHoldSecs}' style='margin-bottom:10px;width:100%'>⏱ Start ${ex.isoHoldSecs}s mid-position hold</button>`:''}
      ${swapPanel}
      ${warmupHTML}
      ${progHTML}
      ${dbCapNote}
      <div class='sets-hdr' style='${rowGrid}'>
        <div class='sh'>Set</div><div class='sh'>Target</div>
        ${hideWeight?'':`<div class='sh'>Weight</div>`}<div class='sh'>${isTimed?'Sec':'Reps'}</div><div class='sh'></div>
      </div>
      ${setsRows}
      ${condBlock}
      ${cooldownHTML}
      ${nextBtn}
      ${skipBtn}
    </div>
    ${(exIdx<total-1)?`<div class='card2' style='margin-top:12px'>
      <div style='font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--mut);margin-bottom:8px;display:flex;align-items:center;gap:4px'>
        <svg width='12' height='12' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='9 18 15 12 9 6'/></svg>Next Up
      </div>
      <div style='display:flex;align-items:center;gap:8px;margin-bottom:6px'>
        <span style='width:6px;height:6px;border-radius:50%;background:${MCOL[exercises[exIdx+1].muscle]||'var(--acc)'};flex-shrink:0;display:inline-block'></span>
        <strong style='font-size:14px'>${exercises[exIdx+1].name}</strong>
        <span style='font-size:11px;color:var(--mut);margin-left:auto'>${exercises[exIdx+1].sets} × ${exercises[exIdx+1].rMin}–${exercises[exIdx+1].rMax}${exercises[exIdx+1].isTimed?'s':''}</span>
      </div>
      <button class='cue-btn' data-action='toggle-cue' data-id='next-cue-${exIdx+1}' style='margin-bottom:6px'>💡 Preview technique tip</button>
      <div class='cue-txt' id='next-cue-${exIdx+1}' style='font-size:12px;margin-bottom:0'>${exercises[exIdx+1].cue||'No technique notes available.'}</div>
    </div>`:''}
    ${prevBtn?`<div class='ex-nav'>${prevBtn}</div>`:''}
    <div style='font-size:12px;color:var(--mut);text-align:center;margin-top:8px'>${S.active.restCap?S.active.restCap+'s rest between sets (lunch time-box)':smartRestLabel(ex)} · slow eccentric</div>
  </div>`;
}

// ─────────────────────────────────────────────
// RENDER – REVIEW WORKOUT
// ─────────────────────────────────────────────
function renderReviewWorkout(){
  if(!S.reviewWorkout){S.view='dash';render();return;}

  const {day, sessionType} = S.reviewWorkout;
  const isEve = sessionType === 'eve' && day.eveningSession;
  const src = isEve ? day.eveningSession : day;
  // Show every exercise the program built for this session — matches the
  // Program tab (which renders src.exercises in full) and the started workout.
  // The array is already sized at generation time (lunch=3, longer sessions=
  // EX_LIMIT[mins]), so a true 40-min lunch still shows 3.
  let rawExs = src.exercises.slice();

  // Show makeup exercises logic (same as startWorkout)
  if(!isEve){
    const missed = getMissedDays();
    if(missed.length > 0){
      const todayMuscles = new Set(rawExs.map(e => e.muscle));
      missed.forEach(missedDow => {
        const md = S.program.week[missedDow];
        if(!md || md.rest) return;
        const mu = md.exercises.find(e => !todayMuscles.has(e.muscle));
        if(mu){
          rawExs = [...rawExs, {...mu, sets: 2, isMakeup: true, makeupFrom: md.name}];
          todayMuscles.add(mu.muscle);
        }
      });
    }
  }

  const sessionLabel = src.isLunch ? `${src.name} · Lunch` : `${src.name} · ${src.mins||src.sessionMins||60} min`;

  const exerciseCards = rawExs.map((ex, idx) => {
    const mcolor = MCOL[ex.muscle] || 'var(--acc)';
    const makeupBadge = ex.isMakeup ? `<span class='badge badge-makeup' style='margin-bottom:8px;display:inline-block'>⚡ Make-up · ${ex.makeupFrom}</span>` : '';

    return `<div class='ex-card' style='position:relative'>
      ${makeupBadge}
      <div style='display:flex;align-items:center;justify-content:space-between;margin-bottom:8px'>
        <div class='m-tag' style='background:${mcolor}22;color:${mcolor};border:1px solid ${mcolor}44'>${MNAME[ex.muscle]}</div>
        <button class='btn btn-g btn-sm' data-action='swap-exercise' data-idx='${idx}' style='font-size:11px;padding:6px 10px'>⟲ Swap</button>
      </div>
      <div class='ex-name'>${ex.name}</div>
      <div style='font-size:13px;color:var(--mut);margin-bottom:8px'>${ex.sets} sets × ${ex.rMin}–${ex.rMax} ${ex.isTimed?'seconds':'reps'}</div>
      <button class='cue-btn' data-action='toggle-cue' data-id='review-cue-${idx}'>💡 Technique tip</button>
      <div class='cue-txt' id='review-cue-${idx}'>${ex.cue || 'No technique notes available.'}${feelFor(ex)?`<div style='color:var(--acc);margin-top:8px'>🎯 <strong>Feel it:</strong> ${feelFor(ex)}</div>`:''}</div>
    </div>`;
  }).join('');

  return `<div class='view'>
    <button class='s-back' data-action='back-to-dash' style='margin-bottom:20px;margin-top:0'>
      <svg width='20' height='20' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='15 18 9 12 15 6'/></svg> Back
    </button>
    <div class='hdg'>Review Workout</div>
    <div style='font-size:14px;font-weight:700;margin-bottom:4px'>${sessionLabel}</div>
    <div style='font-size:13px;color:var(--mut);margin-bottom:20px'>Review exercises below. Tap "Swap" to replace any exercise with alternatives.</div>

    ${exerciseCards}

    <div style='margin-top:20px;display:flex;gap:8px'>
      <button class='btn btn-g' data-action='back-to-dash' style='flex:1'>Cancel</button>
      <button class='btn btn-p' data-action='confirm-start-workout' style='flex:2'>🚀 Start Workout</button>
    </div>
  </div>`;
}

  const {dow} = S.customWorkoutLog;
  const exercises = S.customWorkoutLog.exercises || [];

  const exerciseRows = exercises.map((ex, idx) => {

        <input type='text' class='ni' id='cust-name-${idx}' autocomplete='off' placeholder='🔍 Type an exercise name…' value='${(ex.name||'').replace(/'/g,"&#39;")}'

          <div style='font-size:11px;color:var(--mut);margin-bottom:4px'>Sets</div>
          <input type='number' class='ni' id='cust-sets-${idx}' min='1' max='20' value='${ex.sets || 3}'

        <div>
          <div style='font-size:11px;color:var(--mut);margin-bottom:4px'>Reps</div>
          <input type='number' class='ni' id='cust-reps-${idx}' min='1' max='100' value='${ex.reps || 10}'
                 oninput='updateCustomExercise(${idx}, "reps", parseInt(this.value))'>
        </div>
        <div>
          <div style='font-size:11px;color:var(--mut);margin-bottom:4px'>Weight (lbs)</div>
          <input type='number' class='ni' id='cust-weight-${idx}' min='0' max='500' value='${ex.weight || 0}'
                 oninput='updateCustomExercise(${idx}, "weight", parseFloat(this.value))' placeholder='0 if bodyweight'>
        </div>
      </div>
      <button class='btn btn-g btn-sm' onclick='removeCustomExercise(${idx})' style='width:100%;margin-top:10px;color:var(--bad)'>✕ Remove exercise</button>
    </div>
  `;}).join('');

  return `<div class='view'>
    <button class='s-back' data-action='cancel-custom-workout' style='margin-bottom:20px;margin-top:0'>
