        if(!S.cfg.avoidExercises.includes(id))S.cfg.avoidExercises.push(id);
      });
      // Turn the achy-shoulder warm-up + the shoulderRisk gate on, ONCE. Guarded
      // by its own marker rather than by `===undefined`, because the toggle has
      // shipped as `false` for a long time and a plain undefined-check would
      // never fire — while an unguarded assignment would re-enable it on every
      // reload and make the plan-screen checkbox impossible to switch off.
      if(!S.cfg.shoulderSeeded){S.cfg.shoulderCaution=true;S.cfg.shoulderSeeded=true;}
      // Migrate: seed the body-composition scan + lean focus for the score goal.
      // Muscle is already above range, so the only lever to 100 is fat loss while
      // holding muscle — switch the goal to lean recomp and turn conditioning on.
      if(!S.cfg.bodyScore){
        S.cfg.bodyScore={score:79,weight:198.9,target:177.2,bodyFatPct:22.8,fatMass:45.3,skeletalMuscle:88.1,smRangeHi:82.5,visceralFat:7,bmi:27.8,bodyAge:24,testDate:'2026-05-24'};
        S.cfg.goal='lean';S.cfg.conditioning=true;S.cfg.bodyLbs=199;
      }
      // Migrate: a short-lived 2026-08-17 build modelled volleyball as a league
      // NIGHT that consumed an evening and booked fatigue. That was wrong — Sam
      // doesn't play on a schedule; he trains FOR it (see JUMP_DURABILITY). Drop
      // the setting so it can't ride back in from a device that saw that build.
      if(S.cfg.volleyball)delete S.cfg.volleyball;
      // Migrate: which session pays for a century on a both-sessions day.
      if(!S.cfg.centuryWhen)S.cfg.centuryWhen='eve';
      // Clear mid-week planStartDow if the stored week plan is from a previous week
      if(S.cfg?.planStartDow&&(!S.weekPlan||S.weekPlan.weekOf<thisMonday())){
        delete S.cfg.planStartDow;
      }
      S.view=S.active?'workout':'dash';
    }
  }catch(e){}
}

// ─────────────────────────────────────────────
// PROGRAM GENERATOR
// ─────────────────────────────────────────────
// Leg programming is restricted to an explosive + tendon-stiffness emphasis:
// a leg movement is only AUTO-selectable (by templates or backfill) if it
// carries one of these tags. Everything else in the leg pool — back squats,
// RDLs, leg press, machine curls, plain calf raises, glute isolation — is pure
// hypertrophy/strength and is excluded from auto-generation everywhere (it
// stays in the EX database for manual/custom logging). Using an allowlist
// rather than naming each retired lift means any leg exercise added later is
// excluded by default unless explicitly tagged for the emphasis.
// 'plyometric' is allowed here (it's explosive) but still filtered separately
// by hip-caution (see plyoHidden) — for hip-flagged users only the lowImpact
// reactive subset surfaces; everyone else gets the full jump pool.
const LEG_EMPHASIS_TAGS=['power','isometric','tendon','eccentric','plyometric','strength','decel','lateral'];
const legAutoOK=(e)=>e.muscle!=='legs'||LEG_EMPHASIS_TAGS.some(t=>(e.tags||[]).includes(t));

// Knee-Caution mode (mirrors hipCaution): when active, ALL leg work is
// restricted to this small dumbbell-only, knee-friendly whitelist — an
// absolute allowlist rather than a tag filter, since it's meant to override
// the explosive/tendon emphasis gate entirely, not layer on top of it.
const KNEE_SAFE_IDS=new Set(['goblet','rdl','db_rdl','reverse_lunge','sumo_squat','bstance_hip_thrust','tib_raise']);
// Manual swap/suggestion lists don't have a slot.tag to reason about (unlike
// pickEx's per-slot gate above) — Knee-Caution there is a flat allow-list
// check: exclude any leg exercise outside the knee-safe set.
const kneeCautionBlocks=(e)=>S.cfg.kneeCaution&&e.muscle==='legs'&&!KNEE_SAFE_IDS.has(e.id);
// Hip-caution plyo ban, WITH a low-impact exception. All flight/landing work is
// tagged 'plyometric' and hidden while hip caution is on — except the quiet,
// ankle-driven or single-max-effort subset flagged lowImpact:true (pogo/plate/
// line hops, chair & JAPAP jumps — no repeated hard landings), which stays
// available so vertical-jump work isn't fully lost to the FAI hip. True impact
// plyos (depth jumps, single-leg drops, bounds) carry no lowImpact flag and
// remain banned. Used everywhere the old inline plyometric check lived.
const plyoHidden=(e)=>S.cfg.hipCaution&&(e.tags||[]).includes('plyometric')&&!e.lowImpact;
// Personal exercise exclusions — movements that flare a specific issue
// regardless of the broader hip/knee/shoulder caution flags (e.g. Push Press
// on the lower back). A flat id blacklist, not a tag rule, since these are
// one-off "this specific movement doesn't work for me" reports.
const userAvoids=(e)=>(S.cfg.avoidExercises||[]).includes(e.id);

// ─────────────────────────────────────────────
// THE FOUNDATION FIVE
// ─────────────────────────────────────────────
// Five movements that get a WEEKLY COVERAGE GUARANTEE instead of competing for
// slots on merit like the rest of the pool (added 2026-07-28). Premise: what
// actually moves body composition over a 3-month block isn't exercise
// selection, it's a short list of high-return movements repeated often enough
// to adapt to — the same finding longevity research keeps landing on (remove
// the biggest obstacles, repeat a few high-impact habits, allow time). These
// five cover vertical pull, horizontal push, single-leg squat, loaded crawl,
// and anti-extension — nearly every joint, both planes — off a pull-up bar and
// a floor, so travel, equipment, or a short day can't be the reason one gets
// skipped.
//
// Mechanism: dayTemplate stamps ONE still-uncovered movement per session onto a
// matching slot as `slot.foundationId`; pickEx returns that exact movement (see
// the short-circuit there — safety gates still apply in full). A movement
// already logged this calendar week is covered and stops being stamped, so the
// guarantee reads "each of these at least once a week", never "all five every
// day". Two of them are unreachable through the normal filters and this is the
// only way they ever get programmed: pistol_squat carries no LEG_EMPHASIS_TAGS
// tag (legAutoOK blocks it), and bear_crawl is a type:'compound' core movement
// the rotating core cycle (rotational/isolation tags) can never select.
//
// The plank is deliberately NOT slot-scheduled: it's already a fixed 60s dose
// EVERY day in DAILY_SPINE_MINIMUMS, which is a stronger guarantee than a
// weekly slot. It's listed here so the dashboard presents all five as one
// system rather than hiding the one that's already handled.
const FOUNDATION_FIVE=[
  {id:'weighted_pullups',name:'Weighted Pull-ups',muscle:'back',why:'The highest-return upper-body pull there is — lats, mid-back, biceps, grip and a braced core in one movement. Adding load is what keeps it a strength lift as bodyweight comes down.'},
  {id:'pushups_w',name:'Push-ups (+ Vest)',muscle:'chest',why:'Chest, shoulders and triceps driving a moving plank, at zero setup cost. The vest keeps it progressive once strict reps stop being the limiter.'},
  {id:'pistol_squat',name:'Single-Leg Squat',muscle:'legs',why:'One leg at a time is how you actually walk, run and land. Exposes the side-to-side gap a barbell hides, and trains hip and knee control through full depth.'},
  {id:'bear_crawl',name:'Bear Crawl',muscle:'core',why:'A contralateral loaded carry for the deep core and shoulders — anti-rotation while actually moving, which is the part a plank cannot train.'},
  {id:'plank',name:'Plank',muscle:'core',daily:true,why:'Trunk stiffness is what protects the spine and holds posture through every other lift. Already a fixed 60s dose every single day in the Daily Spine Minimums.'},
];
const FOUNDATION_SLOTTED=FOUNDATION_FIVE.filter(f=>!f.daily);

// ─── JUMP DURABILITY (2026-08-17) ───
// Sam: "the workouts i wanted to start doing to increase my durability playing
// volleyball (repeated vertical jumping as a blocker on sand)" … "i get gassed
// and cant jump that high in volleyball right now."
//
// Note what that is and isn't. He does NOT play on a fixed schedule — an earlier
// build modelled volleyball as a league NIGHT that ate an evening and booked
// fatigue, which was exactly backwards. This is TRAINING FOR a demand, so it
// belongs in the prescription and costs the week exactly what any other
// programmed sets cost. Nothing here touches recovery, availability or the
// conditioning rotation.
//
// The two failure modes he named are different qualities and both are here:
//   · GASSED — repeat-effort capacity. `repeat_block_jumps` is the whole point:
//     every other movement in the plyo pool is a MAX effort with FULL recovery,
//     which builds a vertical and does nothing for holding jump quality across
//     dozens of blocks. Sand is why it's so expensive — it absorbs the
//     stretch-shortening rebound, so a sand block jump is nearly pure concentric
//     work, and that's also what makes the repeated landings hip-safe (the
//     surface does that, which is why the entry carries lowImpact).
//   · CAN'T JUMP HIGH — the calf, and specifically the SOLEUS, which is the
//     tissue that gives out first in repeated jumping and is trained with the
//     knee bent. Heavy strength work already covers hip and knee force
//     production; this is the piece the barbell never reaches.
//
// WHY IT NEEDS A GUARANTEE AT ALL, and this is the whole reason it's here rather
// than a tag tweak: BOTH MOVEMENTS WERE DEAD CODE. Measured over 6 simulated
// weeks on all three schedules, `repeat_block_jumps` and `soleus_raises` were
// picked ZERO times — as was every other jump and calf movement in the pool. The
// cause is structural: legs get ~2 slots a week and both are spoken for by
// mandates (evening 'strength', lunch 'hinge'/'hamstring'), and the athletic
// accent branch that would ask for this work only fires on a THIRD leg slot that
// those schedules almost never produce. So this rides the one mechanism in the
// file that is built for exactly this problem — the Foundation Five's weekly
// coverage guarantee (see FOUNDATION_FIVE): stamped by dayTemplate, honoured by
// pickEx, seeded from LOGS only. Same machinery, same invariants, one list.
//
// TWO PATHS, because the two pieces are different shapes of work:
//   · The repeat-jump capacity is CONDITIONING and is guaranteed through the
//     finisher rotation instead (see getFinisher) — it gets the first evening
//     of every week outright. Carving it a lifting slot was tried and measured
//     at 20% of weeks: legs only get about two slots and both are mandated,
//     and it cannot go at lunch because it is highSweat.
//   · The soleus work USED TO ride this same weekly-stamp mechanism, trailing
//     the Foundation Five — and measured (2026-08-19) it never landed: 0 of 10
//     simulated weeks on all three schedules, including lunch+3-evening. Root
//     cause: legs produces only ONE slot a week this queue can even contest —
//     the accent slot, once heavy strength is already banked; every other leg
//     slot carries a hard mandate — and pistol_squat sits ahead of soleus in
//     this SAME single-stamp-per-session queue, so it won that one slot every
//     time. Calf coverage now has its own mechanism (see
//     CALF_WEEKLY_TARGET_SETS) that doesn't compete for a slot at all, so it's
//     removed from here rather than left to lose forever.
// Toggleable, because it is a training block aimed at one sport and there
// should be a way to stop without editing code.
const JUMP_DURABILITY=[];
function jumpDurabilityOn(){return S.cfg?.jumpDurability!==false;}
function jumpDurabilitySlotted(){return jumpDurabilityOn()?JUMP_DURABILITY:[];}
// The single list dayTemplate stamps from, and the single set of ids
// foundationCoveredThisWeek seeds from — kept as ONE derivation so the "what is
// guaranteed" and "what counts as covered" halves can never drift apart.
function weeklyGuaranteed(){
  // The stamping loop takes the first uncovered movement it can place and
  // stops, so order IS priority. Jump-durability work trails the Foundation
  // Five: it yields to them while they are outstanding, and picks up a leg slot
  // only once they are covered or unplaceable.
  return FOUNDATION_SLOTTED.concat(jumpDurabilitySlotted());
}
const FOUNDATION_IDS=new Set(FOUNDATION_SLOTTED.concat(JUMP_DURABILITY).map(f=>f.id));
// Weekly coverage state, read from the log — no persisted flags to drift.
function foundationCoveredThisWeek(){
  const mon=thisMonday(),end=addDays(mon,7),out=new Set();
  (S.logs||[]).forEach(l=>{
    if(!l||logDay(l.date)<mon||logDay(l.date)>=end)return;
    (l.exercises||[]).forEach(e=>{if(e&&FOUNDATION_IDS.has(e.id))out.add(e.id);});
  });
  return out;
}

// ─── CALF WEEKLY COVERAGE (2026-08-19) ───
// Sam: "make sure I get at least 2 sets of calves a week in programming."
//
// Doesn't compete for a leg slot — see the note above JUMP_DURABILITY for why
// that queue is the wrong mechanism (measured dead code, 0/10 weeks). Instead
// this is a small, independently-priced TOP-UP — 2 quick sets, ~2 min — that
// buildSession appends to whichever session it finishes assembling first this
// week, outside the muscle-slot system entirely. Same convergence rule as
// Foundation Five: log-seeded, so a session PLANNED with the top-up doesn't
// retire it — only one actually LOGGED does — and a daily replan keeps
// offering it on every session until it's really been done.
const CALF_WEEKLY_TARGET_SETS=2;
// Priced like a small McGill/spine block, not a full lift: 2 sets at ~90s
// rest is a couple of minutes, nowhere near EVENING_EX_MINS/lunchExMins()'s
// per-lift rate — charging the full rate for it would be the exact "prep
// smeared across every exercise" mistake the lunch ledger was built to fix.
const CALF_TOPUP_MINS=2;
const CALF_TOPUP_POOL=['calf_raise','single_leg_calf_raise','soleus_raises','tempo_calf','iso_calf'];
function calfSetsThisWeek(){
  const mon=thisMonday(),end=addDays(mon,7);
  let sets=0;
  (S.logs||[]).forEach(l=>{
    if(!l||logDay(l.date)<mon||logDay(l.date)>=end)return;
    (l.exercises||[]).forEach(e=>{
      if(!e)return;
      const full=exFull(e);
      if(!(full.tags||[]).includes('calf'))return;
      sets+=(e.sets||[]).filter(st=>st&&st.reps>0).length;
    });
  });
  return sets;
}
function needsCalfTopUp(){return calfSetsThisWeek()<CALF_WEEKLY_TARGET_SETS;}
// Pick the least-used still-eligible calf movement — same safety gates
// Foundation Five's canPlaceFoundation uses (equipment, hip/shoulder caution,
// plyo, avoid list, knee caution, dragon-flag gate); calf isolation work trips
// none of these in practice, but a custom avoid-list entry should still work.
function pickCalfTopUp(equip,used,freq){
  const eqSet=new Set([...(equip||[]),'bodyweight']);
  const f=freq||{};
  const cands=CALF_TOPUP_POOL
    .map(id=>EX.find(e=>e.id===id))
    .filter(e=>e&&!used.includes(e.id)
      &&(e.eq||[]).some(q=>eqSet.has(q))
      &&!(S.cfg.hipCaution&&e.hipRisk)&&!(S.cfg.shoulderCaution&&e.shoulderRisk)
      &&!plyoHidden(e)&&!userAvoids(e)&&!kneeCautionBlocks(e)&&dragonFlagUnlocked(e.id));
  if(!cands.length)return null;
  return cands.reduce((best,e)=>(f[e.id]||0)<(f[best.id]||0)?e:best);
}

// ─────────────────────────────────────────────
// THE PULL-UP CENTURY
// ─────────────────────────────────────────────
// 100 pull-ups in a session, however many sets it takes, 2–3× a week. The
// TARGET never moves — the set count is the progress metric (10+ sets early, a
// handful by the end). That's what makes it self-scaling: it gets easier as
// strength rises and bodyweight falls without the prescription ever being
// rewritten, and no week needs a new plan.
//
// Two things keep it from being a recovery hole:
//  1) Every set ends 2+ reps SHORT of failure. Stimulus and fatigue both scale
//     with proximity to failure, so submaximal accumulation buys a lot of reps
//     cheaply — which is why this can run 3×/week for months instead of
//     wrecking the elbows and shoulders. It's also why century reps are
//     DISCOUNTED in getWeeklySetVolumes / getMRVBreakdown rather than counted at
//     face value: 10 easy sets do not cost what 10 hard sets cost, and billing
//     them in full would eat the week's entire back MRV and crowd out the
//     mandated row / rear-delt work. See CENTURY_MRV_SETS for the rate.
//  2) Century days are spaced ≥48h apart and capped at 3/week (centuryDows).
//
// Logged as isCardio:true — the same "invisible to session bookkeeping" flag
// the VO2 log uses, so a century never marks a day completed, never locks that
// day's lifting template to itself, and never consumes one of the two daily
// lifting slots. Its `exercises` array is still populated, so it DOES count
// toward weekly MRV volume (which is what protects recovery here).
const PULLUP_CENTURY={target:100,maxDays:3,restCap:180};
// ── WHAT A CENTURY COSTS AGAINST WEEKLY MRV (revised 2026-08-05) ──
// Sam: "How does the century work into the MRV. I dont need to kill my back and
// biceps as much bc im doing century now." That is the right instinct and the
// number was not honouring it.
//
// The price is per COMPLETED REPS, not per set. Set count is the progress metric
// and falls as he improves, so costing by sets made the identical 100 reps
// progressively cheaper (a 12-set century billed 6, a later 4-set century billed
// 2). Pricing the reps fixes that AND makes a partial century cost what it
// actually was — see centuryMrvSets.
//
// The rate itself: a pull-up working set in EX runs 4–8 reps, so 100 reps is
// ~16.7 nominal sets. They are deliberately submaximal (the pacing prescription
// is sets of half his best, so most reps sit many short of failure), which is
// why they don't bill at face value — but the discount was 3/16.7 ≈ 0.18, i.e.
// a century set counted as under a fifth of a hard set. That is too steep for
// work that produces real elbow, grip and lat fatigue and, three times a week,
// 300 reps of it. Raised to 5, a discount of ~0.30: roughly one third of a hard
// set, which is the conventional weighting for sets left well short of failure.
//
// Consequence, and the point of the change: three centuries now book 15 of the
// 12–22 weekly back sets and 7.5 of the 6–16 biceps sets before the generator
// programs anything, so it programs less rowing and far fewer curls on top —
// which is exactly what Sam asked for. Measured effect is in the 2026-08-05
// balance note in CLAUDE.md.
//
// Changing this number also re-prices the Pyramid, deliberately: pyramidMrvSets
// derives its reps-per-recoverable-set from this constant, so the same 100
// pull-ups keep costing the same whether they arrive as a century or a ladder.
const CENTURY_MRV_SETS=5;
// What a logged century actually costs — flat for a full one, pro-rata for a
// partial. The card explicitly offers "log N reps & stop here", so a short
// session is a normal outcome rather than an error, and billing 26 reps as if
// they were 100 would suppress the rest of the week's back work on the strength
// of work that never happened. Reconciles exactly with pyramidMrvSets, which
// prices the ladder's pull rung off the same reps-per-set rate.
function centuryMrvSets(reps){
  const r=Math.max(0,Math.min(PULLUP_CENTURY.target,reps||0));
  return Math.round(CENTURY_MRV_SETS*r/PULLUP_CENTURY.target*10)/10;
}
// Century days come from AVAILABILITY, never from the generated program:
// dayTemplate consults this during generation, so reading S.program here would
// be circular (the same trap documented on getMRVLimits). Walks the week in
// calendar order and takes every third ELIGIBLE day, which is the ≥48h spacing
// the protocol needs.
//
// ELIGIBILITY (2026-08-03, from Sam): any available training day qualifies,
// INCLUDING a YMCA lunch. A lunch century was briefly gated out on the theory
// that it needs a bar you can monopolize, but Sam's call is that it fits — it
// just costs roughly 20 minutes of a 40-minute lunch right now. That cost is
// real, so it is charged against the lunch time-box rather than ignored: see
// centuryMins() and the lunch exercise-limit reduction in buildSession.
// Still returns an EMPTY list when nothing is available at all, so callers must
// handle that. (The Fundamentals card used to say so in words; it was removed
// 2026-08-03, so there is no longer a caller that prints the day list — but the
// empty case is still real for any future one.)
// This week's calendar date for a given day-of-week, Monday-anchored — the same
// arithmetic genProgram's own local dateForDow uses, exposed at module scope
// because centuryEligibleDow needs it and isn't inside that closure.
function weekDateForDow(dow){
  const mon=thisMonday();
  return dow===0?addDays(mon,6):dow===6?addDays(mon,5):addDays(mon,dow-1);
}
// "No pull-up bar today" (2026-08-19, Sam: "let's make it so I can say I don't
// have a pull up bar available today to do the century"). A real gap this
// closes: century ELIGIBILITY has only ever asked "is a session available that
// day", never "does that session have a bar" — none of the equipment presets
// without pullup_bar (hotel_gym, bodyweight) were ever excluded either, so a
// travel day could already have been scheduling 100 pull-ups with nothing to
// hang from. Keyed by DATE, not day-of-week, because it's a one-off statement
// about today, not a recurring preference — a flag that silently reapplied
// itself next week would be its own kind of bug (see the Century's own
// "offSession" flag for the same one-off-vs-recurring distinction).
function noBarToday(dow){return !!(S.noBarLog||{})[weekDateForDow(dow)];}
// A day's USABLE equipment, as opposed to what the location owns. The preset is
// a property of the place and stays untouched — the apartment gym still has a
// bar tomorrow — while "no bar today" is a property of the DAY, so it is applied
// here, at every point that resolves equipment for a session.
//
// Without this the feature was half-done in the worst way: it correctly freed
// the ~30 minutes the century was reserving, and then the generator spent the
// freed slot on weighted_pullups. Measured over a sweep of flagged days, 3 of 11
// programmed a bar-only movement on a day he had just said had no bar — the
// exact "prescribing something that can't be done" failure the Pyramid's own
// `options` list exists to prevent.
function equipForDow(equipmentKey,dow){
  const eq=(EQUIPMENT_PRESETS[equipmentKey]||EQUIPMENT_PRESETS.ymca).equipment||[];
  return noBarToday(dow===undefined?todayDow():dow)?eq.filter(q=>q!=='pullup_bar'):eq;
}
function centuryEligibleDow(av,dow){
  if(noBarToday(dow))return false;
  const d=av[dow]||{};
  return(dow===0||dow===6)?!!d.on:(d.lunch!==false||!!d.eve?.on);
}
// Measured minutes a century actually takes — the whole point of timing it.
// The prescription (100 reps) never moves, so the two things that DO move are
// the set count and the clock; this reads the clock back into scheduling so a
// lunch century is budgeted from evidence instead of a guess. Median of the
// last 5 timed sessions (median, not mean, so one interrupted session doesn't
// skew the budget), falling back to 20 min until there's data.
// Until there's a measured session, budget the century at what the PRESCRIBED
// pacing actually costs (centurySetPlan) rather than at a round guess. The old
// flat 20 was invented before there was a pacing prescription to derive it
// from; now that the card tells him sets of N with a fixed rest, the honest
// budget is the arithmetic of that instruction. It also self-scales for free —
// as his best set climbs, the plan gets shorter and so does the reservation.
// Capped at the same ceiling the MEASURED path uses. The derived plan can exceed
// a whole lunch at a low `best`: half of 5 is a set of 3, which needs 33 sets and
// prices at 47 minutes — more than the box, so the ledger would go negative and
// report negative slack. The cap doesn't make the century shorter, it stops an
// unmeasured ESTIMATE from claiming more than a lunch can contain; once there are
// real timings, centuryMins() uses those instead.
function centuryDefaultMins(){return Math.min(CENTURY_MAX_BUDGET_MINS,centurySetPlan().mins);}
// A PARTIAL century must never make the budget SMALLER. The card deliberately
// offers "log N reps & stop here", so a short session is a normal outcome —
// and 26 reps in 18 minutes is evidence the century runs SLOWER than the
// default, not faster. The original median took every timedMins at face value,
// which would have read that session as "centuries take 18 min", cut the
// reserved time, and handed the lunch MORE lifting on the exact day it had
// already overrun. Completed sessions calibrate directly; partials are only
// used pro-rata and only ever push the number up.
const CENTURY_MAX_BUDGET_MINS=40; // a full lunch — past this it simply doesn't fit
// Below this many reps a pro-rata extrapolation is noise, not evidence: 8 reps in
// 2 minutes "proves" a 25-minute century on one set's worth of data, and the
// early sets are the least representative part of the session. Such a session is
// skipped entirely, the same way an untimed one is.
const CENTURY_PARTIAL_MIN_REPS=30;
// A TRUE median of an already-sorted list. The old `arr[Math.floor(n/2)]` takes
// the UPPER of the two middle values on an even-length list, which was a small
// bias when the pool was completed sessions only and a real one now that scaled
// partials join it: an even pool of one clean session and one bad-day
// extrapolation returned the bad day outright, and the bad days are precisely
// the ones that scale up.
function median(sorted){
  if(!sorted.length)return 0;
  const mid=Math.floor(sorted.length/2);
  return sorted.length%2?sorted[mid]:(sorted[mid-1]+sorted[mid])/2;
}
// SCALING A PARTIAL (revised 2026-08-17, Sam: "scaling timing for incomplete
// centuries for scheduling purposes"). Every timed session now feeds the median,
// with the incomplete ones scaled to a full-century equivalent first, instead of
// partials being thrown away the moment a single completed session exists. That
// discard was the bug: 26 reps in 18 minutes is the strongest possible evidence
// that a century runs long, and it was being ignored in favour of one clean
// session logged weeks earlier. A partial is the common case on the days the
// budget matters most — the ones where the clock ran out.
//
// Two guards keep the scaling honest, both in the conservative direction:
//   · reps below CENTURY_PARTIAL_MIN_REPS don't extrapolate at all;
//   · a scaled partial can never come in UNDER the default reservation. Pro-rata
//     systematically UNDERSTATES the total, because the reps he got through are
//     the fast early ones and the sets that never happened are the slow late
//     ones. Left uncorrected that hands the lunch more lifting on exactly the day
//     it already overran.
function centuryMins(){
  const scaled=centuryLogs().filter(l=>l.timedMins>0).slice(-5)
    .map(l=>{

// ── THE PEAK, PART 2: WHAT HE CAN ACTUALLY FINISH (2026-08-19) ──
// Sam: "I only made my way up the pyramid on Saturday … scale the rung based on

// minus PYRAMID_PEAK_HEADROOM. That is the right ceiling — the top rung is one
// unbroken set of that many pull-ups, so his hardest single set genuinely caps
// it — but it is ONLY a ceiling. It says nothing about whether 15×peak² reps
// across five movements is a session he can COMPLETE, and completing it is the
// thing he actually couldn't do. Pull-up strength and work capacity are
// different qualities and the ladder demands both.

// grouped into it. Probably the main reason I wasnt able to finish my century
// today." It is charged now (see prepPlan and PREP_BUDGET_MINS), which costs an
// ordinary lunch one of its three lifts. That is the arithmetic being told the
// truth rather than a change in policy.
//
// Both fixed doses are DERIVED from the item lists rather than restated as
// constants — getters, because the pools are declared further down the file and
// a plain property would hit the temporal dead zone at module-eval time.
// ─── SESSION TIME MODEL ───
// Everything prescribed for a day belongs to ONE session that starts when the
// workout is opened — the century, the McGill Big 3, the daily spine holds, the
// stretching and any finisher included, not as separate cards to find later.
// That only works if each piece is actually costed, so the lifting can shrink
// to fit rather than the session quietly running long.
//
// Transitions are the piece every estimate forgets: walking to the rig, waiting
// for a bench, re-racking, setting up the next thing. Charged as a FIXED buffer
// per movement (rather than folded into the movement's own estimate) because it
// scales with the NUMBER of pieces, which is exactly what changes when the
// session grows or shrinks.
const TRANSITION_BUFFER_SECS=45;
// The post-session block: tibialis raises plus three rotated static holds.
// Matches the '~5 min' the cool-down box itself advertises.
const COOLDOWN_MINS=5;
// Minutes an evening lift actually costs — warm-up ramp, working sets and the
// rest between them. The lunch equivalent is MEASURED from logs (lunchExMins);
// evenings have no comparable clean signal yet, so this stays an estimate.
const EVENING_EX_MINS=12;
const transitionMins=(pieces)=>Math.round(pieces*TRANSITION_BUFFER_SECS/60);
// Derived, not invented: the Big 3's own prescribed holds priced the same way
// every other fixed block is (prepItemSecs parses each entry's stated dose).
function mcgillDefaultMins(){return Math.max(4,prepBlockMins(MCGILL_BIG3));}
function mcgillLogs(){return (S.logs||[]).filter(l=>l&&l.mcgill&&l.timedMins>0);}
// Median of the last 5 MEASURED Big 3 sessions, same rule as centuryMins():
// median rather than mean so one interrupted session can't skew the budget,
// and only genuinely timed sessions count — an estimate fed back in as if it
// were a measurement is the circularity the century's timing note warns about.
function mcgillMins(){
  const t=mcgillLogs().slice(-5).map(l=>l.timedMins).sort((a,b)=>a-b);
  return t.length?t[Math.floor(t.length/2)]:mcgillDefaultMins();
}
function mcgillDraft(){
  if(!S.mcgill||S.mcgill.date!==todayStr())return{date:todayStr(),startedAt:null};
  return S.mcgill;
}
function mcgillDoneToday(){return (S.logs||[]).find(l=>l&&l.mcgill&&logDay(l.date)===todayStr())||null;}

const LUNCH_LEDGER={
  get spineMins(){return prepBlockMins(DAILY_SPINE_MINIMUMS);},  // the four fixed holds
  get prepMins(){return PREP_BUDGET_MINS.lunch;},                // a CAP, and prepPlan fills to it
  exMins:11,     // per exercise, DEFAULT ONLY — lunchExMins() measures the real one
  maxLifts:3,    // the 2026-07-14 time-box calibration; 4 ran ~7 min long
  minLifts:1,    // a century day never becomes a no-lifting day
};
// The per-exercise rate, measured rather than assumed — same principle as
// centuryMins(). Only CENTURY-FREE lunches calibrate it, because on a century
// day the two unknowns (rate per lift, minutes per century) can't be separated
// from one number. Only `measured` logs count: finishWorkout falls back to a
// set-count ESTIMATE when the timer was left running, and feeding an estimate
// back in as if it were a measurement is the exact circularity the century's
// timedMins/duration split exists to prevent.
//
// The per-exercise figure has to be a MARGINAL rate — what one more lift costs —
// and the session's fixed overheads have to come off the top before dividing.
// Prep was not being subtracted, so the ~6 minutes of mobility that happen once,
// in front of exercise 1, were being smeared across every exercise as if each
// lift carried a share of it. That inflates the rate on a 3-lift lunch and
// inflates it much harder on a 1-lift century lunch, which is the one the clock
// actually broke on.
function lunchExMins(){
  const centuryDates=new Set(centuryLogs().map(l=>logDay(l.date)));
  const fixed=LUNCH_LEDGER.spineMins+LUNCH_LEDGER.prepMins;
  const rates=(S.logs||[])
    .filter(l=>l&&l.isLunch&&!l.isCardio&&l.measured&&l.duration>0&&(l.exercises||[]).length)
    .filter(l=>!centuryDates.has(logDay(l.date)))
    .slice(-5)
    .map(l=>(l.duration-fixed)/l.exercises.length)
    .filter(m=>m>3&&m<30) // discard nonsense: an abandoned or mis-timed session
    .sort((a,b)=>a-b);
  if(!rates.length)return LUNCH_LEDGER.exMins;
  return rates[Math.floor(rates.length/2)];
}
// The whole session, itemised, in the order it's actually performed. One source
// of truth: the ledgers size the lifting from it and the workout screen renders
// it, so what the plan promises and what the session costs cannot drift apart.
// `lifts` is passed in because the ledgers call this to DECIDE the lift count —
// computing it here too would be circular.
// 'a', 'a and b', 'a, b and c' — the deferred list reads as a sentence.
const listWords=(a)=>a.length<2?(a[0]||''):a.slice(0,-1).join(', ')+' and '+a[a.length-1];
// ─────────────────────────────────────────────
// PAIRED SETS (2026-08-30)
// ─────────────────────────────────────────────
// From the workouts Sam brought in: A1/A2 with "Rest 10 seconds" between the pair
// and "Rest 90 seconds" after it, then B1/B2 the same. Two movements run as one
// station: you alternate them, and the only real rest is at the end of a round.
//
// OFF BY DEFAULT, behind `S.cfg.pairedSets` on the Plan screen, alongside the
// separate/circuits toggle that already sets session structure. The generator
// keeps producing straight sets until it's switched on.
//
// WHAT IS NEVER PAIRED, and why it matters more than what is:
//   - 'strength' — the heavy 1–5 @ 85–95% tier. Ten seconds of rest is the
//     opposite of what that work needs, and the weekly heavy-leg mandate is the
//     one guarantee in the whole program most worth not quietly degrading.
//   - 'power' / 'ballistic' / 'plyometric' — trained by SPEED, not proximity to
//     failure. A fatigued explosive rep is a worse rep, not a harder one; this is
//     the same reasoning that already excludes them from the back-off model.
//   - Two movements of the SAME muscle. The source workouts do pair leg with leg,
//     but that is a giant set for someone who chose it deliberately; as an
//     automatic rule it just compounds fatigue on whatever the day's anchor is.
// Anything that can't find a partner stays a straight set rather than being forced
// into one — a session with an odd number of pairable lifts is normal, not a bug.
const PAIR_TRANSITION_SECS=10;
const PAIR_LETTERS='ABCDEF';
const PAIR_BLOCKED_TAGS=['strength','power','ballistic','plyometric'];

function pairedSetsOn(){return S.cfg?.pairedSets===true;}
function canPair(e){
  if(!e)return false;
  const tags=e.tags||[];
  return !tags.some(t=>PAIR_BLOCKED_TAGS.includes(t));
}

// Assign pairId/pairPos and reorder so partners sit adjacent. Mutates in place,
// matching flagFirstWorkingSet's contract — and it must run AFTER that one, so the
// lift carrying the warm-up ramp stays at index 0 and simply becomes A1.
function pairSession(exs){
  if(!exs||exs.length<2)return exs;
  exs.forEach(e=>{delete e.pairId;delete e.pairPos;});
  const used=new Array(exs.length).fill(false);
  const out=[];let letter=0;
  for(let i=0;i<exs.length;i++){
    if(used[i])continue;
    const a=exs[i];used[i]=true;
    if(!canPair(a)){out.push(a);continue;}
    let j=-1;
    for(let k=i+1;k<exs.length;k++){
      if(used[k]||!canPair(exs[k])||exs[k].muscle===a.muscle)continue;
      j=k;break;
    }
    if(j<0){out.push(a);continue;}
    const b=exs[j];used[j]=true;
    const id=PAIR_LETTERS[letter++]||'X';
    a.pairId=id;a.pairPos=1;b.pairId=id;b.pairPos=2;
    out.push(a,b);
  }
  exs.length=0;exs.push(...out);
  return exs;
}

// Put explicitly-labelled pairs back in order after flagFirstWorkingSet has moved
// things around: partners adjacent, leader first. pairSession does this for pairs
// it creates; an IMPORTED pairing needs the same guarantee without re-deciding who
// pairs with whom.
function pairSortAdjacent(exs){
  const out=[];const taken=new Set();
  exs.forEach((e,i)=>{
    if(taken.has(i))return;
    taken.add(i);
    if(!e.pairId){out.push(e);return;}
    if(e.pairPos===2){
      const li=exs.findIndex((o,j)=>!taken.has(j)&&o.pairId===e.pairId&&o.pairPos===1);
      if(li>=0){taken.add(li);out.push(exs[li],e);return;}
    }
    out.push(e);
    const pi=exs.findIndex((o,j)=>!taken.has(j)&&o.pairId===e.pairId&&o!==e);
    if(pi>=0){taken.add(pi);out.push(exs[pi]);}
  });
  exs.length=0;exs.push(...out);
  return exs;
}

// Index of the other half of this exercise's pair, or -1.
function pairPartnerIdx(idx){
  const exs=S.active?.exercises||[];
  const e=exs[idx];
  if(!e||!e.pairId)return-1;
  for(let i=0;i<exs.length;i++){if(i!==idx&&exs[i].pairId===e.pairId)return i;}
  return-1;
}

// ── What a paired lift costs the clock ──
// Derived from numbers already in the file rather than picked. EVENING_EX_MINS
// budgets 12 min for a 3-set lift, i.e. 240s per set; the rest interval inside
// that is smartRest's middle compound tier (150s), so the WORK is about 90s. Run
// as a pair, one round is A1 work + the 10s transition + A2 work + ONE full rest:
// 90+10+90+150 = 340s covering two lifts, or 170s per lift per set against 240s
// straight. That is the factor below (~0.71) — one rest interval saved per round
// is the entire mechanism, and it falls out of the arithmetic instead of being
// asserted.
//
// It is an APPROXIMATION on purpose: a session with an odd lift out pays full rate
// for that one, and the ledgers size the lift count before the exercises exist
// (the same chicken-and-egg `lifts` being an input to sessionPlan already has). It
// errs toward charging slightly too much, which is the safe direction for a box
// that has to hold.
const PAIR_STRAIGHT_SET_SECS=EVENING_EX_MINS*60/3;
const PAIR_REST_SECS=150;
const PAIR_WORK_SECS=PAIR_STRAIGHT_SET_SECS-PAIR_REST_SECS;
const PAIR_TIME_FACTOR=(2*PAIR_WORK_SECS+PAIR_TRANSITION_SECS+PAIR_REST_SECS)/2/PAIR_STRAIGHT_SET_SECS;
// The one place the ledgers ask "what does a lift cost today". Every per-lift rate
// goes through this so the two ledgers and sessionPlan can never disagree about
// whether pairing is on — the failure mode getLockedMuscles/legsRecovered records.
function perLiftMinsFor(base){return pairedSetsOn()?base*PAIR_TIME_FACTOR:base;}

function sessionPlan({mins,dow,av,equipmentKey,isLunch,lifts,perLiftMins}){
  const items=[];
  const push=(key,label,m,note)=>{if(m>0)items.push({key,label,mins:m,note});};
  // 0 unless THIS session is the one hosting the century (see centuryChargeFor):
  // he does the hundred once, so on a lunch+evening day only one of the two
  // shows it and only one of the two pays for it.
  const centuryChg=centuryChargeFor(dow,!!isLunch,av);
  // A lunch that hosts the century gets the abbreviated prep, same figure the
  // ledger reserves — the two must agree or the card contradicts the lift count.
  const centuryLunch=!!isLunch&&centuryChg>0;
  push('prep','Prep & mobility',isLunch?(centuryLunch?PREP_BUDGET_MINS.centuryLunch:PREP_BUDGET_MINS.lunch):PREP_BUDGET_MINS.evening);
  const per=perLiftMins||perLiftMinsFor(isLunch?lunchExMins():EVENING_EX_MINS);
  if(lifts>0)push('lifts',`${lifts} lift${lifts>1?'s':''}`,Math.round(lifts*per));
  // Priced separately from the lifts above — 2 quick sets at CALF_TOPUP_MINS,
  // not a full per-lift charge. Skipped on a century lunch, matching the
  // ledger and the actual buildSession append.
  if(!centuryLunch&&needsCalfTopUp())push('calf','Calf raises (weekly top-up)',CALF_TOPUP_MINS,`${calfSetsThisWeek()}/${CALF_WEEKLY_TARGET_SETS} sets so far this week`);
  if(centuryChg>0)push('century','Pull-up Century',centuryChg,centuryLunch?'this is the session':'median of your timed sessions');
  // Covered-ness is a property of the DAY, not of this session's charge — a
  // lunch on a day that still ends in 100 pull-ups has its conditioning too.
  const conditioningCovered=centuryDows(av).includes(dow);
  if(S.cfg?.conditioning&&!conditioningCovered){
    const f=getFinisher(dow,!!isLunch,equipmentKey);
    const afford=isLunch?!!lunchBudget(dow,av,mins).finisher:true;
    if(f&&afford)push('finisher',f.name,f.mins||8);
  }
  // On a century lunch the spine holds are off the box BY DESIGN, not because
  // today happened to run long — the ledger already stopped charging for them.
  if(centuryLunch)items.push({key:'spine',label:'Daily spine minimums',mins:prepBlockMins(DAILY_SPINE_MINIMUMS),note:'morning or evening — the hundred is the whole box',deferred:true,byDesign:true});
  else push('spine','Daily spine minimums',prepBlockMins(DAILY_SPINE_MINIMUMS));
  const mcgillNote=mcgillLogs().length?'median of your timed sessions':'from its prescribed holds';
  if(isLunch){
    // Listed but never charged, and never performed here — see the lunch
    // ledger. Showing it deferred is the honest version of a rule the box has
    // always had: at 40 minutes the Big 3 costs a lift.
    items.push({key:'mcgill',label:'McGill Big 3',mins:mcgillMins(),note:'morning or evening — the 40-min box buys it with a lift',deferred:true,byDesign:true});
  }else push('mcgill','McGill Big 3',mcgillMins(),mcgillNote);
  if(!isLunch)push('cooldown','Cool-down stretching',COOLDOWN_MINS);
  // If it doesn't all fit, SHED rather than silently overrun — the whole point
  // is a routine that fits the duration actually stated. Order is cheapest-to-
  // lose first, and every one of these is a block that genuinely can happen
  // away from the gym later:
  //   cool-down stretching -> the Big 3 -> the spine holds.
  // Prep is never shed (it's the injury-prevention half), the lifts are already
  // floored at one by the ledgers, and the century isn't dropped because on a
  // century day it IS the session's headline prescription.
  // 'century' is last and is a different kind of answer: at ~30 min it simply
  // cannot fit a 40-min lunch or a 45-min evening alongside prep and a lift, so
  // when it reaches the front of this queue the honest message is that this
  // session is too short for it — not that it was quietly skipped.
  const SHED_ORDER=['cooldown','mcgill','spine','century'];
  const cost=()=>items.filter(i=>!i.deferred).reduce((a,i)=>a+i.mins,0)
    +transitionMins(items.filter(i=>!i.deferred).length);
  for(const key of SHED_ORDER){
    if(cost()<=mins)break;
    const it=items.find(i=>i.key===key&&!i.deferred);
    if(it)it.deferred=true;
  }
  const kept=items.filter(i=>!i.deferred);
  const transitions=transitionMins(kept.length);
  if(transitions>0)items.push({key:'transitions',label:`Transitions (${kept.length} × ${TRANSITION_BUFFER_SECS}s)`,mins:transitions});
  const total=kept.reduce((a,i)=>a+i.mins,0)+transitions;
  const deferred=items.filter(i=>i.deferred);
  return{items,deferred,total,over:Math.max(0,total-mins),spare:Math.max(0,mins-total)};
}

// ── EVENING / WEEKEND TIME LEDGER ──
// Evenings used to take the plain EX_LIMIT cap on the stated session length,
// on the reasoning that they have a shower and a flexible finish time and "no
// century contending for the same minutes". Two of those stopped being true:
// centuryDows draws from AVAILABILITY, so any training day can be a century
// day including a Saturday, and the conditioning finisher is an evening
// feature by construction (sprints and hard intervals are kept out of lunch).
//
// So a stated 75-minute Saturday could be handed the full 5-lift template PLUS
// a ~20 min century PLUS a ~12 min finisher — about 107 minutes of work billed
// as 75. Same failure the lunch ledger was built to fix, just with more slack
// to hide in.
//
// Charge them the same way the lunch box is charged: every fixed block the
// session actually contains comes out first, and the lift count is what the
// REMAINING minutes buy at the per-lift rate.
function eveningLifts(mins,dow,av,equipmentKey){
  // Cost the fixed pieces explicitly and divide what's LEFT by the per-lift
  // rate. The earlier version subtracted the century and the finisher and then
  // read the remainder off the EX_LIMIT tiers — but those tiers already allow
  // for prep and the cool-down, so charging them here as well billed them twice
  // and a 75-min evening collapsed to a single lift. exLimitFor still supplies
  // the CEILING off the stated length (a long evening shouldn't sprawl into
  // eight exercises); it just no longer does the arithmetic.
  const box=mins||60;
  // 0 unless this evening is the session actually HOSTING the century (see
  // centuryChargeFor). It used to bill every century dow, which on a
  // lunch+evening day meant the same hundred pull-ups came out of the lunch box
  // AND out of the evening — the double-charge Sam reported on 2026-08-17.
  const century=centuryChargeFor(dow,false,av);
  // Same rule the lunch ledger enforces, and keyed on the DAY for the same
  // reason: 100 pull-ups already IS the day's conditioning, and stacking a circuit on top is the recovery hole the
  // century's spacing exists to avoid. It was also the only way a 75-minute
  // evening could end up 15 minutes over.
  const conditioningCovered=centuryDows(av).includes(dow);
  let finisher=0;
  if(S.cfg?.conditioning&&!conditioningCovered){
    const f=getFinisher(dow,false,equipmentKey);
    if(f)finisher=f.mins||8;
  }
  // Only the blocks that CANNOT be shed are charged here. sessionPlan drops the
  // cool-down, then the Big 3, then the spine holds before it would touch the
  // lifting (see SHED_ORDER), so charging those three against the lift count is
  // the two halves disagreeing with each other — and it showed: a 60-minute
  // evening was billed for 16 minutes of work the plan then deferred anyway and
  // came out at ONE lift with six minutes spare. All three are floor work that
  // genuinely can happen at home; a lift can't.
  // Whichever session buildSession finishes assembling first this week gets
  // the calf top-up appended (see CALF_WEEKLY_TARGET_SETS) — not knowable in
  // advance which one that'll be, so every evening reserves for it until the
  // week's 2 sets are actually banked, same as the century/finisher above.
  const calfTopUp=needsCalfTopUp()?CALF_TOPUP_MINS:0;
  // Five pieces, matching what's actually guaranteed to be in the session:
  // prep, the lifting, the century if this evening hosts it, the finisher, and
  // the calf top-up. Charging six (the full itemised plan) reserved buffer for
  // blocks that get shed anyway and quietly cost a lift at 75 and 90 minutes.
  const fixed=PREP_BUDGET_MINS.evening+century+finisher+calfTopUp+transitionMins(4);
  // EX_LIMIT is the ceiling only. The tiers are calibrated as prep plus N lifts
  // at EVENING_EX_MINS (60 → 12 + 4×12), so the two agree on an empty evening
  // and diverge only by what's actually prescribed on top.
  return Math.max(1,Math.min(exLimitFor(box),Math.floor((box-fixed)/perLiftMinsFor(EVENING_EX_MINS))));
}

// Everything that spends the lunch box, in priority order. `av` is passed
// explicitly during generation for the same reason centuryDows takes it —
// reading S.program mid-generation would be circular.
// centuryOverride answers "what would this lunch afford IF it hosted the
// hundred" — the question centuryDows has to ask before it knows the answer.
// Without it that call would recurse (centuryDows → centuryChargeFor →
// centuryHostSession → centuryDows).
function lunchBudget(dow,av,boxMins,centuryOverride){
  const box=boxMins||40;
  // 0 unless the lunch is the session actually hosting the century, and scaled
  // to the reps still outstanding when it's today (see centuryChargeFor). On a
  // lunch+evening day the default host is the evening, so the box keeps its
  // full lift count instead of paying for work happening after six.
  const hypothetical=centuryOverride!==undefined;
  const century=hypothetical?centuryOverride:centuryChargeFor(dow,true,av);
  // A century lunch is a DIFFERENT session, not a shorter one: at ~30 measured
  // minutes the hundred IS the 40-minute box, so prep is abbreviated, the spine
  // holds move out, and the lift floor is waived below.
  const hostsCentury=century>0;
  // Prep is reserved at its BUDGET CAP, not at the cost of the particular
  // rotation that lands today. That is deliberate: which items come up depends
  // on the date and on whether the session turns out to be a leg day, and the
  // session doesn't exist yet when this runs — reserving the cap is the only
  // non-circular answer, and prepPlan guarantees it never exceeds it.
  const prep=hostsCentury?PREP_BUDGET_MINS.centuryLunch:LUNCH_LEDGER.prepMins;
  // The spine holds come off a century lunch for the same reason the Big 3 never
  // went on it: six minutes of floor work that needs no gym, against a box that
  // can no longer even afford one lift. sessionPlan lists them as deferred.
  const spine=hostsCentury?0:LUNCH_LEDGER.spineMins;
  const per=perLiftMinsFor(lunchExMins());
  // The transition buffer joins the box for the same reason the spine holds and
  // prep already had: it happens inside this session, so pretending it's free is
  // how a 40-minute lunch became a 43-minute one.
  //
  // The Big 3 deliberately does NOT join it. That is the decision MCGILL_BIG3
  // already records and the arithmetic hasn't changed: six minutes is a whole
  // lift out of a 40-minute box, so half his lunch lifting would be paying for
  // floor work that needs no gym and can be done at home. It stays a
  // morning-or-evening job — sessionPlan lists it on a lunch as deferred, with
  // that reason, rather than dropping it silently. If it ever DOES move into
  // the box, LUNCH_LEDGER.spineMins has to move with it.
  //
  // The calf top-up (see CALF_WEEKLY_TARGET_SETS) is skipped on a century
  // lunch for the same reason the spine holds are: that box has no room for
  // anything past the hundred itself.
  const calfTopUp=(!hostsCentury&&needsCalfTopUp())?CALF_TOPUP_MINS:0;
  let left=box-spine-prep-century-calfTopUp-transitionMins(hostsCentury?2:5);
  // minLifts is waived on a century lunch. Its comment used to read "a century
  // day never becomes a no-lifting day", written when a century was budgeted at
  // 16–20 min; at the MEASURED ~30 that sentence is arithmetically false, and
  // forcing the floor made the ledger lie in the worst possible way — the plan
  // came out at one lift and then SHED THE CENTURY to fit it, i.e. dropped the
  // only thing the day exists for and left 21 of 40 minutes unused. Sam, seeing
  // it: "looks like we just have to get rid of all exercises and do abbreviated
  // stretching to fit it in 40 min." Correct, so that is now what it says.
  const lifts=Math.max(hostsCentury?0:LUNCH_LEDGER.minLifts,Math.min(LUNCH_LEDGER.maxLifts,Math.floor(left/per)));
  left-=lifts*per;
  // A finisher has to be affordable TWICE OVER before it's offered.
  //  1) Never on a century day. 100 pull-ups already IS the conditioning, and
  //     stacking a circuit on top is precisely the recovery hole PULLUP_CENTURY
  //     is spaced and capped to avoid. Without this the arithmetic did the
  //     opposite of what anyone would want: a 1-lift century day "saves" the
  //     unspent remainder of the lift that didn't fit (8 of 11 min) and buys a
  //     finisher with it, while an ordinary 3-lift lunch has only 2 min spare
  //     and gets none — the tightest day of the week was the one getting extra
  //     work. Worse, it depended on WHICH day: getFinisher rotates by dow, so
  //     an 8-min circuit slipped in and a 10-min one didn't. Caught by driving
  //     the deployed build, not by the headless sim, which happened to land on
  //     a 10-min day.
  //  2) Leave a real margin. `left` is a flooring remainder, not free time —
  //     spending it to the last minute is how a 40-minute lunch becomes 43.
  const FINISHER_MARGIN_MINS=2;
  // Equipment matters to WHICH finisher lands (see needsEquip/needsRunway), and
  // the finisher's minutes are what the ledger reserves — so price it for the
  // location this lunch actually happens at.
  const lunchEquip=(av&&(av[dow]?.lunchEquipment||av[dow]?.equipment))||S.active?.equipmentKey||'ymca';
  // Gate (1) is a property of the DAY, not of this session's charge: since
  // 2026-08-17 the century's minutes can be billed to the evening instead, and
  // reading `century` here would have let a finisher back into the lunch of a
  // day that still ends in 100 pull-ups.
  // The hypothetical call is asking "if this day hosted the hundred, would any
  // lifting survive" — so by construction it IS a century day. Short-circuiting
  // here is what keeps that question out of centuryDows, which is the function
  // asking it (see centuryCrowdsOutLifting).
  const conditioningCovered=hypothetical||centuryDows(av).includes(dow);
  const f=(S.cfg?.conditioning&&!conditioningCovered)?getFinisher(dow,true,lunchEquip):null;
  const finisher=(f&&left>=(f.mins||8)+FINISHER_MARGIN_MINS)?f:null;
  if(finisher)left-=(finisher.mins||8);
  return{box,spine,prep,century,hostsCentury,per:Math.round(per*10)/10,lifts,finisher,left:Math.round(left)};
}

// Dragon Flag progression track: Tier 1 (Lying Leg Lifts) is always offered;
// Tier 2/3 unlock only after logging 10+ reps in a single set on the tier
// directly before it — an automatic gate rather than a manual "mark achieved"
// button, read straight from the workout log.
const DRAGON_FLAG_TRACK=['leg_lifts_lying','dragon_flag_bent','dragon_flag_full'];
const hasLoggedRepsOf=(exId,minReps)=>(S.logs||[]).some(l=>!l.isCardio&&(l.exercises||[]).some(e=>e.id===exId&&(e.sets||[]).some(s=>s&&s.reps>=minReps)));
function dragonFlagUnlocked(exId){
  const idx=DRAGON_FLAG_TRACK.indexOf(exId);
  if(idx<=0) return true; // tier 1, or not part of the track
  return hasLoggedRepsOf(DRAGON_FLAG_TRACK[idx-1],10);
}

function pickEx(slot,equip,used,isLunch,budget,freq){
  const eq=new Set([...equip,'bodyweight']);
  const overworkedMuscles = getOverworkedMuscles();
  const isCircuitStyle = S.weekPlan?.cardioStyle === 'circuits';

  // Combine built-in exercises with custom exercises
  const allExercises = [...EX, ...(S.customExercises||[])];

  // MRV headroom: would adding this exercise push the muscle past its weekly max?
  //
  // MANDATED slots are exempt, for the same reason the Foundation tier below is:
  // a weekly PATTERN guarantee outranks a volume ceiling. Added 2026-08-05 and it
  // is load-bearing — once the week's scheduled centuries are charged against
  // back MRV (see getCommittedVolumes), 300 pull-up reps fill the back budget on
  // their own, and the ceiling then blocked every row and rear-delt slot in the
  // week: the horizontal mandate fell from 60% of weeks to 0%. That is the exact
  // failure the 2026-08-03 audit recorded when all three training days became
  // century days. The century is VERTICAL pulling; it cannot cover a row or a
  // rear delt no matter how many reps it accumulates, so those slots must not be
  // priced out by it. The exemption is narrow by construction: dayTemplate stamps
  // at most a couple of mandate tags per session, so it can add a bounded
  // handful of sets, not an unbounded amount.
  const MANDATE_TAGS_MRV_EXEMPT = ['strength','hinge','hamstring','horizontal','rear_delt'];
  const mandatedSlot = !!(slot && slot.tag && MANDATE_TAGS_MRV_EXEMPT.includes(slot.tag));
  const perEx = (budget && budget.perExercise) || 3;
  const fitsMRV = (e) => {
    if(mandatedSlot) return true;
    if(!budget || !budget.limits || !budget.limits[e.muscle]) return true;
    return (budget.vol[e.muscle] || 0) + perEx <= budget.limits[e.muscle].max;
  };

  // Rolling-week movement frequency (seeded from the past 7 days of history plus
  // whatever this generation run has already assigned). Used to (a) cap how often
  // a single movement repeats in the microcycle and (b) spread variety across
  // days instead of deterministically returning the first match every time.
  const f = freq || {};
  const FREQ_CAP = 2; // max appearances of one movement per rolling 7-day window
  const freqOf = (e) => f[e.id] || 0;

  // Shared slot constraints (muscle/type/tag/equipment/hip-caution/lunch sweat).
  // Hip-caution mode also bans plyometrics (impact loading on a sensitive hip)
  // — that volume is redistributed to the remaining non-impact pool, which
  // includes eccentric tendon work like the Nordic curl.
  // Leg-exercise gate: Knee-Caution mode (when on) is an absolute whitelist
  // that overrides everything else for legs — it exists to hand-pick a small
  // knee-safe set, not to layer on top of the explosive/tendon emphasis gate.
  // Otherwise legAutoOK's emphasis-tag restriction applies as normal, except
  // for the hamstring mandate's 'hinge'/'hamstring' slots (see legAutoOK),
  // which guarantee RDL/hip-hinge and leg-curl-family work regardless.
  const legGateOK = (e) => {
    if(e.muscle!=='legs') return true;
    if(S.cfg.kneeCaution) return KNEE_SAFE_IDS.has(e.id);
    return slot.tag==='hinge'||slot.tag==='hamstring'||legAutoOK(e);
  };
  // baseFor lets the type-relax tier below re-run the same constraint set with
  // only the slot's type swapped — one source of truth for the safety filters.
  const baseFor = (sl) => (e) =>
    e.muscle===sl.muscle && e.type===sl.type &&
    (!sl.tag || ((e.tags||[]).includes(sl.tag))) &&
    !used.includes(e.id) &&
    e.eq.some(q=>eq.has(q)) &&
    legGateOK(e) &&
    !(S.cfg.hipCaution && e.hipRisk) &&
    !(S.cfg.shoulderCaution && e.shoulderRisk) &&
    !e.standingPressRisk &&
    !plyoHidden(e) &&
    !userAvoids(e) &&
    dragonFlagUnlocked(e.id) &&
    !(isLunch && e.highSweat);
  const base = baseFor(slot);

  // Among the candidates, take the LEAST-used movement (lowest weekly frequency),
  // breaking ties by EX array order — so a slot that recurs across days rotates
  // through the available movements instead of repeating barbell bench every time.
  const leastUsed = (list) => list.length
    ? list.reduce((best,e)=> freqOf(e) < freqOf(best) ? e : best)
    : null;

  // ── Foundation Five mandate (highest precedence) ──
  // slot.foundationId names an EXACT movement — the weekly coverage guarantee
  // (see FOUNDATION_FIVE), not a preference, so it's returned ahead of every
  // tier below. Deliberately bypasses the type/tag/legAutoOK filters, since
  // two of the five are unreachable through them by construction (pistol_squat
  // has no emphasis tag; bear_crawl is a compound the core cycle can't select),
  // and bypasses the MRV/frequency caps — the same small, deliberate overage
  // the hinge/hamstring mandate already accepts, bounded by one stamp per
  // session and once per movement per week.
  // The SAFETY gates still apply in full: equipment on hand, the personal
  // avoid list, hip/knee caution, the plyo ban, and the lunch no-sweat rule.
  // Blocked by any of those → fall through to the normal tiers and the
  // movement waits for a session that can host it (dayTemplate re-stamps it
  // the next day, since coverage is only marked once it actually lands).
  if(slot.foundationId){
    const f=allExercises.find(e=>e.id===slot.foundationId);
    if(f && !used.includes(f.id) && (f.eq||[]).some(q=>eq.has(q)) &&
       !(S.cfg.hipCaution&&f.hipRisk) && !plyoHidden(f) && !userAvoids(f) &&
       !kneeCautionBlocks(f) && dragonFlagUnlocked(f.id) &&
       !(isLunch&&f.highSweat)) return f;
  }

  // For circuit training, prefer circuit-tagged exercises (still within MRV + cap)
  if(isCircuitStyle && !isLunch) {
    const circuitEx = leastUsed(allExercises.filter(e => base(e) && !overworkedMuscles.has(e.muscle) && fitsMRV(e) && freqOf(e)<FREQ_CAP && e.circuit));
    if(circuitEx) return circuitEx;
  }

  // Hybrid-athlete soft preference (goal: look like a bodybuilder, move like an
  // athlete): a powerPreferred slot tries explosive/ballistic variants first
  // (med ball slam, rotational throw, ...) and falls through to the normal
  // tiers below when none fit the equipment/caps — a bias, never a constraint.
  if(slot.powerPreferred && !isLunch) {
    const powerEx = leastUsed(allExercises.filter(e => base(e) && (e.tags||[]).includes('power') && !overworkedMuscles.has(e.muscle) && fitsMRV(e) && freqOf(e)<FREQ_CAP));
    if(powerEx) return powerEx;
  }

  // 1) Best: avoid overworked muscles, stay within MRV max, under the frequency cap
  let exercise = leastUsed(allExercises.filter(e => base(e) && !overworkedMuscles.has(e.muscle) && fitsMRV(e) && freqOf(e)<FREQ_CAP));
  // 2) Next: within MRV max + under cap (allow a recently-worked muscle if needed)
  if(!exercise) exercise = leastUsed(allExercises.filter(e => base(e) && fitsMRV(e) && freqOf(e)<FREQ_CAP));
  // 2.5) Type relaxed, still under the cap: some pools have no compound at all
  // (biceps: 0) or exactly one (triceps: tricep_dips) — a muscle's first
  // appearance in a template is typed 'compound' by construction, so without
  // this tier a biceps slot silently drops every time and a triceps slot pins
  // its lone compound past the weekly frequency cap. A FRESH isolation
  // movement beats both outcomes. Untagged slots only — mandate-tagged slots
  // (strength/hinge/hamstring/core) keep their own dedicated fallbacks below.
  const isoRelax = slot.type==='compound' && !slot.tag ? baseFor({...slot,type:'isolation'}) : null;
  if(!exercise && isoRelax) exercise = leastUsed(allExercises.filter(e => isoRelax(e) && fitsMRV(e) && freqOf(e)<FREQ_CAP));
  // 3) Cap relaxed: a constrained equipment pool may have no alternative left
  // under the cap — better to repeat a movement than to drop the slot entirely.
  if(!exercise) exercise = leastUsed(allExercises.filter(e => base(e) && fitsMRV(e)));
  // 3.5) Cap relaxed on the relaxed type — last stop before the slot drops for
  // a muscle whose pool has no compound and no fresh isolation left either.
  if(!exercise && isoRelax) exercise = leastUsed(allExercises.filter(e => isoRelax(e) && fitsMRV(e)));
  // 3.7) Accent softening: the power/eccentric/decel accent conversion is a
  // bias, never a mandate — an avoid-list/equipment-emptied accent pool (e.g.
  // shoulders 'power' with the push press family excluded for the lower back)
  // degrades back to the plain compound slot instead of dropping the muscle's
  // work and leaving the slot to untargeted backfill.
  if(!exercise && slot.muscle!=='core' && (slot.tag==='power'||slot.tag==='eccentric'||slot.tag==='decel')){
    const noTag=baseFor({...slot,tag:null});
    exercise = leastUsed(allExercises.filter(e=>noTag(e)&&fitsMRV(e)&&freqOf(e)<FREQ_CAP)) || leastUsed(allExercises.filter(e=>noTag(e)&&fitsMRV(e)));
  }
  // 4) Mandate override: 'hinge' and 'hamstring' slots exist specifically so a
  // leg session never trains quads/squats without also hitting the hamstrings
  // (squat patterns alone don't train them). Stacking two dedicated leg slots
  // in one session can burn through that muscle's weekly MRV headroom before
  // reaching this one — dropping it here would silently defeat the mandate via
  // the untagged backfill pass. A small, deliberate MRV overage on this single
  // corrective-pattern slot beats skipping hamstring/hinge work outright.
  if(!exercise && (slot.tag==='hinge'||slot.tag==='hamstring'||slot.tag==='strength')) exercise = leastUsed(allExercises.filter(e => base(e)));
  // Strength-tier fallback: the heavy 1–5 pool is barbell/DB — a bodyweight-only
  // session has zero candidates, and dropping the day's main leg slot would be
  // worse than downgrading it. Fall back to the old 'hinge' mandate pool.
  if(!exercise && slot.tag==='strength'){
    const hingeSlot={...slot,tag:'hinge'};
    const hingeBase=(e)=>e.muscle===hingeSlot.muscle && e.type===hingeSlot.type && (e.tags||[]).includes('hinge') &&
      !used.includes(e.id) && e.eq.some(q=>eq.has(q)) && !(S.cfg.hipCaution&&e.hipRisk) &&
      !plyoHidden(e) && !userAvoids(e) && !(isLunch&&e.highSweat) &&
      !(S.cfg.kneeCaution&&!KNEE_SAFE_IDS.has(e.id));
    exercise = leastUsed(allExercises.filter(e=>hingeBase(e)&&fitsMRV(e)&&freqOf(e)<FREQ_CAP)) || leastUsed(allExercises.filter(hingeBase));
  }
  // 5) Core-emphasis fallback: the rotating produce/resist tag on the forced
  // core slot is a preference, never worth dropping the slot over — retry with
  // the tag AND type relaxed (flexion work is type 'isolation', the rest
  // 'rotational') so some core work always lands.
  if(!exercise && slot.muscle==='core' && slot.tag){
    const anyCore=(e)=>e.muscle==='core' && !used.includes(e.id) && e.eq.some(q=>eq.has(q)) &&
      !(S.cfg.hipCaution&&e.hipRisk) && !plyoHidden(e) &&
      !userAvoids(e) && dragonFlagUnlocked(e.id) && !(isLunch&&e.highSweat);
    exercise = leastUsed(allExercises.filter(e=>anyCore(e)&&fitsMRV(e)&&freqOf(e)<FREQ_CAP)) || leastUsed(allExercises.filter(anyCore));
  }
  // If the muscle has hit its weekly MRV max, intentionally return null so this
  // slot is dropped (fewer sets) rather than exceeding the recoverable volume.
  return exercise||null;
}

// Backfill a freed session slot (dropped via lockout/MRV-max, or a template
// shorter than the time-based exercise limit) with a movement for whichever
// OTHER muscle has the most headroom below its weekly MRV max — so session
// time isn't wasted while useful volume still fits. Ranks muscles by deficit
// (max - committed), then tries compound/isolation/rotational for the most
// under-volumed muscle before moving to the next.
function pickBackfillEx(equip,used,isLunch,budget,exFreq,excludeMuscles){
  const limits=(budget&&budget.limits)||{};
  const perEx=(budget&&budget.perExercise)||3;
  const candidates=Object.keys(limits)
    .filter(m=>!(excludeMuscles&&excludeMuscles.has(m)))
    .map(m=>({m,deficit:limits[m].max-(budget.vol[m]||0)}))
    .filter(c=>c.deficit>=perEx)
    .sort((a,b)=>b.deficit-a.deficit);
  for(const {m} of candidates){
    for(const type of ['compound','isolation','rotational']){
      const e=pickEx({muscle:m,type},equip,used,isLunch,budget,exFreq);
      if(e)return e;
    }
  }
  return null;
}

// Order a freshly built session and flag its warm-up target. Compounds are
// moved to the front (stable, preserving order within each group) so the heavy
// work is done fresh — equipment filtering (e.g. a hotel gym with no barbell/
// cables) could otherwise leave isolations leading the list. The warm-up box
// keys off `isFirst`: assign it to the first compound, or — when a session has
// no compound — the first LOADED movement (bodyweight/timed-only sessions get
// none, since weight-acclimation warm-ups don't apply). Mutates exs in place.
function flagFirstWorkingSet(exs){
  // A movement supports graded warm-up sets only if it can be externally loaded.
  // Bodyweight-only moves (noWeight, or bodyweight as the only equipment) and
  // timed isometric holds can't be scaled down for a warm-up, so they must not
  // lead the session — the first/warm-up slot needs a loadable exercise.
  // Med balls are excluded too: they're loaded but come in fixed ~5 lb jumps,
  // so "50% / 75% / 90%" acclimation percentages are meaningless for them.
  const scalable=e=>!e.noWeight&&!e.isTimed&&(e.eq||[]).some(q=>q!=='bodyweight'&&q!=='medball'&&q!=='medball_wall');
  const compounds=exs.filter(e=>e.type==='compound');
  const rest=exs.filter(e=>e.type!=='compound');
  let ordered=[...compounds,...rest];
  // Pull a loadable movement to the front (prefer a loadable compound) so the
  // warm-up can ramp; only fall back to a bodyweight lead if nothing is loadable.
  const lead=ordered.find(e=>e.type==='compound'&&scalable(e))||ordered.find(e=>scalable(e));
  if(lead)ordered=[lead,...ordered.filter(e=>e!==lead)];
  exs.length=0;exs.push(...ordered);
  exs.forEach(e=>{delete e.isFirst;});
  const target=lead||exs.find(e=>e.type==='compound')||exs[0];
  if(target)target.isFirst=true;
}

function genProgram(cfg,av,workoutHistoryLog){
  av=av||(S.weekPlan?.availability)||defaultAvailability();

  // The historical workout log is a REQUIRED input for reconfiguration. Reset
  // clears only the forward-looking schedule (S.program) — it never purges the
  // logs — so the generator can read what was actually trained recently. Treated
  // as immutable here: we only read from it.
  const history = workoutHistoryLog || S.logs || [];
  // Lookback constraint: tally how many times each movement was logged in the
  // past 7 days. pickEx blocks any movement that has hit its frequency cap and
  // substitutes an alternative; the same map keeps accumulating as this run
  // assigns movements, so a slot won't repeat the same lift across days.
  const freqStart = addDays(todayStr(), -7);
  const exFreq = {};
  history.forEach(l=>{
    if(l.isCardio || logDay(l.date) < freqStart) return;
    (l.exercises||[]).forEach(e=>{ if(e&&e.id) exFreq[e.id]=(exFreq[e.id]||0)+1; });
  });

  // Collect lunch slots and available evening slots separately
  const lunchSlots=[];const eveSlots=[];
  [1,2,3,4,5].forEach(dow=>{
    const d=av[dow]||{};
    if(d.lunch!==false)lunchSlots.push({dow,isLunch:true,mins:40,loc:'ymca',key:`${dow}-lunch`,equipmentKey:d.lunchEquipment||'ymca'});
    if(d.eve?.on)eveSlots.push({dow,isLunch:false,mins:d.eve.mins||60,loc:d.eve.loc||'ymca',key:`${dow}-eve`,equipmentKey:d.eve.equipment||'ymca'});
  });
  [6,0].forEach(dow=>{
    const d=av[dow]||{};
    if(d.on)eveSlots.push({dow,isLunch:false,mins:d.mins||60,loc:d.loc||'ymca',key:`${dow}-wknd`,equipmentKey:d.equipment||'ymca'});
  });
  if(!lunchSlots.length&&!eveSlots.length){
    const ps=S.cfg?.planStartDow??1;
    [1,2,3,4,5].filter(d=>ps!==0&&d>=ps).forEach(dow=>lunchSlots.push({dow,isLunch:true,mins:40,loc:'ymca',key:`${dow}-lunch`,equipmentKey:'ymca'}));
  }

  // No fixed split or week-ahead template cycle: every available day is planned
  // on demand from recovery debt (see dayTemplate). lunchDows lets evening slots
  // know which days already train at lunch.
  const lunchDows=new Set(lunchSlots.map(s=>s.dow));

  // Completed sessions this calendar week — preserve their templates
  const mon=thisMonday();
  const weekEnd=addDays(mon,7);
  // Local-day bucketing (also fixes the former `l.date+'T12:00:00'` parse,
  // which produced Invalid Date on full ISO timestamps → NaN dows)
  const completedDows=new Set(
    (S.logs||[]).filter(l=>!l.isCardio&&logDay(l.date)>=mon&&logDay(l.date)<weekEnd)
      .map(l=>new Date(l.date).getDay())
  );
  const oldWeek=S.program?.week;

  // MRV budget: start from sets already committed this week (logged + planned
  // custom workouts) and consume headroom as we assign sessions, so the week
  // fills toward optimal without exceeding each muscle's recoverable max.
  // `centuryVol` records how much of that came from centuries. It is NOT
  // subtracted from vol — the ceiling counts every rep — but dayTemplate needs to
  // know which part of back's volume is vertical pulling. See the pattern-
  // coverage note in dayTemplate's rows.
  const budget = { vol: getCommittedVolumes(), limits: getMRVLimits(), perExercise: 3, centuryVol: centuryWeekVolumes(false) };

  // Weekly heavy-strength tracking (primary goal: 1–5 reps @ 85–95% at least
  // once/week). Seeded from this week's logs, then extended by buildSession as
  // sessions are assigned. DATE-AWARE, not a boolean: sessions are generated
  // in pass order (lunches → weekend evenings → weekday double evenings), not
  // calendar order, so a Saturday can "bank" the strength slot before Tuesday
  // is even planned — Tuesday then runs a weighted accent that re-locks legs
  // and kills the Saturday heavy day it deferred to. A date D only treats
  // strength as banked when a strength session exists strictly BEFORE it, so
  // the earliest rested evening claims the heavy slot and everything after it
  // rotates accents (converges across the regen after each logged session).
  // Derived per-generation from logs; no persisted state.
  const STRENGTH_IDS=new Set([...EX,...(S.customExercises||[])].filter(e=>(e.tags||[]).includes('strength')).map(e=>e.id));
  const strengthDates=(history||[]).filter(l=>!l.isCardio&&logDay(l.date)>=mon&&logDay(l.date)<weekEnd&&(l.exercises||[]).some(e=>e&&STRENGTH_IDS.has(e.id))).map(l=>logDay(l.date));
  const strengthBefore=(d)=>strengthDates.some(x=>x<d);

  // Weekly hip-hinge guarantee. Same derived-from-logs shape as strengthBefore.
  //
  // Hinge coverage used to be PROBABILISTIC on evenings: the heavy 'strength'
  // slot rotates a 4-movement pool of which only two (heavy trap bar, heavy
  // RDL) are hinges, and once heavy work is banked the remaining leg slots take
  // athletic accents or the 'hamstring' isolation slot — and leg curls are KNEE
  // FLEXION, not a hip hinge. Measured over 8 simulated weeks on both of Sam's
  // real schedule shapes: 88% of weeks got a hinge, i.e. roughly one week in
  // eight trained legs all week with zero hip-hinge pattern. The lunch mandate
  // can't cover it either — it alternates hinge/hamstring by parity, so a week
  // can legitimately land all-hamstring.
  const HINGE_IDS=new Set([...EX,...(S.customExercises||[])].filter(e=>(e.tags||[]).includes('hinge')).map(e=>e.id));
  const hingeDates=(history||[]).filter(l=>!l.isCardio&&logDay(l.date)>=mon&&logDay(l.date)<weekEnd&&(l.exercises||[]).some(e=>e&&HINGE_IDS.has(e.id))).map(l=>logDay(l.date));
  // Counts sessions already assigned earlier in THIS generation run too, so a
  // single pass doesn't stack two hinge rescues into the same week.
  const hingeBanked=(d)=>hingeDates.some(x=>x<=d)||Object.entries(assignedHinge).some(([x])=>x<=d);

  // Foundation Five weekly coverage (see FOUNDATION_FIVE). Seeded from what was
  // actually LOGGED this calendar week — and deliberately NOT extended by
  // merely-planned sessions.
  // Why (found by simulation): every day re-plans the whole week, so a stamp
  // placed on a future session usually evaporates before that day arrives. When
  // planned sessions marked a movement "covered", the single stamp was routinely
  // spent on a Thursday template that Thursday's own regeneration then discarded
  // — push-ups landed 0 weeks out of 6 on a full schedule that trained chest
  // twice a week. Seeding from logs only means EVERY upcoming session with a
  // matching slot offers the uncovered movement, so it lands at the first real
  // opportunity; the moment one is logged, foundationCoveredThisWeek() sees it
  // and the stamps stop. Convergence, not a preview that lies.
  const foundationDone=foundationCoveredThisWeek();
  const centuryDowSet=new Set(centuryDows(av));

  // Calendar date (YYYY-MM-DD) for a program-week dow, for the fatigue matrix's
  // day-by-day lockout lookback. dow 1-5 = Mon-Fri, 6 = Sat, 0 = next Sun.
  const dateForDow=(dow)=>dow===0?addDays(mon,6):dow===6?addDays(mon,5):addDays(mon,dow-1);
  // Muscles trained per date, accumulated as sessions are assigned this run —
  // lets getLockedMuscles see "preceding" days within the same generation pass.
  const assignedMuscles={};
  // Dates in this generation run that already carry a hinge (see hingeBanked).
  const assignedHinge={};

  // The actual logged session for a slot's date AND session type (lunch vs
  // evening) this week, if any — the source of truth for a completed day.
  const loggedFor=(slot)=>(S.logs||[]).find(l=>!l.isCardio&&logDay(l.date)===dateForDow(slot.dow)&&(!!l.isLunch)===(!!slot.isLunch));

  // Plan a single day on demand from recovery debt: the muscle groups that are
  // most overdue AND adequately rested (past their MUSCLE_LOCKOUT_HOURS window),
  // assembled into that day's session. No fixed split — a group recurs as soon
  // as it's rested, and the day is named for whatever it actually trains.
  // Returns {name,desc,slots,tk} or null when nothing is recovered → rest day.
  function dayTemplate(dateStr,limit,isLunch,equip){
    const MUSCLES=['legs','back','chest','shoulders','biceps','triceps'];
    // Most recent training date per muscle (logs + sessions already assigned
    // earlier this run), on or before dateStr.
    const lastDate={};
    const consider=(d,muscles)=>{if(!d||d>dateStr)return;muscles.forEach(m=>{if(m&&(!lastDate[m]||d>lastDate[m]))lastDate[m]=d;});};
    // Weighted-only legs rule: bodyweight/tendon leg work doesn't reset the
    // legs recovery clock (see countsForRecoveryLog by MUSCLE_LOCKOUT_HOURS).
    (history||[]).forEach(l=>{if(l.isCardio)return;consider(logDay(l.date),(l.exercises||[]).map(e=>e&&countsForRecoveryLog(e)?e.muscle:null));});
    Object.entries(assignedMuscles).forEach(([d,set])=>consider(d,[...set]));
    const rows=MUSCLES.map(m=>{
      const ld=lastDate[m];
      const hrs=ld?hoursBetweenDates(ld,dateStr):9999; // never trained → max debt
      const max=budget.limits[m]?.max??20;
      const min=budget.limits[m]?.min??8;
      const vol=budget.vol[m]||0;
      // under = still below the week's optimal range ("yellow" on the dashboard
      // volume bars). Yellow muscles outrank green ones when picking a day.
      // Legs use the split heavy/accent windows (see legsRecovered) — 48h after
      // an accent day, 72h after heavy 1–5 work. Same predicate getLockedMuscles
      // uses, so eligibility here and the MRV pin there always agree.
      const rested=m==='legs'
        ?legsRecovered(dateStr,history,assignedMuscles,strengthDates)
        :hrs>=(MUSCLE_LOCKOUT_HOURS[m]||48);
      // PATTERN COVERAGE (2026-08-05). `under` drives slot PRIORITY — an
      // under-range muscle outranks an in-range one — and for back it has to be
      // measured on volume the centuries did NOT supply. A century is 100
      // VERTICAL pulls; it can fill back's weekly minimum single-handed and then
      // the day stops choosing back at all, which silently deletes the row and
      // rear-delt mandates (measured: horizontal 60% of weeks → 0% the moment
      // scheduled centuries entered the budget). Pull-ups cannot cover a row no
      // matter how many of them there are. The CEILING below still counts every
      // rep — headroom stays max−vol — so this buys pattern coverage without
      // buying extra fatigue. Deliberately back-only: for BICEPS the secondary
      // credit from 300 pull-ups is real elbow-flexor work and curls genuinely
      // are redundant against it, which is the whole point of
      // SECONDARY_CREDIT_RULES.
      const patternVol=m==='back'?vol-((budget.centuryVol&&budget.centuryVol[m])||0):vol;
      return{m,hrs,rested,headroom:max-vol,under:patternVol<min,patternUnder:patternVol<min&&patternVol<vol};
    });
    // Eligible = rested with weekly MRV headroom. Priority: under-range
    // ("yellow") muscles first — get every group to its weekly minimum before
    // adding more work for in-range ("green") ones — then most-overdue within
    // each tier. The rested filter deliberately trumps yellow priority: a
    // yellow muscle still inside its >24h lockout would need back-to-back
    // days to chase its range, so the day trains green muscles instead and
    // the yellow one resumes as soon as it's recovered. Muscles over range
    // ("red") have no headroom and are never intentionally prescribed. If
    // headroom rules everything out, fall back to rested-only.
    const byDebt=(a,b)=>(b.under?1:0)-(a.under?1:0)||b.hrs-a.hrs||MUSCLES.indexOf(a.m)-MUSCLES.indexOf(b.m);
    // `patternUnder` overrides the headroom filter, and ONLY it can: it is true
    // only for a muscle whose weekly minimum is unmet once century volume is set
    // aside, i.e. back on a heavy century week. On an efficiency-mode week the
