  {id:'jump_squats',name:'Jump Squats',muscle:'legs',type:'compound',eq:['bodyweight'],rMin:8,rMax:12,rest:120,cue:'Squat down, then explode up into a jump. Land softly, immediately into next rep. Focus on rate of force development. Each rep should be max effort.',tags:['plyometric','quad','power'],highSweat:true},
  {id:'lateral_bounds',name:'Lateral Bounds',muscle:'legs',type:'compound',eq:['bodyweight'],rMin:6,rMax:10,rest:120,cue:'Single-leg lateral jump, stick the landing on one foot, then bound back to other side. Focus on distance and landing control. Athletic power in frontal plane. Count per side.',tags:['plyometric','unilateral','lateral'],highSweat:true},
  {id:'single_leg_bounds',name:'Single-Leg Forward Bounds',muscle:'legs',type:'compound',eq:['bodyweight'],rMin:6,rMax:8,rest:150,cue:'Single-leg hop forward for distance, stick the landing, repeat on same leg. Focus on distance and landing mechanics. Builds unilateral power and stability. Count per leg.',tags:['plyometric','unilateral','power'],highSweat:true},
  {id:'bear_crawl',name:'Bear Crawl',muscle:'core',type:'compound',eq:['bodyweight'],rMin:20,rMax:40,rest:90,cue:'Hands and toes, knees hovering. Crawl forward moving opposite hand/foot together. Keep hips level, core tight. Great for shoulder stability and core strength. Count steps.',tags:['crawling','stability'],highSweat:true},
  {id:'turkish_getup_bw',name:'Turkish Get-up (Bodyweight)',muscle:'core',type:'compound',eq:['bodyweight'],rMin:3,rMax:6,rest:150,cue:'Complex movement from lying to standing. Focus on smooth transitions and stability at each position. Master the movement before adding weight. Ultimate full-body coordination exercise. Count per side.',tags:['complex','stability','coordination'],highSweat:true},
  {id:'archer_pushup',name:'Archer Push-ups',muscle:'chest',type:'compound',eq:['bodyweight'],rMin:4,rMax:8,rest:180,cue:'Wide hand position, shift weight to one arm during the push-up. Builds unilateral strength toward one-arm push-up. Control the eccentric phase. Count per side.',tags:['unilateral','advanced']},
  {id:'pistol_squat',name:'Pistol Squat',muscle:'legs',type:'compound',eq:['bodyweight'],rMin:3,rMax:6,rest:180,cue:'Single-leg squat to full depth, free leg extended forward. Builds unilateral strength, mobility, and balance. Use assistance if needed. Ultimate bodyweight squat progression. Count per leg.',tags:['unilateral','advanced','squat']},
  {id:'handstand_pushup',name:'Handstand Push-up',muscle:'shoulders',type:'compound',eq:['bodyweight'],rMin:3,rMax:8,rest:180,cue:'Inverted push-up against wall. Lower head to floor, press back up. Builds shoulder and core strength. Progress from pike push-ups. Advanced bodyweight movement. Count reps.',tags:['inverted','advanced']},
  {id:'l_sits',name:'L-Sit',muscle:'core',type:'isolation',eq:['bodyweight'],rMin:10,rMax:30,rest:120,isTimed:true,cue:'Sit with legs extended, hands flat, lift entire body off ground. Hold position with straight legs parallel to floor. Incredible core and shoulder strength builder. Count seconds.',tags:['isometric','advanced']},
  // Posture corrector: the anti-desk-hunch hold. Chest opens and shoulders
  // extend BACKWARD — the opposite direction of the whole workday — while the
  // posterior chain (glutes, hamstrings, rear delts, spinal erectors) works to
  // keep the hips lifted. Pairs naturally with the Desk Reversal primer and
  // the upper-back stretch pool as another angle on the same chronic stiffness.
  {id:'reverse_plank',name:'Reverse Plank',muscle:'core',type:'isolation',eq:['bodyweight'],rMin:20,rMax:45,rest:75,isTimed:true,cue:'Sit with legs extended, hands flat on the floor just behind your hips, fingers pointing toward your feet (or turned out slightly if the wrists complain). Press down through the hands to lift the hips until your body forms a straight line from heels to shoulders — chest open, head neutral, don\'t let the hips sag. Squeeze the glutes to hold. Regress with bent knees (tabletop reverse plank) if a straight-leg hold breaks form. Count seconds.',tags:['isometric','posture','glute']},
  {id:'broad_jump',name:'Broad Jump',muscle:'legs',type:'compound',eq:['bodyweight'],rMin:5,rMax:8,rest:150,cue:'Two-foot takeoff, jump forward for maximum distance, land softly on both feet. Focus on explosive hip extension and soft landing mechanics. Reset between reps. Count jumps.',tags:['plyometric','power','bilateral']},
  {id:'continuous_broad_jumps',name:'Continuous Broad Jumps',muscle:'legs',type:'compound',eq:['bodyweight'],rMin:5,rMax:8,rest:90,cue:'Two-foot takeoff into the next jump immediately on landing — minimal ground contact time. Reset only at the end of the set. Land soft and absorb before exploding into the next rep. Grass preferred. Count jumps.',tags:['plyometric','power','bilateral'],highSweat:true},
  {id:'skater_jumps',name:'Skater Jumps',muscle:'legs',type:'compound',eq:['bodyweight'],rMin:6,rMax:10,rest:90,cue:'Lateral bound from one foot to the other, like a speed skater. Land soft on the outside foot, hold briefly, then push off into the next bound. Count per side.',tags:['plyometric','unilateral','lateral'],highSweat:true},
  {id:'lateral_bound_broad_jump',name:'Lateral Bound into Broad Jump',muscle:'legs',type:'compound',eq:['bodyweight'],rMin:4,rMax:6,rest:120,cue:'Lateral bound to one side, stick the landing on one foot, then immediately broad jump forward off that foot for distance. Reset between combos. Count combos per side.',tags:['plyometric','unilateral','power'],highSweat:true},
  // ─── Bounce/reactive jump pool (vertical-jump work) ───
  // All tagged 'plyometric' — hidden while hip caution is on; the low-impact
  // bounce foundation (iso holds above) carries that work in the meantime.
  {id:'chair_jumps',name:'Chair Jumps',muscle:'legs',type:'compound',eq:['bodyweight'],rMin:4,rMax:8,rest:150,noWeight:true,cue:'Sit fully on a chair or bench, feet planted. From the dead-stop seated position — no rocking — explode straight up into a maximal jump. Sitting kills the stretch reflex, forcing pure starting strength from the hips and quads. Land soft, sit back down, fully reset each rep.',tags:['plyometric','power','quad'],highSweat:true},
  {id:'depth_jumps',name:'Depth Jumps',muscle:'legs',type:'compound',eq:['bodyweight'],rMin:3,rMax:6,rest:180,noWeight:true,cue:'Step (don\'t jump) off a knee-height box. The instant you touch down, explode straight up as high as possible — minimal ground time, like the floor is hot. THE classic reactive-strength builder, and among the most demanding: quality over volume, full rest between reps, stop the moment jump height drops.',tags:['plyometric','power'],highSweat:true},
  {id:'sl_depth_drop',name:'Single-Leg Depth Drop Jump',muscle:'legs',type:'compound',eq:['bodyweight'],rMin:3,rMax:5,rest:180,noWeight:true,cue:'Step off a LOW box (start ~6 in) and land on one leg, absorbing quietly with a stiff ankle — then immediately jump back up off that same leg. Single-leg reactive strength is what one-foot jumpers actually run on. Keep the box low until landings are silent. Count per side.',tags:['plyometric','unilateral','power'],highSweat:true},
  {id:'japap_jumps',name:'JAPAP Jumps',muscle:'legs',type:'compound',eq:['bodyweight'],rMin:4,rMax:6,rest:180,noWeight:true,cue:'Jump As high As Possible: full approach or standstill, gather, and put 100% intent into one maximal vertical jump. Walk it off, fully reset, and repeat. Nothing builds jump height like actually jumping at max intent while fresh — every rep is a genuine attempt at a personal best, never a rhythm rep.',tags:['plyometric','power'],highSweat:true},
  {id:'pogo_hops',name:'Pogo Hops',muscle:'legs',type:'isolation',eq:['bodyweight'],rMin:10,rMax:20,rest:120,noWeight:true,cue:'Legs nearly straight, hands on hips or reaching tall. Bounce off the floor using ONLY the ankles — knees barely bend — with the shortest ground contact you can manage, like a pogo stick. Height comes from ankle stiffness, not knee bend. The direct upgrade from Springy Calf Bounces once your feet leave the floor.',tags:['plyometric','calf','tendon'],highSweat:true},
  {id:'plate_hops',name:'Plate Hops',muscle:'legs',type:'isolation',eq:['bodyweight'],rMin:8,rMax:12,rest:120,noWeight:true,cue:'Stand in front of a bumper plate (or low step). Quick two-foot hops up onto the plate and back down, minimal ground contact both directions, stiff ankles. The tiny height keeps it about foot speed and reactivity, not power — crisp rhythm, quiet landings.',tags:['plyometric','calf','tendon'],highSweat:true},
  {id:'line_hops',name:'Line Hops',muscle:'legs',type:'isolation',eq:['bodyweight'],rMin:20,rMax:40,rest:90,noWeight:true,cue:'Feet together, hop side-to-side over a line (or front-to-back) as FAST as possible with the shortest ground contacts you can hit — count total touches. Ankles stay stiff, heels never settle. Foot quickness and ankle reactivity; also a great low-box drill for ground-contact rhythm.',tags:['plyometric','calf','tendon'],highSweat:true},
  {id:'lunge_hops',name:'Lunge Hops',muscle:'legs',type:'compound',eq:['bodyweight'],rMin:5,rMax:8,rest:150,noWeight:true,cue:'From the bottom of a lunge, explode straight up and switch legs mid-air, landing soft in a lunge on the other side — immediately into the next rep. Unilateral reactive power with a big hip-flexor stretch-shorten each switch. Count per side; stop when the switch gets sloppy.',tags:['plyometric','unilateral','power'],highSweat:true},
  {id:'u_hops',name:'U Hops',muscle:'legs',type:'compound',eq:['bodyweight'],rMin:6,rMax:10,rest:120,noWeight:true,cue:'Two-foot hops tracing a "U" shape — down one side, across the bottom, up the other side — then reverse. The constant direction change trains lateral ankle/knee stiffness and landing control in every plane. Quick contacts, quiet feet. One full U = one rep.',tags:['plyometric','lateral','tendon'],highSweat:true},
  {id:'sl_lunge_bounds',name:'Single-Leg Lunge Bounds',muscle:'legs',type:'compound',eq:['bodyweight'],rMin:4,rMax:6,rest:150,noWeight:true,cue:'From a lunge position, bound forward off the FRONT leg for distance, landing in a lunge with the same leg forward — walk back or reset between reps. Drives horizontal single-leg power out of a deep hip position, the pattern behind acceleration and one-foot takeoffs. Count per side.',tags:['plyometric','unilateral','power'],highSweat:true},
  {id:'atg_jump_squats',name:'ATG Jump Squats',muscle:'legs',type:'compound',eq:['bodyweight'],rMin:5,rMax:8,rest:150,noWeight:true,cue:'Sink to FULL depth — hamstrings to calves — under control, then explode straight up into a jump from the very bottom. Land soft, sink straight back to full depth, repeat. Builds explosive strength through the deepest knee range, where most jumpers leak power. Quality over height; stop when depth or landings degrade.',tags:['plyometric','quad','power'],highSweat:true},

  // Circuit Training Exercises
  {id:'burpee_to_jump',name:'Burpee to Jump Squat',muscle:'legs',type:'compound',eq:['bodyweight'],rMin:8,rMax:12,rest:60,cue:'Burpee down, jump feet in, explosive jump squat up with arms overhead. Land softly, immediately into next rep. High-intensity circuit finisher.',tags:['circuit','plyometric','conditioning'],highSweat:true,circuit:true},
  {id:'kb_swings_circuit',name:'KB/DB Swings',muscle:'legs',type:'compound',eq:['dumbbells'],rMin:15,rMax:20,rest:60,cue:'Hip hinge power movement. Drive hips forward explosively, weight rises to chest height. High-rep circuit style with continuous movement.',tags:['circuit','power','conditioning'],highSweat:true,circuit:true},
  {id:'thrusters',name:'DB Thrusters',muscle:'shoulders',type:'compound',eq:['dumbbells'],rMin:10,rMax:15,rest:60,cue:'Front squat into overhead press in one fluid motion. Shoulders, legs, and cardio all in one. Keep moving between reps.',tags:['circuit','conditioning','full-body'],highSweat:true,circuit:true},
  {id:'man_makers',name:'Man Makers',muscle:'chest',type:'compound',eq:['dumbbells'],rMin:6,rMax:10,rest:60,cue:'Push-up with DBs, row each arm, jump feet in, thruster up. Full-body circuit exercise. Rest briefly between reps but keep moving.',tags:['circuit','conditioning','full-body'],highSweat:true,circuit:true},
  {id:'battle_ropes',name:'Battle Ropes (Alternating)',muscle:'core',type:'compound',eq:['bodyweight'],rMin:30,rMax:60,rest:60,isTimed:true,cue:'Alternating arm waves. Keep core tight, generate power from shoulders. High-intensity interval exercise. Count seconds.',tags:['circuit','conditioning','cardio'],highSweat:true,circuit:true},
];

function currentVO2Protocol(){
  const lvl=vo2History().length;
  const proto=VO2_PROTOCOLS[Math.floor(lvl/2)%VO2_PROTOCOLS.length];
  const work=Math.min(proto.base+Math.floor(lvl/4),proto.maxW);
  return{...proto,work,desc:proto.desc(work),mins:proto.mins(work),lvl};
}

// Per-field change stamps for the singleton state (cfg/program/weekPlan/...).
// The cloud merge used to compare ONE global updatedAt — so any unrelated save
// on phone B (a sleep log, a completed set) made B "newer" and blocked it from
// adopting phone A's week edit, then pushed B's stale program back over it.
// Content-hash detection here is centralized: no save() call site has to
// declare what it changed; a field's stamp only moves when its JSON actually
// differs from the previous save.
let _singletonSnaps={};
const SINGLETON_FIELDS=['cfg','program','weekPlan','eveningMins','eveningLocation'];
function stampSingletons(){
  S.fieldUpdated=S.fieldUpdated||{};
  const now=new Date().toISOString();
  SINGLETON_FIELDS.forEach(k=>{
    const j=JSON.stringify(S[k]??null);
    if(_singletonSnaps[k]===undefined){
      // First save since page load: baseline the snapshot without bumping —
      // the field carries whatever stamp it had (or inherits legacy updatedAt).
      _singletonSnaps[k]=j;
      if(!S.fieldUpdated[k])S.fieldUpdated[k]=S.updatedAt||now;
    }else if(j!==_singletonSnaps[k]){
      _singletonSnaps[k]=j;S.fieldUpdated[k]=now;
    }
  });
}
function save(){
  S.updatedAt=new Date().toISOString();
  stampSingletons();
  try{localStorage.setItem('wp3',JSON.stringify({cfg:S.cfg,program:S.program,logs:S.logs.slice(-10),active:S.active,weekPlan:S.weekPlan,lastWeights:S.lastWeights,sleepLog:S.sleepLog||{},eveningMins:S.eveningMins,eveningLocation:S.eveningLocation,customExercises:S.customExercises,deletedSessions:(S.deletedSessions||[]).slice(-20),updatedAt:S.updatedAt,fieldUpdated:S.fieldUpdated}));}catch(e){}
  saveToCloud();
}

      // migrate skipDays → availability

// Leg programming is restricted to an explosive + tendon-stiffness emphasis:
// a leg movement is only AUTO-selectable (by templates or backfill) if it
// carries one of these tags. Everything else in the leg pool — back squats,
// RDLs, leg press, machine curls, plain calf raises, glute isolation — is pure
// hypertrophy/strength and is excluded from auto-generation everywhere (it
// stays in the EX database for manual/custom logging). Using an allowlist
// rather than naming each retired lift means any leg exercise added later is
// excluded by default unless explicitly tagged for the emphasis.
// 'plyometric' is allowed here (it's explosive) but still filtered separately
// by hip-caution, so it only surfaces for users without the hip flag.
const LEG_EMPHASIS_TAGS=['power','isometric','tendon','eccentric','plyometric','strength','decel','lateral'];
const legAutoOK=(e)=>e.muscle!=='legs'||LEG_EMPHASIS_TAGS.some(t=>(e.tags||[]).includes(t));

// Knee-Caution mode (mirrors hipCaution): when active, ALL leg work is
// restricted to this small dumbbell-only, knee-friendly whitelist — an
// absolute allowlist rather than a tag filter, since it's meant to override
// the explosive/tendon emphasis gate entirely, not layer on top of it.
const KNEE_SAFE_IDS=new Set(['goblet','rdl','db_rdl','reverse_lunge','sumo_squat','bstance_hip_thrust','tib_raise']);
// Manual swap/suggestion lists don't have a slot.tag to reason about (unlike
// pickEx's per-slot gate above) — Knee-Caution there is a flat allow-list
// check: exclude any leg exercise outside the knee-safe set.
const kneeCautionBlocks=(e)=>S.cfg.kneeCaution&&e.muscle==='legs'&&!KNEE_SAFE_IDS.has(e.id);
// Personal exercise exclusions — movements that flare a specific issue
// regardless of the broader hip/knee/shoulder caution flags (e.g. Push Press
// on the lower back). A flat id blacklist, not a tag rule, since these are
// one-off "this specific movement doesn't work for me" reports.
const userAvoids=(e)=>(S.cfg.avoidExercises||[]).includes(e.id);

// Dragon Flag progression track: Tier 1 (Lying Leg Lifts) is always offered;
// Tier 2/3 unlock only after logging 10+ reps in a single set on the tier
// directly before it — an automatic gate rather than a manual "mark achieved"
// button, read straight from the workout log.
const DRAGON_FLAG_TRACK=['leg_lifts_lying','dragon_flag_bent','dragon_flag_full'];
const hasLoggedRepsOf=(exId,minReps)=>(S.logs||[]).some(l=>!l.isCardio&&(l.exercises||[]).some(e=>e.id===exId&&(e.sets||[]).some(s=>s&&s.reps>=minReps)));
function dragonFlagUnlocked(exId){
  const idx=DRAGON_FLAG_TRACK.indexOf(exId);
  if(idx<=0) return true; // tier 1, or not part of the track
  return hasLoggedRepsOf(DRAGON_FLAG_TRACK[idx-1],10);
}

function pickEx(slot,equip,used,isLunch,budget,freq){
  const eq=new Set([...equip,'bodyweight']);
  const overworkedMuscles = getOverworkedMuscles();
  const isCircuitStyle = S.weekPlan?.cardioStyle === 'circuits';

  // Combine built-in exercises with custom exercises
  const allExercises = [...EX, ...(S.customExercises||[])];

  // MRV headroom: would adding this exercise push the muscle past its weekly max?
  const perEx = (budget && budget.perExercise) || 3;
  const fitsMRV = (e) => {
    if(!budget || !budget.limits || !budget.limits[e.muscle]) return true;
    return (budget.vol[e.muscle] || 0) + perEx <= budget.limits[e.muscle].max;
  };

  // Rolling-week movement frequency (seeded from the past 7 days of history plus
  // whatever this generation run has already assigned). Used to (a) cap how often
  // a single movement repeats in the microcycle and (b) spread variety across
  // days instead of deterministically returning the first match every time.
  const f = freq || {};
  const FREQ_CAP = 2; // max appearances of one movement per rolling 7-day window
  const freqOf = (e) => f[e.id] || 0;

  // Shared slot constraints (muscle/type/tag/equipment/hip-caution/lunch sweat).
  // Hip-caution mode also bans plyometrics (impact loading on a sensitive hip)
  // — that volume is redistributed to the remaining non-impact pool, which
  // includes eccentric tendon work like the Nordic curl.
  // Leg-exercise gate: Knee-Caution mode (when on) is an absolute whitelist
  // that overrides everything else for legs — it exists to hand-pick a small
  // knee-safe set, not to layer on top of the explosive/tendon emphasis gate.
  // Otherwise legAutoOK's emphasis-tag restriction applies as normal, except
  // for the hamstring mandate's 'hinge'/'hamstring' slots (see legAutoOK),
  // which guarantee RDL/hip-hinge and leg-curl-family work regardless.
  const legGateOK = (e) => {
    if(e.muscle!=='legs') return true;
    if(S.cfg.kneeCaution) return KNEE_SAFE_IDS.has(e.id);
    return slot.tag==='hinge'||slot.tag==='hamstring'||legAutoOK(e);
  };
  const base = (e) =>
    e.muscle===slot.muscle && e.type===slot.type &&
    (!slot.tag || ((e.tags||[]).includes(slot.tag))) &&
    !used.includes(e.id) &&
    e.eq.some(q=>eq.has(q)) &&
    legGateOK(e) &&
    !(S.cfg.hipCaution && e.hipRisk) &&
    !(S.cfg.hipCaution && (e.tags||[]).includes('plyometric')) &&
    !userAvoids(e) &&
    dragonFlagUnlocked(e.id) &&
    !(isLunch && e.highSweat);

  // Among the candidates, take the LEAST-used movement (lowest weekly frequency),
  // breaking ties by EX array order — so a slot that recurs across days rotates
  // through the available movements instead of repeating barbell bench every time.
  const leastUsed = (list) => list.length
    ? list.reduce((best,e)=> freqOf(e) < freqOf(best) ? e : best)
    : null;

  // For circuit training, prefer circuit-tagged exercises (still within MRV + cap)
  if(isCircuitStyle && !isLunch) {
    const circuitEx = leastUsed(allExercises.filter(e => base(e) && !overworkedMuscles.has(e.muscle) && fitsMRV(e) && freqOf(e)<FREQ_CAP && e.circuit));
    if(circuitEx) return circuitEx;
  }

  // Hybrid-athlete soft preference (goal: look like a bodybuilder, move like an
  // athlete): a powerPreferred slot tries explosive/ballistic variants first
  // (med ball slam, rotational throw, ...) and falls through to the normal
  // tiers below when none fit the equipment/caps — a bias, never a constraint.
  if(slot.powerPreferred && !isLunch) {
    const powerEx = leastUsed(allExercises.filter(e => base(e) && (e.tags||[]).includes('power') && !overworkedMuscles.has(e.muscle) && fitsMRV(e) && freqOf(e)<FREQ_CAP));
    if(powerEx) return powerEx;
  }

  // 1) Best: avoid overworked muscles, stay within MRV max, under the frequency cap
  let exercise = leastUsed(allExercises.filter(e => base(e) && !overworkedMuscles.has(e.muscle) && fitsMRV(e) && freqOf(e)<FREQ_CAP));
  // 2) Next: within MRV max + under cap (allow a recently-worked muscle if needed)
  if(!exercise) exercise = leastUsed(allExercises.filter(e => base(e) && fitsMRV(e) && freqOf(e)<FREQ_CAP));
  // 3) Cap relaxed: a constrained equipment pool may have no alternative left
  // under the cap — better to repeat a movement than to drop the slot entirely.
  if(!exercise) exercise = leastUsed(allExercises.filter(e => base(e) && fitsMRV(e)));
  // 4) Mandate override: 'hinge' and 'hamstring' slots exist specifically so a
  // leg session never trains quads/squats without also hitting the hamstrings
  // (squat patterns alone don't train them). Stacking two dedicated leg slots
  // in one session can burn through that muscle's weekly MRV headroom before
  // reaching this one — dropping it here would silently defeat the mandate via
  // the untagged backfill pass. A small, deliberate MRV overage on this single
  // corrective-pattern slot beats skipping hamstring/hinge work outright.
  if(!exercise && (slot.tag==='hinge'||slot.tag==='hamstring'||slot.tag==='strength')) exercise = leastUsed(allExercises.filter(e => base(e)));
  // Strength-tier fallback: the heavy 1–5 pool is barbell/DB — a bodyweight-only
  // session has zero candidates, and dropping the day's main leg slot would be
  // worse than downgrading it. Fall back to the old 'hinge' mandate pool.
  if(!exercise && slot.tag==='strength'){
    const hingeSlot={...slot,tag:'hinge'};
    const hingeBase=(e)=>e.muscle===hingeSlot.muscle && e.type===hingeSlot.type && (e.tags||[]).includes('hinge') &&
      !used.includes(e.id) && e.eq.some(q=>eq.has(q)) && !(S.cfg.hipCaution&&e.hipRisk) &&
      !(S.cfg.hipCaution&&(e.tags||[]).includes('plyometric')) && !userAvoids(e) && !(isLunch&&e.highSweat) &&
      !(S.cfg.kneeCaution&&!KNEE_SAFE_IDS.has(e.id));
    exercise = leastUsed(allExercises.filter(e=>hingeBase(e)&&fitsMRV(e)&&freqOf(e)<FREQ_CAP)) || leastUsed(allExercises.filter(hingeBase));
  }
  // 5) Core-emphasis fallback: the rotating produce/resist tag on the forced
  // core slot is a preference, never worth dropping the slot over — retry with
  // the tag AND type relaxed (flexion work is type 'isolation', the rest
  // 'rotational') so some core work always lands.
  if(!exercise && slot.muscle==='core' && slot.tag){
    const anyCore=(e)=>e.muscle==='core' && !used.includes(e.id) && e.eq.some(q=>eq.has(q)) &&
      !(S.cfg.hipCaution&&e.hipRisk) && !(S.cfg.hipCaution&&(e.tags||[]).includes('plyometric')) &&
      !userAvoids(e) && dragonFlagUnlocked(e.id) && !(isLunch&&e.highSweat);
    exercise = leastUsed(allExercises.filter(e=>anyCore(e)&&fitsMRV(e)&&freqOf(e)<FREQ_CAP)) || leastUsed(allExercises.filter(anyCore));
  }
  // If the muscle has hit its weekly MRV max, intentionally return null so this
  // slot is dropped (fewer sets) rather than exceeding the recoverable volume.
  return exercise||null;
}

// Backfill a freed session slot (dropped via lockout/MRV-max, or a template
// shorter than the time-based exercise limit) with a movement for whichever
// OTHER muscle has the most headroom below its weekly MRV max — so session
// time isn't wasted while useful volume still fits. Ranks muscles by deficit
// (max - committed), then tries compound/isolation/rotational for the most
// under-volumed muscle before moving to the next.
function pickBackfillEx(equip,used,isLunch,budget,exFreq,excludeMuscles){
  const limits=(budget&&budget.limits)||{};
  const perEx=(budget&&budget.perExercise)||3;
  const candidates=Object.keys(limits)
    .filter(m=>!(excludeMuscles&&excludeMuscles.has(m)))
    .map(m=>({m,deficit:limits[m].max-(budget.vol[m]||0)}))
    .filter(c=>c.deficit>=perEx)
    .sort((a,b)=>b.deficit-a.deficit);
  for(const {m} of candidates){
    for(const type of ['compound','isolation','rotational']){
      const e=pickEx({muscle:m,type},equip,used,isLunch,budget,exFreq);
      if(e)return e;
    }
  }
  return null;
}

// Order a freshly built session and flag its warm-up target. Compounds are
// moved to the front (stable, preserving order within each group) so the heavy
// work is done fresh — equipment filtering (e.g. a hotel gym with no barbell/
// cables) could otherwise leave isolations leading the list. The warm-up box
// keys off `isFirst`: assign it to the first compound, or — when a session has
// no compound — the first LOADED movement (bodyweight/timed-only sessions get
// none, since weight-acclimation warm-ups don't apply). Mutates exs in place.
function flagFirstWorkingSet(exs){
  // A movement supports graded warm-up sets only if it can be externally loaded.
  // Bodyweight-only moves (noWeight, or bodyweight as the only equipment) and
  // timed isometric holds can't be scaled down for a warm-up, so they must not
  // lead the session — the first/warm-up slot needs a loadable exercise.
  // Med balls are excluded too: they're loaded but come in fixed ~5 lb jumps,
  // so "50% / 75% / 90%" acclimation percentages are meaningless for them.
  const scalable=e=>!e.noWeight&&!e.isTimed&&(e.eq||[]).some(q=>q!=='bodyweight'&&q!=='medball'&&q!=='medball_wall');
  const compounds=exs.filter(e=>e.type==='compound');
  const rest=exs.filter(e=>e.type!=='compound');
  let ordered=[...compounds,...rest];
  // Pull a loadable movement to the front (prefer a loadable compound) so the
  // warm-up can ramp; only fall back to a bodyweight lead if nothing is loadable.
  const lead=ordered.find(e=>e.type==='compound'&&scalable(e))||ordered.find(e=>scalable(e));
  if(lead)ordered=[lead,...ordered.filter(e=>e!==lead)];
  exs.length=0;exs.push(...ordered);
  exs.forEach(e=>{delete e.isFirst;});
  const target=lead||exs.find(e=>e.type==='compound')||exs[0];
  if(target)target.isFirst=true;
}

function genProgram(cfg,av,workoutHistoryLog){
  av=av||(S.weekPlan?.availability)||defaultAvailability();

  // The historical workout log is a REQUIRED input for reconfiguration. Reset
  // clears only the forward-looking schedule (S.program) — it never purges the
  // logs — so the generator can read what was actually trained recently. Treated
  // as immutable here: we only read from it.
  const history = workoutHistoryLog || S.logs || [];
  // Lookback constraint: tally how many times each movement was logged in the
  // past 7 days. pickEx blocks any movement that has hit its frequency cap and
  // substitutes an alternative; the same map keeps accumulating as this run
  // assigns movements, so a slot won't repeat the same lift across days.
  const freqStart = addDays(todayStr(), -7);
  const exFreq = {};
  history.forEach(l=>{
    if(l.isCardio || logDay(l.date) < freqStart) return;
    (l.exercises||[]).forEach(e=>{ if(e&&e.id) exFreq[e.id]=(exFreq[e.id]||0)+1; });
  });

  // Collect lunch slots and available evening slots separately
  const lunchSlots=[];const eveSlots=[];
  [1,2,3,4,5].forEach(dow=>{
    const d=av[dow]||{};
    if(d.lunch!==false)lunchSlots.push({dow,isLunch:true,mins:40,loc:'ymca',key:`${dow}-lunch`,equipmentKey:d.lunchEquipment||'ymca'});
    if(d.eve?.on)eveSlots.push({dow,isLunch:false,mins:d.eve.mins||60,loc:d.eve.loc||'ymca',key:`${dow}-eve`,equipmentKey:d.eve.equipment||'ymca'});
  });
  [6,0].forEach(dow=>{
    const d=av[dow]||{};
    if(d.on)eveSlots.push({dow,isLunch:false,mins:d.mins||60,loc:d.loc||'ymca',key:`${dow}-wknd`,equipmentKey:d.equipment||'ymca'});
  });
  if(!lunchSlots.length&&!eveSlots.length){
    const ps=S.cfg?.planStartDow??1;
    [1,2,3,4,5].filter(d=>ps!==0&&d>=ps).forEach(dow=>lunchSlots.push({dow,isLunch:true,mins:40,loc:'ymca',key:`${dow}-lunch`,equipmentKey:'ymca'}));
  }

  // No fixed split or week-ahead template cycle: every available day is planned
  // on demand from recovery debt (see dayTemplate). lunchDows lets evening slots
  // know which days already train at lunch.
  const lunchDows=new Set(lunchSlots.map(s=>s.dow));

  // Completed sessions this calendar week — preserve their templates
  const mon=thisMonday();
  const weekEnd=addDays(mon,7);
  // Local-day bucketing (also fixes the former `l.date+'T12:00:00'` parse,
  // which produced Invalid Date on full ISO timestamps → NaN dows)
  const completedDows=new Set(
    (S.logs||[]).filter(l=>!l.isCardio&&logDay(l.date)>=mon&&logDay(l.date)<weekEnd)
      .map(l=>new Date(l.date).getDay())
  );
  const oldWeek=S.program?.week;

  // MRV budget: start from sets already committed this week (logged + planned
  // custom workouts) and consume headroom as we assign sessions, so the week
  // fills toward optimal without exceeding each muscle's recoverable max.
  const budget = { vol: getCommittedVolumes(), limits: getMRVLimits(), perExercise: 3 };

  // Calendar date (YYYY-MM-DD) for a program-week dow, for the fatigue matrix's
  // day-by-day lockout lookback. dow 1-5 = Mon-Fri, 6 = Sat, 0 = next Sun.
  const dateForDow=(dow)=>dow===0?addDays(mon,6):dow===6?addDays(mon,5):addDays(mon,dow-1);
  // Muscles trained per date, accumulated as sessions are assigned this run —
  // lets getLockedMuscles see "preceding" days within the same generation pass.
  const assignedMuscles={};

  // The actual logged session for a slot's date AND session type (lunch vs
  // evening) this week, if any — the source of truth for a completed day.
  const loggedFor=(slot)=>(S.logs||[]).find(l=>!l.isCardio&&logDay(l.date)===dateForDow(slot.dow)&&(!!l.isLunch)===(!!slot.isLunch));

  // Plan a single day on demand from recovery debt: the muscle groups that are
  // most overdue AND adequately rested (past their MUSCLE_LOCKOUT_HOURS window),
  // assembled into that day's session. No fixed split — a group recurs as soon
  // as it's rested, and the day is named for whatever it actually trains.
  // Returns {name,desc,slots,tk} or null when nothing is recovered → rest day.
  function dayTemplate(dateStr,limit,isLunch){
    const MUSCLES=['legs','back','chest','shoulders','biceps','triceps'];
    // Most recent training date per muscle (logs + sessions already assigned
    // earlier this run), on or before dateStr.
    const lastDate={};
    const consider=(d,muscles)=>{if(!d||d>dateStr)return;muscles.forEach(m=>{if(m&&(!lastDate[m]||d>lastDate[m]))lastDate[m]=d;});};
    (history||[]).forEach(l=>{if(l.isCardio)return;consider(logDay(l.date),(l.exercises||[]).map(e=>e&&e.muscle));});
    Object.entries(assignedMuscles).forEach(([d,set])=>consider(d,[...set]));
    const rows=MUSCLES.map(m=>{
      const ld=lastDate[m];
      const hrs=ld?hoursBetweenDates(ld,dateStr):9999; // never trained → max debt
      const max=budget.limits[m]?.max??20;
      const min=budget.limits[m]?.min??8;
      const vol=budget.vol[m]||0;
      // under = still below the week's optimal range ("yellow" on the dashboard
      // volume bars). Yellow muscles outrank green ones when picking a day.
      return{m,hrs,rested:hrs>=(MUSCLE_LOCKOUT_HOURS[m]||48),headroom:max-vol,under:vol<min};
    });
    // Eligible = rested with weekly MRV headroom. Priority: under-range
    // ("yellow") muscles first — get every group to its weekly minimum before
    // adding more work for in-range ("green") ones — then most-overdue within
    // each tier. The rested filter deliberately trumps yellow priority: a
    // yellow muscle still inside its >24h lockout would need back-to-back
    // days to chase its range, so the day trains green muscles instead and
    // the yellow one resumes as soon as it's recovered. Muscles over range
    // ("red") have no headroom and are never intentionally prescribed. If
    // headroom rules everything out, fall back to rested-only.
    const byDebt=(a,b)=>(b.under?1:0)-(a.under?1:0)||b.hrs-a.hrs||MUSCLES.indexOf(a.m)-MUSCLES.indexOf(b.m);
    let elig=rows.filter(r=>r.rested&&r.headroom>=2).sort(byDebt);
    if(!elig.length)elig=rows.filter(r=>r.rested).sort(byDebt);
    if(!elig.length)return null; // nothing adequately rested → rest/recovery day
    const muscleSlots=Math.max(1,limit-1); // reserve a slot for core
    // Light natural-pairing nudge: the anchor is the most-overdue rested muscle;
    // fill the rest of the day preferring muscles from the same natural group
    // (push: chest/shoulders/triceps · pull: back/biceps · legs), but let a
    // clearly-more-overdue muscle from another group still win. NOT a fixed
    // split — which group anchors a day is decided by recovery debt each day.
    const GROUP={chest:'push',shoulders:'push',triceps:'push',back:'pull',biceps:'pull',legs:'legs'};
    const PAIR_BONUS=36; // hours of virtual debt for sharing the anchor's group
    const anchor=elig[0];
    const ag=GROUP[anchor.m];
    // Pairing bonus applies WITHIN a volume tier — an in-range (green) muscle
    // sharing the anchor's group never jumps ahead of an under-range (yellow) one.
    const rest2=elig.slice(1).map(r=>({r,score:r.hrs+(GROUP[r.m]===ag?PAIR_BONUS:0)})).sort((a,b)=>(b.r.under?1:0)-(a.r.under?1:0)||b.score-a.score).map(o=>o.r);
    const top=[anchor,...rest2].slice(0,Math.min(3,elig.length));
    const slots=[];
    for(let i=0;i<muscleSlots;i++)slots.push({muscle:top[i%top.length].m,type:i<top.length?'compound':'isolation'});
    // Leg mandates. Evenings: the first leg slot is tagged 'strength' — the
    // heavy 1–5 rep @ 85–95% tier (box squat / trap bar / heavy RDL / heavy
    // split squat), which leastUsed rotates so squat, hinge, and single-leg
    // patterns all cycle through. Hinge coverage is preserved by construction:
    // half that pool IS a hinge, and the second leg slot keeps the 'hamstring'
    // mandate (leg-curl family) so knee flexion never gets skipped.
    // Lunch keeps the old 'hinge' mandate — heavy near-max work needs 3–4 min
    // rests, which the lunch 90s rest cap and 40-min time-box can't hold.
    const legSlotIdx=slots.map((s,i)=>s.muscle==='legs'?i:-1).filter(i=>i>=0);
    if(legSlotIdx.length){
      slots[legSlotIdx[0]].tag=isLunch?'hinge':'strength';
      if(legSlotIdx.length>1)slots[legSlotIdx[1]].tag='hamstring';
    }
    // Upper-back mandate: vertical pulling (lat pulldown/pull-ups) trains the
    // lats but leaves the rhomboids/mid-traps/rear delts to chance — the same
    // gap the hamstring mandate closes for legs. Any day that trains back gets
    // its first back slot tagged 'horizontal' (row family — direct upper-back
    // work, still a compound slot) and, when the day has room for a second
    // back slot, tags it 'rear_delt' (face pulls/reverse-fly family) so
    // scapular/rear-delt health is covered directly rather than left to chance.
    // Safe by construction: a muscle's first appearance in `slots` always
    // falls in the first pass (i<top.length → 'compound'), and any repeat
    // appearance always falls in a later pass (→ 'isolation') — matching the
    // 'horizontal'/'rear_delt' tags' own compound/isolation split in EX.
    const backSlotIdx=slots.map((s,i)=>s.muscle==='back'?i:-1).filter(i=>i>=0);
    if(backSlotIdx.length){
      slots[backSlotIdx[0]].tag='horizontal';
      if(backSlotIdx.length>1)slots[backSlotIdx[1]].tag='rear_delt';
    }
    // Hybrid-athlete accent (goal: look like a bodybuilder, MOVE like an
    // athlete): evening sessions convert ONE isolation fill slot of a
    // power-capable muscle into an explosive 'power' compound (push press,
    // med-ball throws, plyo push-up, ballistic leg work). Deliberately the
    // ISOLATION slot, never a main compound — the heavy hypertrophy lift
    // stays untouched (that's the "look jacked" half), and one accessory
    // trades for athletic power expression (the "move like an athlete" half).
    // Lunch sessions skip this: too short, and the throw/plyo pool is
    // highSweat anyway. 45-min evenings (2 muscle slots, no isolation fill)
    // also skip naturally — short sessions keep every heavy compound.
    let accented=false;
    const domDay=parseInt(dateStr.slice(8,10),10)||0; // day-of-month, drives emphasis rotations
    if(!isLunch){
      const POWER_CAPABLE=new Set(['legs','chest','shoulders']);
      // Leg accents rotate produce → absorb: 'power' (explosive concentric),
      // 'eccentric' (slow heavy lowering), 'decel' (stick/braking work) — so
      // multi-directional force ABSORPTION gets programmed, not just output.
      const LEG_ACCENTS=['power','eccentric','decel'];
      for(let i=slots.length-1;i>=0;i--){
        const s=slots[i];
        if(s.type==='isolation'&&!s.tag&&POWER_CAPABLE.has(s.muscle)){
          s.type='compound';
          s.tag=s.muscle==='legs'?LEG_ACCENTS[domDay%LEG_ACCENTS.length]:'power';
          accented=true;break;
        }
      }
    }
    // No convertible slot (isolation fill was mandate-tagged or a non-power
    // muscle)? Fall back to biasing the core slot toward explosive work —
    // powerPreferred is a SOFT preference in pickEx (med ball slam/rotational
    // throw first, normal core picks when unavailable), so gyms without med
    // balls degrade gracefully instead of dropping the core slot.
    // Core slot cycles through produce/resist emphases by date so the week
    // covers rotating, resisting rotation, flexing, and resisting extension /
    // lateral flexion — rather than leaving the mix to leastUsed chance.
    // Flexion work lives in the type:'isolation' core pool; the rest are
    // type:'rotational'. pickEx has a strip-the-tag fallback so a thin
    // equipment pool degrades to "any core work" instead of dropping the slot.
    const CORE_CYCLE=[
      {type:'rotational',tag:'anti-rotation'},
      {type:'rotational',tag:'rotation'},
      {type:'isolation',tag:'flexion'},
      {type:'rotational',tag:'anti-extension'},
      {type:'rotational',tag:'lateral'},
    ];
    const coreEmph=CORE_CYCLE[domDay%CORE_CYCLE.length];
    slots.push({muscle:'core',type:coreEmph.type,tag:coreEmph.tag,powerPreferred:!isLunch&&!accented});
    const names=top.map(t=>MNAME[t.m]||t.m);
    return{name:names.join(' · '),desc:'Recovery-based · '+names.join(', '),slots,tk:'rb:'+top.map(t=>t.m).slice().sort().join('-')};
  }

  function buildSession(slot,tk,oldData){
    // Use per-session equipment from availability
    const equipmentKey=slot.equipmentKey||'ymca';
    const selectedPreset=EQUIPMENT_PRESETS[equipmentKey]||EQUIPMENT_PRESETS.ymca;
    const equip=selectedPreset.equipment;
    const dateStr=dateForDow(slot.dow);
    // A completed day is locked to what was ACTUALLY logged — the source of
    // truth — so regenerating/resetting can never reassign or relabel it, and
    // the rest of the week generates around what was really trained (its muscles
    // feed the lockout + recovery ordering via the history seed below).
    const completedLog=loggedFor(slot);
    if(completedLog){
      (assignedMuscles[dateStr]=assignedMuscles[dateStr]||new Set());
      (completedLog.exercises||[]).forEach(e=>{if(e&&e.muscle)assignedMuscles[dateStr].add(e.muscle);});
      const allEx=[...EX,...(S.customExercises||[])];
      const exs=(completedLog.exercises||[]).map(e=>{
        const full=allEx.find(x=>x.id===e.id);
        const done=(e.sets||[]).filter(s=>s&&s.reps>0).length;
        return full?{...full,sets:done||3}:{id:e.id,name:e.name,muscle:e.muscle,type:'isolation',rMin:8,rMax:12,sets:done||3};
      });
      return{tk,name:completedLog.dayName,desc:`Completed · ${completedLog.exercises.length} exercise${completedLog.exercises.length!==1?'s':''} logged`,isLunch:!!completedLog.isLunch,exercises:exs,mins:slot.mins,loc:slot.loc,preserved:true,completed:true};
    }
    const limit=slot.isLunch?3:(EX_LIMIT[slot.mins]||5);
    // Plan this day on demand from recovery debt (most-overdue rested muscles).
    const tmpl=dayTemplate(dateStr,limit,slot.isLunch);
    if(!tmpl)return null; // nothing adequately rested → this day stays a rest day
    if(oldData===undefined)oldData=oldWeek?.[slot.dow];
    // Preserve existing exercises if already completed this week, OR the same
    // recovery template would be rebuilt at the same location (avoids churn).
    if(oldData&&!oldData.rest&&(completedDows.has(slot.dow)||(oldData.tk===tmpl.tk&&oldData.loc===slot.loc))){
      const od=oldData;
      // Count a preserved upcoming session toward the budget AND the movement
      // frequency map (completed days are already in the history seed; custom/
      // planned days are already counted via getCommittedVolumes).
      if(!completedDows.has(slot.dow) && !od.customWorkout && !od.plannedCustomWorkout){
        (od.exercises||[]).forEach(e=>{
          if(e&&e.muscle) budget.vol[e.muscle]=(budget.vol[e.muscle]||0)+(e.sets||3);
          if(e&&e.id) exFreq[e.id]=(exFreq[e.id]||0)+1;
        });
      }
      // Record which muscles land on this date so the fatigue matrix can see
      // this preserved session as "preceding" when evaluating later days.
      (assignedMuscles[dateStr]=assignedMuscles[dateStr]||new Set());
      (od.exercises||[]).forEach(e=>{if(e&&e.muscle)assignedMuscles[dateStr].add(e.muscle);});
      return{tk:od.tk,name:od.name,desc:od.desc,isLunch:slot.isLunch,exercises:od.exercises,mins:slot.mins,loc:slot.loc,equipmentKey,preserved:true};
    }
    const used=[];
    const isCircuitStyle = S.weekPlan?.cardioStyle === 'circuits';

    // Muscle group fatigue matrix: pin the MRV ceiling for any muscle still
    // inside its recovery-lockout window (relative to dateStr) to its current
    // committed volume, so pickEx drops new sets for it this session — same
    // "fewer sets" path as a muscle that's already at its weekly MRV max.
    const lockedMuscles=getLockedMuscles(dateStr,history,assignedMuscles);
    const lockedLimits={};
    lockedMuscles.forEach(m=>{
      if(budget.limits[m]){lockedLimits[m]=budget.limits[m];budget.limits[m]={min:budget.limits[m].min,max:budget.vol[m]||0};}
    });

    const exs=tmpl.slots.slice(0,limit).map(sl=>{
      const e=pickEx(sl,equip,used,slot.isLunch,budget,exFreq);
      if(!e) return null;
      used.push(e.id);
      // Record this assignment so later days/sessions in the same run see it and
      // rotate to a different movement once the cap is reached.
      exFreq[e.id]=(exFreq[e.id]||0)+1;

      // Modify exercise for circuit training
      let modifiedEx = {...e, sets:3, sessionMins:slot.mins};
      if(isCircuitStyle && !slot.isLunch) { // Apply circuit modifications to evening sessions only
        modifiedEx.rest = Math.max(60, e.rest ? e.rest / 2 : 60); // Shorter rest periods
        modifiedEx.sets = e.circuit ? 4 : 3; // Extra set for circuit exercises
        if(e.circuit) modifiedEx.circuitStyle = true;
      }

      // Consume MRV headroom for this muscle
      budget.vol[e.muscle] = (budget.vol[e.muscle] || 0) + modifiedEx.sets;

      return modifiedEx;
    }).filter(Boolean);

    // Backfill freed slots (dropped via lockout/MRV-max, or a template shorter
    // than the time-based limit) with movements for under-volumed muscles —
    // keep adding sets as long as a muscle has headroom below its weekly MRV
    // max AND the session still has room under its time-based exercise limit.
    while(exs.length<limit){
      const e=pickBackfillEx(equip,used,slot.isLunch,budget,exFreq,lockedMuscles);
      if(!e)break;
      used.push(e.id);
      exFreq[e.id]=(exFreq[e.id]||0)+1;
      let modifiedEx={...e,sets:3,sessionMins:slot.mins};
      if(isCircuitStyle && !slot.isLunch){
        modifiedEx.rest=Math.max(60, e.rest ? e.rest/2 : 60);
        modifiedEx.sets=e.circuit?4:3;
        if(e.circuit)modifiedEx.circuitStyle=true;
      }
      budget.vol[e.muscle]=(budget.vol[e.muscle]||0)+modifiedEx.sets;
      exs.push(modifiedEx);
    }

    // Restore the real weekly ceilings — the lockout only applied to today's pick.
    Object.entries(lockedLimits).forEach(([m,lim])=>{budget.limits[m]=lim;});

    flagFirstWorkingSet(exs); // compounds first; warm-up flag on first loaded lift

    // Lunch time-box calibration (2026-07-14, user report: lunch plans ran
    // ~7 min long). The lead lift keeps 3 working sets; every exercise after
    // it drops to 2 (~4.5 min back), and the lunch warm-up ramp is cut to
    // 2 sets in warmupHTML (~2.5 min back). The shaved sets are returned to
    // the muscle's weekly MRV budget so other sessions can use the headroom.
    if(slot.isLunch){
      exs.forEach((e,i)=>{
        if(i>0&&e.sets>2){budget.vol[e.muscle]=(budget.vol[e.muscle]||0)-(e.sets-2);e.sets=2;}
      });
    }

    // Adjust session name for circuit training
    let sessionName = isCircuitStyle && !slot.isLunch ? tmpl.name.replace('Day', 'Circuit') : tmpl.name;
    let sessionDesc = tmpl.desc;
    // If the template's target muscles were ALL dropped (locked for recovery or
    // at their weekly MRV max) and the slots got backfilled with other muscles,
    // the template name no longer describes the session. Relabel from the actual
    // content so a day isn't mislabeled (e.g. "Explosive Legs" with zero leg work).
    const tmplMuscles=new Set(tmpl.slots.filter(s=>s.muscle!=='core').map(s=>s.muscle));
    const actualNonCore=exs.filter(e=>e.muscle&&e.muscle!=='core');
    if(actualNonCore.length&&!actualNonCore.some(e=>tmplMuscles.has(e.muscle))){
      const counts={};
      actualNonCore.forEach(e=>{counts[e.muscle]=(counts[e.muscle]||0)+1;});
      const present=Object.keys(counts).sort((a,b)=>counts[b]-counts[a]);
      sessionName=present.slice(0,2).map(m=>MNAME[m]||m).join(' · ');
      sessionDesc='Accessory / recovery work — '+present.map(m=>MNAME[m]||m).join(', ')+' (primary muscles still recovering)';
    }

    (assignedMuscles[dateStr]=assignedMuscles[dateStr]||new Set());
    exs.forEach(e=>{if(e.muscle)assignedMuscles[dateStr].add(e.muscle);});

    return{tk,name:sessionName,desc:sessionDesc,isLunch:slot.isLunch,exercises:exs,mins:slot.mins,loc:slot.loc,equipmentKey};
  }
  // Each available day is planned independently from recovery debt. Days are
  // processed in calendar order so a session assigned earlier in the week feeds
  // the lockout/recency picture for later days (a muscle trained Monday is "just
  // trained" when Tuesday is planned). buildSession returns null when nothing is
  // adequately rested → that day stays a rest day.
  function assignSlot(slot){return buildSession(slot);}

  const slotMap={};
  // Pass 1: lunch days.
  lunchSlots.forEach(slot=>{const s=assignSlot(slot);if(s)slotMap[slot.key]=s;});
  // Pass 2: evening lifting on days WITHOUT a lunch session (e.g. weekends).
  eveSlots.forEach(slot=>{
    if(lunchDows.has(slot.dow))return; // a lunch+evening day is handled in Pass 3
    const s=assignSlot(slot);if(s)slotMap[slot.key]=s;
  });
  // Pass 3: double-lifting days — a day with both lunch and evening available
  // gets a SECOND session in the evening. Because the lunch muscles are now
  // recorded for today, dayTemplate naturally picks different, still-rested
  // muscle groups for the evening (or returns null → evening stays cardio).
  eveSlots.forEach(slot=>{
    if(!lunchDows.has(slot.dow))return;
    if(slotMap[slot.key])return;
    if(!slotMap[`${slot.dow}-lunch`]?.exercises?.length)return; // no lunch session → no bonus
    const s=buildSession(slot,null,oldWeek?.[slot.dow]?.eveningSession||null);
    if(s&&s.exercises?.length)slotMap[slot.key]=s;
  });

  // Build week array
  const week=Array.from({length:7},(_,dow)=>{
    const lunch=slotMap[`${dow}-lunch`];
    const eve=slotMap[`${dow}-eve`]||slotMap[`${dow}-wknd`];
    if(!lunch&&!eve)return{dow,rest:true};
    const primary=lunch||eve;
    return{dow,rest:false,name:primary.name,desc:primary.desc,tk:primary.tk,
      isLunch:!!lunch,exercises:primary.exercises,sessionMins:primary.mins,loc:primary.loc||'ymca',equipmentKey:primary.equipmentKey||'ymca',
      eveningSession:lunch&&eve?{name:eve.name,desc:eve.desc,tk:eve.tk,isLunch:false,exercises:eve.exercises,mins:eve.mins,loc:eve.loc||'ymca',equipmentKey:eve.equipmentKey||'ymca'}:null};
  });
  return{at:Date.now(),week};
}

// ─────────────────────────────────────────────
// UTILITIES
// ─────────────────────────────────────────────
function r5(n){return Math.round(n/5)*5;}
// Snap a suggested weight down to the nearest pair actually on hand (e.g. a rack
// with gaps — no 30s/35s). Rounds DOWN so we never prescribe a weight heavier
// than what's available; floors at the lightest pair if the suggestion is below it.
function roundToAvailable(n,weights){
  if(!weights||!weights.length)return n;
  const sorted=[...weights].sort((a,b)=>a-b);
  const fit=sorted.filter(w=>w<=n);
  return fit.length?fit[fit.length-1]:sorted[0];
}
function todayDow(){return new Date().getDay();}
function todayDay(){return S.program?S.program.week[todayDow()]:null;}
// ─── LOCAL CALENDAR DAY ───
// All day bucketing keys off the USER'S LOCAL day, never UTC. toISOString()
// flips to tomorrow at 6/7pm Central, which pushed evening workouts into the
// wrong day (and the wrong MRV week). Mirrors the backend design's
// session_date = started_at AT TIME ZONE users.timezone.
function localDateStr(d){
  d=d||new Date();
  return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
// Local day a logged session belongs to (log.date is a full ISO timestamp).
function logDay(iso){return localDateStr(new Date(iso));}
function todayStr(){return localDateStr(new Date());}
function addDays(iso,n){const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return localDateStr(d);}
function daysBetween(a,b){return Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/86400000);}

function thisMonday(){
  const d=new Date();const dow=d.getDay();
  const m=new Date(d);m.setDate(d.getDate()-(dow===0?6:dow-1));
  return localDateStr(m);
}
function planMonday(){return todayDow()===0?addDays(todayStr(),1):thisMonday();}
function nextSunday(){const dow=todayDow();return addDays(todayStr(),dow===0?7:7-dow);}

function defaultAvailability(){
  const eve=()=>({on:false,mins:60,loc:'ymca',equipment:'ymca'});
  return{
    1:{lunch:true,lunchEquipment:'ymca',eve:eve()},2:{lunch:true,lunchEquipment:'ymca',eve:eve()},3:{lunch:true,lunchEquipment:'ymca',eve:eve()},
    4:{lunch:true,lunchEquipment:'ymca',eve:eve()},5:{lunch:true,lunchEquipment:'ymca',eve:eve()},
    6:{on:false,mins:60,loc:'ymca',equipment:'ymca'},0:{on:false,mins:60,loc:'ymca',equipment:'ymca'},
  };
}
function ensureAv(dow){
  if(!S.weekPlan)S.weekPlan={weekOf:todayStr(),availability:defaultAvailability(),calGoal:null};
  if(!S.weekPlan.availability)S.weekPlan.availability=defaultAvailability();
  const av=S.weekPlan.availability;
  if(dow>=1&&dow<=5&&!av[dow])av[dow]={lunch:true,eve:{on:false,mins:60,loc:'ymca'}};
  if((dow===0||dow===6)&&!av[dow])av[dow]={on:false,mins:60,loc:'ymca'};
}

// ─── Week Plan helpers ───
function getWeekPlan(){
  if(!S.weekPlan)return null;
  if(S.weekPlan.weekOf<thisMonday())return null;
  return S.weekPlan;
}
function getCalEntry(){
  const plan=getWeekPlan();
  if(!plan?.calGoal?.cals)return null;
  const today=todayStr();
  if(today<plan.calGoal.startDate||today>plan.calGoal.endDate)return null;
  return plan.calGoal;
}
function isDaySkipped(dow){
  // A day is "skipped" (no lifting) when program says rest
  if(!S.program)return false;
  return S.program.week[dow]?.rest===true;
}

// ─── Recent Workouts Analysis ───
function parseRecentWorkouts(text){
  if(!text || !text.trim()) return new Set();

  const recentMuscles = new Set();
  const normalizedText = text.toLowerCase();

  // Muscle group keyword mapping
  const muscleKeywords = {
    chest: ['chest', 'pecs', 'bench', 'pushup', 'push-up', 'flies', 'flyes'],
    back: ['back', 'lats', 'pullup', 'pull-up', 'row', 'pulldown', 'deadlift'],
    shoulders: ['shoulder', 'delts', 'deltoid', 'press', 'raises', 'lateral'],
    legs: ['legs', 'quad', 'hamstring', 'squat', 'lunge', 'thigh', 'glutes', 'glute'],
    biceps: ['biceps', 'bicep', 'curls', 'curl'],
    triceps: ['triceps', 'tricep', 'pushdown', 'extension', 'dips'],
    core: ['core', 'abs', 'abdominal', 'plank', 'crunch']
  };

  // Check for muscle group mentions
  Object.entries(muscleKeywords).forEach(([muscle, keywords]) => {
    if(keywords.some(keyword => normalizedText.includes(keyword))){
      recentMuscles.add(muscle);
    }
  });

  return recentMuscles;
}

function getOverworkedMuscles(){
  const recentWorkouts = S.weekPlan?.recentWorkouts || '';
  const recentOverworked = parseRecentWorkouts(recentWorkouts);

  // Also check for upcoming custom workouts this week
  const upcomingOverworked = getUpcomingCustomWorkoutMuscles();

  // Combine both sets
  return new Set([...recentOverworked, ...upcomingOverworked]);
}

function getUpcomingCustomWorkoutMuscles(){
  const upcomingMuscles = new Set();

  if(!S.program || !S.program.week) return upcomingMuscles;

  const today = todayDow();

  // Check for custom workouts throughout the entire week for better planning
  S.program.week.forEach((day, dow) => {
    if(day && (day.customWorkout || day.plannedCustomWorkout)) {
      const customLog = day.customLog || day.plannedCustomLog;
      if(customLog) {
        // Consider all custom workouts in the week, with different weights based on timing
        const dayDiff = dow === 0 ? (7 - today) : (dow - today);

        // For planning purposes, consider the entire week but with different impact
        if(dayDiff >= -1 && dayDiff <= 6) { // Yesterday to end of week
          customLog.exercises.forEach(ex => {
            upcomingMuscles.add(ex.muscle);
          });
        }
      }
    }
  });

  return upcomingMuscles;
}

// ─── MRV (Maximum Recoverable Volume) Tracking ───
function getWeeklySetVolumes(){
  // Calculate set volumes by muscle group for the current week
  const mondayStr = thisMonday();
  const nextMondayStr = addDays(mondayStr, 7);

  const weekLogs = S.logs.filter(l =>
    logDay(l.date) >= mondayStr && logDay(l.date) < nextMondayStr
  );

  const volumes = {};

  weekLogs.forEach(log => {
    log.exercises?.forEach(ex => {
      const muscle = ex.muscle;
      const completedSets = ex.sets?.filter(s => s && s.reps > 0).length || 0;
      volumes[muscle] = (volumes[muscle] || 0) + completedSets;
    });
  });

  return volumes;
}

// Weekly MRV (Maximum Recoverable Volume) ranges per muscle, in working sets.
// Evidence check 2026-06-11: consistent with Pelland et al. 2025 dose-response
// meta-regression (67 studies, n=2058) — hypertrophy rises with volume with
// diminishing returns and ≥10 weekly sets/muscle outperforms <10; strength
// plateaus far earlier. No numeric change warranted; ranges retained.
// Number of distinct calendar days per week with at least one training session,
// computed from availability directly (not the generated program) — reading
// S.program here would be circular, since getMRVLimits() feeds the very
// generation that decides which days end up training.
function trainingDayCount(av){
  av=av||(S.weekPlan?.availability)||defaultAvailability();
  const dows=new Set();
  [1,2,3,4,5].forEach(dow=>{
    const d=av[dow]||{};
    if(d.lunch!==false)dows.add(dow);
    if(d.eve?.on)dows.add(dow);
  });
  [6,0].forEach(dow=>{
    const d=av[dow]||{};
    if(d.on)dows.add(dow);
  });
  return dows.size;
}
// Efficiency Mode: training 3 days/week triggers a much lower, higher-
// intensity volume floor — near-failure sets (0-2 RIR) can still trigger
// growth on far less weekly volume than a moderate-intensity approach needs.
// The UI's efficiencyModeHTML banner carries the RIR target and the side-delt
// guidance (this app tracks all deltoid work, including compound presses,
// under one 'shoulders' bucket, so that nuance can't live in the weekly cap).
function isEfficiencyMode(av){ return trainingDayCount(av)===3; }

function getMRVLimits(){
  let limits = {
    chest: {min: 10, max: 20},
    back: {min: 12, max: 22},
    shoulders: {min: 8, max: 18},
    biceps: {min: 6, max: 16},
    triceps: {min: 6, max: 16},
    legs: {min: 14, max: 24},
    core: {min: 8, max: 18},
    hips: {min: 6, max: 16}
  };
  if(isEfficiencyMode()){
    limits=Object.fromEntries(Object.keys(limits).map(m=>[m,{min:3,max:10}]));
  }
  // Recovery auto-regulation: muscles trained in a high-fatigue session
  // (rating ≥4) within the last 72h get a temporarily reduced ceiling, so
  // the generator backs off volume until they've recovered. 72h window is
  // consistent with time-course studies showing mechanical function depressed
  // 24-72h after training to failure / high-fatigue sessions (e.g., 2025
  // Frontiers Physiology DOMS-intervention RCT; velocity-loss time-course work).
  getFatiguedMuscles().forEach(m=>{
    if(limits[m])limits[m]={min:limits[m].min,max:Math.max(limits[m].min,Math.round(limits[m].max*0.85))};
  });
  return limits;
}

// Muscles trained in a session the user rated 4-5 ("Hard"/"Maxed out")
// within the last 72 hours.
function getFatiguedMuscles(){
  // S-Tier sleep shield: 7-9h logged for last night overrides the fatigue-rating
  // penalty entirely (see sleepShieldActive below) — full planned volume today.
  if(sleepShieldActive())return new Set();
  const cutoff=Date.now()-72*3600*1000;
  const fatigued=new Set();
  (S.logs||[]).forEach(l=>{
    if((l.fatigue||0)>=4&&new Date(l.date).getTime()>=cutoff){
      (l.exercises||[]).forEach(e=>{if(e.muscle)fatigued.add(e.muscle);});
    }
  });
  return fatigued;
}

// ─── MUSCLE GROUP FATIGUE MATRIX ───
// Hard recovery-lockout windows per muscle group, in hours. When the
// reconfiguration engine evaluates a calendar day, it scans the historical log
// (plus any sessions already assigned earlier in this same generation run) for
// each muscle's lockout period. A muscle inside its window has its MRV ceiling
// pinned to its already-committed volume for that day, so pickEx drops rather
// than adds sets for it — the same "fewer sets" path used when a muscle hits
// its weekly MRV max.
const MUSCLE_LOCKOUT_HOURS={chest:48,shoulders:48,back:48,legs:72,biceps:24,triceps:24,core:24};

// Hours between the noon-anchored timestamps of two local calendar dates (YYYY-MM-DD).
function hoursBetweenDates(fromDateStr,toDateStr){
  return (new Date(toDateStr+'T12:00:00')-new Date(fromDateStr+'T12:00:00'))/3600000;
}

// Muscles locked for `dateStr`, scanning `history` (logged sessions on any date
// strictly before dateStr) plus `assigned` (a {dateStr: Set<muscle>} map of
// sessions already built earlier in this generation run).
function getLockedMuscles(dateStr,history,assigned){
  const locked=new Set();
  Object.entries(MUSCLE_LOCKOUT_HOURS).forEach(([muscle,hrs])=>{
    const fromHistory=(history||[]).some(l=>{
      if(l.isCardio)return false;
      const d=logDay(l.date);
      if(!(d<dateStr))return false;
      if(!(l.exercises||[]).some(e=>e.muscle===muscle))return false;
      return hoursBetweenDates(d,dateStr)<hrs;
    });
    const fromRun=fromHistory?false:Object.entries(assigned||{}).some(([d,muscles])=>
      d<dateStr&&muscles.has(muscle)&&hoursBetweenDates(d,dateStr)<hrs);
    if(fromHistory||fromRun)locked.add(muscle);
  });
  return locked;
}

// Suggest a rest day once consecutive training days reach this many.
const REST_SUGGEST_STREAK=6;

// Additive recovery monitor (READ-ONLY): surfaces rest-requirement advisories
// without changing the generated plan or any existing scheduling logic. It
// layers on top of the split ordering and the MUSCLE_LOCKOUT_HOURS windows:
//   (1) flags two sessions of the same muscle group scheduled closer than that
//       group's required recovery window (e.g. legs <72h, chest <48h), and
//   (2) suggests a rest day when consecutive training days — recent logs through
//       the planned week — reach REST_SUGGEST_STREAK.
// Builds on, never overrides, orderSplitByRecovery and getLockedMuscles.
function getRecoveryAdvisories(){
  if(!S.program||!S.program.week)return[];
  const today=todayStr();
  const thisMon=thisMonday();
  const dateFor=(dow)=>dow===0?addDays(thisMon,6):dow===6?addDays(thisMon,5):addDays(thisMon,dow-1);
  const dlabel=(d)=>DOW[new Date(d+'T12:00:00').getDay()];

  // Muscles trained per calendar date: recent logs (last 10 days) + planned week.
  const dateMuscles={};
  const add=(d,muscles)=>{if(!d)return;(dateMuscles[d]=dateMuscles[d]||new Set());muscles.forEach(m=>m&&dateMuscles[d].add(m));};
  (S.logs||[]).forEach(l=>{
    if(l.isCardio)return;
    const d=logDay(l.date);
    if(daysBetween(d,today)<0||daysBetween(d,today)>10)return;
    add(d,(l.exercises||[]).map(e=>e&&e.muscle));
  });
  S.program.week.forEach((day,dow)=>{
    if(!day||day.rest)return;
    const d=dateFor(dow);
    if(d<today)return; // past planned days are already covered by logs above
    const log=day.customLog||day.plannedCustomLog;
    const exs=log?log.exercises:day.exercises;
    add(d,(exs||[]).map(e=>e&&e.muscle));
  });

  const advisories=[];

  // (1) Same-muscle spacing vs required recovery window. Core is intentionally
  // skipped — it's light rotational work programmed every day by design.
  Object.entries(MUSCLE_LOCKOUT_HOURS).forEach(([muscle,hrs])=>{
    if(muscle==='core')return;
    const days=Object.keys(dateMuscles).filter(d=>dateMuscles[d].has(muscle)).sort();
    for(let i=1;i<days.length;i++){
      if(days[i]<today)continue; // only warn about upcoming conflicts
      if(hoursBetweenDates(days[i-1],days[i])<hrs)
        advisories.push(`${MNAME[muscle]||muscle} is set for ${dlabel(days[i-1])} & ${dlabel(days[i])} — under the ${hrs}h it needs to recover. Consider spacing them out.`);
    }
  });

  // (2) Consecutive training-day streak (spans the week boundary via log dates).
  const liftDates=Object.keys(dateMuscles).sort();
  if(liftDates.length){
    let run=[liftDates[0]],best=null;
    const consider=(r)=>{if(r.length>=REST_SUGGEST_STREAK&&r[r.length-1]>=today&&(!best||r.length>best.length))best=r;};
    for(let i=1;i<liftDates.length;i++){
      if(daysBetween(liftDates[i-1],liftDates[i])===1)run.push(liftDates[i]);
      else{consider(run);run=[liftDates[i]];}
    }
    consider(run);
    if(best)advisories.push(`You're scheduled to train ${best.length} days in a row (${dlabel(best[0])}–${dlabel(best[best.length-1])}). Consider a rest day in there to recover and avoid overtraining.`);
  }
  return advisories;
}

// Sleep-based recovery boost — S-Tier: 7-9 hours logged for last night shields
// against the 72h high-fatigue MRV reduction below, so a well-rested muscle
// gets the full planned volume back even right after a hard session. Sleep is
// the top-ranked recovery lever, so it overrides the fatigue-rating penalty
// entirely rather than just softening it.
function sleepShieldActive(){
  const hrs=S.sleepLog?.[todayStr()];
  return hrs!=null&&hrs>=7&&hrs<=9;
}
function renderSleepCard(){
  const today=todayStr();
  const logged=S.sleepLog?.[today];
  const opts=[{v:5,label:'<6h'},{v:6.5,label:'6–7h'},{v:8,label:'7–9h'},{v:9.5,label:'9h+'}];
  const shielded=logged!=null&&logged>=7&&logged<=9;
  return`<div class='card' style='margin-bottom:14px'>
    <div class='sec-lbl' style='margin-bottom:8px'>😴 Last Night's Sleep${logged!=null?` <span style='color:var(--mut);font-weight:400;text-transform:none;letter-spacing:0'>· logged</span>`:''}</div>
    <div style='display:flex;gap:6px;flex-wrap:wrap'>
      ${opts.map(o=>`<button class='btn btn-sm ${logged===o.v?'btn-p':'btn-g'}' data-action='log-sleep' data-hours='${o.v}' style='flex:1;min-width:70px'>${o.label}</button>`).join('')}
    </div>
    ${shielded?`<div class='prog-hint' style='margin-top:8px'>✅ Well rested — full planned volume applies today, even after a hard session.</div>`:''}
  </div>`;

function renderRecoveryBanner(){
  const a=getRecoveryAdvisories();
  if(!a.length)return'';
  return`<div class='card' style='border-color:rgba(251,191,36,.4);background:linear-gradient(135deg,var(--surf2) 0%,rgba(251,191,36,.05) 100%);margin-bottom:14px'>
    <div class='sec-lbl' style='color:var(--warn);margin-bottom:8px'>⚠️ Recovery Check</div>
    ${a.map(x=>`<div style='font-size:13px;color:var(--txt-dim);line-height:1.5;margin-bottom:6px'>• ${x}</div>`).join('')}
  </div>`;
}

// Recent fatigue load per muscle, weighting BOTH how much volume was done and
// how recently. Each logged set counts for `1 - daysAgo/LOOKBACK` (≈1 today,
// fading to ~0 a week out), summed per muscle over the lookback window. Using
// volume — not just the single most-recent date — means a "mostly push" day
// correctly marks push (3+ movements) as fatigued rather than letting one stray
// accessory (e.g. a single row) flag the whole pull group as freshly trained.
function muscleRecentLoad(history){
  const load={};
  const today=todayStr();
  const LOOKBACK=7;
  (history||[]).forEach(l=>{
    if(l.isCardio)return;
    const daysAgo=daysBetween(logDay(l.date),today);
    if(daysAgo<0||daysAgo>=LOOKBACK)return; // future or older than the window
    const w=1-(daysAgo/LOOKBACK);
    (l.exercises||[]).forEach(e=>{
      if(!e||!e.muscle)return;
      const sets=Array.isArray(e.sets)?e.sets.filter(s=>s&&s.reps>0).length:(parseInt(e.sets)||1);
      load[e.muscle]=(load[e.muscle]||0)+sets*w;
    });
  });
  return load;
}

// Reorder the week's split so the template whose muscles carry the LEAST recent
// fatigue lands on the earliest day, and the most-fatigued template lands last.
// The binding constraint for a template is its most-fatigued muscle (the one
// most owed rest), so each template scores as the max recent load among its
// non-core muscles, sorted ascending. The lockout matrix (getLockedMuscles)
// still enforces the hard recovery floor; this only improves spacing within
// what's legal. Stable: with no recent history every score is 0 so the
// canonical SPLITS order is preserved unchanged.
function orderSplitByRecovery(split,history){
  const load=muscleRecentLoad(history);
  const score=tk=>{
    const tmpl=TMPLS[tk];
    if(!tmpl)return 0;
    let max=0;
    tmpl.slots.forEach(sl=>{
      if(sl.muscle==='core')return;
      const v=load[sl.muscle]||0;
      if(v>max)max=v;
    });
    return max;
  };
  return split
    .map((tk,i)=>({tk,i,s:score(tk)}))
    .sort((a,b)=>a.s-b.s||a.i-b.i)
    .map(o=>o.tk);
}

// Sets already committed this week by muscle: completed/logged workouts PLUS any
// not-yet-done planned custom workouts on the program. Used to budget remaining
// sessions so the generator fills toward optimal without blowing past MRV max.
function getCommittedVolumes(){
  const vol = getWeeklySetVolumes(); // logged (completed + custom-logged)
  if(S.program?.week){
    S.program.week.forEach(day => {
      // Skip planned days that have since been logged (counted via the logs above)
      if(day && day.plannedCustomWorkout && day.plannedCustomLog && !day.customWorkout){
        day.plannedCustomLog.exercises.forEach(ex => {
          const sets = Array.isArray(ex.sets)
            ? ex.sets.filter(s => s && s.reps > 0).length
            : (parseInt(ex.sets) || 0);
          if(ex.muscle) vol[ex.muscle] = (vol[ex.muscle] || 0) + sets;
        });
      }
    });
  }
  return vol;
}

// ─── MRV VOLUME ATTRIBUTION ───
// Per-muscle breakdown of exactly which exercises, on which days, drive the
// weekly MRV totals. Mirrors getCommittedVolumes for the counted ("committed")
// numbers — logged sessions + planned custom workouts — and additionally lists
// upcoming scheduled program sessions as "projected" (NOT counted in the MRV
// widget totals, shown for transparency into the rest of the week).
function getMRVBreakdown(){
  const mondayStr=thisMonday();
  const nextMondayStr=addDays(mondayStr,7);
  const breakdown={};
  const add=(muscle,entry)=>{
    if(!muscle||!entry.sets)return;
    if(!breakdown[muscle])breakdown[muscle]={committed:0,projected:0,entries:[]};
    breakdown[muscle].entries.push(entry);
    if(entry.source==='scheduled')breakdown[muscle].projected+=entry.sets;
    else breakdown[muscle].committed+=entry.sets;
  };

  // 1) Logged sessions this calendar week (regular + custom) — completed sets only
  const completedDows=new Set();
  (S.logs||[]).filter(l=>logDay(l.date)>=mondayStr&&logDay(l.date)<nextMondayStr).forEach(l=>{
    const dow=new Date(l.date).getDay();
    if(!l.isCardio)completedDows.add(dow);
    (l.exercises||[]).forEach(ex=>{
      const sets=ex.sets?.filter(s=>s&&s.reps>0).length||0;
      add(ex.muscle,{dow,dayLabel:DOW[dow],name:ex.name,sets,source:l.isCustom?'custom':'logged',sessionName:l.dayName});
    });
  });

  // 2) Planned custom workouts not yet logged (counted in MRV widget)
  if(S.program?.week){
    S.program.week.forEach(day=>{
      if(day&&day.plannedCustomWorkout&&day.plannedCustomLog&&!day.customWorkout){
        day.plannedCustomLog.exercises.forEach(ex=>{
          const sets=Array.isArray(ex.sets)?ex.sets.filter(s=>s&&s.reps>0).length:(parseInt(ex.sets)||0);
          add(ex.muscle,{dow:day.dow,dayLabel:DOW[day.dow],name:ex.name,sets,source:'planned',sessionName:'Planned Custom Workout'});
        });
      }
    });

    // 3) Upcoming scheduled program sessions — projected, not yet counted
    const todayISO=todayStr();
    S.program.week.forEach(day=>{
      if(!day||day.rest||day.customWorkout||day.plannedCustomWorkout)return;
      if(completedDows.has(day.dow))return;
      const dayISO=addDays(mondayStr,day.dow===0?6:day.dow-1);
      if(dayISO<todayISO)return; // missed past days don't project volume
      const collect=(sess)=>{(sess?.exercises||[]).forEach(e=>{
        add(e.muscle,{dow:day.dow,dayLabel:DOW[day.dow],name:e.name,sets:e.sets||3,source:'scheduled',sessionName:sess.name});
      });};
      collect(day);
      if(day.eveningSession)collect(day.eveningSession);
    });
  }

  // Stable ordering: entries sorted Mon→Sun within each muscle (Sun last)
  Object.values(breakdown).forEach(b=>b.entries.sort((a,c)=>(a.dow===0?7:a.dow)-(c.dow===0?7:c.dow)));
  return breakdown;
}

function getMRVStatus(){
  // Logged sets ONLY (completed + custom-logged) — the dashboard bars reflect
  // what's actually been done this week, starting yellow every Monday and
  // filling toward green. The generator budgets separately via
  // getCommittedVolumes (which also counts planned custom workouts).
  const volumes = getWeeklySetVolumes();
  const limits = getMRVLimits();

  const status = {};
  Object.keys(limits).forEach(muscle => {
    const current = volumes[muscle] || 0;
    const {min, max} = limits[muscle];
    let level = 'low';
    if (current >= min && current <= max) level = 'optimal';
    else if (current > max) level = 'high';

    status[muscle] = {current, min, max, level};
  });

  return status;
}

function renderMRVWidget(){
  const mrvStatus = getMRVStatus();
  const overworkedMuscles = getOverworkedMuscles();

  // Every muscle shows every week — bars start yellow (under range) on Monday
  // and fill toward green. Color is strictly range-based: yellow under min,
  // green within min–max, red over max. ⚠️ still flags recent external work
  // but no longer overrides the range color.
  const rows = Object.entries(mrvStatus)
    .map(([muscle, status]) => {
      const {current, min, max, level} = status;
      const isOverworked = overworkedMuscles.has(muscle);
      const color = level === 'high' ? 'var(--bad)' : level === 'optimal' ? 'var(--ok)' : 'var(--warn)';
      const pct = Math.min(100, (current / max) * 100);
      const minPct = Math.min(100, (min / max) * 100); // tick where green starts

      return `<div style='display:flex;align-items:center;gap:8px;margin-bottom:4px'>
        <div style='font-size:12px;font-weight:600;width:60px;text-transform:capitalize;display:flex;align-items:center;gap:4px'>
          ${MNAME[muscle]}
          ${isOverworked ? '<span style="font-size:10px;color:var(--warn)">⚠️</span>' : ''}
        </div>
        <div style='flex:1;background:var(--surf2);border-radius:4px;height:12px;position:relative'>
          <div style='background:${color};height:100%;width:${pct}%;border-radius:4px'></div>
          <div style='position:absolute;top:-1px;bottom:-1px;left:${minPct}%;width:2px;background:var(--ok);opacity:.5;border-radius:1px'></div>
        </div>
        <div style='font-size:11px;color:${color};min-width:40px;text-align:right'>
          ${current}/${max}
        </div>
      </div>`;
    }).join('');

  const fatigued=[...getFatiguedMuscles()].filter(m=>MNAME[m]);
  const fatigueNote=fatigued.length?`<div style='font-size:11px;color:var(--warn);margin-top:8px'>🔋 Recovering: ${fatigued.map(m=>MNAME[m]).join(', ')} — volume ceiling reduced 15% for 72h after your hard session</div>`:'';
  return `<div class='card' data-action='view-mrv-breakdown' style='cursor:pointer'>
    <div style='font-size:14px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:6px'>
      📊 Weekly Set Volume (MRV)
      <span style='font-size:10px;color:var(--mut);font-weight:400'>🟡 under · 🟢 optimal · 🔴 over · ⚠️ recent external</span>
      <span style='margin-left:auto;color:var(--acc);font-size:12px;font-weight:600'>Breakdown ›</span>
    </div>
    ${rows}
    ${fatigueNote}
  </div>`;
}

// ─────────────────────────────────────────────
// BODY SCORE GOAL CARD
// ─────────────────────────────────────────────
// Translates the body-composition scan into a TRAINING plan. The scan shows
// muscle already above the normal range, so the only lever from 79→100 is
// dropping fat while holding that muscle. Everything surfaced here is on the
// training side (lift to retain muscle, move to spend energy) — the app stays
// out of nutrition prescription by design.
function renderBodyScoreCard(){
  const b=S.cfg&&S.cfg.bodyScore;
  if(!b)return'';
  const score=b.score||0;
  const pct=Math.max(4,Math.min(100,score));
  const toLose=Math.max(0,+(b.weight-b.target).toFixed(1));
  const muscleOver=+(b.skeletalMuscle-b.smRangeHi).toFixed(1); // lb above the normal-range ceiling
  const ring=score>=95?'var(--ok)':score>=85?'#a5b4fc':'var(--warn)';
  const stat=(label,val,note,col)=>`<div style='flex:1;min-width:84px'>
    <div style='font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.5px'>${label}</div>
    <div style='font-size:17px;font-weight:800;color:${col||'var(--txt)'}'>${val}</div>
    <div style='font-size:10px;color:var(--mut)'>${note}</div>
  </div>`;
  const step=(icon,title,body)=>`<div style='display:flex;gap:9px;margin-bottom:9px'>
    <span style='font-size:15px;flex-shrink:0'>${icon}</span>
    <div><span style='font-size:13px;font-weight:700'>${title}</span>

function getMissedDays(){
  const plan=getWeekPlan();
  if(!plan||!S.program)return[];
  const today=todayDow();
  const planStart=plan.weekOf;
  const weekEnd=addDays(planStart,14); // allow up to 2 weeks
  const weekLogs=S.logs.filter(l=>!l.isCardio&&logDay(l.date)>=planStart&&logDay(l.date)<weekEnd);
  const completedDates=new Set(weekLogs.map(l=>logDay(l.date)));
  // Find non-rest days in the past (from planStart onward) with no log
  return S.program.week.filter(d=>{
    if(d.rest||d.dow===0||d.dow>=today)return false;
    const dayDate=addDays(planStart,daysBetween(planStart,todayStr())-(today-d.dow));
    // simpler: check if this DOW's date this week has a log
    const thisMon=thisMonday();
    const dayDateThisWeek=addDays(thisMon,d.dow-1);
    if(dayDateThisWeek<planStart)return false; // before plan started
    return!completedDates.has(dayDateThisWeek);
  }).map(d=>d.dow);
}

// Program-week dows (non-rest) that have a completed session logged on their
// calendar date this week — a regular finished workout or a custom-logged one.
// Used to mark planned days as "completed" in the dashboard and program views.
// Driven ENTIRELY by S.logs — not by S.program.week's current shape — so a day
// stays marked completed even after a full regeneration reassigns that dow to
// a different template or to rest (the new split just doesn't place a lifting
// session there; the log itself is untouched and remains the source of truth).
function getCompletedDows(){
  const set=new Set();
  const thisMon=thisMonday();
  const dateFor=(dow)=>dow===0?addDays(thisMon,6):dow===6?addDays(thisMon,5):addDays(thisMon,dow-1);
  const loggedDates=new Set(S.logs.filter(l=>!l.isCardio).map(l=>logDay(l.date)));
  for(let dow=0;dow<7;dow++){
    if(loggedDates.has(dateFor(dow)))set.add(dow);
  }
  return set;
}

// The actual logged (non-cardio) session for a program-week dow's calendar date
// this week, if any. A completed day should display what was REALLY trained —
// the planned template can differ (e.g. the week was regenerated after the
// session was logged), so completed cards/rows read from the log, not the plan.
function getLoggedSessionForDow(dow){
  if(!S.program)return null;
  const thisMon=thisMonday();
  const dateFor=(dw)=>dw===0?addDays(thisMon,6):dw===6?addDays(thisMon,5):addDays(thisMon,dw-1);
  const target=dateFor(dow);
  return (S.logs||[]).find(l=>!l.isCardio&&logDay(l.date)===target)||null;
}

// Read-only exercise rows for a logged session (name + muscle dot + what was

function loggedExRows(log){

    const done=(e.sets||[]).filter(s=>s&&s.reps>0);
