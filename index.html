  {id:'sl_hip_flexor_pallof',name:'Single-Leg Hip Flexor Pallof Press',muscle:'core',type:'rotational',eq:['cables'],rMin:8,rMax:12,rest:90,cue:'Pallof stance, but drive one knee up to hip height and BALANCE on the other leg — then press the cable out and back while the knee stays up. Anti-rotation core, hip-flexor strength, and single-leg stability in one drill. Hips stay square, no lean. Count presses per side/leg combination.',tags:['anti-rotation','hip_flexor','unilateral']},
  {id:'twisting_leg_raise',name:'Twisting Hanging Knee/Leg Raise',muscle:'core',type:'rotational',eq:['pullup_bar'],rMin:6,rMax:12,rest:90,noWeight:true,cue:'Hang with active shoulders. Raise the knees (or straight legs to progress) up and toward ONE side, curling the pelvis and rotating so the obliques finish the lift. Lower under control, no swing, alternate sides. The rotational sibling of the hanging leg raise. Count per side.',tags:['rotation','flexion']},
  {id:'sa_incline_press',name:'Single-Arm Incline DB Press',muscle:'core',type:'rotational',eq:['dumbbells'],rMin:8,rMax:12,rest:90,cue:'Incline bench, one dumbbell only. Press it while the free side of your body has NOTHING holding it down — the core must brace hard against the roll toward the loaded side the entire set. Keep both shoulder blades and hips square on the bench. A press that\'s secretly an anti-rotation drill. Count per side.',tags:['asymmetrical','anti-rotation']},
  {id:'split_stance_row',name:'Split-Stance Cable Row',muscle:'core',type:'rotational',eq:['cables'],rMin:10,rMax:12,rest:90,cue:'Staggered stance (opposite foot forward from the rowing arm), torso tall. Row the cable to your ribs without letting the shoulders or hips rotate open — the narrow stance gives the core nowhere to hide. Slow return, resist the twist the whole way back. Count per side.',tags:['asymmetrical','anti-rotation']},
  {id:'ab_rollout',name:'Ab Rollout (Barbell/Wheel)',muscle:'core',type:'rotational',eq:['barbell','bodyweight'],rMin:6,rMax:12,rest:90,noWeight:true,cue:'Kneel with hands on a loaded barbell (or ab wheel). Brace, tuck the pelvis, and roll out only as far as you can keep the lower back from arching — the abs resist extension the entire way out — then drag yourself back with lats and abs together. A shorter range done rigid beats a long saggy rep. The king of anti-extension work.',tags:['anti-extension']},
  {id:'crunches',name:'Crunches',muscle:'core',type:'isolation',eq:['bodyweight'],rMin:12,rMax:20,rest:60,noWeight:true,cue:'Lie on back, knees bent. Curl shoulder blades off the floor, exhale at the top. Keep lower back pressed down — small controlled range, no momentum.',tags:['flexion']},
  // noWeight REMOVED 2026-08-03 (from Sam: "sit up can be weighted"). The cue
  // already told him to hold a plate; noWeight:true then hid the weight field,
  // so the load he was actually using could never be logged or progressed —
  // the estimate carried the set instead of the number. decline_situps was
  // already weight-enabled, which is what made the inconsistency visible.
  {id:'situps',name:'Sit-ups',muscle:'core',type:'isolation',eq:['bodyweight'],rMin:12,rMax:20,rest:60,cue:'Lie on your back, knees bent, feet flat (anchor them if needed). Curl up through a full range until your torso is upright, leading with the chest — don\'t yank on your neck. Exhale at the top, then lower under control all the way down. Cross arms on the chest to regress, or hold a plate at the chest to add load.',tags:['flexion']},
  {id:'hanging_leg_raise',name:'Hanging Leg Raise',muscle:'core',type:'isolation',eq:['pullup_bar','bodyweight'],rMin:8,rMax:15,rest:90,noWeight:true,cue:'Hang from a bar with shoulders active (slight pull-down, not a loose dead hang). Curl your PELVIS up toward your ribs — don\'t just lift the legs from the hips. No swinging or momentum: pause briefly at the top, lower under control (2–3 counts). Bend the knees to regress, keep legs straighter to progress. Considered the elite movement for full core training.',tags:['flexion','anti-extension']},
  {id:'incline_leg_raise',name:'Incline Elevated Leg Raises',muscle:'core',type:'isolation',eq:['bodyweight'],rMin:10,rMax:20,rest:75,noWeight:true,cue:'Set the bench to a 30–40° incline (~58–84% grade), head-up, gripping the top pad behind your head for an anchor. Keeping legs fairly straight, curl the pelvis and raise the legs up toward vertical — drive from the lower abs, not momentum. Lower under control without letting the feet touch down between reps to keep tension on the abs. Bend the knees to regress.',tags:['flexion']},
  {id:'body_v',name:'Body V (V-Ups)',muscle:'core',type:'isolation',eq:['bodyweight'],rMin:8,rMax:15,rest:75,noWeight:true,cue:'Lie flat on your back, arms extended overhead, legs straight. Simultaneously lift the torso and legs, reaching the hands toward the feet so the body folds into a "V" balanced on the glutes. Exhale and squeeze the abs hard at the top, then lower both halves under control without slamming down. Bend the knees or do tuck-ups to regress.',tags:['flexion']},
  {id:'decline_situps',name:'Weighted Decline Sit-ups',muscle:'core',type:'isolation',eq:['bodyweight'],rMin:8,rMax:15,rest:90,cue:'Decline bench, feet hooked, plate or DB hugged to the chest. Curl up leading with the chest — no yanking the neck — pause at the top, then lower ALL the way back under control; the decline makes the bottom half of each rep the hard part. Log the held weight to progress.',tags:['flexion']},
  {id:'toe_touch_crunch',name:'Toe Touch Crunch',muscle:'core',type:'isolation',eq:['bodyweight'],rMin:12,rMax:20,rest:60,noWeight:true,cue:'On your back, legs straight up at vertical. Crunch the shoulder blades off the floor and reach both hands toward your toes — the range is short, the squeeze is the point. Lower the shoulders back down under control; legs stay tall the whole set. Exhale on every reach.',tags:['flexion']},
  {id:'flutter_kicks',name:'Flutter Kicks',muscle:'core',type:'isolation',eq:['bodyweight'],rMin:20,rMax:45,rest:60,noWeight:true,isTimed:true,cue:'On your back, hands under the glutes, legs straight and hovering a few inches up. Small, fast alternating kicks — the lower back stays PRESSED into the floor the entire time; if it arches, raise the legs higher or stop the set. Count seconds.',tags:['flexion','anti-extension']},
  {id:'three_way_crunch',name:'3-Way Crunch (Middle + Sides)',muscle:'core',type:'isolation',eq:['bodyweight'],rMin:9,rMax:15,rest:60,noWeight:true,cue:'One "round" is three crunches: straight up the middle, then reaching toward the LEFT knee, then toward the RIGHT — hitting rectus and both obliques in turn. Shoulder blades off the floor each rep, exhale at every top. Count total crunches (a multiple of 3).',tags:['flexion','lateral']},
  {id:'dip_bar_leg_lifts',name:'Dip Bar Leg Lifts',muscle:'core',type:'isolation',eq:['bodyweight'],rMin:8,rMax:15,rest:90,noWeight:true,cue:'Support yourself on parallel dip bars, arms locked, shoulders pressed down. Curl the pelvis and raise the knees (or straight legs to progress) to hip height — no swinging. Lower under control. Same lower-ab drive as hanging raises, without grip being the limiter.',tags:['flexion']},
  {id:'half_pullup_leg_lifts',name:'Half Pull-up Leg Lifts',muscle:'core',type:'isolation',eq:['pullup_bar'],rMin:5,rMax:10,rest:120,noWeight:true,cue:'Pull to the HALF pull-up position — elbows at 90° — and hold yourself there while you raise the knees or straight legs to hip height and lower them. The iso pull-up hold hammers the lats and grip while the abs do the lifting. Come down when the hold breaks, not when the abs quit.',tags:['flexion','isometric']},
  // Dragon Flag progression track — 3 tiers, gated by dragonFlagUnlocked() below.
  // Tier 1 is always available; Tier 2/3 unlock after logging 10 clean reps in
  // a single set on the tier before it (see DRAGON_FLAG_TRACK).
  {id:'leg_lifts_lying',name:'Lying Leg Lifts',muscle:'core',type:'isolation',eq:['bodyweight'],rMin:8,rMax:15,rest:75,noWeight:true,dragonTier:1,cue:'Lie flat on your back, hands tucked under your glutes (or gripping something behind your head) for a stable anchor. Keeping legs straight, lift them together from the floor to vertical using the lower abs — not momentum. Lower under control without letting your feet touch down between reps. Tier 1 of the Dragon Flag progression: log 10 clean reps in a single set to unlock the Bent-Knee Dragon Flag.',tags:['flexion']},
  {id:'dragon_flag_bent',name:'Bent-Knee Dragon Flag',muscle:'core',type:'isolation',eq:['bodyweight'],rMin:5,rMax:10,rest:90,noWeight:true,dragonTier:2,cue:'Lie on a bench, gripping it behind your head for anchoring. Keeping only your shoulder blades in contact with the bench, lift your hips and bent legs into a straight line from shoulders to knees — a jackknife with the knees bent. Lower under control, keeping the line rigid, without letting your lower back sag or your hips touch down. Tier 2 of the Dragon Flag progression: log 10 clean reps in a single set to unlock the Full Dragon Flag.',tags:['flexion','anti-extension']},
  {id:'dragon_flag_full',name:'Full Dragon Flag',muscle:'core',type:'isolation',eq:['bodyweight'],rMin:3,rMax:8,rest:120,noWeight:true,dragonTier:3,cue:'Lie on a bench, gripping it behind your head. Keeping the ENTIRE body dead straight from shoulders to pointed toes, lift into a rigid plank floating above the bench, pivoting only at the shoulder blades. Lower as slowly as you can control — the eccentric is the hardest part and the whole point. Elite-level core strength. Bend the knees (regressing toward the Bent-Knee variation) if the straight line breaks.',tags:['flexion','anti-extension']},
  // ─── Hip Health (stability & mobility) ───
  {id:'clamshell',name:'Clamshell',muscle:'hips',type:'stability',eq:['bodyweight'],rMin:15,rMax:20,rest:60,noWeight:true,cue:'Side-lying, knees bent ~45°. Rotate top knee up like a clamshell lid. Keep hips stacked — they WILL want to roll back. Squeeze hard at top, slow negative. This is pure glute med. Count per side.\n\nProgression without bands: (1) Build to 20 strict reps per side → (2) Add a 2s pause at the top of each rep → (3) Slow the negative to 3 counts → (4) Move to straight-leg side-lying abduction (harder leverage) → (5) Ankle weights when available. No band needed to keep progressing for a long time.',tags:['glute_med']},
  {id:'fire_hydrant',name:'Fire Hydrant',muscle:'hips',type:'stability',eq:['bodyweight'],rMin:12,rMax:15,rest:60,noWeight:true,cue:'Hands and knees (quadruped). Lift one knee out to the side — drive from the hip, not by rotating your torso. Keep hips level and core braced. Slow and controlled. Count per side.\n\nProgression without bands: (1) Build reps → (2) Add a 2s pause at peak → (3) Slow negative to 3 counts → (4) Add small circles at the top → (5) Progress to a higher, fuller ROM → (6) Ankle weights when you have them.',tags:['glute_med']},
  {id:'side_lying_abduct',name:'Side-lying Hip Abduction',muscle:'hips',type:'stability',eq:['bodyweight'],rMin:15,rMax:20,rest:60,noWeight:true,cue:'Straight leg lift to ~45°. Foot slightly flexed, toes angled slightly downward (internal rotation targets glute med better). Slow negative — do not drop. Keep lower back out of it. Count per side.\n\nProgression without bands: (1) Build reps with 2s pause at top → (2) Slow negative to 3 counts → (3) Add small leg circles at peak height → (4) Elevate slightly (lying on bed edge, leg off the side) for more ROM → (5) Ankle weights are the final step.',tags:['glute_med']},
  {id:'copenhagen_plank',name:'Copenhagen Plank',muscle:'hips',type:'stability',eq:['bodyweight'],rMin:20,rMax:40,rest:60,noWeight:true,isTimed:true,cue:'Side plank with top foot on a bench, bottom leg hanging. Hold for time — count seconds. Targets adductors and lateral hip, muscles often neglected with impingement.\n\nProgression: (1) Start with knee (not foot) on the bench for an easier version → (2) Foot on bench, bottom leg on floor → (3) Foot on bench, bottom leg raised off floor (hardest bodyweight version) → (4) Add a small hip dip at the bottom of each rep → (5) Elevate the bench higher.',tags:['adductor','lateral']},
  {id:'hip_90_90',name:'90/90 Hip Stretch',muscle:'hips',type:'mobility',eq:['bodyweight'],rMin:30,rMax:60,rest:30,noWeight:true,isTimed:true,cue:'Sit with both knees at 90°. Front leg externally rotated, back leg internally rotated. Lean forward over your front shin to the max comfortable stretch (PAILS/RAILS): hold, then gently push the front knee into the floor for 5s (contract the stretched muscle), relax, then use the back leg to pull yourself deeper for 5s (assisted by the antagonist) — repeat 2-3x per side. This targets hip internal rotation, which is often restricted with impingement. Count seconds per side.',tags:['mobility','internal_rotation']},
  {id:'hip_flexor_half_kneel',name:'Half-Kneeling Hip Flexor Stretch',muscle:'hips',type:'mobility',eq:['bodyweight'],rMin:30,rMax:60,rest:30,noWeight:true,isTimed:true,cue:'Down knee on pad, front foot forward. FIRST: posteriorly tilt your pelvis (tuck tailbone). THEN drive hips forward. That pelvic tilt is the key — without it you compress the hip instead of stretching the flexor. Hold, breathe. Count seconds per side.',tags:['mobility','hip_flexor']},
  {id:'hip_cars',name:'Hip CARs',muscle:'hips',type:'mobility',eq:['bodyweight'],noWeight:true,rMin:5,rMax:8,rest:30,cue:'Stand near wall for balance. Lift one knee high, then rotate it OUT and sweep the full circle (Controlled Articular Rotation). Goal is to find and explore your full active range. Go slow — speed defeats the purpose. Squeeze glute at the back. Count full circles per side.',tags:['mobility','rotation']},
  // Hip Airplanes (2026-08-03, Sam asked for these by name). The standing
  // single-leg sibling of Hip CARs: same FRC premise of owning rotation actively
  // rather than stretching into it, but on ONE leg and hinged, so the stance hip
  // has to control rotation while bearing bodyweight. That is the specific quality
  // an FAI hip is usually missing.
  //
  // WHY THIS DOESN'T CONTRADICT THE HIP RULE. The constraint is no LOADED
  // end-range rotation (which is why woodchop is on avoidExercises). This is
  // bodyweight, and — the part that matters — the range is self-selected: you only
  // rotate as far as you can control and return from, which by definition stops
  // short of the passive end range where a cam impinges. hip_cars is already in
  // the pool on exactly that reasoning, and hip_90_90 deliberately trains internal
  // rotation because impingement restricts it. Same family, same logic.
  //
  // Cued EXTERNAL rotation first and further, because internal rotation in hip
  // flexion is the FAI provocation position — the hinge already supplies the
  // flexion, so IR is the direction to be conservative in here. Not flagged
  // hipRisk: the pinch cue and the self-limited range are the safety mechanism,
  // the same way tricep_dips relies on its depth cap.
  {id:'hip_airplane',name:'Hip Airplane',muscle:'hips',type:'mobility',eq:['bodyweight'],noWeight:true,rMin:5,rMax:8,rest:45,cue:'Stand on one leg with a hand on a wall or rack for balance. Hinge forward until the torso and the free leg are roughly parallel to the floor, in one line from head to heel — that shape is held throughout and never changes. Now rotate the PELVIS over the stance hip: open the free hip up toward the ceiling (external rotation), pause, then slowly rotate it back down and under (internal rotation) — the torso and spine stay still, all the movement happens at the stance hip. Slow enough that you could stop anywhere and hold it; if you cannot, you have gone past your active range, which is the whole thing this trains. Left hip: go FURTHER opening up than rotating under, and back off at the first hint of a pinch in the front of the joint — that is the bony limit, not a stretch. Count full cycles per side.',tags:['mobility','rotation','unilateral','stability']},
  // ─── Hip Flexor Rehab (strengthening entry points) ───
  {id:'straight_leg_raise',name:'Straight Leg Raise',muscle:'hips',type:'stability',eq:['bodyweight'],rMin:8,rMax:15,rest:60,noWeight:true,cue:'Lie on your back, one knee bent (foot flat), the other leg straight. Tighten the quad to lock the knee, then lift the straight leg to the height of the bent knee. Slow, controlled — no jerking. Lower under control without touching down between reps. A safe low-level entry point for hip-flexor and quad strength. Count per side.\n\nProgression: (1) build strict reps → (2) add a 2s hold at the top → (3) slow the lower to 3 counts → (4) add an ankle weight.',tags:['rehab','hip_flexor']},
  {id:'hip_flexor_rock_back',name:'Eccentric Hip Flexor Rock Back',muscle:'hips',type:'stability',eq:['bodyweight'],rMin:6,rMax:10,rest:60,noWeight:true,cue:'Half-kneeling (down knee on a pad), front foot planted. Keeping a tall torso and a posterior pelvic tilt (tuck the tailbone), slowly rock your hips BACK over the down leg — loading the hip flexor as it lengthens — then return. The control on the way back is the point: a slow eccentric is what builds tolerance in an irritated hip flexor. Stop short of any pinch. Count per side.',tags:['rehab','hip_flexor','eccentric']},
  {id:'hip_flexor_90_90',name:'90/90 Knee Extension Hold',muscle:'hips',type:'stability',eq:['bodyweight'],rMin:15,rMax:40,rest:45,noWeight:true,isTimed:true,cue:'Sit tall on the floor or a low box, hips and knees at 90°. Brace your core, then actively lift one foot to straighten the knee toward extension and HOLD — the hip flexor and quad fire isometrically to keep the thigh up. Keep the spine tall, don\'t lean back. A band over the shin or light ankle weight adds load. Count seconds per side.',tags:['rehab','hip_flexor','isometric']},

  // Athletic/Performance focused exercises
  {id:'burpees',name:'Burpees',muscle:'core',type:'compound',eq:['bodyweight'],noWeight:true,rMin:8,rMax:15,rest:120,cue:'Drop to push-up, jump feet back in, explosive jump up with hands overhead. Full-body power endurance. Focus on smooth transitions and explosive jump.',tags:['plyometric','conditioning'],highSweat:true},
  {id:'mountain_climbers',name:'Mountain Climbers',muscle:'core',type:'compound',eq:['bodyweight'],noWeight:true,rMin:20,rMax:40,rest:90,cue:'High plank position, drive knees to chest alternating rapidly. Keep hips level, core tight. Think sprinting in plank position. Count total reps (both legs).',tags:['conditioning','anti-extension'],highSweat:true},
  {id:'jump_squats',name:'Jump Squats',muscle:'legs',type:'compound',eq:['bodyweight'],noWeight:true,rMin:8,rMax:12,rest:120,cue:'Squat down, then explode up into a jump. Land softly, immediately into next rep. Focus on rate of force development. Each rep should be max effort.',tags:['plyometric','quad','power'],highSweat:true},
  {id:'lateral_bounds',name:'Lateral Bounds',muscle:'legs',type:'compound',eq:['bodyweight'],noWeight:true,rMin:6,rMax:10,rest:120,cue:'Single-leg lateral jump, stick the landing on one foot, then bound back to other side. Focus on distance and landing control. Athletic power in frontal plane. Count per side.',tags:['plyometric','unilateral','lateral'],highSweat:true},
  {id:'single_leg_bounds',name:'Single-Leg Forward Bounds',muscle:'legs',type:'compound',eq:['bodyweight'],noWeight:true,rMin:6,rMax:8,rest:150,cue:'Single-leg hop forward for distance, stick the landing, repeat on same leg. Focus on distance and landing mechanics. Builds unilateral power and stability. Count per leg.',tags:['plyometric','unilateral','power'],highSweat:true},
  {id:'bear_crawl',name:'Bear Crawl',muscle:'core',type:'compound',eq:['bodyweight'],noWeight:true,rMin:20,rMax:40,rest:90,cue:'Hands and toes, knees hovering. Crawl forward moving opposite hand/foot together. Keep hips level, core tight. Great for shoulder stability and core strength. Count steps.',tags:['crawling','stability'],highSweat:true},
  {id:'turkish_getup_bw',name:'Turkish Get-up (Bodyweight)',muscle:'core',type:'compound',eq:['bodyweight'],noWeight:true,rMin:3,rMax:6,rest:150,cue:'Complex movement from lying to standing. Focus on smooth transitions and stability at each position. Master the movement before adding weight. Ultimate full-body coordination exercise. Count per side.',tags:['complex','stability','coordination'],highSweat:true},
  {id:'archer_pushup',name:'Archer Push-ups',muscle:'chest',type:'compound',eq:['bodyweight'],noWeight:true,rMin:4,rMax:8,rest:180,cue:'Wide hand position, shift weight to one arm during the push-up. Builds unilateral strength toward one-arm push-up. Control the eccentric phase. Count per side.',tags:['unilateral','advanced']},
  // Foundation Five movement. 'eccentric' added 2026-07-28 and it matters:
  // LEG_EMPHASIS_TAGS/legAutoOK gate the legs pool to emphasis-tagged work, and
  // without one of those tags this was UNREACHABLE by every normal pick path —
  // simulation showed it landing 0 weeks out of 6 on both a lunch-only and a
  // full lunch+evening schedule. The tag is honest, not a workaround: the slow
  // full-depth descent on one leg IS the loaded eccentric, which also makes it
  // a legitimate candidate for the 'eccentric' leg-accent slot. Deliberately
  // NOT tagged 'strength' — that pool is the heavy loaded 1–5 @ 85–95% tier,
  // and a bodyweight movement must not be able to satisfy that guarantee.
  {id:'pistol_squat',name:'Pistol Squat',muscle:'legs',type:'compound',eq:['bodyweight'],noWeight:true,rMin:3,rMax:6,rest:180,cue:'Single-leg squat to full depth, free leg extended forward. Lower SLOWLY — a 3–4 count descent is the whole exercise; dropping into the hole wastes it. Free hand out for balance, heel stays down. Regressions all count: hold a rack upright, sit back to a bench and stand up off one leg, or drop to a box and lower the box height as you get stronger. Count per leg, and match the reps on the weaker side.',tags:['unilateral','advanced','squat','eccentric']},
  {id:'handstand_pushup',name:'Handstand Push-up',muscle:'shoulders',type:'compound',eq:['bodyweight'],noWeight:true,rMin:3,rMax:8,rest:180,cue:'Inverted push-up against wall. Lower head to floor, press back up. Builds shoulder and core strength. Progress from pike push-ups. Advanced bodyweight movement. Count reps.',tags:['inverted','advanced']},
  {id:'l_sits',name:'L-Sit',muscle:'core',type:'isolation',eq:['bodyweight'],rMin:10,rMax:30,rest:120,isTimed:true,cue:'Sit with legs extended, hands flat, lift entire body off ground. Hold position with straight legs parallel to floor. Incredible core and shoulder strength builder. Count seconds.',tags:['isometric','advanced']},
  // Posture corrector: the anti-desk-hunch hold. Chest opens and shoulders
  // extend BACKWARD — the opposite direction of the whole workday — while the
  // posterior chain (glutes, hamstrings, rear delts, spinal erectors) works to
  // keep the hips lifted. Pairs naturally with the Desk Reversal primer and
  // the upper-back stretch pool as another angle on the same chronic stiffness.
  {id:'reverse_plank',name:'Reverse Plank',muscle:'core',type:'isolation',eq:['bodyweight'],rMin:20,rMax:45,rest:75,isTimed:true,cue:'Sit with legs extended, hands flat on the floor just behind your hips, fingers pointing toward your feet (or turned out slightly if the wrists complain). Press down through the hands to lift the hips until your body forms a straight line from heels to shoulders — chest open, head neutral, don\'t let the hips sag. Squeeze the glutes to hold. Regress with bent knees (tabletop reverse plank) if a straight-leg hold breaks form. Count seconds.',tags:['isometric','posture','glute']},
  {id:'broad_jump',name:'Broad Jump',muscle:'legs',type:'compound',eq:['bodyweight'],noWeight:true,rMin:5,rMax:8,rest:150,cue:'Two-foot takeoff, jump forward for maximum distance, land softly on both feet. Focus on explosive hip extension and soft landing mechanics. Reset between reps. Count jumps.',tags:['plyometric','power','bilateral']},
  {id:'continuous_broad_jumps',name:'Continuous Broad Jumps',muscle:'legs',type:'compound',eq:['bodyweight'],noWeight:true,rMin:5,rMax:8,rest:90,cue:'Two-foot takeoff into the next jump immediately on landing — minimal ground contact time. Reset only at the end of the set. Land soft and absorb before exploding into the next rep. Grass preferred. Count jumps.',tags:['plyometric','power','bilateral'],highSweat:true},
  {id:'skater_jumps',name:'Skater Jumps',muscle:'legs',type:'compound',eq:['bodyweight'],noWeight:true,rMin:6,rMax:10,rest:90,cue:'Lateral bound from one foot to the other, like a speed skater. Land soft on the outside foot, hold briefly, then push off into the next bound. Count per side.',tags:['plyometric','unilateral','lateral'],highSweat:true},
  {id:'lateral_bound_broad_jump',name:'Lateral Bound into Broad Jump',muscle:'legs',type:'compound',eq:['bodyweight'],noWeight:true,rMin:4,rMax:6,rest:120,cue:'Lateral bound to one side, stick the landing on one foot, then immediately broad jump forward off that foot for distance. Reset between combos. Count combos per side.',tags:['plyometric','unilateral','power'],highSweat:true},
  // ─── Bounce/reactive jump pool (vertical-jump work) ───
  // All tagged 'plyometric'. Under hip caution, only the lowImpact:true subset
  // (chair & JAPAP jumps, pogo/plate/line hops — quiet ankle work or single max
  // efforts, no repeated hard landings) surfaces; the true impact plyos below
  // (depth jumps, single-leg drops, bounds) stay hidden. See plyoHidden().
  {id:'chair_jumps',name:'Chair Jumps',muscle:'legs',type:'compound',eq:['bodyweight'],rMin:4,rMax:8,rest:150,noWeight:true,cue:'Sit fully on a chair or bench, feet planted. From the dead-stop seated position — no rocking — explode straight up into a maximal jump. Sitting kills the stretch reflex, forcing pure starting strength from the hips and quads. Land soft, sit back down, fully reset each rep.',lowImpact:true,tags:['plyometric','power','quad'],highSweat:true},
  {id:'depth_jumps',name:'Depth Jumps',muscle:'legs',type:'compound',eq:['bodyweight'],rMin:3,rMax:6,rest:180,noWeight:true,cue:'Step (don\'t jump) off a knee-height box. The instant you touch down, explode straight up as high as possible — minimal ground time, like the floor is hot. THE classic reactive-strength builder, and among the most demanding: quality over volume, full rest between reps, stop the moment jump height drops.',tags:['plyometric','power'],highSweat:true},
  {id:'sl_depth_drop',name:'Single-Leg Depth Drop Jump',muscle:'legs',type:'compound',eq:['bodyweight'],rMin:3,rMax:5,rest:180,noWeight:true,cue:'Step off a LOW box (start ~6 in) and land on one leg, absorbing quietly with a stiff ankle — then immediately jump back up off that same leg. Single-leg reactive strength is what one-foot jumpers actually run on. Keep the box low until landings are silent. Count per side.',tags:['plyometric','unilateral','power'],highSweat:true},
  {id:'japap_jumps',name:'JAPAP Jumps',muscle:'legs',type:'compound',eq:['bodyweight'],rMin:4,rMax:6,rest:180,noWeight:true,cue:'Jump As high As Possible: full approach or standstill, gather, and put 100% intent into one maximal vertical jump. Land soft — absorb straight down through the hips and knees, never a stiff or twisting landing — then walk it off, fully reset, and repeat. Nothing builds jump height like actually jumping at max intent while fresh — every rep is a genuine attempt at a personal best, never a rhythm rep.',lowImpact:true,tags:['plyometric','power'],highSweat:true},
  {id:'pogo_hops',name:'Pogo Hops',muscle:'legs',type:'isolation',eq:['bodyweight'],rMin:10,rMax:20,rest:120,noWeight:true,cue:'Legs nearly straight, hands on hips or reaching tall. Bounce off the floor using ONLY the ankles — knees barely bend — with the shortest ground contact you can manage, like a pogo stick. Height comes from ankle stiffness, not knee bend. The direct upgrade from Springy Calf Bounces once your feet leave the floor.',lowImpact:true,tags:['plyometric','calf','tendon'],highSweat:true},
  {id:'plate_hops',name:'Plate Hops',muscle:'legs',type:'isolation',eq:['bodyweight'],rMin:8,rMax:12,rest:120,noWeight:true,cue:'Stand in front of a bumper plate (or low step). Quick two-foot hops up onto the plate and back down, minimal ground contact both directions, stiff ankles. The tiny height keeps it about foot speed and reactivity, not power — crisp rhythm, quiet landings.',lowImpact:true,tags:['plyometric','calf','tendon'],highSweat:true},
  {id:'line_hops',name:'Line Hops',muscle:'legs',type:'isolation',eq:['bodyweight'],rMin:20,rMax:40,rest:90,noWeight:true,cue:'Feet together, hop side-to-side over a line (or front-to-back) as FAST as possible with the shortest ground contacts you can hit — count total touches. Ankles stay stiff, heels never settle. Foot quickness and ankle reactivity; also a great low-box drill for ground-contact rhythm.',lowImpact:true,tags:['plyometric','calf','tendon'],highSweat:true},
  {id:'lunge_hops',name:'Lunge Hops',muscle:'legs',type:'compound',eq:['bodyweight'],rMin:5,rMax:8,rest:150,noWeight:true,cue:'From the bottom of a lunge, explode straight up and switch legs mid-air, landing soft in a lunge on the other side — immediately into the next rep. Unilateral reactive power with a big hip-flexor stretch-shorten each switch. Count per side; stop when the switch gets sloppy.',tags:['plyometric','unilateral','power'],highSweat:true},
  {id:'u_hops',name:'U Hops',muscle:'legs',type:'compound',eq:['bodyweight'],rMin:6,rMax:10,rest:120,noWeight:true,cue:'Two-foot hops tracing a "U" shape — down one side, across the bottom, up the other side — then reverse. The constant direction change trains lateral ankle/knee stiffness and landing control in every plane. Quick contacts, quiet feet. One full U = one rep.',tags:['plyometric','lateral','tendon'],highSweat:true},
  {id:'sl_lunge_bounds',name:'Single-Leg Lunge Bounds',muscle:'legs',type:'compound',eq:['bodyweight'],rMin:4,rMax:6,rest:150,noWeight:true,cue:'From a lunge position, bound forward off the FRONT leg for distance, landing in a lunge with the same leg forward — walk back or reset between reps. Drives horizontal single-leg power out of a deep hip position, the pattern behind acceleration and one-foot takeoffs. Count per side.',tags:['plyometric','unilateral','power'],highSweat:true},
  {id:'atg_jump_squats',name:'ATG Jump Squats',muscle:'legs',type:'compound',eq:['bodyweight'],rMin:5,rMax:8,rest:150,noWeight:true,cue:'Sink to FULL depth — hamstrings to calves — under control, then explode straight up into a jump from the very bottom. Land soft, sink straight back to full depth, repeat. Builds explosive strength through the deepest knee range, where most jumpers leak power. Quality over height; stop when depth or landings degrade.',tags:['plyometric','quad','power'],highSweat:true},

  // Circuit Training Exercises
  {id:'burpee_to_jump',name:'Burpee to Jump Squat',muscle:'legs',type:'compound',eq:['bodyweight'],noWeight:true,rMin:8,rMax:12,rest:60,cue:'Burpee down, jump feet in, explosive jump squat up with arms overhead. Land softly, immediately into next rep. High-intensity circuit finisher.',tags:['circuit','plyometric','conditioning'],highSweat:true,circuit:true},
  {id:'kb_swings_circuit',name:'KB/DB Swings',muscle:'legs',type:'compound',eq:['dumbbells'],rMin:15,rMax:20,rest:60,cue:'Hip hinge power movement. Drive hips forward explosively, weight rises to chest height. High-rep circuit style with continuous movement.',tags:['circuit','power','conditioning'],highSweat:true,circuit:true},
  {id:'thrusters',name:'DB Thrusters',muscle:'shoulders',type:'compound',eq:['dumbbells'],rMin:10,rMax:15,rest:60,cue:'Front squat into overhead press in one fluid motion. Shoulders, legs, and cardio all in one. Keep moving between reps.',tags:['circuit','conditioning','full-body'],highSweat:true,circuit:true},
  {id:'man_makers',name:'Man Makers',muscle:'chest',type:'compound',eq:['dumbbells'],rMin:6,rMax:10,rest:60,cue:'Push-up with DBs, row each arm, jump feet in, thruster up. Full-body circuit exercise. Rest briefly between reps but keep moving.',tags:['circuit','conditioning','full-body'],highSweat:true,circuit:true},
  {id:'battle_ropes',name:'Battle Ropes (Alternating)',muscle:'core',type:'compound',eq:['bodyweight'],rMin:30,rMax:60,rest:60,isTimed:true,cue:'Alternating arm waves. Keep core tight, generate power from shoulders. High-intensity interval exercise. Count seconds.',tags:['circuit','conditioning','cardio'],highSweat:true,circuit:true},
];

// ─── LAST-SET INTENSITY TECHNIQUES ───
// Shown on the FINAL working set only, never earlier: both techniques add
// fatigue disproportionate to their volume, so they belong where they can't
// degrade the quality of the sets that follow. Explicit id lists rather than a
// tag rule — "does this movement have a loaded stretch position" isn't
// derivable from muscle+type, and guessing wrong prescribes partials on a
// movement whose bottom third is its weakest, least useful range.
//
// LENGTHENED PARTIALS: after the last full rep, keep going with short reps in
// the STRETCHED third until failure. The evidence favouring long-muscle-length
// training is strongest exactly here, and it's free volume at the end of a set
// that's already there. Limited to movements whose stretch position is both
// loaded and safe to fail in — nothing overhead, nothing where failing at the
// bottom pins you.
const LENGTHENED_PARTIAL_IDS=new Set(['seated_leg_curl','leg_curl','calf_raise','single_leg_calf_raise',
  'db_lateral','cable_lateral','lying_cable_lat','incline_lateral','machine_lateral',
  'cable_fly','db_fly','pec_deck','rev_fly','pec_deck_rev_fly','straight_pull',
  'incline_curl','bayesian_curl','cable_curl','overhead_ext','db_overhead_ext','leg_ext']);
// ONE-AND-A-QUARTER REPS: full rep, then a quarter rep back out of the bottom,
// then finish — doubling time spent in the hardest, most stretched position.
// For compounds where the bottom is the sticking point and a partial there is
// controllable. Deliberately NOT on the heavy 1–5 strength tier: near-max
// singles don't need extra bottom-range time, they need bar speed.
const QUARTER_REP_IDS=new Set(['incline_db','flat_db_press','machine_press','pullups','chinups',
  'lat_pulldown','cable_row','db_row','bulgarian','goblet','sumo_squat','leg_press','reverse_lunge','step_ups']);
function lastSetTechnique(ex){
  if(!ex||ex.isTimed||(ex.tags||[]).some(t=>['power','ballistic','plyometric','overcoming','strength'].includes(t)))return'';
  if(LENGTHENED_PARTIAL_IDS.has(ex.id))return'After your last full rep, keep going with 3–5 <strong>lengthened partials</strong> — short reps in the bottom (stretched) third until you can\'t. Free stimulus where the muscle is longest.';
  if(QUARTER_REP_IDS.has(ex.id))return'Try <strong>1¼ reps</strong> this set: full rep down, come up a quarter, sink back to the bottom, then finish. Doubles time in the stretched position where the work is hardest.';
  return'';
}

// Leg programming is restricted to an explosive + tendon-stiffness emphasis:
// a leg movement is only AUTO-selectable (by templates or backfill) if it
// carries one of these tags. Everything else in the leg pool — back squats,
// RDLs, leg press, machine curls, plain calf raises, glute isolation — is pure
// hypertrophy/strength and is excluded from auto-generation everywhere (it
// stays in the EX database for manual/custom logging). Using an allowlist
// rather than naming each retired lift means any leg exercise added later is
// excluded by default unless explicitly tagged for the emphasis.
// 'plyometric' is allowed here (it's explosive) but still filtered separately

// selection, it's a short list of high-return movements repeated often enough

// a floor, so travel, equipment, or a short day can't be the reason one gets

// already logged this calendar week is covered and stops being stamped, so the

function foundationCoveredThisWeek(){

// ─────────────────────────────────────────────
// THE PULL-UP CENTURY
// ─────────────────────────────────────────────
// 100 pull-ups in a session, however many sets it takes, 2–3× a week. The
// TARGET never moves — the set count is the progress metric (10+ sets early, a
// handful by the end). That's what makes it self-scaling: it gets easier as
// strength rises and bodyweight falls without the prescription ever being
// rewritten, and no week needs a new plan.
//
// Two things keep it from being a recovery hole:
//  1) Every set ends 2+ reps SHORT of failure. Stimulus and fatigue both scale
//     with proximity to failure, so submaximal accumulation buys a lot of reps
//     cheaply — which is why this can run 3×/week for months instead of
//     wrecking the elbows and shoulders. It's also why century sets are
//     counted at HALF weight in getWeeklySetVolumes / getMRVBreakdown: 10
//     easy sets do not cost what 10 hard sets cost, and counting them at face
//     value would eat the week's entire back MRV and crowd out the mandated
//     row / rear-delt work.
//  2) Century days are spaced ≥48h apart and capped at 3/week (centuryDows).
//
// Logged as isCardio:true — the same "invisible to session bookkeeping" flag
// the VO2 log uses, so a century never marks a day completed, never locks that
// day's lifting template to itself, and never consumes one of the two daily
// lifting slots. Its `exercises` array is still populated, so it DOES count
// toward weekly MRV volume (which is what protects recovery here).
const PULLUP_CENTURY={target:100,maxDays:3,restCap:180};
// What one century costs against weekly back MRV. Flat, because the WORK is
// flat — see the note in getWeeklySetVolumes on why costing it by set count
// made the same 100 reps progressively cheaper as the set count came down.
const CENTURY_MRV_SETS=3;
// Century days come from AVAILABILITY, never from the generated program:
// dayTemplate consults this during generation, so reading S.program here would
// be circular (the same trap documented on getMRVLimits). Walks the week in
// calendar order and takes every third ELIGIBLE day, which is the ≥48h spacing
// the protocol needs.
//
// ELIGIBILITY (2026-08-03, from Sam): any available training day qualifies,
// INCLUDING a YMCA lunch. A lunch century was briefly gated out on the theory
// that it needs a bar you can monopolize, but Sam's call is that it fits — it
// just costs roughly 20 minutes of a 40-minute lunch right now. That cost is

// The Century card defers to it rather than asking for a second hundred.
function pyramidCoversCentury(log){
  const pull=(log?.exercises||[]).find(e=>e&&e.muscle==='back');
  return !!pull&&pyramidRepsOf(pull)>=PULLUP_CENTURY.target;
}

// ─────────────────────────────────────────────
// THE LUNCH TIME LEDGER
// ─────────────────────────────────────────────
// A lunch is a hard 40 minutes with no shower. The old model was a flat
// "3 exercises, minus some if it's a Century day", which charged for the
// lifting and the century and nothing else — so two things that happen at
// every single lunch were invisible to it:
//
//   1) DAILY_SPINE_MINIMUMS. Four fixed holds, ~5 minutes, done every day.
//   2) The conditioning FINISHER. The whole lunchOK subset exists to be done
//      at lunch and every one of them declares its own `mins` (8–10), none of
//      which were ever subtracted from anything.
//
// Reported 2026-08-03: a lunch ran 43 minutes for the workout, the spine work
// and 26 pull-ups, with no finisher at all. That is the ledger's own arithmetic
// showing up on a clock — the box was being spent three ways and counted one.
//
// So the budget is now an actual ledger: box − spine − century − lifts, and a
// finisher only appears if what's left covers it. Lifting is filled first
// because it's the point of the session and the finisher is the bonus; the
// practical consequence at 40 minutes is that a lunch finisher needs the day to
// be both century-free AND short on lifts, which is honest — it is roughly
// never, and the card claiming otherwise is what made lunches overrun.
const LUNCH_LEDGER={
  spineMins:5,   // DAILY_SPINE_MINIMUMS: 60s + 2min + 60s + 60s
  exMins:11,     // per exercise, DEFAULT ONLY — lunchExMins() measures the real one
  maxLifts:3,    // the 2026-07-14 time-box calibration; 4 ran ~7 min long
  minLifts:1,    // a century day never becomes a no-lifting day
};
// The per-exercise rate, measured rather than assumed — same principle as
// centuryMins(). Only CENTURY-FREE lunches calibrate it, because on a century
// day the two unknowns (rate per lift, minutes per century) can't be separated
// from one number. Only `measured` logs count: finishWorkout falls back to a
// set-count ESTIMATE when the timer was left running, and feeding an estimate
// back in as if it were a measurement is the exact circularity the century's
// timedMins/duration split exists to prevent.
function lunchExMins(){
  const centuryDates=new Set(centuryLogs().map(l=>logDay(l.date)));
  const rates=(S.logs||[])
    .filter(l=>l&&l.isLunch&&!l.isCardio&&l.measured&&l.duration>0&&(l.exercises||[]).length)
    .filter(l=>!centuryDates.has(logDay(l.date)))
    .slice(-5)
    .map(l=>(l.duration-LUNCH_LEDGER.spineMins)/l.exercises.length)
    .filter(m=>m>3&&m<30) // discard nonsense: an abandoned or mis-timed session
    .sort((a,b)=>a-b);
  if(!rates.length)return LUNCH_LEDGER.exMins;
  return rates[Math.floor(rates.length/2)];
}
// Everything that spends the lunch box, in priority order. `av` is passed
// explicitly during generation for the same reason centuryDows takes it —
// reading S.program mid-generation would be circular.
function lunchBudget(dow,av,boxMins){
  const box=boxMins||40;
  const spine=LUNCH_LEDGER.spineMins;
  const century=centuryDows(av).includes(dow)?centuryMins():0;
  const per=lunchExMins();
  let left=box-spine-century;
  const lifts=Math.max(LUNCH_LEDGER.minLifts,Math.min(LUNCH_LEDGER.maxLifts,Math.floor(left/per)));
  left-=lifts*per;
  // A finisher has to be affordable TWICE OVER before it's offered.
  //  1) Never on a century day. 100 pull-ups already IS the conditioning, and
  //     stacking a circuit on top is precisely the recovery hole PULLUP_CENTURY
  //     is spaced and capped to avoid. Without this the arithmetic did the
  //     opposite of what anyone would want: a 1-lift century day "saves" the
  //     unspent remainder of the lift that didn't fit (8 of 11 min) and buys a
  //     finisher with it, while an ordinary 3-lift lunch has only 2 min spare
  //     and gets none — the tightest day of the week was the one getting extra
  //     work. Worse, it depended on WHICH day: getFinisher rotates by dow, so
  //     an 8-min circuit slipped in and a 10-min one didn't. Caught by driving
  //     the deployed build, not by the headless sim, which happened to land on
  //     a 10-min day.
  //  2) Leave a real margin. `left` is a flooring remainder, not free time —
  //     spending it to the last minute is how a 40-minute lunch becomes 43.
  const FINISHER_MARGIN_MINS=2;
  const f=(S.cfg?.conditioning&&!century)?getFinisher(dow,true):null;
  const finisher=(f&&left>=(f.mins||8)+FINISHER_MARGIN_MINS)?f:null;
  if(finisher)left-=(finisher.mins||8);
  return{box,spine,century,per:Math.round(per*10)/10,lifts,finisher,left:Math.round(left)};
}

// Dragon Flag progression track: Tier 1 (Lying Leg Lifts) is always offered;
// Tier 2/3 unlock only after logging 10+ reps in a single set on the tier
// directly before it — an automatic gate rather than a manual "mark achieved"
// button, read straight from the workout log.
const DRAGON_FLAG_TRACK=['leg_lifts_lying','dragon_flag_bent','dragon_flag_full'];
const hasLoggedRepsOf=(exId,minReps)=>(S.logs||[]).some(l=>!l.isCardio&&(l.exercises||[]).some(e=>e.id===exId&&(e.sets||[]).some(s=>s&&s.reps>=minReps)));
function dragonFlagUnlocked(exId){
  const idx=DRAGON_FLAG_TRACK.indexOf(exId);
  if(idx<=0) return true; // tier 1, or not part of the track
  return hasLoggedRepsOf(DRAGON_FLAG_TRACK[idx-1],10);
}

function pickEx(slot,equip,used,isLunch,budget,freq){
  const eq=new Set([...equip,'bodyweight']);
  const overworkedMuscles = getOverworkedMuscles();
  const isCircuitStyle = S.weekPlan?.cardioStyle === 'circuits';

  // Combine built-in exercises with custom exercises
  const allExercises = [...EX, ...(S.customExercises||[])];

  // MRV headroom: would adding this exercise push the muscle past its weekly max?
  const perEx = (budget && budget.perExercise) || 3;
  const fitsMRV = (e) => {
    if(!budget || !budget.limits || !budget.limits[e.muscle]) return true;
    return (budget.vol[e.muscle] || 0) + perEx <= budget.limits[e.muscle].max;
  };

  // Rolling-week movement frequency (seeded from the past 7 days of history plus
  // whatever this generation run has already assigned). Used to (a) cap how often
  // a single movement repeats in the microcycle and (b) spread variety across
  // days instead of deterministically returning the first match every time.
  const f = freq || {};
  const FREQ_CAP = 2; // max appearances of one movement per rolling 7-day window
  const freqOf = (e) => f[e.id] || 0;

  // Shared slot constraints (muscle/type/tag/equipment/hip-caution/lunch sweat).
  // Hip-caution mode also bans plyometrics (impact loading on a sensitive hip)
  // — that volume is redistributed to the remaining non-impact pool, which
  // includes eccentric tendon work like the Nordic curl.
  // Leg-exercise gate: Knee-Caution mode (when on) is an absolute whitelist
  // that overrides everything else for legs — it exists to hand-pick a small
  // knee-safe set, not to layer on top of the explosive/tendon emphasis gate.
  // Otherwise legAutoOK's emphasis-tag restriction applies as normal, except
  // for the hamstring mandate's 'hinge'/'hamstring' slots (see legAutoOK),
  // which guarantee RDL/hip-hinge and leg-curl-family work regardless.
  const legGateOK = (e) => {
    if(e.muscle!=='legs') return true;
    if(S.cfg.kneeCaution) return KNEE_SAFE_IDS.has(e.id);
    return slot.tag==='hinge'||slot.tag==='hamstring'||legAutoOK(e);
  };
  // baseFor lets the type-relax tier below re-run the same constraint set with
  // only the slot's type swapped — one source of truth for the safety filters.
  const baseFor = (sl) => (e) =>
    e.muscle===sl.muscle && e.type===sl.type &&
    (!sl.tag || ((e.tags||[]).includes(sl.tag))) &&
    !used.includes(e.id) &&
    e.eq.some(q=>eq.has(q)) &&
    legGateOK(e) &&
    !(S.cfg.hipCaution && e.hipRisk) &&
    !(S.cfg.shoulderCaution && e.shoulderRisk) &&
    !plyoHidden(e) &&
    !userAvoids(e) &&
    dragonFlagUnlocked(e.id) &&
    !(isLunch && e.highSweat);
  const base = baseFor(slot);

  // Among the candidates, take the LEAST-used movement (lowest weekly frequency),
  // breaking ties by EX array order — so a slot that recurs across days rotates
  // through the available movements instead of repeating barbell bench every time.
  const leastUsed = (list) => list.length
    ? list.reduce((best,e)=> freqOf(e) < freqOf(best) ? e : best)
    : null;

  // ── Foundation Five mandate (highest precedence) ──
  // slot.foundationId names an EXACT movement — the weekly coverage guarantee
  // (see FOUNDATION_FIVE), not a preference, so it's returned ahead of every
  // tier below. Deliberately bypasses the type/tag/legAutoOK filters, since
  // two of the five are unreachable through them by construction (pistol_squat
  // has no emphasis tag; bear_crawl is a compound the core cycle can't select),
  // and bypasses the MRV/frequency caps — the same small, deliberate overage
  // the hinge/hamstring mandate already accepts, bounded by one stamp per
  // session and once per movement per week.
  // The SAFETY gates still apply in full: equipment on hand, the personal
  // avoid list, hip/knee caution, the plyo ban, and the lunch no-sweat rule.
  // Blocked by any of those → fall through to the normal tiers and the
  // movement waits for a session that can host it (dayTemplate re-stamps it
  // the next day, since coverage is only marked once it actually lands).
  if(slot.foundationId){
    const f=allExercises.find(e=>e.id===slot.foundationId);
    if(f && !used.includes(f.id) && (f.eq||[]).some(q=>eq.has(q)) &&
       !(S.cfg.hipCaution&&f.hipRisk) && !plyoHidden(f) && !userAvoids(f) &&
       !kneeCautionBlocks(f) && dragonFlagUnlocked(f.id) &&
       !(isLunch&&f.highSweat)) return f;
  }

  // For circuit training, prefer circuit-tagged exercises (still within MRV + cap)
  if(isCircuitStyle && !isLunch) {
    const circuitEx = leastUsed(allExercises.filter(e => base(e) && !overworkedMuscles.has(e.muscle) && fitsMRV(e) && freqOf(e)<FREQ_CAP && e.circuit));
    if(circuitEx) return circuitEx;
  }

  // Hybrid-athlete soft preference (goal: look like a bodybuilder, move like an
  // athlete): a powerPreferred slot tries explosive/ballistic variants first
  // (med ball slam, rotational throw, ...) and falls through to the normal
  // tiers below when none fit the equipment/caps — a bias, never a constraint.
  if(slot.powerPreferred && !isLunch) {
    const powerEx = leastUsed(allExercises.filter(e => base(e) && (e.tags||[]).includes('power') && !overworkedMuscles.has(e.muscle) && fitsMRV(e) && freqOf(e)<FREQ_CAP));
    if(powerEx) return powerEx;
  }

  // 1) Best: avoid overworked muscles, stay within MRV max, under the frequency cap
  let exercise = leastUsed(allExercises.filter(e => base(e) && !overworkedMuscles.has(e.muscle) && fitsMRV(e) && freqOf(e)<FREQ_CAP));
  // 2) Next: within MRV max + under cap (allow a recently-worked muscle if needed)
  if(!exercise) exercise = leastUsed(allExercises.filter(e => base(e) && fitsMRV(e) && freqOf(e)<FREQ_CAP));
  // 2.5) Type relaxed, still under the cap: some pools have no compound at all
  // (biceps: 0) or exactly one (triceps: tricep_dips) — a muscle's first
  // appearance in a template is typed 'compound' by construction, so without
  // this tier a biceps slot silently drops every time and a triceps slot pins
  // its lone compound past the weekly frequency cap. A FRESH isolation
  // movement beats both outcomes. Untagged slots only — mandate-tagged slots
  // (strength/hinge/hamstring/core) keep their own dedicated fallbacks below.
  const isoRelax = slot.type==='compound' && !slot.tag ? baseFor({...slot,type:'isolation'}) : null;
  if(!exercise && isoRelax) exercise = leastUsed(allExercises.filter(e => isoRelax(e) && fitsMRV(e) && freqOf(e)<FREQ_CAP));
  // 3) Cap relaxed: a constrained equipment pool may have no alternative left
  // under the cap — better to repeat a movement than to drop the slot entirely.
  if(!exercise) exercise = leastUsed(allExercises.filter(e => base(e) && fitsMRV(e)));
  // 3.5) Cap relaxed on the relaxed type — last stop before the slot drops for
  // a muscle whose pool has no compound and no fresh isolation left either.
  if(!exercise && isoRelax) exercise = leastUsed(allExercises.filter(e => isoRelax(e) && fitsMRV(e)));
  // 3.7) Accent softening: the power/eccentric/decel accent conversion is a
  // bias, never a mandate — an avoid-list/equipment-emptied accent pool (e.g.
  // shoulders 'power' with the push press family excluded for the lower back)
  // degrades back to the plain compound slot instead of dropping the muscle's
  // work and leaving the slot to untargeted backfill.
  if(!exercise && slot.muscle!=='core' && (slot.tag==='power'||slot.tag==='eccentric'||slot.tag==='decel')){
    const noTag=baseFor({...slot,tag:null});
    exercise = leastUsed(allExercises.filter(e=>noTag(e)&&fitsMRV(e)&&freqOf(e)<FREQ_CAP)) || leastUsed(allExercises.filter(e=>noTag(e)&&fitsMRV(e)));
  }
  // 4) Mandate override: 'hinge' and 'hamstring' slots exist specifically so a
  // leg session never trains quads/squats without also hitting the hamstrings
  // (squat patterns alone don't train them). Stacking two dedicated leg slots
  // in one session can burn through that muscle's weekly MRV headroom before
  // reaching this one — dropping it here would silently defeat the mandate via
  // the untagged backfill pass. A small, deliberate MRV overage on this single
  // corrective-pattern slot beats skipping hamstring/hinge work outright.
  if(!exercise && (slot.tag==='hinge'||slot.tag==='hamstring'||slot.tag==='strength')) exercise = leastUsed(allExercises.filter(e => base(e)));
  // Strength-tier fallback: the heavy 1–5 pool is barbell/DB — a bodyweight-only
  // session has zero candidates, and dropping the day's main leg slot would be
  // worse than downgrading it. Fall back to the old 'hinge' mandate pool.
  if(!exercise && slot.tag==='strength'){
    const hingeSlot={...slot,tag:'hinge'};
    const hingeBase=(e)=>e.muscle===hingeSlot.muscle && e.type===hingeSlot.type && (e.tags||[]).includes('hinge') &&
      !used.includes(e.id) && e.eq.some(q=>eq.has(q)) && !(S.cfg.hipCaution&&e.hipRisk) &&
      !plyoHidden(e) && !userAvoids(e) && !(isLunch&&e.highSweat) &&
      !(S.cfg.kneeCaution&&!KNEE_SAFE_IDS.has(e.id));
    exercise = leastUsed(allExercises.filter(e=>hingeBase(e)&&fitsMRV(e)&&freqOf(e)<FREQ_CAP)) || leastUsed(allExercises.filter(hingeBase));
  }
  // 5) Core-emphasis fallback: the rotating produce/resist tag on the forced
  // core slot is a preference, never worth dropping the slot over — retry with
  // the tag AND type relaxed (flexion work is type 'isolation', the rest
  // 'rotational') so some core work always lands.
  if(!exercise && slot.muscle==='core' && slot.tag){
    const anyCore=(e)=>e.muscle==='core' && !used.includes(e.id) && e.eq.some(q=>eq.has(q)) &&
      !(S.cfg.hipCaution&&e.hipRisk) && !plyoHidden(e) &&
      !userAvoids(e) && dragonFlagUnlocked(e.id) && !(isLunch&&e.highSweat);
    exercise = leastUsed(allExercises.filter(e=>anyCore(e)&&fitsMRV(e)&&freqOf(e)<FREQ_CAP)) || leastUsed(allExercises.filter(anyCore));
  }
  // If the muscle has hit its weekly MRV max, intentionally return null so this
  // slot is dropped (fewer sets) rather than exceeding the recoverable volume.
  return exercise||null;
}

// Backfill a freed session slot (dropped via lockout/MRV-max, or a template
// shorter than the time-based exercise limit) with a movement for whichever
// OTHER muscle has the most headroom below its weekly MRV max — so session
// time isn't wasted while useful volume still fits. Ranks muscles by deficit
// (max - committed), then tries compound/isolation/rotational for the most
// under-volumed muscle before moving to the next.
function pickBackfillEx(equip,used,isLunch,budget,exFreq,excludeMuscles){
  const limits=(budget&&budget.limits)||{};
  const perEx=(budget&&budget.perExercise)||3;
  const candidates=Object.keys(limits)
    .filter(m=>!(excludeMuscles&&excludeMuscles.has(m)))
    .map(m=>({m,deficit:limits[m].max-(budget.vol[m]||0)}))
    .filter(c=>c.deficit>=perEx)
    .sort((a,b)=>b.deficit-a.deficit);
  for(const {m} of candidates){
    for(const type of ['compound','isolation','rotational']){
      const e=pickEx({muscle:m,type},equip,used,isLunch,budget,exFreq);
      if(e)return e;
    }
  }
  return null;
}

// Order a freshly built session and flag its warm-up target. Compounds are
// moved to the front (stable, preserving order within each group) so the heavy
// work is done fresh — equipment filtering (e.g. a hotel gym with no barbell/
// cables) could otherwise leave isolations leading the list. The warm-up box
// keys off `isFirst`: assign it to the first compound, or — when a session has
// no compound — the first LOADED movement (bodyweight/timed-only sessions get
// none, since weight-acclimation warm-ups don't apply). Mutates exs in place.
function flagFirstWorkingSet(exs){
  // A movement supports graded warm-up sets only if it can be externally loaded.
  // Bodyweight-only moves (noWeight, or bodyweight as the only equipment) and
  // timed isometric holds can't be scaled down for a warm-up, so they must not
  // lead the session — the first/warm-up slot needs a loadable exercise.
  // Med balls are excluded too: they're loaded but come in fixed ~5 lb jumps,
  // so "50% / 75% / 90%" acclimation percentages are meaningless for them.
  const scalable=e=>!e.noWeight&&!e.isTimed&&(e.eq||[]).some(q=>q!=='bodyweight'&&q!=='medball'&&q!=='medball_wall');
  const compounds=exs.filter(e=>e.type==='compound');
  const rest=exs.filter(e=>e.type!=='compound');
  let ordered=[...compounds,...rest];
  // Pull a loadable movement to the front (prefer a loadable compound) so the
  // warm-up can ramp; only fall back to a bodyweight lead if nothing is loadable.
  const lead=ordered.find(e=>e.type==='compound'&&scalable(e))||ordered.find(e=>scalable(e));
  if(lead)ordered=[lead,...ordered.filter(e=>e!==lead)];
  exs.length=0;exs.push(...ordered);
  exs.forEach(e=>{delete e.isFirst;});
  const target=lead||exs.find(e=>e.type==='compound')||exs[0];
  if(target)target.isFirst=true;
}

function genProgram(cfg,av,workoutHistoryLog){
  av=av||(S.weekPlan?.availability)||defaultAvailability();

  // The historical workout log is a REQUIRED input for reconfiguration. Reset
  // clears only the forward-looking schedule (S.program) — it never purges the
  // logs — so the generator can read what was actually trained recently. Treated
  // as immutable here: we only read from it.
  const history = workoutHistoryLog || S.logs || [];
  // Lookback constraint: tally how many times each movement was logged in the
  // past 7 days. pickEx blocks any movement that has hit its frequency cap and
  // substitutes an alternative; the same map keeps accumulating as this run
  // assigns movements, so a slot won't repeat the same lift across days.
  const freqStart = addDays(todayStr(), -7);
  const exFreq = {};
  history.forEach(l=>{
    if(l.isCardio || logDay(l.date) < freqStart) return;
    (l.exercises||[]).forEach(e=>{ if(e&&e.id) exFreq[e.id]=(exFreq[e.id]||0)+1; });
  });

  // Collect lunch slots and available evening slots separately
  const lunchSlots=[];const eveSlots=[];
  [1,2,3,4,5].forEach(dow=>{
    const d=av[dow]||{};
    if(d.lunch!==false)lunchSlots.push({dow,isLunch:true,mins:40,loc:'ymca',key:`${dow}-lunch`,equipmentKey:d.lunchEquipment||'ymca'});
    if(d.eve?.on)eveSlots.push({dow,isLunch:false,mins:d.eve.mins||60,loc:d.eve.loc||'ymca',key:`${dow}-eve`,equipmentKey:d.eve.equipment||'ymca'});
  });
  [6,0].forEach(dow=>{
    const d=av[dow]||{};
    if(d.on)eveSlots.push({dow,isLunch:false,mins:d.mins||60,loc:d.loc||'ymca',key:`${dow}-wknd`,equipmentKey:d.equipment||'ymca'});
  });
  if(!lunchSlots.length&&!eveSlots.length){
    const ps=S.cfg?.planStartDow??1;
    [1,2,3,4,5].filter(d=>ps!==0&&d>=ps).forEach(dow=>lunchSlots.push({dow,isLunch:true,mins:40,loc:'ymca',key:`${dow}-lunch`,equipmentKey:'ymca'}));
  }

  // No fixed split or week-ahead template cycle: every available day is planned
  // on demand from recovery debt (see dayTemplate). lunchDows lets evening slots
  // know which days already train at lunch.
  const lunchDows=new Set(lunchSlots.map(s=>s.dow));

  // Completed sessions this calendar week — preserve their templates
  const mon=thisMonday();
  const weekEnd=addDays(mon,7);
  // Local-day bucketing (also fixes the former `l.date+'T12:00:00'` parse,
  // which produced Invalid Date on full ISO timestamps → NaN dows)
  const completedDows=new Set(
    (S.logs||[]).filter(l=>!l.isCardio&&logDay(l.date)>=mon&&logDay(l.date)<weekEnd)
      .map(l=>new Date(l.date).getDay())
  );
  const oldWeek=S.program?.week;

  // MRV budget: start from sets already committed this week (logged + planned
  // custom workouts) and consume headroom as we assign sessions, so the week
  // fills toward optimal without exceeding each muscle's recoverable max.
  const budget = { vol: getCommittedVolumes(), limits: getMRVLimits(), perExercise: 3 };

  // Weekly heavy-strength tracking (primary goal: 1–5 reps @ 85–95% at least
  // once/week). Seeded from this week's logs, then extended by buildSession as
  // sessions are assigned. DATE-AWARE, not a boolean: sessions are generated
  // in pass order (lunches → weekend evenings → weekday double evenings), not
  // calendar order, so a Saturday can "bank" the strength slot before Tuesday
  // is even planned — Tuesday then runs a weighted accent that re-locks legs
  // and kills the Saturday heavy day it deferred to. A date D only treats
  // strength as banked when a strength session exists strictly BEFORE it, so
  // the earliest rested evening claims the heavy slot and everything after it
  // rotates accents (converges across the regen after each logged session).
  // Derived per-generation from logs; no persisted state.
  const STRENGTH_IDS=new Set([...EX,...(S.customExercises||[])].filter(e=>(e.tags||[]).includes('strength')).map(e=>e.id));
  const strengthDates=(history||[]).filter(l=>!l.isCardio&&logDay(l.date)>=mon&&logDay(l.date)<weekEnd&&(l.exercises||[]).some(e=>e&&STRENGTH_IDS.has(e.id))).map(l=>logDay(l.date));
  const strengthBefore=(d)=>strengthDates.some(x=>x<d);

  // Weekly hip-hinge guarantee. Same derived-from-logs shape as strengthBefore.
  //
  // Hinge coverage used to be PROBABILISTIC on evenings: the heavy 'strength'
  // slot rotates a 4-movement pool of which only two (heavy trap bar, heavy
  // RDL) are hinges, and once heavy work is banked the remaining leg slots take
  // athletic accents or the 'hamstring' isolation slot — and leg curls are KNEE
  // FLEXION, not a hip hinge. Measured over 8 simulated weeks on both of Sam's
  // real schedule shapes: 88% of weeks got a hinge, i.e. roughly one week in
  // eight trained legs all week with zero hip-hinge pattern. The lunch mandate
  // can't cover it either — it alternates hinge/hamstring by parity, so a week
  // can legitimately land all-hamstring.
  const HINGE_IDS=new Set([...EX,...(S.customExercises||[])].filter(e=>(e.tags||[]).includes('hinge')).map(e=>e.id));
  const hingeDates=(history||[]).filter(l=>!l.isCardio&&logDay(l.date)>=mon&&logDay(l.date)<weekEnd&&(l.exercises||[]).some(e=>e&&HINGE_IDS.has(e.id))).map(l=>logDay(l.date));
  // Counts sessions already assigned earlier in THIS generation run too, so a
  // single pass doesn't stack two hinge rescues into the same week.
  const hingeBanked=(d)=>hingeDates.some(x=>x<=d)||Object.entries(assignedHinge).some(([x])=>x<=d);

  // Foundation Five weekly coverage (see FOUNDATION_FIVE). Seeded from what was
  // actually LOGGED this calendar week — and deliberately NOT extended by
  // merely-planned sessions.
  // Why (found by simulation): every day re-plans the whole week, so a stamp
  // placed on a future session usually evaporates before that day arrives. When
  // planned sessions marked a movement "covered", the single stamp was routinely
  // spent on a Thursday template that Thursday's own regeneration then discarded
  // — push-ups landed 0 weeks out of 6 on a full schedule that trained chest
  // twice a week. Seeding from logs only means EVERY upcoming session with a
  // matching slot offers the uncovered movement, so it lands at the first real
  // opportunity; the moment one is logged, foundationCoveredThisWeek() sees it
  // and the stamps stop. Convergence, not a preview that lies.
  const foundationDone=foundationCoveredThisWeek();
  const centuryDowSet=new Set(centuryDows(av));

  // Calendar date (YYYY-MM-DD) for a program-week dow, for the fatigue matrix's
  // day-by-day lockout lookback. dow 1-5 = Mon-Fri, 6 = Sat, 0 = next Sun.
  const dateForDow=(dow)=>dow===0?addDays(mon,6):dow===6?addDays(mon,5):addDays(mon,dow-1);
  // Muscles trained per date, accumulated as sessions are assigned this run —
  // lets getLockedMuscles see "preceding" days within the same generation pass.
  const assignedMuscles={};
  // Dates in this generation run that already carry a hinge (see hingeBanked).
  const assignedHinge={};

  // The actual logged session for a slot's date AND session type (lunch vs
  // evening) this week, if any — the source of truth for a completed day.
  const loggedFor=(slot)=>(S.logs||[]).find(l=>!l.isCardio&&logDay(l.date)===dateForDow(slot.dow)&&(!!l.isLunch)===(!!slot.isLunch));

  // Plan a single day on demand from recovery debt: the muscle groups that are
  // most overdue AND adequately rested (past their MUSCLE_LOCKOUT_HOURS window),
  // assembled into that day's session. No fixed split — a group recurs as soon
  // as it's rested, and the day is named for whatever it actually trains.
  // Returns {name,desc,slots,tk} or null when nothing is recovered → rest day.
  function dayTemplate(dateStr,limit,isLunch,equip){
    const MUSCLES=['legs','back','chest','shoulders','biceps','triceps'];
    // Most recent training date per muscle (logs + sessions already assigned
    // earlier this run), on or before dateStr.
    const lastDate={};
    const consider=(d,muscles)=>{if(!d||d>dateStr)return;muscles.forEach(m=>{if(m&&(!lastDate[m]||d>lastDate[m]))lastDate[m]=d;});};
    // Weighted-only legs rule: bodyweight/tendon leg work doesn't reset the
    // legs recovery clock (see countsForRecoveryLog by MUSCLE_LOCKOUT_HOURS).
    (history||[]).forEach(l=>{if(l.isCardio)return;consider(logDay(l.date),(l.exercises||[]).map(e=>e&&countsForRecoveryLog(e)?e.muscle:null));});
    Object.entries(assignedMuscles).forEach(([d,set])=>consider(d,[...set]));
    const rows=MUSCLES.map(m=>{
      const ld=lastDate[m];
      const hrs=ld?hoursBetweenDates(ld,dateStr):9999; // never trained → max debt
      const max=budget.limits[m]?.max??20;
      const min=budget.limits[m]?.min??8;
      const vol=budget.vol[m]||0;
      // under = still below the week's optimal range ("yellow" on the dashboard
      // volume bars). Yellow muscles outrank green ones when picking a day.
      // Legs use the split heavy/accent windows (see legsRecovered) — 48h after
      // an accent day, 72h after heavy 1–5 work. Same predicate getLockedMuscles
      // uses, so eligibility here and the MRV pin there always agree.
      const rested=m==='legs'
        ?legsRecovered(dateStr,history,assignedMuscles,strengthDates)
        :hrs>=(MUSCLE_LOCKOUT_HOURS[m]||48);
      return{m,hrs,rested,headroom:max-vol,under:vol<min};
    });
    // Eligible = rested with weekly MRV headroom. Priority: under-range
    // ("yellow") muscles first — get every group to its weekly minimum before
    // adding more work for in-range ("green") ones — then most-overdue within
    // each tier. The rested filter deliberately trumps yellow priority: a
    // yellow muscle still inside its >24h lockout would need back-to-back
    // days to chase its range, so the day trains green muscles instead and
    // the yellow one resumes as soon as it's recovered. Muscles over range
    // ("red") have no headroom and are never intentionally prescribed. If
    // headroom rules everything out, fall back to rested-only.
    const byDebt=(a,b)=>(b.under?1:0)-(a.under?1:0)||b.hrs-a.hrs||MUSCLES.indexOf(a.m)-MUSCLES.indexOf(b.m);
    let elig=rows.filter(r=>r.rested&&r.headroom>=2).sort(byDebt);
    if(!elig.length)elig=rows.filter(r=>r.rested).sort(byDebt);
    if(!elig.length)return null; // nothing adequately rested → rest/recovery day
    // Weekly heavy-strength guarantee, two halves (verified by simulation:
    // without them, 0 strength sessions fired in 490 with lunches present).
    // 1) LUNCH: while no heavy 1–5 work is banked this week, hold legs out of
    //    lunch templates whenever an evening session follows within the 72h
    //    leg lockout — a weighted lunch hinge re-locks legs and makes every
    //    evening structurally unable to host the strength slot. Legs stay in
    //    when they're the only rested muscle (a leg lunch beats a rest day).
    if(isLunch&&!strengthBefore(dateStr)){
      const eveSoon=eveSlots.some(s=>{
        const d=dateForDow(s.dow);
        return d>=dateStr&&hoursBetweenDates(dateStr,d)<(MUSCLE_LOCKOUT_HOURS.legs||72);
      });
      if(eveSoon){
        const withoutLegs=elig.filter(r=>r.m!=='legs');
        if(withoutLegs.length)elig=withoutLegs;
      }
    }
    // 2) EVENING: first evening of the week where legs are rested with MRV
    //    headroom and no heavy work is banked yet: promote legs to the day's
    //    anchor so the evening leg mandate below tags slots[0] 'strength'.
    //    On double days legs were just trained at lunch and fail the rested
    //    check, so the guarantee simply retries the next evening.
    if(!isLunch&&!strengthBefore(dateStr)){
      const li=elig.findIndex(r=>r.m==='legs');
      if(li>0&&elig[li].headroom>=2)elig.unshift(elig.splice(li,1)[0]);
    }
    const muscleSlots=Math.max(1,limit-1); // reserve a slot for core
    // Light natural-pairing nudge: the anchor is the most-overdue rested muscle;
    // fill the rest of the day preferring muscles from the same natural group
    // (push: chest/shoulders/triceps · pull: back/biceps · legs), but let a
    // clearly-more-overdue muscle from another group still win. NOT a fixed
    // split — which group anchors a day is decided by recovery debt each day.
    const GROUP={chest:'push',shoulders:'push',triceps:'push',back:'pull',biceps:'pull',legs:'legs'};
    const PAIR_BONUS=36; // hours of virtual debt for sharing the anchor's group
    const anchor=elig[0];
    const ag=GROUP[anchor.m];
    // Pairing bonus applies WITHIN a volume tier — an in-range (green) muscle
    // sharing the anchor's group never jumps ahead of an under-range (yellow) one.
    const rest2=elig.slice(1).map(r=>({r,score:r.hrs+(GROUP[r.m]===ag?PAIR_BONUS:0)})).sort((a,b)=>(b.r.under?1:0)-(a.r.under?1:0)||b.score-a.score).map(o=>o.r);
    // ── DEPTH OVER BREADTH (2026-08-03) ──
    // A 60-min evening is EX_LIMIT[60]=4 exercises → muscleSlots=3, which
    // exactly matched the 3-muscle breadth below. Every chosen muscle therefore
    // got EXACTLY ONE exercise and no muscle could ever take a second, so any
    // muscle whose weekly band needs more than ~3 sets per training day was
    // unreachable by construction — legs topped out near 9 sets against a 14–24
    // band no matter how overdue they were.
    // When the ANCHOR is still under its weekly minimum, spend the third slot on
    // a second exercise for it instead of reaching onto a third muscle: the
    // muscle that most needs volume gets a compound AND an accessory. Applies to
    // whichever muscle anchors the day, not just legs. Total slots are unchanged,
    // so no session gets longer — this trades breadth for depth, nothing else.
    const breadthCap=(anchor.under&&muscleSlots>=2)?2:3;
    const top=[anchor,...rest2].slice(0,Math.min(breadthCap,elig.length));
    const slots=[];
    for(let i=0;i<muscleSlots;i++)slots.push({muscle:top[i%top.length].m,type:i<top.length?'compound':'isolation'});
    const domDay=parseInt(dateStr.slice(8,10),10)||0; // day-of-month, drives all emphasis rotations
    // Leg accents rotate produce → absorb: 'power' (explosive concentric),
    // 'eccentric' (slow heavy lowering), 'decel' (stick/braking work) — so
    // multi-directional force ABSORPTION gets programmed, not just output.
    const LEG_ACCENTS=['power','eccentric','decel'];
    let accented=false;
    // Leg mandates. Evenings: the first leg slot is tagged 'strength' — the
    // heavy 1–5 rep @ 85–95% tier (box squat / trap bar / heavy RDL / heavy
    // split squat), which leastUsed rotates so squat, hinge, and single-leg
    // patterns all cycle through.
    // Lunch alternates 'hinge' and 'hamstring' by day-of-month parity: the
    // hamstring pool's compounds ARE hinges (RDL family), so hamstring days
    // flip the slot to 'isolation' to reach the leg-curl/back-extension
    // family — the knee-flexion work this mandate exists for. The old design
    // waited for a SECOND leg slot in the same session, which 2–3-slot
    // sessions essentially never produce (3 firings in 490 simulated
    // sessions) — knee flexion was left to chance. Heavy near-max work stays
    // out of lunch either way: the 90s rest cap and 40-min time-box can't
    // hold 3–4 min rests.
    const legSlotIdx=slots.map((s,i)=>s.muscle==='legs'?i:-1).filter(i=>i>=0);
    if(legSlotIdx.length){
      if(isLunch){
        // floor(domDay/2), NOT domDay — the same aliasing that broke the back
        // accent applies here verbatim: legs also come around every ~2 days, so
        // raw day-of-month parity made every lunch leg slot in a week take the
        // SAME tag. Measured hamstring coverage was 29–57% of weeks before this.
        if(Math.floor(domDay/2)%2){slots[legSlotIdx[0]].type='isolation';slots[legSlotIdx[0]].tag='hamstring';}
        else slots[legSlotIdx[0]].tag='hinge';
      }else if(!strengthBefore(dateStr)){
        slots[legSlotIdx[0]].tag='strength';
      }else if(!hingeBanked(dateStr)){
        // HINGE RESCUE. Heavy work is banked but nothing this week has actually
        // hinged — the strength slot rotated to box squat / split squat, and
        // neither the athletic accents nor leg curls (knee flexion) hinge
        // either. Spend this accent slot on the hinge so the week can't end
        // without one.
        //
        // Fires at the FIRST such slot rather than waiting for late week: a
        // thin schedule can put both of its leg days on Mon/Wed, so a Thursday
        // threshold simply never got a turn there (measured: schedule A rose to
        // 100% but 5-evening weeks stayed at 88%). Self-limiting — hingeBanked
        // counts sessions assigned earlier in this same run, so at most one
        // accent per week is ever converted.
        slots[legSlotIdx[0]].tag='hinge';
        // Protected from the Foundation Five's late-week escape valve below.
        // Without this the stamp wins and the rescue silently evaporates: a
        // 5-evening week has only ~2 leg slots, so pistol_squat (a Foundation
        // movement) took the very slot the rescue had just claimed and the week
        // still ended with zero hinges. Foundation coverage is robust here
        // (pistol landed every other week in the same run), the hinge is the
        // scarce one, and this fires at most once a week.
        slots[legSlotIdx[0]].hingeRescue=true;
      }else{
        // One heavy session is already banked this week — later evening leg
        // slots rotate the athletic accents (produce → absorb) instead of
        // stacking redundant near-max work.
        slots[legSlotIdx[0]].tag=LEG_ACCENTS[domDay%LEG_ACCENTS.length];
        accented=true;
      }
      // Tagged IMMEDIATELY, unlike the back accent — deferring this one until
      // after the Foundation stamp was tried and cost more than it bought.
      // An untagged leg slot is not free: the hybrid-athlete accent block below
      // converts an untagged isolation slot of a power-capable muscle into a
      // 'power' accent, and under hip caution most of that pool is banned, so
      // pickEx often found nothing and the slot was dropped entirely. Measured:
      // legs fell from 14–15 sets/week back to 9 (out of band again) on the full
      // schedule. An explicit 'hamstring' tag also bypasses legAutoOK, so the
      // slot is always fillable. Cost of keeping it here: on a 3-evening week,
      // where legs get one slot and it is always 'strength', pistol_squat has no
      // leg slot to be stamped on. That is the documented trade.
      if(legSlotIdx.length>1&&!slots[legSlotIdx[1]].tag)slots[legSlotIdx[1]].tag='hamstring';
    }
    // Upper-back mandate, same rotation shape: vertical pulling trains the
    // lats but leaves rhomboids/mid-traps/rear delts to chance. The first
    // back slot alternates the 'horizontal' row family with direct
    // rear-delt/scapular work (face pulls / reverse flys — all isolation
    // movements, so that parity flips the slot type too). Opposite parity
    // from the hamstring rotation so a legs+back day never converts both of
    // its main slots to isolation work at once. The second-slot tag stays as
    // a bonus when a back-heavy day does repeat the muscle.
    const backSlotIdx=slots.map((s,i)=>s.muscle==='back'?i:-1).filter(i=>i>=0);
    if(backSlotIdx.length){
      // ── Why floor(domDay/2) and not domDay ──
      // This rotation used to be domDay%2, which ALIASED with the back training
      // cadence and silently broke the whole horizontal mandate. Recovery
      // scheduling brings back around every ~2 days, so every back day inside a
      // given week shares one day-of-month parity: the flip stopped alternating
      // within a week and started alternating BETWEEN weeks, all-or-nothing.
      // Measured over 6 simulated weeks (lunch+evening): back trained on
      // 5/7/9, then 12/14/16, then 19/21/23 … so 3 of 5 steady weeks were
      // all-even and logged ZERO rows, while the other weeks logged nothing but
      // rows and no direct rear-delt work. Halving the day first makes the
      // counter advance once per ~2 calendar days — the same rate back actually
      // recurs — so consecutive back sessions land on opposite tags and every
      // week now gets both. Residual: a back cadence of exactly 4 days would
      // re-alias, but that only arises at ~1 back session/week, where a week can
      // only carry one tag anyway.
      if(Math.floor(domDay/2)%2===0){slots[backSlotIdx[0]].type='isolation';slots[backSlotIdx[0]].tag='rear_delt';}
      else slots[backSlotIdx[0]].tag='horizontal';
      // The second-slot 'rear_delt' bonus is applied AFTER the Foundation stamp
      // below, not here — see the note there. Tagging it at this point starved
      // both the horizontal mandate and the weekly pull-up guarantee.
    }
    // Hybrid-athlete accent (goal: look like a bodybuilder, MOVE like an
    // athlete): evening sessions convert ONE isolation fill slot of a
    // power-capable muscle into an explosive 'power' compound (push press,
    // med-ball throws, plyo push-up, ballistic leg work). Deliberately the
    // ISOLATION slot, never a main compound — the heavy hypertrophy lift
    // stays untouched (that's the "look jacked" half), and one accessory
    // trades for athletic power expression (the "move like an athlete" half).
    // Lunch sessions skip this: too short, and the throw/plyo pool is
    // highSweat anyway. 45-min evenings (2 muscle slots, no isolation fill)
    // also skip naturally — short sessions keep every heavy compound.
    if(!isLunch&&!accented){
      const POWER_CAPABLE=new Set(['legs','chest','shoulders']);
      for(let i=slots.length-1;i>=0;i--){
        const s=slots[i];
        if(s.type==='isolation'&&!s.tag&&POWER_CAPABLE.has(s.muscle)){
          s.type='compound';
          s.tag=s.muscle==='legs'?LEG_ACCENTS[domDay%LEG_ACCENTS.length]:'power';
          accented=true;break;
        }
      }
      // ≤60-min sessions have no isolation fill (2–3 slots, all first-appearance
      // compounds), which left this conversion dead in practice (0 firings in a
      // 490-session simulation). Fallback: convert the LAST untagged compound of
      // a power-capable muscle — never slots[0] (the day's main hypertrophy lift
      // stays heavy and untouched) and never a mandate-tagged slot. One
      // accessory compound trades for explosive expression — the "move like an
      // athlete" half of the goal.
      if(!accented){
        for(let i=slots.length-1;i>0;i--){
          const s=slots[i];
          if(s.type==='compound'&&!s.tag&&POWER_CAPABLE.has(s.muscle)){
            s.tag='power';accented=true;break;
          }
        }
      }
    }
    // No convertible slot (isolation fill was mandate-tagged or a non-power
