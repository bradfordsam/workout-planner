    <div class='wu-note'>Straight sets across, no back-off — both movements keep the same load every round. Nothing here goes to failure; the pace is the stimulus.</div>
  </div>`;
}

function renderWorkout(){
  if(!S.active){
    const today=todayDay();
    const canStart=today&&!today.rest;
    return`<div class='view'>
      <div class='hdg'>Workout</div>
      <div class='empty'>
        <span style='font-size:48px;display:block;margin-bottom:16px'>${canStart?'⏱️':'😴'}</span>
        ${canStart
          ?`<div style='margin-bottom:20px'>No workout in progress.<br><span style='font-size:13px'>Start today's session to track your sets.</span></div>
             <button class='btn btn-p' data-action='start-workout' style='max-width:240px;margin:0 auto'>Start Today's Session →</button>`
          :`Rest day.<br><span style='font-size:13px'>Recovery is where the growth happens.</span>`}
      </div>
    </div>${renderNav('workout')}`;
  }
  if(S.active.ratePending){
    const opts=[
      {v:1,icon:'😌',label:'Easy',sub:'Could do it again right now'},
      {v:2,icon:'🙂',label:'Comfortable',sub:'Solid work, plenty left'},
      {v:3,icon:'😤',label:'Worked',sub:'Good session, properly tired'},
      {v:4,icon:'🥵',label:'Hard',sub:'Close to my limit'},
      {v:5,icon:'💀',label:'Maxed out',sub:'Totally drained'},
    ].map(o=>`<div class='opt col1' data-action='rate-fatigue' data-val='${o.v}' style='display:flex;align-items:center;gap:12px;text-align:left'>
      <span style='font-size:26px'>${o.icon}</span>
      <div><div class='opt-v' style='font-size:16px'>${o.label}</div><div class='opt-l'>${o.sub}</div></div>
    </div>`).join('');
    return`<div class='view'>
      <div class='hdg'>How hard was that?</div>
      <div style='font-size:13px;color:var(--mut);margin-bottom:16px'>Your rating auto-regulates the plan — muscles trained in very hard sessions get a lower volume ceiling for the next 72 hours so you recover instead of overtraining.</div>
      <div class='opts col1'>${opts}</div>
      <button class='btn btn-g btn-sm' data-action='rate-fatigue' data-val='' style='margin-top:12px'>Skip</button>
    </div>${renderNav('workout')}`;
  }
  const{exercises,exIdx,dayName,isLunch}=S.active;
  const ex=exercises[exIdx];
  const total=exercises.length;
  let prog=progression(ex.id,ex.rMax);
  // No history for this loaded movement → fall back to the intensity estimation
  // engine for a conservative opener (uses the value attached at startWorkout,
  // recomputing defensively for sessions started before this field existed).
  // For loaded timed movements, older logs may predate the weight box (weight
  // 0) — the progression record exists but has no usable load, so the estimate
  // still applies.
  const progHasW=!!prog&&prog.weight>0;
  const scaleDef=exScale(ex); // position-scaled (notch), not loaded
  let est=(!ex.noWeight&&!scaleDef&&(!ex.isTimed||timedLoaded(ex))&&(!prog||(timedLoaded(ex)&&!progHasW)))?(ex.estW||estimateStartingWeight(ex.id,S.logs,MOVEMENT_CLASS)):null;
  const estLbl=estBasisLabel(est);

  // Per-equipment dumbbell rack (e.g. apartment gym: 5/10/15/20/25/40/45/50 —
  // a gap at 30/35). Snap the suggested/estimated load DOWN to a pair actually
  // on hand so we never prescribe a weight that doesn't exist here — once
  // capped by the gap or the max, progress via reps and tempo, not more load.
  const activePreset=EQUIPMENT_PRESETS[S.active.equipmentKey];
  const dbWeights=activePreset?.dumbbellWeights;
  const dbCap=activePreset?.dumbbellMax;
  const capDb=!!(dbWeights||dbCap) && ex.eq?.includes('dumbbells') && !ex.eq?.includes('barbell');
  let dbCapped=false;
  if(capDb){
    if(prog){
      const snapped=dbWeights?roundToAvailable(prog.suggest,dbWeights):Math.min(prog.suggest,dbCap);
      if(snapped!==prog.suggest){prog={...prog,suggest:snapped};dbCapped=true;}
    }
    if(est){
      const snapped=dbWeights?roundToAvailable(est.weight,dbWeights):Math.min(est.weight,dbCap);
      if(snapped!==est.weight){est={...est,weight:snapped};dbCapped=true;}
    }
  }
  const dbCapNote=capDb&&dbCapped?`<div style='font-size:12px;color:var(--warn);margin-bottom:10px'>🏢 Rounded to ${prog?prog.suggest:est.weight} lb ea — nearest pair on hand${dbCap?` (max ${dbCap} lb)`:''}. Progress by adding reps or slowing the tempo once you're maxed out.</div>`:'';
  const mcolor=MCOL[ex.muscle]||'var(--acc)';

  const locLabel=S.active.loc==='home'?'🏢 Apartment Gym':'🏋️ YMCA';
  const sessionTag=ex.isMakeup
    ?`<span class='badge badge-makeup' style='margin-bottom:12px;display:inline-block'>⚡ Make-up · ${ex.makeupFrom}</span>`
    :S.active.isLunch
      ?`<span class='badge badge-lunch' style='margin-bottom:12px;display:inline-block'>YMCA Lunch · 35–40 min</span>`
      :`<span class='badge badge-eve' style='margin-bottom:12px;display:inline-block'>${locLabel} · ${S.active.sessionMins} min</span>`;

  // Pre-lift prep. The pools, the per-tissue split and the time budget all live
  // at module scope now (see prepPlan) — the renderer only draws what the plan
  // hands it. `isLegDay` is read off the session that was actually built rather
  // than asked of the generator, so a swap or a preserved session is covered too.
  const wuRow=(it,i)=>`<div class='wu-row'><span class='wu-set' style='width:20px;font-size:11px'>${i+1}</span><span class='wu-val'>${it.n}</span><span style='color:var(--mut);font-size:12px'> · ${it.d}</span>${it.hold?`<button data-action='start-hold' data-secs='${it.hold}' style='margin-left:auto;font-size:11px;font-weight:600;color:var(--acc);background:var(--acc2);border:none;border-radius:6px;padding:3px 8px;cursor:pointer'>${it.hold}s</button>`:''}</div>`;
  const isLegDay=exercises.some(e=>e.muscle==='legs');
  const prep=prepPlan({isLunch:!!S.active.isLunch,isLegDay,hipCaution:!!S.cfg.hipCaution,shoulderCaution:!!S.cfg.shoulderCaution});
  const prepHTML=exIdx===0?`<div class='wu-box' style='border-color:rgba(192,132,252,.3);background:rgba(192,132,252,.04);margin-bottom:14px'>
    <div class='wu-title' style='color:#c084fc'>🔥 Prep · ~${prep.mins} min before rep one</div>
    <div class='wu-note' style='margin-top:0;margin-bottom:8px'>${isLegDay
      ? `Legs today, so the block leans into hamstrings, Achilles and adductors — the tissues that take the load first and complain last.`
      : `No legs today, so this is all hip and spine — you came here straight from a chair and that's what the chair did.`} These minutes are ${S.active.isLunch?`<strong style='color:var(--txt)'>counted against your ${lunchBudget(S.active.dow).box} minutes</strong>, which is why the lift list is as short as it is`:`part of the session, not extra to it`}.</div>
    ${prep.blocks.map(b=>`<div style='margin-bottom:8px'>
      <div style='font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:${b.color};margin-bottom:2px'>${b.title}</div>
      ${b.items.map(wuRow).join('')}
      ${b.note?`<div class='wu-note' style='margin-top:2px'>${b.note}</div>`:''}
    </div>`).join('')}
    <div class='wu-note'>Rotates daily — a different subset each session so prep stays inside its budget; the full pools cycle across the week. Anything marked with a band needs the mini/loop band; skip it if it isn't with you.</div>
  </div>`:'';

  // "Machine Mode" prehab: on a heavy, low-rep compound press (chest/shoulders/
  // back, rMax<=8) as the FIRST lift, add rotator-cuff/stabilizer priming —
  // Cuban or Czech press — so the joint is locked in before real load goes on.
  // %-scalable = actually loadable in fine increments; med balls, bodyweight,
  // and timed holds are excluded — "heavy compound ahead" and 50/75/90%
  // acclimation percentages make no sense for a 10 lb ball or a plank.
  const pctScalable=!ex.noWeight&&!ex.isTimed&&!scaleDef&&(ex.eq||[]).some(q=>q!=='bodyweight'&&q!=='medball'&&q!=='medball_wall');
  const isHeavyPressFirst=ex.isFirst&&pctScalable&&ex.type==='compound'&&ex.rMax<=8&&['chest','shoulders','back'].includes(ex.muscle);
  const machineModeHTML=isHeavyPressFirst?`<div class='wu-box' style='border-color:rgba(251,191,36,.3);background:rgba(251,191,36,.04);margin-bottom:14px'>
    <div class='wu-title' style='color:var(--warn)'>🔧 Machine Mode Prehab (heavy compound ahead — lock in the shoulder first)</div>
    <div class='wu-row'><span class='wu-set' style='width:20px;font-size:11px'>1</span><span class='wu-val'>Cuban Press</span><span style='color:var(--mut);font-size:12px'> · 10 reps · light DBs: upright row → external rotation → overhead press, one fluid rep</span></div>
    <div class='wu-row'><span class='wu-set' style='width:20px;font-size:11px'>2</span><span class='wu-val'>Czech Press</span><span style='color:var(--mut);font-size:12px'> · 10 reps · light DBs flared out behind the body, press up and slightly forward</span></div>
    <div class='wu-note'>Both drill the rotator cuff and scapular stabilizers through the exact ranges the heavy lift will load — do these before your warm-up sets, not instead of them.</div>
  </div>`:'';

  // Efficiency Mode reminder: shown once at the top of the session (not every
  // exercise) so the lower weekly volume this mode prescribes doesn't read as
  // an accident — the intensity target is the whole point.
  const efficiencyModeHTML=exIdx===0&&isEfficiencyMode()?`<div class='wu-box' style='border-color:rgba(248,113,113,.3);background:rgba(248,113,113,.04);margin-bottom:14px'>
    <div class='wu-title' style='color:var(--bad)'>⚡ Efficiency Mode · 3 days/week</div>
    <div class='wu-note' style='margin-top:0'>Weekly volume is intentionally low (3–10 hard sets/muscle) — every set needs to count. Push each working set to 0–2 reps in reserve (RIR), not a comfortable stopping point. For side delts specifically: 1–3 crisp, perfect-technique sets per session beats spamming lateral-raise variations.</div>
  </div>`:'';

  // The desk-reversal primer used to be its own evening-only box here. It's now
  // a FIXED block inside prepPlan (DESK_REVERSAL) and shows at lunch too —
  // arriving from a chair is if anything more true at 12:30 than at 18:00.

  const sugW0=prog?prog.suggest:(est?est.weight:null);
  const isDumbbellEx=!!(ex.eq?.includes('dumbbells')&&!ex.eq?.includes('barbell'));
  const wUnit=scaleDef?scaleDef.unit:isDumbbellEx?'lb ea':'lb';
  const wu1Lbl=sugW0?`${r5(sugW0*0.5)} ${wUnit}`:'~50%';
  const wu2Lbl=sugW0?`${r5(sugW0*0.75)} ${wUnit}`:'~75%';
  const wu3Lbl=sugW0?`${r5(sugW0*0.9)} ${wUnit}`:'~90%';
  // Weight-acclimation coverage beyond the session's lead lift: the recovery-
  // debt scheduler mixes muscle groups within one session (e.g. Legs · Back ·
  // Chest), so the first LOADABLE lift of each NEW muscle group also gets a
  // ramp — abbreviated to 2 sets since the body is already warm by then and
  // only the new muscle/pattern needs acclimation. Computed at render time
  // (not generation) so swaps and preserved sessions are covered too. Lunch
  // sessions are excluded (hard 40-min time-box); core/hips excluded (light
  // rotational/stability work doesn't need a graded ramp).
  // Med balls excluded (fixed ~5 lb jumps — % ramps are meaningless), and
  // explosive throws ARE their own ramp: the first reps at lower intent.
  // pctScalable (defined above) carries the same rule; the full acclimation
  // box below is ALSO gated on it, covering the fallback case where
  // flagFirstWorkingSet found nothing %-scalable to lead yet still flagged a
  // med ball / bodyweight / timed movement as the session opener.

function renderReviewWorkout(){

  const isEve = sessionType === 'eve' && day.eveningSession;
  const src = isEve ? day.eveningSession : day;
  // Show every exercise the program built for this session — matches the
  // Program tab (which renders src.exercises in full) and the started workout.
  // The array is already sized at generation time (lunch=3, longer sessions=
  // EX_LIMIT[mins]), so a true 40-min lunch still shows 3.
  let rawExs = src.exercises.slice();

  // Show makeup exercises logic (same as startWorkout)
  if(!isEve){
    const missed = getMissedDays();
    if(missed.length > 0){
      const todayMuscles = new Set(rawExs.map(e => e.muscle));
      missed.forEach(missedDow => {

        if(mu){
          rawExs = [...rawExs, {...mu, sets: 2, isMakeup: true, makeupFrom: md.name}];

        }
      });

  const sessionLabel = src.isLunch ? `${src.name} · Lunch` : `${src.name} · ${src.mins||src.sessionMins||60} min`;

  const exerciseCards = rawExs.map((ex, idx) => {

    </div>`;
  }).join('');

  return `<div class='view rag v-page'>
    <button class='s-back' data-action='back-to-dash' style='margin-bottom:20px;margin-top:0'>

    </button>

// ─────────────────────────────────────────────
// CUSTOM SESSION (2026-08-29)
// ─────────────────────────────────────────────
// Sam: "add a custom workout plan to do rather than what the app prescribes
// sometimes — I input the exercises I want to do, and the app prescribes the
// appropriate warm ups and starting weight recommendations."
//
// The distinction from the pre-existing custom-workout LOG (renderCustomWorkoutLog,
// below) is the whole point and worth stating plainly: that screen is a FORM you
// fill in AFTER training — you type sets, reps and weight yourself and it writes a
// log. This is a SESSION you RUN. The picked exercises are handed to the ordinary
// workout screen, so every piece of prescription the generated sessions get comes
// with them for free and by construction: prepPlan's warm-up block, the 50/75/90%
// acclimation ramp, estimateStartingWeight's opener with its confidence and its
// basis in words, smartRest, the per-set logger, sessionPlan's itemised clock.
// NOTHING here re-implements any of that — the only new work is turning a list of
// names into the `S.active.exercises` shape startWorkout already builds.
//
// RIDES ALONGSIDE, it does not replace (Sam's call). No template is cancelled and
// adaptWeekForCustomWorkout is deliberately NOT called: the log lands, finishWorkout
// calls replanCurrentWeek, and the rest of the week absorbs it through recovery and
// MRV like any other session. Two consequences worth knowing, neither a bug:
//   - getCompletedDows keys off ANY non-cardio log on the date, so today's card
//     flips to "✓ Completed" regardless. That is honest — he did train — and the
//     evening block keeps its own Start button, so a second session is unaffected.
//   - liftingSessionsOn's two-per-day cap still applies, and a custom session
//     started as the day's SECOND goes through applyDailyAutoReg exactly like a
//     prescribed one. A hand-picked list is not a reason to skip the 60% rule.
//
// SAFETY GATES WARN, THEY DO NOT BLOCK. Deliberate, and the one place this path
// diverges from pickEx. The gates exist to stop the GENERATOR from prescribing
// something Sam never asked for; here he is asking for it by name, and silently
// refusing a movement he typed would be the "monitor that fires on correct plans"
// failure in the other direction — he would just stop using the feature. So the
// warnings quote the engine's OWN predicates (userAvoids, plyoHidden, the same
// hipRisk/shoulderRisk/highSweat/equipment tests baseFor uses) rather than
// re-deriving them, and let him proceed. If those predicates change, this follows.

const CUSTOM_SESSION_DEFAULT_SETS=3;
const CUSTOM_SESSION_MINS_CHOICES=[30,40,45,60,75,90];
// Reps for a movement with no database entry to read rMin/rMax off. Deliberately
// a middle hypertrophy range rather than anything heavy: we know nothing about an
// unmatched name, and 3x10 is the answer least likely to be wrong badly.
const CUSTOM_UNKNOWN_REPS={rMin:8,rMax:12,rest:90};

// Seed the builder from what today already looks like, so the common case is
// "open it, add three lifts, go". The EVENING is preferred when the day has both:
// a custom session is extra work, and the evening is the side with slack — the
// same reasoning centuryHostSession uses to bill the hundred there.
function customSessionDefaults(){
  const dow=todayDow();
  const d=S.program?.week?.[dow];
  const dd=(d&&!d.rest)?d:null;
  const src=dd?.eveningSession||dd;
  return{
    dow,
    mins:src?.mins||src?.sessionMins||getEveningMins()||60,
    isLunch:!!src?.isLunch,
    equipmentKey:src?.equipmentKey||dd?.equipmentKey||S.eveningLocation||'ymca',
  };
}

// Stable id from a typed name, so re-typing the same movement next week lands on
// the same history instead of accumulating one id per session. Date.now() ids —
// which the log-edit screen uses — would make every custom movement permanently
// historyless, and estimateStartingWeight would never get past step 4.
function slugId(name){
  return (name||'').toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'').slice(0,40)||'movement';
}

// A picked name -> a full exercise definition in the shape the workout screen
// expects. A database hit (built-in or one of Sam's own) is used WHOLE, which is
// what carries rMin/rMax, rest, cue, eq, and every safety flag into the session.
// An unmatched name is synthesized instead of rejected — typing "Sled Push" should
// still give you a session.
//
// `eq:['other']` on a synthesized entry is load-bearing, not filler. It has to be
// a token no preset carries (so the equipment warning is honest: we cannot confirm
// it is here) while still passing renderWorkout's `pctScalable` test, which asks
// only that SOME equipment token isn't bodyweight/medball. Setting eq:[] or
// eq:['bodyweight'] instead silently suppresses the warm-up ramp — the exact thing
// Sam asked this feature for — and it fails invisibly, since a missing ramp looks
// the same as a movement that correctly has none.
// A rep range stated on the row (imported from a screenshot, say) overrides the
// movement's own default. The database range is what to do with this movement in
// GENERAL; a range written on the card is what to do with it TODAY.
function applyRowReps(def,row){
  if(!row||row.rMin==null)return def;
  const rMin=Math.max(1,Math.min(100,row.rMin));
  const rMax=Math.max(rMin,Math.min(100,row.rMax==null?rMin:row.rMax));
  return{...def,rMin,rMax};
}
function customResolveEx(row){
  if(row.exId){
    const hit=exById(row.exId);
    if(hit)return applyRowReps({...hit},row);
  }
  const{match}=resolveEx(row.name||'');
  if(match)return applyRowReps({...match},row);
  const nm=(row.name||'').trim();
  return{
    id:row.synthId||('custom_'+slugId(nm)),
    name:nm||'Untitled movement',
    muscle:row.muscle||estimateMuscleGroup(nm),
    type:'isolation',
    eq:row.noWeight?['bodyweight']:['other'],
    noWeight:!!row.noWeight,
    rMin:row.rMin!=null?row.rMin:CUSTOM_UNKNOWN_REPS.rMin,
    rMax:row.rMax!=null?row.rMax:(row.rMin!=null?row.rMin:CUSTOM_UNKNOWN_REPS.rMax),
    rest:CUSTOM_UNKNOWN_REPS.rest,
    cue:'',
    tags:[],
    synthetic:true,
  };
}

// The engine's own gates, reported instead of enforced. Order is roughly
// most-serious first — an avoid-list entry is a decision Sam already made about
// an injury, a missing dumbbell is an inconvenience.
function customExWarnings(ex,opts){
  const out=[];
  const add=(icon,msg)=>out.push({icon,msg});
  if(userAvoids(ex))add('&#9940;',`On your avoid list — you took this one off the program on purpose. It'll still run if you mean it.`);
  if(S.cfg.hipCaution&&ex.hipRisk)add('&#9888;&#65039;',`Flagged for the left hip (FAI history) — loaded end-range rotation or hard landings.`);
  if(S.cfg.shoulderCaution&&ex.shoulderRisk)add('&#9888;&#65039;',`Flagged for the left shoulder — ballistic anterior loading, which no cue makes safe.`);
  if(ex.standingPressRisk)add('&#9888;&#65039;',`Standing overhead press — flagged for the lower back, same reason OHP/Push Press/Thrusters are on the avoid list. Never programmed automatically, but it's your call here.`);
  if(plyoHidden(ex))add('&#9888;&#65039;',`Impact plyo — the generator hides these under hip caution; only the low-impact subset is cleared.`);
  if(S.cfg.kneeCaution&&ex.muscle==='legs'&&!KNEE_SAFE_IDS.has(ex.id))add('&#9888;&#65039;',`Outside the knee-safe list that Knee Caution mode whitelists.`);
  if(!dragonFlagUnlocked(ex.id))add('&#128274;',`The earlier tier of this progression isn't logged at 10 reps yet.`);
  if(opts.isLunch&&ex.highSweat)add('&#128166;',`High sweat — there's no shower on a lunch session.`);
  const preset=EQUIPMENT_PRESETS[opts.equipmentKey];
  const eq=new Set([...(preset?.equipment||[]),'bodyweight']);
  if((ex.eq||[]).length&&!ex.eq.some(q=>eq.has(q))){
    add('&#129520;',ex.synthetic
      ?`Not in the exercise database, so the app can't confirm the gear is at ${preset?.name||'this gym'}.`
      :`Needs ${ex.eq.join(' or ')} — ${preset?.name||'this gym'} doesn't list it.`);
  }
  return out;
}

// Everything the builder shows for one row: what will be prescribed, and what the
// engine would have refused. Both come from the SAME functions the generator and
// the workout screen use — see the block comment on why this must not re-derive.
function customRowPlan(row,opts){
  const ex=customResolveEx(row);
  const sets=Math.max(1,Math.min(10,row.sets||CUSTOM_SESSION_DEFAULT_SETS));
  const scaleDef=exScale(ex);
  const loaded=!ex.noWeight&&(!ex.isTimed||timedLoaded(ex));
  const prog=loaded?progression(ex.id,ex.rMax):null;
  const est=(loaded&&!scaleDef&&(!prog||prog.weight<=0))?estimateStartingWeight(ex.id,S.logs,MOVEMENT_CLASS):null;
  const isDb=!!(ex.eq?.includes('dumbbells')&&!ex.eq?.includes('barbell'));
  const unit=scaleDef?scaleDef.unit:isDb?'lb ea':'lb';
  const repLbl=ex.isTimed
    ?`${ex.rMin||30}${ex.rMax&&ex.rMax!==ex.rMin?'–'+ex.rMax:''} sec`
    :(ex.rMin===ex.rMax?`${ex.rMin}`:`${ex.rMin}–${ex.rMax}`)+' reps';
  return{ex,sets,repLbl,unit,prog,est,loaded,
    warnings:customExWarnings(ex,opts),
    matched:!ex.synthetic};
}

// The clock, itemised — the same function and the same arguments the workout
// screen's "This session" card uses, so the number in the builder is the number
// he'll see once he starts. lifts is an INPUT to sessionPlan (computing it inside
// would be circular), which is exactly the hand-off we want here: he chose the
// lift count, everything else is priced around it.
function customSessionSummary(d){
  d=d||S.customSession;
  if(!d)return null;
  return sessionPlan({mins:d.mins,dow:d.dow,av:S.weekPlan?.availability,
    equipmentKey:d.equipmentKey,isLunch:!!d.isLunch,lifts:d.exercises.length,
    perLiftMins:perLiftMinsFor(d.isLunch?lunchExMins():EVENING_EX_MINS)});
}

// A custom session's structure. 'straight' is the ordinary top-set/back-off model,
// 'paired' runs the picks as A1/A2 stations (see PAIRED SETS), 'emom' puts one
// movement at the top of each minute.
//
// EMOM is timing, not volume: same sets, same reps, so nothing downstream — MRV,
// recovery, the ledgers — needs to know about it. What it changes is the rest,
// which is why the workout screen suppresses the rest timer for it and shows the
// minute clock instead.
const CUSTOM_STRUCTURES=[
  {key:'straight',label:'Straight sets',sub:'One movement at a time, full rest between sets.'},
  {key:'paired',label:'Paired A1/A2',sub:'Two movements per station, '+PAIR_TRANSITION_SECS+'s to change over, full rest after the pair.'},
  {key:'emom',label:'EMOM',sub:'One movement at the top of every minute. Rest is whatever is left of the minute.'},
];
function customStructure(d){
  const k=(d||S.customSession||{}).structure;
  return CUSTOM_STRUCTURES.some(s=>s.key===k)?k:'straight';
}
// An EMOM's length is its total set count — one movement per minute, round-robin.
// Derived rather than asked for: the number of minutes IS the work you picked, and
// making it a separate input would let the two disagree.
function emomMinutes(rows){
  return (rows||[]).reduce((a,r)=>a+Math.max(1,Math.min(10,r.sets||CUSTOM_SESSION_DEFAULT_SETS)),0);
}

// ─────────────────────────────────────────────
// IMPORT A WORKOUT FROM A SCREENSHOT (2026-08-30)
// ─────────────────────────────────────────────
// Sam: *"make it so I can enter a screenshot of the workout and it generates it in
// this same feature and uses my log history and logic to fill in any holes."*
//
// Three stages, and only the middle one is new work:
//   1. OCR the image (Tesseract.js, lazily fetched — see ocrWorkoutImage).
//   2. PARSE the text into rows (parseWorkoutText, below).
//   3. Hand the rows to the custom-session builder, which already fills every hole:
//      resolveEx maps a name to the database, customRowPlan supplies sets, reps and
//      rest, and estimateStartingWeight supplies the opening weight from his own
//      history. That is the entire "fill in the holes" half, and it is code that
//      already exists and is already tested.
//
// THE RESULT IS A DRAFT, NEVER A STARTED SESSION. OCR gets things wrong; the
// import lands in the builder where every row is editable and every gap is visible,
// and he taps Start when it looks right. That is what makes imperfect recognition
// acceptable rather than dangerous — the same reasoning behind the custom builder
// warning instead of blocking.

// Loaded on demand, not at boot: this is a few megabytes of wasm and language data
// that most sessions never touch. Same lazy-script pattern the Firebase sync uses.
const TESSERACT_CDN='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';

async function loadScriptOnce(src){
  return new Promise((res,rej)=>{
    if(document.querySelector(`script[src="${src}"]`)){res();return;}
    const s=document.createElement('script');
    s.src=src;s.onload=()=>res();s.onerror=()=>rej(new Error('script failed: '+src));
    document.head.appendChild(s);
  });
}

// Returns the recognised text, or throws with a message worth showing. The service
// worker is network-first and caches what it sees, so the wasm and language data
// are on hand after the first successful run — but the FIRST run needs a
// connection, and saying so beats a spinner that never resolves.
async function ocrWorkoutImage(file,onProgress){
  if(!navigator.onLine&&typeof Tesseract==='undefined'){
    throw new Error('Reading a screenshot needs a connection the first time (it downloads the text recogniser). It works offline after that.');
  }
  onProgress&&onProgress('Loading the text recogniser…',0);
  await loadScriptOnce(TESSERACT_CDN);
  if(typeof Tesseract==='undefined')throw new Error("Couldn't load the text recogniser.");
  const{data}=await Tesseract.recognize(file,'eng',{
    logger:m=>{
      if(m.status==='recognizing text')onProgress&&onProgress('Reading the workout…',m.progress||0);
      else if(m.status)onProgress&&onProgress('Loading the text recogniser…',m.progress||0);
    },
  });
  return (data&&data.text)||'';
}

// ── The parser ──
// Written against the format of the cards Sam actually uses: an "A1."/"A2." label
// per movement, a "3 x 6-15 reps" prescription set to the right of the name, a
// "Rest N seconds" line under it, and free-text notes marked with an asterisk.
// OCR flattens the two columns unpredictably — the reps sometimes land on the name's
// line and sometimes on their own — so every pattern is looked for BOTH inline and
// on the following line rather than assuming one layout.

// "3 x 6-15 reps", "5 x 10 reps", "3x8". The unit word is optional because OCR
// drops it often enough to matter.
const RX_SETS_REPS=/(\d{1,2})\s*[x×X]\s*(\d{1,3})(?:\s*[-–—]\s*(\d{1,3}))?\s*(?:reps?)?\b/;
// "A1.", "B2)", "A1 " — the pair label. Anchored so a movement called "T2 Bar Row"
// can't be mistaken for one.
const RX_PAIR=/^([A-Fa-f])\s*([1-4])\s*[.):\-]?\s+(.{2,})$/;
const RX_EMOM=/\bEMOM\s*(\d{1,2})?\b/i;
const RX_REST=/\brest\s*(?:for\s*)?(\d{1,3})\s*(?:sec|second)/i;
// Lines that are commentary, not movements.
const RX_NOTE=/^\s*[*•]|^\s*notes?\b|^\s*ex[:.]|\bcluster set\b|\bremainder of the minute\b|\bperform 1 rep\b|\brest \d+[-–]\d+ sec\b/i;

// Leading characters OCR picks up from a card's rule or gutter — pipes, bullets,
// smart quotes, stray dashes. Stripped from the line BEFORE any pattern is matched,
// never after, because every pattern here is anchored.
const RX_GUTTER=/^[\s|>‹›«»"'`~•·°*_\-–—.]+/;
function stripGutter(s){return (s||'').replace(RX_GUTTER,'').trim();}

function cleanImportName(s){
  return (s||'')
    .replace(RX_SETS_REPS,' ')
    .replace(RX_REST,' ')
    .replace(/\brest\b.*$/i,' ')
    .replace(/[|_]+/g,' ')
    // OCR routinely reads a leading "|" or stray punctuation into the name.
    .replace(/^[^A-Za-z0-9(]+/,'')
    .replace(/[^A-Za-z0-9)\s/+&'-]+$/,'')
    .replace(/\s{2,}/g,' ')
    .trim();
}

// Text -> {rows, structure, emomMins, notes, skipped}. Deliberately forgiving: a
// line it can't make sense of goes to `skipped` and is SHOWN, rather than being
// silently dropped — a missing exercise you can't see is the failure mode that
// would make this feature untrustworthy.
function parseWorkoutText(text){
  const lines=(text||'').split(/\r?\n/).map(l=>l.trim()).filter(l=>l.length>1);
  const rows=[],notes=[],skipped=[];
  let emomMins=0,sawPair=false;
  for(let i=0;i<lines.length;i++){
    // Note-detection runs on the RAW line (it keys on the leading asterisk among
    // other things); everything after it runs on the de-guttered one.
    if(RX_NOTE.test(lines[i])){notes.push(lines[i]);continue;}
    const line=stripGutter(lines[i]);
    if(line.length<2){skipped.push(lines[i]);continue;}
    const em=line.match(RX_EMOM);
    if(em){emomMins=parseInt(em[1])||emomMins||0;if(!RX_PAIR.test(line)){notes.push(line);continue;}}
    const pm=line.match(RX_PAIR);
    let name=pm?pm[3]:line;
    let pairId=pm?pm[1].toUpperCase():null,pairPos=pm?parseInt(pm[2]):null;

    // Reps/sets: on this line, or on the next one or two (the right-hand column
    // often OCRs as its own line directly after the name).
    let sr=line.match(RX_SETS_REPS);
    let consumed=0;
    if(!sr){
      for(let k=1;k<=2&&i+k<lines.length;k++){
        const nxt=stripGutter(lines[i+k]);
        if(RX_PAIR.test(nxt))break;              // that's the next movement
        const m2=nxt.match(RX_SETS_REPS);
        if(m2){sr=m2;consumed=k;break;}
      }
    }
    name=cleanImportName(name);
    // A line with no label and no prescription that doesn't look like a movement
    // name is almost certainly a heading or stray text.
    if(!name||name.length<3||/^\d+$/.test(name)){if(line)skipped.push(line);continue;}
    if(!pm&&!sr&&!/[a-z]{3}/i.test(name)){skipped.push(line);continue;}
    // No label and no prescription: the only evidence left that this is an exercise
    // is that it names one. A heading, a gym name or a date reaches here otherwise,
    // and "two or more words" is not a test — "Some Gym" passes it.
    if(!pm&&!sr&&!resolveEx(name).match){notes.push(line);continue;}

    const row={name,sets:null,rMin:null,rMax:null};
    if(sr){
      row.sets=Math.max(1,Math.min(10,parseInt(sr[1])||CUSTOM_SESSION_DEFAULT_SETS));
      const lo=parseInt(sr[2]),hi=sr[3]?parseInt(sr[3]):null;
      if(lo>0&&lo<=100){row.rMin=lo;row.rMax=hi&&hi>=lo&&hi<=100?hi:lo;}
    }
    if(pairId){row.pairId=pairId;row.pairPos=pairPos;sawPair=true;}
    rows.push(row);
    i+=consumed;
  }

  // A1/A2/A3/A4 under one EMOM heading is a ROTATION, not four pair-stations —
  // the labels there mean "the order within the minute". Only a genuine two-per-
  // letter layout is pairing.
  const byLetter={};
  rows.forEach(r=>{if(r.pairId)byLetter[r.pairId]=(byLetter[r.pairId]||0)+1;});
  const looksPaired=sawPair&&Object.values(byLetter).every(n=>n<=2)&&Object.keys(byLetter).length>0;
  const structure=emomMins?'emom':(looksPaired?'paired':'straight');
  if(structure!=='paired')rows.forEach(r=>{delete r.pairId;delete r.pairPos;});
  // Drop a dangling half-pair: a letter with one entry can't be a station, and
  // leaving the label on would render an A1 with nothing to alternate with.
  if(structure==='paired'){
    const counts={};rows.forEach(r=>{if(r.pairId)counts[r.pairId]=(counts[r.pairId]||0)+1;});
    rows.forEach(r=>{if(r.pairId&&counts[r.pairId]<2){delete r.pairId;delete r.pairPos;}});
  }
  return{rows,structure,emomMins,notes,skipped};
}

// Name -> movement, for IMPORTED text specifically. resolveEx is deliberately
// strict: fuzzyMatchEx refuses to answer when two candidates are close, because on
// the autocomplete a wrong confident guess is worse than saying "new exercise" while
// the user is still typing and can see it.
//
// Import is the opposite situation. "Lateral Raise" written on a card is a real
// movement he owns history for, but it ties across five variants (DB, cable, lying
// cable, machine, alternating front) so the strict matcher declines — and the row
// lands as a brand-new movement with a cold-start opener, throwing away the exact
// history this feature exists to use. There is no one typing to notice.
//
// So on a tie, break it with EVIDENCE, in this order:
//   1. the variant he has actually LOGGED (most recently, if several) — the whole
//      point is to reuse his own numbers;
//   2. failing that, EX order, which is already the generator's own statement of
//      which variant is the default for a slot.
// Still returns null when nothing is close, so a genuinely unknown movement stays
// an honest "new movement" rather than being forced onto a bad match.
function resolveImportName(name){
  const strict=resolveEx(name);
  if(strict.match)return{match:strict.match,exact:strict.exact,ambiguous:false};
  const tokens=exTokens(name);
  if(!tokens.length)return{match:null,exact:false,ambiguous:false};
  const want=new Set(tokens);
  const all=[...EX,...(S.customExercises||[])];
  let best=0;const scored=[];
  all.forEach((e,idx)=>{
    const has=new Set(exTokens(e.name));
    let overlap=0;want.forEach(t=>{if(has.has(t))overlap++;});
    if(!overlap)return;
    const coverage=overlap/want.size;
    // Same coverage bar fuzzyMatchEx uses — this relaxes the TIE rule, not the
    // "is it even close" rule.
    if(coverage<0.6)return;
    const dice=(2*overlap)/(want.size+has.size);
    if(dice<0.5)return;
    if(dice>best)best=dice;
    scored.push({e,dice,idx});
  });
  if(!scored.length)return{match:null,exact:false,ambiguous:false};
  const top=scored.filter(s=>best-s.dice<0.15);
  if(top.length===1)return{match:top[0].e,exact:false,ambiguous:false};
  const lastLogged=(id)=>{
    for(let i=(S.logs||[]).length-1;i>=0;i--){
      const l=S.logs[i];
      if((l.exercises||[]).some(x=>(EX_ID_ALIASES[x.id]||x.id)===id))return i;
    }
    return-1;
  };
  top.sort((a,b)=>{
    const la=lastLogged(a.e.id),lb=lastLogged(b.e.id);
    if(la!==lb)return lb-la;          // logged, and more recently, wins
    return a.idx-b.idx;               // else EX order — the generator's own default
  });
  return{match:top[0].e,exact:false,ambiguous:true};
}

// Match each parsed row against the exercise database and report what happened, so
// the review screen can be honest about which rows the app recognised and which it
// is taking on trust as a new movement.
function resolveImportRows(parsed){
  return parsed.rows.map(r=>{
    const{match,exact,ambiguous}=resolveImportName(r.name);
    return{...r,
      exId:match?match.id:null,
      synthId:match?null:('custom_'+slugId(r.name)),
      matchedName:match?match.name:null,
      // Surfaced so the review panel can say WHICH variant it picked for an
      // ambiguous name — "Lateral Raise" becoming DB Lateral Raise is a decision
      // worth showing, not one to make quietly.
      ambiguous:!!ambiguous,
      exact:!!exact};
  });
}

function customSessionInit(seed){
  const base=customSessionDefaults();
  S.csImport=null;
  S.customSession=Object.assign({name:'',exercises:[],templateId:null,structure:'straight'},base,seed||{});
  return S.customSession;
}

// Pull live input values into state before any re-render — same guard, and same
// reason, as harvestCustomInputs on the logging form: a render triggered while the
// keyboard is still open (tapping "+ Add") otherwise wipes the row being typed.
function customHarvest(){
  const d=S.customSession;if(!d)return;
  const g=id=>document.getElementById(id);
  const nm=g('cs-session-name');if(nm)d.name=nm.value;
  (d.exercises||[]).forEach((row,i)=>{
    const n=g('cs-name-'+i);if(n&&n.value!=='')row.name=n.value;
    const s=g('cs-sets-'+i);if(s&&s.value!=='')row.sets=parseInt(s.value)||row.sets;
  });
}

// Builder autocomplete. Its own handlers rather than the logging form's, which
// mutate S.customWorkoutLog and write to that screen's element ids.
function csNameInput(idx,value){
  const d=S.customSession;if(!d||!d.exercises[idx])return;
  const row=d.exercises[idx];
  row.name=value;row.exId=null;row.synthId=null;
  const{match}=resolveEx(value);
  if(match)row.exId=match.id;else row.synthId='custom_'+slugId(value);
  const rx=document.getElementById('cs-rx-'+idx);
  if(rx)rx.innerHTML=customRowRxHTML(idx);
  csSuggest(idx,value);
}
// Encode a name for interpolation into a JS call inside a single-quoted HTML
// attribute. encodeURIComponent alone is NOT enough: it deliberately leaves the
// apostrophe unescaped, which is exactly the character that terminates the
// attribute and makes the suggestion silently unpickable. csPick decodes.
function csEncodeName(name){return encodeURIComponent(name||'').replace(/'/g,'%27');}
function csSuggest(idx,value){
  const box=document.getElementById('cs-suggest-'+idx);if(!box)return;
  const list=exSuggestList(value);
  if(!list.length){box.classList.remove('on');box.innerHTML='';return;}
  box.innerHTML=list.map(e=>
    `<div class='ex-suggest-item' onmousedown='csPick(${idx},&quot;${csEncodeName(e.name)}&quot;)'>`+
    `<span>${e.name}</span><span class='es-mus'>${MNAME[e.muscle]||e.muscle}</span></div>`).join('');
  box.classList.add('on');
}
function csPick(idx,name){
  const d=S.customSession;if(!d||!d.exercises[idx])return;
  try{name=decodeURIComponent(name);}catch(e){}
  customHarvest();
  csNameInput(idx,name);
  const box=document.getElementById('cs-suggest-'+idx);
  if(box){box.classList.remove('on');box.innerHTML='';}
  render();
}
function csHideSuggest(idx){
  setTimeout(()=>{const b=document.getElementById('cs-suggest-'+idx);if(b)b.classList.remove('on');},200);
}

// Turning the draft into a live session.
// Mirrors startWorkout's guards deliberately rather than calling it: startWorkout
// reads a PROGRAM day (make-up exercises, eveningSession, the preserved-session
// path), none of which applies to a hand-picked list. What must not diverge is the
// safety bookkeeping — the two-per-day cap, the second-session auto-regulation and
// the lunch set clamp — so those are the same calls in the same order.
function startCustomWorkout(){
  const d=S.customSession;
  if(!d)return;
  customHarvest();
  const rows=(d.exercises||[]).filter(r=>(r.name||'').trim());
  if(!rows.length){alert('Add at least one exercise first.');return;}

  const sessionsToday=liftingSessionsOn(todayStr());
  if(sessionsToday>=2){
    alert('Daily session limit: two lifting sessions are already logged today. Recovery beats more volume — go again tomorrow.');
    return;
  }

  let exs=rows.map(r=>{
    const p=customRowPlan(r,d);
    // Carry any EXPLICIT pair labels across with the row, before anything
    // reorders — flagFirstWorkingSet moves entries, so index alignment with
    // `rows` cannot be relied on after this point.
    const pair=r.pairId?{pairId:r.pairId,pairPos:r.pairPos||1}:{};
    return{...p.ex,...pair,sets:p.sets,sessionMins:d.mins};
  });

  // Order compounds first and flag the lift the acclimation ramp belongs on —
  // the same call buildSession makes, so a custom session opens on a loadable
  // movement the way a generated one does. It reorders in place.
  flagFirstWorkingSet(exs);
  // Structure, applied in the same order the generator applies it: pairing runs
  // AFTER the flag so the warm-up lift stays at index 0 and becomes A1. Hand-built
  // pairing ignores the Plan-screen toggle on purpose — you picked these movements
  // and asked for them paired, which is a more specific instruction than a mode.
  const structure=customStructure(d);
  if(structure==='paired'){
    // EXPLICIT pairing wins over the automatic rule. A card that pairs two leg
    // movements (Sam's do) is a deliberate instruction about this session, and
    // pairSession would refuse it — it declines same-muscle pairs because as an
    // AUTOMATIC choice that just stacks fatigue on the day's anchor. Told exactly
    // what to pair, the app should do exactly that; the safety rule exists to
    // govern what the app picks on its own, not to overrule what it was handed.
    // Labels are already on the exercises (carried in the map above), so an
    // explicit import just keeps them; only an unlabelled list gets auto-paired.
    if(!exs.some(e=>e.pairId))pairSession(exs);
    else pairSortAdjacent(exs);
  }

  // Lunch time-box clamp, identical to startWorkout's: lead lift keeps 3 working
  // sets, everything after it drops to 2.
  if(d.isLunch)exs=exs.map((e,i)=>i>0&&e.sets>2?{...e,sets:2}:e);

  let autoRegNotes=[];
  if(sessionsToday===1){
    const reg=applyDailyAutoReg(exs);
    exs=reg.exs;autoRegNotes=reg.notes;
    if(!exs.length){
      alert("Today's earlier session already used the volume budget for every muscle in this workout. Session blocked — recover and hit it tomorrow.");
      return;
    }
  }

  S.active={
    dayName:(d.name||'').trim()||'Custom Session',
    dow:todayDow(),startTime:Date.now(),isLunch:!!d.isLunch,
    sessionMins:d.mins,loc:EQUIPMENT_PRESETS[d.equipmentKey]?.location||'ymca',
    equipmentKey:d.equipmentKey,restCap:d.isLunch?90:null,exIdx:0,
    autoRegNotes,isCustomSession:true,
    // EMOM is a clock, not a volume change — see CUSTOM_STRUCTURES. The workout
    // screen reads these two to swap the rest timer for a minute count.
    emom:structure==='emom',emomMins:structure==='emom'?emomMinutes(rows):0,
    exercises:exs.map(e=>({...e,done:[],estW:estimateStartingWeight(e.id,S.logs,MOVEMENT_CLASS)})),
  };
  S.customSession=null;
  S.view='workout';save();render();
}

// Templates.
// Stored as NAMES + set counts, not as frozen exercise objects. A template loaded
// six weeks from now should be re-resolved against the current database and the
// current history, so it picks up a renamed movement, a changed rep range, and —
// the point of the feature — a starting weight that reflects the intervening
// training. Freezing the resolved objects would hand back a stale prescription.
function customTemplates(){return (S.customTemplates||[]).filter(t=>t&&!t.deleted);}
function saveCustomTemplate(){
  const d=S.customSession;if(!d)return;
  customHarvest();
  const rows=(d.exercises||[]).filter(r=>(r.name||'').trim());
  if(!rows.length){alert('Add at least one exercise before saving a template.');return;}
  const suggested=(d.name||'').trim()||rows.map(r=>r.name).slice(0,2).join(' + ');
  const name=(prompt('Name this template:',suggested)||'').trim();
  if(!name)return;
  S.customTemplates=S.customTemplates||[];
  const payload={
    name,mins:d.mins,isLunch:!!d.isLunch,equipmentKey:d.equipmentKey,structure:customStructure(d),
    exercises:rows.map(r=>({name:r.name,exId:r.exId||null,sets:r.sets||CUSTOM_SESSION_DEFAULT_SETS,noWeight:!!r.noWeight})),
    editedAt:new Date().toISOString(),deleted:false,
  };
  // Re-saving a loaded template updates it in place; the edit stamp is what lets
  // that survive the cloud union (see pickNewerEdit — a plain union would keep
  // the cloud's older copy of this id and the rename would silently revert).
  const existing=d.templateId?S.customTemplates.find(t=>t.id===d.templateId):null;
  if(existing)Object.assign(existing,payload);
  else{
    const t=Object.assign({id:'tpl_'+Date.now().toString(36),createdAt:new Date().toISOString()},payload);
    S.customTemplates.push(t);d.templateId=t.id;
  }
  d.name=name;save();render();
}
function loadCustomTemplate(id){
  const t=(S.customTemplates||[]).find(x=>x.id===id&&!x.deleted);
  if(!t)return;
  const base=customSessionDefaults();
  S.customSession={
    name:t.name,templateId:t.id,
    structure:t.structure||'straight',
    dow:base.dow,
    mins:t.mins||base.mins,
    isLunch:!!t.isLunch,
    equipmentKey:t.equipmentKey||base.equipmentKey,
    exercises:(t.exercises||[]).map(e=>({
      name:e.name,exId:e.exId||null,synthId:e.exId?null:'custom_'+slugId(e.name),
      sets:e.sets||CUSTOM_SESSION_DEFAULT_SETS,noWeight:!!e.noWeight})),
  };
  S.view='custom-session';save();render();
}
// TOMBSTONE, never splice. unionById reconciles by id and would resurrect a
// spliced template from the cloud copy on the next sync — the same rule the
// century draft and the log edits document: a merge that can't express DELETION
// can't merge a list with a delete button.
function deleteCustomTemplate(id){
  const t=(S.customTemplates||[]).find(x=>x.id===id);
  if(!t)return;
  t.deleted=true;t.editedAt=new Date().toISOString();
  if(S.customSession&&S.customSession.templateId===id)S.customSession.templateId=null;
  save();render();
}

// ─────────────────────────────────────────────
// RENDER – CUSTOM SESSION BUILDER
// ─────────────────────────────────────────────
// The prescription line for one row. Split out because csNameInput used to patch
// it in place on every keystroke; it re-renders the whole row now (the estimate
// depends on the resolved movement, not just its name), but keeping it a function
// means the row markup below stays readable.
function customRowRxHTML(idx){
  const d=S.customSession;
  const row=d.exercises[idx];
  if(!(row.name||'').trim())return `<div style='font-size:12px;color:var(--mut)'>Start typing — the app fills in sets, reps and a starting weight.</div>`;
  const p=customRowPlan(row,d);
  const mcolor=MCOL[p.ex.muscle]||'var(--acc)';
  // What the weight line says, in the same order of preference the workout screen
  // itself resolves: your own last session first, then the estimation engine, and
  // an explicit "no external load" for bodyweight work so a blank isn't ambiguous.
  const wLine=!p.loaded
    ? `<span style='color:var(--mut)'>bodyweight — no external load</span>`
    : p.prog
      ? `<strong style='color:var(--acc)'>${p.prog.suggest} ${p.unit}</strong> <span style='color:var(--mut)'>· last time ${p.prog.summary}</span>`
      : p.est
        ? `<strong style='color:var(--acc)'>~${p.est.weight} ${p.unit}</strong> <span style='color:var(--mut)'>· ${p.est.confidence} confidence, ${estBasisLabel(p.est)}</span>`
        : `<span style='color:var(--mut)'>enter a weight on set one</span>`;
  const warns=p.warnings.map(w=>`<div style='font-size:11px;color:var(--warn);line-height:1.5;margin-top:4px'>${w.icon} ${w.msg}</div>`).join('');
  return `<div style='display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:4px'>
      <span class='m-tag' style='background:${mcolor}22;color:${mcolor};border:1px solid ${mcolor}44;font-size:10px;padding:2px 6px'>${MNAME[p.ex.muscle]||p.ex.muscle}</span>
      <span style='font-size:12px;color:var(--mut)'>${p.matched?`&#10003; ${p.ex.name}`:'new movement &middot; tracked on its own'}</span>
    </div>
    <div style='font-size:13px;line-height:1.6'><strong>${p.sets} &times; ${p.repLbl}</strong> &middot; ${wLine}</div>
    ${warns}`;
}

// Runs the whole pipeline and drops the result into the open builder. Never starts
// the session: the rows land in the editor, and Sam reviews them. S.csImport holds
// the progress/summary state so the builder can report what happened.
async function runWorkoutImport(file){
  if(!file)return;
  if(!S.customSession)customSessionInit();
  S.csImport={busy:true,msg:'Reading the workout…',pct:0,err:null,summary:null};
  render();
  try{
    const text=await ocrWorkoutImage(file,(msg,pct)=>{
      S.csImport={...S.csImport,msg,pct:Math.round((pct||0)*100)};
      const el=document.getElementById('cs-import-status');
      if(el)el.textContent=S.csImport.pct?`${msg} ${S.csImport.pct}%`:msg;
    });
    const parsed=parseWorkoutText(text);
    const rows=resolveImportRows(parsed);
    if(!rows.length){
      S.csImport={busy:false,msg:'',pct:0,summary:null,
        err:"Couldn't find any exercises in that image. A tighter crop around the exercise list usually fixes it — or add them by hand below."};
      render();return;
    }
    const d=S.customSession;
    // REPLACES the list rather than appending. Importing a card is "run this
    // workout", not "add these to what I already picked" — and an append would
    // silently double a list if the image is scanned twice.
    d.exercises=rows.map(r=>({
      name:r.matchedName||r.name,
      exId:r.exId,synthId:r.synthId,
      sets:r.sets||CUSTOM_SESSION_DEFAULT_SETS,
      rMin:r.rMin,rMax:r.rMax,
      pairId:r.pairId||null,pairPos:r.pairPos||null,
      noWeight:false,
    }));
    d.structure=parsed.structure;
    if(parsed.structure==='emom'&&parsed.emomMins)d.emomHint=parsed.emomMins;
    S.csImport={busy:false,msg:'',pct:0,err:null,summary:{
      count:rows.length,
      matched:rows.filter(r=>r.exId).length,
      structure:parsed.structure,
      emomMins:parsed.emomMins,
      unmatched:rows.filter(r=>!r.exId).map(r=>r.name),
      guessed:rows.filter(r=>r.ambiguous&&r.matchedName).map(r=>`${r.name} → ${r.matchedName}`),
      notes:parsed.notes.slice(0,4),
      skipped:parsed.skipped.slice(0,4),
    }};
    save();render();
  }catch(e){
    S.csImport={busy:false,msg:'',pct:0,summary:null,err:(e&&e.message)||'Could not read that image.'};
    render();
  }
}

// The import card in the builder: the button, the progress line, and — after a
// run — a plain account of what was read. The unmatched list is the important
// part: those rows still work (they become one-off movements with an estimated
// opener), but Sam should know which ones the app didn't recognise.

  if(st.busy){

  const structLbl=sum?({paired:'A1/A2 pairs',emom:'EMOM',straight:'straight sets'}[sum.structure]||sum.structure):'';
  return`<div class='card' style='margin-bottom:16px'>
    <div style='display:flex;align-items:center;gap:8px'>

    </div>

    ${st.err?`<div style='font-size:12px;color:var(--warn);margin-top:8px;line-height:1.6'>&#9888;&#65039; ${st.err}</div>`:''}
    ${sum?`<div style='font-size:12px;color:var(--mut);margin-top:8px;line-height:1.7'>
      &#9989; Read <strong style='color:var(--txt)'>${sum.count} exercise${sum.count===1?'':'s'}</strong> as <strong style='color:var(--txt)'>${structLbl}</strong>${sum.emomMins?` (${sum.emomMins} min)`:''}. ${sum.matched} matched your exercise database${sum.matched<sum.count?`; ${sum.count-sum.matched} came through as new movements`:''}.
      ${sum.unmatched.length?`<div style='margin-top:4px'>&#129520; Not recognised: <strong style='color:var(--txt)'>${sum.unmatched.join(', ')}</strong> — these still run, with a conservative opener. Retype one to match it to a movement you have history for.</div>`:''}
      ${sum.guessed&&sum.guessed.length?`<div style='margin-top:4px'>&#128260; Ambiguous names, resolved to what you've trained most recently: <strong style='color:var(--txt)'>${sum.guessed.join(', ')}</strong>. Change any of them below.</div>`:''}
      ${sum.skipped.length?`<div style='margin-top:4px;opacity:.8'>Skipped as text: ${sum.skipped.join(' · ')}</div>`:''}
      <div style='margin-top:4px'>Check the rows below before you start &mdash; OCR misreads things.</div>
    </div>`:''}

function renderProgram(){
  const dow=todayDow();
  const cardio=calcWeekCardio();
  const missed=getMissedDays();
  const completedDows=getCompletedDows();
  const cardioBlurb=cardio&&cardio.calsPerDay>0
    ?cardio.options.slice(0,3).map(o=>`${o.icon} ${o.name}: ${o.min} min${o.dist&&o.dist!=='—'?' · '+o.dist:''}`).join(' · ')
    :'';

  const exRow=e=>`<div class='pg-ex'><div class='pg-dot' style='background:${MCOL[e.muscle]}'></div>${e.name} <span style='color:var(--mut);font-size:12px'>· ${e.sets}×${e.rMin}–${e.rMax}${e.isTimed?'s':''}</span></div>`;

  const days=S.program.week.map(d=>{
    const isToday=d.dow===dow;
    const isCompleted=completedDows.has(d.dow);
    // Loaded BEFORE the rest/skip check — a full regeneration can mark this
    // dow as rest even though it was actually trained; the log is unaffected
    // by that and remains the source of truth for whether/what was done.
    const loggedSess=isCompleted?getLoggedSessionForDow(d.dow):null;
    const isSkipped=!d.rest&&!isCompleted&&isDaySkipped(d.dow);
    const isMissed=!d.rest&&!isSkipped&&!isCompleted&&missed.includes(d.dow);
    if((d.rest||isSkipped)&&!loggedSess){
      if(d.dow===0||d.dow===6)return''; // skip weekend rest rows
      let cn='';
      if(cardio&&cardio.calsPerDay>0&&!isSkipped){
        cn=`<div style='margin-top:8px;padding-top:8px;border-top:1px solid var(--bdr)'>
          <div style='font-size:11px;color:var(--warn);font-weight:700;margin-bottom:4px'>+ Daily Cardio · ${cardio.calsPerDay} cal</div>

      </div>`;
    }
    // The plan's own view of this dow — null when the (possibly regenerated)
    // program disagrees with what was actually logged (marks it rest). All

    const dd=(d&&!d.rest)?d:null;
    const badge=dd?.isLunch?`<span class='badge badge-lunch'>YMCA · 35–40 min</span>`:`<span class='badge badge-eve'>${dd?.sessionMins||60} min</span>`;
    const missedTag=isMissed?`<span style='font-size:11px;color:var(--bad);font-weight:700;margin-left:6px'>⚠️ missed</span>`:'';
    const completedTag=isCompleted?`<span style='font-size:11px;color:var(--ok);font-weight:700;margin-left:6px'>✓ completed</span>`:'';
    // Completed days display the actual logged session, not the planned template.
    const exList=loggedSess?loggedExRows(loggedSess):(dd?.exercises||[]).map(exRow).join('');
    let eveBlock='';
    if(dd?.eveningSession){
      const eveList=dd.eveningSession.exercises.map(exRow).join('');
      eveBlock=`<div style='margin-top:12px;padding-top:12px;border-top:1px solid var(--bdr)'>
        <div style='font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--acc);margin-bottom:6px'>After Work · ${dd.eveningSession.name} · ${dd.eveningSession.mins} min</div>
        ${eveList}
      </div>`;
    }
    let cn='';
    if(cardio&&cardio.calsPerDay>0){
      cn=`<div style='margin-top:8px;padding-top:8px;border-top:1px solid var(--bdr)'>
        <div style='font-size:11px;color:var(--warn);font-weight:700;margin-bottom:4px'>+ Daily Cardio · ${cardio.calsPerDay} cal</div>
        <div style='font-size:11px;color:var(--mut)'>${cardioBlurb}</div>
      </div>`;
    }
    return`<div class='pg-day${isToday?' today-day':''}${isMissed?' pg-missed':''}${isCompleted?' pg-done':''}'>
      <div class='pg-dh'>
        <div><div class='pg-dn' style='display:flex;align-items:center;gap:4px;flex-wrap:wrap'>${loggedSess?loggedSess.dayName:(dd?.name||DOW[d.dow])}${completedTag}${missedTag} ${badge}</div><div class='pg-dd'>${DOW[d.dow]}</div></div>
        ${isToday?`<span style='font-size:11px;font-weight:700;color:var(--acc);background:var(--acc2);padding:3px 8px;border-radius:20px'>TODAY</span>`:''}
      </div>
      <div>${exList}</div>
      ${eveBlock}
      ${cn}
    </div>`;
  }).join('');

  const calSummary=cardio?`<div class='card' style='margin-bottom:16px'>
    <div class='sec-lbl'>Calorie Plan</div>
    ${cardio.cardioCalsNeeded<=0
      ?`<div class='prog-hint'>✅ Strength covers your goal</div>`
      :`<div style='font-size:13px;color:var(--mut)'>Strength ~${cardio.strengthCals} cal · Need ${cardio.cardioCalsNeeded} more from cardio · ${cardio.calsPerDay} cal/day · ${cardio.daysLeft} days left</div>`}
  </div>`:'';

  return`<div class='view rag v-program'>
    <div class='hdg'>Weekly Program</div>
    <div class='sub'>Every movement for the week. Combo days show both the lunch and after-work sessions. Skipped days show as rest. Missed days shown in red. Set your goal and plan from the Home tab.</div>
    <button class='btn btn-g btn-sm' data-action='build-custom-session' style='width:100%;margin-bottom:16px'>&#128296; Build My Own Workout</button>

  </div>${renderNav('program')}`;

// Pull whatever is currently typed in the Edit Workout inputs back into the
// draft. Must run before ANY re-render of the log-edit view (add/remove
// exercise), not just on save — render() rebuilds the inputs from the draft,
// so unsynced typing would silently reset to the draft's stored values.
function syncLogEditInputs(){
  const log=S.editLogDraft;if(!log)return;
  // Timing: adopt the start/finish pair only when it's coherent. An impossible
  // pair (finish before start, a mistyped year) leaves the draft on its previous
  // values rather than being clamped into a garbage duration — the live readout
  // flags it, and save-log-edit refuses to save until it's fixed.
  const s=fromLocalInputValue(document.getElementById('el-start')?.value||'');
  const f=fromLocalInputValue(document.getElementById('el-finish')?.value||'');
  if(s&&f){
    const m=minsBetween(s,f);
    if(m>=1&&m<=MAX_LOGGED_MINS){
      log.date=f;log.duration=m;
      // A century's `duration` and its `timedMins` are the same measurement seen
      // twice, and only timedMins reaches centuryMins() → the lunch budget. If
      // the editor moved one without the other, fixing a mis-timed century here
      // would LOOK fixed in History and change nothing about the schedule.
      // Only for an already-timed century: a deliberately untimed one (0) stays
      // untimed, since editing the clock doesn't turn a guess into a measurement.
      if(log.century&&log.timedMins>0)log.timedMins=m;
    }
  }
  log.exercises.forEach((ex,ei)=>{
    const isNW=ex.noWeight||EX.find(e=>e.id===ex.id)?.noWeight;
    (ex.sets||[]).forEach((s,si)=>{
      if(!isNW){const wEl=document.getElementById(`el-w-${ei}-${si}`);if(wEl)s.weight=parseFloat(wEl.value)||0;}
      const rEl=document.getElementById(`el-r-${ei}-${si}`);if(rEl)s.reps=parseInt(rEl.value)||0;
    });
  });
}

// Live duration readout under the start/finish pair — duration is no longer typed,
// so this is the only feedback that the two ends actually make sense together.
function updateLogEditDur(){
  const out=document.getElementById('el-dur-out');if(!out)return;
  const err=logEditTimingError();
  if(err){out.textContent='⚠️ '+err;out.style.color='var(--bad)';return;}
  const m=minsBetween(fromLocalInputValue(document.getElementById('el-start').value),
                      fromLocalInputValue(document.getElementById('el-finish').value));
  out.textContent='Duration: '+fmtDur(m);out.style.color='var(--ok)';
}
// Returns a human-readable problem with the timing inputs, or null when they're
// usable. Shared by the live readout and the save gate so they can't disagree.
function logEditTimingError(){
  const sEl=document.getElementById('el-start'),fEl=document.getElementById('el-finish');
  if(!sEl||!fEl)return null;// timing card not mounted (e.g. called before render)
  const s=fromLocalInputValue(sEl.value),f=fromLocalInputValue(fEl.value);
  if(!s||!f)return'Enter both a start and a finish time.';
  const m=minsBetween(s,f);
  if(m<1)return'The finish time is at or before the start time.';
  if(m>MAX_LOGGED_MINS)return'That works out to over 24 hours — check the dates.';
  return null;
}

function pickNewLogExSuggest(name){

  return`<div class='view rag v-history'>

// ─────────────────────────────────────────────
// CUSTOM WORKOUT HELPERS
// ─────────────────────────────────────────────
function updateCustomExercise(idx, field, value) {
  if (!S.customWorkoutLog || !S.customWorkoutLog.exercises[idx]) return;
  S.customWorkoutLog.exercises[idx][field] = value;
  // Don't save yet, just update state
}

// Find an exact database (or custom) exercise match for a typed name.
function exMatch(name) {
  if (!name || !name.trim()) return null;
  const allEx = [...EX, ...(S.customExercises||[])];
  return allEx.find(e => e.name.toLowerCase() === name.toLowerCase().trim()) || null;
}

// Common abbreviations / synonyms expanded so "BB Bench" → "barbell bench" etc.
const EX_ABBR = {
  bb:'barbell', db:'dumbbell', kb:'kettlebell', ohp:'overhead press',
  rdl:'romanian deadlift', sldl:'romanian deadlift', bw:'bodyweight',
  ext:'extension', lat:'lateral', pull:'pullup', chin:'chinup',
  sa:'single arm', sl:'single leg'
};

// Normalize an exercise name into a list of comparable tokens.
function exTokens(s) {
  if (!s) return [];
  let t = s.toLowerCase().trim().replace(/[^a-z0-9\s]/g, ' ');
  // Canonicalize "X up" compounds so "situps", "sit ups" and "sit-ups" all
  // converge to one token — same for push/pull/chin/step/lay/leg up(s).
  t = t.replace(/\b(push|pull|sit|chin|step|lay|leg|hand|knee)\s+ups?\b/g, '$1up');
  let tokens = t.split(/\s+/).filter(Boolean).map(w => EX_ABBR[w] || w);
  tokens = tokens.join(' ').split(/\s+/).filter(Boolean);
  // crude singularize so "curls"/"squats"/"press" compare consistently
  tokens = tokens.map(w => (w.length > 3 && w.endsWith('s')) ? w.slice(0, -1) : w);
  return tokens;
}

// Fuzzy-match a typed name to the closest database exercise. Returns the best
// candidate only when it's a clear winner, to avoid linking ambiguous names.
function fuzzyMatchEx(name) {
  const inputTokens = exTokens(name);
  if (!inputTokens.length) return null;
  const inputSet = new Set(inputTokens);
  const allEx = [...EX, ...(S.customExercises||[])];
  const scored = [];
  allEx.forEach(e => {
    const exSet = new Set(exTokens(e.name));
    let overlap = 0;
    inputSet.forEach(tk => { if (exSet.has(tk)) overlap++; });
    if (!overlap) return;
    const dice = (2 * overlap) / (inputSet.size + exSet.size);
    const coverage = overlap / inputSet.size; // how much of what they typed is covered
    if (coverage >= 0.6) scored.push({ e, score: dice });
  });
  if (!scored.length) return null;
  scored.sort((a, b) => b.score - a.score);
  const top = scored[0];
  const second = scored[1];
  // Require a decent score and a clear winner (not a near-tie / ambiguous)
  if (top.score >= 0.5 && (!second || top.score - second.score >= 0.15)) return top.e;
  return null;
}

// Resolve a typed name to a database exercise: exact first, then fuzzy.
function resolveEx(name) {
  const exact = exMatch(name);
  if (exact) return { match: exact, exact: true };
  const fuzzy = fuzzyMatchEx(name);
  if (fuzzy) return { match: fuzzy, exact: false };
  return { match: null, exact: false };
}

// Identify the muscle group for an exercise name: matched exercise first,
// then keyword-based estimation as a fallback.
function detectMuscle(name) {
  if (!name || !name.trim()) return 'legs';
  const { match } = resolveEx(name);
  if (match) return match.muscle;
  return estimateMuscleGroup(name);
}

// Read-only line showing the auto-detected muscle group for the typed exercise.
function muscleDispHtml(name) {
  if (!name || !name.trim()) return `<span style="color:var(--mut)">Muscle group auto-detects from the exercise</span>`;
  const m = detectMuscle(name);
  const color = MCOL[m] || 'var(--acc)';
  return `<span style="color:var(--mut)">Targets <strong style="color:${color}">${MNAME[m]||m}</strong> · auto-detected</span>`;
}

// Message shown under the name field: confirms whether this entry is linked to a
// known exercise (so its weights feed the 4% progression history) or is brand new.
function matchInfoHtml(name) {
  const { match, exact } = resolveEx(name);
  if (match && exact) return `<span style="color:var(--ok)">✓ Linked to <strong>${match.name}</strong> — weights feed your 4% progression</span>`;
  if (match) return `<span style="color:var(--ok)">✓ Matched to <strong>${match.name}</strong> — weights feed your 4% progression</span>`;
  if (name && name.trim()) return `<span style="color:var(--mut)">New exercise — tracked on its own</span>`;
  return '';
}

// Live handler as the user types an exercise name — keeps the muscle dropdown in
// sync (unless they've manually overridden it) without re-rendering / losing focus.
function onCustomNameInput(idx, value) {
  if (!S.customWorkoutLog || !S.customWorkoutLog.exercises[idx]) return;
  const ex = S.customWorkoutLog.exercises[idx];
  ex.name = value;
  ex.muscle = detectMuscle(value); // always auto-detect from the exercise
  // Live-update the muscle-group line and the database-link indicator
  const dEl = document.getElementById('cust-musc-disp-' + idx);
  if (dEl) dEl.innerHTML = muscleDispHtml(value);
  const mEl = document.getElementById('cust-match-' + idx);
  if (mEl) mEl.innerHTML = matchInfoHtml(value);
  // Refresh the suggestions dropdown
  renderExSuggest(idx, value);
}

// Build the ranked list of exercise suggestions for what the user has typed.
function exSuggestList(value) {
  const all = [...EX, ...(S.customExercises||[])];
  const q = (value || '').toLowerCase().trim();
  if (!q) return all.slice(0, 8); // show a starter list when empty
  const qTokens = exTokens(value);
  const scored = all.map(e => {
    const name = e.name.toLowerCase();
    const exT = new Set(exTokens(e.name));
    let score = 0;
    if (name.includes(q)) score += 2;
    if (name.startsWith(q)) score += 1;
    qTokens.forEach(t => { if (exT.has(t)) score += 1; });
    return { e, score };
  }).filter(x => x.score > 0);
  scored.sort((a, b) => b.score - a.score);
  return scored.slice(0, 8).map(x => x.e);
}

// Render the dropdown of exercise suggestions under a row's name field.
function renderExSuggest(idx, value) {
  const box = document.getElementById('ex-suggest-' + idx);
  if (!box) return;
  const list = exSuggestList(value);
  if (!list.length) { box.classList.remove('on'); box.innerHTML = ''; return; }
  box.innerHTML = list.map(e =>
    `<div class='ex-suggest-item' data-name="${e.name.replace(/"/g,'&quot;')}" onpointerdown='pickExSuggest(${idx}, this.dataset.name)'>
       <span>${e.name}</span><span class='es-mus'>${MNAME[e.muscle]||''}</span>
     </div>`
  ).join('');
  box.classList.add('on');
}

// User tapped a suggestion — fill the field, sync muscle + link indicator.
function pickExSuggest(idx, name) {
  if (!S.customWorkoutLog || !S.customWorkoutLog.exercises[idx]) return;
  const ex = S.customWorkoutLog.exercises[idx];
  ex.name = name;
  ex.muscle = detectMuscle(name); // always auto-detect from the exercise
  const inp = document.getElementById('cust-name-' + idx);
  if (inp) inp.value = name;
  const dEl = document.getElementById('cust-musc-disp-' + idx);
  if (dEl) dEl.innerHTML = muscleDispHtml(name);
  const mEl = document.getElementById('cust-match-' + idx);
  if (mEl) mEl.innerHTML = matchInfoHtml(name);
  const box = document.getElementById('ex-suggest-' + idx);
  if (box) { box.classList.remove('on'); box.innerHTML = ''; }
}

// Hide the dropdown on blur (delayed so a tap on a suggestion registers first).
function hideExSuggest(idx) {
  setTimeout(() => {
    const box = document.getElementById('ex-suggest-' + idx);
    if (box) box.classList.remove('on');
  }, 200);
}

// Pull the live DOM values into state before any re-render. The inputs also
// commit per keystroke (oninput), but this guards the case where a render is
// triggered before an input event lands (e.g. tapping "+ Add Exercise" with
// the keyboard still open) — previously that wiped unsaved weights/reps.
function harvestCustomInputs() {
  if (!S.customWorkoutLog || !S.customWorkoutLog.exercises) return;
  S.customWorkoutLog.exercises.forEach((ex, idx) => {
    const g = id => document.getElementById(id);
    const n = g('cust-name-' + idx);   if (n && n.value !== '') ex.name = n.value;
    const s = g('cust-sets-' + idx);   if (s && s.value !== '') ex.sets = parseInt(s.value) || ex.sets;
    const r = g('cust-reps-' + idx);   if (r && r.value !== '') ex.reps = parseInt(r.value) || ex.reps;
    const w = g('cust-weight-' + idx); if (w && w.value !== '') ex.weight = parseFloat(w.value) || 0;
  });
}

function removeCustomExercise(idx) {
  if (!S.customWorkoutLog || !S.customWorkoutLog.exercises) return;
  harvestCustomInputs();
  S.customWorkoutLog.exercises.splice(idx, 1);
  render();
}

function addCustomExerciseRow() {
  if (!S.customWorkoutLog) return;
  if (!S.customWorkoutLog.exercises) S.customWorkoutLog.exercises = [];
  harvestCustomInputs();
  S.customWorkoutLog.exercises.push({name: '', sets: 3, reps: 10, weight: 0});

function estimateMuscleGroup(exerciseName) {
  const name = exerciseName.toLowerCase();

  // Chest keywords
  if (name.includes('push') || name.includes('bench') || name.includes('chest') || name.includes('fly')) {
    return 'chest';
  }
  // Back keywords
  if (name.includes('pull') || name.includes('row') || name.includes('lat') || name.includes('back')) {
    return 'back';
  }
  // Shoulders
  if (name.includes('shoulder') || name.includes('press') || name.includes('raise') || name.includes('overhead')) {
    return 'shoulders';
  }
  // Legs
  if (name.includes('squat') || name.includes('lunge') || name.includes('leg') || name.includes('quad') || name.includes('glute')) {
    return 'legs';
  }
  // Arms
  if (name.includes('curl') || name.includes('bicep')) {
    return 'biceps';
  }
  if (name.includes('tricep') || name.includes('dip') || name.includes('extension')) {
    return 'triceps';
  }
  // Core/full body
  if (name.includes('burpee') || name.includes('plank') || name.includes('core') || name.includes('run')) {
    return 'core';
  }

  // Default to legs for compound movements
  return 'legs';
}

function adaptWeekForCustomWorkout(customLog, customDow) {
  if (!S.program || !S.program.week || !S.weekPlan?.availability) return;

  // Calculate muscle group volumes from custom workout
  const customVolumes = {};
  customLog.exercises.forEach(ex => {
    const muscle = ex.muscle;
    const sets = ex.sets?.filter(s => s && s.reps > 0).length || 0;
    customVolumes[muscle] = (customVolumes[muscle] || 0) + sets;
  });

  // Store all existing custom workouts to preserve them
  const existingCustomWorkouts = {};
  S.program.week.forEach((day, dow) => {
    if (day && day.customWorkout && day.customLog) {
      existingCustomWorkouts[dow] = {
        customWorkout: true,
        customLog: day.customLog,
        name: day.name,
        desc: day.desc
      };
    }
  });

  // Update recent workouts to include ALL custom workout muscles for better adaptation
  const allCustomMuscles = new Set();
  Object.values(existingCustomWorkouts).forEach(cw => {
    cw.customLog.exercises.forEach(ex => allCustomMuscles.add(ex.muscle));
  });
  Object.keys(customVolumes).forEach(muscle => allCustomMuscles.add(muscle));

  const customMuscleList = Array.from(allCustomMuscles).map(m => MNAME[m]).join(', ');
  S.weekPlan.recentWorkouts = `Custom workouts this week: ${customMuscleList}`;

  // Completely regenerate the week program to adapt around ALL custom workouts
  S.program = genProgram(S.cfg, S.weekPlan.availability, S.logs);

  // Restore ALL custom workout days (including the new one)
  existingCustomWorkouts[customDow] = {
    customWorkout: true,
    customLog: customLog,
    name: 'Custom Workout',
    desc: `${customLog.exercises.length} exercises logged`
  };

  // Apply all custom workouts back to the regenerated program
  Object.entries(existingCustomWorkouts).forEach(([dow, customData]) => {
    const dayIndex = parseInt(dow);
    if (S.program.week[dayIndex]) {
      S.program.week[dayIndex] = {
        ...S.program.week[dayIndex],
        ...customData
      };
    }
  });
}

// Regenerate THIS week's program from full history without injecting a new day.
// Used when a session from the last few days is logged that fell in the PRIOR
// calendar week: it can't be placed on a current-week day, but it should still
// reshuffle the split order (via orderSplitByRecovery's recent-load weighting)
// so the freshest muscle groups lead the week. Preserves any custom / planned
// custom workout days already placed this week.
function replanCurrentWeek(){
  if(!S.program||!S.program.week||!S.weekPlan?.availability)return;
  const preserved={};
  S.program.week.forEach((day,dow)=>{
    if(day&&day.customWorkout&&day.customLog){
      preserved[dow]={customWorkout:true,customLog:day.customLog,name:day.name,desc:day.desc};
    }else if(day&&day.plannedCustomWorkout&&day.plannedCustomLog){
      preserved[dow]={plannedCustomWorkout:true,plannedCustomLog:day.plannedCustomLog,name:day.name,desc:day.desc};
    }
  });
  S.program=genProgram(S.cfg,S.weekPlan.availability,S.logs);
  Object.entries(preserved).forEach(([dow,data])=>{
    const i=parseInt(dow);
    if(S.program.week[i])S.program.week[i]={...S.program.week[i],...data};
  });
}

function planCustomWorkout(customLog, customDow) {
  if (!S.program || !S.program.week || !S.weekPlan?.availability) return;

  // Store all existing custom workouts and planned workouts to preserve them
  const existingWorkouts = {};
  S.program.week.forEach((day, dow) => {
    if (day && day.customWorkout && day.customLog) {
      existingWorkouts[dow] = {
        customWorkout: true,
        customLog: day.customLog,
        name: day.name,
        desc: day.desc
      };
    } else if (day && day.plannedCustomWorkout && day.plannedCustomLog) {
      existingWorkouts[dow] = {
        plannedCustomWorkout: true,
        plannedCustomLog: day.plannedCustomLog,
        name: day.name,
        desc: day.desc
      };
    }
  });

  // Add the new planned workout
  existingWorkouts[customDow] = {
    plannedCustomWorkout: true,
    plannedCustomLog: customLog,
    name: 'Planned Custom Workout',
    desc: `${customLog.exercises.length} exercises planned`
  };

  // Update recent workouts to include ALL custom/planned workout muscles for better adaptation
  const allCustomMuscles = new Set();
  Object.values(existingWorkouts).forEach(cw => {
    const log = cw.customLog || cw.plannedCustomLog;
    if (log) {
      log.exercises.forEach(ex => allCustomMuscles.add(ex.muscle));
    }
  });

  const customMuscleList = Array.from(allCustomMuscles).map(m => MNAME[m]).join(', ');
  S.weekPlan.recentWorkouts = `Custom/planned workouts this week: ${customMuscleList}`;

  // Completely regenerate the week program to adapt around ALL custom workouts
  S.program = genProgram(S.cfg, S.weekPlan.availability, S.logs);

  // Apply all custom/planned workouts back to the regenerated program
  Object.entries(existingWorkouts).forEach(([dow, workoutData]) => {
    const dayIndex = parseInt(dow);
    if (S.program.week[dayIndex]) {
      S.program.week[dayIndex] = {
        ...S.program.week[dayIndex],
        ...workoutData
      };
    }
  });
}

function rebalanceCustomWorkouts() {
  if (!S.program || !S.program.week || !S.weekPlan?.availability) return;

  // Collect all remaining custom and planned workouts to preserve them
  const existingWorkouts = {};
  S.program.week.forEach((day, dow) => {
    if (day && day.customWorkout && day.customLog) {
      existingWorkouts[dow] = {
        customWorkout: true,
        customLog: day.customLog,
        name: day.name,
        desc: day.desc
      };
    } else if (day && day.plannedCustomWorkout && day.plannedCustomLog) {
      existingWorkouts[dow] = {
        plannedCustomWorkout: true,
        plannedCustomLog: day.plannedCustomLog,
        name: day.name,
        desc: day.desc
      };
    }
  });

  // Rebuild recentWorkouts note from remaining workouts
  const allCustomMuscles = new Set();
  Object.values(existingWorkouts).forEach(cw => {
    const log = cw.customLog || cw.plannedCustomLog;
    if (log) log.exercises.forEach(ex => allCustomMuscles.add(ex.muscle));
  });
  if (allCustomMuscles.size > 0) {
    const customMuscleList = Array.from(allCustomMuscles).map(m => MNAME[m]).join(', ');
    S.weekPlan.recentWorkouts = `Custom/planned workouts this week: ${customMuscleList}`;
  } else {
    S.weekPlan.recentWorkouts = '';
  }

  // Regenerate the week and re-apply remaining custom/planned workouts
  S.program = genProgram(S.cfg, S.weekPlan.availability, S.logs);
  Object.entries(existingWorkouts).forEach(([dow, workoutData]) => {
    const dayIndex = parseInt(dow);
    if (S.program.week[dayIndex]) {
      S.program.week[dayIndex] = {
        ...S.program.week[dayIndex],
        ...workoutData
      };
    }
  });
}

function cancelPlannedWorkout(cancelDow) {
  if (!S.program || !S.program.week) return;

  // Remove the planned workout from the day
  if(S.program.week[cancelDow]) {
    delete S.program.week[cancelDow].plannedCustomWorkout;
    delete S.program.week[cancelDow].plannedCustomLog;
  }

  // Store all remaining custom workouts to preserve them
  const existingWorkouts = {};
  S.program.week.forEach((day, dow) => {
    if (day && day.customWorkout && day.customLog) {
      existingWorkouts[dow] = {
        customWorkout: true,
        customLog: day.customLog,
        name: day.name,
        desc: day.desc
      };
    } else if (day && day.plannedCustomWorkout && day.plannedCustomLog) {
      existingWorkouts[dow] = {
        plannedCustomWorkout: true,
        plannedCustomLog: day.plannedCustomLog,
        name: day.name,
        desc: day.desc
      };
    }
  });

  // Update recent workouts
  const allCustomMuscles = new Set();
  Object.values(existingWorkouts).forEach(cw => {
    const log = cw.customLog || cw.plannedCustomLog;
    if (log) {
      log.exercises.forEach(ex => allCustomMuscles.add(ex.muscle));
    }
  });

  if(allCustomMuscles.size > 0) {
    const customMuscleList = Array.from(allCustomMuscles).map(m => MNAME[m]).join(', ');
    S.weekPlan.recentWorkouts = `Custom/planned workouts this week: ${customMuscleList}`;
  } else {
    S.weekPlan.recentWorkouts = '';
  }

  // Regenerate the week program
  S.program = genProgram(S.cfg, S.weekPlan.availability, S.logs);

  // Restore remaining custom workouts
  Object.entries(existingWorkouts).forEach(([dow, workoutData]) => {
    const dayIndex = parseInt(dow);
    if (S.program.week[dayIndex]) {
      S.program.week[dayIndex] = {
        ...S.program.week[dayIndex],
        ...workoutData
      };
    }
  });

  save();
  render();
}

    else S.pushupLog[d]=S.cfg?.dailyPushups||0;

  }

    else S.pushupLog[t]=S.cfg?.dailyPushups||0;
    save();render();return;

  if(a==='log-sleep'){

  if(a==='open-log-cardio'){S.cardioLogDraft={activity:'walk',mins:30};render();return;}
  if(a==='cancel-log-cardio'){S.cardioLogDraft=null;render();return;}

    fbAuth.sendSignInLinkToEmail(email,{url:location.href,handleCodeInApp:true})

      .catch(e=>{alert('Error: '+e.message);btn.textContent='Send Link';btn.disabled=false;});

    if(navigator.clipboard?.writeText){
